#
# Docker-free solver environment, and the Windows path until `build.sh` runs
# natively under MSYS2 (plan section 4, phase 2).
#
#   micromamba create -y -n pse-solvers -f docker/solvers/conda/env.yml
#   micromamba activate pse-solvers
#   export IPOPT_DIR="$CONDA_PREFIX"            # "$CONDA_PREFIX/Library" on Windows
#   export PKG_CONFIG_PATH="$IPOPT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
#
# The Ipopt version is held equal to the container recipe on purpose: the
# governance test that compares `probe_host` output across platforms expects one
# Ipopt version for the whole project. conda-forge's MUMPS is NOT built
# --without-metis, so this environment is fine for linkage and API tests but not
# for trajectory-parity baselines (see README.md).
name: pse-solvers
channels:
  - conda-forge
dependencies:
  - ipopt=3.14.20
  - mumps-seq
  - ampl-asl
  - pkg-config
  - python=3.13
