# End-of-turn pipeline (scripts/after_turn.py, ADR-0143). Every step is a just recipe, and every
# step is automatic: the hooks run no `just hygiene` check and fix nothing. Keys before any [table].

# At stop, synchronously, in order.
sync = ["skills-sync", "agent-config-sync", "adr-index", "fmt"]
# In the background job; failed steps are shown to the operator (doctor exits 1 only on blocking
# problems; db-status fails on an unreachable store or a schema fingerprint mismatch).
ready = ["doctor", "db-status"]
# After the job, one run per burst of stops; nothing waits on them.
after = ["library-catalog"]
# Seconds before a hung step is killed.
step_timeout = 1800
