# cargo-nextest configuration. nextest does not run doctests: every gate pairs
# `cargo nextest run` with `cargo test --doc --workspace --locked`.

[test-groups]
# Ipopt + MUMPS solves are memory-heavy and spawn their own rayon/tokio threads
# (blueprint §18.8 thread budget).
solver = { max-threads = 2 }
# Serialize resource-intensive object-store and source-pipeline admission tests.
serial = { max-threads = 1 }
# Each engineering workflow has its own 32 GiB runtime ceiling and one worker.
engineering = { max-threads = 2 }

[profile.default]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "500ms"

[[profile.default.overrides]]
filter = 'package(pse-backend-native) | package(pse-tests-lifecycle) | test(/(^|::)solve_/)'
test-group = "solver"
threads-required = 2
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.default.overrides]]
# Actual commit, three execution modes, durable reopening and producer-refusal control
# took 148.035s with a 512 MiB, single-thread runtime (CI diagnostic, baseline zero).
# Changed-source commits, reuse and a fresh complete execution took 209.859s under
# the same limits. Keep the allowance scoped to these measured integration tests.
filter = 'package(pse-tests-engine) & (test(actual_p3_outputs_match_in_process_durable_and_uncached_execution) | test(changed_species_commit_invalidates_p3_and_matches_a_clean_complete_run))'
test-group = "serial"
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.default.overrides]]
# The target heater reached P10 after 293.374s (2026-09-15, ci/force-validation).
# Give complete heater/mixer graphs a diagnostic timeout, without a timing gate.
filter = 'package(pse-tests-engine) & binary(native_engineering_workflows)'
test-group = "engineering"
slow-timeout = { period = "300s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'package(pse-tests-engine) | package(pse-catalog) | test(/object_store/)'
test-group = "serial"

# CI: run everything, retry nothing. A flaky test is a red test.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 3, grace-period = "10s" }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

# Opt-in diagnostic only: `cargo nextest run --profile flaky-hunt -E 'test(name)'` answers
# "is this failure nondeterministic?"; it never launders a red test green.
[profile.flaky-hunt]
inherits = "ci"
retries = { backoff = "exponential", count = 3, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
