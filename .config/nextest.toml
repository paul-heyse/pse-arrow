# cargo-nextest configuration. nextest does not run doctests: every gate pairs
# `cargo nextest run` with `cargo test --doc --workspace --locked`.

[test-groups]
# Ipopt + MUMPS solves are memory-heavy and spawn their own rayon/tokio threads
# (blueprint §18.8 thread budget).
solver = { max-threads = 2 }
# Serialize resource-intensive object-store and source-pipeline admission tests.
serial = { max-threads = 1 }
# Each engineering workflow has its own 64 GiB ceiling and two workers.
# At most two such processes run together (128 GiB aggregate declared ceiling).
engineering = { max-threads = 4 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "500ms"

[[profile.default.overrides]]
filter = 'package(pse-backend-native) | package(pse-tests-lifecycle) | test(/(^|::)solve_/)'
test-group = "solver"
threads-required = 2
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.default.overrides]]
# Ordinary workflows consume two scheduler slots. Pure catalog/engine units use
# normal nextest scheduling; no package-wide serialization remains.
filter = 'package(pse-tests-engine) | package(pse-tests-conformance)'
test-group = "engineering"
threads-required = 2

[[profile.default.overrides]]
# These acceptances admit the scientific package closure before native execution.
filter = 'test(authored_vessel_fitting_preserves_shared_parameters_checks_and_identifiability) | test(authored_physical_nlp_preserves_native_routes_and_original_qualification) | test(acceptance::publication_resource::authored_publication_resource)'
slow-timeout = { period = "300s", terminate-after = 3 }

[[profile.default.overrides]]
# Global certification admits the package closure and then runs spatial branch-and-bound
# under its own solver deadline.
filter = 'test(/^acceptance::global_certification::/)'
slow-timeout = { period = "300s", terminate-after = 6 }

# CI: run everything, retry nothing. A flaky test is a red test.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 3, grace-period = "10s" }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

# Opt-in diagnostic only: `cargo nextest run --profile flaky-hunt -E 'test(name)'` answers
# "is this failure nondeterministic?"; it never launders a red test green.
[profile.flaky-hunt]
inherits = "ci"
retries = { backoff = "exponential", count = 3, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
