# cargo-nextest configuration. nextest does not run doctests: every gate pairs
# `cargo nextest run` with `cargo test --doc --workspace --locked`.

[test-groups]
# Ipopt + MUMPS solves are memory-heavy and spawn their own rayon/tokio threads
# (blueprint §18.8 thread budget).
solver = { max-threads = 2 }
# Each engineering workflow has its own 64 GiB ceiling and two workers.
# At most two such processes run together (128 GiB aggregate declared ceiling).
engineering = { max-threads = 4 }
# All canonical fixture consumers share the selected server, even with isolated databases.
# Each canonical fixture owns the server installation interval. Its internal
# concurrency still exercises readers and managed workers against the same database.
store = { max-threads = 4 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "500ms"

[[profile.default.overrides]]
filter = 'package(pse-runtime) & binary(worker)'
# One case owns the finite managed profile; its study can use both slots.
# Scheduler waiting precedes case execution and does not consume its deadline.
test-group = "store"
threads-required = 4

[[profile.default.overrides]]
# Tests using isolated canonical databases on the explicitly selected server.
filter = 'package(pse-operations) | (package(pse-runtime) & (test(workflow::) | test(math::) | binary(worker))) | (package(pse-tests-conformance) & test(acceptance::)) | (package(pse-tests-engine) & (binary(native_session_controls) | binary(pushdown_vs_unpruned)))'
test-group = "store"
threads-required = 4

[[profile.default.overrides]]
filter = '(package(pse-backend-native) & test(/^(kinsol|ipopt|uno|petsc|root_isolation|dynamics|highs|clarabel_tests|restart_tests|scip_tests|l1_tests|pounce_convex_tests|measurement_tests)::/)) | test(/(^|::)solve_/)'
test-group = "solver"
threads-required = 2
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.default.overrides]]
# Owned native engineering/result journeys consume two scheduler slots.
# Pure package tests use normal scheduling; only actual responsibility selectors apply.
filter = '(package(pse-runtime) & (test(workflow::) | test(math::))) | (package(pse-tests-conformance) & test(acceptance::)) | (package(pse-tests-engine) & (binary(native_session_controls) | binary(pushdown_vs_unpruned)))'
test-group = "engineering"
threads-required = 2

[[profile.default.overrides]]
# These acceptances admit the scientific package closure before native execution.
filter = 'test(authored_vessel_fitting_preserves_shared_parameters_checks_and_identifiability) | test(authored_physical_nlp_preserves_native_routes_and_original_qualification) | test(acceptance::connected_results_resource::authored_connected_results_resource)'
slow-timeout = { period = "300s", terminate-after = 3 }

[[profile.default.overrides]]
# This original scientific closure has untimed preparation followed by a bounded
# 1800-second derivative-condition and material-response job on one worker.
filter = 'test(original_pr_case_derivatives_satisfy_production_basis_conditions)'
test-group = "engineering"
threads-required = 2
slow-timeout = { period = "300s", terminate-after = 9 }

[[profile.default.overrides]]
# Global certification admits the package closure and then runs spatial branch-and-bound
# under its own solver deadline.
filter = 'test(/^acceptance::global_certification::/)'
slow-timeout = { period = "300s", terminate-after = 6 }

# Local scientific validation keeps the production task's own deadline. The
# runner reports slow tests without cutting off a declared 600-second solve at
# 120/360 seconds. A finite whole-run timeout still bounds broken orchestration.
[profile.local]
inherits = "default"
retries = 0
slow-timeout = "60s"
# The full native campaign serializes canonical server owners. Complete positive
# scientific journeys exceed the earlier two-hour allowance; this bounds the
# assembled campaign, while production jobs retain their own deadlines.
global-timeout = "4h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[[profile.local.overrides]]
filter = 'all()'
slow-timeout = "60s"

[profile.local.junit]
path = "junit.xml"
store-failure-output = true

# Explicit CI profile: run everything, retry nothing. Local validation uses local.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 3, grace-period = "10s" }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

# Opt-in diagnostic only: `cargo nextest run --profile flaky-hunt -E 'test(name)'` answers
# "is this failure nondeterministic?"; it never launders a red test green.
[profile.flaky-hunt]
inherits = "ci"
retries = { backoff = "exponential", count = 3, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
