# cargo-nextest configuration. nextest does not run doctests: every gate pairs
# `cargo nextest run` with `cargo test --doc --workspace --locked`.

[test-groups]
# Pool-owning solver, engineering and runtime cases share one budget. Each
# consumes both slots, so only one scientific process runs per observer.
# Unassigned pure tests retain the profile's parallel budget.
scientific = { max-threads = 2 }
# Canonical consumers on the one selected supervised server. Each fixture owns an
# isolated UUID database, so database-only tests share the server (threads-required 1);
# sixteen clients can share the server's four runtime threads. Tests that own
# server-wide resources or depend on sub-second timing take all sixteen slots.
store = { max-threads = 16 }

[profile.default]
# These public journeys require one externally placed four-GiB observer. The
# managed-native assessment partition selects them with --ignore-default-filter.
default-filter = "not test(managed_primary_)"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "500ms"
# Several agents share this machine; NEXTEST_TEST_THREADS or --test-threads override.
test-threads = 16
# Concise by default (Plan 29 P7): failures, slow tests and leaks print, passes do not;
# `--status-level pass` (or NEXTEST_STATUS_LEVEL=pass) shows every test.
status-level = "slow"
failure-output = "immediate-final"
success-output = "never"

# Canonical tests are scheduled by their effect on the shared server (Plan 29 D5).
# Group and threads-required each take the first matching override, so the exclusive
# and scientific classes precede the solver and database-only classes. Tests with no
# server use (for example `study_policy`, `math::strategy`, `workflow::diagnostics` and
# the `pse-tests-engine` session controls) have no group.

[[profile.default.overrides]]
# Exclusive among store tests:
# - The fixture-connection control observes the deployment database's existence.
# - Lease, deadline and polling controls assert sub-second windows (50/250 ms client
#   deadlines, 250-300 ms claims and fences, 1 s leases, 32 x 10 ms polls).
filter = """
(package(pse-operations) & (
    test(=testing::canonical_server_unit::fixture_connections_preserve_external_and_deployment_databases)
    | test(=canonical::canonical_server_unit::initialization_sixteen_independent_databases_complete_in_parallel)
    | test(=canonical_retention::canonical_server_unit::concurrent_protected_reads_and_lease_changes_retry_complete_transactions)
    | test(/^canonical::canonical_server_unit::(initialization_cancellation_cannot_establish_success|query_cancellation_cannot_establish_empty_success|initialization_uses_atomic_transition_client_for_complete_schema)$/)
    | test(=canonical_execution::canonical_execution_server_unit::canonical_execution_expiry_cancellation_and_truthful_recovery)
    | test(=canonical_retention::canonical_server_unit::expired_selection_cannot_read_or_resurrect_reclaimed_history)
    | test(=canonical_staging::canonical_server_unit::abandoned_blocks_reclaim_in_bounded_pages_and_permanent_identity_survives)
    | test(/^canonical_result_retention::canonical_result_retention_server_unit::(retired_results_respect_readers_resume_cleanup_and_preserve_receipts|result_read_and_retirement_conflict_on_exact_selection)$/)))
| (package(pse-runtime) & test(/^workflow::study_tests::(canonical_study_summary_live_owner_and_expired_writer_rebuild_without_science|canonical_study_cancellation_after_summary_close_fences_success)$/))
"""
test-group = "store"
threads-required = 16

[[profile.default.overrides]]
# Memory-heavy engineering journeys: conformance acceptances own a 64 GiB workflow pool
# with two workers; the reference-seed journeys declare a 128 GiB pool with 16 GiB of
# case workers, and the reference flash a 64 GiB pool. Two slots each, so one
# scientific process runs at once. Runtime worker cases share this budget;
# host admission and actual owned observer/worker lifetimes coordinate runs.
filter = """
(package(pse-tests-conformance) & test(/^acceptance::/) & !test(/^acceptance::(coefficient_conic|native_outcomes)::/))
| (package(pse-runtime) & (binary(worker) | test(conformance_parallel_)
    | test(ephemeral_study_sixteen_native_lanes_)
    | test(ephemeral_study_cancellation_drains_sixteen_)
    | test(managed_primary_)))
| (package(pse-runtime) & (
    test(/^workflow::modeling::(pr_jacobian_tests|recycle_tests)::/)
    | test(=math::solves::derived::tests::reference_flash_completed_blocks_discharge_reporting_allowance)))
"""
test-group = "scientific"
threads-required = 2

[[profile.default.overrides]]
filter = '(package(pse-backend-native) & test(/^(kinsol|ipopt|uno|petsc|root_isolation|dynamics|highs|clarabel_tests|restart_tests|scip_tests|l1_tests|pounce_convex_tests|measurement_tests)::/)) | test(/(^|::)solve_/)'
test-group = "scientific"
threads-required = 2
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.default.overrides]]
# Database-only canonical consumers: an isolated fixture database each, shared server.
# New `workflow::`/`math::` modules default here; the excluded modules have no server use.
filter = """
(package(pse-operations) & test(/_server_unit::/))
| (package(pse-runtime) & test(/^(workflow|math)::/) & !(
    test(/^math::(flows|initialization|modeling|prediction|retention|settings|staged|tests)::/)
    | test(/^workflow::(controls|diagnostic_documents|diagnostic_rows|diagnostics|dynamics|numerics|progress_documents|result_blocks|result_projection|time)::/)
    | (test(/^math::strategy::/) & !test(=math::strategy::tests::automatic_refusal_only_trace_publishes_without_admitting_empty_execution))))
"""
test-group = "store"
threads-required = 1

[[profile.default.overrides]]
# These acceptances admit the scientific package closure before native execution.
filter = 'test(authored_vessel_fitting_preserves_shared_parameters_checks_and_identifiability) | test(authored_physical_nlp_preserves_native_routes_and_original_qualification) | test(acceptance::connected_results_resource::authored_connected_results_resource)'
slow-timeout = { period = "300s", terminate-after = 3 }

[[profile.default.overrides]]
# This original scientific closure has untimed preparation followed by a bounded
# 1800-second derivative-condition and material-response job on one worker.
filter = 'test(original_pr_case_derivatives_satisfy_production_basis_conditions)'
slow-timeout = { period = "300s", terminate-after = 9 }

[[profile.default.overrides]]
# Global certification admits the package closure and then runs spatial branch-and-bound
# under its own solver deadline.
filter = 'test(/^acceptance::global_certification::/)'
slow-timeout = { period = "300s", terminate-after = 6 }

# Local scientific validation keeps the production task's own deadline. The
# runner reports slow tests without cutting off a declared 600-second solve at
# 120/360 seconds. A finite whole-run timeout still bounds broken orchestration.
[profile.local]
inherits = "default"
retries = 0
slow-timeout = "60s"
# Complete positive scientific journeys exceed the earlier two-hour allowance; this
# bounds the assembled campaign, while production jobs retain their own deadlines.
global-timeout = "4h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[[profile.local.overrides]]
filter = 'all()'
slow-timeout = "60s"

[profile.local.junit]
path = "junit.xml"
store-failure-output = true

# Explicit CI profile: run everything, retry nothing. Local validation uses local.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 3, grace-period = "10s" }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

# Opt-in diagnostic only: `cargo nextest run --profile flaky-hunt -E 'test(name)'` answers
# "is this failure nondeterministic?"; it never launders a red test green.
[profile.flaky-hunt]
inherits = "ci"
retries = { backoff = "exponential", count = 3, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
