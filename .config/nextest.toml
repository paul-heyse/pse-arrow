# cargo-nextest configuration. nextest does not run doctests: every gate pairs
# `cargo nextest run` with `cargo test --doc --workspace --locked`.

# Restore Cargo for test execution after invocation-local graph composition.
experimental = ["setup-scripts"]

[scripts.setup.restore-cargo]
command = { command-line = "scripts/nextest-test-env", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = "all()"
setup = "restore-cargo"

[test-groups]
# Pool-owning solver, engineering and runtime cases share one budget. Each
# consumes both ownership tokens, so only one scientific process runs per observer.
# These tokens do not limit that process to two CPUs: its host allocation can
# use the full sixteen-core / thirty-two-thread workstation.
# Unassigned pure tests retain the profile's parallel budget.
scientific = { max-threads = 2 }
# Canonical consumers on the one selected supervised server. Each fixture owns an
# isolated UUID database, so database-only tests share the server (threads-required 1);
# sixteen clients can share the server's allocation-derived runtime. Tests that own
# server-wide resources or depend on sub-second timing take all sixteen slots.
store = { max-threads = 16 }

[profile.default]
# These public journeys require one externally placed four-GiB observer. Select
# them deliberately with the managed-primary profile and their native features.
default-filter = "not test(managed_primary_)"
fail-fast = false
# Report slow tests at 60 s; terminate at 360 s. Overrides below carry longer budgets.
slow-timeout = { period = "60s", terminate-after = 6 }
leak-timeout = "500ms"
# Several agents share this machine; NEXTEST_TEST_THREADS or --test-threads override.
test-threads = 16
# Concise by default (Plan 29 P7): failures, slow tests and leaks print, passes do not;
# `--status-level pass` (or NEXTEST_STATUS_LEVEL=pass) shows every test.
status-level = "slow"
failure-output = "immediate-final"
success-output = "never"

# Every default run leaves a reviewable report at target/nextest/default/junit.xml
# (overwritten per run). Full per-test output for passes and failures comes from
# nextest's record store, enabled in the user config (`cargo nextest store list`).
[profile.default.junit]
path = "junit.xml"
store-failure-output = true

[profile.managed-primary]
inherits = "default"
default-filter = "test(managed_primary_)"

# Nextest owns the declared scheduling and timeout behavior directly. Private native
# fixtures supply capabilities; scheduling groups never grant execution authority.
[[profile.default.overrides]]
filter = '(package(pse-backend-native) & test(/^(kinsol|ipopt|uno|petsc|root_isolation|dynamics|highs|clarabel_tests|restart_tests|scip_tests|l1_tests|pounce_convex_tests|measurement_tests)::/)) | test(/(^|::)solve_/)'
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.default.overrides]]
# These acceptances admit the scientific package closure before native execution.
filter = 'test(authored_vessel_fitting_preserves_shared_parameters_checks_and_identifiability) | test(authored_physical_nlp_preserves_native_routes_and_original_qualification) | test(acceptance::connected_results_resource::authored_connected_results_resource)'
slow-timeout = { period = "300s", terminate-after = 3 }

[[profile.default.overrides]]
# These consumers own full scientific preparation; recorded cases also own
# selected server module controllers. Use the existing scientific exclusion budget;
# pure mechanism tests and unrelated clients retain their parallel execution.
filter = 'package(pse-runtime) & (test(/^workflow::modeling::ordinary_delivery_tests::/) | test(/^workflow::modeling::source_impact::tests::ordinary_/) | test(ordinary_bt_sources_admit_and_reimport_through_exact_parent_delta) | test(/^workflow::operation_preparation::initialization_tests::/))'
test-group = "scientific"
threads-required = 2
# Original 600-second solves plus explicit source admission/publication work.
slow-timeout = { period = "300s", terminate-after = 6 }

[[profile.default.overrides]]
# The expiry control requires all controllers on the borrowed qualification server.
# Other qualification cases use that same pool only while the expiry control is absent.
filter = 'test(=canonical_studies::canonical_studies_server_unit::surrealism_qualification::canonical_studies_surrealism_qualification_pool_original_expiry_cannot_start_late)'
test-group = "store"
threads-required = 16

[[profile.default.overrides]]
filter = 'test(/^canonical_studies::canonical_studies_server_unit::surrealism_qualification::/)'
test-group = "store"

[[profile.default.overrides]]
# This original scientific closure has untimed preparation followed by a bounded
# 1800-second derivative-condition and material-response job on one worker.
filter = 'test(original_pr_case_derivatives_satisfy_production_basis_conditions)'
slow-timeout = { period = "300s", terminate-after = 9 }

[[profile.default.overrides]]
# Global certification admits the package closure and then runs spatial branch-and-bound
# under its own solver deadline.
filter = 'test(/^acceptance::global_certification::/)'
slow-timeout = { period = "300s", terminate-after = 6 }

# Local scientific validation keeps the production task's own deadline. The
# runner reports slow tests without cutting off a declared 600-second solve at
# 120/360 seconds. A finite whole-run timeout still bounds broken orchestration.
[profile.local]
inherits = "default"
retries = 0
slow-timeout = "60s"
# Complete positive scientific journeys exceed the earlier two-hour allowance; this
# bounds the assembled campaign, while production jobs retain their own deadlines.
global-timeout = "4h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[[profile.local.overrides]]
filter = 'all()'
slow-timeout = "60s"

[profile.local.junit]
path = "junit.xml"
store-failure-output = true

# Explicit CI profile: run everything, retry nothing. Local validation uses local.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 3, grace-period = "10s" }
global-timeout = "2h"
success-output = "never"
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
store-failure-output = true

# Opt-in diagnostic only: `cargo nextest run --profile flaky-hunt -E 'test(name)'` answers
# "is this failure nondeterministic?"; it never launders a red test green.
[profile.flaky-hunt]
inherits = "ci"
retries = { backoff = "exponential", count = 3, delay = "1s", max-delay = "10s", jitter = true }
flaky-result = "fail"
