# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 Paul Heyse
# Workspace for pse-arrow: the Arrow-native process systems engineering core
# (docs/authoritative_design/blueprint.md, revision 3).
#
# Every third-party dependency is declared here exactly once (blueprint §3.1) and members
# inherit it via `.workspace = true`. Every registry dependency is pinned exactly (`=x.y.z`,
# `cargo add name@=x.y.z`) and a git dependency by its full `rev` (ADR-0165); Cargo.lock holds
# everything beneath, and every recipe runs `--locked`. Changing a version is agent judgment:
# move that dependency (or its family), check the lock diff, run the affected tests. Holds,
# versions that must not be bumped casually, are listed with their reason in
# [workspace.metadata.pse.pins] (`dependency_pins` checks all of this). The arrow, datafusion,
# object_store families must resolve to ONE version each: `=` binds direct
# dependencies only and `cargo tree -d` cannot flag a mixed family, so `cargo xtask
# family-check` asserts the resolved graph against the families table; families move as a
# unit, and a family major needs an ADR. ADDING a dependency needs no ceremony: no library and
# no licence is refused through phases 0-1 (blueprint §3.3.2, ADR-0066,
# docs/dev/dependency-policy.md).

[workspace]
# A virtual manifest has no `edition`, so cargo would otherwise fall back to resolver 1.
# Resolver 3 = feature isolation for dev/build/target deps + MSRV-aware resolution.
resolver = "3"
members = [
  "crates/*",
  "tests/governance",
  "tests/engine",
  "tests/conformance",
  "tests/lifecycle",
  "xtask",
  "benches",
]
exclude = [
  "tooling/dfarrow-apiex",
  "tooling/dfarrow-apiex/verify",
  "docker",
  "external",
  "vendor",
  "vendor/diffsol",
  "vendor/diffsol-la",
  "vendor/diffsol-nl",
  "vendor/sundials-sys",
  "vendor/suitesparse-sys",
  "vendor/faer",
  "vendor/faer-traits",
  "vendor/symbolica",
  "vendor/numerica",
  "vendor/salsa",
  "vendor/buffa",
  "vendor/buffa-codegen",
  "vendor/ra-ap-ide-db",
  "vendor/protoc-gen-protovalidate-buffa",
  "crates/pse-operations-queries",
  "crates/pse-catalog",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# The stable language floor the source is written against (ADR-0122): the toolchain is
# rust-toolchain.toml's dated nightly, used only for Cargo's build-sharing features, and
# tests/governance (toolchain_matches_msrv) requires it to be at or above this floor.
# Cargo's MSRV-aware resolver, clippy's `incompatible_msrv` and `dependency_floors` hold
# the code and every resolved package to it. DataFusion 55's own floor is 1.94.0.
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paul-heyse/pse-arrow"
homepage = "https://paul-heyse.github.io/pse-arrow/"
authors = ["Paul Heyse <paul@heyse.io>"]
publish = false

[workspace.dependencies]
procfs-core = { version = "=0.18.0", default-features = false }
pin-project-lite = "=0.2.17"
pse-admission = { path = "crates/pse-admission" }
allocation-counter = "=0.8.1"
libc = "=0.2.190"
# ---- internal (path deps; `version` is added when publish flips to true) ----
pse-codegen = { path = "crates/pse-codegen" }
pse-model = { path = "crates/pse-model" }
pse-contract = { path = "crates/pse-contract" }
pse-study-module = { path = "crates/pse-study-module" }
pse-contract-proto = { path = "crates/pse-contract-proto" }
pse-modeling = { path = "crates/pse-modeling" }
pse-columnar = { path = "crates/pse-columnar" }
pse-schema = { path = "crates/pse-schema" }
pse-relations = { path = "crates/pse-relations" }
pse-ids = { path = "crates/pse-ids" }
pse-quantity = { path = "crates/pse-quantity" }
pse-authoring = { path = "crates/pse-authoring" }
pse-math = { path = "crates/pse-math" }
pse-rules = { path = "crates/pse-rules" }
pse-engine = { path = "crates/pse-engine" }
pse-testkit = { path = "crates/pse-testkit" }
pse-compiler = { path = "crates/pse-compiler" }
pse-structural = { path = "crates/pse-structural" }
pse-kernels = { path = "crates/pse-kernels" }
pse-backend-native = { path = "crates/pse-backend-native" }
pse-diagnostics = { path = "crates/pse-diagnostics" }
pse-host = { path = "crates/pse-host" }
pse-vocabulary = { path = "crates/pse-vocabulary" }
pse-runtime = { path = "crates/pse-runtime" }
pse-ipopt-sys = { path = "crates/pse-ipopt-sys" }
pse-uno-sys = { path = "crates/pse-uno-sys" }
pse-petsc-sys = { path = "crates/pse-petsc-sys" }
pse-buildinfo = { path = "crates/pse-buildinfo" }
pse-operations = { path = "crates/pse-operations" }

# ---- arrow family @ =59.3.0 (blueprint §3.1) ----
# Features fixed here. `force_validate` is exposed as `pse-relations/force-validate` and
# passed by every test invocation, never a default. `ipc_compression` and `prettyprint`
# do not select identity semantics. DataFusion may unify lz4/zstd into arrow-ipc;
# stored-byte encoding checksums retain the exact selected payload encoding.
arrow = { version = "=59.3.0", default-features = false, features = [
  "ipc",
  "ffi",
  "canonical_extension_types",
] }
arrow-array = { version = "=59.3.0", default-features = false, features = [
  "ffi",
] }
arrow-buffer = "=59.3.0"
arrow-data = { version = "=59.3.0", default-features = false }
arrow-schema = { version = "=59.3.0", default-features = false, features = [
  "ffi",
  "canonical_extension_types",
  "serde",
] }
arrow-ipc = { version = "=59.3.0", default-features = false }
flatbuffers = "=25.12.19"
arrow-select = "=59.3.0"
arrow-cast = { version = "=59.3.0", default-features = false }
arrow-ord = "=59.3.0"
parquet = { version = "=59.3.0", default-features = false, features = [
  "arrow",
  "async",
  "object_store",
] }

# ---- datafusion family @ =55.1.0 (blueprint §3.1) ----
# Default features are enabled; all optional capabilities remain eligible (ADR-0066).
datafusion = "=55.1.0"
datafusion-common = "=55.1.0"
datafusion-expr = "=55.1.0"
datafusion-functions = "=55.1.0"
datafusion-functions-nested = "=55.1.0"
datafusion-functions-aggregate = "=55.1.0"
datafusion-execution = "=55.1.0"
datafusion-catalog = "=55.1.0"
datafusion-physical-expr = "=55.1.0"
datafusion-pruning = "=55.1.0"
datafusion-optimizer = "=55.1.0"

url = { version = "=2.5.8", features = ["serde"] }
percent-encoding = "=2.3.2"
pathdiff = "=0.2.3"
globset = "=0.4.20"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = [
  "rust_backend",
] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

# Required by DataFusion 55 (^0.13.2); 0.14.x exists on crates.io and must not be taken.
object_store = "=0.13.2"

# ---- runtime ----
# Exact server parser/AST, only selected by maintenance catalog validation.
surrealdb-protocol = { version = "=0.14.1", default-features = false, features = [
  "flatbuffers",
] }
surrealism = "=0.7.0"
surrealdb-types = { version = "=4.0.0", features = ["proto"] }
surrealdb-expr = { version = "=4.0.0", default-features = false }
surrealdb-parser-next = "=4.0.0"
zstd = { version = "=0.13.3", default-features = false }
zbus = { version = "=6.1.0", default-features = false, features = [
  "tokio",
  "proxy",
] }
zbus_systemd = { version = "=0.26201.0", default-features = false, features = [
  "systemd1",
  "zbus-async-tokio",
] }
tokio = { version = "=1.53.3", default-features = false, features = [
  "fs",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "process",
  "signal",
  "io-util",
  "net",
] }
tokio-util = { version = "=0.7.19", default-features = false, features = [
  "rt",
] }
tokio-rayon = "=2.1.0"
sd-notify = "=0.5.0"
tokio-metrics = { version = "=0.5.2", default-features = false, features = [
  "rt",
] }
tracing = "=0.1.44"
# Process-owned diagnostic export; scientific outcomes remain native-owned.
opentelemetry = { version = "=0.33.1", default-features = false, features = [
  "trace",
  "logs",
  "metrics",
] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = [
  "trace",
  "logs",
  "metrics",
  "internal-logs",
] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = [
  "http-proto",
  "reqwest-blocking-client",
  "trace",
  "logs",
  "metrics",
] }
opentelemetry-http = { version = "=0.33.1", default-features = false, features = [
  "reqwest-blocking",
] }
tracing-opentelemetry = "=0.34.0"
opentelemetry-appender-tracing = "=0.33.1"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
] }
datafusion-tracing = "=55.0.0"
instrumented-object-store = "=55.0.0"
thiserror = "=2.0.21"
# Library error projections preserve native diagnostic causes without a rendering dependency.
miette = { version = "=7.6.0", features = ["fancy-no-syscall"] }

# ---- serialization and documents ----
serde = { version = "=1.0.229", features = ["derive", "rc"] }
# Manifest and extension-metadata JSON only (blueprint §4.3): never a hash input, never
# relation data. Identity framing lives in pse-ids (blueprint §5.3).
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
# JSON Schema (draft 2020-12) of the Rust-owned boundary documents, derived from their
# serde types; the generator publishes native input/output schemas from them
# (ADR-0116 Outcome 7).
schemars = { version = "=1.2.2", features = ["raw_value"] }
jsonschema = { version = "=0.58.2", default-features = false }
# Validated single-value settings domains (ADR-0116 Outcome 8): a value outside its domain
# cannot be constructed or decoded. `derive_unchecked` carries the schemars 1.x derive,
# whose field attribute states the constraint in the schema.
nutype = { version = "=0.8.0", features = ["serde", "derive_unchecked"] }
# Owned HTTP/2 peer and byte-body lifecycle integration.
tonic = { version = "=0.14.6", default-features = false, features = [
  "transport",
  "codegen",
] }
tower-service = "=0.3.3"
buffa = { version = "=0.9.2", features = ["json", "text"] }
buffa-codegen = "=0.9.2"
buffa-descriptor = { version = "=0.9.2", features = [
  "reflect",
  "json",
  "text",
] }
buffa-types = { version = "=0.9.2", features = ["reflect", "json"] }
connectrpc = "=0.9.1"
connectrpc-codegen = "=0.9.0"
protoc-gen-protovalidate-buffa = { version = "=0.7.2", path = "vendor/protoc-gen-protovalidate-buffa" }
protovalidate-buffa = { version = "=0.7.2", default-features = false }
protovalidate-buffa-protos = "=0.7.1"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "server", "http2"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
lspf = "=1.0.3"
lsp-server = "=0.10.0"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
pulldown-cmark = { version = "=0.13.5", default-features = false }
ra_ap_syntax = "=0.0.360"
ast-grep-core = "=0.51.0"
ast-grep-config = "=0.51.0"
ra_ap_hir = "=0.0.358"
ra_ap_ide = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_proc_macro_api = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_vfs = "=0.0.358"
native_ra_syntax = { package = "ra_ap_syntax", version = "=0.0.358" }
unicode-properties = "=0.1.4"
unicode-ident = "=1.0.24"
tree-sitter-rust = "=0.24.2"
tree-sitter-proto = "=0.6.0"
tree-sitter = "=0.27.0"
tree-sitter-bash = "=0.25.1"
serde-saphyr = "=1.3.0"
toml = { version = "=1.1.6", default-features = false, features = [
  "parse",
  "serde",
  "display",
] }
strum = { version = "=0.28.0", features = ["derive"] }
hex = "=0.4.3"
winnow = { version = "=1.0.4", default-features = false, features = ["std"] }
sqlparser = "=0.62.0"

# ---- code generation (pse-schema and xtask only) ----
# syn 3, not the ecosystem's syn 2; a prettyplease upgrade is a regeneration commit.
syn = { version = "=3.0.5", features = [
  "full",
  "extra-traits",
  "visit",
  "visit-mut",
  "fold",
  "parsing",
  "printing",
] }
quote = "=1.0.47"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
# Keep macro formatting identical in standalone schema tests and bindgen-enabled xtask.
# Cargo unifies bindgen's `verbatim` feature into the latter graph.
prettyplease = { version = "=0.3.0", features = ["verbatim"] }

# ---- graphs, numerics, identity ----
gmp-mpfr-sys = { version = "=1.7.1", default-features = false, features = [
  "mpfr",
] }
symbolica = { version = "=3.0.1", default-features = false, features = [
  "integer-gmp",
  "float-mpfr",
] }
root1d = { version = "=0.4.1", default-features = false }
faer = { version = "=0.24.4", default-features = false, features = [
  "std",
  "sparse-linalg",
] }
feos = { version = "=0.10.1", default-features = false, features = ["pcsaft"] }
feos-core = { version = "=0.10.1", default-features = false }
coolprop-sys = { version = "=8.0.0", path = "vendor/coolprop-sys" }
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
highs = "=2.4.0"
highs-sys = "=1.15.0"
# Raw SCIP 10.0.2 C API (ADR-0105). Default features only: bindgen over the solver
# image's `SCIPOPTDIR` headers. The `bundled` and `from-source` profiles are refused.
scip-sys = "=0.1.28"
clarabel = { version = "=0.11.1", default-features = false, features = [
  "serde",
] }
quantity = { version = "=0.14.0", default-features = false }
sundials-sys = { version = "=0.6.2", path = "vendor/sundials-sys", default-features = false, features = [
  "kinsol",
  "klu",
  "build_libraries",
  "static_libraries",
] }
diffsol = { version = "=0.16.2", path = "vendor/diffsol", default-features = false, features = [
  "faer",
] }
# The linear-solver trait Diffsol re-exports only through its time-aware extension; the
# pse-owned Newton factorizations implement it directly (Plan 22 I9). Diffsol's own version.
diffsol-la = { version = "=0.1.1", path = "vendor/diffsol-la", default-features = false, features = [
  "faer",
] }
pounce-presolve = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0" }
pounce-nlp = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0" }
pounce-common = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0" }
finitediff = "=0.2.0"
pounce-rs = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0", features = [
  "qp",
  "convex",
] }
pounce-feral = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0" }
pounce-linsol = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0" }
# The sensitivity core's backsolver contract over a FERAL KKT factor (Plan 22 S0, I1).
pounce-sens-core = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0" }
pounce-qp = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.12.0" }
egobox-ego = { version = "=0.38.1", default-features = false, features = [
  "persistent",
] }
egobox-moe = { version = "=0.35.5", default-features = false }
egobox-gp = { version = "=0.36.4", default-features = false }
egobox-doe = { version = "=0.35.1", default-features = false }
argmin = { version = "=0.11.0", default-features = false }
levenberg-marquardt = { git = "https://github.com/rust-cv/levenberg-marquardt.git", rev = "e67066cf1351e91e054c30fcb2ff49d005db1e50", version = "=0.15.0", default-features = false }
ndarray = "=0.16.1"
ndarray-rand = "=0.15.0"
rand_xoshiro = "=0.6.0"
# Direct FERAL for conditioning and certified inertia (Plan 22 N4); the version pounce-feral resolves.
feral = { git = "https://github.com/paul-heyse/pounce", rev = "141a9d00e1e1d3eb3aa716f7640390ecdfcbdfbe", version = "=0.18.0" }
# Quantiles of the fit's confidence intervals (ADR-0118 item 8). Defaults are disabled
# here, but egobox-moe enables them by feature unification, retaining nalgebra 0.33/rand.
# Quantile callers do not cross nalgebra types; this is not a pinned-family split.
statrs = { version = "=0.18.0", default-features = false }
rayon = "=1.12.0"
once_cell = "=1.21.4"
rustc-hash = "=2.1.3"
hashbrown = { version = "=0.17.1", default-features = false, features = [
  "equivalent",
  "inline-more",
] }
quick_cache = "=0.6.24"
# Typed dense index spaces at coordinate boundaries (ADR-0115, Plan 22 B6).
typed-index-collections = "=3.5.0"
# Enum-indexed storage; its MSRV (1.95) is below the workspace's.
enum-map = "=3.1.0"
suitesparse_sys = { version = "=0.1.4", path = "vendor/suitesparse-sys", default-features = false, features = [
  "static_libraries",
  "klu",
  "amd",
  "colamd",
  "btf",
] }
rpds = { version = "=1.2.1", default-features = false }
salsa = { version = "=0.28.5", default-features = false, features = [
  "macros",
  "inventory",
  "salsa_unstable",
] }
rustworkx-core = "=0.18.1"
petgraph = { version = "=0.8.3", default-features = false, features = [
  "stable_graph",
  "graphmap",
] }
# pse-ids is the only crate allowed to depend on blake3 (tests/governance/blake3_owner).
# The identity digests are frozen by crates/pse-ids/tests/golden_vectors.rs, which would
# name a release that changed them.
blake3 = "=1.8.7"
# `explicit`-policy entity IDs, minted by `pse authoring assign-ids` only; P1 never
# mints one (blueprint §5.1).
uuid = { version = "=1.28.0", features = ["v7"] }


# ---- optional providers enter here WITH their consumer crate (blueprint §9.8, §13.6,
# §7.4): FeOS owns its dual-number trait universe; native dynamics uses Diffsol.
# egglog =3.0.0. Nothing holds them back but a consumer (blueprint §3.3.2, ADR-0066).

# ---- dev and tooling (declared here, as for runtime dependencies) ----
