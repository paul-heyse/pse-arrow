] }
nextest-metadata = "=0.15.0"
quick-junit = "=0.8.0"
gix = { version = "=0.90.0", default-features = false, features = [
  "sha1",
  "sha256",
  "parallel",
  "status",
  "revision",
  "tracing",
] }
clap = { version = "=4.6.7", features = [
  "derive",
  "env",
  "string",
  "unstable-ext",
] }
clap-cargo = "=0.18.3"
regex = "=1.13.1"
ignore = "=0.4.33"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"
