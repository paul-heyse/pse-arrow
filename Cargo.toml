[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
# Allowed per crate, with a reason, only in [workspace.metadata.pse].unsafe-allowlist.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.cargo]
# Cargo reports a dependency no target names as unused. cargo-shear reports
# genuinely unused dependencies (`just deps-report`).
unused_dependencies = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
wildcard_dependencies = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Numerics: i64/usize -> f64 is pervasive and intended.
cast_precision_loss = "allow"
# Panic policy for library crates (tests are exempt via clippy.toml; xtask/benches opt out
# at crate level with a reason).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "warn"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Governance hooks; the tables live in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# FFI discipline.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
# ---- profiles. `force_validate` is an arrow FEATURE, not a profile (see above). ----
[profile.dev]
opt-level = 2
incremental = true
debug = "line-tables-only"

# Keep imported libraries optimized in development builds.
[profile.dev.package."*"]
opt-level = 3
incremental = false
debug = false

[profile.dev.build-override]
opt-level = 2

# Fresh, wrapper-disabled deployment qualification captures use this profile so
# existing dev artifacts cannot be relabeled as newly observed compiler effects.
# Optimization and unwind contracts remain inherited from the ordinary dev profile.
[profile.producer]
inherits = "dev"

# `--profile debugging` when you need variables in a debugger.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.release]
opt-level = 2
incremental = false
lto = "thin"
codegen-units = 16
# REQUIRED: PyO3 turns unwinds into exceptions and the Ipopt callbacks `catch_unwind`;
# `abort` would take the interpreter down (blueprint §18.3, §21).
panic = "unwind"
debug = "line-tables-only"
strip = "none"

[profile.release.package."*"]
opt-level = 3
incremental = false

[profile.release.build-override]
opt-level = 2

# samply / perf with inlined-frame information.
[profile.profiling]
inherits = "release"
debug = "full"

# Explicit cooperative executor inspection; ordinary build artifacts/flags stay separate.
[profile.diagnostic-taskdump]
inherits = "profiling"
split-debuginfo = "off"

# Explicitly distributed native binaries only.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Exact repository-local source overrides are checked against vendor manifests
# and the unique selected lock entry (ADR-0189). No [replace] or config overrides.

[workspace.metadata.pse]
blueprint = "docs/authoritative_design/blueprint.md"
unsafe-allowlist = [
  "pse-host",           # ADR-0233/0234: early inherited-descriptor initialization and exclusively owned native event-descriptor AsyncFd registration.
  "xtask",              # ADR-0164: composition-owned worker deployment qualification.
  "pse-operations",     # ADR-0164: admitted scientific publication and completion writer assertions.
  "pse-compiler",       # ADR-0164: test-only mint for compiler-issued recipe controls.
  "pse-ids",            # ADR-0164: sealed scientific reconstruction trust permit.
  "pse-runtime",        # ADR-0164: admitted kernel completion and qualified stored reconstruction.
  "pse-math",           # ADR-0088: immutable linked GMP/MPFR version strings only.
  "pse-buildinfo",      # ADR-0164: bounded glibc loader callbacks with panic containment.
  "pse-ipopt-sys",
  "pse-uno-sys",        # ADR-0157: shielded Uno project ABI.
  "pse-petsc-sys",      # ADR-0157: MPIUNI real-double project ABI.
  "pse-backend-native",
]

