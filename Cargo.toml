# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 Paul Heyse
# Workspace for pse-arrow: the Arrow-native process systems engineering core
# (docs/authoritative_design/blueprint.md, revision 3).
#
# Every third-party dependency is declared here exactly once (blueprint §3.1) and members
# inherit it via `.workspace = true`. Every registry dependency is pinned exactly (`=x.y.z`,
# `cargo add name@=x.y.z`) and a git dependency by its full `rev` (ADR-0165); Cargo.lock holds
# everything beneath, and every recipe runs `--locked`. Changing a version is agent judgment:
# move that dependency (or its family), check the lock diff, run the affected tests. Holds,
# versions that must not be bumped casually, are listed with their reason in
# [workspace.metadata.pse.pins] (`dependency_pins` checks all of this). The arrow, datafusion,
# object_store and pyo3 families must resolve to ONE version each: `=` binds direct
# dependencies only and `cargo tree -d` cannot flag a mixed family, so `cargo xtask
# family-check` asserts the resolved graph against the families table; families move as a
# unit, and a family major needs an ADR. ADDING a dependency needs no ceremony: no library and
# no licence is refused through phases 0-1 (blueprint §3.3.2, ADR-0066,
# docs/dev/dependency-policy.md).

[workspace]
# A virtual manifest has no `edition`, so cargo would otherwise fall back to resolver 1.
# Resolver 3 = feature isolation for dev/build/target deps + MSRV-aware resolution.
resolver = "3"
members = [
  "crates/*",
  "tests/governance",
  "tests/engine",
  "tests/conformance",
  "tests/lifecycle",
  "xtask",
  "benches",
]
exclude = [
  "tooling/dfarrow-apiex",
  "tooling/dfarrow-apiex/verify",
  "docker",
  "external",
  "vendor",
  "crates/pse-operations-queries",
  "crates/pse-catalog",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# The stable language floor the source is written against (ADR-0122): the toolchain is
# rust-toolchain.toml's dated nightly, used only for Cargo's build-sharing features, and
# tests/governance (toolchain_matches_msrv) requires it to be at or above this floor.
# Cargo's MSRV-aware resolver, clippy's `incompatible_msrv` and `dependency_floors` hold
# the code and every resolved package to it. DataFusion 55's own floor is 1.94.0.
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paul-heyse/pse-arrow"
homepage = "https://paul-heyse.github.io/pse-arrow/"
authors = ["Paul Heyse <paul@heyse.io>"]
publish = false

[workspace.dependencies]
allocation-counter = "=0.8.1"
libc = "=0.2.190"
# ---- internal (path deps; `version` is added when publish flips to true) ----
pse-codegen = { path = "crates/pse-codegen" }
pse-model = { path = "crates/pse-model" }
pse-modeling = { path = "crates/pse-modeling" }
pse-columnar = { path = "crates/pse-columnar" }
pse-schema = { path = "crates/pse-schema" }
pse-relations = { path = "crates/pse-relations" }
pse-ids = { path = "crates/pse-ids" }
pse-quantity = { path = "crates/pse-quantity" }
pse-authoring = { path = "crates/pse-authoring" }
pse-math = { path = "crates/pse-math" }
pse-rules = { path = "crates/pse-rules" }
pse-engine = { path = "crates/pse-engine" }
pse-testkit = { path = "crates/pse-testkit" }
pse-compiler = { path = "crates/pse-compiler" }
pse-structural = { path = "crates/pse-structural" }
pse-kernels = { path = "crates/pse-kernels" }
pse-backend-native = { path = "crates/pse-backend-native" }
pse-diagnostics = { path = "crates/pse-diagnostics" }
pse-vocabulary = { path = "crates/pse-vocabulary" }
pse-runtime = { path = "crates/pse-runtime" }
pse-ipopt-sys = { path = "crates/pse-ipopt-sys" }
pse-uno-sys = { path = "crates/pse-uno-sys" }
pse-petsc-sys = { path = "crates/pse-petsc-sys" }
pse-buildinfo = { path = "crates/pse-buildinfo" }
pse-operations = { path = "crates/pse-operations" }
# Feature unification only, generated by cargo-hakari (ADR-0122/0164);
# actual data-boundary and store consumers depend on it (.config/hakari.toml).
pse-workspace-hack = { path = "crates/pse-workspace-hack" }

# ---- arrow family @ =59.3.0 (blueprint §3.1) ----
# Features fixed here. `force_validate` is exposed as `pse-relations/force-validate` and
# passed by every test invocation, never a default. `ipc_compression` and `prettyprint`
# are never on an identity path; DataFusion's own features may unify lz4/zstd into
# arrow-ipc, and the call-site bans (clippy.toml) keep them off pse.canon.v2 paths.
arrow = { version = "=59.3.0", default-features = false, features = [
  "ipc",
  "ffi",
  "canonical_extension_types",
] }
arrow-array = { version = "=59.3.0", default-features = false, features = [
  "ffi",
] }
arrow-buffer = "=59.3.0"
arrow-schema = { version = "=59.3.0", default-features = false, features = [
  "ffi",
  "canonical_extension_types",
  "serde",
] }
arrow-ipc = { version = "=59.3.0", default-features = false }
flatbuffers = "=25.12.19"
arrow-select = "=59.3.0"
arrow-cast = { version = "=59.3.0", default-features = false }
arrow-ord = "=59.3.0"
arrow-row = "=59.3.0"
parquet = { version = "=59.3.0", default-features = false, features = [
  "arrow",
  "async",
  "object_store",
] }

# ---- datafusion family @ =55.1.0 (blueprint §3.1) ----
# Default features are enabled; all optional capabilities remain eligible (ADR-0066).
datafusion = "=55.1.0"
datafusion-common = "=55.1.0"
datafusion-expr = "=55.1.0"
datafusion-functions = "=55.1.0"
datafusion-functions-nested = "=55.1.0"
datafusion-functions-aggregate = "=55.1.0"
datafusion-execution = "=55.1.0"
datafusion-catalog = "=55.1.0"
datafusion-physical-expr = "=55.1.0"
datafusion-optimizer = "=55.1.0"

url = { version = "=2.5.8", features = ["serde"] }

# Required by DataFusion 55 (^0.13.2); 0.14.x exists on crates.io and must not be taken.
object_store = "=0.13.2"

# ---- Python boundary (pse-py only; features added in that crate) ----
pyo3 = "=0.29.2"
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
pyo3-arrow = "=0.19.0"
pyo3-introspection = "=0.29.2"

# ---- runtime ----
surrealdb = { version = "=3.3.0", path = "vendor/surrealdb", default-features = false, features = [
  "protocol-ws",
  "rustls",
] }
tokio = { version = "=1.53.2", default-features = false, features = [
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "process",
  "io-util",
] }
tokio-util = { version = "=0.7.19", default-features = false, features = [
  "rt",
] }
tokio-tungstenite = "=0.28.0"
tracing = "=0.1.44"
datafusion-tracing = "=55.0.0"
instrumented-object-store = "=55.0.0"
thiserror = "=2.0.21"
# Library error projections preserve native diagnostic causes without a rendering dependency.
miette = "=7.6.0"

# ---- serialization and documents ----
serde = { version = "=1.0.229", features = ["derive", "rc"] }
# Manifest and extension-metadata JSON only (blueprint §4.3): never a hash input, never
# relation data. Identity framing lives in pse-ids (blueprint §5.3).
serde_json = "=1.0.151"
# JSON Schema (draft 2020-12) of the Rust-owned boundary documents, derived from their
# serde types; the generator publishes the schemas and the Python msgspec types from them
# (ADR-0116 Outcome 7).
schemars = "=1.2.2"
# Validated single-value settings domains (ADR-0116 Outcome 8): a value outside its domain
# cannot be constructed or decoded. `derive_unchecked` carries the schemars 1.x derive,
# whose field attribute states the constraint in the schema.
nutype = { version = "=0.8.0", features = ["serde", "derive_unchecked"] }
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
serde-saphyr = "=1.3.0"
toml = { version = "=1.1.6", default-features = false, features = [
  "parse",
  "serde",
  "display",
] }
strum = { version = "=0.28.0", features = ["derive"] }
hex = "=0.4.3"
winnow = { version = "=1.0.4", default-features = false, features = ["std"] }
sqlparser = "=0.62.0"

# ---- code generation (pse-schema and xtask only) ----
# syn 3, not the ecosystem's syn 2; a prettyplease upgrade is a regeneration commit.
syn = { version = "=3.0.5", features = [
  "full",
  "extra-traits",
  "visit",
  "visit-mut",
  "fold",
  "parsing",
  "printing",
] }
quote = "=1.0.47"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
# Keep macro formatting identical in standalone schema tests and bindgen-enabled xtask.
# Cargo unifies bindgen's `verbatim` feature into the latter graph.
prettyplease = { version = "=0.3.0", features = ["verbatim"] }

# ---- graphs, numerics, identity ----
gmp-mpfr-sys = { version = "=1.7.1", default-features = false, features = [
  "mpfr",
] }
symbolica = { version = "=3.0.1", default-features = false, features = [
  "integer-gmp",
  "float-mpfr",
] }
faer = { version = "=0.24.4", default-features = false, features = [
  "std",
  "sparse-linalg",
] }
feos = { version = "=0.10.1", default-features = false, features = ["pcsaft"] }
feos-core = { version = "=0.10.1", default-features = false }
nalgebra = { version = "=0.35.0", default-features = false, features = ["std"] }
highs = "=2.4.0"
highs-sys = "=1.15.0"
# Raw SCIP 10.0.2 C API (ADR-0105). Default features only: bindgen over the solver
# image's `SCIPOPTDIR` headers. The `bundled` and `from-source` profiles are refused.
scip-sys = "=0.1.28"
clarabel = { version = "=0.11.1", default-features = false, features = [
  "serde",
] }
quantity = { version = "=0.14.0", default-features = false }
sundials-sys = { version = "=0.6.2", default-features = false, features = [
  "kinsol",
  "klu",
  "build_libraries",
  "static_libraries",
] }
diffsol = { version = "=0.16.2", default-features = false, features = ["faer"] }
# The linear-solver trait Diffsol re-exports only through its time-aware extension; the
# pse-owned Newton factorizations implement it directly (Plan 22 I9). Diffsol's own version.
diffsol-la = { version = "=0.1.1", default-features = false, features = [
  "faer",
] }
pounce-presolve = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0" }
pounce-nlp = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0" }
pounce-common = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0" }
finitediff = "=0.2.0"
pounce-rs = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0", features = [
  "qp",
  "convex",
] }
pounce-feral = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0" }
pounce-linsol = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0" }
# The sensitivity core's backsolver contract over a FERAL KKT factor (Plan 22 S0, I1).
pounce-sens-core = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0" }
pounce-qp = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.12.0" }
egobox-ego = { version = "=0.38.1", default-features = false, features = [
  "persistent",
] }
egobox-moe = { version = "=0.35.5", default-features = false }
egobox-gp = { version = "=0.36.4", default-features = false }
egobox-doe = { version = "=0.35.1", default-features = false }
argmin = { version = "=0.11.0", default-features = false }
ndarray = "=0.16.1"
# Direct FERAL for conditioning and certified inertia (Plan 22 N4); the version pounce-feral resolves.
feral = { git = "https://github.com/paul-heyse/pounce", rev = "ff6386944421e8037069e521222ada9f22d457e3", version = "=0.18.0" }
# Quantiles of the fit's confidence intervals (Plan 22 S3, ADR-0118 item 8); default features
# off: its nalgebra 0.33 and rand would split the pinned graph.
statrs = { version = "=0.18.0", default-features = false }
rayon = "=1.12.0"
# Typed dense index spaces at coordinate boundaries (ADR-0115, Plan 22 B6).
typed-index-collections = "=3.5.0"
# Enum-indexed storage; its MSRV (1.95) is below the workspace's.
enum-map = "=3.1.0"
suitesparse_sys = { version = "=0.1.4", default-features = false, features = [
  "static_libraries",
  "klu",
  "amd",
  "colamd",
  "btf",
] }
salsa = { version = "=0.28.4", default-features = false, features = [
  "macros",
  "inventory",
  "salsa_unstable",
] }
rustworkx-core = "=0.18.1"
petgraph = { version = "=0.8.3", default-features = false, features = [
  "stable_graph",
  "graphmap",
] }
# pse-ids is the only crate allowed to depend on blake3 (tests/governance/blake3_owner).
# The identity digests are frozen by crates/pse-ids/tests/golden_vectors.rs, which would
# name a release that changed them.
blake3 = { version = "=1.8.7", features = ["rayon"] }
# `explicit`-policy entity IDs, minted by `pse authoring assign-ids` only; P1 never
# mints one (blueprint §5.1).
uuid = { version = "=1.27.0", features = ["v7"] }


# ---- optional providers enter here WITH their consumer crate (blueprint §9.8, §13.6,
# §7.4): FeOS owns its dual-number trait universe; native dynamics uses Diffsol.
# egglog =3.0.0. Nothing holds them back but a consumer (blueprint §3.3.2, ADR-0066).

# ---- dev and tooling (declared here, as for runtime dependencies) ----
proptest = "=1.11.0"
insta = "=1.49.0"
criterion = { version = "=0.8.2", default-features = false, features = [
  "csv_output",
] }
tempfile = "=3.27.0"
tracing-subscriber = "=0.3.23"
cargo_metadata = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
regex = "=1.13.1"
ignore = "=0.4.33"
bindgen = "=0.73.2"
pkg-config = "=0.3.34"
cc = "=1.6.0"
semver = "=1.0.28"
# xtask writes python/pse/contracts/GENERATED.sha256 with it; semantic identity is
# blake3 in pse-ids and never this (blueprint §5.3, ADR-0051).
sha2 = "=0.11.0"
# dev-dependency of pse-tests-lifecycle: the fault-injecting ObjectStore wrapper
# implements an async trait (blueprint §24.1 "Lifecycle").
futures-util = "=0.3.34"
async-trait = "=0.1.92"
anyhow = "=1.0.104"

[workspace.lints.rust]
# Allowed per crate, with a reason, only in [workspace.metadata.pse].unsafe-allowlist.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.cargo]
# Cargo reports a dependency no target names as unused. Each consuming member's
# `pse-workspace-hack` dependency, and every dependency of that crate, exists only to
# unify features (ADR-0122), which the lint cannot express. cargo-shear, which recognises
# the workspace-hack, reports genuinely unused dependencies (`just deps-report`).
unused_dependencies = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
wildcard_dependencies = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Numerics: i64/usize -> f64 is pervasive and intended.
cast_precision_loss = "allow"
# Panic policy for library crates (tests are exempt via clippy.toml; xtask/benches opt out
# at crate level with a reason).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "warn"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Governance hooks; the tables live in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# FFI discipline.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
# ---- profiles. `force_validate` is an arrow FEATURE, not a profile (see above). ----
[profile.dev]
opt-level = 2
incremental = true
debug = "line-tables-only"

# Keep imported libraries optimized in development builds.
[profile.dev.package."*"]
opt-level = 3
incremental = false
debug = false

[profile.dev.build-override]
opt-level = 2

# Fresh, wrapper-disabled deployment qualification captures use this profile so
# existing dev artifacts cannot be relabeled as newly observed compiler effects.
# Optimization and unwind contracts remain inherited from the ordinary dev profile.
[profile.producer]
inherits = "dev"

# `--profile debugging` when you need variables in a debugger.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.release]
opt-level = 2
incremental = false
lto = "thin"
codegen-units = 16
# REQUIRED: PyO3 turns unwinds into exceptions and the Ipopt callbacks `catch_unwind`;
# `abort` would take the interpreter down (blueprint §18.3, §21).
panic = "unwind"
debug = "line-tables-only"
strip = "none"

[profile.release.package."*"]
opt-level = 3
incremental = false

[profile.release.build-override]
opt-level = 2

# samply / perf with inlined-frame information.
[profile.profiling]
inherits = "release"
debug = "full"

# Shipped wheels and binaries only (`maturin --profile dist`).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# No [patch] / [replace] tables, ever (tests/governance/no_patch_tables.rs).

# Semantic leaf crates are excluded; actual consumers depend on the
# cargo-hakari workspace-hack for its features alone (ADR-0122). cargo-shear recognises
# it; cargo-machete needs to be told.
[workspace.metadata.cargo-machete]
ignored = ["pse-workspace-hack"]

[workspace.metadata.pse]
blueprint = "docs/authoritative_design/blueprint.md"
# Passed to every test invocation by the justfile and CI; never a default feature.
validate-features = ["pse-relations/force-validate"]
unsafe-allowlist = [
  "xtask",              # ADR-0164: composition-owned worker deployment qualification.
  "pse-operations",     # ADR-0164: admitted scientific publication and completion writer assertions.
  "pse-compiler",       # ADR-0164: test-only mint for compiler-issued recipe controls.
  "pse-ids",            # ADR-0164: sealed scientific reconstruction trust permit.
  "pse-runtime",        # ADR-0164: admitted kernel completion and qualified stored reconstruction.
  "pse-math",           # ADR-0088: immutable linked GMP/MPFR version strings only.
  "pse-buildinfo",      # ADR-0164: bounded glibc loader callbacks with panic containment.
  "pse-ipopt-sys",
  "pse-uno-sys",        # ADR-0157: shielded Uno project ABI.
  "pse-petsc-sys",      # ADR-0157: MPIUNI real-double project ABI.
  "pse-backend-native",
  "pse-py",             # CPython ABI and ADR-0164 controlled deployment qualification.
]

# Native validated mathematics, prepared by scripts/native_cache.py. The archive
# includes FILIB and the upstream patches for bundled SoPlex; no system LP/BLAS.
[workspace.metadata.pse.root-isolation]
version = "2.9.1"
interval-version = "3.0.2.2"
lp-version = "4.0.2"
archive = "https://github.com/ibex-team/ibex-lib/archive/refs/tags/ibex-2.9.1.tar.gz"
sha256 = "b3cd09c3be137fd2ff0f2570c3bcbdfcd9ea62fcf04d45d058db3b0dbb1d8872"
options = [
  "CMAKE_BUILD_TYPE=Release",
  "BUILD_SHARED_LIBS=OFF",
  "CMAKE_POSITION_INDEPENDENT_CODE=ON",
  "CMAKE_CXX_FLAGS=-fvisibility=hidden -fvisibility-inlines-hidden -ffp-contract=off -fno-fast-math",
  "BUILD_TESTING=OFF",
  "INTERVAL_LIB=filib",
  "LP_LIB=soplex",
  "SOPLEX_LIBRARY=SOPLEX_LIBRARY-NOTFOUND",
  "SOPLEX_INC_DIR=SOPLEX_INC_DIR-NOTFOUND",
  "GMP=OFF",
  "ZLIB=OFF",
]

# Scoped foreign composition inputs (ADR-0157). Matching HiGHS is owned by highs-sys;
# the preparation recipe obtains its actual Cargo-built archive rather than rebuilding it.
[workspace.metadata.pse.uno]
revision = "805a27ecf802eec33d1aea85ae73efa8a24f71be"
archive = "https://codeload.github.com/cvanaret/Uno/tar.gz/805a27ecf802eec33d1aea85ae73efa8a24f71be"
sha256 = "55618cdb814e01d3d85c5616f16ff995b5378077fddc17744d5496101774ed09"
options = [
  "BUILD_STATIC_LIBS=ON",
  "BUILD_SHARED_LIBS=OFF",
  "USE_OPENMP=OFF",
  "ENABLE_TESTS=OFF",
  "CMAKE_POSITION_INDEPENDENT_CODE=ON",
  "CMAKE_BUILD_TYPE=Release",
]
patch = "docker/solvers/uno-pse.patch"

[workspace.metadata.pse.petsc]
version = "3.24.0"
archive = "https://codeload.github.com/petsc/petsc/tar.gz/refs/tags/v3.24.0"
sha256 = "952ae65066633cc5660c9489ae5e511f7293d4fbb274653bad57e7c0c395c7aa"
options = [
  "--with-mpi=0",
  "--with-scalar-type=real",
  "--with-precision=double",
  "--with-64-bit-indices=0",
  "--with-64-bit-blas-indices=0",
  "--with-shared-libraries=1",
  "--with-debugging=0",
  "--with-fc=0",
  "--with-cuda=0",
  "--with-openmp=0",
]
patch = "docker/solvers/petsc-pse.patch"

# Consumed by `cargo xtask family-check`: one resolved version per family, equal to the
# declared one (`match = "minor"` for pyo3).
[workspace.metadata.pse.families]
arrow = { version = "59.3.0", crates = [
  "arrow",
  "arrow-*",
  "parquet",
