  "CMAKE_CXX_FLAGS=-fvisibility=hidden -fvisibility-inlines-hidden -ffp-contract=off -fno-fast-math",
  "BUILD_TESTING=OFF",
  "INTERVAL_LIB=filib",
  "LP_LIB=soplex",
  "SOPLEX_LIBRARY=SOPLEX_LIBRARY-NOTFOUND",
  "SOPLEX_INC_DIR=SOPLEX_INC_DIR-NOTFOUND",
  "GMP=OFF",
  "ZLIB=OFF",
