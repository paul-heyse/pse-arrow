# Consumed by `cargo xtask family-check`: one resolved version per family, equal to the
# declared one (including any explicitly declared minor-version family).
[workspace.metadata.pse.families]
arrow = { version = "59.3.0", crates = [
  "arrow",
  "arrow-*",
  "parquet",
  "parquet-*",
] }
# Instrumentation is independently released; its native dependencies remain checked.
datafusion = { version = "55.1.0", crates = [
  "datafusion",
  "datafusion-*",
], exclude = [
  "datafusion-tracing",
] }
object_store = { version = "0.13.2", crates = ["object_store"] }

# Holds: pinned dependencies outside the families above that must not be bumped casually,
# each with its reason (ADR-0165). Every dependency is exact anyway; one with no entry here
# may be bumped when the work calls for it. Remove the entry when the reason lapses.
[workspace.metadata.pse.pins]
unicode-properties = "The isolated ra_ap 0.0.358 native analysis world requires Unicode 17 tables; 0.1.5 supplies Unicode 18 and fails the analyzer's const alignment checks. Revisit with a coherent analyzer family update and the native source/type/reference controls."
unicode-ident = "Native ra_ap 0.0.358 Unicode alignment companion to unicode-properties; revisit that family together."
rustdoc-types = "Decodes rustdoc JSON format 61 emitted by nightly-2026-09-29. Revisit together with the pinned toolchain or an observed rustdoc format change; reject unknown formats before typed decoding."
surrealdb-types = "The bounded canonical client consumes the public but doc-hidden Error::from_wire proto error constructor at 4.0.0. Revisit on a released supported protobuf-error conversion; preserve typed causes, details, cardinality and substantive-error selection controls."
symbolica = "Maintained 3.0.1 bounded exact-root APIs and certified proof conversion; Dualizer expansion, C++ export, build-time abort and remaining global root-cache couplings are release-specific. Numerica Rational::to_f64 double rounds some literals; the three general map_coeff paths retain their existing non-RNE numerical realization. Revisit on supplier/API change or a consumer requiring certified rounding, with exact-source and scientific controls. See vendor/symbolica-bounded-roots.md."
faer = "Maintained nonfused 0.24.4 kernel realization and companion faer-traits source; update and qualify together, revisiting only with complete consumed dispatch and generated-code controls. See vendor/faer-arithmetic.md."
levenberg-marquardt = "Exact nalgebra 0.35 compatibility commit; release 0.15 algorithm/API unchanged; revisit when a release carries this family update."
pounce-presolve = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
pounce-nlp = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
pounce-common = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
pounce-rs = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
pounce-feral = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
pounce-linsol = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
pounce-sens-core = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
pounce-qp = "POUNCE fork at one immutable revision; the whole POUNCE family resolves to one coherent source (Plan 25n)"
feral = "Direct FERAL from the POUNCE fork revision; must be the FERAL 0.18.0 that pounce-feral resolves (Plan 22 N4)"
syn = "Drives committed generated Rust (codegen-*-check); a bump is a regeneration commit"
prettyplease = "Formats committed generated Rust and bindgen output byte for byte; a bump is a regeneration commit"
bindgen = "Emits the committed pse-ipopt-sys bindings; a bump is a regeneration commit"
schemars = "Derives the committed JSON Schemas and msgspec types of the boundary documents (ADR-0116); a bump is a regeneration commit"
feos = "FeOS reference oracle: `just feos-reference` generates the committed package pse.data.oracles.feos-0.10.1, qualified at this release with feos-core and quantity"
feos-core = "FeOS reference oracle closure (see feos)"
quantity = "FeOS reference oracle closure (see feos)"
salsa = "pse-compiler consumes unstable memory_usage, and the exact vendored source supplies opt-in descendant cancellation groups for native analysis. Revisit with both compiler accounting and isolated/native descendant cancellation controls; ordinary clone behavior must remain unchanged."
buffa = "Maintained 0.9.2 opt-in pre-growth logical view decoder allocation accounting; update with buffa-codegen and exact generated decoder controls before changing this qualified source profile. See vendor/buffa/pse-patch.md."
buffa-codegen = "Companion of the maintained buffa 0.9.2 allocation-accounted view profile; decoder accounting stays opt-in, with narrow schema-name style attributes on owned/view oneofs. See vendor/buffa-codegen/pse-patch.md."
ra_ap_ide_db = "The compatible native analyzer family consumes the vendored request_snapshot cancellation-group bridge. Revisit with coherent family, original IDE navigation/reference and authenticated cancellation qualification."

