buffa-codegen = { version = "=0.9.2", path = "vendor/buffa-codegen" }
# Request-owned cancellation reaches native analysis clones; upstream defaults stay unchanged.
salsa = { version = "=0.28.5", path = "vendor/salsa" }
ra_ap_ide_db = { version = "=0.0.358", path = "vendor/ra_ap_ide_db" }
faer = { version = "=0.24.4", path = "vendor/faer" }
faer-traits = { version = "=0.24.0", path = "vendor/faer-traits" }
