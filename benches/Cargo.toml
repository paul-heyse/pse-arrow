[package]
name = "pse-benches"
description = "Criterion benchmarks for the blueprint §24.3 performance groups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Benchmarks are not a shipped artifact.
publish = false

[lints]
workspace = true

[features]
native-process = ["pse-runtime/native-solvers"]

[dev-dependencies]
pse-diagnostics.workspace = true
pse-runtime.workspace = true
pse-backend-native.workspace = true
pse-kernels.workspace = true
pse-compiler.workspace = true
pse-testkit.workspace = true
pse-quantity = { workspace = true, features = ["fixtures"] }
pse-engine.workspace = true
criterion.workspace = true
allocation-counter.workspace = true
# The canonicalization group measures native canonicalization over Arrow batches.
pse-ids.workspace = true
pse-columnar = { workspace = true, features = ["bench-instrumentation"] }
pse-codegen.workspace = true
arrow.workspace = true
datafusion.workspace = true
deltalake.workspace = true
pse-catalog.workspace = true
pse-relations.workspace = true
pse-schema.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio.workspace = true
tempfile.workspace = true
url.workspace = true
serde_json.workspace = true
futures-util.workspace = true

[[bench]]
name = "canonicalization"
# Criterion supplies its own main; the libtest harness would swallow the arguments.
# `cargo test --benches -p pse-benches` passes `--test`, which runs each benchmark once
# with no timing gate — that is the CI smoke check (plan §6).
harness = false

[[bench]]
name = "native_cache"
harness = false

[[bench]]
name = "native_consolidation"
harness = false

[[bench]]
name = "native_process"
harness = false
required-features = ["native-process"]
