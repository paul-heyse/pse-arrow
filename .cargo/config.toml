# Deliberately minimal (tests/governance/no_patch_tables.rs asserts it stays so).
#
# Use mold for x86_64 Linux builds. Other targets retain their toolchain defaults.
# The linker is scoped to this target so macOS and Windows builds are unaffected.
#
# No `target-cpu=native`, ever. It lets LLVM contract `a*b + c` into a single FMA, which
# changes floating-point results between a developer machine and CI; parity tolerances
# would pass in one place and fail in the other.
#
# sccache is not wired in here: a mandatory `rustc-wrapper` breaks every contributor who
# lacks it. scripts/pse-env activates installed sccache for just and direnv. (sccache cannot
# cache cdylib/bin/proc-macro crates, which is why pse-py is a thin shell over rlibs.)
#
# There is no config key for `--locked`; every gate passes it explicitly.
#
# This file governs every Cargo invocation in a checkout -- recipes, bare cargo,
# rust-analyzer and maturin -- so feature unification lives here, not in the recipe
# environment (ADR-0122). The toolchain is the dated nightly in rust-toolchain.toml.
#
# Intermediates stay in each checkout's own target/ (Cargo's default). A build directory
# shared by several checkouts is unsound: Cargo keys a workspace member's unit by its
# workspace-relative path with checkout-local fingerprint state, so one checkout could
# reuse another checkout's artifacts. sccache shares compilations across
# checkouts instead (scripts/build_environment.py).

[build]
jobs = 32
# Check source bytes instead of mtimes; declared build-script file inputs retain
# Cargo's rerun-if-changed mtime behavior.
fingerprint = "content"

[unstable]
checksum-freshness = true
# Resolve dependency features for the whole workspace whatever `-p` selects, so each
# recipe selection shares one build of symbolica, DataFusion and Arrow ([resolver]).
feature-unification = true
# Lock individual build units instead of the whole target directory (Plan 29 P3).
# This does not establish safe overlapping dirty-graph concurrency: see the pinned
# Cargo limitation in docs/dev/agent-environment.md, "Builds in one checkout".
fine-grain-locking = true

[resolver]
# Read only with `-Z feature-unification` (above). The pinned nightly is the supported
# Cargo path; stable Cargo's per-selection fallback is retired (ADR-0175).
feature-unification = "workspace"

[alias]
xtask = "run --quiet --locked --package xtask --"
# The external subcommand is on PATH through scripts/pse-env or direnv. It reads
# the actual selected target/host units and never adds an unrelated package root.
c = "pse-correctness check --locked"
t = "pse-correctness nextest run --locked"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[future-incompat-report]
frequency = "always"
