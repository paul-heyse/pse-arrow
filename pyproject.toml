[project]
name = "pse-arrow-reference-tools"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
quality = [
  "ruff==0.16.7",
  "pyrefly==1.3.1",
  "reuse==6.2.0",
  "taplo==0.9.3",
  "typos==1.50.2",
  "pre-commit==4.6.2",

]
# Frozen numerical oracle releases move only with deliberate reference requalification.
test = [
  "scipy-stubs==1.18.1.1; python_full_version >= '3.12'",
  "pyarrow==25.0.1",
  "numpy==2.5.3; python_full_version >= '3.12'",
  "numpy==2.4.6; python_full_version < '3.12'",
  "scipy==1.18.1; python_full_version >= '3.12'",
  "scipy==1.17.1; python_full_version < '3.12'",
]
# IDAES 2.13.0 is the parity authority; Pyomo/Pint retain its qualified environment.
parity = [
  "msgspec==0.21.1",
  { include-group = "test" },
  "idaes-pse==2.13.0; python_full_version < '3.15'",
  "pyomo==6.10.1; python_full_version < '3.15'",
  "pint==0.26.1; python_full_version >= '3.12' and python_full_version < '3.15'",
  "pint==0.25.3; python_full_version < '3.12'",
]
# The frozen thermodynamic bank retains its independently qualified teqp release.
thermo-reference = [
  { include-group = "test" },
  "teqp==0.23.1; python_version == '3.12'",
]
dev = [
  { include-group = "quality" },
]

[tool.uv]
package = false
add-bounds = "exact"
python-preference = "managed"
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["scripts", "tests/reference"]
# Skill bundles and their tooling are outside the product lint/format scope.
force-exclude = true
extend-exclude = [
  "external",
  "vendor",
  "build",
  "docs",
  "target",
  "tooling",
  ".codex/skills/**",
  ".claude/skills/**",
  ".agents/skills/**",
]

[tool.ruff.format]
docstring-code-format = true
# Generated contracts are formatted by the generator; formatting them here would make
# `rust / codegen-diff` fail. Lint still runs on them.
exclude = [
  "scripts/generated/**",
]

[tool.ruff.lint]
# Explicit selection: a ruff upgrade cannot silently change what the gate means.
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "SIM",
  "RUF",
  "PT",
  "PERF",
  "N",
  "ARG",
  "PTH",
  "TRY",
  "PLC",
  "PLE",
  "PLW",
  "ISC",
  "ANN",  # every def annotated; ANN401 bans Any in annotations
  "TC",   # type-checking imports
  "TID",  # banned-api below
  "D",    # google docstrings
  "S",    # bandit
  "T20",  # no print outside tools/scripts
  "ERA",  # no commented-out code
  "PGH",  # no blanket noqa / type: ignore
  "PIE",
  "RET",
  "SLF",
  "FA",
  "LOG",
  "G",
  "DTZ",
  "PYI",
  "NPY",
  "FURB",
  "FLY",
  "INP",
  "EXE",
  "ICN",
  "TD",
]
ignore = [
  "ISC001", # conflicts with the formatter
  "TD002",  # TODO author is git blame's job; TD003 (issue link) stays
]

[tool.ruff.lint.per-file-ignores]
"tests/reference/oracles/*.py" = ["INP001", "PLC0415"]
"scripts/tests/**" = ["S101"]
# Independent oracle drivers own explicit subprocesses, JSON and terminal reports.
"scripts/**" = ["T20", "INP001", "S603", "S607", "S602", "D1", "E501", "TRY003", "DTZ011", "PERF401", "TID251"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
allow-star-arg-any = false

[tool.ruff.lint.flake8-type-checking]
# The independent reference wire evaluates msgspec fields at import time.
runtime-evaluated-base-classes = ["msgspec.Struct"]

[tool.ruff.lint.pep8-naming]
# Literal fields of IDAES's NRTL state and teqp's coefficient API; protocols must
# name the external members exactly, rather than rename their scientific meaning.
extend-ignore-names = ["eq_Gij_coeff", "eq_A", "eq_B", "sigma_Angstrom"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use concrete independent-reference protocol types; typing.Any is forbidden."
"pickle".msg = "Use explicit versioned reference data formats."

[tool.pyrefly]
# Retained Python is independent reference code, checked in its actual environment.
project-includes = ["scripts", "tests/reference"]
project-excludes = [
  "**/.venv*/**", "**/target/**", "external/**", "build/**", "vendor/**",
  "scripts/plan14_reference.py", "scripts/feos_entropy_reference.py", "scripts/pr_stability_reference.py",
]
python-version = "3.13"
python-interpreter-path = ".venv-parity/bin/python"
