# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 Paul Heyse
#
# The one Python project of pse-arrow (import name `pse`; blueprint §21). Every library is
# pinned `==` (blueprint §3.1) -- a reproducibility rule, not an admission rule: no package
# and no licence is refused through phases 0-1 (blueprint §3.3.2, ADR-0066,
# docs/dev/dependency-policy.md). Two interpreter ranges: the platform package targets
# CPython >= 3.11; the parity environment (idaes-pse 2.12.0) is 3.11-3.13, expressed as a
# dependency group with a marker rather than a second project, so one uv.lock covers both.

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "pse-arrow"
# Version authority is crates/pse-py/Cargo.toml (workspace-inherited): one number for Rust
# and Python; the release gate asserts tag == version == wheel == installed metadata.
dynamic = ["version"]
description = "Arrow-native process systems engineering core (import name: pse)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "Paul Heyse", email = "paul@heyse.io" }]
keywords = [
  "process systems engineering",
  "arrow",
  "datafusion",
  "idaes",
  "ipopt",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
# Blueprint §3.1: every library pinned ==. Exact pins in wheel metadata are a deliberate
# reproducibility-over-composability choice, revisited by ADR at the first PyPI release.
# Adding a dependency here needs no ADR; pinning it does need to be exact.
dependencies = [
  "pyarrow==25.0.1",
  "attrs==26.1.0",
  "cattrs==26.2.0",
  "msgspec==0.21.1",
]

[project.optional-dependencies]
# NumPy is used only by the explicit array boundary, not mathematical execution.
array = [
  "numpy==2.5.3; python_full_version >= '3.12'",
  "numpy==2.4.6; python_full_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/paul-heyse/pse-arrow"
Documentation = "https://paul-heyse.github.io/pse-arrow/"
Repository = "https://github.com/paul-heyse/pse-arrow"
Changelog = "https://github.com/paul-heyse/pse-arrow/blob/main/CHANGELOG.md"

# PEP 735. Exact pins for tools: a formatter or type checker that drifts produces phantom
# diffs. Bumping is a deliberate commit (`just lock-upgrade <pkg>`).
[dependency-groups]
# Independent frozen thermodynamic references; never a production dependency.
thermo-reference = [
  { include-group = "test" },
  "teqp==0.23.1; python_version == '3.12'",
]
# Tools that only execute (formatters, linters, type checkers, test runners) carry
# floors, not exact pins: uv.lock records what resolved, `uv lock --upgrade` moves them,
# and nothing in CI or `just doctor` asserts a particular release. Runtime libraries
# above stay `==`-pinned because the type universe and the parity reference depend on
# exact versions (blueprint §3.1).
quality = [
  "ruff>=0.16.7",
  "pyrefly>=1.3.0",
  "import-linter>=2.15",
  "reuse>=6.2.0",
  "taplo>=0.9.3",
  "typos>=1.50.1",
  "pre-commit>=4.6.2",
  "maturin>=1.15.0",
]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "unittest-xml-reporting>=4.0.0",
  # Test-time oracles only (blueprint §24.1); import-linter keeps them out of pse proper.
  # Split by interpreter for the same reason as the `array` extra above.
  "numpy==2.5.3; python_full_version >= '3.12'",
  "numpy==2.4.6; python_full_version < '3.12'",
  "scipy==1.18.1; python_full_version >= '3.12'",
  "scipy==1.17.1; python_full_version < '3.12'",
]
# The parity environment (blueprint §3.1, §24). IDAES 2.12.0 classifies 3.10-3.13 and the
# platform floor is 3.11, so parity runs on 3.11-3.13. The marker makes
# `uv sync --group parity` on 3.14 install nothing IDAES-related, and the --parity
# conftest then FAILS (never skips).
parity = [
  { include-group = "test" },
  "idaes-pse==2.12.0; python_full_version < '3.14'",
  "pyomo==6.10.1; python_full_version < '3.14'",
  "pint==0.26.1; python_full_version >= '3.12' and python_full_version < '3.14'",
  "pint==0.25.3; python_full_version < '3.12'",
]
evidence = [
  { include-group = "parity" },
]
dev = [
  { include-group = "quality" },
  { include-group = "test" },
]

[tool.uv]
package = true
python-preference = "managed"
default-groups = ["dev"]
# Rebuild the extension when Rust inputs change (uv's defaults watch only pyproject/src).
# uv.lock is a key because pse-buildinfo embeds it: a lock change must change build_info().
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "uv.lock" },
  { file = "rust-toolchain.toml" },
  { file = "crates/**/Cargo.toml" },
  { file = "crates/**/*.rs" },
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/pse-py/Cargo.toml"
module-name = "pse._native"
python-source = "python"
python-packages = ["pse"]
locked = true
# "git": the sdist is the git-tracked tree, workspace intact, so `--locked` holds when
# the sdist is built. The default "cargo" generator rewrites the workspace to pse-py's
# dependency closure and the packaged Cargo.lock no longer matches it.
sdist-generator = "git"
profile = "release"
editable-profile = "dev"
# PyO3 0.29 introspection reads ELF's ordinary symbol table to generate the
# actual native API stub. Keep it available in the installed extension.
strip = false
auditwheel = "repair"
# abi3-py311 lives in crates/pse-py/Cargo.toml (pyo3 features): one authority.
include = [
  { path = "uv.lock", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = "REUSE.toml", format = "sdist" },
]
exclude = [
  { path = "python/pse/tests/**", format = "wheel" },
  { path = "python/pse/parity/tests/**", format = "wheel" },
  # Agent configuration is not part of a source distribution. Directory symlinks
  # in the skill aliases cannot be archived by the sdist writer.
  { path = ".agents/**", format = "sdist" },
  { path = ".claude/**", format = "sdist" },
  { path = ".codex/**", format = "sdist" },
  { path = ".github/**", format = "sdist" },
  { path = "docs/capability-maps/evidence/**", format = "sdist" },
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["python"]
# Skill bundles and their tooling are outside the product lint/format scope.
force-exclude = true
extend-exclude = [
  "external",
  "build",
  "docs",
  "target",
  "tooling",
  ".codex/skills/**",
  ".claude/skills/**",
  ".agents/skills/**",
]

[tool.ruff.format]
docstring-code-format = true
# Generated contracts are formatted by the generator; formatting them here would make
# `rust / codegen-diff` fail. Lint still runs on them.
exclude = ["python/pse/contracts/**"]

[tool.ruff.lint]
# Explicit selection: a ruff upgrade cannot silently change what the gate means.
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "SIM",
  "RUF",
  "PT",
  "PERF",
  "N",
  "ARG",
  "PTH",
  "TRY",
  "PLC",
  "PLE",
  "PLW",
  "ISC",
  "ANN",  # every def annotated; ANN401 bans Any in annotations
  "TC",   # type-checking imports
  "TID",  # banned-api below
  "D",    # google docstrings
  "S",    # bandit
  "T20",  # no print outside tools/scripts
  "ERA",  # no commented-out code
  "PGH",  # no blanket noqa / type: ignore
  "PIE",
  "RET",
  "SLF",
  "FA",
  "LOG",
  "G",
  "DTZ",
  "PYI",
  "NPY",
  "FURB",
  "FLY",
  "INP",
  "EXE",
  "ICN",
  "TD",
]
ignore = [
  "ISC001", # conflicts with the formatter
  "TD002",  # TODO author is git blame's job; TD003 (issue link) stays
]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["D1", "INP001", "S603", "S607"]
"python/pse/tests/**" = [
  "S101",
  "D1",
  "ARG001",
  "ARG002",
  "PT011",
  "SLF001",
  "INP001",
  "TID251",
  "S603",
  "S607",
]
"python/pse/parity/tests/**" = [
  "S101",
  "D1",
  "ARG001",
  "ARG002",
  "PT011",
  "SLF001",
  "INP001",
  "TID251",
]
"python/pse/contracts/**" = ["D", "E501", "TID251"]
"python/pse/codec/**" = ["TID251"]
# stdlib CLI scripts: json/tomllib are their codec, subprocess is their job, and every
# helper does not need a google docstring. Skill bundles are excluded above.
"scripts/**" = [
  "T20",
  "INP001",
  "S603",
  "S607",
  "S602",
  "D1",
  "E501",
  "TRY003",
  "DTZ011",
  "PERF401",
  "TID251",
]
"docs/capability-maps/evidence/python/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["pse"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
allow-star-arg-any = false

[tool.ruff.lint.flake8-type-checking]
# attrs/msgspec classes evaluate annotations at runtime (the import-time Any lint); TC
# rules must not move their imports under TYPE_CHECKING.
runtime-evaluated-base-classes = ["msgspec.Struct"]
runtime-evaluated-decorators = [
  "attrs.define",
  "attrs.frozen",
  "attr.s",
  "attr.define",
  "attr.frozen",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Contracts are fully typed (blueprint §21.5); Any is banned outside tests."
"cattrs.Converter".msg = "Use pse.codec.converter(): it installs the forbid_extra_keys hook factory."
"cattrs.GenConverter".msg = "Use pse.codec.converter()."
"cattrs.structure".msg = "The global converter ignores extra keys; use pse.codec."
"cattrs.unstructure".msg = "Use pse.codec."
"pyarrow.register_extension_type".msg = "Use pse.contracts.extension_types.register_all() (idempotent, blueprint §4.4)."
"pyomo.util.check_units.assert_units_consistent".msg = "Use identify_inconsistent_units so the finding names components (blueprint §21.2)."
"json".msg = "Every JSON the package reads or writes is a msgspec.Struct (blueprint §21.5); use msgspec.json."
"tomllib".msg = "Use msgspec.toml (blueprint §21.5)."
"pickle".msg = "No pickle: artifacts are Arrow/Parquet with content hashes."

[tool.pyrefly]
project-includes = ["python/pse", "scripts", "conftest.py"]
project-excludes = ["**/.venv*/**", "**/target/**", "external/**", "build/**"]
search-path = ["python", "python/stubs"]
# Check against the floor, not the 3.14 we develop on.
python-version = "3.11"

[[tool.pyrefly.sub-config]]
matches = "python/pse/parity/**"
replace-imports-with-any = ["idaes.*", "pyomo.*", "pint.*"]

# Executed only by plan14-reference in its isolated locked Python 3.12 environment.
# These upstream modules do not ship typing metadata for the development checker.
[[tool.pyrefly.sub-config]]
matches = "scripts/plan14_reference.py"
replace-imports-with-any = ["teqp", "scipy", "scipy.*"]

# Same locked reference-only interpreter and upstream API as plan14_reference.py.
[[tool.pyrefly.sub-config]]
matches = "scripts/feos_entropy_reference.py"
replace-imports-with-any = ["teqp"]

[tool.importlinter]
root_packages = ["pse"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "numpy/scipy only at the array boundary, in the parity harness, and in tests (blueprint §21.6, §24.1)"
type = "forbidden"
source_modules = ["pse"]
forbidden_modules = ["numpy", "scipy"]
# List only exercised exceptions. Add allowed adapter/parity imports when their
# implementation lands; unmatched exceptions remain errors.
ignore_imports = [
  "pse._array -> numpy",
  "pse.tests.** -> numpy",
]

# `pandas`, `pydantic`, `sympy`, `networkx`, `matplotlib` and `click` used to be listed
# here too. They were dependency hygiene, not architecture, and ADR-0066 lifted that
# constraint -- use any of them if it gets the platform working. `idaes` stays forbidden
# for a packaging reason that has not changed: uv workspaces enforce a single
# `requires-python` (the intersection across members), which is why the parity set is a
# dependency group with an environment marker. An `idaes` import inside `pse` would drag
# the platform package back to the parity interpreter range.
[[tool.importlinter.contracts]]
name = "idaes is a parity dependency, never a platform dependency (blueprint §3.1)"
type = "forbidden"
source_modules = ["pse"]
forbidden_modules = ["idaes"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "pyomo/pint only in the isolated parity harness (ADR-0083)"
type = "forbidden"
source_modules = ["pse"]
forbidden_modules = ["pyomo", "pint"]
ignore_imports = [
  "pse.parity.** -> pyomo",
]

[[tool.importlinter.contracts]]
name = "generated contracts use only the native identity gateway"
type = "forbidden"
source_modules = ["pse.contracts"]
forbidden_modules = [
  "pse.codec",
  "pse.authoring",
  "pse.adapters",
  "pse.parity",
  "pse.governance",
  "pse._array",
  "pse._build",
]
# Generated scalar identities use the sole native codec (blueprint §21.5).
ignore_imports = ["pse.contracts.values -> pse._build"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["python/pse/tests", "python/pse/parity/tests"]
python_files = ["test_*.py"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-ra",
  "--durations=100",
  "--durations-min=2",
]
xfail_strict = true
# Allow-list policy: one entry per line, scoped by category AND module regex, with a comment
# naming the upstream issue. A blanket `ignore::DeprecationWarning` is a review failure.
filterwarnings = [
  "error",
]
log_level = "INFO"
console_output_style = "count"
required_plugins = ["pytest-cov", "pytest-xdist"]
markers = [
  "unit: fast, no solver, no inspection store; must run in < 2 s",
  "component: may need a solver, fresh native inspection stores, or the built extension in release profile",
  "integration: long-running end-to-end",
  "performance: opt-in with --performance; never collected otherwise",
  "parity: needs the parity environment (IDAES 2.12.0 + ipopt on PATH); deselected without --parity, FAILS (never skips) with it",
]

[tool.coverage.run]
branch = true
source_pkgs = ["pse"]
omit = ["python/pse/tests/*", "python/pse/parity/tests/*"]
relative_files = true

[tool.coverage.paths]
pse = ["python/pse", "*/site-packages/pse"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
