# Explicit style edition: bare rustfmt defaults to 2015 and would disagree with `cargo fmt`.
style_edition = "2024"
max_width = 100
use_field_init_shorthand = true
use_try_shorthand = true
newline_style = "Unix"
# Generated files carry `#![rustfmt::skip]` (emitted by the generator).
# The pinned nightly supports excluding imported path dependencies from repository
# formatting; keep upstream source bytes and per-file notices intact.
unstable_features = true
ignore = ["vendor"]
