#
# Optional, manually invoked static checks. No hooks are installed by bootstrap;
# commits and pushes do not run this configuration automatically.
#
# Every local hook runs the project's own tool from `.venv/bin`, never whatever
# is on PATH: a stale global ruff produces a different diff than the manual checks.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.6.0"
# Skill bundles are excluded even when a hook receives explicit file paths.
exclude: '^\.(codex|claude|agents)/skills/'

repos:
  - repo: local
    hooks:
      # ruff runs from the project environment, so the hook and `just quality` use the
      # release uv.lock resolved; there is no second ruff version declared here.
      # `--force-exclude` is load-bearing: pre-commit passes explicit paths, and without
      # it ruff formats files the config excludes (the generated contracts), which then
      # fail the generated-manifest check. The upstream ruff-pre-commit hook sets it too.
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --no-sync ruff format --force-exclude
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        language: system
        # No --fix: the baseline is zero, and an auto-fix hides the lesson.
        entry: uv run --no-sync ruff check --no-fix --force-exclude
        types_or: [python, pyi]

      - id: taplo
        name: taplo fmt --check
        language: system
        entry: just fmt-check
        files: \.toml$
        pass_filenames: false

      - id: typos
        name: typos
        language: system
        entry: just lint-typos
        pass_filenames: false
        stages: [pre-push]

      - id: reuse
        name: reuse lint (SPDX headers)
        language: system
        entry: just lint-license
        pass_filenames: false
        stages: [pre-push]

      - id: uv-lock-check
        name: uv lock --check
        language: system
        entry: uv lock --check
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: check-generated
        name: generated contracts match GENERATED.sha256
        language: system
        entry: python3 scripts/check_generated.py
        files: ^python/pse/contracts/
        pass_filenames: false

      - id: ast-grep
        name: ast-grep scan (structural bans)
        language: system
        entry: ast-grep scan --config sgconfig.yml
        types_or: [python, rust]
        pass_filenames: false

      - id: actionlint
        name: actionlint
        language: system
        entry: actionlint
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        language: system
        entry: shellcheck
        types: [shell]

      - id: pyrefly
        name: pyrefly check
        language: system
        entry: just typecheck
        pass_filenames: false
        stages: [pre-push]

      - id: import-linter
        name: import-linter contracts
        language: system
        entry: just lint-imports
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-fmt
        name: cargo fmt --all --check
        language: system
        entry: cargo fmt --all --check
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
