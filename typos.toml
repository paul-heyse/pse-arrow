# Spell check (typos-cli). Excludes lockfiles, generated output, captured third-party
# evidence and vendored reading copies; checks our prose, code and the design corpus.
[files]
extend-exclude = [
  "**/.codex/skills/**",
  "**/.claude/skills/**",
  "**/.agents/skills/**",
  "Cargo.lock",
  "uv.lock",
  "*.snap",
  "*.zst",
  "target/",
  "external/",
  "vendor/",
  "build/",
  # rustc internal-compiler-error dumps: compiler-mangled symbols, not prose.
  "rustc-ice-*.txt",
  "docs/book/",
  "docs/generated/",
  "docs/capability-maps/evidence/**/*.log",
  "docs/capability-maps/evidence/**/*.txt",
  "docs/capability-maps/evidence/**/*.lock",
  "docs/capability-maps/facts/",
  "crates/*/src/generated/",
  "crates/pse-operations-queries/",
  "crates/pse-ipopt-sys/src/bindings.rs",
  "python/pse/contracts/",
  "tests/golden/",
  "LICENSES/",
  "LICENSE-*",
]

[default]
# Native library C symbols (SCIPaddSol, SCIPreleaseCons, SCIPeventGetType, IDA_NO_BCK,
# POUNCE's OT_String) split into fragments that look like misspellings.
extend-ignore-identifiers-re = [
  "^SCIP[A-Za-z0-9_]*$",
  "^IDA_[A-Z0-9_]+$",
  "^OT_[A-Za-z]+$",
]

[default.extend-words]
RELA = "RELA"       # ELF relocation entries with explicit addends, as emitted by readelf.
formate = "formate" # Chemical anion and ester name.
# Solver names, scientific controllers and established bibliography abbreviations.
CACE = "CACE"     # Computers & Chemical Engineering.
LOCA = "LOCA"     # Trilinos continuation package.
SER = "SER"       # Switched evolution relaxation controller.
RTO = "RTO"       # Real-time optimization.
Comput = "Comput" # Standard abbreviated journal titles.
Numer = "Numer"   # Standard abbreviated journal titles.
Thm = "Thm"       # Mathematical theorem references.
Paret = "Paret"   # Mathematician John Mallet-Paret.
# Domain vocabulary and identifiers that are not typos.
IDAES = "IDAES"
idaes = "idaes"
Ipopt = "Ipopt"
ipopt = "ipopt"
MUMPS = "MUMPS"
equil = "equil"
mis = "mis"
MIS = "MIS"
FOM = "FOM"
typ = "typ"
cocurrent = "cocurrent"
Nd = "Nd"
nd = "nd"
ue = "ue"
Stoer = "Stoer"                 # Stoer-Wagner minimum cut
ba = "ba"
HEL = "HEL"
inh = "inh"
ther = "ther"
delt = "delt"
hd = "hd"
iy = "iy"
iz = "iz"
Datas = "Datas"
compilability = "compilability"
Serializeable = "Serializeable"
overrideable = "overrideable"   # Accepted spelling variant in the physical-semantics design page.
restat = "restat"               # Ninja's restat policy, preserved in the hashing reference.
canonicalizations = "canonicalizations" # Plural: independent canonicalization executions.
thr = "thr"                     # Thread-count column abbreviation in captured benchmark tables.

[default.extend-identifiers]
# Header-defined PETSc ABI symbol, preserved exactly in Rust and C bindings.
PETSC_ERR_ARG_SIZ = "PETSC_ERR_ARG_SIZ"
PSE_PETSC_ERR_ARG_SIZ = "PSE_PETSC_ERR_ARG_SIZ"
# Exact crate/feature name retained from Cargo metadata, not prose.
flate2 = "flate2"
writeable = "writeable"
# SCIP's interval-evaluation callback suffix (SCIP_DECL_EXPRINTEVAL).
INTEVAL = "INTEVAL"
# The plural of the SQL keyword, not a truncation.
CHECKs = "CHECKs"
# Deliberate misspellings in tests that assert a misspelled literal or key is refused.
runing = "runing"
methd = "methd"
# Review text showing a misspelled literal that type checking cannot catch.
sucess = "sucess"
# Accepted spelling variant.
requeueing = "requeueing"
HyperANF = "HyperANF" # Published graph cardinality algorithm name.
ths = "ths"           # Captured Python harness variable holding threads.
