# Explicit user/runtime choices take precedence; approval and sandbox settings remain inherited.
model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
# AGENTS.md is close to the 32 KiB default project-doc budget, past which Codex truncates silently.
project_doc_max_bytes = 65536
# Codex runs `bash -lc` without direnv; bare commands take the checkout environment
# from `scripts/pse-env -- <command>`. Only static, non-secret values belong here.
[shell_environment_policy.set]
CARGO_TERM_COLOR = "never"

[agents]
enabled = true
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

# Mirrors `.mcp.json` (Claude Code): a read-only stdio lookup over the library-utilization catalog.
# Codex starts stdio servers in the session's working directory, so the script path is relative
# to the repository root.
[mcp_servers.library-catalog]
command = "uv"
args = [
  "run",
  "--no-project",
  "--with",
  "fastmcp==4.0.5",
  "python",
  "scripts/library_catalog_mcp.py",
]
startup_timeout_sec = 120
# Opt-in per session (`codex -c mcp_servers.library-catalog.enabled=true`): every thread would
# otherwise start its own server. Role files cannot change MCP servers in Codex 0.160.
enabled = false

[mcp_servers.library-catalog.env]
FASTMCP_CHECK_FOR_UPDATES = "off"

# The user-level rust-analyzer MCP server is opt-in here for the same reason
# (`codex -c mcp_servers.rust-analyzer.enabled=true`).
[mcp_servers.rust-analyzer]
enabled = false
