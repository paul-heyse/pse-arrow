# Explicit user/runtime choices take precedence; approval and sandbox settings remain inherited.
model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
# AGENTS.md is close to the 32 KiB default project-doc budget, past which Codex truncates silently.
project_doc_max_bytes = 65536
# Codex runs `bash -lc` without direnv; bare commands take the checkout environment
# from `scripts/pse-env -- <command>`. Only static, non-secret values belong here.
[shell_environment_policy.set]
CARGO_TERM_COLOR = "never"

[agents]
enabled = true
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

# Use `just codex-session` to select this checkout's maintained navigation bridge.
# Keep inherited machine registrations disabled for an unselected raw session.
[mcp_servers.rust-analyzer]
enabled = false

# The selected-session launcher replaces this disabled transport with a verified
# endpoint and an identity-fenced header helper. No machine state or port is stored here.
[mcp_servers.pse-surreal]
url = "http://127.0.0.1:1/mcp"
enabled = false
enabled_tools = ["info", "list", "query"]
