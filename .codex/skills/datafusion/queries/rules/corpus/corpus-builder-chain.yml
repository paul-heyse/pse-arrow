id: corpus-builder-chain
language: rust
severity: hint
message: A configuration builder call demonstrated by an upstream example.
note: |
  Shows which of the 887 `with_*` builder methods anyone actually reaches for, and in what order.
  Use it to find a working configuration rather than guessing from the method list alone.
metadata:
  record: builder-use
  reads: content/corpus/examples
rule:
  kind: call_expression
  has:
    field: function
    kind: field_expression
    has:
      field: field
      regex: '^with_\w+$'
