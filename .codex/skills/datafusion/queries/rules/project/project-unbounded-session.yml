id: project-unbounded-session
language: rust
severity: hint
message: SessionContext built without a bounded RuntimeEnv; a large query can exhaust memory.
note: |
  `SessionContext::new` and `new_with_config` take the default RuntimeEnv, which has no memory
  limit. The disk manager defaults to an OS temporary directory. Spill behavior depends on the
  pool, operator and workload. `RuntimeEnvBuilder` supplies `with_memory_pool`, `with_temp_file_path` and
  `with_max_temp_directory_size`; pass the result to `SessionContext::new_with_config_rt`.
  Pool accounting is not a process RSS guarantee. Resolve the type before attribution.
  See content/operations/datafusion_execution.runtime_env.RuntimeEnvBuilder.md.
metadata:
  record: capability-gap
  capability: memory-limits
rule:
  any:
    - pattern: SessionContext::new()
    - pattern: SessionContext::new_with_config($_)
