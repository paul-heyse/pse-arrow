id: project-tableprovider-no-pushdown
language: rust
severity: hint
message: TableProvider does not override supports_filters_pushdown; every filter runs after the scan.
note: |
  The default returns `Unsupported` for every filter, so DataFusion reads all rows and filters
  above the scan. Inexact pruning must retain every potentially qualifying row; residual
  filtering cannot recover false negatives. Exact requires complete predicate enforcement.
  Unsupported is appropriate when sound or useful pruning is unavailable. Resolve trait identity
  before attributing a syntax match to DataFusion.
  See content/api/datafusion_session.table.md#tableprovider and the upstream example at
  content/corpus/examples/custom_data_source/.
metadata:
  record: capability-gap
  capability: filter-pushdown
rule:
  kind: impl_item
  all:
    - has: { field: trait, regex: '^TableProvider' }
    - not:
        has:
          kind: function_item
          has: { field: name, regex: '^supports_filters_pushdown$' }
          stopBy: end
