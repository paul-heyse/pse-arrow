id: project-collect-over-stream
language: rust
severity: hint
message: Awaited collect candidate; resolve the receiver before suggesting DataFusion streaming.
note: |
  If this resolves to DataFrame::collect, it materializes output. execute_stream and
  execute_stream_partitioned permit incremental consumption; they do not bound operator state
  or process memory. Collecting can be intentional. This is a discovery lead, not a defect.

  Anchored to an awaited call, because DataFusion's `collect` is async and `Iterator::collect`
  is not. Other async APIs (for example TelemetryClient::collect) also match. Syntax cannot
  establish the receiver type, imports or dispatch; inspect or resolve them before attribution.
metadata:
  record: capability-gap
  capability: streaming
rule:
  kind: await_expression
  has:
    kind: call_expression
    has:
      field: function
      kind: field_expression
      has: { field: field, regex: '^collect$' }
