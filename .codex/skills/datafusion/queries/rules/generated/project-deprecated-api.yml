message: Deprecated in the pinned DataFusion release. A replacement exists.
note: |
  Deprecated code still compiles, so nothing forces a correction and a model trained before the
  deprecation keeps emitting it. These 113 identifiers are deprecated as of the pinned
  release, with the replacement the upstream note names:

  AvroObjectReader -- since 59.2.0: Implement `AsyncFileReader` directly instead; see the example on the `AsyncFileReader` trait documentation and `arrow-avro/examples/object_store.rs`. Use `SpawnedReader` to perform I/O on a dedicated runtime. See also https://github.com/apache/arrow-rs/issues/10308
    BernoulliDistribution -- since 54.0.0: Part of the unused Statistics V2 framework; see https://github.com/apache/datafusion/pull/22071
    CastColumnFn -- since 52.0.0: SchemaAdapter has been removed. Use PhysicalExprAdapterFactory instead. See upgrading.md for more details.
    CoalesceBatchesExec -- since 52.0.0: We now use BatchCoalescer from arrow-rs instead of a dedicated operator
    CompositePruningStatistics -- since 52.0.0: This struct is no longer used internally. It may be removed in 58.0.0 or 6 months after 52.0.0 is released, whichever comes first. Please open an issue if you have a use case for it.
    CompressionContext -- since 59.1.0: Use IpcWriteContext instead
    DefaultSchemaAdapterFactory -- since 52.0.0: DefaultSchemaAdapterFactory has been removed. Use PhysicalExprAdapterFactory instead. See upgrading.md for more details.
