[package]
name = "datafusion-skill-reference-probes"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
arrow-array = "=59.3.0"
arrow-cast = "=59.3.0"
arrow-row = "=59.3.0"
arrow-schema = "=59.3.0"
arrow-select = "=59.3.0"

datafusion = { version = "=55.1.0", default-features = false, features = ["sql", "parquet", "nested_expressions", "string_expressions"] }
parquet = { version = "=59.3.0", default-features = false, features = ["arrow"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
serde_json = "=1.0.151"
futures = "=0.3.34"
async-trait = "=0.1.92"
bytes = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
