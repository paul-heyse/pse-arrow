id: contract-entrypoints
language: rust
severity: hint
message: Candidate contract entry point; inspect documentation and body before inferring behavior.
rule:
  all:
    - any:
        - kind: function_item
        - kind: function_signature_item
    - has:
        field: name
        regex: '^(filter_record_batch|take_record_batch|convert_rows|convert_columns|scan|scan_with_args|execute_stream)$'
