# ast-grep project for the DataFusion capability repository.
#
# This config is deliberately NOT discovered automatically. It is always passed explicitly:
#
#     ast-grep scan -c .claude/skills/datafusion/queries/sgconfig.yml --filter '^model-' <paths>
#
# The rules here are questions, not prohibitions. They carry `severity: hint` and no `fix`, and
# they must never be mixed into a repository's own enforcement corpus, where a match means a
# violation. Keeping a separate config is what keeps the two meanings apart.
ruleDirs:
  - rules

utilDirs:
  - utils

testConfigs:
  - testDir: rule-tests
    snapshotDir: __snapshots__
