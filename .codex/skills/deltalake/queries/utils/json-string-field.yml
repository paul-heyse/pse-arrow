# A JSON object member whose key and value both match. Parameterized so every model rule can say
# "this record has field X equal to Y" without restating the pair/key/value shape.
id: json-string-field
language: json
arguments: [key-pattern, value-pattern]
rule:
  kind: pair
  all:
    - has:
        field: key
        matches: key-pattern
    - has:
        field: value
        matches: value-pattern
