id: model-undocumented
language: json
severity: hint
message: Public item with no doc comment in the pinned release.
note: |
  Thin documentation is where a model's training coverage is thinnest, so these are
  disproportionately the capabilities an agent will not know exist. Feeds content/topics/overlooked.md.
metadata:
  record: undocumented
  reads: content/model
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: '^"doc"$'
    - has:
        field: value
        regex: '^null$'
