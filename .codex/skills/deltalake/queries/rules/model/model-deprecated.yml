id: model-deprecated
language: json
severity: hint
message: Deprecated in the pinned release. Check the replacement before using it.
note: |
  Deprecation is the single most reliable signal that training data is stale: the API still
  compiles, so nothing forces a correction. Cross-reference content/releases for the migration.
metadata:
  record: deprecated
  reads: content/model
rule:
  kind: pair
  has:
    field: key
    regex: '^"deprecated"$'
