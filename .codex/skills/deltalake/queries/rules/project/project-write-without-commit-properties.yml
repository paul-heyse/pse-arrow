id: project-write-without-commit-properties
language: rust
severity: hint
message: A write is awaited with no commit properties; a retry can duplicate the data.
note: |
  Inspect the caller's retry and reconciliation contract. At the pinned commit, repeating an
  application transaction marker on sequential appends does not suppress the second append.
  CommitProperties can attach useful coordination metadata; it is not an exactly-once switch.
  See content/capabilities/delta.replay.md and delta.commit.md.

  This is a syntax-only lead. Unrelated methods named write also match; staged writer calls
  may commit elsewhere, and with_commit_properties(Default::default()) escapes this hint
  without establishing any replay guarantee. Resolve receiver types before acting.
metadata:
  record: capability-gap
  capability: replay-coordination
rule:
  kind: await_expression
  all:
    - has:
        kind: field_identifier
        regex: '^(write|merge|delete|update)$'
        stopBy: end
    - not:
        has:
          kind: field_identifier
          regex: '^with_commit_properties$'
          stopBy: end
