[package]
name = "deltalake-skill-planning-probes"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
deltalake = { git = "https://github.com/delta-io/delta-rs", rev = "58f07cd62bfbce3649a7e1c87c696288068ae184", features = ["datafusion"] }
datafusion = { version = "=55.1.0", default-features = false, features = ["sql", "parquet"] }
arrow-array = "=59.3.0"
arrow-schema = "=59.3.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
futures = "=0.3.34"
async-trait = "=0.1.92"
uuid = "1"
tempfile = "3"
url = "2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
