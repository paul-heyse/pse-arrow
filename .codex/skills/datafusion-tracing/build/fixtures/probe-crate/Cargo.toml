# The probe capsule. Never inside a repository under study: `probes.py` copies this tree into
# the capsule root that `acquire.py` chose, and compiles it there.
[package]
name = "datafusion-tracing-probes"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
datafusion = { version = "55.0.0", default-features = false, features = ["parquet", "sql"] }
datafusion-tracing = "55.0.0"
instrumented-object-store = "55.0.0"
object_store = { version = "0.13.2", features = ["fs"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "json", "env-filter"] }
serde_json = "1"
futures = "0.3"

[[bin]]
name = "probe"
path = "src/main.rs"

[dev-dependencies]
opentelemetry = { version = "=0.31.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "testing"] }
tracing-opentelemetry = { version = "=0.32.0", default-features = false }
tracing-futures = "=0.2.5"
