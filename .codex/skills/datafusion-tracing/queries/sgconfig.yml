# Passed explicitly with -c on every invocation. It is deliberately NOT discovered: these rules
# are questions, not enforcement, and mixing them into a repository's own ast-grep corpus would
# turn `severity: hint` findings into review noise in a project that never asked for them.
#
#   ast-grep scan -c queries/sgconfig.yml --filter '^project-' <path to the repo you are editing>
ruleDirs:
  - rules
utilDirs:
  - utils
testConfigs:
  - testDir: rule-tests
    snapshotDir: __snapshots__
