id: corpus-macro-invocation
language: rust
severity: hint
message: how upstream actually invokes an instrumentation macro
note: |
  The arms in `catalogs/macros.md` say what is accepted. These say what upstream writes, which
  is a different and usually more useful thing -- in particular it is where the
  `field = field::Empty` declarations appear beside the `add_custom_field` calls that fill them.
metadata:
  record: example-use
  reads: content/corpus
rule:
  kind: macro_invocation
  has:
    field: macro
    regex: '^instrument(_rules)?_with_[a-z]*_?spans$'
