# A parameterised sub-rule: one key/value pair whose key and value each match a supplied rule.
# Written once because every model-* rule needs it and each needs a different pair.
id: json-string-field
language: json
arguments:
  - key-pattern
  - value-pattern
rule:
  kind: pair
  all:
    - has: { field: key, matches: key-pattern }
    - has: { field: value, matches: value-pattern }
