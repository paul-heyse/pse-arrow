# An object that is one model item rather than any nested object inside one. Anchoring on the
# presence of a "path" member is what keeps a model-* rule from also matching the method objects
# nested inside the item it is describing.
id: json-record
language: json
rule:
  kind: object
  has:
    kind: pair
    has:
      field: key
      regex: '^"path"$'
