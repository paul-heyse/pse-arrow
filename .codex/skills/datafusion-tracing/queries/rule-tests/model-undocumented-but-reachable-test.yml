id: model-undocumented-but-reachable
valid:
  - '{"path": "a::B", "name": "B", "kind": "struct", "signature": "struct B"}'
  - '{"name": "build", "signature": "fn build(self) -> B", "visibility": "doc-hidden"}'
invalid:
  - '{"path": "a::B", "name": "B", "kind": "struct", "visibility": "reachable-undocumented", "reached_via": "A::builder()"}'
  - '{"name": "add_custom_field", "signature": "fn add_custom_field(self, k: K, v: V) -> Self", "visibility": "reachable-undocumented"}'
