#
# The feature-unification crate (ADR-0122). Everything between the BEGIN and END HAKARI
# SECTION markers is generated by `cargo hakari generate` from .config/hakari.toml; never
# edit it by hand. `just codegen` regenerates it and `just codegen-check` compares it.
# Every other member depends on it through `cargo hakari manage-deps`; it has no code.

[package]
name = "pse-workspace-hack"
description = "Feature unification for every package selection, managed by cargo-hakari (ADR-0122)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Never published: it exists only to unify this workspace's dependency features.
publish = false

[lints]
workspace = true

