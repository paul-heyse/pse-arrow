[package]
name = "pse-study-module"
description = "Read-only Surrealism boundary for shared Rust study policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Separate artifact for isolated rollback/resource qualification, never production activation.
module-qualification = []
# Separate finite window for observing global saturation across cold runtime compilation.
module-qualification-long-hold = ["module-qualification"]

[lib]
doctest = false
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
pse-model.workspace = true
serde_json.workspace = true
surrealdb-types.workspace = true
thiserror.workspace = true
miette.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
surrealism.workspace = true
