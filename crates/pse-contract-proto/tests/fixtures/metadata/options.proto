syntax = "proto2";
package independent.v1;
import "pse/contract/v1/metadata.proto";
import "forwarded.proto";

message Request {
  message Alternative1 {
    optional string payload = 1 [(pse.contract.v1.field) = { metadata_version: 2 native_field: "payload" direction: DIRECTION_INPUT native_contract: { native_type: { scalar: NATIVE_SCALAR_STRING } } }];
  }
  option (pse.contract.v1.message) = {
    metadata_version: 2
    owner: { rust_type: "independent::Request" declaration_file: "src/request.rs" }
    interpretation_version: 1
    direction: DIRECTION_BOTH
    construction_role: CONSTRUCTION_ROLE_DATA
    native_shape: { record: { fields: { name: "value" tag: 1 direction: DIRECTION_INPUT contract: { native_type: { scalar: NATIVE_SCALAR_STRING } } } fields: { name: "detail" tag: 2 direction: DIRECTION_INPUT contract: { native_type: { named_owner: "independent.v1.Request.Alternative1" } } } } }
  };
  optional string value = 1 [
    (pse.contract.v1.field) = { metadata_version: 2 native_field: "value" direction: DIRECTION_INPUT native_contract: { native_type: { scalar: NATIVE_SCALAR_STRING } } },
    (independent.imports.forwarded) = "opaque-import-preserved"
  ];
  optional Alternative1 detail = 2 [(pse.contract.v1.field) = { metadata_version: 2 native_field: "detail" direction: DIRECTION_INPUT native_contract: { native_type: { named_owner: "independent.v1.Request.Alternative1" } } }];
}

service Procedure {
  rpc Run(Request) returns (Request) {
    option (pse.contract.v1.method) = {
      metadata_version: 2
      effects: { scope: EFFECT_SCOPE_NATIVE_EXECUTION read_only: false idempotent: false destructive: false }
    };
  }
}
