[package]
name = "pse-backend-native"
description = "Class-specific native problem and attempt contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
ipopt = ["dep:pse-ipopt-sys", "pse-ipopt-sys/link"]
highs = ["dep:highs", "dep:highs-sys"]
pounce = ["dep:pounce-rs", "dep:pounce-feral", "dep:rayon", "pounce-nlp/serde"]
kinsol = ["dep:sundials-sys", "dep:suitesparse_sys"]
sdp = ["clarabel/sdp-netlib"]
diffsol = ["dep:diffsol"]
idas = ["dep:sundials-sys", "sundials-sys/idas", "dep:suitesparse_sys"]
native-solvers = [
  "ipopt",
  "highs",
  "pounce",
  "kinsol",
  "sdp",
  "diffsol",
  "idas",
]

[dependencies]
pse-model.workspace = true
diffsol = { workspace = true, optional = true }
pounce-nlp.workspace = true
pounce-common.workspace = true
pounce-presolve.workspace = true
pse-ids.workspace = true
pse-diagnostics.workspace = true
pse-kernels.workspace = true
pse-math.workspace = true
pse-structural.workspace = true
faer.workspace = true
clarabel.workspace = true
thiserror.workspace = true
miette.workspace = true
serde_json.workspace = true
serde.workspace = true
pse-ipopt-sys = { workspace = true, optional = true }
highs = { workspace = true, optional = true }
highs-sys = { workspace = true, optional = true }
pounce-rs = { workspace = true, optional = true }
pounce-feral = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
sundials-sys = { workspace = true, optional = true }
suitesparse_sys = { workspace = true, optional = true }

[dev-dependencies]
pse-quantity = { workspace = true, features = ["fixtures"] }
