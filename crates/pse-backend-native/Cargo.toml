[package]
name = "pse-backend-native"
description = "Ipopt C-API FFI driver over the evaluation program (blueprint §3.2, §18.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
datafusion.workspace = true
pse-catalog.workspace = true
pse-ids.workspace = true
pse-schema.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio.workspace = true
pse-numerics.workspace = true
pse-relations.workspace = true
tracing.workspace = true
thiserror.workspace = true
miette.workspace = true

[dependencies.pse-ipopt-sys]
workspace = true
optional = true

[features]
# Native plans can be built and inspected without a linked solver. Executing them
# requires this capability explicitly; no other solver or simulated result is used.
default = []
# Link against the qualified Ipopt C interface.
ipopt = ["dep:pse-ipopt-sys", "pse-ipopt-sys/link"]
# Phase-4 placeholder: `diffsol` enters [workspace.dependencies] with this feature
# (blueprint §13.6), not before.
diffsol = []
