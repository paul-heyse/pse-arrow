[package]
name = "pse-backend-native"
description = "Class-specific native problem and attempt contracts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
# Links the solver image's single BLAS/LAPACK and OpenMP provider (ADR-0108).
build = "build.rs"

[lints]
workspace = true

[features]
default = []
ipopt = ["dep:pse-ipopt-sys", "pse-ipopt-sys/link"]
highs = ["dep:highs", "dep:highs-sys"]
pounce = ["dep:pounce-rs", "dep:rayon", "pounce-nlp/serde"]
kinsol = ["dep:sundials-sys", "dep:suitesparse_sys"]
# Clarabel's SDP cones call BLAS/LAPACK through provider-less `blas-src`/`lapack-src`; the
# build script links the solver image's oneMKL (LP64, GNU threading), the process's one
# provider (ADR-0108 item 5). `clarabel/sdp-mkl` is not used: its intel-mkl-src pins a static
# Intel-OpenMP MKL, a second threading runtime the image does not ship.
sdp = ["clarabel/sdp", "clarabel/blas-src", "clarabel/lapack-src"]
# Clarabel's MKL Pardiso KKT solver. pardiso-wrapper loads `libmkl_rt.so` at run time; the
# image ships none, so `mkl::pardiso` points its loader at the linked LP64 interface library,
# which exports every symbol it resolves: the process keeps one oneMKL (ADR-0108 item 5).
# `clarabel/faer-sparse` is not used: it pulls a second faer beside the pinned one.
clarabel-pardiso = ["clarabel/pardiso-mkl"]
diffsol = ["dep:diffsol", "dep:diffsol-la", "dep:suitesparse_sys"]
idas = ["dep:sundials-sys", "sundials-sys/idas", "dep:suitesparse_sys"]
scip = ["dep:scip-sys"]
native-solvers = [
  "ipopt",
  "highs",
  "pounce",
  "kinsol",
  "sdp",
  "clarabel-pardiso",
  "diffsol",
  "idas",
  "scip",
]

[dependencies]
pse-model.workspace = true
diffsol = { workspace = true, optional = true }
diffsol-la = { workspace = true, optional = true }
pounce-nlp.workspace = true
pounce-common.workspace = true
finitediff.workspace = true
pounce-presolve.workspace = true
pse-ids.workspace = true
pse-diagnostics.workspace = true
pse-kernels.workspace = true
pse-math.workspace = true
enum-map.workspace = true
pse-structural.workspace = true
faer.workspace = true
clarabel.workspace = true
thiserror.workspace = true
miette.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
pse-ipopt-sys = { workspace = true, optional = true }
highs = { workspace = true, optional = true }
highs-sys = { workspace = true, optional = true }
pounce-rs = { workspace = true, optional = true }
# The FERAL configuration of the POUNCE settings document, compiled in every build (Plan 22 B5).
pounce-feral.workspace = true
feral.workspace = true
# The backsolver contract of the KKT-point analysis (Plan 22 S0).
pounce-sens-core.workspace = true
rayon = { workspace = true, optional = true }
sundials-sys = { workspace = true, optional = true }
suitesparse_sys = { workspace = true, optional = true }
scip-sys = { workspace = true, optional = true }
pse-workspace-hack.workspace = true

[build-dependencies]
pkg-config.workspace = true

[dev-dependencies]
pse-quantity = { workspace = true, features = ["fixtures"] }
