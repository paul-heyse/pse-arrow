[package]
name = "pse-py"
description = "pyo3 + pyo3-arrow extension module (cdylib) that is the whole Python boundary (blueprint §3.2, §21)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# maturin's `module-name = "pse._native"` requires the shared object to be `_native`.
name = "_native"
# cdylib only: sccache cannot cache cdylib/bin/proc-macro crates, which is why this crate
# is a thin shell over rlibs (.cargo/config.toml).
crate-type = ["cdylib"]
# A cdylib built with pyo3's `extension-module` deliberately leaves the CPython symbols
# undefined, so a test/doctest/bench harness for this target cannot link. The Python-side
# tests live in `python/pse/tests`; Rust logic lives in pse-runtime, which is tested.
test = false
doctest = false
bench = false

[features]
native-solvers = ["pse-runtime/native-solvers"]
solver-ipopt = ["pse-runtime/solver-ipopt"]
solver-pounce = ["pse-runtime/solver-pounce"]
solver-highs = ["pse-runtime/solver-highs"]
solver-kinsol = ["pse-runtime/solver-kinsol"]
solver-diffsol = ["pse-runtime/solver-diffsol"]
# Validation-only dependency: expose the workspace's Arrow validation feature to
# maturin, which selects this package without selecting the other workspace members.
force-validate = ["pse-relations/force-validate"]

[dependencies]
pse-model.workspace = true
pyo3-async-runtimes.workspace = true
pse-backend-native.workspace = true
pse-authoring.workspace = true
serde.workspace = true
serde_json.workspace = true
pse-columnar.workspace = true
pse-relations.workspace = true
pse-engine.workspace = true
datafusion.workspace = true
url.workspace = true
pyo3 = { workspace = true, features = [
  "extension-module",
  "abi3-py311",
  "experimental-inspect",
] }
pyo3-arrow.workspace = true
pse-runtime.workspace = true
pse-buildinfo.workspace = true
pse-catalog.workspace = true
pse-schema.workspace = true
pse-ids.workspace = true
pse-rules.workspace = true
tokio.workspace = true
miette.workspace = true
