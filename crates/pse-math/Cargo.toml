[package]
name = "pse-math"
description = "Physically admitted Symbolica bodies and guarded library evaluation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
compiled-evaluator = [
  "symbolica/native_code_generation",
  "dep:tempfile",
  "dep:rustix",
  "dep:tar",
  "dep:flate2",
  "dep:toml",
  "dep:sha2",
]

[dependencies]
pse-contract.workspace = true
tempfile = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
rayon.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true
schemars.workspace = true
gmp-mpfr-sys.workspace = true
pse-model.workspace = true
pse-structural.workspace = true
symbolica.workspace = true
faer.workspace = true
root1d.workspace = true
pounce-nlp.workspace = true
pounce-presolve.workspace = true
pse-ids.workspace = true
pse-diagnostics.workspace = true
pse-quantity.workspace = true
pse-kernels.workspace = true
serde.workspace = true
serde_json.workspace = true
typed-index-collections.workspace = true
enum-map.workspace = true
thiserror.workspace = true
miette.workspace = true
tracing.workspace = true

[build-dependencies]
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
pse-quantity = { workspace = true, features = ["fixtures"] }
