version: v2
plugins:
  - local: protoc-gen-buffa
    out: .
    strategy: all
    opt: [reflection=true, reflect_mode=vtable, shared_descriptor_pool=true, text=true, json=true]
  - local: protoc-gen-buffa-packaging
    out: .
    strategy: all
    opt: [shared_descriptor_pool=true]
  - local: protoc-gen-connect-rust
    out: services
    strategy: all
    opt: [extern_path=.=crate::code_intelligence_contracts::pb]
  - local: protoc-gen-protovalidate-buffa
    out: validation
    strategy: all
    opt: [proto_module=crate::code_intelligence_contracts::pb]
