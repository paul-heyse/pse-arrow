syntax = "proto3";
package plan61.qualification.v1;
import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/field_mask.proto";

extend google.protobuf.MessageOptions { string qualification_note = 50001; }
enum Truth { TRUTH_UNKNOWN = 0; TRUTH_TRUE = 1; TRUTH_FALSE = 2; }
enum Precision { PRECISION_UNKNOWN = 0; PRECISION_EXACT = 1; PRECISION_LOWER_BOUND = 2; }
message Payload {
  option (qualification_note) = "original source and custom options survive";
  optional int64 count = 1;
  bytes path = 2;
  Truth truth = 3;
  google.protobuf.Any detail = 4;
  google.protobuf.FieldMask mask = 5;
	/* π */	string label = 6;
  Precision precision = 7;
  bytes source_guard = 8;
  string context = 9;
  optional uint64 measured_count = 10;
}
message UnsafeDivision {
  option (buf.validate.message).cel = { id: "unsafe.division" message: "division must be positive" expression: "10 / this.divisor > 0" };
  int64 divisor = 1;
}
message MaskedAll { option (buf.validate.message).cel = { id: "masked.all" message: "false dominates an element error" expression: "[0, 1].all(x, 10 / x == 0)" }; }
message MaskedExists { option (buf.validate.message).cel = { id: "masked.exists" message: "true dominates an element error" expression: "[0, 1].exists(x, 10 / x == 10)" }; }
message ErrorExistsOne { option (buf.validate.message).cel = { id: "error.exists_one" message: "exists_one retains errors" expression: "[0, 1].exists_one(x, 10 / x == 10)" }; }
message RangeConstructionError {
  option (buf.validate.message).cel = { id: "error.range" message: "range construction is not masked by a matching element" expression: "[1 / this.denom].exists(x, true)" };
  int64 denom = 1;
}
message TextExtentControls {
  string text = 1 [(buf.validate.field).string = { min_len: 2 max_len: 3 min_bytes: 3 max_bytes: 5 }];
  optional string optional_text = 2 [(buf.validate.field).string = { min_len: 2 max_len: 3 min_bytes: 3 max_bytes: 5 }];
}
