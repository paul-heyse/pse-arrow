[package]
name = "pse-host"
description = "Independent native environment and Linux workload ownership."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
autobins = false

[lib]
doctest = false

# Three thin entry points over the one library command tree (`pse_host::cli`).
[[bin]]
name = "pse"
path = "src/bin/pse.rs"

[[bin]]
name = "pse-host"
path = "src/bin/pse-host.rs"

[[bin]]
name = "cargo-pse-correctness"
path = "src/bin/cargo-pse-correctness.rs"

[lints]
workspace = true

[dependencies]
pse-diagnostics.workspace = true
pse-buildinfo.workspace = true
clap.workspace = true
thiserror.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
futures-util.workspace = true
command-fds.workspace = true
percent-encoding.workspace = true
uuid.workspace = true
rustix.workspace = true
zbus.workspace = true
zbus_systemd.workspace = true
cargo_metadata.workspace = true
sha2.workspace = true
tempfile.workspace = true
tar.workspace = true
flate2.workspace = true
zip.workspace = true
base64.workspace = true

[dev-dependencies]
