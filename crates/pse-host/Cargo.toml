[package]
name = "pse-host"
description = "Independent native environment and Linux workload ownership."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "pse"
path = "src/bin/pse.rs"
test = false

[[bin]]
name = "pse-host"
path = "src/main.rs"
test = false

[[bin]]
name = "cargo-pse-correctness"
path = "src/bin/cargo-pse-correctness.rs"
test = false

[[bin]]
name = "pse-native-analysis"
path = "src/bin/pse-native-analysis.rs"
required-features = ["native-hir"]

[[bin]]
name = "pse-compiler-analysis"
path = "src/bin/pse-compiler-analysis.rs"
required-features = ["compiler-analysis"]

[features]
compiler-analysis = []
engineering-types = []
engineering-client = ["connectrpc/server", "dep:pse-ids", "engineering-types"]
native-hir = [
  "dep:ra_ap_hir",
  "dep:ra_ap_ide",
  "dep:ra_ap_ide_db",
  "dep:ra_ap_load-cargo",
  "dep:ra_ap_proc_macro_api",
  "dep:ra_ap_project_model",
  "dep:ra_ap_vfs",
  "dep:native_ra_syntax",
  "dep:unicode-properties",
  "dep:unicode-ident",
]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
pse-ids = { workspace = true, optional = true }
pse-contract.workspace = true
pse-contract-proto = { workspace = true, features = ["crossings"] }
buffa.workspace = true
buffa-descriptor.workspace = true
buffa-types.workspace = true
connectrpc = { workspace = true, features = ["client"] }
hyper.workspace = true
hyper-util = { workspace = true, features = ["server-auto", "service"] }
http.workspace = true
tower-service.workspace = true
tracing.workspace = true
protovalidate-buffa = { workspace = true, features = ["connect"] }
ra_ap_hir = { workspace = true, optional = true }
ra_ap_ide = { workspace = true, optional = true }
ra_ap_ide_db = { workspace = true, optional = true }
ra_ap_load-cargo = { workspace = true, optional = true }
ra_ap_proc_macro_api = { workspace = true, optional = true }
ra_ap_project_model = { workspace = true, optional = true }
ra_ap_vfs = { workspace = true, optional = true }
native_ra_syntax = { workspace = true, optional = true }
unicode-properties = { workspace = true, optional = true }
unicode-ident = { workspace = true, optional = true }
clap.workspace = true
clap-cargo.workspace = true
pulldown-cmark.workspace = true
ra_ap_syntax.workspace = true
ast-grep-core.workspace = true
ast-grep-config.workspace = true
syn.workspace = true
tree-sitter-rust.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
pse-diagnostics.workspace = true
pse-buildinfo.workspace = true
thiserror.workspace = true
miette.workspace = true
quote.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rayon.workspace = true
rayon.workspace = true
sd-notify.workspace = true
object_store.workspace = true
bytes.workspace = true
lspf.workspace = true
lsp-server.workspace = true
url.workspace = true
futures-util.workspace = true
futures-executor.workspace = true
command-fds.workspace = true
percent-encoding.workspace = true
pathdiff.workspace = true
uuid.workspace = true
rustix.workspace = true
zbus.workspace = true
zbus_systemd.workspace = true
cargo_metadata.workspace = true
petgraph.workspace = true
public-api.workspace = true
globset.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
figment.workspace = true
indicatif.workspace = true
serde-saphyr.workspace = true
rustdoc-types.workspace = true
nextest-metadata.workspace = true
quick-junit.workspace = true
gix.workspace = true
sha2.workspace = true
tempfile.workspace = true
tar.workspace = true
zstd.workspace = true
flate2.workspace = true
zip.workspace = true
base64.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
proptest.workspace = true
insta.workspace = true
jsonschema.workspace = true

[[package.metadata.pse.test-fixtures]]
id = "prepared-product-observation"
target = "product_observation"
kind = "test"
ownership = "preparation-only"
inputs = ["product-reader", "observation-helper"]
