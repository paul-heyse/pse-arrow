[package]
name = "pse-authoring"
description = "Package and case document loader, expression DSL parser and change sets (blueprint §3.2, §11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pse-quantity.workspace = true
pse-model.workspace = true
petgraph.workspace = true
pse-diagnostics.workspace = true
winnow = { workspace = true, features = ["ascii", "parser"] }
serde.workspace = true
# The JSON Schema of the hydrated authoring documents (ADR-0116 Outcome 10).
schemars.workspace = true
semver.workspace = true
uuid.workspace = true
pse-ids.workspace = true
thiserror.workspace = true
miette.workspace = true
proptest = { workspace = true, optional = true }
pse-workspace-hack.workspace = true

[features]
# `proptest::Arbitrary` generators for the expression AST, used by the DSL round-trip
# property test and by fuzzing harnesses. Never a default (blueprint §24.1).
arbitrary = ["dep:proptest"]

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
