[package]
name = "pse-model"
description = "Registry-generated semantic values without native execution dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pse-quantity.workspace = true
pse-ids.workspace = true
pse-diagnostics.workspace = true
# Platform vocabularies the generated enums re-export (ADR-0117).
pse-vocabulary.workspace = true
serde.workspace = true
thiserror.workspace = true
miette.workspace = true
postgres-types = { workspace = true, optional = true }
postgres-protocol = { workspace = true, optional = true }

[features]
# PostgreSQL values of the operational store's registry enums and typed ids
# (ADR-0114 Outcome 25); only the store's query crate enables it. A source-owned
# vocabulary's mapping lives in its owning crate's `postgres` feature (ADR-0117).
postgres = [
  "pse-ids/postgres",
  "pse-diagnostics/postgres",
  "pse-vocabulary/postgres",
  "dep:postgres-types",
  "dep:postgres-protocol",
]
