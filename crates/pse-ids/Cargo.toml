[package]
name = "pse-ids"
description = "SemanticId, ContentHash, scalar semantics and typed identity framing (blueprint §3.2, §5.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pse-diagnostics.workspace = true
blake3.workspace = true
serde.workspace = true
# The JSON Schema of an identity inside a boundary document (ADR-0116 Outcome 7).
schemars.workspace = true
thiserror.workspace = true
miette.workspace = true
postgres-types = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
# PostgreSQL values of identities (ADR-0114 Outcome 25): the value protocol only.
postgres = ["dep:postgres-types", "dep:bytes"]

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
