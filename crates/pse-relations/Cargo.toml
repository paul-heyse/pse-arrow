[package]
name = "pse-relations"
description = "Generated typed relation views, builders, validators and migrations (blueprint §3.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
datafusion-common.workspace = true
datafusion-expr.workspace = true
datafusion-physical-expr.workspace = true
datafusion-optimizer.workspace = true
datafusion-functions.workspace = true
datafusion-functions-nested.workspace = true
datafusion-functions-aggregate.workspace = true
pse-model.workspace = true
pse-columnar.workspace = true
pse-diagnostics.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
pse-schema.workspace = true
pse-ids.workspace = true
thiserror.workspace = true
miette.workspace = true

[features]
# Arrow's full array validation, exposed so it can be switched on for tests and CI only
# (blueprint §24.1 "Structural validity"). NEVER a default: every test invocation passes
# `--features pse-relations/force-validate` explicitly, and
# `[workspace.metadata.pse].validate-features` names it.
force-validate = ["arrow/force_validate"]
# Literal fixtures are unavailable in ordinary production builds.
test-support = []

[dev-dependencies]
datafusion.workspace = true
pse-relations = { workspace = true, features = ["test-support"] }
tokio.workspace = true
