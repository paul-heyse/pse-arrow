[package]
name = "pse-ipopt-sys"
description = "Raw FFI bindings to the Ipopt C API; build script emits link directives only (blueprint §3.1, §18.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
# Declares the native library so cargo enforces one -sys crate per library and exports
# `cargo:version=` to dependents as DEP_IPOPT_VERSION (recorded by `probe_host`).
links = "ipopt"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# The probe is a FEATURE, not unconditional build-script behaviour: `cargo check
# --workspace` builds every member's build script, and Ipopt >= 3.14 is not on every host
# (some hosts ship 3.11.9). With `link` off the generated declarations still compile,
# while the build script emits only rerun-if-env-changed directives. The explicit
# `unit-ipopt-abi` profile links against the pinned runtime; M11 adds the native driver.
link = []

[build-dependencies]
pkg-config.workspace = true
