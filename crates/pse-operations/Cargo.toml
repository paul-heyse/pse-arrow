[package]
name = "pse-operations"
description = "Canonical graph revisions, compilation products, durable execution and exact scientific results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
force-validate = [
  "pse-columnar/force-validate",
  "pse-codegen/force-validate",
  "pse-schema/force-validate",
  "pse-relations/force-validate",
]
default = []
# Fixture lifetime, isolated databases and deterministic hooks for downstream tests.
test-support = []
# Participation in remote mechanism tests; does not select downstream instrumentation.
canonical-tests = []
# Parse-only server libraries; ordinary scientific runtime does not select these.
canonical-maintenance = ["dep:surrealdb-syn", "dep:surrealdb-sql"]
# Application-owned isolated native canonical service; the host remains DB-free.
native-service = ["dep:pse-host"]

[dependencies]
datafusion-execution.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
rustix.workspace = true
tokio-util.workspace = true
tracing.workspace = true
pse-diagnostics.workspace = true
pse-host = { workspace = true, optional = true }
pse-columnar.workspace = true
pin-project-lite.workspace = true
pse-ids.workspace = true
# The registry owns canonical rows, enumerations and typed identities.
pse-model.workspace = true
pse-relations.workspace = true
# Typed result locators validate their complete keys against the declaration owner.
pse-schema.workspace = true
url.workspace = true
uuid.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tempfile.workspace = true
thiserror.workspace = true
miette.workspace = true
tokio.workspace = true
surrealdb-syn = { workspace = true, optional = true }
surrealdb-sql = { workspace = true, optional = true }

bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower-service.workspace = true
surrealdb-types.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true

# Native RPC transport must not activate sockets in the workspace-unified WASI
# study module's shared protocol/value closure.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tonic.workspace = true
surrealdb-protocol = { workspace = true, features = ["rpc"] }

[dev-dependencies]
reqwest.workspace = true
tracing-subscriber.workspace = true
pse-engine.workspace = true
datafusion.workspace = true
base64.workspace = true
arrow-schema.workspace = true
pse-codegen.workspace = true
url.workspace = true

[[bin]]
name = "pse-canonical-recovery"
path = "src/bin/pse-canonical-recovery.rs"


[[bin]]
name = "pse-canonical-init"
path = "src/bin/pse-canonical-init.rs"

[[bin]]
name = "pse-canonical-service"
path = "src/bin/pse-canonical-service.rs"
required-features = ["native-service"]

[[test]]
name = "native_service"
path = "tests/native_service.rs"
required-features = ["native-service"]
