[[package.metadata.pse.test-fixtures]]
id = "maintenance-borrowed"
target = "pse_operations"
kind = "lib"
required-features = ["canonical-tests", "canonical-maintenance"]
ownership = "runner-borrowed"
inputs = ["server", "study-module", "service-helper"]
scope.tests = [
  "canonical::maintenance::tests::generated_maintenance_pages_fence_generations_and_replay_exact_effects",
  "canonical::maintenance::tests::native_maintenance_event_catalog_roundtrips_and_refuses_changed_or_extra_events",
]

[[package.metadata.pse.test-fixtures]]
id = "publication-owned"
target = "pse_operations"
kind = "lib"
required-features = ["canonical-tests", "native-service"]
ownership = "target-owned"
inputs = ["server", "study-module", "service-helper"]
scope.modules = ["canonical_execution::native_publication_controls"]

[[package.metadata.pse.test-fixtures]]
id = "operator-evidence"
target = "pse_operations"
kind = "lib"
required-features = ["canonical-tests"]
ownership = "preparation-only"
inputs = ["canonical-tools", "diagnostic-evidence"]
scope.tests = [
  "canonical_explanations::server_tests::canonical_operator_graph_evidence",
  "canonical_studies::canonical_studies_server_unit::canonical_operator_query_evidence",
]

[[package.metadata.pse.test-fixtures]]
id = "external-server-restart"
target = "pse_operations"
kind = "lib"
required-features = ["canonical-tests"]
ownership = "preparation-only"
inputs = ["canonical-restart-control"]
scope.tests = ["canonical_execution::canonical_execution_server_unit::retained_canonical_store_recovers_a_new_generation_after_external_server_restart"]

[[bin]]
name = "pse-canonical-test"
path = "src/bin/pse-canonical-test.rs"
required-features = ["native-service"]

[[test]]
name = "native_service"
path = "tests/native_service.rs"
required-features = ["native-service"]
