[package]
name = "pse-operations"
description = "Operational store and publication catalog on PostgreSQL 18: migrations, the attempt lifecycle, jobs, streams, solutions and catalog commits (ADR-0112)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Isolated, migrated databases for tests in other crates; sqlx stays in this crate.
test-support = ["dep:url"]

[dependencies]
pse-diagnostics.workspace = true
pse-ids.workspace = true
# The registry enumerations (attempt, job, study and seed spellings) are the one authority
# for the stored text values (ADR-0112 Outcome 10).
pse-model.workspace = true
url = { workspace = true, optional = true }
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
tokio.workspace = true
clap.workspace = true
# Not called directly: enables whoami's `std` feature for sqlx-postgres, whose default
# connection user is otherwise "anonymous" (see the root manifest).
whoami.workspace = true

[dev-dependencies]
# The migration-conformance test compares the migrated schema with the registry.
pse-schema.workspace = true
arrow-schema.workspace = true
url.workspace = true

[package.metadata.cargo-machete]
ignored = ["whoami"]

[package.metadata.cargo-shear]
ignored = ["whoami"]
