[package]
name = "pse-operations"
description = "Operational store and publication catalog on PostgreSQL 18: the registry-generated schema, the attempt lifecycle, jobs, streams, solutions and catalog commits (ADR-0114)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Isolated databases with the generated schema for tests in other crates; sqlx stays here.
test-support = ["dep:url"]

[dependencies]
pse-diagnostics.workspace = true
pse-ids.workspace = true
# The registry-generated rows, enumerations and typed ids of the store (ADR-0114 Outcome 22).
pse-model.workspace = true
url = { workspace = true, optional = true }
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
tokio.workspace = true
clap.workspace = true
# Not called directly: enables whoami's `std` feature for sqlx-postgres, whose default
# connection user is otherwise "anonymous" (see the root manifest).
whoami.workspace = true

[dev-dependencies]
# Store tests compare the created schema with the registry's store relations.
pse-schema.workspace = true
url.workspace = true

[package.metadata.cargo-machete]
ignored = ["whoami"]

[package.metadata.cargo-shear]
ignored = ["whoami"]
