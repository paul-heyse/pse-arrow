[package]
name = "pse-operations"
description = "Operational store and publication catalog on PostgreSQL 18: the registry-generated schema, the attempt lifecycle, jobs, streams, solutions and catalog commits (ADR-0114)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Isolated databases with the generated schema for tests in other crates.
test-support = ["dep:url"]

[dependencies]
petgraph.workspace = true
refinery.workspace = true
pse-diagnostics.workspace = true
pse-ids.workspace = true
# The registry-generated rows, enumerations and typed ids of the store (ADR-0114 Outcome 22).
pse-model.workspace = true
# The statements, compiled by Cornucopia from queries/*.sql (ADR-0114 Outcome 24).
pse-operations-queries.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
futures.workspace = true
url = { workspace = true, optional = true }
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
# `net` and `io-util` serve the test-support fault proxy (`testing::FaultProxy`).
tokio = { workspace = true, features = ["net", "io-util"] }
clap.workspace = true
pse-workspace-hack.workspace = true

[dev-dependencies]
# Store tests compare the created schema with the registry's store relations.
pse-schema.workspace = true
url.workspace = true
