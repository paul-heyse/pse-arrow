  "canonical_staging::canonical_server_unit::sixteen_independent_source_staging_clients_preserve_closed_shared_version",
  "canonical_staging::canonical_server_unit::sixteen_cloned_staging_callers_preserve_shared_versions_replay_and_fences",
  "canonical_staging::canonical_server_unit::independent_clients_staging_and_reclaim_preserve_shared_version",
  "canonical_staging::canonical_server_unit::staging_reclamation_advances_retention_stage_and_version_guards",
  "canonical_staging::canonical_server_unit::concurrent_identical_source_api_edits_return_one_exact_revision",
  "canonical_staging::canonical_server_unit::source_edit_reacquires_expired_or_abandoned_stage_with_head_fence",
  "canonical_staging::canonical_server_unit::declaration_inventory_above_old_edit_count_activates_atomically",
  "canonical_staging::canonical_server_unit::committed_stage_close_acknowledgement_replays_without_reviving_authority",
  "canonical_staging::canonical_server_unit::atomic_revision_exceeds_old_whole_payload_cap_and_has_native_graph_endpoints",
  "canonical_staging::canonical_server_unit::individual_payload_above_message_limit_is_exact_and_corruption_refuses_completion",
  "canonical_staging::canonical_server_unit::grouped_selected_frontier_is_exact_bounded_and_cannot_escape_released_or_expired_pin",
  "canonical_staging::canonical_server_unit::interrupted_stage_resumes_and_fences_previous_writer_and_stale_head",
