[package]
name = "pse-operations"
description = "Canonical graph revisions, compilation products, durable execution and exact scientific results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
force-validate = ["pse-codegen/force-validate", "pse-schema/force-validate"]
default = []
# Isolated databases with the generated schema for tests in other crates.
test-support = []
# Explicit remote mechanism fixture; ordinary unit selection does not start a server.
canonical-tests = []

[dependencies]
tracing.workspace = true
petgraph.workspace = true
pse-diagnostics.workspace = true
pse-ids.workspace = true
# The registry owns canonical rows, enumerations and typed identities.
pse-model.workspace = true
url.workspace = true
uuid.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
miette.workspace = true
tokio.workspace = true
pse-workspace-hack.workspace = true
surrealdb.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
arrow-schema.workspace = true
pse-codegen.workspace = true
# Store tests compare the created schema with canonical registry declarations.
pse-schema.workspace = true
url.workspace = true
