[package]
name = "pse-runtime"
description = "Run controller, case overlays, sweeps, result ingestion and lifecycle/cancellation (blueprint §3.2, §20)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
force-validate = [
  "pse-admission/force-validate",
  "pse-columnar/force-validate",
  "pse-engine/force-validate",
  "pse-operations/force-validate",
  "pse-relations/force-validate",
  "pse-schema/force-validate",
]
default = []
product-operators = [
  "dep:clap",
  "pse-operations/canonical-maintenance",
]
diagnostic-taskdump = ["tokio/taskdump"]
compiled-evaluator = ["pse-math/compiled-evaluator"]
canonical-tests = ["pse-operations/canonical-tests"]
native-study-tests = [
  "canonical-tests",
  "pse-operations/native-service",
  "pse-operations/canonical-maintenance",
]
solver-ipopt = ["pse-backend-native/ipopt"]
solver-uno = ["pse-backend-native/uno"]
solver-petsc = ["pse-backend-native/petsc"]
solver-highs = ["pse-backend-native/highs"]
solver-pounce = ["pse-backend-native/pounce"]
solver-kinsol = ["pse-backend-native/kinsol"]
solver-root-isolation = ["pse-backend-native/root-isolation"]
solver-sdp = ["pse-backend-native/sdp"]
solver-clarabel-pardiso = ["pse-backend-native/clarabel-pardiso"]
solver-diffsol = ["pse-backend-native/diffsol"]
solver-idas = ["solver-diffsol", "pse-backend-native/idas"]
solver-scip = ["pse-backend-native/scip"]
native-solvers = [
  "solver-ipopt",
  "solver-uno",
  "solver-petsc",
  "solver-highs",
  "solver-pounce",
  "solver-kinsol",
  "solver-root-isolation",
  "solver-sdp",
  "solver-clarabel-pardiso",
  "solver-diffsol",
  "solver-idas",
  "solver-scip",
]

[dependencies]
pse-host.workspace = true
clap = { workspace = true, optional = true }
tempfile.workspace = true
datafusion-pruning.workspace = true
levenberg-marquardt.workspace = true
nalgebra.workspace = true
async-trait.workspace = true
egobox-doe.workspace = true
rand_xoshiro.workspace = true
ndarray-rand.workspace = true
egobox-ego.workspace = true
egobox-moe.workspace = true
egobox-gp.workspace = true
argmin.workspace = true
ndarray.workspace = true
rayon.workspace = true
pse-admission.workspace = true
pse-buildinfo.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-http.workspace = true
http.workspace = true
bytes.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
reqwest.workspace = true
tracing-subscriber.workspace = true
tracing-perfetto-sdk-schema.workspace = true
prost.workspace = true
rustix.workspace = true
faer.workspace = true
# Normal and χ² quantiles of the fit's confidence intervals (Plan 22 S3).
statrs.workspace = true
pse-backend-native.workspace = true
pse-math.workspace = true
pse-kernels.workspace = true
pse-structural.workspace = true
petgraph.workspace = true
rustc-hash.workspace = true
quick_cache.workspace = true
rpds.workspace = true
serde.workspace = true
# The JSON Schema of the solve settings and job documents (ADR-0116 Outcome 7).
schemars.workspace = true
serde-saphyr.workspace = true
toml.workspace = true
pse-model.workspace = true
pse-modeling.workspace = true
pse-compiler.workspace = true
tokio.workspace = true
tokio-metrics.workspace = true
pse-quantity.workspace = true
pse-authoring.workspace = true
pse-relations.workspace = true
pse-schema.workspace = true
serde_json.workspace = true
datafusion.workspace = true
# Package data documents are Parquet, decoded by Arrow type into Arrow-free row sets
# (ADR-0125).
parquet.workspace = true
futures-util.workspace = true
pse-columnar.workspace = true
pse-engine.workspace = true
pse-diagnostics.workspace = true
pse-ids.workspace = true
datafusion-execution.workspace = true
thiserror.workspace = true
miette.workspace = true
# The operational store: durable attempts, jobs, streams and seeds (ADR-0112).
pse-operations.workspace = true
chrono.workspace = true

[dev-dependencies]
proptest.workspace = true
uuid.workspace = true
pse-operations = { workspace = true, features = ["test-support"] }
pse-relations = { workspace = true, features = ["test-support"] }
pse-quantity = { workspace = true, features = ["fixtures"] }
datafusion-common.workspace = true
tokio.workspace = true

[[test]]
# The worker journeys run authored cases through the pse-worker binary, which needs the
# linked native solvers.
name = "worker"
required-features = [
  "native-study-tests",
  "product-operators",
  "solver-ipopt",
  "solver-scip",
]


[[bin]]
name = "pse-deployment"
path = "src/bin/pse-deployment.rs"

[[bin]]
name = "pse-worker"
path = "src/bin/pse-worker.rs"
required-features = ["product-operators"]

[[bin]]
name = "pse-project"
path = "src/bin/pse-project.rs"
required-features = ["product-operators"]
[[test]]
name = "local_operation"
required-features = ["solver-kinsol"]

[[test]]
name = "native_study"
required-features = ["native-study-tests", "solver-kinsol"]

[[test]]
name = "native_repeated_analysis"
required-features = ["native-study-tests", "solver-kinsol"]

[[test]]
name = "reference_degeneracy_exchange"
required-features = ["solver-highs"]

[[test]]
name = "reference_covariance_exchange"
required-features = ["solver-ipopt"]

[[test]]
name = "reference_sensitivity_exchange"
required-features = ["solver-ipopt"]

[[test]]
name = "reference_pid_exchange"
required-features = ["solver-diffsol"]

[[test]]
name = "native_worker_lifecycle"
required-features = ["native-study-tests", "product-operators"]

[[test]]
name = "native_workspace"
required-features = ["solver-kinsol"]

[[test]]
name = "native_conic"

[[test]]
name = "native_strategies"
required-features = ["solver-kinsol"]

[[test]]
name = "native_dynamic_workflows"
required-features = ["solver-diffsol", "solver-ipopt"]

[[test]]
name = "native_scientific_modes"
required-features = ["solver-ipopt", "solver-highs"]

[[test]]
name = "native_adaptive_strategy"
required-features = ["solver-kinsol"]

[[test]]
name = "native_design"

[[test]]
name = "native_conformance"

[[test]]
name = "native_local_study"
required-features = ["solver-ipopt"]

[[test]]
name = "native_source_reload"

[[test]]
name = "native_diagnostics"
required-features = ["solver-highs", "solver-ipopt", "solver-pounce"]
