[package]
name = "pse-admission"
description = "Owned document intake and native physical source admission."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
force-validate = [
  "pse-columnar/force-validate",
  "pse-engine/force-validate",
  "pse-relations/force-validate",
  "pse-rules/force-validate",
  "pse-schema/force-validate",
  "pse-testkit/force-validate",
]

[dependencies]
pse-authoring.workspace = true
pse-model.workspace = true
pse-modeling.workspace = true
pse-quantity.workspace = true
pse-ids.workspace = true
pse-diagnostics.workspace = true
pse-schema.workspace = true
pse-relations.workspace = true
pse-columnar.workspace = true
pse-engine.workspace = true
pse-rules.workspace = true
datafusion.workspace = true
parquet.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
toml.workspace = true
thiserror.workspace = true
miette.workspace = true

[dev-dependencies]
pse-testkit.workspace = true
tempfile.workspace = true
tokio.workspace = true
pse-quantity = { workspace = true, features = ["fixtures"] }
pse-relations = { workspace = true, features = ["test-support"] }
