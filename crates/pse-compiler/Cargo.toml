[package]
name = "pse-compiler"
description = "Physically typed finite definitions compiled to reusable Symbolica bodies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
force-validate = ["pse-admission/force-validate", "pse-schema/force-validate"]

[dependencies]
pse-contract.workspace = true
pse-contract-proto = { workspace = true, features = ["crossings"] }
buffa.workspace = true
buffa-descriptor.workspace = true
protovalidate-buffa.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
petgraph.workspace = true
once_cell.workspace = true
pse-model.workspace = true
tracing.workspace = true
salsa.workspace = true
rustc-hash.workspace = true
pse-structural.workspace = true
pse-diagnostics.workspace = true
thiserror.workspace = true
pse-authoring.workspace = true
pse-modeling.workspace = true
pse-ids.workspace = true
pse-math.workspace = true
pse-kernels.workspace = true
pse-quantity.workspace = true

[dev-dependencies]
miette.workspace = true
pse-admission.workspace = true
pse-ids = { workspace = true, features = ["fixtures"] }
pse-quantity = { workspace = true, features = ["fixtures"] }
pse-schema.workspace = true
toml.workspace = true

# The shared authored fixture is linked from outside the crate. Cargo-shear
# 1.14.0 does not count imports reached through that path module.
[package.metadata.cargo-shear]
ignored = ["miette", "pse-admission", "pse-schema", "toml"]
