#
# ast-grep is the structural layer of the blueprint §24.1 bans: the rules that a
# regex would get wrong (a banned call inside a comment, a string, or a
# differently-formatted call site). The regex layer lives in
# tests/governance/banned_patterns.rs and the type-aware layer in clippy.toml's
# disallowed-methods; each rule belongs to exactly one of the three.
#
# Run: `ast-grep scan --config sgconfig.yml` (also `just lint-repo`, pre-commit).

ruleDirs:
  - sgrules
