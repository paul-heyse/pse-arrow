[package]
name = "xtask"
default-run = "xtask"
description = "Workspace driver: codegen, family-check, governance, doc-lint, probe-host, release (plan §3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Never published: this is the repository's own tooling, reached as `cargo xtask`
# (.cargo/config.toml [alias]).
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
doctest = false

[lints]
workspace = true

[features]
fuzz-inspection = [
  "dep:libfuzzer-sys",
  "dep:pse-runtime",
]
force-validate = [
  "arrow-array?/force_validate",
  "pse-admission?/force-validate",
  "pse-codegen/force-validate",
  "pse-columnar/force-validate",
  "pse-engine?/force-validate",
  "pse-operations?/force-validate",
  "pse-relations?/force-validate",
  "pse-rules?/force-validate",
  "pse-runtime?/force-validate",
  "pse-schema/force-validate",
]
solver-kinsol = ["dep:pse-runtime", "pse-runtime/solver-kinsol"]
native-solvers = [
  "package-fixtures",
  "solver-kinsol",
  "pse-runtime/native-solvers",
]
default = []
native-abi = ["dep:bindgen"]
full-codegen = [
  "package-fixtures",
  "native-abi",
  "evidence-tools",
  "host-contracts",
]
host-contracts = ["dep:pse-host"]
# Passive recorded-result declarations do not depend on their runtime consumers.
recorded-result-contracts = ["dep:pse-model"]
evidence-tools = [
  "dep:pse-operations",
  "dep:pse-engine",
  "dep:pse-model",
  "dep:pse-relations",
  "dep:datafusion",
  "dep:surrealdb-types",
  "dep:uuid",
  "dep:thiserror",
  "dep:strum",
  "dep:arrow-array",
]
surrealql-tools = ["dep:surrealdb-parser-next", "dep:tree-sitter-rust"]
canonical-tools = [
  "dep:pse-model",
  "dep:pse-operations",
  "dep:pse-runtime",
  "pse-operations/canonical-maintenance",
]
thermodynamic-oracles = [
  "dep:feos",
  "dep:feos-core",
  "dep:quantity",
  "dep:nalgebra",
  "dep:parquet",
  "dep:datafusion",
]
# The bootstrap registry generator must compile without its generated DTO consumers.
physical-admission = [
  "dep:pse-admission",
  "dep:datafusion",
  "dep:pse-authoring",
  "dep:pse-engine",
  "dep:pse-relations",
  "dep:pse-rules",
]
product-schemas = [
  "recorded-result-contracts",
  "evidence-tools",
  "dep:pse-compiler",
  "dep:pse-admission",
  "dep:pse-authoring",
  "dep:pse-engine",
  "dep:pse-backend-native",
  "dep:pse-runtime",
  "dep:pse-model",
  "dep:pse-operations",
  "dep:pse-kernels",
]
package-fixtures = ["physical-admission", "product-schemas", "dep:parquet"]
property-coolprop = [
  "package-fixtures",
  "pse-runtime/property-coolprop",
  "pse-backend-native/coolprop",
]

[dependencies]
pse-compiler = { workspace = true, optional = true }
pse-host = { workspace = true, optional = true }
pse-kernels = { workspace = true, optional = true }
pse-contract.workspace = true
buffa.workspace = true
buffa-codegen.workspace = true
buffa-descriptor.workspace = true
connectrpc-codegen.workspace = true
protoc-gen-protovalidate-buffa.workspace = true
bytes.workspace = true
globset.workspace = true
percent-encoding.workspace = true
surrealdb-types = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema.workspace = true
tracing.workspace = true
surrealdb-parser-next = { workspace = true, optional = true }
libfuzzer-sys = { workspace = true, optional = true }
pse-admission = { workspace = true, optional = true }
pse-operations = { workspace = true, optional = true }
pse-buildinfo.workspace = true
pse-model = { workspace = true, optional = true }
feos = { workspace = true, optional = true }
feos-core = { workspace = true, optional = true }
quantity = { workspace = true, optional = true }
nalgebra = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
pse-columnar.workspace = true
pse-codegen.workspace = true
pse-engine = { workspace = true, optional = true }
pse-diagnostics.workspace = true
datafusion = { workspace = true, optional = true }
url.workspace = true
bindgen = { workspace = true, optional = true }
# The registry and passes consumed by the generators.
pse-schema.workspace = true
pse-authoring = { workspace = true, optional = true }
pse-ids.workspace = true
pse-quantity.workspace = true
pse-relations = { workspace = true, optional = true }
pse-runtime = { workspace = true, optional = true }
pse-rules = { workspace = true, optional = true }
# The boundary documents whose schemas the generator publishes (ADR-0116 Outcome 7).
pse-backend-native = { workspace = true, optional = true }
schemars.workspace = true
serde_json.workspace = true
clap.workspace = true
cargo_metadata.workspace = true
toml.workspace = true
serde.workspace = true
regex.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde-saphyr.workspace = true
pulldown-cmark.workspace = true
anyhow.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["signal"] }
# `codegen --check` regenerates into a scratch directory and diffs both ways (ADR-0051).
tempfile.workspace = true
# Generated contracts and selected producer-file observations; semantic identity uses blake3.
sha2.workspace = true
# Introspect the actual compiled PyO3 boundary; no handwritten API replica.
syn.workspace = true
# Print generated Rust through the library without a rustfmt subprocess.
quote.workspace = true
prettyplease.workspace = true
tree-sitter.workspace = true
tree-sitter-proto.workspace = true
tree-sitter-rust = { workspace = true, optional = true }
miette.workspace = true

[dev-dependencies]
protovalidate-buffa-protos.workspace = true
futures-util.workspace = true
pse-quantity = { workspace = true, features = ["fixtures"] }

[[package.metadata.pse.test-fixtures]]
id = "evidence-service-borrowed"
target = "xtask"
kind = "lib"
required-features = ["evidence-tools"]
ownership = "runner-borrowed"
inputs = ["server", "study-module", "service-helper"]
scope.tests = [
  "development::evidence::tests::evidence_native_scoped_roles_complete_generation_and_cursor_fences",
]

[[bin]]
name = "pse-canonical-recovery-fixture"
path = "src/bin/pse-canonical-recovery-fixture.rs"
required-features = ["canonical-tools"]

[[bin]]
name = "pse-evidence"
path = "src/bin/pse-evidence.rs"
required-features = ["evidence-tools"]

[[bin]]
name = "pse-native-lane"
path = "src/bin/pse-native-lane.rs"
required-features = ["solver-kinsol"]

[[bin]]
name = "frozen-inspection-fuzz"
path = "src/bin/frozen-inspection-fuzz.rs"
required-features = ["fuzz-inspection"]
test = false
doc = false
bench = false

[[bin]]
name = "inspection-fuzz-seeds"
path = "src/bin/inspection-fuzz-seeds.rs"
required-features = ["fuzz-inspection"]
test = false
doc = false
bench = false

# src/bin/pse-canonical-recovery-fixture.rs links this parent-relative module.
# cargo-shear path-module limitation: https://github.com/Boshen/cargo-shear/issues/589
[package.metadata.cargo-shear]
ignored-paths = ["src/canonical_recovery.rs"]
