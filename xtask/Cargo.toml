[package]
name = "xtask"
description = "Workspace driver: codegen, family-check, governance, doc-lint, probe-host, release (plan §3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Never published: this is the repository's own tooling, reached as `cargo xtask`
# (.cargo/config.toml [alias]).
publish = false

[lints]
workspace = true

[features]
default = ["package-fixtures"]
# The bootstrap registry generator must compile without its generated DTO consumers.
package-fixtures = [
  "dep:datafusion",
  "dep:pse-authoring",
  "dep:pse-ids",
  "dep:pse-engine",
  "dep:pse-catalog",
  "dep:pse-relations",
  "dep:pse-runtime",
  "dep:pse-rules",
]

[dependencies]
pse-columnar.workspace = true
pse-codegen.workspace = true
pse-engine = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
url.workspace = true
bindgen.workspace = true
# The registry and the passes the generators and the inspection-fixture driver run.
pse-schema.workspace = true
pse-authoring = { workspace = true, optional = true }
pse-ids = { workspace = true, optional = true }
pse-catalog = { workspace = true, optional = true }
pse-quantity.workspace = true
pse-relations = { workspace = true, optional = true }
pse-runtime = { workspace = true, optional = true }
pse-rules = { workspace = true, optional = true }
serde_json.workspace = true
clap.workspace = true
cargo_metadata.workspace = true
toml.workspace = true
serde.workspace = true
regex.workspace = true
anyhow.workspace = true
semver.workspace = true
tokio.workspace = true
# `codegen --check` regenerates into a scratch directory and diffs both ways (ADR-0051).
tempfile.workspace = true
# python/pse/contracts/GENERATED.sha256 only; identity hashing is blake3 in pse-ids.
sha2.workspace = true
# Introspect the actual compiled PyO3 boundary; no handwritten API replica.
pyo3-introspection.workspace = true
syn.workspace = true
# Store statements: Cornucopia compiles crates/pse-operations/queries into the generated
# crate against a temporary database (ADR-0114 Outcome 24). Non-optional, so the
# `--no-default-features` recipes regenerate it too; prettyplease re-prints its sources
# so the committed bytes never depend on a `$PATH` rustfmt.
cornucopia.workspace = true
tokio-postgres.workspace = true
prettyplease.workspace = true
quote.workspace = true
miette.workspace = true

[dev-dependencies]
pse-quantity = { workspace = true, features = ["fixtures"] }
