version = 3
plan = 14
review_gates = ["G1", "G2", "G3", "G4", "G5", "G6", "G7", "G8", "PS-G1", "PS-G2", "PS-G3"]
inventory = "docs/plans/14-execution-inventory.md"
barrier = "build/plan14/implementation-barrier.json"
development = "build/plan14/development-checks.json"
implementation = ["M00", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09", "M10", "M11", "M12", "M13", "M14", "M15", "M16", "M17", "M18", "M19", "M20", "M21"]
deletions = ["X01", "X02", "X03", "X04", "X05", "X06", "X07", "X08", "X09", "X10", "X11", "X12"]

[[profiles]]
id = "rust-native"
mode = "native-force-validate"
runner = "nextest"
gate = "plan14-native"
packages = ["pse-backend-native", "pse-compiler", "pse-kernels", "pse-math", "pse-runtime", "pse-structural", "pse-tests-conformance"]
features = ["pse-relations/force-validate", "pse-runtime/native-solvers", "pse-tests-conformance/native-acceptance"]
target_args = ["--lib"]
native_environment = ["scripts/native-solver-env.sh", "scripts/native-math-env.sh"]
native_threads = 1

[[profiles]]
id = "rust-boundary"
mode = "pse-relations/force-validate"
runner = "nextest"
gate = "test"

[[profiles]]
id = "python-native"
mode = "python-native"
runner = "pytest"
gate = "plan14-python"
extension_features = ["force-validate", "native-solvers"]
native_environment = ["scripts/native-solver-env.sh", "scripts/native-math-env.sh"]
native_threads = 1

[[profiles]]
id = "python-tools"
mode = "python-tools"
runner = "unittest"
gate = "plan14-tools"

[[profiles]]
id = "performance-native"
mode = "native-force-validate"
runner = "measurement"
gate = "plan14-measure"
features = ["native-process", "pse-relations/force-validate"]
native_threads = 1
process_threads = [1, 4]

