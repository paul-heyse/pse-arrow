[book]
title = "pse-arrow"
description = "Arrow-native process systems engineering core in Rust: the authoritative design, the decisions behind it, and the evidence under both."
authors = ["Paul Heyse"]
language = "en"
# Authored source is staged by scripts/docs.py; navigation is derived. ADR-0095.
src = "."

[build]
build-dir = "book"
create-missing = false
# The default `index` preprocessor renames every README.md chapter to index.html, which
# breaks the `README.md` links the ADRs, plans and reviews carry (they must read on GitHub
# and in the book alike). Only the `links` preprocessor is wanted.
use-default-preprocessors = false

[output.html]
site-url = "/pse-arrow/"
git-repository-url = "https://github.com/paul-heyse/pse-arrow"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/paul-heyse/pse-arrow/edit/main/docs/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = false

[preprocessor.links]
