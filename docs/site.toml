  "external-review-postgresl-options.md",
  "external-review-postgresl-typing-and-other-typing-enhancements.md",
]
scope = "History"

[[overrides]]
patterns = [
  "library-utilization.md",
  "design_review/audit/**/*.md",
  "design_review/test-audit/**/*.md",
  "design_review/reviews/audits/**/*.md",
]
scope = "Reference"

