  "plan36-investigation-evidence",
  "pipeline-performance-optimization-2026-10-17",
  "pipeline-diagnostics-and-review-artifacts-2026-10-18",
  "post-plan44-pipeline-optimization-2026-10-18",
  "unified-state-management-2026-10-10",
]
entrypoints = [
  "README.md",
  "authoritative_design/README.md",
  "plans/README.md",
  "design_review/README.md",
]

[[collections]]
title = "Start here"
root = "."
recursive = false
scope = "Current"

[[collections]]
title = "Architecture"
root = "authoritative_design"
scope = "Current"

[[collections]]
title = "Current work"
root = "plans"
scope = "History"

[[collections]]
title = "Decisions"
root = "adr"
scope = "Reference"

[[collections]]
title = "Design standard and reviews"
root = "design_review"
scope = "History"

[[collections]]
title = "Functional opportunity reviews"
root = "functional_reviews"
scope = "Reference"

[[collections]]
title = "Plan improvement reviews"
root = "plan_improvement_reviews"
scope = "Reference"

[[collections]]
title = "Development"
root = "dev"
scope = "Current"

[[collections]]
title = "Library reference"
root = "capability-maps"
scope = "Reference"

[[collections]]
title = "Library capability overviews"
root = "libraries"
scope = "Reference"

[[collections]]
title = "Generated reference"
root = "generated"
scope = "Reference"

# The blueprint keeps revisions and former anchors only; retained probes support library maps.
[[overrides]]
patterns = [
  "authoritative_design/blueprint.md",
  "design_review/evidence/**/*.md",
]
scope = "Reference"

[[overrides]]
patterns = [
  "design_review/design_principles/core/*.md",
  "design_review/design_principles/profiles/**/*.md",
  "design_review/design_principles/binding/*.md",
]
