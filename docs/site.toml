[tools]
mdbook = "0.5.4"
pagefind = "1.5.2"

[publication]
exclude = ["SUMMARY.md", "generated/rustdoc/**"]
current_work = [
  "plans/28*.md",
  "plans/32-workspace-content-lifecycle.md",
]
assets = [
  "capability-maps/evidence/identity-vectors-adr0050.json",
  "design_review/design_principles/standard.toml",
]
asset_bundles = [
  "agent-effectiveness-enhancements-2026-10-09",
  "blueprint-rev4-2026-09-13",
  "canonical-selection-2026-10-06",
  "efficiency-principles-codebase-2026-10-09",
  "full-arrow-datafusion-2026-09-14",
  "graph-hash-followups-2026-10-09",
  "native-producer-inputs-2026-10-06",
]
entrypoints = [
  "README.md",
  "authoritative_design/README.md",
  "plans/README.md",
  "design_review/README.md",
]

[[collections]]
title = "Start here"
root = "."
recursive = false
scope = "Current"

[[collections]]
title = "Architecture"
root = "authoritative_design"
scope = "Current"

[[collections]]
title = "Current work"
root = "plans"
scope = "History"

[[collections]]
title = "Decisions"
root = "adr"
scope = "Reference"

[[collections]]
title = "Design standard and reviews"
root = "design_review"
scope = "History"

[[collections]]
title = "Development"
root = "dev"
scope = "Current"

[[collections]]
title = "Library reference"
root = "capability-maps"
scope = "Reference"

[[collections]]
title = "Generated reference"
root = "generated"
scope = "Reference"

# The blueprint keeps revisions and former anchors only; retained probes support library maps.
[[overrides]]
patterns = [
  "authoritative_design/blueprint.md",
  "design_review/evidence/**/*.md",
]
scope = "Reference"

[[overrides]]
patterns = [
  "design_review/design_principles/core/*.md",
  "design_review/design_principles/profiles/**/*.md",
  "design_review/design_principles/binding/*.md",
]
scope = "Current"

[[overrides]]
patterns = [
  "external-review-postgresl-options.md",
  "external-review-postgresl-typing-and-other-typing-enhancements.md",
]
scope = "History"

