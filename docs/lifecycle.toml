# Ordered classifications apply only where a native binding selects this profile.
# Implementation/test labels alone do not establish qualification or closure.
[status_profiles.packet]
order = ["blocked", "deferred", "open", "complete"]
blocked = ['(?i)\bblocked\b', '(?i)\bpaused\b']
deferred = ['(?i)^deferred\b']
open = [
  '(?i)\bpending\b',
  '(?i)\bremain(?:s|ing)?\b',
  '(?i)\bin[- ]progress\b',
  '(?i)\bunresolved\b',
  '(?i)\bopen\b',
  '(?i)^planned\b',
  '(?i)^scheduled\b',
  '(?i)^proposed\b',
]
complete = ['(?i)^(?:done|complete|completed|resolved|superseded|disproved)\b']

[status_profiles.finding]
order = ["blocked", "deferred", "open", "complete"]
blocked = ['(?i)^blocked\b', '(?i)^paused\b']
deferred = ['(?i)^deferred\b']
open = [
  '(?i)\bpending\b',
  '(?i)\bunresolved\b',
  '(?i)\bopen\b',
  '(?i)^scheduled\b',
  '(?i)^planned\b',
]
complete = ['(?i)^(?:resolved|superseded|disproved|complete|completed|done)\b']


