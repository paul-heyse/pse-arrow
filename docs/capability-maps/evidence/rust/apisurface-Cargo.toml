# Extraction root for the Arrow 59.3.0 / DataFusion 55.1.0 capability maps.
# Every crate is `=`-pinned individually: pinning only the umbrella does NOT pin
# the family (sub-crates depend on `^`), and `cargo tree -d` does not flag a
# mixed family because a mixed family is not a duplicate.
[package]
name = "pse-apisurface"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# ---------- arrow family @ =59.3.0 (22 publishable workspace members) ----------
arrow = { version = "=59.3.0", features = [
  "ffi", "canonical_extension_types", "ipc", "ipc_compression",
  "prettyprint", "csv", "json", "chrono-tz", "pool",
] }
arrow-arith      = "=59.3.0"
arrow-array      = { version = "=59.3.0", features = ["ffi", "chrono-tz", "pool"] }
arrow-avro       = "=59.3.0"
arrow-buffer     = "=59.3.0"
arrow-cast       = { version = "=59.3.0", features = ["prettyprint"] }
arrow-csv        = "=59.3.0"
arrow-data       = { version = "=59.3.0", features = ["ffi"] }
arrow-flight     = { version = "=59.3.0", features = ["flight-sql-experimental"] }
arrow-ipc        = { version = "=59.3.0", features = ["lz4", "zstd"] }
arrow-json       = "=59.3.0"
arrow-ord        = "=59.3.0"
arrow-row        = "=59.3.0"
arrow-schema     = { version = "=59.3.0", features = ["ffi", "canonical_extension_types"] }
arrow-select     = "=59.3.0"
arrow-string     = "=59.3.0"
parquet          = { version = "=59.3.0", features = ["arrow", "async", "object_store"] }
parquet-variant         = "=59.3.0"
parquet-variant-compute = "=59.3.0"
parquet-variant-json    = "=59.3.0"

# ---------- datafusion family @ =55.1.0 ----------
datafusion = { version = "=55.1.0", features = ["serde"] }
datafusion-catalog                    = "=55.1.0"
datafusion-catalog-listing            = "=55.1.0"
datafusion-common                     = "=55.1.0"
datafusion-common-runtime             = "=55.1.0"
datafusion-datasource                 = "=55.1.0"
datafusion-datasource-arrow           = "=55.1.0"
datafusion-datasource-csv             = "=55.1.0"
datafusion-datasource-json            = "=55.1.0"
datafusion-datasource-parquet         = "=55.1.0"
datafusion-doc                        = "=55.1.0"
datafusion-execution                  = "=55.1.0"
datafusion-expr                       = "=55.1.0"
datafusion-expr-common                = "=55.1.0"
datafusion-ffi                        = "=55.1.0"
datafusion-functions                  = "=55.1.0"
datafusion-functions-aggregate        = "=55.1.0"
datafusion-functions-aggregate-common = "=55.1.0"
datafusion-functions-nested           = "=55.1.0"
datafusion-functions-table            = "=55.1.0"
datafusion-functions-window           = "=55.1.0"
datafusion-functions-window-common    = "=55.1.0"
datafusion-macros                     = "=55.1.0"
datafusion-optimizer                  = "=55.1.0"
datafusion-physical-expr              = "=55.1.0"
datafusion-physical-expr-adapter      = "=55.1.0"
datafusion-physical-expr-common       = "=55.1.0"
datafusion-physical-optimizer         = "=55.1.0"
datafusion-physical-plan              = "=55.1.0"
datafusion-proto                      = "=55.1.0"
datafusion-proto-common               = "=55.1.0"
datafusion-pruning                    = "=55.1.0"
datafusion-session                    = "=55.1.0"
datafusion-spark                      = "=55.1.0"
datafusion-sql                        = "=55.1.0"
datafusion-substrait                  = "=55.1.0"

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
prost = "0.14"

bytes = "1"

[workspace]
