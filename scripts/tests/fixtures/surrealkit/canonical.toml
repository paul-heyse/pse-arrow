name = "production_generated_contract"
tags = ["canonical"]

[actors.inspection]
kind = "namespace"
username_env = "PSE_SURREALKIT_INSPECTION_USER"
password_env = "PSE_SURREALKIT_INSPECTION_PASSWORD"

[[fixtures]]
sql = "CREATE canonical_guards:exact SET key='exact', generation=18446744073709551615dec, incarnation='fixture'; CREATE canonical_payload_blocks:exact SET key='exact', version='fixture', ordinal=18446744073709551615dec, payload=encoding::base64::decode('AAEA/w=='), digest='fixture';"

[[cases]]
name = "deadline_function_live"
kind = "sql_expect"
sql = "RETURN fn::pse_execution_v1::deadline(time::micros()+60000000);"
allow = true
[[cases.assertions]]
path = ""
equals = true

[[cases]]
name = "deadline_function_expired"
kind = "sql_expect"
sql = "RETURN fn::pse_execution_v1::deadline(0);"
allow = false
error_contains = "PSE_REFUSAL:original_canonical_rpc_deadline_expired"

[[cases]]
name = "decimal_u64_exact"
kind = "sql_expect"
sql = "RETURN <string>(SELECT VALUE generation FROM ONLY canonical_guards:exact);"
allow = true
[[cases.assertions]]
path = ""
equals = "18446744073709551615"

[[cases]]
name = "immutable_bytes_exact"
kind = "sql_expect"
sql = "RETURN encoding::base64::encode((SELECT VALUE payload FROM ONLY canonical_payload_blocks:exact));"
allow = true
[[cases.assertions]]
path = ""
equals = "AAEA/w"

[[cases]]
name = "decimal_integral_assertion"
kind = "sql_expect"
sql = "CREATE canonical_guards:invalid SET key='invalid', generation=1.5dec, incarnation='fixture';"
allow = false
error_contains = "but field must conform to:"

[[cases]]
name = "enforced_endpoint_refusal"
kind = "sql_expect"
sql = "RELATE canonical_analysis_nodes:absent->canonical_analysis_edges:absent->canonical_analysis_nodes:missing SET key='absent',analysis='fixture',source='absent',target='missing',kind='fixture';"
allow = false
error_contains = "The record 'canonical_analysis_nodes:absent' does not exist"

[[cases]]
name = "definitions_do_not_activate"
kind = "sql_expect"
sql = "RETURN (SELECT * FROM canonical_interpretations);"
allow = true
[[cases.assertions]]
path = ""
equals = []

[[cases]]
name = "inspection_reads_but_cannot_create"
kind = "permissions_matrix"
actor = "inspection"
table = "canonical_guards"
record_id = "exact"
[[cases.rules]]
action = "select"
allow = true
[[cases.rules]]
action = "create"
allow = false

[[cases]]
name = "inspection_create_empty_response_is_not_authorization"
kind = "sql_expect"
actor = "inspection"
sql = "CREATE canonical_guards:viewer_forbidden SET key='viewer_forbidden', generation=0dec, incarnation='fixture';"
allow = true
[[cases.assertions]]
path = ""
equals = []

[[cases]]
name = "independent_privileged_readback_refuses_viewer_write"
kind = "sql_expect"
sql = "SELECT * FROM canonical_guards:viewer_forbidden;"
allow = true
[[cases.assertions]]
path = ""
equals = []
