# TOML formatting. One canonical shape so nobody argues about array wrapping.
exclude = [
  ".venv*/**",
  ".claude/worktrees/**",
  "target/**",
  "external/**",
  "vendor/**",
  "build/**",
  "docs/book/**",
  "docs/capability-maps/evidence/**",
  # Entire skill bundles are outside the product lint/format scope.
  ".codex/skills/**",
  ".claude/skills/**",
  ".agents/skills/**",
  # Reference material kept until the thermodynamics work lands; not product source.
  "thermodynamics_complete_conversation_handoff/**",
  # Authored package sources keep the layout their authors wrote; they are package
  # inputs, not repository configuration.
  "packages/**",
  "tooling/dfarrow-apiex/target/**",
  "tooling/dfarrow-apiex/verify/target/**",
  # Generated TOML is written by its generator, never reformatted.
  "crates/*/src/generated/**",
  "crates/pse-operations-queries/**",
  # cargo-hakari owns this manifest's layout; `hakari generate --diff` compares it.
  "crates/pse-workspace-hack/Cargo.toml",
]

[formatting]
# Arrays one entry per line: a diff that adds a dependency or an exclusion is one line.
array_auto_expand = true
array_auto_collapse = false
# Never reorder: the pin tables in Cargo.toml and the lint selection in pyproject.toml
# are ordered deliberately.
reorder_keys = false
reorder_arrays = false
