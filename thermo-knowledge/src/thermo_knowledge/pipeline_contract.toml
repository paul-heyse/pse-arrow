doc = """
The shape of the declaration that the pipeline's stage code depends on (meta-model section 5).

Stage code writes and reads canonical rows of these kinds and relations by name: the canonical
writer creates a carrier's provenance rows and computes the text keys that restate references,
resolution writes species and source entities, the mapping framework writes derivations,
coverage and held rows, and qualification writes runs and reads validity regions. The declaration
loader compares the loaded declaration with this file and refuses a mismatch with a located
diagnostic (code `pipeline-contract`). The code takes every name from
`thermo_knowledge.pipeline_contract`, which reads this file, so a name it uses that this file
does not list is an error at import.

An entry lists the attributes (of a kind), keys and columns (of a relation) the code reads or
writes, each with the type the declaration spells (`type`). `optional = true` states that the
declaration leaves the value optional, and `defaulted = true` that the code relies on a declared
default; a value stated as neither is required and has no default. A kind states its `schema`
and its `identity` (a root kind) or the kind it `extends`; a relation states its `schema`; an
enum lists the `members` the code names.
"""

[kinds.source]
schema = "prov"
identity = ["key"]
attributes.key = { type = "Text" }
attributes.title = { type = "Text" }

[kinds.carrier]
schema = "prov"
extends = "source"
attributes.manifest_id = { type = "Text" }
attributes.resolved_pin = { type = "Text" }
attributes.tree_hash = { type = "Hash" }
attributes.retrieved = { type = "Timestamp" }

[kinds.software_release]
schema = "prov"
extends = "source"
attributes.version = { type = "Text" }

[kinds.publication]
schema = "prov"
