id = "aga8"
title = "NIST AGA8 and GERG-2008 reference code"
tier = "B"
homepage = "https://github.com/usnistgov/AGA8"
waves = [2]
notes = "No tags. Constants live in SetupGERG, SetupDetail and SetupGross; some stored values are pre-combined for speed and are not verbatim published coefficients. Test programs hold 16-digit reference values."

[acquire]
kind = "git"
url = "https://github.com/usnistgov/AGA8.git"
commit = "3bdb9ab8ff317c618b0b59d1b704c2c86ddc5fce"
submodules = []
sparse = []

[payload]
reader = "aga8"
environment = "core"
include = ["AGA8CODE/**", "TESTDATA/**"]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
statement = "LICENSE: permission to use, copy, modify, create derivative works and distribute without fee, provided the notice and disclaimer of warranty appear in all copies."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
