id = "sigma_profiles_pyscf"
title = "Open PySCF COSMO-SAC sigma profiles"
tier = "B"
homepage = "https://doi.org/10.5281/zenodo.20672192"
waves = [3]
notes = "Zenodo record 20672192, version 1.0.0 (2026-06-12): 361,583 molecules. Profiles need the refitted model constants in sequential_final_params.json, not the Hsieh 2010 defaults. A new single-author dataset whose paper citation is still open; validate before relying on it. The 267 MB raw tarball is not acquired."

[acquire]
kind = "file"
files = [
  { url = "https://zenodo.org/records/20672192/files/sigma_profiles_main.parquet?download=1", name = "sigma_profiles_main.parquet", md5 = "2cab3d916c4ec1edf35fa4cf9ff149f3" },
  { url = "https://zenodo.org/records/20672192/files/sigma_profile_index.parquet?download=1", name = "sigma_profile_index.parquet" },
  { url = "https://zenodo.org/records/20672192/files/sequential_final_params.json?download=1", name = "sequential_final_params.json" },
  { url = "https://zenodo.org/records/20672192/files/integrity_results.json?download=1", name = "integrity_results.json" },
]

[payload]
reader = "sigma_profiles_pyscf"
environment = "core"
include = ["*.parquet", "sequential_final_params.json"]
exclude = []

[[rights]]
scope = "data"
basis = "licence_grant"
spdx = "CC-BY-4.0"
statement = "Zenodo metadata: CC-BY-4.0."
url = "https://doi.org/10.5281/zenodo.20672192"
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
