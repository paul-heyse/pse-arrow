id = "chemicals"
title = "chemicals"
tier = "A"
homepage = "https://github.com/CalebBell/chemicals"
waves = [1, 7]
notes = "Tag and master have diverged; the commit is the pin. TSVs are keyed on CAS with a header row; the identifier TSVs are headerless and positional. One PubChem identifier file is 42 MB."

[acquire]
kind = "git"
url = "https://github.com/CalebBell/chemicals.git"
commit = "7fca9acf7708e2a646bc04d2b6f6996d0325e77d"
tag = "v1.5.2"
submodules = []
sparse = []

[payload]
reader = "chemicals"
environment = "core"
include = [
  "chemicals/**/*.tsv",
  "chemicals/**/*.json",
  "chemicals/**/*.csv",
  "chemicals/**/*.gz",
  "chemicals/**/*.xml",
  "chemicals/**/*.zip",
  "chemicals/**/*.txt",
]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE.txt: MIT."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "data"
basis = "not_stated"
statement = "Data files are derived from handbooks and databases named in the file names (CRC, Perry's, Yaws, VDI, Landolt-Boernstein, Poling, PubChem, NIST WebBook, JANAF, ATcT). No separate statement on the data."
store = "yes"
redistribute = "not_stated"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
