id = "phreeqc"
title = "PHREEQC 3"
tier = "A"
homepage = "https://www.usgs.gov/software/phreeqc-version-3"
waves = [4, 7]
notes = "Official repository (formerly usgs-coupled/phreeqc3). The USGS download directory tops out at 3.8.6; the GitHub release is 3.9.0. Sparse: the repository is 402 MB. database/ is a git subtree."

[acquire]
kind = "git"
url = "https://github.com/phreeqc-dev/phreeqc3.git"
commit = "b0b3be767158ccc3322d2c816625cf470045e67e"
tag = "v3.9.0"
submodules = []
sparse = ["database", "src", "doc/NOTICE.TXT"]

[payload]
reader = "phreeqc"
environment = "core"
include = ["database/**"]
exclude = []

[[rights]]
scope = "code"
basis = "public_domain"
statement = "No LICENSE file; doc/NOTICE.TXT is a USGS User Rights Notice: public property, with a condition that modified versions carry notice of modification."
store = "yes"
redistribute = "with_conditions"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "database/OtherDatabases/**"
basis = "not_stated"
statement = "Third-party databases (CEMDATA18, THEREDA 2020, ThermoChimie v10a, PSI/Nagra 12/07); terms vary per file."
store = "yes"
redistribute = "not_stated"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
