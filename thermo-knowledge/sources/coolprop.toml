id = "coolprop"
title = "CoolProp"
tier = "A"
homepage = "https://github.com/CoolProp/CoolProp"
waves = [2, 7]
notes = "One JSON per fluid: Helmholtz terms, ideal-gas terms, ancillaries, transport, states. REFPROP is not bundled."

[acquire]
kind = "git"
url = "https://github.com/CoolProp/CoolProp.git"
commit = "ae81610e7d23efc57f9d051c8e70a4d66e87537f"
tag = "v8.0.0"
submodules = []
sparse = []

[payload]
reader = "coolprop"
environment = "core"
include = [
  "dev/fluids/*.json",
  "dev/mixtures/**",
  "dev/cubics/*.json",
  "dev/pcsaft/*.json",
  "dev/incompressible_liquids/**",
]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE: MIT."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "dev/incompressible_liquids/**"
basis = "not_stated"
statement = "Incompressible-fluid data derives from SecCool and vendor property grids (DATA_AUDIT.md, present on master after the tag)."
store = "yes"
redistribute = "not_stated"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
