id = "thermohub"
title = "ThermoHub datasets"
tier = "A"
homepage = "https://github.com/thermohub/thermohub"
waves = [4]
notes = "Git mirror of the ThermoHub database; one commit after tag v1.2.0. The live ArangoDB server is not used."

[acquire]
kind = "git"
url = "https://github.com/thermohub/thermohub.git"
commit = "c3e4acf4531204e4c2974c2d4ac5a1b96f37d5ba"
submodules = []
sparse = []

[payload]
reader = "thermohub"
environment = "core"
include = ["thermofun/**/*.json", "arangodb/**"]
exclude = []

[[rights]]
scope = "data"
basis = "licence_grant"
spdx = "GPL-3.0-only"
statement = "LICENSE: GPL-3.0."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = true
observed = "2026-09-30 reconnaissance"
