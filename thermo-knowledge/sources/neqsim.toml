id = "neqsim"
title = "NeqSim"
tier = "A"
homepage = "https://github.com/equinor/neqsim"
waves = [2, 3, 4, 8]
notes = "Sparse: the repository tree is 307 MB including books and papers. CSVs have SQL column names in the first row. COMP_EXT.csv is 85 MB; the .bak copies are excluded from reading."

[acquire]
kind = "git"
url = "https://github.com/equinor/neqsim.git"
commit = "280152d97763672fb79c9139e421adf85663a930"
tag = "v3.23.0"
submodules = []
sparse = [
  "src/main/resources/data",
  "src/main/java/neqsim/thermo",
  "src/main/java/neqsim/physicalproperties",
  "src/main/java/neqsim/util/database",
]

[payload]
reader = "neqsim"
environment = "core"
include = [
  "src/main/resources/data/**/*.csv",
  "src/main/resources/data/**/*.json",
]
exclude = ["**/*.bak"]

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "Apache-2.0"
statement = "LICENSE: Apache-2.0."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "src/main/resources/data/**"
basis = "not_stated"
statement = "Bundled tables include third-party material (a PHREEQC pitzer.dat copy, ISO 6976 tables). No per-file statement."
store = "yes"
redistribute = "not_stated"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
