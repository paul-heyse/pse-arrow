id = "pyprism"
title = "pyPRISM"
tier = "A"
homepage = "https://github.com/usnistgov/pyPRISM"
waves = [8]
notes = "Tutorial reference curves only. PyPI has only 1.0.4; the oracle installs from this tag."

[acquire]
kind = "git"
url = "https://github.com/usnistgov/pyPRISM.git"
commit = "f194a987754e725f118ab952bbc3cef507f20176"
tag = "v2.0.0"
submodules = []
sparse = []

[payload]
reader = "pyprism"
environment = "core"
include = ["data/**"]
exclude = []

[[rights]]
scope = "code"
basis = "public_domain"
statement = "LICENSE: NIST licence (GitHub reports it as unclassified)."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
