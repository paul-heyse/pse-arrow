id = "isodb"
title = "NIST ISODB adsorption isotherms"
tier = "B"
homepage = "https://adsorption.nist.gov/"
waves = [6]
notes = "Official mirror of the ISODB API; the API itself is disallowed by robots.txt and is not used. Isotherm JSON in DOI folders. Whether the mirror carries the adsorbent registry is not verified."

[acquire]
kind = "git"
url = "https://github.com/NIST-ISODB/isodb-library.git"
commit = "9e1ee472967d66ec7845e23c5d5b986eca5ff020"
submodules = []
sparse = []

[payload]
reader = "isodb"
environment = "core"
include = ["Library/**/*.json", "DOI_mapping.csv"]
exclude = []

[[rights]]
scope = "data"
basis = "not_stated"
statement = "Site footer: copyright 2016 by the U.S. Department of Commerce on behalf of the United States of America; all rights reserved."
url = "https://adsorption.nist.gov/"
store = "not_stated"
redistribute = "no"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
