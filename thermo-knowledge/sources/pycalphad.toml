id = "pycalphad"
title = "pycalphad"
tier = "A"
homepage = "https://github.com/pycalphad/pycalphad"
waves = [5]
notes = "Default branch is develop. symengine caps the environment at Python 3.13."

[acquire]
kind = "git"
url = "https://github.com/pycalphad/pycalphad.git"
commit = "2d4c744ddb890e179542894d070150797e13b325"
tag = "0.11.2"
submodules = []
sparse = []

[payload]
reader = "pycalphad"
environment = "core"
include = ["examples/databases/**", "pycalphad/tests/databases/**"]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE.txt: MIT."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "data"
basis = "not_stated"
statement = "Example and test databases come from published assessments, each with its own provenance."
store = "yes"
redistribute = "not_stated"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
