id = "cosmosac_nist"
title = "NIST COSMO-SAC and the UD and VT-2005 profile databases"
tier = "B"
homepage = "https://github.com/usnistgov/COSMOSAC"
waves = [3]
notes = "HEAD, later than tag v1.0.1. profiles/UD holds 2,261 cosmo and sigma files; profiles/VT2005 holds 1,432 profiles. The original Virginia Tech site is gone."

[acquire]
kind = "git"
url = "https://github.com/usnistgov/COSMOSAC.git"
commit = "1b82456be38026719b16cad4076109bef3fcb309"
submodules = []
sparse = []

[payload]
reader = "cosmosac_nist"
environment = "core"
include = ["profiles/**"]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE: MIT."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "profiles/UD/**"
basis = "terms_of_use"
statement = "UD Readme.txt: the database can be freely used for non-profit, academic purposes; redistribution without the consent of the authors is prohibited. Repository README: permission from BioVia was obtained to make the .cosmo files available for academic, non-commercial use."
store = "yes"
redistribute = "no"
commercial = "no"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "profiles/VT2005/**"
basis = "not_stated"
statement = "No licence file in the VT2005 folder."
store = "yes"
redistribute = "not_stated"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
