id = "pygaps"
title = "pyGAPS"
tier = "A"
homepage = "https://github.com/pauliacomi/pyGAPS"
waves = [8]
notes = "default.db is reported to be SQLite (not verified)."

[acquire]
kind = "git"
url = "https://github.com/pauliacomi/pyGAPS.git"
commit = "34279c1bd373adfbde054ca75e33b695d1151a2b"
tag = "v4.6.1"
submodules = []
sparse = []

[payload]
reader = "pygaps"
environment = "core"
include = ["src/pygaps/data/**", "docs/examples/data/**"]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE: MIT."
store = "yes"
