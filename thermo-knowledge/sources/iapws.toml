id = "iapws"
title = "IAPWS releases, supplementary releases, guidelines and advisory notes"
tier = "B"
homepage = "https://iapws.org/"
waves = [2, 7]
notes = "One index page (technical-guidance/release) lists 43 documents: 16 releases, 7 supplementary releases, 14 guidelines and 6 advisory notes. Each document page has its PDF at <document page>.download, which redirects to /public/documents/<id>/<file>.pdf; the enumerator stores each as <slug>.pdf. The PDFs hold coefficient and verification tables. Pin is the document identifier plus the per-file hash."

[acquire]
kind = "pages"
enumerator = "iapws"
min_interval_seconds = 5
urls = ["https://iapws.org/technical-guidance/release"]

[payload]
reader = "iapws"
environment = "core"
include = ["*.pdf"]
exclude = []

[[rights]]
scope = "data"
basis = "licence_grant"
statement = "IAPWS-95 cover page: \"Publication in whole or in part is allowed in all countries provided that attribution is given to the International Association for the Properties of Water and Steam\". Verified on IAPWS-95 only; the same wording is expected on the other documents."
url = "https://iapws.org/technical-guidance/release/IAPWS-95"
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 from the IAPWS-95 cover page"
