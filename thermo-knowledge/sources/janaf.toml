id = "janaf"
title = "NIST-JANAF Thermochemical Tables"
tier = "B"
homepage = "https://janaf.nist.gov/"
waves = [1]
notes = "NIST Standard Reference Database 13, DOI 10.18434/T42S31; data content last updated 1998. No bulk download and no robots.txt (404). The formula index is a plain-text listing without links; the enumerator reads it and dat/janaf.json (the site's own search list of 1,796 species-phase table codes) and fetches each tables/<code>.txt. Tables are tab-delimited with the columns T(K), Cp, S, -[G-H(Tr)]/T, H-H(Tr), delta-f H, delta-f G, log Kf; units are not in the files; transition markers appear inline. Pin is the retrieval date plus the per-file hashes."

[acquire]
kind = "pages"
enumerator = "janaf"
min_interval_seconds = 5
urls = ["https://janaf.nist.gov/formula.html"]

[payload]
reader = "janaf"
environment = "core"
include = ["*.txt"]
exclude = []

[[rights]]
scope = "data"
basis = "terms_of_use"
statement = "Credits page: \"Copyright 1986 by the U.S. Department of Commerce on behalf of the United States. All rights reserved.\""
url = "https://janaf.nist.gov/janbanr.html"
store = "not_stated"
redistribute = "no"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 from the credits page"

[[rights]]
scope = "data"
basis = "licence_grant"
statement = "The data.nist.gov record for SRD 13 (DOI 10.18434/T42S31) lists the NIST open licence."
url = "https://www.nist.gov/open/license"
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 from the data.nist.gov record"
