id = "rmg_database"
title = "RMG-database"
tier = "A"
homepage = "https://github.com/ReactionMechanismGenerator/RMG-database"
waves = [3, 7]
notes = "Python-syntax entry(...) files and adjacency-list dictionaries; read with RMG's own loader. thermo/ml holds neural-network weights, which are not rows."

[acquire]
kind = "git"
url = "https://github.com/ReactionMechanismGenerator/RMG-database.git"
commit = "fc7bb138f9380f1274cc9645ef6586c83dda450e"
tag = "4.0.0"
submodules = []
sparse = []

[payload]
reader = "rmg_database"
environment = "rmg"
include = ["input/**"]
exclude = ["input/thermo/ml/**"]

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "No LICENSE file; the MIT text is in the setup.py header."
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"

[[rights]]
scope = "input/**"
basis = "not_stated"
statement = "Libraries derive from many publications, cited per library."
store = "yes"
redistribute = "not_stated"
commercial = "not_stated"
attribution = true
share_alike = false
observed = "2026-09-30 reconnaissance"
