# Curated identity decisions: the only hand-maintained resolution authority (docs/pipeline.md
# section 1, rule 1). Everything else about identity is derived from the sources' own
# assertions by `tk resolve` and recomputed on every run.
#
# A decision names a source entity by the manifest id of its carrier, its scope and its local
# key, and carries a reason. The format is documented in docs/pipeline.md (section 1.1):
#
#   [[decision]]
#   action = "identify"      # the entity is this canonical entity
#   entity = { carrier = "coolprop", scope = "fluids", key = "R1123" }
#   class = "species"        # species, defined_mixture, material or polymer_type
#   canonical_key = "ZWQIPCQCAOKXDI-UHFFFAOYSA-N"
#   charge = 0               # optional, default 0, species only
#   reason = "why"
#
#   [[decision]]
#   action = "distinct"      # two entities that are different identities
#   entities = [
#     { carrier = "coolprop", scope = "fluids", key = "A" },
#     { carrier = "thermo", scope = "chemicals", key = "B" },
#   ]
#   reason = "why"
#
#   [[decision]]
#   action = "reject"        # the source's identification of the entity is wrong
#   entity = { carrier = "coolprop", scope = "fluids", key = "C" }
#   reason = "why"
#

# ---------------------------------------------------------------------------------------------
# Thermochemical sources (Cantera, NASA CEA, NIST-JANAF; Plan 24 wave 1, packet M1).
#
# Their mappings declare a formula-identified scope: a species form is identified by the Hill
# formula and charge its source states, with its aggregation and polymorph. That is sound only while
# the formula names one species. Where a source itself lists several species under one formula --
# isomers, the electronic states of a radical, the isomeric radicals of a combustion mechanism --
# the formula does not say which an entry is, so each such entry is rejected here: it keeps its own
# provisional entity, its records load, and nothing joins it to another carrier's entry.
#
# The rule that gives the entries (tests/identity_support.py states it and
# tests/test_identity_decisions.py checks this file against it): two entities of one unit -- one
# Cantera file, the NASA CEA file, the JANAF tables -- with the same formula, charge, aggregation and
# polymorph and different names (compared without case; a JANAF name is cut at its first comma, so
# the polymorphs and pressures of one substance are not counted as different) are different species.
# The evidence of each decision is the list of names its unit gives.

