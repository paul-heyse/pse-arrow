module = "aqueous_electrolyte"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "reactions",
  "parameters",
]
doc = """
Aqueous and electrolyte chemistry: the temperature dependence of the equilibrium constant of a
reaction written on a stated basis, the ion-interaction parameters of the Pitzer and the
specific-interaction (SIT) models, and the standard-state model of a species assembled from a
general equation of state, which a substance chooses for itself. A reaction is its stoichiometry
as written, so the constants of two reactions that differ by the basis they are written on are the
constants of two reactions and nothing is re-based here. The activity model of a database is the
assembly a mapping declares for it; the site amounts of an exchanger or a surface belong to a
problem, not to the knowledge base, and are not here.
"""

# ---------------------------------------------------------------- equilibrium constants

[contracts.equilibrium_constant_log10]
doc = "The base-ten logarithm of the equilibrium constant of a reaction as written, with activities on the standard states of its participants, at a temperature."
roles.r = { type = "reaction", doc = "The reaction, on the basis it is written on." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
outputs.log_k = { type = "Scalar", observable = "log10_equilibrium_constant", doc = "log10 of the equilibrium constant." }

[forms.log_k_analytic]
doc = "log10 K = A1 + A2 T + A3 / T + A4 log10 T + A5 / T^2 + A6 T^2, with T in kelvin: the analytic expression a database states for the constant of a reaction."
implements = "equilibrium_constant_log10"
completeness = "fully_declared"
status = "expressed"

[forms.log_k_analytic.slot_groups.reaction]
doc = "The six coefficients of one reaction."
subject.r = { type = "reaction", doc = "The reaction." }

[forms.log_k_analytic.slot_groups.reaction.slots]
A1 = { type = "Scalar", doc = "Constant term." }
A2 = { type = "Scalar / Temperature", doc = "Coefficient of T." }
A3 = { type = "TemperatureDifference", doc = "Coefficient of 1 / T, signed." }
A4 = { type = "Scalar", doc = "Coefficient of log10 T." }
A5 = { type = "Temperature^2", doc = "Coefficient of 1 / T^2." }
A6 = { type = "Scalar / Temperature^2", doc = "Coefficient of T^2." }

[forms.log_k_analytic.outputs]
log_k = "reaction.A1[r] + reaction.A2[r] * T + reaction.A3[r] / T + reaction.A4[r] * log10(T / unit('K')) + reaction.A5[r] / T ** 2 + reaction.A6[r] * T ** 2"

[forms.log_k_van_t_hoff]
doc = "log10 K(T) = log10 K(298.15 K) - dH / (R ln 10) (1 / T - 1 / 298.15 K): the constant at the reference temperature and a reaction enthalpy taken constant. The gas constant is that of the convention set."
implements = "equilibrium_constant_log10"
completeness = "fully_declared"
status = "expressed"
conventions = ["gas_constant"]

[forms.log_k_van_t_hoff.slot_groups.reaction]
doc = "The constant at 298.15 K and the enthalpy of one reaction."
subject.r = { type = "reaction", doc = "The reaction." }

[forms.log_k_van_t_hoff.slot_groups.reaction.slots]
log_k_ref = { type = "Scalar", doc = "log10 K at 298.15 K." }
delta_h = { type = "MolarEnergy", doc = "Reaction enthalpy, constant in temperature." }

[forms.log_k_van_t_hoff.let]
R = "convention.gas_constant"

[forms.log_k_van_t_hoff.outputs]
log_k = "reaction.log_k_ref[r] - reaction.delta_h[r] / (R * log(10)) * (1 / T - 1 / (298.15 * unit('K')))"

# ---------------------------------------------------------------- Pitzer

[contracts.pitzer_ion_pair_virial]
doc = "The second and third virial coefficients of the Pitzer model for one cation-anion pair as functions of the ionic strength: the osmotic B and C."
roles.cation = { type = "species", doc = "The cation." }
roles.anion = { type = "species", doc = "The anion." }
arguments.I = { type = "Molality", doc = "Ionic strength, on the molality scale." }
outputs.B_phi = { type = "Scalar / Molality", doc = "The osmotic second virial coefficient of the pair." }
outputs.C_phi = { type = "Scalar / Molality^2", doc = "The osmotic third virial coefficient of the pair." }

[forms.pitzer_ion_pair]
doc = "B^phi = beta0 + beta1 exp(-alpha1 sqrt(I)) + beta2 exp(-alpha2 sqrt(I)) and C^phi, for a cation-anion pair. The pair is ordered, cation first. The alpha are the numbers of kg^(1/2) mol^(-1/2) the model states for I in mol/kg, which is why they are scalars here."
implements = "pitzer_ion_pair_virial"
completeness = "fully_declared"
status = "expressed"

[forms.pitzer_ion_pair.slot_groups.pair]
doc = "The parameters of one cation-anion pair."
subject.cation = { type = "species", doc = "The cation." }
subject.anion = { type = "species", doc = "The anion." }
transposition = { rule = "ordered", roles = ["cation", "anion"], diagonal = "forbidden" }

[forms.pitzer_ion_pair.slot_groups.pair.slots]
beta0 = { type = "Scalar / Molality", doc = "The first second-virial coefficient." }
beta1 = { type = "Scalar / Molality", doc = "The second second-virial coefficient." }
beta2 = { type = "Scalar / Molality", doc = "The third second-virial coefficient, for pairs of ions of high charge." }
alpha1 = { type = "Scalar", doc = "The exponent constant of beta1." }
alpha2 = { type = "Scalar", doc = "The exponent constant of beta2." }
C_phi = { type = "Scalar / Molality^2", doc = "The third virial coefficient of the pair." }

[forms.pitzer_ion_pair.let]
root = "sqrt(I / unit('mol/kg'))"

[forms.pitzer_ion_pair.outputs]
B_phi = "pair.beta0[cation, anion] + pair.beta1[cation, anion] * exp(-pair.alpha1[cation, anion] * root) + pair.beta2[cation, anion] * exp(-pair.alpha2[cation, anion] * root)"
C_phi = "pair.C_phi[cation, anion]"

[contracts.pitzer_unlike_ion_pair]
doc = "The mixing parameter theta of two ions of the same sign of charge."
roles.i = { type = "species", doc = "One ion." }
roles.j = { type = "species", doc = "The other ion, of the same sign." }
outputs.theta = { type = "Scalar / Molality", doc = "The parameter theta." }

[forms.pitzer_theta]
doc = "theta_ij of two ions of one sign, the same in either order."
implements = "pitzer_unlike_ion_pair"
completeness = "fully_declared"
status = "expressed"

[forms.pitzer_theta.slot_groups.pair]
doc = "The parameter of one pair of like ions."
subject.i = { type = "species", doc = "One ion." }
subject.j = { type = "species", doc = "The other ion." }
transposition = { rule = "symmetric", roles = ["i", "j"], diagonal = "forbidden" }

[forms.pitzer_theta.slot_groups.pair.slots]
theta = { type = "Scalar / Molality", doc = "The parameter." }

[forms.pitzer_theta.outputs]
theta = "pair.theta[i, j]"

[contracts.pitzer_ion_triplet]
doc = "The mixing parameter psi of two ions of one sign and an ion of the opposite sign."
roles.i = { type = "species", doc = "One ion of the like pair." }
roles.j = { type = "species", doc = "The other ion of the like pair." }
roles.k = { type = "species", doc = "The ion of the opposite sign." }
outputs.psi = { type = "Scalar / Molality^2", doc = "The parameter psi." }

[forms.pitzer_psi]
doc = "psi_ijk of a like pair and the third ion: the same whichever of the like pair is named first, so the triplet is held once for the order its source asserted."
implements = "pitzer_ion_triplet"
completeness = "fully_declared"
status = "expressed"

[forms.pitzer_psi.slot_groups.triplet]
doc = "The parameter of one triplet."
subject.i = { type = "species", doc = "One ion of the like pair." }
subject.j = { type = "species", doc = "The other ion of the like pair." }
subject.k = { type = "species", doc = "The ion of the opposite sign." }
transposition = { rule = "symmetric", roles = ["i", "j"], diagonal = "forbidden" }

[forms.pitzer_psi.slot_groups.triplet.slots]
psi = { type = "Scalar / Molality^2", doc = "The parameter." }

[forms.pitzer_psi.outputs]
psi = "triplet.psi[i, j, k]"

# ---------------------------------------------------------------- specific interaction theory

[contracts.sit_ion_interaction]
doc = "The contribution of the specific interaction of two oppositely charged ions to the base-ten logarithm of the activity coefficient of the first, at a molality of the second."
roles.i = { type = "species", doc = "The ion whose activity coefficient is written." }
roles.j = { type = "species", doc = "The ion of opposite charge." }
arguments.m = { type = "Molality", doc = "Molality of the second ion." }
outputs.log10_gamma_term = { type = "Scalar", doc = "The term epsilon(i, j) m_j." }

[forms.sit_epsilon]
doc = "epsilon(i, j) m_j: the interaction coefficient is the same for the pair in either order."
implements = "sit_ion_interaction"
completeness = "fully_declared"
status = "expressed"

[forms.sit_epsilon.slot_groups.pair]
doc = "The interaction coefficient of one pair."
subject.i = { type = "species", doc = "One ion." }
subject.j = { type = "species", doc = "The other ion." }
transposition = { rule = "symmetric", roles = ["i", "j"], diagonal = "forbidden" }

[forms.sit_epsilon.slot_groups.pair.slots]
epsilon = { type = "Scalar / Molality", doc = "The interaction coefficient." }

[forms.sit_epsilon.outputs]
log10_gamma_term = "pair.epsilon[i, j] * m"

# ---------------------------------------------------------------- the standard state of a species, assembled

[contracts.aqueous_standard_gibbs]
doc = "The standard-state molar Gibbs energy of an aqueous species form at a temperature and pressure."
roles.i = { type = "species_form", doc = "The species form." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.G0 = { type = "MolarEnergy", observable = "standard_molar_gibbs_energy", doc = "Standard-state molar Gibbs energy." }

[contracts.aqueous_standard_part]
doc = "The standard-state molar Gibbs energy of a species form as a general equation of state."
roles.i = { type = "species_form", doc = "The species form." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.dG = { type = "MolarEnergy", doc = "The standard-state molar Gibbs energy." }

[contracts.solvent_permittivity]
doc = "The relative permittivity of the solvent."
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.value = { type = "Scalar", doc = "Relative permittivity." }

[contracts.solvent_density]
doc = "The mass density of the solvent."
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.value = { type = "MassDensity", doc = "Mass density." }

[forms.aqueous_standard_state]
doc = "The standard-state Gibbs energy of an aqueous species form: the general equation of state its substance chooses, with the solvent properties that equation needs as sub-form slots of its own. The assembly of each species form is held by `entity_model`."
implements = "aqueous_standard_gibbs"
completeness = "fully_declared"
status = "expressed"

[forms.aqueous_standard_state.subforms.eos]
doc = "The general equation of state of the substance."
accepts = "aqueous_standard_part"
multiplicity = "one"
per = "model"

[forms.aqueous_standard_state.outputs]
G0 = "eos.dG(i=i, T=T, P=P)"

[forms.hkf_standard_state]
doc = "The standard-state properties of an aqueous ion or molecule by the Helgeson-Kirkham-Flowers equations: the Gibbs energy and enthalpy of formation, the entropy, the non-solvation coefficients a1 to a4 and c1, c2 and the Born coefficient omega, with the solvent permittivity and density its Born and pressure terms need. The equations are procedural, and live in the code of the program that evaluates them."
implements = "aqueous_standard_part"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.hkf_standard_state.subforms.epsilon]
doc = "The solvent permittivity."
accepts = "solvent_permittivity"
multiplicity = "one"
per = "model"

[forms.hkf_standard_state.subforms.density]
doc = "The solvent density."
accepts = "solvent_density"
multiplicity = "one"
per = "model"

[forms.hkf_standard_state.slot_groups.pure]
doc = "The parameters of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.hkf_standard_state.slot_groups.pure.slots]
g_f = { type = "MolarEnergy", doc = "Gibbs energy of formation at the reference temperature and pressure." }
h_f = { type = "MolarEnergy", doc = "Enthalpy of formation at the reference temperature and pressure." }
s = { type = "MolarEntropy", doc = "Entropy at the reference temperature and pressure." }
a1 = { type = "MolarVolume", doc = "Non-solvation coefficient of the pressure term." }
a2 = { type = "MolarEnergy", doc = "Non-solvation coefficient of the logarithmic pressure term." }
a3 = { type = "MolarVolume * Temperature", doc = "Non-solvation coefficient of the pressure term over T - theta." }
a4 = { type = "MolarEnergy * Temperature", doc = "Non-solvation coefficient of the logarithmic pressure term over T - theta." }
c1 = { type = "MolarEntropy", doc = "Non-solvation coefficient of the heat capacity." }
c2 = { type = "MolarEnergy * Temperature", doc = "Coefficient of the heat capacity over T - theta." }
omega = { type = "MolarEnergy", doc = "Born coefficient." }

[forms.standard_gibbs_constant]
doc = "A standard-state Gibbs energy that does not depend on temperature or pressure: the equation of state of a substance a source gives as one number."
implements = "aqueous_standard_part"
completeness = "fully_declared"
status = "expressed"

[forms.standard_gibbs_constant.slot_groups.pure]
doc = "The energy of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.standard_gibbs_constant.slot_groups.pure.slots]
g = { type = "MolarEnergy", doc = "The standard-state molar Gibbs energy." }

[forms.standard_gibbs_constant.outputs]
dG = "pure.g[i]"

[forms.solvent_permittivity_correlation]
doc = "The permittivity of the solvent as a correlation of temperature and pressure that a program evaluates in code."
implements = "solvent_permittivity"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.solvent_density_correlation]
doc = "The density of the solvent as a correlation or equation of state of temperature and pressure that a program evaluates in code."
implements = "solvent_density"
completeness = "structure_declared_equation_external"
status = "catalogued"
