module = "helmholtz"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Multiparameter equations of state in the reduced Helmholtz energy, and the multifluid mixture
model built from them. A pure fluid is an ideal-gas part and a residual part, each a sum of terms
of several kinds (the term kinds are families of one slot group, added), in the reduced density
delta = rho / rho_r and the inverse reduced temperature tau = T_r / T; the reducing temperature
and density are slots of the fluid, the gas constant is a convention fact of the parameterisation.
A multifluid mixture combines the pure equations with reducing functions of composition whose pair
parameters are transposed by the reciprocal rule on the parameters that invert when the pair is
swapped, and with departure functions of pairs: a departure function is a set of its own that
several pairs reference, each pair keeping its own scale factor.

The exponents and the integer parameters of the terms are whole numbers held as dimensionless
slots.
"""

# ---------------------------------------------------------------- a pure fluid

[contracts.helmholtz_fluid]
doc = "Reduced Helmholtz energy, ideal and residual, and pressure of a pure fluid at a temperature and a molar density."
roles.i = { type = "material_entity", doc = "The fluid." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.rho = { type = "MolarDensity", observable = "molar_density", doc = "Molar density." }
outputs.alpha_0 = { type = "Scalar", doc = "The ideal-gas part of the Helmholtz energy divided by R T." }
outputs.alpha_r = { type = "Scalar", doc = "The residual part of the Helmholtz energy divided by R T." }
outputs.a_r = { type = "MolarEnergy", observable = "molar_residual_helmholtz_energy", doc = "The residual molar Helmholtz energy." }
outputs.p = { type = "Pressure", observable = "pressure", doc = "Pressure." }

[forms.helmholtz_pure_fluid]
doc = "A pure fluid's reduced Helmholtz energy: alpha_0 = ln delta + a1 + a2 tau + c ln tau + sum n ln(1 - exp(-theta tau)); alpha_r = power terms n delta^d tau^t, exponential terms with exp(-delta^l), Gaussian terms with exp(-eta (delta - epsilon)^2 - beta (tau - gamma)^2) and non-analytic terms n Delta^b delta psi with Delta = theta^2 + B ((delta - 1)^2)^a, theta = (1 - tau) + A ((delta - 1)^2)^(1/(2 beta)) and psi = exp(-C (delta - 1)^2 - D (tau - 1)^2). The pressure is rho R T (1 + delta d alpha_r / d delta)."
implements = "helmholtz_fluid"
completeness = "fully_declared"
status = "expressed"
conventions = ["gas_constant"]

[forms.helmholtz_pure_fluid.slot_groups.pure]
doc = "The reducing parameters, the ideal-gas constants and the term lists of one fluid."
subject.i = { type = "material_entity", doc = "The fluid." }

[forms.helmholtz_pure_fluid.slot_groups.pure.slots]
T_r = { type = "Temperature", doc = "Reducing temperature." }
rho_r = { type = "MolarDensity", doc = "Reducing density." }
a1 = { type = "Scalar", doc = "Constant term of the ideal-gas part." }
a2 = { type = "Scalar", doc = "Coefficient of tau in the ideal-gas part." }
c = { type = "Scalar", doc = "Coefficient of ln tau in the ideal-gas part." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.planck_einstein]
doc = "One Planck-Einstein term of the ideal-gas part."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.planck_einstein.slots]
n = { type = "Scalar", doc = "Coefficient." }
theta = { type = "Scalar", doc = "Characteristic temperature over the reducing temperature." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.power]
doc = "One polynomial term of the residual part."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.power.slots]
n = { type = "Scalar", doc = "Coefficient." }
d = { type = "Scalar", doc = "Exponent of delta." }
t = { type = "Scalar", doc = "Exponent of tau." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.exponential]
doc = "One exponential term of the residual part."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.exponential.slots]
n = { type = "Scalar", doc = "Coefficient." }
d = { type = "Scalar", doc = "Exponent of delta." }
t = { type = "Scalar", doc = "Exponent of tau." }
l = { type = "Scalar", doc = "Exponent of delta in the exponential." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.gaussian]
doc = "One Gaussian term of the residual part."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.gaussian.slots]
n = { type = "Scalar", doc = "Coefficient." }
d = { type = "Scalar", doc = "Exponent of delta." }
t = { type = "Scalar", doc = "Exponent of tau." }
eta = { type = "Scalar", doc = "Coefficient of the square of (delta - epsilon)." }
epsilon = { type = "Scalar", doc = "Centre in delta." }
beta = { type = "Scalar", doc = "Coefficient of the square of (tau - gamma)." }
gamma = { type = "Scalar", doc = "Centre in tau." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.nonanalytic]
doc = "One non-analytic term of the residual part."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.helmholtz_pure_fluid.slot_groups.pure.families.nonanalytic.slots]
n = { type = "Scalar", doc = "Coefficient." }
a = { type = "Scalar", doc = "Exponent of the square of (delta - 1) in Delta." }
b = { type = "Scalar", doc = "Exponent of Delta." }
beta = { type = "Scalar", doc = "Exponent parameter of theta." }
A = { type = "Scalar", doc = "Coefficient of theta." }
B = { type = "Scalar", doc = "Coefficient of Delta." }
C = { type = "Scalar", doc = "Coefficient of the square of (delta - 1) in psi." }
D = { type = "Scalar", doc = "Coefficient of the square of (tau - 1) in psi." }

[forms.helmholtz_pure_fluid.let]
R = "convention.gas_constant"
delta = "rho / pure.rho_r[i]"
tau = "pure.T_r[i] / T"
ideal = "log(delta) + pure.a1[i] + pure.a2[i] * tau + pure.c[i] * log(tau) + sum(pure.planck_einstein.n[i, k] * log(1 - exp(-pure.planck_einstein.theta[i, k] * tau)) for k in pure.planck_einstein(i))"
power = "sum(pure.power.n[i, k] * delta ** pure.power.d[i, k] * tau ** pure.power.t[i, k] for k in pure.power(i))"
exponential = "sum(pure.exponential.n[i, k] * delta ** pure.exponential.d[i, k] * tau ** pure.exponential.t[i, k] * exp(-(delta ** pure.exponential.l[i, k])) for k in pure.exponential(i))"
gaussian = "sum(pure.gaussian.n[i, k] * delta ** pure.gaussian.d[i, k] * tau ** pure.gaussian.t[i, k] * exp(-pure.gaussian.eta[i, k] * (delta - pure.gaussian.epsilon[i, k]) ** 2 - pure.gaussian.beta[i, k] * (tau - pure.gaussian.gamma[i, k]) ** 2) for k in pure.gaussian(i))"
nonanalytic = "sum(pure.nonanalytic.n[i, k] * (((1 - tau) + pure.nonanalytic.A[i, k] * ((delta - 1) ** 2) ** (1 / (2 * pure.nonanalytic.beta[i, k]))) ** 2 + pure.nonanalytic.B[i, k] * ((delta - 1) ** 2) ** pure.nonanalytic.a[i, k]) ** pure.nonanalytic.b[i, k] * delta * exp(-pure.nonanalytic.C[i, k] * (delta - 1) ** 2 - pure.nonanalytic.D[i, k] * (tau - 1) ** 2) for k in pure.nonanalytic(i))"
residual = "power + exponential + gaussian + nonanalytic"

[forms.helmholtz_pure_fluid.outputs]
alpha_0 = "ideal"
alpha_r = "residual"
a_r = "R * T * residual"
p = "rho * R * T * (1 + delta * d(residual, delta))"

# ---------------------------------------------------------------- the multifluid mixture

[contracts.multifluid_reducing_functions]
doc = "The reducing temperature and density of a mixture of fixed components at a composition."
sets.components = { type = "species", doc = "The components of the mixture, in a fixed order." }
arguments.x = { type = "Fraction", over = ["components"], basis = "mole_fraction", doc = "Composition." }
outputs.T_r = { type = "Temperature", doc = "Reducing temperature of the mixture." }
outputs.rho_r = { type = "MolarDensity", doc = "Reducing density of the mixture." }

[forms.multifluid_reducing]
doc = "The quadratic-mixing reducing functions of a multifluid model: T_r = sum x_i^2 T_c,i + sum_{i<j} 2 beta_T,ij gamma_T,ij (x_i + x_j) / (beta_T,ij^2 x_i + x_j) x_i x_j sqrt(T_c,i T_c,j) and the same for the reciprocal of the density with beta_v, gamma_v and (1/8) (rho_c,i^(-1/3) + rho_c,j^(-1/3))^3. The unordered pairs are summed as ordered pairs without the factor 2: the term is the same in both orders when beta is inverted with the pair, which the reciprocal transposition does when a pair is read in the order that was not asserted."
implements = "multifluid_reducing_functions"
completeness = "fully_declared"
status = "expressed"

[forms.multifluid_reducing.slot_groups.pure]
doc = "The critical parameters of one component that the reducing functions use."
subject.i = { type = "species", doc = "The component." }
bind = { i = "components" }

[forms.multifluid_reducing.slot_groups.pure.slots]
T_c = { type = "Temperature", doc = "Critical temperature." }
rho_c = { type = "MolarDensity", doc = "Critical density." }

[forms.multifluid_reducing.slot_groups.pair]
doc = "The binary reducing parameters of one pair, held for the order the source asserted."
subject.i = { type = "species", doc = "The first component." }
subject.j = { type = "species", doc = "The second component." }
bind = { i = "components", j = "components" }
transposition = { rule = "reciprocal", roles = ["i", "j"], slots = ["beta_T", "beta_v"], diagonal = "forbidden" }

[forms.multifluid_reducing.slot_groups.pair.slots]
beta_T = { type = "Scalar", doc = "Temperature reducing ratio; its reciprocal when the pair is swapped." }
gamma_T = { type = "Scalar", doc = "Temperature reducing factor; the same in both orders." }
beta_v = { type = "Scalar", doc = "Volume reducing ratio; its reciprocal when the pair is swapped." }
gamma_v = { type = "Scalar", doc = "Volume reducing factor; the same in both orders." }

[forms.multifluid_reducing.outputs]
T_r = "sum(x[i] ** 2 * pure.T_c[i] for i in components) + sum((0 * unit('K') if i == j else x[i] * x[j] * pair.beta_T[i, j] * pair.gamma_T[i, j] * (x[i] + x[j]) / (pair.beta_T[i, j] ** 2 * x[i] + x[j]) * sqrt(pure.T_c[i] * pure.T_c[j])) for i in components for j in components)"
rho_r = "1 / (sum(x[i] ** 2 / pure.rho_c[i] for i in components) + sum((0 * unit('m^3/mol') if i == j else x[i] * x[j] * pair.beta_v[i, j] * pair.gamma_v[i, j] * (x[i] + x[j]) / (pair.beta_v[i, j] ** 2 * x[i] + x[j]) * (unit('m^3/mol') / 8) * ((unit('mol/m^3') / pure.rho_c[i]) ** (1 / 3) + (unit('mol/m^3') / pure.rho_c[j]) ** (1 / 3)) ** 3) for i in components for j in components))"

# ---------------------------------------------------------------- departure functions

[contracts.multifluid_departure_function]
doc = "A departure function of reduced density and inverse reduced temperature, the object several pairs share."
roles.c = { type = "model_component", doc = "The function, named in its parameterisation." }
arguments.delta = { type = "Scalar", doc = "Reduced density." }
arguments.tau = { type = "Scalar", doc = "Inverse reduced temperature." }
outputs.alpha_r = { type = "Scalar", doc = "The departure function." }

[forms.multifluid_departure_terms]
doc = "A departure function as power terms n delta^d tau^t and Gaussian terms n delta^d tau^t exp(-eta (delta - epsilon)^2 - beta (delta - gamma))."
implements = "multifluid_departure_function"
completeness = "fully_declared"
status = "expressed"

[forms.multifluid_departure_terms.slot_groups.core]
doc = "The term lists of one departure function."
subject.c = { type = "model_component", doc = "The function." }

[forms.multifluid_departure_terms.slot_groups.core.families.power]
doc = "One power term."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.multifluid_departure_terms.slot_groups.core.families.power.slots]
n = { type = "Scalar", doc = "Coefficient." }
d = { type = "Scalar", doc = "Exponent of delta." }
t = { type = "Scalar", doc = "Exponent of tau." }

[forms.multifluid_departure_terms.slot_groups.core.families.gaussian]
doc = "One Gaussian term."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.multifluid_departure_terms.slot_groups.core.families.gaussian.slots]
n = { type = "Scalar", doc = "Coefficient." }
d = { type = "Scalar", doc = "Exponent of delta." }
t = { type = "Scalar", doc = "Exponent of tau." }
eta = { type = "Scalar", doc = "Coefficient of the square of (delta - epsilon)." }
epsilon = { type = "Scalar", doc = "Centre in delta." }
beta = { type = "Scalar", doc = "Coefficient of (delta - gamma)." }
gamma = { type = "Scalar", doc = "Centre in delta of the linear term." }

[forms.multifluid_departure_terms.outputs]
alpha_r = "sum(core.power.n[c, k] * delta ** core.power.d[c, k] * tau ** core.power.t[c, k] for k in core.power(c)) + sum(core.gaussian.n[c, k] * delta ** core.gaussian.d[c, k] * tau ** core.gaussian.t[c, k] * exp(-core.gaussian.eta[c, k] * (delta - core.gaussian.epsilon[c, k]) ** 2 - core.gaussian.beta[c, k] * (delta - core.gaussian.gamma[c, k])) for k in core.gaussian(c))"

[contracts.multifluid_pair_departure]
doc = "The departure contribution of one pair of a mixture: its scale factor times the departure function it uses."
roles.i = { type = "species", doc = "The first component." }
roles.j = { type = "species", doc = "The second component." }
arguments.delta = { type = "Scalar", doc = "Reduced density." }
arguments.tau = { type = "Scalar", doc = "Inverse reduced temperature." }
outputs.alpha_r = { type = "Scalar", doc = "F_ij times the departure function." }

[forms.multifluid_pair_departure_scaled]
doc = "F_ij alpha_r,ij(delta, tau): the scale factor of the pair and the departure function it references, which other pairs reference as well."
implements = "multifluid_pair_departure"
completeness = "fully_declared"
status = "expressed"

[forms.multifluid_pair_departure_scaled.slot_groups.pair]
doc = "The scale factor and the departure function of one pair."
subject.i = { type = "species", doc = "The first component." }
subject.j = { type = "species", doc = "The second component." }
transposition = { rule = "symmetric", roles = ["i", "j"], diagonal = "forbidden" }

[forms.multifluid_pair_departure_scaled.slot_groups.pair.slots]
F = { type = "Scalar", doc = "The scale factor F_ij of the pair; zero where the pair has no departure function." }
departure = { references = "multifluid_departure_function", doc = "The departure function of the pair, shared with the pairs that use the same one." }

[forms.multifluid_pair_departure_scaled.outputs]
alpha_r = "pair.F[i, j] * pair.departure[i, j].alpha_r(delta=delta, tau=tau)"
