module = "saturation"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Saturation curves of a pure fluid as explicit functions of temperature. Where a curve is a fit to
an equation of state it is an auxiliary relation of that equation, not independent data: the
mapping records what it was fitted to and the accuracy the source claims.
"""

[contracts.pure_vapor_pressure]
doc = "Vapour-liquid saturation pressure of a pure fluid as a function of temperature."
roles.i = { type = "material_entity", doc = "The fluid." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.p_sat = { type = "Pressure", observable = "vapor_pressure", doc = "Saturation pressure." }

[forms.vapor_pressure_exp_series_tau]
doc = "Saturation pressure as a reducing pressure times the exponential of a power series in theta = 1 - T/T_r, the series multiplied by T_r/T."
implements = "pure_vapor_pressure"
completeness = "fully_declared"
status = "expressed"

[forms.vapor_pressure_exp_series_tau.slot_groups.pure]
doc = "The curve of one fluid."
subject.i = { type = "material_entity", doc = "The fluid." }

[forms.vapor_pressure_exp_series_tau.slot_groups.pure.slots]
T_r = { type = "Temperature", doc = "Reducing temperature of the curve; the curve is defined up to it." }
p_r = { type = "Pressure", doc = "Reducing pressure of the curve." }

[forms.vapor_pressure_exp_series_tau.slot_groups.pure.families.term]
doc = "One term of the series."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.vapor_pressure_exp_series_tau.slot_groups.pure.families.term.slots]
n = { type = "Scalar", doc = "Coefficient." }
t = { type = "Scalar", doc = "Exponent of theta." }

[forms.vapor_pressure_exp_series_tau.let]
theta = "1 - T / pure.T_r[i]"

[forms.vapor_pressure_exp_series_tau.outputs]
p_sat = "pure.p_r[i] * exp(pure.T_r[i] / T * sum(pure.term.n[i, k] * theta ** pure.term.t[i, k] for k in pure.term(i)))"
