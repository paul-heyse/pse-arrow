module = "cosmo_sac"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
  "excess_gibbs",
]
doc = """
COSMO-SAC, an excess-Gibbs model from the screening-charge distribution of each molecule. A molecule
is its sigma profile, the area of its cavity surface per screening-charge-density bin, held as one
tabulated function with three named series on one grid (non-hydrogen-bonding, hydrogen-bond donor and
other hydrogen-bonding area), its cavity volume and its dispersion class and energy. The interaction
constants of the model are a global set of their own. A profile is valid only with the constants it
was generated for, a `dependency` of its parameterisation on the constants' parameterisation.

The expression language has no construct that reads the values of a tabulated function, so the form
is catalogued: the equations (segment activity coefficients by self-consistent iteration over the
grid, the combinatorial and dispersion terms) are in code.
"""

[forms.cosmosac_2010]
doc = "COSMO-SAC-2010 with the dispersion contribution: the residual term from the three-series sigma profiles and the hydrogen-bonding and electrostatic constants, the Staverman-Guggenheim combinatorial term from the cavity areas and volumes, and the dispersion term from the dispersion classes and energies."
implements = "molar_excess_gibbs_mixture"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.cosmosac_2010.slot_groups.molecule]
doc = "The sigma profile, cavity volume and dispersion descriptor of one molecule."
subject.i = { type = "species", doc = "The molecule." }
bind = { i = "components" }

[forms.cosmosac_2010.slot_groups.molecule.slots]
profile = { type = "tabulated_function", doc = "The sigma profile: the screening-charge density axis and the series nhb, oh and ot of cavity area per bin, on one grid." }
cavity_volume = { type = "Volume", doc = "Volume of the molecular cavity." }
dispersion_class = { type = "dispersion_class", doc = "The dispersion class of the molecule, which decides the sign of the dispersion weight of each pair of classes." }
dispersion_energy_over_k = { type = "EnergyTemperature", doc = "Dispersion energy over the Boltzmann constant." }

[forms.cosmosac_2010.slot_groups.constants]
doc = "The model constants the profiles must have been generated for."

[forms.cosmosac_2010.slot_groups.constants.slots]
effective_area = { type = "Area", doc = "Effective segment area." }
c_oh_oh = { type = "MolarEnergy / SurfaceChargeDensity^2", doc = "Hydrogen-bonding constant of two donor segments." }
c_oh_ot = { type = "MolarEnergy / SurfaceChargeDensity^2", doc = "Hydrogen-bonding constant of a donor and another hydrogen-bonding segment." }
c_ot_ot = { type = "MolarEnergy / SurfaceChargeDensity^2", doc = "Hydrogen-bonding constant of two other hydrogen-bonding segments." }
a_es = { type = "MolarEnergy / SurfaceChargeDensity^2", doc = "Constant term of the electrostatic coefficient." }
b_es = { type = "MolarEnergy * Temperature^2 / SurfaceChargeDensity^2", doc = "Coefficient of the inverse square of the temperature in the electrostatic coefficient." }
q0 = { type = "Area", doc = "Standard surface area of the combinatorial term." }
r0 = { type = "Volume", doc = "Standard volume of the combinatorial term." }
z_coordination = { type = "Scalar", doc = "Coordination number of the combinatorial term." }
