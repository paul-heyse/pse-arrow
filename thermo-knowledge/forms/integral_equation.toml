module = "integral_equation"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Inputs of a liquid-state integral-equation theory (the PRISM equation of polymer liquids). The
components of the theory are site types, not molecules: abstract pseudo-components (kind
`abstract_component`) with a number of sites of each type per volume (the observable
`site_number_density`, on the composition basis of the same name). The grouping of site types into
molecules lives in the intramolecular correlation functions and is not a record, so no molecule entity
stands for it.

What the theory needs for each pair of site types is a pair potential and a closure, both chosen for
the pair. A pair potential is a form with a set for each unordered pair of site types (the diagonal is
a pair too), giving the potential in units of kT. A closure relates the direct correlation function
to the pair potential and the indirect correlation function pointwise; the integral equation and its
solution are procedure, not data. A pair model puts the choices together: for one pair it holds one
pair potential form and one closure form, chosen per pair by the choices of the parameterisation.
"""

# ---------------------------------------------------------------- the pair potential

[contracts.site_pair_potential]
doc = "The potential between two site types at a separation and a temperature, divided by kT: a dimensionless number, as integral-equation theories state it."
roles.a = { type = "pseudo_component", doc = "The first site type." }
roles.b = { type = "pseudo_component", doc = "The second site type." }
arguments.r = { type = "Length", doc = "Separation of the two sites." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
outputs.u = { type = "Scalar", doc = "Pair potential over kT." }

[forms.lennard_jones_site_potential]
doc = "Lennard-Jones: u / kT = 4 (epsilon / k T) ((sigma / r)^12 - (sigma / r)^6)."
implements = "site_pair_potential"
completeness = "fully_declared"
status = "expressed"

[forms.lennard_jones_site_potential.slot_groups.pair]
doc = "The well depth and the diameter of one unordered pair of site types."
subject.a = { type = "pseudo_component", doc = "The first site type." }
subject.b = { type = "pseudo_component", doc = "The second site type." }
transposition = { rule = "symmetric", roles = ["a", "b"], diagonal = "allowed" }

[forms.lennard_jones_site_potential.slot_groups.pair.slots]
epsilon_over_k = { type = "EnergyTemperature", doc = "Well depth over the Boltzmann constant." }
sigma = { type = "Length", doc = "Separation at which the potential is zero." }

[forms.lennard_jones_site_potential.outputs]
u = "4 * pair.epsilon_over_k[a, b] / T * ((pair.sigma[a, b] / r) ** 12 - (pair.sigma[a, b] / r) ** 6)"

[forms.wca_site_potential]
doc = "Weeks-Chandler-Andersen: the Lennard-Jones potential cut at its minimum, r = 2^(1/6) sigma, and shifted up by the well depth so that it is purely repulsive and continuous."
implements = "site_pair_potential"
completeness = "fully_declared"
status = "expressed"

[forms.wca_site_potential.slot_groups.pair]
doc = "The well depth and the diameter of one unordered pair of site types."
subject.a = { type = "pseudo_component", doc = "The first site type." }
subject.b = { type = "pseudo_component", doc = "The second site type." }
transposition = { rule = "symmetric", roles = ["a", "b"], diagonal = "allowed" }

[forms.wca_site_potential.slot_groups.pair.slots]
epsilon_over_k = { type = "EnergyTemperature", doc = "Well depth of the underlying Lennard-Jones potential over the Boltzmann constant." }
sigma = { type = "Length", doc = "Separation at which the underlying potential is zero." }

[forms.wca_site_potential.outputs]
u = "(4 * pair.epsilon_over_k[a, b] / T * ((pair.sigma[a, b] / r) ** 12 - (pair.sigma[a, b] / r) ** 6) + pair.epsilon_over_k[a, b] / T) if r < 2 ** (1 / 6) * pair.sigma[a, b] else 0"

# ---------------------------------------------------------------- the closure

[contracts.closure_relation]
doc = "The direct correlation function of a pair of site types at one separation from the pair potential over kT and the indirect correlation function there."
roles.a = { type = "pseudo_component", doc = "The first site type." }
roles.b = { type = "pseudo_component", doc = "The second site type." }
arguments.u = { type = "Scalar", doc = "Pair potential over kT at the separation." }
arguments.gamma = { type = "Scalar", doc = "Indirect correlation function at the separation." }
outputs.c = { type = "Scalar", doc = "Direct correlation function at the separation." }

[forms.percus_yevick_closure]
doc = "Percus-Yevick: c = (exp(-u) - 1) (1 + gamma)."
implements = "closure_relation"
completeness = "fully_declared"
status = "expressed"

[forms.percus_yevick_closure.outputs]
c = "(exp(-u) - 1) * (1 + gamma)"

[forms.hypernetted_chain_closure]
doc = "Hypernetted chain: c = exp(-u + gamma) - 1 - gamma."
implements = "closure_relation"
completeness = "fully_declared"
status = "expressed"

[forms.hypernetted_chain_closure.outputs]
c = "exp(-u + gamma) - 1 - gamma"

# ---------------------------------------------------------------- the pair model

[contracts.site_pair_model]
doc = "The direct correlation function of a pair of site types at a separation, a temperature and a value of the indirect correlation function, with the pair potential and the closure the pair uses."
roles.a = { type = "pseudo_component", doc = "The first site type." }
roles.b = { type = "pseudo_component", doc = "The second site type." }
arguments.r = { type = "Length", doc = "Separation of the two sites." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.gamma = { type = "Scalar", doc = "Indirect correlation function at the separation." }
outputs.c = { type = "Scalar", doc = "Direct correlation function at the separation." }

[forms.prism_pair_model]
doc = "One pair of site types: the closure applied to the pair potential. Both are chosen for the pair, so the same system has a hard-core potential with one closure for one pair and another potential with another closure for the next; a closure is not a parameter of a species. The integral equation that determines the indirect correlation function is procedure."
implements = "site_pair_model"
completeness = "fully_declared"
status = "expressed"

[forms.prism_pair_model.subforms.potential]
doc = "The pair potential of this pair."
accepts = "site_pair_potential"
multiplicity = "one"
per = "subject"

[forms.prism_pair_model.subforms.closure]
doc = "The closure of this pair."
accepts = "closure_relation"
multiplicity = "one"
per = "subject"

[forms.prism_pair_model.outputs]
c = "closure.c(a=a, b=b, u=potential.u(a=a, b=b, r=r, T=T), gamma=gamma)"
