module = "standard_state"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Standard-state thermodynamic functions of a species form as functions of temperature at the
pressure of the standard state the parameterisation's convention set gives. The gas constant is a
fact of each parameterisation's convention set, never an ambient value: a coefficient set
reproduces its source only with the gas constant it was built with. Enthalpy is relative to the
energy reference of the convention set; for the NASA and Shomate families that datum is carried by
the integration constants.
"""

[contracts.standard_state_thermo]
doc = "Standard-state molar heat capacity, enthalpy and entropy of one species form at a temperature."
roles.i = { type = "species_form", doc = "The species form." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
outputs.cp = { type = "MolarEntropy", observable = "standard_molar_heat_capacity_isobaric", doc = "Standard-state molar heat capacity at constant pressure." }
outputs.h = { type = "MolarEnergy", observable = "standard_molar_enthalpy", doc = "Standard-state molar enthalpy relative to the energy reference." }
outputs.s = { type = "MolarEntropy", observable = "standard_molar_entropy", doc = "Standard-state molar entropy." }

# ---------------------------------------------------------------- NASA seven-coefficient

[forms.nasa7]
doc = "NASA seven-coefficient polynomials: heat capacity over R as a fourth-degree polynomial in temperature on each temperature interval, with enthalpy and entropy integration constants."
implements = "standard_state_thermo"
completeness = "fully_declared"
status = "expressed"
citations = ["gordon_mcbride_1971_nasa_sp_273"]
conventions = ["gas_constant"]

[forms.nasa7.slot_groups.pure]
doc = "The coefficient blocks of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.nasa7.slot_groups.pure.families.piece]
doc = "One coefficient block per temperature interval."
index.n = { type = "Integer", min = 1, doc = "Piece number, ascending in temperature." }
interval = { lower = "T_low", upper = "T_high" }

[forms.nasa7.slot_groups.pure.families.piece.slots]
T_low = { type = "Temperature", doc = "Lower bound of the interval." }
T_high = { type = "Temperature", doc = "Upper bound of the interval." }
a1 = { type = "Scalar", doc = "Coefficient of T^0 in Cp/R." }
a2 = { type = "Scalar / Temperature", doc = "Coefficient of T^1 in Cp/R." }
a3 = { type = "Scalar / Temperature^2", doc = "Coefficient of T^2 in Cp/R." }
a4 = { type = "Scalar / Temperature^3", doc = "Coefficient of T^3 in Cp/R." }
a5 = { type = "Scalar / Temperature^4", doc = "Coefficient of T^4 in Cp/R." }
a6 = { type = "TemperatureDifference", doc = "Enthalpy integration constant: H/R at the zero of the polynomial integral." }
a7 = { type = "Scalar", doc = "Entropy integration constant: S/R at the zero of the polynomial integral." }

[forms.nasa7.let]
n = "at(pure.piece(i), T)"
R = "convention.gas_constant"
a1 = "pure.piece.a1[i, n]"
a2 = "pure.piece.a2[i, n]"
a3 = "pure.piece.a3[i, n]"
a4 = "pure.piece.a4[i, n]"
a5 = "pure.piece.a5[i, n]"
a6 = "pure.piece.a6[i, n]"
a7 = "pure.piece.a7[i, n]"

[forms.nasa7.outputs]
cp = "R * (a1 + a2 * T + a3 * T ** 2 + a4 * T ** 3 + a5 * T ** 4)"
h = "R * T * (a1 + a2 * T / 2 + a3 * T ** 2 / 3 + a4 * T ** 3 / 4 + a5 * T ** 4 / 5 + a6 / T)"
s = "R * (a1 * log(T / unit('K')) + a2 * T + a3 * T ** 2 / 2 + a4 * T ** 3 / 3 + a5 * T ** 4 / 4 + a7)"

# ---------------------------------------------------------------- NASA nine-coefficient

[forms.nasa9]
doc = "NASA nine-coefficient polynomials: heat capacity over R with terms from T^-2 to T^4 on each temperature interval, with enthalpy and entropy integration constants."
implements = "standard_state_thermo"
completeness = "fully_declared"
status = "expressed"
citations = ["mcbride_zehe_gordon_2002_nasa_tp_211556"]
conventions = ["gas_constant"]

[forms.nasa9.slot_groups.pure]
doc = "The coefficient blocks of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.nasa9.slot_groups.pure.families.piece]
doc = "One coefficient block per temperature interval."
index.n = { type = "Integer", min = 1, doc = "Piece number, ascending in temperature." }
interval = { lower = "T_low", upper = "T_high" }

[forms.nasa9.slot_groups.pure.families.piece.slots]
T_low = { type = "Temperature", doc = "Lower bound of the interval." }
T_high = { type = "Temperature", doc = "Upper bound of the interval." }
a1 = { type = "Scalar * Temperature^2", doc = "Coefficient of T^-2 in Cp/R." }
a2 = { type = "Scalar * Temperature", doc = "Coefficient of T^-1 in Cp/R." }
a3 = { type = "Scalar", doc = "Coefficient of T^0 in Cp/R." }
a4 = { type = "Scalar / Temperature", doc = "Coefficient of T^1 in Cp/R." }
a5 = { type = "Scalar / Temperature^2", doc = "Coefficient of T^2 in Cp/R." }
a6 = { type = "Scalar / Temperature^3", doc = "Coefficient of T^3 in Cp/R." }
a7 = { type = "Scalar / Temperature^4", doc = "Coefficient of T^4 in Cp/R." }
b1 = { type = "TemperatureDifference", doc = "Enthalpy integration constant over R." }
b2 = { type = "Scalar", doc = "Entropy integration constant over R." }

[forms.nasa9.let]
n = "at(pure.piece(i), T)"
R = "convention.gas_constant"
a1 = "pure.piece.a1[i, n]"
a2 = "pure.piece.a2[i, n]"
a3 = "pure.piece.a3[i, n]"
a4 = "pure.piece.a4[i, n]"
a5 = "pure.piece.a5[i, n]"
a6 = "pure.piece.a6[i, n]"
a7 = "pure.piece.a7[i, n]"
b1 = "pure.piece.b1[i, n]"
b2 = "pure.piece.b2[i, n]"
lnT = "log(T / unit('K'))"

[forms.nasa9.outputs]
cp = "R * (a1 / T ** 2 + a2 / T + a3 + a4 * T + a5 * T ** 2 + a6 * T ** 3 + a7 * T ** 4)"
h = "R * T * (-a1 / T ** 2 + a2 * lnT / T + a3 + a4 * T / 2 + a5 * T ** 2 / 3 + a6 * T ** 3 / 4 + a7 * T ** 4 / 5 + b1 / T)"
s = "R * (-a1 / (2 * T ** 2) - a2 / T + a3 * lnT + a4 * T + a5 * T ** 2 / 2 + a6 * T ** 3 / 3 + a7 * T ** 4 / 4 + b2)"

# ---------------------------------------------------------------- Shomate

[forms.shomate]
doc = "The Shomate equation: heat capacity as a cubic polynomial in temperature plus an inverse-square term on each temperature interval, with enthalpy and entropy constants. The coefficients of the powers of the temperature are stored for temperature in kelvin; a source that tabulates them for t = T/1000 K (the NIST WebBook, Cantera) is converted by the mapping with the unit of each coefficient. The entropy constant G is the constant of the published equation, whose logarithm is that of t, so the logarithm here is of T over a kilokelvin and G needs no conversion."
implements = "standard_state_thermo"
completeness = "fully_declared"
status = "expressed"
citations = ["shomate_1954", "chase_1998_nist_janaf"]

[forms.shomate.slot_groups.pure]
doc = "The coefficient blocks of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.shomate.slot_groups.pure.families.piece]
doc = "One coefficient block per temperature interval."
index.n = { type = "Integer", min = 1, doc = "Piece number, ascending in temperature." }
interval = { lower = "T_low", upper = "T_high" }

[forms.shomate.slot_groups.pure.families.piece.slots]
T_low = { type = "Temperature", doc = "Lower bound of the interval." }
T_high = { type = "Temperature", doc = "Upper bound of the interval." }
A = { type = "MolarEntropy", doc = "Constant term of the heat capacity." }
B = { type = "MolarEntropy / Temperature", doc = "Coefficient of T in the heat capacity." }
C = { type = "MolarEntropy / Temperature^2", doc = "Coefficient of T^2 in the heat capacity." }
D = { type = "MolarEntropy / Temperature^3", doc = "Coefficient of T^3 in the heat capacity." }
E = { type = "MolarEntropy * Temperature^2", doc = "Coefficient of T^-2 in the heat capacity." }
F = { type = "MolarEnergy", doc = "Enthalpy constant." }
G = { type = "MolarEntropy", doc = "Entropy constant." }

[forms.shomate.let]
n = "at(pure.piece(i), T)"
A = "pure.piece.A[i, n]"
B = "pure.piece.B[i, n]"
C = "pure.piece.C[i, n]"
D = "pure.piece.D[i, n]"
E = "pure.piece.E[i, n]"
F = "pure.piece.F[i, n]"
G = "pure.piece.G[i, n]"

[forms.shomate.outputs]
cp = "A + B * T + C * T ** 2 + D * T ** 3 + E / T ** 2"
h = "A * T + B * T ** 2 / 2 + C * T ** 3 / 3 + D * T ** 4 / 4 - E / T + F"
s = "A * log(T / unit('kK')) + B * T + C * T ** 2 / 2 + D * T ** 3 / 3 - E / (2 * T ** 2) + G"

# ---------------------------------------------------------------- constant heat capacity

[forms.constant_cp]
doc = "A constant molar heat capacity from a reference state: the enthalpy and entropy at a reference temperature and the heat capacity that holds at every temperature, which is how a source states a species whose heat capacity it does not resolve in temperature (a surface species, a solid of a cell)."
implements = "standard_state_thermo"
completeness = "fully_declared"
status = "expressed"

[forms.constant_cp.slot_groups.pure]
doc = "The reference state and heat capacity of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.constant_cp.slot_groups.pure.slots]
T0 = { type = "Temperature", doc = "Reference temperature." }
h0 = { type = "MolarEnergy", doc = "Molar enthalpy at the reference temperature." }
s0 = { type = "MolarEntropy", doc = "Molar entropy at the reference temperature." }
cp0 = { type = "MolarEntropy", doc = "Molar heat capacity, the same at every temperature." }

[forms.constant_cp.let]
T0 = "pure.T0[i]"
h0 = "pure.h0[i]"
s0 = "pure.s0[i]"
cp0 = "pure.cp0[i]"

[forms.constant_cp.outputs]
cp = "cp0"
h = "h0 + cp0 * (T - T0)"
s = "s0 + cp0 * log(T / T0)"

# ---------------------------------------------------------------- an enthalpy at one temperature

[contracts.standard_state_enthalpy]
doc = "The standard-state molar enthalpy of one species form at the temperature its source states it at, for a species the source gives no heat capacity or entropy of."
roles.i = { type = "species_form", doc = "The species form." }
outputs.h = { type = "MolarEnergy", observable = "standard_molar_enthalpy", doc = "Standard-state molar enthalpy relative to the energy reference, at the stated temperature." }

[forms.assigned_enthalpy]
doc = "An enthalpy assigned to a species form at one temperature: the species of a reactant list whose heat capacity and entropy the source does not state (a propellant mixture, a fuel), so that a calculation can start from its enthalpy."
implements = "standard_state_enthalpy"
completeness = "fully_declared"
status = "expressed"

[forms.assigned_enthalpy.slot_groups.pure]
doc = "The stated enthalpy and its temperature for one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.assigned_enthalpy.slot_groups.pure.slots]
T_ref = { type = "Temperature", doc = "Temperature the enthalpy is stated at." }
h_ref = { type = "MolarEnergy", doc = "Molar enthalpy at that temperature." }

[forms.assigned_enthalpy.let]
h_ref = "pure.h_ref[i]"

[forms.assigned_enthalpy.outputs]
h = "h_ref"

# ---------------------------------------------------------------- piecewise Gibbs energy

[forms.piecewise_gibbs]
doc = "A standard chemical potential given at chosen temperatures, divided by the gas constant and the temperature, with the enthalpy at 298.15 K and a constant heat capacity between each pair of neighbouring temperatures that the program derives from the values (the model of Cantera's Mu0Poly). The heat capacities, and through them the enthalpy and entropy at any temperature, follow from the points by a recursion over them that the program evaluates in code; the form holds what the source states."
implements = "standard_state_thermo"
completeness = "structure_declared_equation_external"
status = "catalogued"
conventions = ["gas_constant"]

[forms.piecewise_gibbs.slot_groups.pure]
doc = "The enthalpy, reference pressure and points of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.piecewise_gibbs.slot_groups.pure.slots]
h0 = { type = "MolarEnergy", doc = "Molar enthalpy at 298.15 K." }
p_ref = { type = "Pressure", doc = "The pressure the chemical potentials apply at." }

[forms.piecewise_gibbs.slot_groups.pure.families.point]
doc = "One chemical potential per temperature, in ascending order of temperature."
index.n = { type = "Integer", min = 1, doc = "Point number, ascending in temperature." }

[forms.piecewise_gibbs.slot_groups.pure.families.point.slots]
T = { type = "Temperature", doc = "Temperature of the point." }
mu0_over_RT = { type = "Scalar", doc = "The standard chemical potential at the temperature, divided by the gas constant and the temperature." }
