module = "group_additivity"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Group additivity of thermochemical properties in the manner of Benson: a property of a molecule is
the sum over the groups of its decomposition of the number of occurrences times the value of the
group. The groups form a hierarchical scheme (a tree whose sibling order decides which node a
fragment matches first). A node's values are one of three states: its own data, a pointer to another
node's data (a redirect), or none, in which case the estimator uses the value the scheme's
`dataless_rule` names (the nearest ancestor with data, or the average of the children). Matching
a molecule to the tree is an algorithm of the estimator, not data; the forms here hold the values and
the sum that uses them.
"""

[contracts.group_additivity_estimate]
doc = "The standard enthalpy of formation and entropy of one molecule at 298.15 K from the number of times each group of the scheme occurs in it."
roles.i = { type = "species", doc = "The molecule." }
sets.groups = { type = "group", doc = "The groups the molecule was matched to, in a fixed order." }
arguments.nu = { type = "Count", over = ["groups"], doc = "How many times each group occurs in the molecule." }
outputs.H298 = { type = "MolarEnergy", doc = "Sum of the counts times the group enthalpies." }
outputs.S298 = { type = "MolarEntropy", doc = "Sum of the counts times the group entropies." }

[forms.benson_group_additivity]
doc = "H = sum nu_k H_k and S = sum nu_k S_k over the groups of the molecule. A group whose value is a pointer reads the value of the group it points at. The heat capacity of a group is a table of values at temperatures, held as a family; the sum of it is not one of the outputs."
implements = "group_additivity_estimate"
completeness = "fully_declared"
status = "expressed"

[forms.benson_group_additivity.slot_groups.node]
doc = "The values of one node of the tree. A node with no data holds no set."
subject.k = { type = "group", doc = "The node." }
bind = { k = "groups" }

[forms.benson_group_additivity.slot_groups.node.slots]
H298 = { type = "MolarEnergy", presence = "stateful", doc = "Standard enthalpy of formation of the group at 298.15 K; a pointer states the value of another node." }
S298 = { type = "MolarEntropy", presence = "stateful", doc = "Standard entropy of the group at 298.15 K; a pointer states the value of another node." }

[forms.benson_group_additivity.slot_groups.node.families.cp]
doc = "One value of the heat capacity of the group at a temperature."
index.n = { type = "Integer", min = 1, doc = "Position in the temperature grid." }

[forms.benson_group_additivity.slot_groups.node.families.cp.slots]
T = { type = "Temperature", doc = "The temperature." }
value = { type = "MolarEntropy", doc = "Heat capacity at that temperature." }

[forms.benson_group_additivity.outputs]
H298 = "sum(nu[k] * node.H298[k] for k in groups)"
S298 = "sum(nu[k] * node.S298[k] for k in groups)"
