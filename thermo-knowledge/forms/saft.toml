module = "saft"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Statistical-associating-fluid-theory models: the Wertheim association contribution of PC-SAFT as an
expressed form, and the group-contribution model SAFT-gamma Mie with its group-pair parameters and
their combining rule.

An association site is an entity of its own (`association_site`: a site scheme, a carrier, a label
and a multiplicity); the parameters of a bond are a set of a pair of sites, held once for the pair in
either order and stated for a pair of sites only where the source lists it. A pair the source does
not list takes the stated default a selection policy gives (association volume zero), so the
association matrix the expression reads is complete; a site that has no parameters of its own
(induced association) holds a set whose slots are `not_applicable`. The number of sites of each type
on a molecule is the `multiplicity` of the site, passed to the expression as an indexed argument the
way the counts of a group assignment are.
"""

# ---------------------------------------------------------------- Wertheim association of PC-SAFT

[contracts.pure_association]
doc = "The fraction of each association site type that is not bonded, and the association contribution to the residual Helmholtz energy per molecule divided by k T, of a pure fluid at a temperature and a molar density."
roles.i = { type = "species", doc = "The fluid." }
sets.sites = { type = "association_site", doc = "The association sites of a molecule of the fluid." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.rho = { type = "MolarDensity", observable = "molar_density", doc = "Molar density." }
arguments.n = { type = "Count", over = ["sites"], doc = "The number of sites of each type on a molecule: the multiplicity of the site." }
outputs.a_assoc = { type = "Scalar", doc = "The association contribution to the residual Helmholtz energy per molecule divided by k T." }
outputs.unbonded = { type = "Scalar", doc = "The mean over the sites of a molecule of the fraction of sites not bonded." }

[forms.pcsaft_association]
doc = "The association contribution of PC-SAFT for a pure fluid: the fraction X_A of sites of type A not bonded solves X_A = 1 / (1 + N_A rho sum_B n_B X_B Delta_AB), with Delta_AB = d^3 g (exp(epsilon_AB / T) - 1) kappa_AB, the segment diameter d = sigma (1 - 0.12 exp(-3 epsilon / T)) and the contact value of the segment radial distribution function g = 1 / (1 - zeta3) + (d / 2) 3 zeta2 / (1 - zeta3)^2 + (d / 2)^2 2 zeta2^2 / (1 - zeta3)^3 of the hard-sphere reference of m segments (zeta_n = pi / 6 N_A rho m d^n). a_assoc = sum_A n_A (ln X_A - X_A / 2 + 1/2). The segment number m is a whole-number-or-not scalar."
implements = "pure_association"
completeness = "fully_declared"
status = "expressed"
conventions = ["avogadro_constant"]

[forms.pcsaft_association.slot_groups.pure]
doc = "The segment parameters of one fluid."
subject.i = { type = "species", doc = "The fluid." }

[forms.pcsaft_association.slot_groups.pure.slots]
m = { type = "Scalar", doc = "Number of segments of a molecule." }
sigma = { type = "Length", doc = "Segment diameter." }
epsilon_over_k = { type = "EnergyTemperature", doc = "Dispersion energy over the Boltzmann constant." }

[forms.pcsaft_association.slot_groups.pair]
doc = "The bond parameters of one pair of association sites, held once for the pair in either order; the pair of a site with itself is allowed. A site with no parameters of its own (induced association) holds a set whose slots are not applicable."
subject.a = { type = "association_site", doc = "One site." }
subject.b = { type = "association_site", doc = "The other site." }
bind = { a = "sites", b = "sites" }
transposition = { rule = "symmetric", roles = ["a", "b"], diagonal = "allowed" }

[forms.pcsaft_association.slot_groups.pair.slots]
kappa = { type = "Scalar", presence = "stateful", doc = "Association volume parameter, dimensionless." }
epsilon_over_k = { type = "EnergyTemperature", presence = "stateful", doc = "Association energy over the Boltzmann constant." }

[forms.pcsaft_association.let]
N_A = "convention.avogadro_constant"
dseg = "pure.sigma[i] * (1 - 0.12 * exp(-3 * pure.epsilon_over_k[i] / T))"
zeta2 = "3.141592653589793 / 6 * N_A * rho * pure.m[i] * dseg ** 2"
zeta3 = "3.141592653589793 / 6 * N_A * rho * pure.m[i] * dseg ** 3"
g = "1 / (1 - zeta3) + dseg / 2 * 3 * zeta2 / (1 - zeta3) ** 2 + (dseg / 2) ** 2 * 2 * zeta2 ** 2 / (1 - zeta3) ** 3"
delta = "[dseg ** 3 * g * pair.kappa[a, b] * (exp(pair.epsilon_over_k[a, b] / T) - 1) for a in sites for b in sites]"

[forms.pcsaft_association.implicit.site_fractions]
doc = "The fraction of each site type not bonded."
unknowns.X = { type = "Fraction", over = ["sites"], lower = 0, upper = 1, start = 0.5 }
residuals = ["X[a] * (1 + N_A * rho * sum(n[b] * X[b] * delta[a, b] for b in sites)) - 1 for a in sites"]
select = "unique"

[forms.pcsaft_association.outputs]
a_assoc = "sum(n[a] * (log(X[a]) - X[a] / 2 + 1 / 2) for a in sites)"
unbonded = "sum(n[a] * X[a] for a in sites) / sum(n[a] for a in sites)"

# ---------------------------------------------------------------- SAFT-gamma Mie

[contracts.saft_residual_helmholtz_mixture]
doc = "The residual Helmholtz energy of a mixture of fixed components at a temperature, a molar density and a composition divided by R T."
sets.components = { type = "species", doc = "The components of the mixture, in a fixed order." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.rho = { type = "MolarDensity", observable = "molar_density", doc = "Molar density." }
arguments.x = { type = "Fraction", over = ["components"], basis = "mole_fraction", doc = "Composition." }
outputs.alpha_r = { type = "Scalar", doc = "The residual Helmholtz energy divided by R T." }

[forms.saftgamma_mie]
doc = "SAFT-gamma Mie, a heterosegmented group-contribution equation of state: a molecule is a set of groups (the counts of its group assignment) each of nu* segments with shape factor S, the segments of unlike groups interact through the group-pair parameters of `mie_group_pair_table` and the bonds between the groups of a molecule are its `group_bond_count`. Association sites sit on groups. The free-energy equations (hard-sphere, first, second and third Mie perturbation terms, chain and association) are in code, so the form states its parameters and not its equation."
implements = "saft_residual_helmholtz_mixture"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.saftgamma_mie.slot_groups.group]
doc = "The like-group parameters of one group: the number of segments it contributes, its shape factor and the Mie potential of its segments."
subject.k = { type = "group", doc = "The group." }

[forms.saftgamma_mie.slot_groups.group.slots]
nu_star = { type = "Scalar", doc = "Number of segments the group contributes to a molecule, a whole number." }
S = { type = "Scalar", doc = "Shape factor of the group: the fraction of a segment's size and interaction it contributes." }
sigma = { type = "Length", doc = "Segment diameter." }
epsilon_over_k = { type = "EnergyTemperature", doc = "Mie potential depth over the Boltzmann constant." }
lambda_r = { type = "Scalar", doc = "Repulsive exponent." }
lambda_a = { type = "Scalar", doc = "Attractive exponent." }

[forms.saftgamma_mie.slot_groups.association]
doc = "The bond parameters of one pair of association sites on groups, held once for the pair in either order."
subject.a = { type = "association_site", doc = "One site." }
subject.b = { type = "association_site", doc = "The other site." }
transposition = { rule = "symmetric", roles = ["a", "b"], diagonal = "allowed" }

[forms.saftgamma_mie.slot_groups.association.slots]
epsilon_hb_over_k = { type = "EnergyTemperature", doc = "Association energy over the Boltzmann constant." }
bonding_volume = { type = "Volume", doc = "Bonding volume of the site pair." }

[contracts.mie_group_pair_parameters]
doc = "The Mie potential of the segments of two groups: the segment diameter, the repulsive and attractive exponents and the depth over the Boltzmann constant."
sets.groups = { type = "group", doc = "The two groups, in a fixed order." }
outputs.sigma = { type = "Length", doc = "Segment diameter of the pair." }
outputs.lambda_r = { type = "Scalar", doc = "Repulsive exponent of the pair." }
outputs.lambda_a = { type = "Scalar", doc = "Attractive exponent of the pair." }
outputs.epsilon = { type = "EnergyTemperature", doc = "Mie potential depth of the pair over the Boltzmann constant." }

[forms.mie_group_pair_table]
doc = "The Mie parameters of an unlike pair of groups as a source states them: the exponents and the depth (a fitted unlike interaction), the diameter being the mean of the two."
implements = "mie_group_pair_parameters"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.mie_group_pair_table.slot_groups.pair]
doc = "The values of one unordered pair of groups."
subject.k = { type = "group", doc = "The first group." }
subject.l = { type = "group", doc = "The second group." }
bind = { k = "groups", l = "groups" }
transposition = { rule = "symmetric", roles = ["k", "l"], diagonal = "forbidden" }

[forms.mie_group_pair_table.slot_groups.pair.slots]
sigma = { type = "Length", doc = "Segment diameter of the pair." }
lambda_r = { type = "Scalar", doc = "Repulsive exponent of the pair." }
lambda_a = { type = "Scalar", doc = "Attractive exponent of the pair." }
epsilon = { type = "EnergyTemperature", doc = "Mie potential depth of the pair over the Boltzmann constant." }

[forms.mie_group_combining]
doc = "The combining rule of SAFT-gamma Mie for an unlike pair of groups: sigma = (sigma_k + sigma_l) / 2, lambda - 3 = sqrt((lambda_k - 3) (lambda_l - 3)) for each exponent, and epsilon = sqrt(sigma_k^3 sigma_l^3) / sigma^3 sqrt(epsilon_k epsilon_l). A selection policy names it for the pairs a source leaves unasserted."
implements = "mie_group_pair_parameters"
completeness = "fully_declared"
status = "expressed"

[forms.mie_group_combining.slot_groups.group]
doc = "The like-group Mie parameters of one group."
subject.k = { type = "group", doc = "The group." }
bind = { k = "groups" }

[forms.mie_group_combining.slot_groups.group.slots]
sigma = { type = "Length", doc = "Segment diameter." }
lambda_r = { type = "Scalar", doc = "Repulsive exponent." }
lambda_a = { type = "Scalar", doc = "Attractive exponent." }
epsilon = { type = "EnergyTemperature", doc = "Mie potential depth over the Boltzmann constant." }

[forms.mie_group_combining.let]
sigma_mean = "sum(group.sigma[k] for k in groups) / 2"

[forms.mie_group_combining.outputs]
sigma = "sigma_mean"
lambda_r = "3 + sqrt(prod(group.lambda_r[k] - 3 for k in groups))"
lambda_a = "3 + sqrt(prod(group.lambda_a[k] - 3 for k in groups))"
epsilon = "sqrt(prod((group.sigma[k] / sigma_mean) ** 3 for k in groups)) * sqrt(prod(group.epsilon[k] / unit('K') for k in groups)) * unit('K')"
