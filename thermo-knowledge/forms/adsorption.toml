module = "adsorption"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Adsorption of one species on one host material. The subject of an isotherm is a pair of different
kinds, the adsorbate (a species) and the adsorbent (a material identified by a registry or a name,
not by composition), so the roles of a slot group are not interchangeable and carry no
transposition.

An isotherm form gives the amount adsorbed per mass of host as a function of pressure at the
temperature its coefficients were fitted for; the temperature and the pressure range are the
validity of the set, not arguments. The kind of amount it gives, absolute or excess or not stated
by the source, is data: the form's output takes its observable from the set. The dimension of the
loading is the loading basis, here per mass of host; a form for another basis (per volume, per
surface area, per unit cell) implements a contract of that basis, and the observables of those
bases exist in the vocabulary for the datasets that state them.

The spreading pressure of ideal adsorbed solution theory is the definite integral of the isotherm
over the logarithm of the pressure, `integral(n(p) / p, p, 0, P)`. A form that holds it has a
sub-form slot for the isotherm, so any isotherm form plugs in, and closes the integral by
quadrature where the isotherm has no closed form.
"""

[contracts.adsorption_isotherm]
doc = "Amount of the adsorbate adsorbed per mass of the host as a function of pressure, at the temperature the coefficients are valid for. The observable (absolute, excess or not stated) is named by the data."
roles.adsorbate = { type = "species", doc = "The adsorbed species." }
roles.host = { type = "material", doc = "The adsorbent." }
arguments.p = { type = "Pressure", observable = "pressure", doc = "Pressure of the bulk phase." }
outputs.n = { type = "Loading", observable_from_set = true, doc = "Amount adsorbed per mass of host." }

# ---------------------------------------------------------------- the isotherms

[forms.langmuir_isotherm]
doc = "Langmuir: n = n_m K p / (1 + K p), with the saturation loading n_m and the affinity K, the inverse of the pressure at half of it."
implements = "adsorption_isotherm"
completeness = "fully_declared"
status = "expressed"

[forms.langmuir_isotherm.output_observables]
n = "pure.quantity"

[forms.langmuir_isotherm.slot_groups.pure]
doc = "The coefficients of one adsorbate on one host."
subject.adsorbate = { type = "species", doc = "The adsorbed species." }
subject.host = { type = "material", doc = "The adsorbent." }

[forms.langmuir_isotherm.slot_groups.pure.slots]
quantity = { type = "observable", doc = "The amount the isotherm gives: absolute, excess or not stated." }
n_m = { type = "Loading", doc = "Saturation loading." }
K = { type = "Scalar / Pressure", doc = "Affinity: the inverse of the pressure at half the saturation loading." }

[forms.langmuir_isotherm.outputs]
n = "pure.n_m[adsorbate, host] * pure.K[adsorbate, host] * p / (1 + pure.K[adsorbate, host] * p)"

[forms.dual_site_langmuir_isotherm]
doc = "Dual-site Langmuir: the sum of the Langmuir terms of two kinds of site, each with its own saturation loading and affinity."
implements = "adsorption_isotherm"
completeness = "fully_declared"
status = "expressed"

[forms.dual_site_langmuir_isotherm.output_observables]
n = "pure.quantity"

[forms.dual_site_langmuir_isotherm.slot_groups.pure]
doc = "The coefficients of one adsorbate on one host."
subject.adsorbate = { type = "species", doc = "The adsorbed species." }
subject.host = { type = "material", doc = "The adsorbent." }

[forms.dual_site_langmuir_isotherm.slot_groups.pure.slots]
quantity = { type = "observable", doc = "The amount the isotherm gives: absolute, excess or not stated." }
n_m1 = { type = "Loading", doc = "Saturation loading of the first kind of site." }
K1 = { type = "Scalar / Pressure", doc = "Affinity of the first kind of site." }
n_m2 = { type = "Loading", doc = "Saturation loading of the second kind of site." }
K2 = { type = "Scalar / Pressure", doc = "Affinity of the second kind of site." }

[forms.dual_site_langmuir_isotherm.outputs]
n = "pure.n_m1[adsorbate, host] * pure.K1[adsorbate, host] * p / (1 + pure.K1[adsorbate, host] * p) + pure.n_m2[adsorbate, host] * pure.K2[adsorbate, host] * p / (1 + pure.K2[adsorbate, host] * p)"

[forms.toth_isotherm]
doc = "Toth: n = n_m K p / (1 + (K p)^t)^(1/t), a Langmuir isotherm with a heterogeneity exponent t. The exponent is a real number held as a scalar."
implements = "adsorption_isotherm"
completeness = "fully_declared"
status = "expressed"

[forms.toth_isotherm.output_observables]
n = "pure.quantity"

[forms.toth_isotherm.slot_groups.pure]
doc = "The coefficients of one adsorbate on one host."
subject.adsorbate = { type = "species", doc = "The adsorbed species." }
subject.host = { type = "material", doc = "The adsorbent." }

[forms.toth_isotherm.slot_groups.pure.slots]
quantity = { type = "observable", doc = "The amount the isotherm gives: absolute, excess or not stated." }
n_m = { type = "Loading", doc = "Saturation loading." }
K = { type = "Scalar / Pressure", doc = "Affinity." }
t = { type = "Scalar", doc = "Heterogeneity exponent." }

[forms.toth_isotherm.outputs]
n = "pure.n_m[adsorbate, host] * pure.K[adsorbate, host] * p / (1 + (pure.K[adsorbate, host] * p) ** pure.t[adsorbate, host]) ** (1 / pure.t[adsorbate, host])"

# ---------------------------------------------------------------- the spreading pressure of IAST

[contracts.iast_spreading_pressure]
doc = "The reduced spreading pressure of one adsorbate on one host at a pressure: the integral of the loading over the logarithm of the pressure from zero, which has the dimension of a loading. Ideal adsorbed solution theory equates it across the components of a mixture."
roles.adsorbate = { type = "species", doc = "The adsorbed species." }
roles.host = { type = "material", doc = "The adsorbent." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "The pressure the integral runs to." }
outputs.psi = { type = "Loading", doc = "Reduced spreading pressure." }

[forms.isotherm_spreading_pressure]
doc = "psi(P) = integral over p from 0 to P of n(p) / p dp, with the pure-component isotherm n the sub-form slot fills. A Langmuir isotherm integrates in closed form; one with no closed form, such as Toth's with a general exponent, is integrated by quadrature."
implements = "iast_spreading_pressure"
completeness = "fully_declared"
status = "expressed"

[forms.isotherm_spreading_pressure.subforms.isotherm]
doc = "The pure-component isotherm."
accepts = "adsorption_isotherm"
multiplicity = "one"
per = "model"

[forms.isotherm_spreading_pressure.outputs]
psi = "integral(isotherm.n(adsorbate=adsorbate, host=host, p=q) / q, q, 0 * unit('Pa'), P)"

# ---------------------------------------------------------------- the pore-size kernel

[contracts.pore_size_kernel]
doc = "The loading an ideal isotherm has in a pore of one width at one relative pressure: the kernel a pore-size distribution is fitted with."
roles.adsorbate = { type = "species", doc = "The probe species." }
roles.host = { type = "material", doc = "The reference adsorbent, such as a carbon with slit pores." }
arguments.width = { type = "Length", doc = "Pore width." }
arguments.relative_pressure = { type = "Scalar", doc = "Pressure over the saturation pressure of the probe." }
outputs.n = { type = "Loading", doc = "Loading of the pore per mass of host." }

[forms.pore_size_kernel_table]
doc = "A table of ideal-isotherm loadings on a grid of pore widths and relative pressures, interpolated between its points. The kernel holds for one probe at one temperature on one kind of pore."
implements = "pore_size_kernel"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.pore_size_kernel_table.slot_groups.pure]
doc = "The kernel of one probe on one host."
subject.adsorbate = { type = "species", doc = "The probe species." }
subject.host = { type = "material", doc = "The reference adsorbent." }

[forms.pore_size_kernel_table.slot_groups.pure.slots]
temperature = { type = "Temperature", doc = "Temperature the kernel holds for." }
kernel = { type = "tabulated_function", doc = "Loading on the grid of two axes: the pore width, then the relative pressure, the series `loading` in row-major order with the relative pressure varying fastest." }
