module = "calphad"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "parameters",
]
doc = """
Compound-energy (CALPHAD) contributions to the molar Gibbs energy of a phase with sublattices: the
temperature functions of a thermodynamic database, the energy of an endmember, the
Redlich-Kister interaction of two species on a site class, the magnetic contribution, and the
extrapolation of a ternary subsystem from its binaries. The subject of an endmember or an
interaction is a constituent array, whose species positions are the order the source asserted:
the position of a species in the array is what fixes the sign of an odd-order interaction term
and which species a Toop extrapolation singles out, and an expression reads it as
`position(t, s)`. A compound-energy contribution form has one meaning for the order index of its
kind of interaction, so a form exists for each number of interacting species: the binary
interaction here, a ternary one would be another form.
"""

# ---------------------------------------------------------------- temperature functions

[contracts.gibbs_temperature_function]
doc = "A named function of temperature of a thermodynamic database, a molar Gibbs energy, which the endmembers of several phases reference."
roles.fn = { type = "model_component", doc = "The function, named in its parameterisation." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
outputs.G = { type = "MolarEnergy", doc = "The molar Gibbs energy." }

[forms.gibbs_polynomial]
doc = "The temperature polynomial of a compound-energy database on each temperature interval: G = a + b T + c T ln T + d T^2 + e / T + f T^3 + g T^7 + h / T^9. A piece holds its interval as half-open, [T_low, T_high), the last piece closed at its upper bound."
implements = "gibbs_temperature_function"
completeness = "fully_declared"
status = "expressed"

[forms.gibbs_polynomial.slot_groups.function]
doc = "The pieces of one function."
subject.fn = { type = "model_component", doc = "The function." }

[forms.gibbs_polynomial.slot_groups.function.families.piece]
doc = "One block of coefficients per temperature interval."
index.n = { type = "Integer", min = 1, doc = "Piece number, ascending in temperature." }
interval = { lower = "T_low", upper = "T_high" }

[forms.gibbs_polynomial.slot_groups.function.families.piece.slots]
T_low = { type = "Temperature", doc = "Lower bound of the interval." }
T_high = { type = "Temperature", doc = "Upper bound of the interval." }
a = { type = "MolarEnergy", doc = "Constant term." }
b = { type = "MolarEntropy", doc = "Coefficient of T." }
c = { type = "MolarEntropy", doc = "Coefficient of T ln T." }
d = { type = "MolarEntropy / Temperature", doc = "Coefficient of T^2." }
e = { type = "MolarEnergy * Temperature", doc = "Coefficient of 1 / T." }
f = { type = "MolarEntropy / Temperature^2", doc = "Coefficient of T^3." }
g = { type = "MolarEntropy / Temperature^6", doc = "Coefficient of T^7." }
h = { type = "MolarEnergy * Temperature^9", doc = "Coefficient of 1 / T^9." }

[forms.gibbs_polynomial.let]
n = "at(function.piece(fn), T)"
ca = "function.piece.a[fn, n]"
cb = "function.piece.b[fn, n]"
cc = "function.piece.c[fn, n]"
cd = "function.piece.d[fn, n]"
ce = "function.piece.e[fn, n]"
cf = "function.piece.f[fn, n]"
cg = "function.piece.g[fn, n]"
ch = "function.piece.h[fn, n]"

[forms.gibbs_polynomial.outputs]
G = "ca + cb * T + cc * T * log(T / unit('K')) + cd * T ** 2 + ce / T + cf * T ** 3 + cg * T ** 7 + ch / T ** 9"

# ---------------------------------------------------------------- endmembers

[contracts.cef_endmember_gibbs]
doc = "The molar Gibbs energy of the endmember of a phase that a constituent array names: one species on each site class."
roles.t = { type = "constituent_array", doc = "The endmember." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
outputs.G = { type = "MolarEnergy", doc = "The molar Gibbs energy of the endmember, per formula unit of the phase." }

[forms.cef_endmember]
doc = "An endmember energy given by a named temperature function, which it references and other endmembers reference as well."
implements = "cef_endmember_gibbs"
completeness = "fully_declared"
status = "expressed"

[forms.cef_endmember.slot_groups.endmember]
doc = "The function of one endmember."
subject.t = { type = "constituent_array", doc = "The endmember." }

[forms.cef_endmember.slot_groups.endmember.slots]
function = { references = "gibbs_temperature_function", doc = "The temperature function that gives the energy of the endmember." }

[forms.cef_endmember.outputs]
G = "endmember.function[t].G(T=T)"

# ---------------------------------------------------------------- binary interaction

[contracts.cef_binary_interaction]
doc = "The Redlich-Kister energy of two species that mix on one site class of a phase, in the array that carries the interaction, per formula unit."
roles.t = { type = "constituent_array", doc = "The array that carries the interaction: the two mixing species on their site class and the species on the other site classes." }
sets.mixing = { type = "species", doc = "The two species the array places on the mixing site class, in any order." }
arguments.y = { type = "Fraction", over = ["mixing"], basis = "site_fraction", doc = "Site fractions of the two species on their site class." }
arguments.spectator = { type = "Fraction", doc = "The product of the site fractions of the species the array places on the other site classes." }
outputs.G = { type = "MolarEnergy", doc = "The interaction energy: the product of the site fractions of the array times the polynomial in the difference of the two mixing fractions." }

[forms.cef_redlich_kister]
doc = "sum_k L_k (y_first - y_second)^k times the site fractions of the array, for an interaction of two species on one site class. The species at position one of the site class is the first: swapping the two in the array changes the sign of every odd-order term, so the order the source asserted is part of the array and two arrays in the two orders are two subjects with one physical meaning."
implements = "cef_binary_interaction"
completeness = "fully_declared"
status = "expressed"

[forms.cef_redlich_kister.slot_groups.interaction]
doc = "The polynomial coefficients of one array."
subject.t = { type = "constituent_array", doc = "The array." }

[forms.cef_redlich_kister.slot_groups.interaction.families.order]
doc = "One coefficient per order."
index.k = { type = "Integer", min = 0, doc = "Order of the term: the power of the difference of the site fractions." }

[forms.cef_redlich_kister.slot_groups.interaction.families.order.slots]
L = { type = "MolarEnergy", doc = "Coefficient of the term." }

[forms.cef_redlich_kister.let]
difference = "sum((1 if position(t, i) == 1 else -1) * y[i] for i in mixing)"

[forms.cef_redlich_kister.outputs]
G = "spectator * prod(y[i] for i in mixing) * sum(interaction.order.L[t, k] * difference ** k for k in interaction.order(t))"

# ---------------------------------------------------------------- magnetic contribution

[contracts.cef_magnetic_energy]
doc = "The magnetic contribution to the molar Gibbs energy of a phase for one array: the Inden-Hillert-Jarl function of the reduced temperature."
roles.t = { type = "constituent_array", doc = "The array whose Curie temperature and magnetic moment are stated." }
roles.ph = { type = "phase_definition", doc = "The phase, whose structure fixes the antiferromagnetic factor and the structure factor." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
outputs.G = { type = "MolarEnergy", doc = "The magnetic contribution, per formula unit." }

[forms.cef_magnetic_ihj]
doc = "G = R T ln(beta + 1) g(tau) with tau = T / Tc, g below the Curie temperature a polynomial in tau and its inverse with the structure factor p, and above it a series in inverse powers of tau. A Curie temperature or magnetic moment stored negative is divided by the antiferromagnetic factor of the phase before use, so the sign the source asserted is what the form reads."
implements = "cef_magnetic_energy"
completeness = "fully_declared"
status = "expressed"
conventions = ["gas_constant"]

[forms.cef_magnetic_ihj.slot_groups.magnetic]
doc = "The Curie temperature and the magnetic moment of one array."
subject.t = { type = "constituent_array", doc = "The array." }

[forms.cef_magnetic_ihj.slot_groups.magnetic.slots]
Tc = { type = "TemperatureDifference", doc = "Curie temperature, negative where the source states an antiferromagnetic transition." }
beta = { type = "Scalar", doc = "Magnetic moment in Bohr magnetons, negative where the source states an antiferromagnetic one." }

[forms.cef_magnetic_ihj.slot_groups.structure]
doc = "The magnetic constants of one phase."
subject.ph = { type = "phase_definition", doc = "The phase." }

[forms.cef_magnetic_ihj.slot_groups.structure.slots]
afm = { type = "Scalar", doc = "Antiferromagnetic factor, by which a negative Curie temperature or moment is divided." }
p = { type = "Scalar", doc = "Structure factor: the fraction of the magnetic enthalpy above the Curie temperature." }

[forms.cef_magnetic_ihj.let]
R = "convention.gas_constant"
tc = "magnetic.Tc[t] / structure.afm[ph] if magnetic.Tc[t] < 0 * unit('K') else magnetic.Tc[t]"
moment = "magnetic.beta[t] / structure.afm[ph] if magnetic.beta[t] < 0 else magnetic.beta[t]"
tau = "T / tc"
A = "518 / 1125 + 11692 / 15975 * (1 / structure.p[ph] - 1)"
below = "1 - (79 / (140 * structure.p[ph] * tau) + 474 / 497 * (1 / structure.p[ph] - 1) * (tau ** 3 / 6 + tau ** 9 / 135 + tau ** 15 / 600)) / A"
above = "-(tau ** -5 / 10 + tau ** -15 / 315 + tau ** -25 / 1500) / A"

[forms.cef_magnetic_ihj.outputs]
G = "R * T * log(moment + 1) * (below if T < tc else above)"

# ---------------------------------------------------------------- ternary extrapolation

[contracts.binary_excess_gibbs_pair]
doc = "The excess Gibbs energy of the binary of two species at the mole fraction of the first."
roles.i = { type = "species", doc = "The first species." }
roles.j = { type = "species", doc = "The second species." }
arguments.xi = { type = "Fraction", doc = "Mole fraction of the first species in the binary." }
outputs.g = { type = "MolarEnergy", observable = "molar_excess_gibbs_energy", doc = "Excess Gibbs energy of the binary." }

[forms.redlich_kister_pair]
doc = "The Redlich-Kister polynomial of the binary of two species: xi (1 - xi) sum_k L_k (2 xi - 1)^k. The pair is held once, for the order its source asserted: read in the other order, the terms of odd order k change sign (parity by the order index)."
implements = "binary_excess_gibbs_pair"
completeness = "fully_declared"
status = "expressed"

[forms.redlich_kister_pair.slot_groups.pair]
doc = "The polynomial coefficients of one pair, as asserted for one order of the species."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "parity", roles = ["i", "j"], by = "k", diagonal = "forbidden" }

[forms.redlich_kister_pair.slot_groups.pair.families.order]
doc = "One coefficient per order."
index.k = { type = "Integer", min = 0, doc = "Order of the term." }

[forms.redlich_kister_pair.slot_groups.pair.families.order.slots]
L = { type = "MolarEnergy", doc = "Coefficient of the term." }

[forms.redlich_kister_pair.outputs]
g = "xi * (1 - xi) * sum(pair.order.L[i, j, k] * (2 * xi - 1) ** k for k in pair.order(i, j))"

[contracts.ternary_extrapolation]
doc = "The excess Gibbs energy of a ternary subsystem of a phase, extrapolated from the binaries of its species."
roles.t = { type = "constituent_array", doc = "The ternary subsystem: the array of its three species, in the order the source asserts." }
sets.components = { type = "species", doc = "The three species of the array." }
arguments.x = { type = "Fraction", over = ["components"], basis = "mole_fraction", doc = "Composition." }
outputs.gE = { type = "MolarEnergy", observable = "molar_excess_gibbs_energy", doc = "Excess Gibbs energy of the ternary." }

[forms.ternary_kohler]
doc = "The Kohler extrapolation: every binary is evaluated at its own renormalised composition and weighted by the square of the sum of its mole fractions. Symmetric in the species."
implements = "ternary_extrapolation"
completeness = "fully_declared"
status = "expressed"

[forms.ternary_kohler.subforms.binary]
doc = "The binary excess energies."
accepts = "binary_excess_gibbs_pair"
multiplicity = "one"
per = "model"

[forms.ternary_kohler.outputs]
gE = """
sum(
    (0 * unit('J/mol')) if i == j else
    (x[i] + x[j]) ** 2 * binary.g(i=i, j=j, xi=x[i] / (x[i] + x[j])) / 2
    for i in components for j in components
)
"""

[forms.ternary_toop]
doc = "The Toop extrapolation: the species at position one of the array is singled out, its binaries are evaluated at its own composition and weighted by the mole fraction of the other species over the rest, and the binary of the other two is evaluated as in the Kohler extrapolation. The species singled out is read from the array's member positions."
implements = "ternary_extrapolation"
completeness = "fully_declared"
status = "expressed"

[forms.ternary_toop.subforms.binary]
doc = "The binary excess energies."
accepts = "binary_excess_gibbs_pair"
multiplicity = "one"
per = "model"

[forms.ternary_toop.outputs]
gE = """
sum(
    (0 * unit('J/mol')) if s == j or position(t, s) != 1 else
    x[j] / (1 - x[s]) * binary.g(i=s, j=j, xi=x[s])
    for s in components for j in components
)
+ sum(
    (0 * unit('J/mol')) if i == j or position(t, i) == 1 or position(t, j) == 1 else
    (x[i] + x[j]) ** 2 * binary.g(i=i, j=j, xi=x[i] / (x[i] + x[j])) / 2
    for i in components for j in components
)
"""

[contracts.ternary_excess_gibbs]
doc = "The excess Gibbs energy of a ternary subsystem of a phase, whatever extrapolation its subsystem uses."
roles.t = { type = "constituent_array", doc = "The ternary subsystem: the array of its three species, in the order the source asserts." }
sets.components = { type = "species", doc = "The three species of the array." }
arguments.x = { type = "Fraction", over = ["components"], basis = "mole_fraction", doc = "Composition." }
outputs.gE = { type = "MolarEnergy", observable = "molar_excess_gibbs_energy", doc = "Excess Gibbs energy of the ternary." }

[forms.ternary_excess_choice]
doc = "The excess Gibbs energy of a ternary subsystem, with the extrapolation chosen for each ternary subsystem of the phase."
implements = "ternary_excess_gibbs"
completeness = "fully_declared"
status = "expressed"

[forms.ternary_excess_choice.subforms.extrapolation]
doc = "The extrapolation model of this ternary subsystem."
accepts = "ternary_extrapolation"
multiplicity = "one"
per = "subject"

[forms.ternary_excess_choice.outputs]
gE = "extrapolation.gE(t=t, components=components, x=x)"
