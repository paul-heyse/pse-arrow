module = "qualify_shared"
uses = ["physical", "provenance", "identity", "parameters", "qualify_fixture"]
doc = "Forms whose parameter sets share another set by reference (a departure function used by several pairs, a named function used by several parameters) and a form whose sub-form is chosen for each pair."

[contracts.qfix_departure_function]
doc = "A departure function of reduced density and inverse reduced temperature."
roles.c = { type = "model_component", doc = "The function, named in its parameterisation." }
arguments.delta = { type = "Scalar", doc = "Reduced density." }
arguments.tau = { type = "Scalar", doc = "Inverse reduced temperature." }
outputs.alpha_r = { type = "Scalar", doc = "The residual Helmholtz energy contribution." }

[contracts.qfix_departure_pair]
doc = "The departure contribution of a pair, from its own scale and a shared departure function."
roles.i = { type = "species", doc = "The first species." }
roles.j = { type = "species", doc = "The second species." }
arguments.delta = { type = "Scalar", doc = "Reduced density." }
arguments.tau = { type = "Scalar", doc = "Inverse reduced temperature." }
outputs.alpha_r = { type = "Scalar", doc = "The contribution." }

[forms.qfix_departure]
doc = "A sum of power terms in delta and tau, the departure function one set states for one component."
implements = "qfix_departure_function"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_departure.slot_groups.core]
doc = "The terms of one model component."
subject.c = { type = "model_component", doc = "The function." }

[forms.qfix_departure.slot_groups.core.families.term]
doc = "One power term."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.qfix_departure.slot_groups.core.families.term.slots]
n = { type = "Scalar", doc = "Coefficient." }
d = { type = "Scalar", doc = "Exponent of delta." }
t = { type = "Scalar", doc = "Exponent of tau." }

[forms.qfix_departure.outputs]
alpha_r = "sum(core.term.n[c, k] * delta ** core.term.d[c, k] * tau ** core.term.t[c, k] for k in core.term(c))"

[forms.qfix_pair_departure]
doc = "A pair scale factor times the departure function the pair references."
implements = "qfix_departure_pair"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_pair_departure.slot_groups.pair]
doc = "The scale factor and the departure function of one pair."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "symmetric", roles = ["i", "j"], diagonal = "forbidden" }

[forms.qfix_pair_departure.slot_groups.pair.slots]
scale = { type = "Scalar", doc = "The scale factor of the pair." }
departure = { references = "qfix_departure_function", doc = "The departure function the pair uses, shared with other pairs." }

[forms.qfix_pair_departure.outputs]
alpha_r = "pair.scale[i, j] * pair.departure[i, j].alpha_r(delta=delta, tau=tau)"

[contracts.qfix_named_function]
doc = "A dimensionless named function of temperature."
roles.c = { type = "model_component", doc = "The function, named in its parameterisation." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.value = { type = "Scalar", doc = "The value." }

[contracts.qfix_term_sum]
doc = "A dimensionless property of one species from literal terms and multiples of named functions."
roles.i = { type = "species", doc = "The species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.g = { type = "Scalar", doc = "The property." }

[forms.qfix_named_line]
doc = "A named function that is a line in temperature in kelvin."
implements = "qfix_named_function"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_named_line.slot_groups.core]
doc = "The coefficients of one named function."
subject.c = { type = "model_component", doc = "The function." }

[forms.qfix_named_line.slot_groups.core.slots]
a = { type = "Scalar", doc = "Constant term." }
b = { type = "Scalar", doc = "Slope per kelvin." }

[forms.qfix_named_line.outputs]
value = "core.a[c] + core.b[c] * (T / unit('K'))"

[forms.qfix_term_sum_form]
doc = "Literal power terms plus multiples of named functions: the shape of a CALPHAD parameter."
implements = "qfix_term_sum"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_term_sum_form.slot_groups.param]
doc = "The terms of one parameter."
subject.i = { type = "species", doc = "The species." }

[forms.qfix_term_sum_form.slot_groups.param.families.literal]
doc = "One literal term: a coefficient times a power of temperature in kelvin."
index.n = { type = "Integer", min = 1, doc = "Term number." }

[forms.qfix_term_sum_form.slot_groups.param.families.literal.slots]
coefficient = { type = "Scalar", doc = "The coefficient." }
power = { type = "Scalar", doc = "The exponent of temperature in kelvin." }

[forms.qfix_term_sum_form.slot_groups.param.families.named]
doc = "One multiple of a named function."
index.n = { type = "Integer", min = 1, doc = "Term number." }

[forms.qfix_term_sum_form.slot_groups.param.families.named.slots]
multiplier = { type = "Scalar", doc = "The multiplier." }
function = { references = "qfix_named_function", doc = "The named function, shared with other parameters." }

[forms.qfix_term_sum_form.outputs]
g = """
sum(param.literal.coefficient[i, n] * (T / unit('K')) ** param.literal.power[i, n] for n in param.literal(i))
+ sum(param.named.multiplier[i, n] * param.named.function[i, n].value(T=T) for n in param.named(i))
"""

[forms.qfix_pair_linear]
doc = "A pair property proportional to temperature in kelvin."
implements = "qfix_pair"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_pair_linear.slot_groups.pair]
doc = "One coefficient per ordered pair."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }

[forms.qfix_pair_linear.slot_groups.pair.slots]
k = { type = "Scalar", doc = "The coefficient." }

[forms.qfix_pair_linear.outputs]
y = "pair.k[i, j] * (T / unit('K'))"

[forms.qfix_pair_quadratic]
doc = "A pair property proportional to the square of temperature in kelvin."
implements = "qfix_pair"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_pair_quadratic.slot_groups.pair]
doc = "One coefficient per ordered pair."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }

[forms.qfix_pair_quadratic.slot_groups.pair.slots]
k = { type = "Scalar", doc = "The coefficient." }

[forms.qfix_pair_quadratic.outputs]
y = "pair.k[i, j] * (T / unit('K')) ** 2"

[contracts.qfix_pair_chosen]
doc = "A dimensionless property of two species whose form the parameterisation chooses for each pair."
roles.i = { type = "species", doc = "The first species." }
roles.j = { type = "species", doc = "The second species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The property." }

[forms.qfix_pair_choice]
doc = "A pair property from the form a parameterisation chooses for each pair."
implements = "qfix_pair_chosen"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_pair_choice.subforms.model]
doc = "The form that gives the property of the pair."
accepts = "qfix_pair"
multiplicity = "one"
per = "subject"

[forms.qfix_pair_choice.outputs]
y = "model.y(i=i, j=j, T=T)"
