module = "qualify_orientation"
uses = ["physical", "provenance", "identity", "parameters", "qualify_fixture"]
doc = "Expressed forms with a transposition rule that acts on values (reciprocal, parity, linear) or keeps the asserted order (permutation group): what a parameter source does when a set is read in the order it was not asserted for."

[contracts.qfix_triple]
doc = "A dimensionless property of three species."
roles.a = { type = "species", doc = "The first species." }
roles.b = { type = "species", doc = "The second species." }
roles.c = { type = "species", doc = "The third species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The property." }

[forms.qfix_ratio_form]
doc = "A pair property proportional to a ratio that inverts when the pair is swapped."
implements = "qfix_pair"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_ratio_form.slot_groups.pair]
doc = "One ratio per pair, held for the order the source asserted."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "reciprocal", roles = ["i", "j"], slots = ["r"] }

[forms.qfix_ratio_form.slot_groups.pair.slots]
r = { type = "Scalar", doc = "The ratio of the first species to the second." }

[forms.qfix_ratio_form.outputs]
y = "pair.r[i, j] * (T / unit('K'))"

[forms.qfix_series_form]
doc = "A pair property as a power series in temperature whose odd-order terms change sign when the pair is swapped."
implements = "qfix_pair"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_series_form.slot_groups.pair]
doc = "The series of one pair, held for the order the source asserted."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "parity", roles = ["i", "j"], by = "order" }

[forms.qfix_series_form.slot_groups.pair.families.term]
doc = "One coefficient per order."
index.order = { type = "Integer", min = 0, doc = "The order of the term." }

[forms.qfix_series_form.slot_groups.pair.families.term.slots]
c = { type = "Scalar", doc = "The coefficient." }

[forms.qfix_series_form.outputs]
y = "sum(pair.term.c[i, j, n] * (T / unit('K')) ** n for n in pair.term(i, j))"

[forms.qfix_margules_form]
doc = "A pair property from two parameters that become (h0 + h1, -h1) when the pair is swapped."
implements = "qfix_pair"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_margules_form.slot_groups.pair]
doc = "The two parameters of one pair, held for the order the source asserted."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "linear", roles = ["i", "j"], slots = ["h0", "h1"], matrix = [[1, 1], [0, -1]] }

[forms.qfix_margules_form.slot_groups.pair.slots]
h0 = { type = "Scalar", doc = "The constant term." }
h1 = { type = "Scalar", doc = "The slope per kelvin." }

[forms.qfix_margules_form.outputs]
y = "pair.h0[i, j] + pair.h1[i, j] * (T / unit('K'))"

[forms.qfix_triple_form]
doc = "A triple property that does not change when the species are permuted by the group, whatever order was asserted."
implements = "qfix_triple"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_triple_form.slot_groups.triple]
doc = "One value per triple up to the group."
subject.a = { type = "species", doc = "The first species." }
subject.b = { type = "species", doc = "The second species." }
subject.c = { type = "species", doc = "The third species." }
transposition = { rule = "permutation_group", roles = ["a", "b", "c"], diagonal = "forbidden", permutations = [["b", "a", "c"], ["a", "c", "b"]] }

[forms.qfix_triple_form.slot_groups.triple.slots]
v = { type = "Scalar", doc = "The value." }

[forms.qfix_triple_form.outputs]
y = "triple.v[a, b, c]"
