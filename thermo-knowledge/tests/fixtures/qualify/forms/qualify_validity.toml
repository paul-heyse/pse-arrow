module = "qualify_validity"
uses = ["physical", "provenance", "identity", "parameters", "observables"]
doc = "Forms whose contracts have arguments that name their observables, for the tests of validity regions: a temperature and a pressure, and two arguments that name the same observable."

[contracts.qval_state]
doc = "A dimensionless property of one species at a temperature and a pressure."
roles.i = { type = "species", doc = "The species." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.p = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.y = { type = "Scalar", doc = "The property." }

[forms.qval_state_linear]
doc = "A constant plus multiples of the temperature in kelvin and the pressure in pascal."
implements = "qval_state"
completeness = "fully_declared"
status = "expressed"

[forms.qval_state_linear.slot_groups.pure]
doc = "The coefficients of one species."
subject.i = { type = "species", doc = "The species." }

[forms.qval_state_linear.slot_groups.pure.slots]
a = { type = "Scalar", doc = "Constant term." }
b = { type = "Scalar", doc = "Slope per kelvin." }
c = { type = "Scalar", doc = "Slope per pascal." }

[forms.qval_state_linear.outputs]
y = "pure.a[i] + pure.b[i] * (T / unit('K')) + pure.c[i] * (p / unit('Pa'))"

[contracts.qval_twin]
doc = "A dimensionless property of one species at two temperatures, both of the observable temperature."
roles.i = { type = "species", doc = "The species." }
arguments.T1 = { type = "Temperature", observable = "temperature", doc = "The first temperature." }
arguments.T2 = { type = "Temperature", observable = "temperature", doc = "The second temperature." }
outputs.y = { type = "Scalar", doc = "The property." }

[forms.qval_twin_linear]
doc = "Multiples of the two temperatures in kelvin."
implements = "qval_twin"
completeness = "fully_declared"
status = "expressed"

[forms.qval_twin_linear.slot_groups.pure]
doc = "The coefficients of one species."
subject.i = { type = "species", doc = "The species." }

[forms.qval_twin_linear.slot_groups.pure.slots]
b = { type = "Scalar", doc = "Slope per kelvin of the first temperature." }
c = { type = "Scalar", doc = "Slope per kelvin of the second temperature." }

[forms.qval_twin_linear.outputs]
y = "pure.b[i] * (T1 / unit('K')) + pure.c[i] * (T2 / unit('K'))"
