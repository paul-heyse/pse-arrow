module = "qualify_fixture"
uses = ["physical", "provenance", "identity", "parameters"]
doc = "Expressed forms whose slots cover what the database-backed parameter source reads: scalar slots, a family, a symmetric pair, a nested set and a sub-form slot."

[contracts.qfix_function]
doc = "A dimensionless function of temperature."
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The value." }

[contracts.qfix_pair]
doc = "A dimensionless property of two species as a function of temperature."
roles.i = { type = "species", doc = "The first species." }
roles.j = { type = "species", doc = "The second species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The property." }

[forms.qfix_linear]
doc = "A linear function of temperature in kelvin."
implements = "qfix_function"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_linear.slot_groups.core]
doc = "The coefficients."

[forms.qfix_linear.slot_groups.core.slots]
a = { type = "Scalar", doc = "Constant term." }
b = { type = "Scalar", doc = "Slope per kelvin." }

[forms.qfix_linear.outputs]
y = "core.a + core.b * (T / unit('K'))"

[forms.qfix_pair_form]
doc = "A pair property from pure weights, a family of power terms, a symmetric pair coefficient, a nested function of the pair and a chosen sub-form."
implements = "qfix_pair"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_pair_form.subforms.shift]
doc = "A function of temperature added to the property."
accepts = "qfix_function"
multiplicity = "one"
per = "model"

[forms.qfix_pair_form.slot_groups.pure]
doc = "The weight and power terms of one species."
subject.i = { type = "species", doc = "The species." }

[forms.qfix_pair_form.slot_groups.pure.slots]
w = { type = "Scalar", doc = "Weight." }

[forms.qfix_pair_form.slot_groups.pure.families.term]
doc = "One power term."
index.n = { type = "Integer", min = 1, doc = "Term number." }

[forms.qfix_pair_form.slot_groups.pure.families.term.slots]
c = { type = "Scalar", doc = "Coefficient." }
e = { type = "Scalar", doc = "Exponent." }

[forms.qfix_pair_form.slot_groups.pair]
doc = "One coefficient and one nested function for an unordered pair."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "symmetric", roles = [
  "i",
  "j",
], diagonal = "forbidden" }

[forms.qfix_pair_form.slot_groups.pair.slots]
k = { type = "Scalar", doc = "Pair coefficient." }
f = { accepts = "qfix_function", doc = "The nested function of the pair." }

[forms.qfix_pair_form.outputs]
y = """
pair.k[i, j] * pure.w[i]
+ sum(pure.term.c[i, n] * (T / unit('K')) ** pure.term.e[i, n] for n in pure.term(i))
+ pair.f[i, j].y(T=T)
+ shift.y(T=T)
"""

[forms.qfix_stateful]
doc = "A linear function whose constant term may be not applicable, withheld or taken from another set."
implements = "qfix_function"
completeness = "fully_declared"
status = "expressed"

[forms.qfix_stateful.slot_groups.core]
doc = "The coefficients."

[forms.qfix_stateful.slot_groups.core.slots]
a = { type = "Scalar", presence = "stateful", doc = "Constant term." }
b = { type = "Scalar", doc = "Slope per kelvin." }

[forms.qfix_stateful.outputs]
y = "core.a + core.b * (T / unit('K'))"
