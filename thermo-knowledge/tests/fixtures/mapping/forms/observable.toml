module = "mapping_observable"
uses = ["physical", "provenance", "identity", "parameters", "observables"]
doc = "A curve whose observable a slot of its sets names, for the canonical writer tests."

[contracts.fixture_saturation]
doc = "A pressure along a saturation curve of a species."
roles.i = { type = "material_entity", doc = "The species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.p = { type = "Pressure", observable_from_set = true, doc = "Pressure at the observable the set names." }

[forms.fixture_curve]
doc = "A curve whose observable (vapour, bubble or dew pressure, say) is chosen by the data."
implements = "fixture_saturation"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_curve.output_observables]
p = "pure.quantity"

[forms.fixture_curve.slot_groups.pure]
doc = "One curve per species."
subject.i = { type = "species", doc = "The species." }

[forms.fixture_curve.slot_groups.pure.slots]
quantity = { type = "observable", doc = "The observable the curve gives." }
A = { type = "Scalar", doc = "A coefficient." }
