module = "mapping_fixture"
uses = ["physical", "provenance", "identity", "parameters"]
doc = "Slot groups with every transposition rule, for the canonical writer tests."

[contracts.fixture_pair]
doc = "A property of an ordered pair of entities."
roles.i = { type = "material_entity", doc = "The first entity." }
roles.j = { type = "material_entity", doc = "The second entity." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The property." }

[contracts.fixture_triple]
doc = "A property of three entities."
roles.a = { type = "material_entity", doc = "The first entity." }
roles.b = { type = "material_entity", doc = "The second entity." }
roles.c = { type = "material_entity", doc = "The third entity." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The property." }

[forms.fixture_symmetric]
doc = "A symmetric pair parameter."
implements = "fixture_pair"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_symmetric.slot_groups.pair]
doc = "One value per unordered pair."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "symmetric", roles = [
  "i",
  "j",
], diagonal = "forbidden" }

[forms.fixture_symmetric.slot_groups.pair.slots]
k = { type = "Scalar", doc = "The parameter." }
T_ref = { type = "Temperature", doc = "A reference temperature." }

[forms.fixture_reciprocal]
doc = "A pair parameter that inverts when the pair is swapped."
implements = "fixture_pair"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_reciprocal.slot_groups.pair]
doc = "One ratio per pair, stored in one orientation."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "reciprocal", roles = ["i", "j"], slots = ["r"] }

[forms.fixture_reciprocal.slot_groups.pair.slots]
r = { type = "Scalar", doc = "The ratio." }
other = { type = "Scalar", doc = "A value that does not invert." }

[forms.fixture_parity]
doc = "A pair parameter whose odd-order terms change sign when the pair is swapped."
implements = "fixture_pair"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_parity.slot_groups.pair]
doc = "Terms by order for a pair."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "parity", roles = ["i", "j"], by = "order" }

[forms.fixture_parity.slot_groups.pair.families.term]
doc = "One term per order."
index.order = { type = "Integer", min = 0, doc = "The order." }

[forms.fixture_parity.slot_groups.pair.families.term.slots]
c = { type = "Scalar", doc = "The coefficient." }

[forms.fixture_group]
doc = "A parameter invariant under a permutation group of three species."
implements = "fixture_triple"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_group.slot_groups.triple]
doc = "One value per triple up to the group."
subject.a = { type = "species", doc = "The first species." }
subject.b = { type = "species", doc = "The second species." }
subject.c = { type = "species", doc = "The third species." }
transposition = { rule = "permutation_group", roles = [
  "a",
  "b",
  "c",
], diagonal = "allowed", permutations = [
  [
    "b",
    "a",
    "c",
  ],
  [
    "a",
    "c",
    "b",
  ],
] }

[forms.fixture_group.slot_groups.triple.slots]
v = { type = "Scalar", doc = "The value." }

[forms.fixture_plain]
doc = "A pure-species group with a stateful slot and a piecewise family."
implements = "fixture_pair"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_plain.slot_groups.pure]
doc = "One value per species."
subject.i = { type = "species", doc = "The species." }

[forms.fixture_plain.slot_groups.pure.slots]
T_c = { type = "Temperature", presence = "stateful", doc = "A critical temperature that may be withheld." }

[forms.fixture_plain.slot_groups.pure.families.piece]
doc = "One piece per temperature interval."
index.n = { type = "Integer", min = 1, doc = "Piece number." }
interval = { lower = "T_low", upper = "T_high" }

[forms.fixture_plain.slot_groups.pure.families.piece.slots]
T_low = { type = "Temperature", doc = "Lower bound." }
T_high = { type = "Temperature", doc = "Upper bound." }

[forms.fixture_margules]
doc = "A pair parameter whose two values transform linearly when the pair is swapped."
implements = "fixture_pair"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_margules.slot_groups.pair]
doc = "Two values per pair, stored in one orientation."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "linear", roles = [
  "i",
  "j",
], slots = [
  "h0",
  "h1",
], matrix = [
  [
    1,
    1,
  ],
  [
    0,
    -1,
  ],
] }

[forms.fixture_margules.slot_groups.pair.slots]
h0 = { type = "Scalar", doc = "The constant term." }
h1 = { type = "Scalar", doc = "The linear term." }
other = { type = "Scalar", doc = "A value that does not transform." }
