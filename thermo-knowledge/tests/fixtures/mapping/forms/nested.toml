module = "mapping_nested"
uses = ["physical", "provenance", "identity", "parameters", "mapping_fixture"]
doc = "Slots whose values are nested parameter sets, for the canonical writer tests."

[contracts.fixture_function]
doc = "A function of temperature."
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The value." }

[forms.fixture_linear]
doc = "A linear function of temperature."
implements = "fixture_function"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_linear.slot_groups.global]
doc = "The coefficients of one function."

[forms.fixture_linear.slot_groups.global.slots]
a = { type = "Scalar", doc = "The intercept." }
b = { type = "Scalar", doc = "The slope." }
T_ref = { type = "Temperature", doc = "The reference temperature." }

[forms.fixture_constant]
doc = "A constant."
implements = "fixture_function"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_constant.slot_groups.global]
doc = "The value of one constant."

[forms.fixture_constant.slot_groups.global.slots]
c = { type = "Scalar", doc = "The value." }

[forms.fixture_nested_pair]
doc = "A pair parameter whose value is a function of temperature, alone and by order."
implements = "fixture_pair"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_nested_pair.slot_groups.pair]
doc = "One function per unordered pair, and one per order."
subject.i = { type = "species", doc = "The first species." }
subject.j = { type = "species", doc = "The second species." }
transposition = { rule = "symmetric", roles = [
  "i",
  "j",
], diagonal = "forbidden" }

[forms.fixture_nested_pair.slot_groups.pair.slots]
k = { type = "Scalar", doc = "A plain parameter." }
f = { accepts = "fixture_function", doc = "The temperature function of the pair." }

[forms.fixture_nested_pair.slot_groups.pair.families.term]
doc = "One function per order."
index.order = { type = "Integer", min = 0, doc = "The order." }

[forms.fixture_nested_pair.slot_groups.pair.families.term.slots]
c = { type = "Scalar", doc = "A plain coefficient." }
g = { accepts = "fixture_function", doc = "The temperature function of this order." }

[forms.fixture_nested_pure]
doc = "A pure-species parameter whose value is a function with a subject."
implements = "fixture_pair"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_nested_pure.slot_groups.pure]
doc = "One function per species."
subject.i = { type = "species", doc = "The species." }

[forms.fixture_nested_pure.slot_groups.pure.slots]
h = { accepts = "fixture_function", doc = "A function." }

[forms.fixture_species_function]
doc = "A function of temperature that depends on a species."
implements = "fixture_function"
completeness = "opaque_bundle"
status = "catalogued"

[forms.fixture_species_function.slot_groups.pure]
doc = "The coefficient of one species."
subject.i = { type = "species", doc = "The species." }

[forms.fixture_species_function.slot_groups.pure.slots]
a = { type = "Scalar", doc = "The coefficient." }
