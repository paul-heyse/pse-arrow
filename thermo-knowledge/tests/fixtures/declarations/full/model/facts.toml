module = "facts"
schema = "tk"
uses = ["physical", "identity", "framework"]
doc = "Relations: facts keyed by typed roles."

[relations.formula]
doc = "Number of atoms of an element in a species formula."
provenance = "inherit:j"
absence = { default = 0 }
value = { type = "Count", doc = "Atom count." }

[relations.formula.keys]
j = { type = "species", doc = "The species." }
e = { type = "element", doc = "The element." }

[relations.interaction]
doc = "A symmetric interaction between two species."
provenance = "own"
absence = "optional"
value = { type = "Scalar", doc = "Interaction strength." }
transposition = { rule = "symmetric", roles = [
  "i",
  "j",
], diagonal = "forbidden" }

[relations.interaction.keys]
i = { type = "species", doc = "First species." }
j = { type = "species", doc = "Second species." }

[relations.signed_interaction]
doc = "An interaction whose sign alternates with an order."
provenance = "none"
absence = "required"
value = { type = "Scalar", doc = "Interaction strength." }
transposition = { rule = "parity", roles = ["i", "j"], by = "order" }

[relations.signed_interaction.keys]
i = { type = "species", doc = "First species." }
j = { type = "species", doc = "Second species." }
order = { type = "Integer", doc = "Order of the interaction." }

[relations.triple]
doc = "A fact about three species that is unchanged by any permutation of them."
provenance = "none"
absence = "optional"
value = { type = "Scalar", doc = "Strength." }
transposition = { rule = "permutation_group", roles = [
  "a",
  "b",
  "c",
], diagonal = "allowed", permutations = [
  [
    "b",
    "a",
    "c",
  ],
  [
    "a",
    "c",
    "b",
  ],
] }

[relations.triple.keys]
a = { type = "species", doc = "First species." }
b = { type = "species", doc = "Second species." }
c = { type = "species", doc = "Third species." }

[relations.class_weight]
doc = "A weight per phase class: an enum-keyed relation."
provenance = "none"
absence = { default = 1.0 }
value = { type = "Scalar", doc = "The weight." }

[relations.class_weight.keys]
class = { type = "phase_class", doc = "The phase class." }

[relations.rank_weight]
doc = "A weight per rank: an integer-keyed relation."
provenance = "none"
absence = "required"
value = { type = "Scalar", doc = "The weight." }

[relations.rank_weight.keys]
rank = { type = "Integer", doc = "The rank." }

[relations.alias]
doc = "Text aliases of an identifier: Id and Text keys."
provenance = "none"
absence = "optional"

[relations.alias.keys]
key = { type = "Id<inchikey>", doc = "The identifier." }
alias = { type = "Text", doc = "An alias." }

[relations.measurement]
doc = "A measured number attached to a record: Record and Meta keys, Real value."
provenance = "inherit:record"
absence = "optional"

[relations.measurement.keys]
record = { type = "Record", doc = "The record the measurement belongs to." }
quantity = { type = "Meta<quantity_type>", doc = "The quantity type fixing the unit." }
index = { type = "Integer", doc = "Position among the record's measurements." }

[relations.measurement.columns]
value = { type = "Real", unit_from = "quantity", doc = "The measured number." }
flag = { type = "Boolean", default = false, doc = "Whether the value is flagged." }
note = { type = "Text", optional = true, doc = "A remark." }

[relations.reading]
doc = "A reading of one record: a state, and a value that only some states have. Exercises the invariants of a relation."
provenance = "inherit:record"
absence = "optional"

[relations.reading.keys]
record = { type = "Record", doc = "The record the reading belongs to." }
n = { type = "Integer", doc = "Position among the record's readings." }

[relations.reading.columns]
state = { type = "phase_class", doc = "The state the reading is taken in." }
value = { type = "Scalar", optional = true, doc = "The reading; present only in a compressible state." }

[[relations.reading.requires]]
name = "value_only_when_compressible"
doc = "A value is present exactly when the state is gas."
enforced = "ddl"
check = { present_iff = { column = "value", when = "state", in = ["gas"] } }

[[relations.reading.requires]]
name = "value_in_range"
doc = "A value lies between minus one and one."
enforced = "ddl"
check = { within = { column = "value", lower = -1, upper = 1 } }

[[relations.reading.requires]]
name = "value_not_below"
doc = "A value is not below minus one half."
enforced = "ddl"
check = { within = { column = "value", lower = -0.5 } }

[[relations.reading.requires]]
name = "readings_distinct"
doc = "No two readings of a record repeat."
enforced = "verify"

[kinds.convention_set]
doc = "The conventions a body of data assumes."
identity = ["label"]
provenance = "own"

[kinds.convention_set.attributes]
label = { type = "Text", doc = "The convention set's label." }
reference_pressure = { type = "Pressure", optional = true, doc = "The pressure its values are referred to." }
