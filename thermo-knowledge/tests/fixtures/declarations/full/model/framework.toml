module = "framework"
schema = "tk"
uses = ["physical", "identity"]
doc = "The kinds the generator's projection of forms relies on, bound in the manifest."

[kinds.parameterization]
doc = "A choice of form and conventions a parameter set belongs to."
identity = ["label"]
provenance = "own"

[kinds.parameterization.attributes]
label = { type = "Text", doc = "The parameterization's label." }

[kinds.tabulated_function]
doc = "A function given as a table with typed axes."
identity = ["label"]
provenance = "own"

[kinds.tabulated_function.attributes]
label = { type = "Text", doc = "The table's label." }

[kinds.parameter_set]
doc = "The values of one slot group that one source fits together."
abstract = true
identity = ["parameterization", "slot_group", "subject_key"]
provenance = "own"

[kinds.parameter_set.attributes]
parameterization = { type = "parameterization", doc = "The parameterization the set belongs to." }
slot_group = { type = "Meta<slot_group>", doc = "The slot group the set's values are of." }
subject_key = { type = "Text", doc = "Canonical text of the subject tuple." }

[kinds.slot_uncertainty]
doc = "The uncertainty of one slot of one parameter set."
identity = ["parameter_set", "slot"]
provenance = "inherit:parameter_set"

[kinds.slot_uncertainty.attributes]
parameter_set = { type = "parameter_set", doc = "The parameter set." }
slot = { type = "Meta<slot>", doc = "The slot the uncertainty is about." }
magnitude = { type = "Real", unit_from = "slot", doc = "The uncertainty, in the unit of the slot." }
