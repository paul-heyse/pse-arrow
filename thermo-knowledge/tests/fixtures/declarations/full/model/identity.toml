module = "identity"
schema = "tk"
uses = ["physical"]
doc = "Material identity and structure."

[kinds.element]
doc = "A chemical element: a declared vocabulary."
identity = ["name"]
provenance = "declaration"

[kinds.element.attributes]
name = { type = "Text", doc = "The element symbol." }
atomic_number = { type = "Integer", doc = "Number of protons." }
molar_mass = { type = "MolarMass", doc = "Standard atomic weight." }

[kinds.element_group]
doc = "A declared group of elements."
identity = ["name"]
provenance = "declaration"

[kinds.element_group.attributes]
name = { type = "Text", doc = "The group's name." }
members = { type = "Set<element>", doc = "The elements of the group." }
temperature_range = { type = "Range<Temperature>", doc = "A temperature window of interest." }
levels = { type = "Array<Integer>", doc = "Levels of interest.", optional = true }

[kinds.material_entity]
doc = "Anything with a material identity; no direct instances."
abstract = true
identity = ["canonical_key"]
provenance = "own"
traces = ["IC-01"]

[kinds.material_entity.attributes]
canonical_key = { type = "Text", doc = "Structure identifier where one exists, else formula, charge and a discriminator." }

[kinds.species]
doc = "A chemical identity: formula, charge and, where known, structure."
extends = "material_entity"
pse = "gap:species_marks"

[kinds.species.attributes]
tag = { type = "Text", doc = "A curation tag." }
charge = { type = "ChargeNumber", default = 0, doc = "Net charge number." }
inchikey = { type = "Id<inchikey>", optional = true, unique = true, doc = "Asserted standard InChIKey.", traces = [
  "IC-13",
] }
smiles = { type = "Text", optional = true, doc = "Asserted SMILES text." }
elements = { type = "Set<element>", doc = "The elements of the species." }
reference_temperatures = { type = "Array<Temperature>", optional = true, doc = "Temperatures of interest." }
validity = { type = "Range<Temperature>", optional = true, doc = "Temperatures over which the species is stable." }
source = { type = "Record", optional = true, doc = "The record this species was asserted in." }
unit_of = { type = "Meta<quantity_type>", optional = true, doc = "The quantity type its scale is expressed in." }
cp_curvature = { type = "MolarCp / Temperature^2", optional = true, doc = "Curvature of the heat capacity." }
uncertainty = { type = "Real", unit_from = "unit_of", optional = true, doc = "Magnitude of the uncertainty, in the unit of unit_of." }
t_min = { type = "Temperature", optional = true, doc = "Lowest temperature of interest." }
t_max = { type = "Temperature", optional = true, doc = "Highest temperature of interest." }
weight = { type = "Scalar", optional = true, doc = "A non-negative weight." }
phase = { type = "phase_class", optional = true, doc = "The usual phase." }
curated = { type = "Boolean", default = false, doc = "Whether a curator has reviewed the species." }
curated_on = { type = "Date", optional = true, doc = "The day of the review." }
curated_at = { type = "Timestamp", optional = true, doc = "The instant of the review." }
checksum = { type = "Hash", optional = true, doc = "Content hash of the source structure file." }
samples = { type = "Array<Real>", unit_from = "unit_of", optional = true, doc = "Sampled numbers, in the unit of unit_of." }
note = { type = "SourceText", optional = true, doc = "Text retained from the source; nothing branches on it." }

[[kinds.species.requires]]
name = "charge_matches_formula"
doc = "The charge equals the formula's charge count."
enforced = "verify"

[[kinds.species.requires]]
name = "elements_known"
doc = "Every element is a known element."
enforced = "load"

[[kinds.species.requires]]
name = "tag_present"
doc = "The tag is not empty."
enforced = "ddl"
check = { nonempty = "tag" }

[[kinds.species.requires]]
name = "t_window"
doc = "The lowest temperature does not exceed the highest."
enforced = "ddl"
check = { ordered = ["t_min", "t_max"] }

[[kinds.species.requires]]
name = "weight_nonnegative"
doc = "The weight is not negative."
enforced = "ddl"
check = { nonnegative = "weight" }

[[kinds.species.requires]]
name = "one_structure"
doc = "Exactly one of the InChIKey and the SMILES is asserted."
enforced = "ddl"
check = { one_of_present = ["inchikey", "smiles"] }

[[kinds.species.unique]]
attributes = ["tag", "charge"]

[kinds.ion]
doc = "A charged species."
extends = "species"

[kinds.ion.attributes]
radius = { type = "Real", unit_from = "unit_of", optional = true, doc = "Ionic radius." }

[kinds.species_form]
doc = "A species in a phase or model context: what parameters are fitted for."
identity = ["species", "label"]
provenance = "own"

[kinds.species_form.attributes]
species = { type = "species", doc = "The species." }
label = { type = "Text", doc = "Discriminator among the forms of one species." }
positive_marker = { type = "Count", optional = true, doc = "A count that must be positive when present." }

[[kinds.species_form.requires]]
name = "marker_positive"
doc = "The marker is positive."
enforced = "ddl"
check = { positive = "positive_marker" }

[kinds.meta_probe]
doc = "Holds one optional reference of every Meta type."
identity = ["label"]
provenance = "none"

[kinds.meta_probe.attributes]
label = { type = "Text", doc = "The probe's label." }
m_quantity_type = { type = "Meta<quantity_type>", optional = true, doc = "A quantity type." }
m_kind = { type = "Meta<kind>", optional = true, doc = "A kind." }
m_contract = { type = "Meta<contract>", optional = true, doc = "A contract." }
m_form = { type = "Meta<form>", optional = true, doc = "A form." }
m_slot_group = { type = "Meta<slot_group>", optional = true, doc = "A slot group." }
m_slot = { type = "Meta<slot>", optional = true, doc = "A slot." }
m_family = { type = "Meta<family>", optional = true, doc = "A family." }
m_subform_slot = { type = "Meta<subform_slot>", optional = true, doc = "A sub-form slot." }

[kinds.instrument]
doc = "An instrument with a calibration state: exercises the invariants of a kind that depend on an enum column."
identity = ["name"]
provenance = "none"

[kinds.instrument.attributes]
name = { type = "Text", doc = "The instrument's name." }
state = { type = "calibration", doc = "Whether it has been calibrated." }
offset = { type = "Scalar", optional = true, doc = "The calibration offset, present once calibrated." }

[[kinds.instrument.requires]]
name = "offset_when_calibrated"
doc = "An offset is present exactly when the instrument is calibrated."
enforced = "ddl"
check = { present_iff = { column = "offset", when = "state", in = ["calibrated"] } }

[[kinds.instrument.requires]]
name = "offset_small"
doc = "An offset lies between minus one and one."
enforced = "ddl"
check = { within = { column = "offset", lower = -1, upper = 1 } }
