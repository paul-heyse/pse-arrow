module = "forms"
uses = ["physical", "identity", "framework", "vocab", "contracts"]
doc = "The form catalogue fixture."

[forms.antoine]
doc = "Antoine equation in natural-log form."
implements = "pure_vapor_pressure"
completeness = "fully_declared"
status = "catalogued"
citations = ["antoine_1888"]

[forms.antoine.slot_groups.pure]
doc = "One set of coefficients per species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.antoine.slot_groups.pure.slots]
A = { type = "Scalar", doc = "First coefficient." }
B = { type = "Temperature", doc = "Second coefficient." }
C = { type = "Temperature", doc = "Third coefficient." }

[forms.critical.slot_groups.global]
doc = "Critical constants valid for the whole model: an empty subject."

[forms.critical]
doc = "Critical constants."
implements = "pure_vapor_pressure"
completeness = "opaque_bundle"
status = "catalogued"

[forms.critical.slot_groups.global.slots]
T_c = { type = "Temperature", presence = "stateful", observable = "critical_temperature", doc = "Critical temperature.", traces = [
  "IC-30",
] }
kind = { type = "phase_class", doc = "The phase class the constants describe." }
gas_table = { type = "tabulated_function", doc = "A tabulated correction." }
aggregation = { type = "aggregation", doc = "A referenced declared entity." }

[forms.nasa7]
doc = "NASA seven-coefficient polynomials."
implements = "heat_capacity"
completeness = "fully_declared"
status = "catalogued"

[forms.nasa7.slot_groups.pure]
doc = "Coefficient blocks of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.nasa7.slot_groups.pure.families.piece]
doc = "One coefficient block per temperature interval."
index.n = { type = "Integer", min = 1, doc = "Piece number." }
interval = { lower = "T_low", upper = "T_high" }

[forms.nasa7.slot_groups.pure.families.piece.slots]
T_low = { type = "Temperature", doc = "Lower bound of the piece." }
T_high = { type = "Temperature", doc = "Upper bound of the piece." }
a1 = { type = "Scalar", doc = "First coefficient." }

[forms.kij]
doc = "A symmetric binary interaction parameter."
implements = "binary_parameter"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.kij.slot_groups.pair]
doc = "One parameter per unordered pair."
subject.i = { type = "species_form", doc = "First species form." }
subject.j = { type = "species_form", doc = "Second species form." }
transposition = { rule = "symmetric", roles = [
  "i",
  "j",
], diagonal = "forbidden" }

[forms.kij.slot_groups.pair.slots]
k = { type = "Scalar", doc = "The parameter." }

[forms.ratio]
doc = "A binary parameter that inverts when its subjects swap."
implements = "binary_parameter"
completeness = "fully_declared"
status = "catalogued"

[forms.ratio.slot_groups.pair]
doc = "One ratio per ordered pair, stored in one orientation."
subject.i = { type = "species_form", doc = "First species form." }
subject.j = { type = "species_form", doc = "Second species form." }
transposition = { rule = "reciprocal", roles = ["i", "j"], slots = ["r"] }

[forms.ratio.slot_groups.pair.slots]
r = { type = "Scalar", doc = "The ratio." }

[forms.cubic]
doc = "A cubic equation of state, vapour pressure only."
implements = "pure_vapor_pressure"
completeness = "structure_declared_equation_external"
status = "catalogued"

[forms.cubic.subforms.alpha]
doc = "Temperature dependence of the attractive parameter."
accepts = "alpha_function"
multiplicity = "one"
per = "subject"

[forms.cubic.slot_groups.pure]
doc = "Pure-component parameters."
subject.i = { type = "species_form", doc = "The species form." }

[forms.cubic.slot_groups.pure.slots]
a_c = { type = "Pressure", doc = "Attractive parameter at the critical point." }
alpha_coefficients = { accepts = "alpha_function", doc = "A nested parameter set of an alpha function." }

[forms.soave]
doc = "Soave alpha function."
implements = "alpha_function"
completeness = "fully_declared"
status = "catalogued"

[forms.soave.slot_groups.pure]
doc = "One m per species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.soave.slot_groups.pure.slots]
m = { type = "Scalar", doc = "The slope." }

[forms.mixture_linear]
doc = "A mole-fraction weighted sum of pure heat capacities: locals, outputs and a bound subject role."
implements = "mixture_heat_capacity"
completeness = "fully_declared"
status = "expressed"

[forms.mixture_linear.slot_groups.pure]
doc = "The heat capacity of one component."
subject.i = { type = "species_form", doc = "The component." }
bind = { i = "components" }

[forms.mixture_linear.slot_groups.pure.slots]
cp = { type = "MolarCp", doc = "Heat capacity of the pure component." }

[forms.mixture_linear.let]
total = "sum(x[i] for i in components)"

[forms.mixture_linear.outputs]
cp = "sum(x[i] * pure.cp[i] for i in components) / total"

[forms.site_balance_form]
doc = "An implicit block over a set: one unknown and one residual for each site, with a numeric and an expression bound."
implements = "site_balance"
completeness = "fully_declared"
status = "expressed"

[forms.site_balance_form.implicit.fractions]
doc = "Fraction of each site that is free."
unknowns.X = { type = "Scalar", over = [
  "sites",
], lower = 0, upper = "1 + 0 * T / unit('K')", start = 0.5 }
residuals = ["X[a] + x[a] * X[a] ** 2 - 1 for a in sites"]
select = "unique"

[forms.site_balance_form.outputs]
total = "sum(X[a] for a in sites)"

[forms.margules]
doc = "A binary parameter pair that transforms linearly when its subjects swap."
implements = "binary_parameter"
completeness = "fully_declared"
status = "catalogued"

[forms.margules.slot_groups.pair]
doc = "Two parameters per pair, stored in one orientation."
subject.i = { type = "species_form", doc = "First species form." }
subject.j = { type = "species_form", doc = "Second species form." }
transposition = { rule = "linear", roles = [
  "i",
  "j",
], slots = [
  "h0",
  "h1",
], matrix = [
  [
    1,
    1,
  ],
  [
    0,
    -1,
  ],
] }

[forms.margules.slot_groups.pair.slots]
h0 = { type = "Scalar", doc = "The constant term." }
h1 = { type = "Scalar", doc = "The linear term." }

[forms.saturation_curve]
doc = "A saturation curve whose observable is chosen by the data."
implements = "saturation_pressure_of_set"
completeness = "opaque_bundle"
status = "catalogued"

[forms.saturation_curve.output_observables]
p = "pure.quantity"

[forms.saturation_curve.slot_groups.pure]
doc = "One curve per species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.saturation_curve.slot_groups.pure.slots]
quantity = { type = "observable", doc = "The observable the curve gives." }
A = { type = "Scalar", doc = "A coefficient." }
