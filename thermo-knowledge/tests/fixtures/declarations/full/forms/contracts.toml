module = "contracts"
uses = ["physical", "vocab"]
doc = "What forms consume and produce."

[contracts.pure_vapor_pressure]
doc = "Saturation pressure of a pure species form as a function of temperature."
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.p_sat = { type = "Pressure", observable = "vapor_pressure", doc = "Saturation pressure." }

[contracts.alpha_function]
doc = "Temperature dependence of a cubic equation's attractive parameter."
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.alpha = { type = "Scalar", doc = "The dimensionless factor." }

[contracts.heat_capacity]
doc = "Ideal-gas molar heat capacity as a function of temperature."
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.cp = { type = "MolarCp", doc = "Molar heat capacity." }

[contracts.binary_parameter]
doc = "A parameter between two species forms."
roles.i = { type = "species_form", doc = "The first species form." }
roles.j = { type = "species_form", doc = "The second species form." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.k = { type = "Scalar", doc = "The parameter." }

[contracts.mixture_heat_capacity]
doc = "Molar heat capacity of a mixture: indexed arguments, sets and a composition basis."
sets.components = { type = "species_form", doc = "The components of the mixture, in a fixed order." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.x = { type = "Scalar", over = [
  "components",
], basis = "mole_fraction", doc = "Composition." }
outputs.cp = { type = "MolarCp", doc = "Molar heat capacity." }

[contracts.site_balance]
doc = "A total over a set of sites whose fractions solve a balance: indexed unknowns in an implicit block."
sets.sites = { type = "species_form", doc = "The sites of the mixture, in a fixed order." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.x = { type = "Scalar", over = [
  "sites",
], doc = "Composition of the sites." }
outputs.total = { type = "Scalar", doc = "The total of the site fractions." }

[contracts.saturation_pressure_of_set]
doc = "Pressure of a saturation curve whose observable (vapour, bubble or dew pressure) the implementing form's data names."
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.p = { type = "Pressure", observable_from_set = true, doc = "Pressure at the observable the form's slot names." }
