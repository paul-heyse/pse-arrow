module = "expr_case"
uses = ["physical", "identity", "exprtypes"]
doc = "A broken expression case."

[contracts.inner]
doc = "A dimensionless factor over a set of species."
sets.s = { type = "species", doc = "A set." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.x = { type = "Fraction", over = ["s"], basis = "mole_fraction", doc = "Mole fractions." }
outputs.value = { type = "Scalar", doc = "The factor." }

[contracts.outer]
doc = "A pressure of a mixture."
sets.s = { type = "species", doc = "A set." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.phi = { type = "Fraction", over = ["s"], basis = "volume_fraction", doc = "Volume fractions." }
outputs.p = { type = "Pressure", doc = "Pressure." }

[forms.f]
doc = "The form under test."
implements = "outer"
completeness = "fully_declared"
status = "expressed"

[forms.f.subforms.k]
doc = "The factor."
accepts = "inner"
multiplicity = "one"
per = "model"

[forms.f.outputs]
p = "k.value(s=s, T=T, x=[phi[i] for i in s]) * unit('Pa')"
