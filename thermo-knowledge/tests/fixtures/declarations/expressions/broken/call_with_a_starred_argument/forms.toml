module = "expr_case"
uses = ["physical", "identity", "exprtypes"]
doc = "A broken expression case."

[contracts.inner]
doc = "A dimensionless factor of a species and a temperature."
roles.i = { type = "species", doc = "The species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.value = { type = "Scalar", doc = "The factor." }

[contracts.outer]
doc = "A pressure of a species."
roles.i = { type = "species", doc = "The species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.p = { type = "Pressure", doc = "Pressure." }

[forms.f]
doc = "The form under test."
implements = "outer"
completeness = "fully_declared"
status = "expressed"

[forms.f.subforms.s]
doc = "The factor."
accepts = "inner"
multiplicity = "one"
per = "subject"

[forms.f.outputs]
p = "s.value(*i) * unit('Pa')"
