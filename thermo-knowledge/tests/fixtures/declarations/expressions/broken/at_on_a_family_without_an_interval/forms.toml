module = "expr_case"
uses = ["physical", "identity", "exprtypes"]
doc = "A broken expression case."

[contracts.vp]
doc = "Saturation pressure of one species."
roles.i = { type = "species", doc = "The species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.p = { type = "Pressure", doc = "Pressure." }

[forms.f]
doc = "The form under test."
implements = "vp"
completeness = "fully_declared"
status = "expressed"

[forms.f.slot_groups.pure]
doc = "Coefficients."
subject.i = { type = "species", doc = "The species." }

[forms.f.slot_groups.pure.slots]
A = { type = "Scalar", doc = "A." }
B = { type = "Temperature", doc = "B." }

[forms.f.slot_groups.pure.families.piece]
doc = "Pieces."
index.n = { type = "Integer", min = 1, doc = "Piece." }

[forms.f.slot_groups.pure.families.piece.slots]
lo = { type = "Temperature", doc = "Lower." }

[forms.f.outputs]
p = "at(pure.piece(i), T) * unit('Pa')"
