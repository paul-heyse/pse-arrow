module = "expr_case"
uses = ["physical", "identity", "exprtypes"]
doc = "A broken expression case."

[contracts.vp]
doc = "Pressure of a mixture."
roles.r = { type = "species", doc = "A reference species." }
sets.components = { type = "material_entity", doc = "The components." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.x = { type = "Fraction", over = [
  "components",
], basis = "mole_fraction", doc = "Composition." }
outputs.p = { type = "Pressure", doc = "Pressure." }

[forms.f]
doc = "The form under test."
implements = "vp"
completeness = "fully_declared"
status = "expressed"

[forms.f.slot_groups.pure]
doc = "Coefficients."
subject.i = { type = "species", doc = "The species." }
bind = { i = "components" }

[forms.f.slot_groups.pure.slots]
A = { type = "Scalar", doc = "A." }
B = { type = "Temperature", doc = "B." }

[forms.f.outputs]
p = "sum(1 for n in range(0, T)) * unit('Pa')"
