module = "expr_transposition"
uses = ["physical", "identity", "exprtypes"]
doc = "Reciprocal and permutation-group transposition of slot groups."

[contracts.pair_value]
doc = "A dimensionless value of two species."
roles.i = { type = "species", doc = "First species." }
roles.j = { type = "species", doc = "Second species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.v = { type = "Scalar", doc = "The value." }

[contracts.triple_value]
doc = "A dimensionless value of three species."
roles.i = { type = "species", doc = "First species." }
roles.j = { type = "species", doc = "Second species." }
roles.k = { type = "species", doc = "Third species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.v = { type = "Scalar", doc = "The value." }

[forms.reciprocal_form]
doc = "A ratio that inverts when the pair is swapped, and a value that does not."
implements = "pair_value"
completeness = "fully_declared"
status = "expressed"

[forms.reciprocal_form.slot_groups.pair]
doc = "Held in one orientation."
subject.i = { type = "species", doc = "First species." }
subject.j = { type = "species", doc = "Second species." }
transposition = { rule = "reciprocal", roles = ["i", "j"], slots = ["r"] }

[forms.reciprocal_form.slot_groups.pair.slots]
r = { type = "Scalar", doc = "The ratio." }
s = { type = "Scalar", doc = "A value unchanged by the swap." }

[forms.reciprocal_form.outputs]
v = "pair.r[i, j] + 10 * pair.s[i, j]"

[forms.permutation_form]
doc = "A value unchanged when the first two species are exchanged."
implements = "triple_value"
completeness = "fully_declared"
status = "expressed"

[forms.permutation_form.slot_groups.triple]
doc = "Held for one arrangement."
subject.i = { type = "species", doc = "First species." }
subject.j = { type = "species", doc = "Second species." }
subject.k = { type = "species", doc = "Third species." }
transposition = { rule = "permutation_group", roles = [
  "i",
  "j",
  "k",
], permutations = [
  [
    "j",
    "i",
    "k",
  ],
], diagonal = "allowed" }

[forms.permutation_form.slot_groups.triple.slots]
w = { type = "Scalar", doc = "The value." }

[forms.permutation_form.outputs]
v = "triple.w[i, j, k]"

[contracts.excess_pair]
doc = "Excess Gibbs energy over RT of a binary mixture of two species, as a function of the mole fraction of the first."
roles.i = { type = "species", doc = "First species." }
roles.j = { type = "species", doc = "Second species." }
arguments.xi = { type = "Scalar", doc = "Mole fraction of the first species." }
outputs.gE = { type = "Scalar", doc = "Excess Gibbs energy divided by RT." }

[forms.margules_form]
doc = "Two-parameter Margules excess energy; the parameters of the swapped pair are (h0 + h1, -h1)."
implements = "excess_pair"
completeness = "fully_declared"
status = "expressed"

[forms.margules_form.slot_groups.pair]
doc = "Held in one orientation."
subject.i = { type = "species", doc = "First species." }
subject.j = { type = "species", doc = "Second species." }
transposition = { rule = "linear", roles = [
  "i",
  "j",
], slots = [
  "h0",
  "h1",
], matrix = [
  [
    1,
    1,
  ],
  [
    0,
    -1,
  ],
] }

[forms.margules_form.slot_groups.pair.slots]
h0 = { type = "Scalar", doc = "The constant term." }
h1 = { type = "Scalar", doc = "The term linear in the mole fraction of the second species." }

[forms.margules_form.outputs]
gE = "xi * (1 - xi) * (pair.h0[i, j] + pair.h1[i, j] * (1 - xi))"
