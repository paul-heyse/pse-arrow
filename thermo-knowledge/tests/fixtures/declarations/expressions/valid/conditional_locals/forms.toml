module = "expr_conditional_locals"
uses = ["physical", "identity", "exprtypes"]
doc = "Forms whose conditional locals are the tests of other conditionals: a region chosen from a state, the equation of the region chosen by the local that holds it."

[contracts.regional_curve]
doc = "A dimensionless function of a temperature and a pressure for one species form."
roles.i = { type = "species", doc = "The species form." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.p = { type = "Pressure", doc = "Pressure." }
outputs.region = { type = "Scalar", doc = "The region." }
outputs.y = { type = "Scalar", doc = "The value." }
outputs.other = { type = "Scalar", doc = "One where the region is not 2, zero where it is." }
outputs.band = { type = "Scalar", doc = "One where the region is above 1 and at most 3, zero elsewhere." }

# The region is a local and each output tests it.
[forms.nested_local]
doc = "Three regions by two temperature limits and a pressure test; the region is a local tested by the output."
implements = "regional_curve"
completeness = "fully_declared"
status = "expressed"

[forms.nested_local.slot_groups.limits]
doc = "The limits between the regions."
subject.i = { type = "species", doc = "The species form." }

[forms.nested_local.slot_groups.limits.slots]
T_hi = { type = "Temperature", doc = "Above this temperature the region is 5." }
T_mid = { type = "Temperature", doc = "Above this temperature the region is 2 or 3." }
p_b = { type = "Pressure", doc = "Below this pressure, between the limits, the region is 2." }

[forms.nested_local.let]
r = "5 if T > limits.T_hi[i] else ((2 if p < limits.p_b[i] else 3) if T > limits.T_mid[i] else 1)"
y1 = "exp(T / limits.T_mid[i])"
y2 = "T / limits.T_hi[i] + p / limits.p_b[i]"
y3 = "log(T / limits.T_mid[i]) * p / limits.p_b[i]"
y5 = "sqrt(T / limits.T_hi[i])"

[forms.nested_local.outputs]
region = "r"
y = "y5 if r == 5 else (y3 if r == 3 else (y2 if r == 2 else y1))"
other = "1 if r != 2 else 0"
band = "1 if r > 1 and r <= 3 else 0"

[forms.flat]
doc = "The same function with the predicate of the region written in each output."
implements = "regional_curve"
completeness = "fully_declared"
status = "expressed"

[forms.flat.slot_groups.limits]
doc = "The limits between the regions."
subject.i = { type = "species", doc = "The species form." }

[forms.flat.slot_groups.limits.slots]
T_hi = { type = "Temperature", doc = "Above this temperature the region is 5." }
T_mid = { type = "Temperature", doc = "Above this temperature the region is 2 or 3." }
p_b = { type = "Pressure", doc = "Below this pressure, between the limits, the region is 2." }

[forms.flat.let]
y1 = "exp(T / limits.T_mid[i])"
y2 = "T / limits.T_hi[i] + p / limits.p_b[i]"
y3 = "log(T / limits.T_mid[i]) * p / limits.p_b[i]"
y5 = "sqrt(T / limits.T_hi[i])"

[forms.flat.outputs]
region = "5 if T > limits.T_hi[i] else ((2 if p < limits.p_b[i] else 3) if T > limits.T_mid[i] else 1)"
y = "y5 if T > limits.T_hi[i] else ((y2 if p < limits.p_b[i] else y3) if T > limits.T_mid[i] else y1)"
other = "0 if (5 if T > limits.T_hi[i] else ((2 if p < limits.p_b[i] else 3) if T > limits.T_mid[i] else 1)) == 2 else 1"
band = "1 if (5 if T > limits.T_hi[i] else ((2 if p < limits.p_b[i] else 3) if T > limits.T_mid[i] else 1)) > 1 and (5 if T > limits.T_hi[i] else ((2 if p < limits.p_b[i] else 3) if T > limits.T_mid[i] else 1)) <= 3 else 0"

# The shape of a regional formulation: the region depends on the state through three limits, a
# boundary pressure that is a quadratic in the temperature and a saturation pressure that is a
# quartic ratio with a square root. Its value is chosen by the local that holds the region.
[contracts.regional_state]
doc = "A dimensionless function of a temperature and a pressure for one species form, and its region."
roles.i = { type = "species", doc = "The species form." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.p = { type = "Pressure", doc = "Pressure." }
outputs.region = { type = "Scalar", doc = "The region." }
outputs.y = { type = "Scalar", doc = "The value." }

[forms.three_levels]
doc = "Four regions from three levels of conditional; the region is a local tested by the output."
implements = "regional_state"
completeness = "fully_declared"
status = "expressed"

[forms.three_levels.slot_groups.limits]
doc = "The limits between the regions."
subject.i = { type = "species", doc = "The species form." }

[forms.three_levels.slot_groups.limits.slots]
T_13 = { type = "Temperature", doc = "The highest temperature of region 1 and the lowest of region 3." }
T_23 = { type = "Temperature", doc = "Above this temperature every state below T_25 is region 2." }
T_25 = { type = "Temperature", doc = "The highest temperature of region 2 and the lowest of region 5." }
p_b = { type = "Pressure", doc = "The pressure scale of the boundary and of the saturation pressure, which is that scale times a quartic of the reduced temperature." }

[forms.three_levels.slot_groups.sat]
doc = "The coefficients of the saturation pressure."
subject.i = { type = "species", doc = "The species form." }

[forms.three_levels.slot_groups.sat.slots]
n1 = { type = "Scalar", doc = "Coefficient 1." }
n2 = { type = "Scalar", doc = "Coefficient 2." }
n3 = { type = "Scalar", doc = "Coefficient 3." }
n4 = { type = "Scalar", doc = "Coefficient 4." }
n5 = { type = "Scalar", doc = "Coefficient 5." }
n6 = { type = "Scalar", doc = "Coefficient 6." }
n7 = { type = "Scalar", doc = "Coefficient 7." }
n8 = { type = "Scalar", doc = "Coefficient 8." }
n9 = { type = "Scalar", doc = "Coefficient 9." }
n10 = { type = "Scalar", doc = "Coefficient 10." }

[forms.three_levels.let]
x = "T / limits.T_13[i]"
p_bound = "limits.p_b[i] * (1 + 0.5 * x + 0.1 * x ** 2)"
theta = "T / unit('K') + sat.n9[i] / (T / unit('K') - sat.n10[i])"
A = "theta ** 2 + sat.n1[i] * theta + sat.n2[i]"
B = "sat.n3[i] * theta ** 2 + sat.n4[i] * theta + sat.n5[i]"
C = "sat.n6[i] * theta ** 2 + sat.n7[i] * theta + sat.n8[i]"
p_sat = "limits.p_b[i] * (2 * C / (-B + sqrt(B ** 2 - 4 * A * C))) ** 4"
r = "5 if T > limits.T_25[i] else (2 if T > limits.T_23[i] else ((2 if p < p_bound else 3) if T > limits.T_13[i] else (1 if p > p_sat else 2)))"
v1 = "p / limits.p_b[i] + x"
v2 = "exp(-x) * p / limits.p_b[i]"
v3 = "log(x) + p / p_bound"
v5 = "sqrt(x) * p / limits.p_b[i]"

[forms.three_levels.outputs]
region = "r"
y = "v5 if r == 5 else (v2 if r == 2 else (v3 if r == 3 else v1))"

[forms.three_levels_flat]
doc = "The same function with the predicates written in each output."
implements = "regional_state"
completeness = "fully_declared"
status = "expressed"

[forms.three_levels_flat.slot_groups.limits]
doc = "The limits between the regions."
subject.i = { type = "species", doc = "The species form." }

[forms.three_levels_flat.slot_groups.limits.slots]
T_13 = { type = "Temperature", doc = "The highest temperature of region 1 and the lowest of region 3." }
T_23 = { type = "Temperature", doc = "Above this temperature every state below T_25 is region 2." }
T_25 = { type = "Temperature", doc = "The highest temperature of region 2 and the lowest of region 5." }
p_b = { type = "Pressure", doc = "The pressure scale of the boundary and of the saturation pressure, which is that scale times a quartic of the reduced temperature." }

[forms.three_levels_flat.slot_groups.sat]
doc = "The coefficients of the saturation pressure."
subject.i = { type = "species", doc = "The species form." }

[forms.three_levels_flat.slot_groups.sat.slots]
n1 = { type = "Scalar", doc = "Coefficient 1." }
n2 = { type = "Scalar", doc = "Coefficient 2." }
n3 = { type = "Scalar", doc = "Coefficient 3." }
n4 = { type = "Scalar", doc = "Coefficient 4." }
n5 = { type = "Scalar", doc = "Coefficient 5." }
n6 = { type = "Scalar", doc = "Coefficient 6." }
n7 = { type = "Scalar", doc = "Coefficient 7." }
n8 = { type = "Scalar", doc = "Coefficient 8." }
n9 = { type = "Scalar", doc = "Coefficient 9." }
n10 = { type = "Scalar", doc = "Coefficient 10." }

[forms.three_levels_flat.let]
x = "T / limits.T_13[i]"
p_bound = "limits.p_b[i] * (1 + 0.5 * x + 0.1 * x ** 2)"
theta = "T / unit('K') + sat.n9[i] / (T / unit('K') - sat.n10[i])"
A = "theta ** 2 + sat.n1[i] * theta + sat.n2[i]"
B = "sat.n3[i] * theta ** 2 + sat.n4[i] * theta + sat.n5[i]"
C = "sat.n6[i] * theta ** 2 + sat.n7[i] * theta + sat.n8[i]"
p_sat = "limits.p_b[i] * (2 * C / (-B + sqrt(B ** 2 - 4 * A * C))) ** 4"
v1 = "p / limits.p_b[i] + x"
v2 = "exp(-x) * p / limits.p_b[i]"
v3 = "log(x) + p / p_bound"
v5 = "sqrt(x) * p / limits.p_b[i]"

[forms.three_levels_flat.outputs]
region = "5 if T > limits.T_25[i] else (2 if T > limits.T_23[i] else ((2 if p < p_bound else 3) if T > limits.T_13[i] else (1 if p > p_sat else 2)))"
y = "v5 if T > limits.T_25[i] else (v2 if T > limits.T_23[i] else ((v2 if p < p_bound else v3) if T > limits.T_13[i] else (v1 if p > p_sat else v2)))"
