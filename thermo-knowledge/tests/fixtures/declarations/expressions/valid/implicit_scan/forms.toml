module = "expr_implicit_scan"
uses = ["physical", "identity", "exprtypes"]
doc = "Residuals that are not polynomials: the interval of the unknown is scanned and each sign change bracketed."

[contracts.root_of]
doc = "The root of an equation in the argument u."
arguments.u = { type = "Scalar", doc = "A parameter of the equation." }
outputs.value = { type = "Scalar", doc = "The root." }

[forms.exponential]
doc = "exp(x) = u on [-3, 5]: one root, ln u."
implements = "root_of"
completeness = "fully_declared"
status = "expressed"

[forms.exponential.implicit.root]
doc = "The root."
unknowns.x = { type = "Scalar", lower = -3, upper = 5 }
residuals = ["exp(x) - u"]
select = "unique"

[forms.exponential.outputs]
value = "x"

[forms.sine_smallest]
doc = "sin(x) = u on [0, 7]: three roots for u in (0, 1) and (a, b) below; the smallest."
implements = "root_of"
completeness = "fully_declared"
status = "expressed"

[forms.sine_smallest.implicit.root]
doc = "The root."
unknowns.x = { type = "Scalar", lower = 0, upper = 7 }
residuals = ["sin(x) - u"]
select = "smallest"

[forms.sine_smallest.outputs]
value = "x"

[forms.sine_largest]
doc = "The same equation, the largest root."
implements = "root_of"
completeness = "fully_declared"
status = "expressed"

[forms.sine_largest.implicit.root]
doc = "The root."
unknowns.x = { type = "Scalar", lower = 0, upper = 7 }
residuals = ["sin(x) - u"]
select = "largest"

[forms.sine_largest.outputs]
value = "x"

[forms.sine_unique]
doc = "The same equation with `unique`."
implements = "root_of"
completeness = "fully_declared"
status = "expressed"

[forms.sine_unique.implicit.root]
doc = "The root."
unknowns.x = { type = "Scalar", lower = 0, upper = 7 }
residuals = ["sin(x) - u"]
select = "unique"

[forms.sine_unique.outputs]
value = "x"

[forms.sine_by_cosine]
doc = "Of the roots of sin(x) = u, the one at which cos(x) is least: the root on the falling side."
implements = "root_of"
completeness = "fully_declared"
status = "expressed"

[forms.sine_by_cosine.implicit.root]
doc = "The root."
unknowns.x = { type = "Scalar", lower = 0, upper = 7 }
residuals = ["sin(x) - u"]
select = "by: cos(x)"

[forms.sine_by_cosine.outputs]
value = "x"

[forms.pole]
doc = "1 / (x - u) changes sign across its pole at u and has no root: the pole is not returned."
implements = "root_of"
completeness = "fully_declared"
status = "expressed"

[forms.pole.implicit.root]
doc = "The root."
unknowns.x = { type = "Scalar", lower = -1, upper = 1 }
residuals = ["1 / (x - u)"]
select = "unique"

[forms.pole.outputs]
value = "x"

[forms.geometric_grid]
doc = "Two roots close to a positive lower bound of a wide interval: the scan is geometric, or both fall in one cell."
implements = "root_of"
completeness = "fully_declared"
status = "expressed"

[forms.geometric_grid.implicit.root]
doc = "The root."
unknowns.x = { type = "Scalar", lower = 1e-9, upper = 1e3 }
residuals = ["(exp(x) - exp(u)) * (exp(x) - exp(2 * u))"]
select = "largest"

[forms.geometric_grid.outputs]
value = "x"
