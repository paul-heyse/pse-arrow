module = "expr_implicit_association"
uses = ["physical", "identity", "exprtypes", "exprsites"]
doc = "Association site fractions: a system of coupled residuals over a set of sites, with a local and outputs that depend on the unknowns."

[contracts.association]
doc = "The association contribution to the residual Helmholtz energy at a density and a site composition."
sets.sites = { type = "association_site", doc = "The association sites of the mixture." }
arguments.rho = { type = "MolarDensity", doc = "Molar density." }
arguments.x = { type = "Fraction", over = [
  "sites",
], doc = "Mole fraction of the molecules carrying each site." }
outputs.a_assoc = { type = "Scalar", doc = "Association Helmholtz energy divided by R T." }
outputs.bonded = { type = "Scalar", doc = "Mean fraction of sites that are bonded, weighted by the site composition." }
outputs.da_drho = { type = "Scalar / MolarDensity", doc = "Derivative of a_assoc with respect to the molar density." }
outputs.da_dx = { type = "Scalar", doc = "Sum over the sites of the derivatives of a_assoc with respect to the site composition." }

[forms.site_fractions]
doc = "Wertheim's first-order association: the fraction of each site not bonded solves a coupled system."
implements = "association"
completeness = "fully_declared"
status = "expressed"

[forms.site_fractions.slot_groups.pair]
doc = "The association strength of an unordered pair of sites."
subject.a = { type = "association_site", doc = "First site." }
subject.b = { type = "association_site", doc = "Second site." }
bind = { a = "sites", b = "sites" }
transposition = { rule = "symmetric", roles = ["a", "b"], diagonal = "allowed" }

[forms.site_fractions.slot_groups.pair.slots]
delta = { type = "MolarVolume", doc = "The association strength." }

[forms.site_fractions.implicit.fractions]
doc = "Fraction of each site not bonded to another site."
unknowns.X = { type = "Fraction", over = [
  "sites",
], lower = 0, upper = 1, start = 0.5 }
residuals = [
  "X[a] * (1 + rho * sum(x[b] * X[b] * pair.delta[a, b] for b in sites)) - 1 for a in sites",
]
select = "unique"

[forms.site_fractions.let]
unbonded = "[1 - X[a] for a in sites]"

[forms.site_fractions.outputs]
a_assoc = "sum(x[a] * (log(X[a]) - X[a] / 2 + 1 / 2) for a in sites)"
bonded = "sum(x[a] * unbonded[a] for a in sites)"
da_drho = "d(sum(x[a] * (log(X[a]) - X[a] / 2 + 1 / 2) for a in sites), rho)"
da_dx = "sum(d(sum(x[b] * (log(X[b]) - X[b] / 2 + 1 / 2) for b in sites), x[a]) for a in sites)"
