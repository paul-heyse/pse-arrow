module = "expr_parameter_structure"
uses = ["physical", "identity", "exprtypes"]
doc = "Forms whose stored values enter as parameters: the floating-point regression form, a series whose length varies, and conditionals on stored values."

[contracts.pressure_curve]
doc = "A pressure as a function of temperature for one species form."
roles.i = { type = "species", doc = "The species form." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.p = { type = "Pressure", doc = "The pressure." }

[contracts.scalar_curve]
doc = "A dimensionless function of temperature for one species form."
roles.i = { type = "species", doc = "The species form." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.y = { type = "Scalar", doc = "The value." }

[forms.reduced_exponential]
doc = "A pressure from the exponential of one reduced power: p * exp(Tr / T * n * (1 - T / Tr) ** t)."
implements = "pressure_curve"
completeness = "fully_declared"
status = "expressed"

[forms.reduced_exponential.slot_groups.pure]
doc = "The curve of one species form."
subject.i = { type = "species", doc = "The species form." }

[forms.reduced_exponential.slot_groups.pure.slots]
p = { type = "Pressure", doc = "Reducing pressure." }
Tr = { type = "Temperature", doc = "Reducing temperature." }
n = { type = "Scalar", doc = "Coefficient." }
t = { type = "Scalar", doc = "Exponent." }

[forms.reduced_exponential.outputs]
p = "pure.p[i] * exp(pure.Tr[i] / T * pure.n[i] * (1 - T / pure.Tr[i]) ** pure.t[i])"

[forms.reduced_series]
doc = "The same curve with any number of terms n_k * theta ** t_k, theta = 1 - T / Tr."
implements = "pressure_curve"
completeness = "fully_declared"
status = "expressed"

[forms.reduced_series.slot_groups.pure]
doc = "The curve of one species form."
subject.i = { type = "species", doc = "The species form." }

[forms.reduced_series.slot_groups.pure.slots]
p = { type = "Pressure", doc = "Reducing pressure." }
Tr = { type = "Temperature", doc = "Reducing temperature." }

[forms.reduced_series.slot_groups.pure.families.term]
doc = "One term of the series."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.reduced_series.slot_groups.pure.families.term.slots]
n = { type = "Scalar", doc = "Coefficient." }
t = { type = "Scalar", doc = "Exponent of theta." }

[forms.reduced_series.let]
theta = "1 - T / pure.Tr[i]"

[forms.reduced_series.outputs]
p = "pure.p[i] * exp(pure.Tr[i] / T * sum(pure.term.n[i, k] * theta ** pure.term.t[i, k] for k in pure.term(i)))"

[forms.branch_on_slot]
doc = "One of two proportional laws, chosen by the sign of a stored value."
implements = "scalar_curve"
completeness = "fully_declared"
status = "expressed"

[forms.branch_on_slot.slot_groups.pure]
doc = "The coefficients of one species form."
subject.i = { type = "species", doc = "The species form." }

[forms.branch_on_slot.slot_groups.pure.slots]
a = { type = "Scalar", doc = "Slope above zero." }
b = { type = "Scalar", doc = "Slope otherwise." }

[forms.branch_on_slot.outputs]
y = "pure.a[i] * T / unit('K') if pure.a[i] > 0 else pure.b[i] * T / unit('K')"

[forms.branch_on_local]
doc = "The same choice through a local that depends on stored values alone."
implements = "scalar_curve"
completeness = "fully_declared"
status = "expressed"

[forms.branch_on_local.slot_groups.pure]
doc = "The coefficients of one species form."
subject.i = { type = "species", doc = "The species form." }

[forms.branch_on_local.slot_groups.pure.slots]
a = { type = "Scalar", doc = "First coefficient." }
b = { type = "Scalar", doc = "Second coefficient." }

[forms.branch_on_local.let]
margin = "pure.a[i] - pure.b[i]"

[forms.branch_on_local.outputs]
y = "margin * T / unit('K') if margin > 0 else pure.b[i] * T / unit('K')"

[forms.branch_on_temperature]
doc = "A conditional on the argument, which stays in the compiled expression."
implements = "scalar_curve"
completeness = "fully_declared"
status = "expressed"

[forms.branch_on_temperature.slot_groups.pure]
doc = "The coefficients of one species form."
subject.i = { type = "species", doc = "The species form." }

[forms.branch_on_temperature.slot_groups.pure.slots]
a = { type = "Scalar", doc = "Slope below the threshold." }
b = { type = "Scalar", doc = "Slope above it." }
T0 = { type = "Temperature", doc = "The threshold." }

[forms.branch_on_temperature.outputs]
y = "pure.a[i] * T / unit('K') if T < pure.T0[i] else pure.b[i] * T / unit('K')"
