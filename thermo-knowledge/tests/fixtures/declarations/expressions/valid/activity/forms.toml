module = "expr_activity"
uses = ["physical", "identity", "exprtypes"]
doc = "NRTL with ordered pair slots and a Redlich-Kister form with a parity pair group."

[contracts.excess_gibbs]
doc = "Molar excess Gibbs energy of a mixture."
sets.components = { type = "material_entity", doc = "The components of the mixture." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.x = { type = "Fraction", over = [
  "components",
], basis = "mole_fraction", doc = "Composition." }
outputs.gE = { type = "MolarEnergy", doc = "Molar excess Gibbs energy." }

[contracts.binary_excess_gibbs]
doc = "Molar excess Gibbs energy of the binary of two species forms."
roles.i = { type = "species", doc = "First species form." }
roles.j = { type = "species", doc = "Second species form." }
arguments.xi = { type = "Fraction", doc = "Mole fraction of the first." }
outputs.gE = { type = "MolarEnergy", doc = "Molar excess Gibbs energy." }

[forms.nrtl]
doc = "The NRTL equation: ordered pair parameters and a double sum."
implements = "excess_gibbs"
completeness = "fully_declared"
status = "expressed"

[forms.nrtl.slot_groups.core]
doc = "The gas constant."

[forms.nrtl.slot_groups.core.slots]
R = { type = "GasConstant", doc = "The gas constant." }

[forms.nrtl.slot_groups.pair]
doc = "Interaction parameters of an ordered pair."
subject.i = { type = "species", doc = "First component." }
subject.j = { type = "species", doc = "Second component." }
bind = { i = "components", j = "components" }
transposition = { rule = "ordered", roles = ["i", "j"], diagonal = "allowed" }

[forms.nrtl.slot_groups.pair.slots]
tau = { type = "Scalar", doc = "Dimensionless interaction parameter." }
alpha = { type = "Scalar", doc = "Non-randomness parameter." }

[forms.nrtl.outputs]
gE = """
core.R * T * sum(
    x[i]
    * sum(x[j] * pair.tau[j, i] * exp(-pair.alpha[j, i] * pair.tau[j, i]) for j in components)
    / sum(x[k] * exp(-pair.alpha[k, i] * pair.tau[k, i]) for k in components)
    for i in components
)
"""

[forms.redlich_kister]
doc = "Redlich-Kister polynomial of a binary: parameters change sign with odd order when the pair is swapped."
implements = "binary_excess_gibbs"
completeness = "fully_declared"
status = "expressed"

[forms.redlich_kister.slot_groups.pair]
doc = "The polynomial of an unordered pair, held in one orientation."
subject.i = { type = "species", doc = "First species form." }
subject.j = { type = "species", doc = "Second species form." }
transposition = { rule = "parity", roles = ["i", "j"], by = "order" }

[forms.redlich_kister.slot_groups.pair.families.rk]
doc = "One coefficient per order."
index.order = { type = "Integer", min = 0, doc = "Order of the term." }

[forms.redlich_kister.slot_groups.pair.families.rk.slots]
L = { type = "MolarEnergy", doc = "Coefficient of the term." }

[forms.redlich_kister.outputs]
gE = "xi * (1 - xi) * sum(pair.rk.L[i, j, k] * (2 * xi - 1) ** k for k in pair.rk(i, j))"
