module = "expr_cubic_mixing"
uses = ["physical", "identity", "exprtypes"]
doc = "A cubic equation of state whose mixing rule is a sub-form over the components: the quadratic van der Waals rule, and Huron-Vidal rules that call an excess Gibbs energy form, passing the composition through, remapped by a local or by a comprehension."

[contracts.excess_gibbs]
doc = "Molar excess Gibbs energy of a mixture."
sets.components = { type = "material_entity", doc = "The components of the mixture." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.x = { type = "Fraction", over = [
  "components",
], basis = "mole_fraction", doc = "Composition." }
outputs.gE = { type = "MolarEnergy", doc = "Molar excess Gibbs energy." }

[contracts.cubic_mixing]
doc = "The mixture parameters of a cubic equation of state from the pure-component ones."
sets.components = { type = "material_entity", doc = "The components of the mixture, in a fixed order." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.x = { type = "Fraction", over = [
  "components",
], basis = "mole_fraction", doc = "Composition." }
arguments.a_pure = { type = "AttractionParameter", over = [
  "components",
], doc = "The attractive parameter of each pure component at T." }
arguments.b_pure = { type = "MolarVolume", over = [
  "components",
], doc = "The covolume of each pure component." }
outputs.a_mix = { type = "AttractionParameter", doc = "The attractive parameter of the mixture." }
outputs.b_mix = { type = "MolarVolume", doc = "The covolume of the mixture." }

[contracts.eos_pressure]
doc = "Pressure of a mixture as a function of temperature, molar volume and composition."
sets.components = { type = "material_entity", doc = "The components of the mixture, in a fixed order." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.v = { type = "MolarVolume", doc = "Molar volume." }
arguments.x = { type = "Fraction", over = [
  "components",
], basis = "mole_fraction", doc = "Composition." }
outputs.p = { type = "Pressure", doc = "Pressure." }

# -- NRTL: the excess Gibbs energy form the Huron-Vidal rules call --------------------------------

[forms.nrtl]
doc = "The NRTL equation: ordered pair parameters and a double sum."
implements = "excess_gibbs"
completeness = "fully_declared"
status = "expressed"

[forms.nrtl.slot_groups.core]
doc = "The gas constant."

[forms.nrtl.slot_groups.core.slots]
R = { type = "GasConstant", doc = "The gas constant." }

[forms.nrtl.slot_groups.pair]
doc = "Interaction parameters of an ordered pair."
subject.i = { type = "species", doc = "First component." }
subject.j = { type = "species", doc = "Second component." }
bind = { i = "components", j = "components" }
transposition = { rule = "ordered", roles = ["i", "j"], diagonal = "allowed" }

[forms.nrtl.slot_groups.pair.slots]
tau = { type = "Scalar", doc = "Dimensionless interaction parameter." }
alpha = { type = "Scalar", doc = "Non-randomness parameter." }

[forms.nrtl.outputs]
gE = """
core.R * T * sum(
    x[i]
    * sum(x[j] * pair.tau[j, i] * exp(-pair.alpha[j, i] * pair.tau[j, i]) for j in components)
    / sum(x[k] * exp(-pair.alpha[k, i] * pair.tau[k, i]) for k in components)
    for i in components
)
"""

# -- mixing rules ----------------------------------------------------------------------------------

[forms.mixing_vdw]
doc = "The quadratic van der Waals mixing rule with a symmetric binary parameter."
implements = "cubic_mixing"
completeness = "fully_declared"
status = "expressed"

[forms.mixing_vdw.slot_groups.pair]
doc = "The binary interaction parameter of an unordered pair of components."
subject.i = { type = "species", doc = "First component." }
subject.j = { type = "species", doc = "Second component." }
bind = { i = "components", j = "components" }
transposition = { rule = "symmetric", roles = [
  "i",
  "j",
], diagonal = "forbidden" }

[forms.mixing_vdw.slot_groups.pair.slots]
k = { type = "Scalar", doc = "The parameter." }

[forms.mixing_vdw.outputs]
a_mix = "sum(x[i] * x[j] * (1 - (0 if i == j else pair.k[i, j])) * sqrt(a_pure[i] * a_pure[j]) for i in components for j in components)"
b_mix = "sum(x[i] * b_pure[i] for i in components)"

[forms.mixing_huron_vidal]
doc = "Huron-Vidal: the attractive parameter follows the excess Gibbs energy at infinite pressure, here that of a form chosen for the sub-form slot, called with the composition as given."
implements = "cubic_mixing"
completeness = "fully_declared"
status = "expressed"

[forms.mixing_huron_vidal.subforms.excess]
doc = "The excess Gibbs energy model."
accepts = "excess_gibbs"
multiplicity = "one"
per = "model"

[forms.mixing_huron_vidal.let]
b = "sum(x[i] * b_pure[i] for i in components)"

[forms.mixing_huron_vidal.outputs]
a_mix = "b * (sum(x[i] * a_pure[i] / b_pure[i] for i in components) - excess.gE(components=components, T=T, x=x) / log(2))"
b_mix = "b"

[forms.mixing_hv_remapped]
doc = "Huron-Vidal with the excess Gibbs energy evaluated at covolume fractions: the composition is remapped by an indexed local."
implements = "cubic_mixing"
completeness = "fully_declared"
status = "expressed"

[forms.mixing_hv_remapped.subforms.excess]
doc = "The excess Gibbs energy model."
accepts = "excess_gibbs"
multiplicity = "one"
per = "model"

[forms.mixing_hv_remapped.let]
b = "sum(x[i] * b_pure[i] for i in components)"
z = "basis('mole_fraction', [x[i] * b_pure[i] / b for i in components])"

[forms.mixing_hv_remapped.outputs]
a_mix = "b * (sum(x[i] * a_pure[i] / b_pure[i] for i in components) - excess.gE(components=components, T=T, x=z) / log(2))"
b_mix = "b"

[forms.mixing_hv_inline]
doc = "The same remapping written as a comprehension in the call."
implements = "cubic_mixing"
completeness = "fully_declared"
status = "expressed"

[forms.mixing_hv_inline.subforms.excess]
doc = "The excess Gibbs energy model."
accepts = "excess_gibbs"
multiplicity = "one"
per = "model"

[forms.mixing_hv_inline.let]
b = "sum(x[i] * b_pure[i] for i in components)"

[forms.mixing_hv_inline.outputs]
a_mix = "b * (sum(x[i] * a_pure[i] / b_pure[i] for i in components) - excess.gE(components=components, T=T, x=basis('mole_fraction', [x[i] * b_pure[i] / b for i in components])) / log(2))"
b_mix = "b"

# -- the equation of state -------------------------------------------------------------------------

[forms.cubic_srk_mixed]
doc = "The Soave-Redlich-Kwong equation of state; the mixture parameters come from the mixing rule chosen for the sub-form slot."
implements = "eos_pressure"
completeness = "fully_declared"
status = "expressed"

[forms.cubic_srk_mixed.subforms.mixing]
doc = "The mixing rule."
accepts = "cubic_mixing"
multiplicity = "one"
per = "model"

[forms.cubic_srk_mixed.slot_groups.core]
doc = "Constants of the equation."

[forms.cubic_srk_mixed.slot_groups.core.slots]
omega_a = { type = "Scalar", doc = "Coefficient of the attractive parameter." }
omega_b = { type = "Scalar", doc = "Coefficient of the covolume." }
R = { type = "GasConstant", doc = "The gas constant." }

[forms.cubic_srk_mixed.slot_groups.pure]
doc = "Critical constants of one component."
subject.i = { type = "species", doc = "The component." }
bind = { i = "components" }

[forms.cubic_srk_mixed.slot_groups.pure.slots]
T_c = { type = "Temperature", doc = "Critical temperature." }
p_c = { type = "Pressure", doc = "Critical pressure." }
omega = { type = "Scalar", doc = "Acentric factor." }

[forms.cubic_srk_mixed.let]
a_pure = "[core.omega_a * core.R ** 2 * pure.T_c[i] ** 2 / pure.p_c[i] * (1 + (0.48508 + 1.55171 * pure.omega[i] - 0.15613 * pure.omega[i] ** 2) * (1 - sqrt(T / pure.T_c[i]))) ** 2 for i in components]"
b_pure = "[core.omega_b * core.R * pure.T_c[i] / pure.p_c[i] for i in components]"
a = "mixing.a_mix(components=components, T=T, x=x, a_pure=a_pure, b_pure=b_pure)"
b = "mixing.b_mix(components=components, T=T, x=x, a_pure=a_pure, b_pure=b_pure)"

[forms.cubic_srk_mixed.outputs]
p = "core.R * T / (v - b) - a / (v * (v + b))"
