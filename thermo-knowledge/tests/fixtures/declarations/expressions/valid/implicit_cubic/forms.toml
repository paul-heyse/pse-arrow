module = "expr_implicit_cubic"
uses = ["physical", "identity", "exprtypes"]
doc = "The molar volume of a pure fluid from a cubic equation of state: an implicit block with one bounded unknown, four ways of choosing among its roots."

[contracts.molar_volume]
doc = "Molar volume of a pure fluid at a temperature and a pressure."
roles.i = { type = "species", doc = "The fluid." }
arguments.T = { type = "Temperature", doc = "Temperature." }
arguments.p = { type = "Pressure", doc = "Pressure." }
outputs.v = { type = "MolarVolume", doc = "Molar volume." }
outputs.dv_dp = { type = "MolarVolume / Pressure", doc = "Derivative of the molar volume with respect to pressure." }
outputs.dv_dT = { type = "MolarVolume / Temperature", doc = "Derivative of the molar volume with respect to temperature." }

[forms.srk_smallest]
doc = "Soave-Redlich-Kwong volume: the smallest root (liquid-like)."
implements = "molar_volume"
completeness = "fully_declared"
status = "expressed"

[forms.srk_smallest.slot_groups.core]
doc = "Constants of the equation."

[forms.srk_smallest.slot_groups.core.slots]
omega_a = { type = "Scalar", doc = "Coefficient of the attractive parameter." }
omega_b = { type = "Scalar", doc = "Coefficient of the covolume." }
R = { type = "GasConstant", doc = "The gas constant." }

[forms.srk_smallest.slot_groups.pure]
doc = "Critical constants of the fluid."
subject.i = { type = "species", doc = "The fluid." }

[forms.srk_smallest.slot_groups.pure.slots]
T_c = { type = "Temperature", doc = "Critical temperature." }
p_c = { type = "Pressure", doc = "Critical pressure." }
omega = { type = "Scalar", doc = "Acentric factor." }

[forms.srk_smallest.let]
b = "core.omega_b * core.R * pure.T_c[i] / pure.p_c[i]"
slope = "0.48508 + 1.55171 * pure.omega[i] - 0.15613 * pure.omega[i] ** 2"
alpha = "(1 + slope * (1 - sqrt(T / pure.T_c[i]))) ** 2"
a = "core.omega_a * core.R ** 2 * pure.T_c[i] ** 2 / pure.p_c[i] * alpha"
Ared = "a * p / (core.R * T) ** 2"
Bred = "b * p / (core.R * T)"

[forms.srk_smallest.implicit.volume]
doc = "The molar volume solves the equation of state multiplied through by (v - b) v (v + b)."
unknowns.v = { type = "MolarVolume", lower = "b", upper = "core.R * T / p + b" }
residuals = [
  "p * (v - b) * v * (v + b) - core.R * T * v * (v + b) + a * (v - b)",
]
select = "smallest"

[forms.srk_smallest.outputs]
v = "v"
dv_dp = "d(v, p)"
dv_dT = "d(v, T)"

