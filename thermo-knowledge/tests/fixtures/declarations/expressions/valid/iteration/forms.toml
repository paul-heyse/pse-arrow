module = "expr_iteration"
uses = ["physical", "identity", "exprtypes"]
doc = "A sub-form slot with several forms chosen per subject, iterated with the subject of its role."

[contracts.term]
doc = "One contribution for a species."
roles.i = { type = "species", doc = "The species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.value = { type = "Scalar", doc = "The contribution." }

[contracts.total]
doc = "The sum of contributions for a species."
roles.i = { type = "species", doc = "The species." }
arguments.T = { type = "Temperature", doc = "Temperature." }
outputs.amount = { type = "Scalar", doc = "The total." }

[forms.linear_term]
doc = "A contribution proportional to the reduced temperature."
implements = "term"
completeness = "fully_declared"
status = "expressed"

[forms.linear_term.slot_groups.pure]
doc = "The slope for one species."
subject.i = { type = "species", doc = "The species." }

[forms.linear_term.slot_groups.pure.slots]
c = { type = "Scalar", doc = "The slope." }

[forms.linear_term.outputs]
value = "pure.c[i] * T / unit('K')"

[forms.total_form]
doc = "The sum of the terms chosen for the species."
implements = "total"
completeness = "fully_declared"
status = "expressed"

[forms.total_form.subforms.terms]
doc = "The contributions, added."
accepts = "term"
multiplicity = "many"
per = "subject"

[forms.total_form.outputs]
amount = "sum(c.value(T=T) for c in terms(i=i))"
