module = "expr_integral"
uses = ["physical", "identity", "exprtypes"]
doc = "A definite integral and the special functions."

[contracts.enthalpy_change]
doc = "Enthalpy change of a fluid heated from a reference temperature."
arguments.T = { type = "Temperature", doc = "Final temperature." }
outputs.dh = { type = "MolarEnergy", doc = "Enthalpy change." }
outputs.dh_numeric = { type = "Scalar", doc = "An integral with no closed form." }

[contracts.special_functions]
doc = "Special functions of a dimensionless argument."
arguments.x = { type = "Scalar", doc = "The argument." }
outputs.error = { type = "Scalar", doc = "The error function." }
outputs.cheb = { type = "Scalar", doc = "Chebyshev polynomial of the first kind, order 3." }
outputs.debye = { type = "Scalar", doc = "Debye function of order 3." }

[forms.heating]
doc = "Enthalpy change from a heat capacity linear in temperature."
implements = "enthalpy_change"
completeness = "fully_declared"
status = "expressed"

[forms.heating.slot_groups.core]
doc = "The heat capacity and the reference temperature."

[forms.heating.slot_groups.core.slots]
cp0 = { type = "MolarCp", doc = "Heat capacity at zero temperature." }
cp1 = { type = "MolarCp / Temperature", doc = "Slope of the heat capacity." }
T_ref = { type = "Temperature", doc = "Reference temperature." }

[forms.heating.outputs]
dh = "integral(core.cp0 + core.cp1 * z, z, core.T_ref, T)"
dh_numeric = "integral(exp(sin(z)) / (1 + z ** 2), z, 0, T / unit('K'))"

[forms.special]
doc = "erf, a Chebyshev polynomial and the Debye function."
implements = "special_functions"
completeness = "fully_declared"
status = "expressed"

[forms.special.outputs]
error = "erf(x)"
cheb = "chebyshev_t(3, x)"
debye = "debye(3, x)"
