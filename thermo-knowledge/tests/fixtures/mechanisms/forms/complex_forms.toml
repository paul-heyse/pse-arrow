module = "complex_forms"
uses = ["physical", "provenance", "identity", "systems", "conventions", "observables", "parameters"]
doc = "Complex constants held as real pairs (TK2g, proof fixture 5): the complex-logarithm part of the IAPWS Gibbs energy of ice Ih, whose coefficients are complex numbers. Each constant is a pair of real slots and the expression is written in real arithmetic, with the principal value of the logarithm of a complex number taken by a sub-form."

[contracts.complex_zlogz_fixture]
doc = "The product z ln z of a complex number z = a + i b with its principal logarithm, as real and imaginary parts."
arguments.a = { type = "Scalar", doc = "Real part of z." }
arguments.b = { type = "Scalar", doc = "Imaginary part of z." }
outputs.re = { type = "Scalar", doc = "Real part of z ln z." }
outputs.im = { type = "Scalar", doc = "Imaginary part of z ln z." }

[forms.principal_zlogz_fixture]
doc = "z ln z in real arithmetic: ln z = ln|z| + i arg z with the argument in (-pi, pi], then the product by z."
implements = "complex_zlogz_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.principal_zlogz_fixture.let]
modulus_log = "0.5 * log(a ** 2 + b ** 2)"
argument = """
atan(b / a) if a > 0 else (
    (atan(b / a) + 3.141592653589793 if b >= 0 else atan(b / a) - 3.141592653589793) if a < 0
    else (1.5707963267948966 if b > 0 else -1.5707963267948966)
)
"""

[forms.principal_zlogz_fixture.outputs]
re = "a * modulus_log - b * argument"
im = "a * argument + b * modulus_log"

[contracts.ice_complex_contract_fixture]
doc = "The complex-coefficient part of the Gibbs energy of ice as a function of temperature."
roles.i = { type = "material_entity", doc = "The substance." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
outputs.g = { type = "SpecificEnergy", doc = "The part of the specific Gibbs energy the complex terms give." }

[forms.ice_complex_fixture]
doc = "g = T_t Re sum_k r_k [(t_k - tau) ln(t_k - tau) + (t_k + tau) ln(t_k + tau) - 2 t_k ln t_k - tau^2 / t_k] with tau = T / T_t and complex t_k and r_k."
implements = "ice_complex_contract_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.ice_complex_fixture.subforms.zlogz]
doc = "The product of a complex number and its principal logarithm."
accepts = "complex_zlogz_fixture"
multiplicity = "one"
per = "model"

[forms.ice_complex_fixture.slot_groups.pure]
doc = "The constants of one substance."
subject.i = { type = "material_entity", doc = "The substance." }

[forms.ice_complex_fixture.slot_groups.pure.slots]
T_t = { type = "Temperature", doc = "The triple-point temperature the reduced temperature is relative to." }

[forms.ice_complex_fixture.slot_groups.pure.families.term]
doc = "One complex pair of constants."
index.k = { type = "Integer", min = 1, doc = "Term number." }

[forms.ice_complex_fixture.slot_groups.pure.families.term.slots]
t_re = { type = "Scalar", doc = "Real part of the complex temperature t_k." }
t_im = { type = "Scalar", doc = "Imaginary part of the complex temperature t_k." }
r_re = { type = "SpecificEntropy", doc = "Real part of the complex coefficient r_k." }
r_im = { type = "SpecificEntropy", doc = "Imaginary part of the complex coefficient r_k." }

[forms.ice_complex_fixture.let]
tau = "T / pure.T_t[i]"

[forms.ice_complex_fixture.outputs]
g = """
pure.T_t[i] * sum(
    pure.term.r_re[i, k] * (zlogz.re(a=pure.term.t_re[i, k] - tau, b=pure.term.t_im[i, k]) + zlogz.re(a=pure.term.t_re[i, k] + tau, b=pure.term.t_im[i, k]) - 2 * zlogz.re(a=pure.term.t_re[i, k], b=pure.term.t_im[i, k]) - tau ** 2 * pure.term.t_re[i, k] / (pure.term.t_re[i, k] ** 2 + pure.term.t_im[i, k] ** 2))
    - pure.term.r_im[i, k] * (zlogz.im(a=pure.term.t_re[i, k] - tau, b=pure.term.t_im[i, k]) + zlogz.im(a=pure.term.t_re[i, k] + tau, b=pure.term.t_im[i, k]) - 2 * zlogz.im(a=pure.term.t_re[i, k], b=pure.term.t_im[i, k]) + tau ** 2 * pure.term.t_im[i, k] / (pure.term.t_re[i, k] ** 2 + pure.term.t_im[i, k] ** 2))
    for k in pure.term(i)
)
"""
