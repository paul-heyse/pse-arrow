module = "relative_bound_forms"
uses = ["physical", "provenance", "identity", "systems", "conventions", "observables", "parameters", "saturation"]
doc = "Forms that show a validity bound stated relative to another observable of the subject (TK2g, alignment item 19): a vapour-pressure form whose set holds the boiling and critical temperatures the bounds are relative to, and one that holds neither."

[forms.relative_bounds_fixture]
doc = "An exponential vapour-pressure curve whose set also holds the normal boiling temperature and the critical temperature of the fluid."
implements = "pure_vapor_pressure"
completeness = "fully_declared"
status = "expressed"

[forms.relative_bounds_fixture.slot_groups.pure]
doc = "The curve of one fluid and its two characteristic temperatures."
subject.i = { type = "material_entity", doc = "The fluid." }

[forms.relative_bounds_fixture.slot_groups.pure.slots]
a = { type = "Scalar", doc = "Logarithm of the pressure at infinite temperature in pascal." }
b = { type = "Temperature", doc = "Temperature coefficient." }
T_b = { type = "Temperature", observable = "normal_boiling_temperature", doc = "Normal boiling temperature." }
T_c = { type = "Temperature", observable = "critical_temperature", doc = "Critical temperature." }

[forms.relative_bounds_fixture.outputs]
p_sat = "exp(pure.a[i] - pure.b[i] / T) * unit('Pa')"

[forms.plain_bounds_fixture]
doc = "The same curve in a set that holds no characteristic temperature."
implements = "pure_vapor_pressure"
completeness = "fully_declared"
status = "expressed"

[forms.plain_bounds_fixture.slot_groups.pure]
doc = "The curve of one fluid."
subject.i = { type = "material_entity", doc = "The fluid." }

[forms.plain_bounds_fixture.slot_groups.pure.slots]
a = { type = "Scalar", doc = "Logarithm of the pressure at infinite temperature in pascal." }
b = { type = "Temperature", doc = "Temperature coefficient." }

[forms.plain_bounds_fixture.outputs]
p_sat = "exp(pure.a[i] - pure.b[i] / T) * unit('Pa')"
