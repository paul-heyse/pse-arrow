module = "assembly_forms"
uses = ["physical", "provenance", "identity", "systems", "conventions", "observables", "parameters"]
doc = "Forms that show a standard-state model assembled per species form (TK2g, alignment item 16): a root form whose sub-form slots take a general equation of state, a temperature correction and a pressure correction, with the solvent density and permittivity that one equation of state needs below it."

[contracts.ss_gibbs_fixture]
doc = "The standard-state molar Gibbs energy of a species form at a temperature and pressure."
roles.i = { type = "species_form", doc = "The species form." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.G0 = { type = "MolarEnergy", doc = "Standard-state molar Gibbs energy." }

[contracts.ss_part_fixture]
doc = "A contribution of the standard-state molar Gibbs energy of a species form: a general equation of state, or a correction to it."
roles.i = { type = "species_form", doc = "The species form." }
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.dG = { type = "MolarEnergy", doc = "The contribution." }

[contracts.solvent_permittivity_fixture]
doc = "The relative permittivity of the solvent."
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.value = { type = "Scalar", doc = "Relative permittivity." }

[contracts.solvent_density_fixture]
doc = "The mass density of the solvent."
arguments.T = { type = "Temperature", observable = "temperature", doc = "Temperature." }
arguments.P = { type = "Pressure", observable = "pressure", doc = "Pressure." }
outputs.value = { type = "MassDensity", doc = "Mass density." }

# -- the root: an assembly of parts --------------------------------------------------------------

[forms.aqueous_ss_fixture]
doc = "The standard-state Gibbs energy of an aqueous species form as a general equation of state plus any temperature and pressure corrections."
implements = "ss_gibbs_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.aqueous_ss_fixture.subforms.eos]
doc = "The general equation of state."
accepts = "ss_part_fixture"
multiplicity = "one"
per = "model"

[forms.aqueous_ss_fixture.subforms.t_correction]
doc = "The temperature correction, where the species has one."
accepts = "ss_part_fixture"
multiplicity = "optional"
per = "model"

[forms.aqueous_ss_fixture.subforms.p_correction]
doc = "The pressure correction, where the species has one."
accepts = "ss_part_fixture"
multiplicity = "optional"
per = "model"

[forms.aqueous_ss_fixture.outputs]
G0 = """
eos.dG(i=i, T=T, P=P)
+ sum(c.dG(i=i, T=T, P=P) for c in t_correction)
+ sum(c.dG(i=i, T=T, P=P) for c in p_correction)
"""

# -- the parts ----------------------------------------------------------------------------------

[forms.hkf_fixture]
doc = "A Helgeson-Kirkham-Flowers-style equation of state: a reference energy, a Born term that depends on the solvent permittivity and a term in the solvent density."
implements = "ss_part_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.hkf_fixture.subforms.epsilon]
doc = "The solvent permittivity."
accepts = "solvent_permittivity_fixture"
multiplicity = "one"
per = "model"

[forms.hkf_fixture.subforms.density]
doc = "The solvent density."
accepts = "solvent_density_fixture"
multiplicity = "one"
per = "model"

[forms.hkf_fixture.slot_groups.pure]
doc = "The parameters of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.hkf_fixture.slot_groups.pure.slots]
g_ref = { type = "MolarEnergy", doc = "Reference energy." }
omega = { type = "MolarEnergy", doc = "Born coefficient." }
a1 = { type = "MolarEnergy", doc = "Coefficient of the solvent density, per kilogram per cubic metre." }

[forms.hkf_fixture.outputs]
dG = """
pure.g_ref[i]
+ pure.omega[i] * (1 / epsilon.value(T=T, P=P) - 1)
+ pure.a1[i] * density.value(T=T, P=P) / unit('kg/m^3')
"""

[forms.constant_energy_fixture]
doc = "A standard-state energy that does not depend on temperature or pressure."
implements = "ss_part_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.constant_energy_fixture.slot_groups.pure]
doc = "The energy of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.constant_energy_fixture.slot_groups.pure.slots]
g = { type = "MolarEnergy", doc = "The energy." }

[forms.constant_energy_fixture.outputs]
dG = "pure.g[i]"

[forms.entropy_correction_fixture]
doc = "A temperature correction from a constant entropy: -dS (T - 298.15 K)."
implements = "ss_part_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.entropy_correction_fixture.slot_groups.pure]
doc = "The entropy of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.entropy_correction_fixture.slot_groups.pure.slots]
ds = { type = "MolarEntropy", doc = "The entropy." }

[forms.entropy_correction_fixture.outputs]
dG = "-pure.ds[i] * (T - 298.15 * unit('K'))"

[forms.volume_correction_fixture]
doc = "A pressure correction from a constant volume: dV (P - 1 bar)."
implements = "ss_part_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.volume_correction_fixture.slot_groups.pure]
doc = "The volume of one species form."
subject.i = { type = "species_form", doc = "The species form." }

[forms.volume_correction_fixture.slot_groups.pure.slots]
dv = { type = "MolarVolume", doc = "The volume." }

[forms.volume_correction_fixture.outputs]
dG = "pure.dv[i] * (P - unit('bar'))"

[forms.permittivity_exponential_fixture]
doc = "The permittivity of the solvent as a function of temperature: eps0 exp(-(T - 298.15 K) / theta)."
implements = "solvent_permittivity_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.permittivity_exponential_fixture.slot_groups.core]
doc = "The constants of the solvent."

[forms.permittivity_exponential_fixture.slot_groups.core.slots]
eps0 = { type = "Scalar", doc = "Permittivity at 298.15 K." }
theta = { type = "Temperature", doc = "Decay temperature." }

[forms.permittivity_exponential_fixture.outputs]
value = "core.eps0 * exp(-(T - 298.15 * unit('K')) / core.theta)"

[forms.density_constant_fixture]
doc = "The density of the solvent, taken as a constant."
implements = "solvent_density_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.density_constant_fixture.slot_groups.core]
doc = "The constant of the solvent."

[forms.density_constant_fixture.slot_groups.core.slots]
rho = { type = "MassDensity", doc = "Mass density." }

[forms.density_constant_fixture.outputs]
value = "core.rho"
