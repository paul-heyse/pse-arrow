module = "group_forms"
uses = ["physical", "provenance", "identity", "systems", "conventions", "observables", "parameters"]
doc = "A form that reads group counts as an indexed contract argument (TK2g, proof fixture 2): the UNIFAC and UNIQUAC size and surface of a molecule as sums over its groups of the number of times each occurs times the group's parameter (Clapeyron's group_sum)."

[contracts.group_size_contract_fixture]
doc = "The relative van der Waals volume and surface area of one species from its groups."
roles.i = { type = "material_entity", doc = "The species." }
sets.groups = { type = "group", doc = "The groups of the scheme the species is decomposed into, in a fixed order." }
arguments.nu = { type = "Count", over = ["groups"], doc = "How many times each group occurs in the species: the counts of its group assignment." }
outputs.r = { type = "Scalar", doc = "Relative volume: the sum of the counts times the group volumes." }
outputs.q = { type = "Scalar", doc = "Relative surface area: the sum of the counts times the group surface areas." }

[forms.group_size_fixture]
doc = "r = sum nu_k R_k and q = sum nu_k Q_k over the groups of the species."
implements = "group_size_contract_fixture"
completeness = "fully_declared"
status = "expressed"

[forms.group_size_fixture.slot_groups.group]
doc = "The volume and surface area parameters of one group."
subject.k = { type = "group", doc = "The group." }
bind = { k = "groups" }

[forms.group_size_fixture.slot_groups.group.slots]
R = { type = "Scalar", doc = "Relative van der Waals volume of the group." }
Q = { type = "Scalar", doc = "Relative van der Waals surface area of the group." }

[forms.group_size_fixture.outputs]
r = "sum(nu[k] * group.R[k] for k in groups)"
q = "sum(nu[k] * group.Q[k] for k in groups)"
