id = "archive_md5"
title = "Fixture archive_md5"
tier = "A"
homepage = "https://example.org/archive_md5"
waves = [1, 2]
notes = "A valid fixture manifest."

[acquire]
kind = "archive"
url = "https://example.org/data.zip"
md5 = "0123456789abcdef0123456789abcdef"

[payload]
reader = "plain"
environment = "core"
include = ["data/*.json"]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE file, MIT."
url = "https://example.org/LICENSE"
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 from the LICENSE file"
