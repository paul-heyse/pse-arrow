id = "git_source"
title = "Fixture git_source"
tier = "A"
homepage = "https://example.org/git_source"
waves = [1, 2]
notes = "A valid fixture manifest."

[acquire]
kind = "git"
url = "https://example.org/repo.git"
commit = "0123456789abcdef0123456789abcdef01234567"
tag = "v1.0.0"
submodules = ["vendor/sub"]
sparse = ["data"]

[payload]
reader = "plain"
environment = "core"
include = ["data/*.json"]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE file, MIT."
url = "https://example.org/LICENSE"
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 from the LICENSE file"
