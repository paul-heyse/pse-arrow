id = "pages_source"
title = "Fixture pages_source"
tier = "A"
homepage = "https://example.org/pages_source"
waves = [1, 2]
notes = "A valid fixture manifest."

[acquire]
kind = "pages"
enumerator = "url_list"
min_interval_seconds = 5.0
limit = 10
urls = ["https://example.org/p/1", "https://example.org/p/2"]

[payload]
reader = "plain"
environment = "core"
include = ["data/*.json"]
exclude = []

[[rights]]
scope = "code"
basis = "licence_grant"
spdx = "MIT"
statement = "LICENSE file, MIT."
url = "https://example.org/LICENSE"
store = "yes"
redistribute = "yes"
commercial = "yes"
attribution = true
share_alike = false
observed = "2026-09-30 from the LICENSE file"
