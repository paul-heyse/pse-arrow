# ------------------------------------------------------------------------------------------
# entry_parameters: the points of a piecewise-Gibbs block; every other block is wave 2 or 7.

[tables.entry_parameters]
disposition = "deferred"
wave = 7
reason = "The key-path parameters of reactions, phases, collisions and equation-of-state entries map with their constructs: rate parameterisations and collisions in wave 7, phases and equations of state in wave 2."

[[tables.entry_parameters.partitions]]
name = "piecewise_gibbs_points"
where = { entry_table = "species_thermo", block = "data" }
disposition = "mapped"
origin_role = "published"
loss = "The temperature of a point is the key of its path, a number written as text; the value is the chemical potential divided by RT and has no unit."

[tables.entry_parameters.partitions.fields.entry_table]
role = "structure"
reason = "Selects the points of a thermo block (partition piecewise_gibbs_points)."

[tables.entry_parameters.partitions.fields.entry_locator]
role = "structure"
reason = "Links the point to its thermo block."

[tables.entry_parameters.partitions.fields.path]
target = "piecewise_gibbs.pure.point.T"
unit = "K"
text_number = '^/data/(.+)$'
precision = "exact"
loss = "The temperature is the key of the point in the file's data mapping, a number written as text; the file states no unit and the unit of a temperature is always kelvin."

[tables.entry_parameters.partitions.fields.block]
role = "structure"
reason = "Selects the points of a thermo block (partition piecewise_gibbs_points)."

[tables.entry_parameters.partitions.fields.value_kind]
role = "structure"
reason = "How the value is typed in the file (an integer or a float); the numeric column holds it."

[tables.entry_parameters.partitions.fields.value_text]
disposition = "out_of_scope"
reason = "Empty for a numeric point."

[tables.entry_parameters.partitions.fields.value_integer]
disposition = "out_of_scope"
reason = "Empty for a point the reader keeps as a float (the numeric column holds every number)."

[tables.entry_parameters.partitions.fields.value_number]
target = "piecewise_gibbs.pure.point.mu0_over_RT"
unit = "dimensionless"
precision = "exact"
loss = "The chemical potential divided by RT has no unit; every block of the pinned tree says it is dimensionless."

[tables.entry_parameters.partitions.fields.value_bool]
disposition = "out_of_scope"
reason = "Empty for a numeric point."

# ------------------------------------------------------------------------------------------
# Every other table.

[tables.collisions]
disposition = "deferred"
wave = 7
reason = "Electron-collision cross-section tables of plasma phases map with the reaction and transport forms in wave 7."

[tables.elements]
disposition = "deferred"
wave = 2
reason = "Custom element and isotope entries (atomic weights, standard entropies) map with the atomic data and the isotope vocabulary of the atomic-weight edition."

[tables.file_sections]
disposition = "out_of_scope"
reason = "The free section names of a YAML file only group entries for its author; the entries are the rows of their own tables."

[tables.other_entries]
disposition = "deferred"
wave = 2
reason = "Entries of sections the reader does not recognise (interface or phase-specific lists); they map with the construct that uses them."

[tables.phase_references]
disposition = "deferred"
wave = 2
reason = "The species and reaction sections a phase includes map with the phase definitions in wave 2; the mapping reads them to decode the aggregation of a species entry and does not emit from them."

[tables.phases]
disposition = "deferred"
wave = 2
reason = "Phase entries map to phase definitions with the phase models in wave 2; the mapping reads their thermo model to decode the aggregation of a species entry and does not emit from them."

[tables.reaction_terms]
disposition = "deferred"
wave = 7
reason = "The terms of a reaction's equation map with the reactions in wave 7."

[tables.reactions]
disposition = "deferred"
wave = 7
reason = "Reactions and their rate parameterisations map with the kinetics forms in wave 7."

[tables.species_critical_parameters]
disposition = "deferred"
wave = 2
reason = "Critical parameters map with the equations of state in wave 2."

[tables.species_equation_of_state]
disposition = "deferred"
wave = 2
reason = "Species equations of state (constant volume, HKFT, density polynomials) map with the equations of state in wave 2."

[tables.species_transport]
disposition = "deferred"
wave = 7
reason = "Species transport parameters map with the transport forms in wave 7."

[tables.text_files]
disposition = "out_of_scope"
reason = "Files the reader keeps verbatim because they are documents or grids, not records: they carry no assertion of their own."

[tables.text_lines]
disposition = "out_of_scope"
reason = "The lines of the files kept verbatim; no assertion of their own."

[tables.units_entries]
disposition = "deferred"
wave = 2
reason = "The units sections of the files apply to the numbers without a unit in the entries of their scope; they are applied when the first such number maps (the constant-cp numbers, rows of a block that state one, are held until then)."

[tables.yaml_duplicate_keys]
disposition = "out_of_scope"
reason = "A repeated mapping key in one file, which the reader recorded as a defect of the source: a fact about the file's syntax, not about a substance."

[tables.yaml_files]
disposition = "out_of_scope"
reason = "The file-level description, generator, version and date of each YAML document: attribution of the file, which the carrier's artifact rows state, and no construct of the model holds them."
