# Mapping of the Cantera source (sources/cantera.toml, tag v3.2.0), wave 1: the species entries
# that state a standard-state thermo block of the models NASA7, NASA9, Shomate, constant-cp and
# piecewise-Gibbs, as species forms with their composition and charge and one parameter set each.
# Everything else (phases and equations of state, transport, reactions and rate parameterisations,
# critical parameters) is deferred to its wave, and the framing of the YAML files is out of scope.
# The format is documented in docs/pipeline.md section 2.1; the constructs are those of
# survey/cantera.toml, dispositioned in survey/dispositions/cantera.toml.

source = "cantera"
doc = "Cantera species forms, composition, charge and standard-state thermochemistry of five models."

# ------------------------------------------------------------------------------------------
# Source entities: one per species entry. A name is unique only within a file (a file lists the
# species of its phases in sections, and a test file lists the same name several times), and
# Cantera gives no registry number, so an entry is keyed by its locator (file, section, position)
# and identified by its formula, charge and aggregation where the formula scope applies.

[scopes.species]
table = "species"
key = "_locator"
class = "species_form"
doc = "An entry of a species section of a YAML file, keyed by its locator: the file, the section and the position in it, which is unique where the name is not."

[[formula_scope]]
scope = "species"
reason = "A species entry states its composition as element symbols with atom counts (and its charge as the pseudo-element E) but no CAS number or structure. A formula and charge identify the species by the convention of the thermochemical tables; where entries of one file, or of several sources, share them, a decision of identity/decisions.toml says so."

[decodings.aggregation_of_phase_thermo]
doc = "The aggregation of the species of a phase from the thermo model the phase names, as Cantera defines the model: an ideal gas, a plasma and a mixture-fugacity phase (Redlich-Kwong, Peng-Robinson) have an ideal gas as the standard state of their species; the surface phases count their species per area; the Debye-Huckel, HMW, ideal-molal and IAPWS-95 water phases are the liquid solutions of the aqueous models; a tpx pure fluid is a fluid. A model that covers solids and liquids alike (fixed-stoichiometry, ideal-condensed), or whose species are neither, decodes to nothing."

[[decodings.aggregation_of_phase_thermo.rules]]
where = { thermo = ["ideal-gas", "plasma", "Redlich-Kwong", "Peng-Robinson"] }
to = "gas"
reason = "The standard state of the species of these phases is an ideal gas (species-thermo.md, reference and standard states)."

[[decodings.aggregation_of_phase_thermo.rules]]
where = { thermo = ["ideal-surface", "coverage-dependent-surface"] }
to = "surface"
reason = "The species of a surface phase are counted per unit area of the surface."

[[decodings.aggregation_of_phase_thermo.rules]]
where = { thermo = "pure-fluid" }
to = "fluid"
reason = "A tpx pure fluid does not distinguish its liquid from its vapour."

[[decodings.aggregation_of_phase_thermo.rules]]
where = { thermo = ["Debye-Huckel", "HMW-electrolyte", "ideal-molal-solution", "liquid-water-IAPWS95"] }
to = "liquid"
reason = "These are the liquid (aqueous) solution models, whose species are the solvent and its solutes."

# ------------------------------------------------------------------------------------------
# The body of data: Cantera's own constants, and one parameterization for each file.

[energy_references.cantera]
key = "cantera_{pin}"
enthalpy = "not_stated"
entropy = "not_stated"
pressure = { value = 101325.0, unit = "Pa" }

[convention_sets.cantera]
key = "cantera"
revision = "{pin}"
temperature_scale = "not_stated"
energy_reference = "cantera"
gas_constant = { value = 8314.46261815324, unit = "J/(kmol*K)" }
boltzmann_constant = { value = 1.380649e-23, unit = "J/K" }
avogadro_constant = { value = 6.02214076e26, unit = "1/kmol" }

[parameterizations.file]
key = "cantera_{artifact}"
revision = "{pin}"
title = "Cantera {artifact}"
coherence = "independent_records"
origin_role = "published"
convention_set = "cantera"
per_artifact = true

# ------------------------------------------------------------------------------------------
# species

[tables.species]
disposition = "deferred"
wave = 2
reason = "An entry with no thermo block of the five models (the critical-properties database, the HKFT and constant-volume equation-of-state entries) maps with the equations of state in wave 2."

[tables.species.joins.thermo]
table = "species_thermo"
on = { _locator = "species_locator" }

[[tables.species.partitions]]
name = "with_thermo"
where = { "thermo.model" = ["NASA7", "NASA9", "Shomate", "constant-cp", "piecewise-Gibbs"] }
disposition = "mapped"
origin_role = "published"
loss = "An entry sits in a section, not in a phase, so its aggregation is decoded from the thermo model of the phases that include it (an assumption: the decoding does not distinguish a solid from a liquid), and is refused for an entry no phase includes or that phases of different aggregations include; the charge is the pseudo-element E with its sign converted; the computed molecular weight is not imported."

[tables.species.fields.section]
target = "source_entity.aggregation"
decode = "aggregation_of_phase_thermo"
precision = "close"
loss = "The entry is in a section, which a phase includes by name, not in a phase: the aggregation is that the decoding gives for the thermo model of the phases that include the entry."

[tables.species.fields.index]
role = "structure"
reason = "The position of the entry in its section; the locator states it and is the entity's key."

[tables.species.fields.name]
target = "identity_assertion.value"
scheme = "name"
precision = "exact"

[tables.species.fields.note]
disposition = "out_of_scope"
reason = "Free text of the entry (references, comments on the data): no construct of the model holds an unparsed remark, and the row's locator names where it stands."

[tables.species.fields.charge]
disposition = "out_of_scope"
reason = "No entry of the pinned tree states a charge key (the survey found none); the charge is the pseudo-element E of the composition, which every charged entry uses."

[tables.species.fields.sites]
disposition = "deferred"
wave = 2
reason = "The number of sites a surface species occupies belongs to the surface phases, which map in wave 2."

[tables.species.fields.descriptive_name]
target = "identity_assertion.value"
scheme = "name"
precision = "close"
optional = true
loss = "A long name some entries carry (the critical-properties database names its species); asserted as a name."

[tables.species.fields.molecular_weight]
disposition = "deferred"
wave = 2
reason = "A molar mass depends on the atomic-weight edition (CIAAW 2017 in Elements.cpp, not stated in the file); it maps with the atomic data."

[tables.species.fields."derived:formula"]
target = "identity_assertion.value"
scheme = "formula"
precision = "close"
loss = "The formula is assembled from the entry's composition rows in Hill order (thermo_knowledge.mapping.formula) with the pseudo-element E left out."

# ------------------------------------------------------------------------------------------
# species_composition

[tables.species_composition]
disposition = "deferred"
wave = 2
reason = "The composition of an entry with no thermo block of the five models maps with the entry in wave 2."

[tables.species_composition.joins.thermo]
table = "species_thermo"
on = { species_locator = "species_locator" }

[[tables.species_composition.partitions]]
name = "elements"
where = { "thermo.model" = ["NASA7", "NASA9", "Shomate", "constant-cp", "piecewise-Gibbs"], element = { not = "E" } }
disposition = "mapped"
origin_role = "published"
loss = "Composition is asserted per form as the entry states it; an entry that names an element the declaration does not hold (none is expected) is held whole."

[tables.species_composition.partitions.fields.species_locator]
role = "structure"
reason = "Links the pair to its entry."

[tables.species_composition.partitions.fields.element]
target = "composition.quantity"
precision = "exact"

[tables.species_composition.partitions.fields.atoms]
target = "composition.value"
unit = "dimensionless"
precision = "exact"
loss = "The count is stated without a unit; it is a number of atoms."

[[tables.species_composition.partitions]]
name = "electron"
where = { "thermo.model" = ["NASA7", "NASA9", "Shomate", "constant-cp", "piecewise-Gibbs"], element = "E" }
disposition = "mapped"
origin_role = "published"
loss = "The pseudo-element E counts the electrons an entry has lost (H3O+ has E: -1), so the charge number is the count with its sign converted."

[tables.species_composition.partitions.constants]
"composition.quantity" = "charge"

[tables.species_composition.partitions.fields.species_locator]
role = "structure"
reason = "Links the pair to its entry."

[tables.species_composition.partitions.fields.element]
role = "structure"
reason = "The symbol E stands for the charge quantity (constant composition.quantity)."

[tables.species_composition.partitions.fields.atoms]
target = "composition.value"
unit = "dimensionless"
precision = "close"
factor = -1.0
loss = "The count of E is the number of electrons lost, so the charge number is its negative."

# ------------------------------------------------------------------------------------------
# species_thermo: one partition for each model.

[tables.species_thermo]
disposition = "deferred"
wave = 2
reason = "A thermo block of a model other than the five mapped here has no row in this table; the partitions below cover every row."

[tables.species_thermo.fields.species_locator]
role = "structure"
reason = "Links the block to its entry."

[tables.species_thermo.fields.model]
role = "structure"
reason = "Selects the partition (the model of the block)."

[tables.species_thermo.fields.reference_pressure]
disposition = "out_of_scope"
holds = true
reason = "No block of the models mapped here states a reference pressure; Cantera's default of 1 atm is the pressure of the convention set. A block that stated one would change the standard state the coefficients apply at, so it is held."

[tables.species_thermo.fields.reference_pressure_text]
disposition = "out_of_scope"
holds = true
reason = "As reference_pressure: a block that stated one would be held."

[tables.species_thermo.fields.note]
disposition = "out_of_scope"
reason = "Free text of the thermo block (the source of the data, an author's remark): no construct of the model holds an unparsed remark."

[tables.species_thermo.fields.temperature_ranges]
disposition = "out_of_scope"
reason = "The n+1 bounds of the block's n pieces: the pieces state their own lower and upper bounds (thermo_pieces), which is where the set takes the intervals from."

[tables.species_thermo.fields.piece_count]
role = "structure"
reason = "The number of pieces of the block; the piece rows are its pieces."

[tables.species_thermo.fields.T0]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp block states a reference temperature."

[tables.species_thermo.fields.T0_text]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp block states a reference temperature."

[tables.species_thermo.fields.h0]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp or piecewise-Gibbs block states an enthalpy constant."

[tables.species_thermo.fields.h0_text]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp or piecewise-Gibbs block states an enthalpy constant."

[tables.species_thermo.fields.s0]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp block states an entropy constant."

[tables.species_thermo.fields.s0_text]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp block states an entropy constant."

[tables.species_thermo.fields.cp0]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp block states a heat capacity."

[tables.species_thermo.fields.cp0_text]
disposition = "out_of_scope"
holds = true
reason = "Only a constant-cp block states a heat capacity."

[tables.species_thermo.fields.T_min]
disposition = "out_of_scope"
holds = true
reason = "A temperature limit stated by a block (T-min) is the range the source recommends for its data, beside the fitted range of a polynomial set; the recommended range of a polynomial set is not mapped yet, so such a block (about thirty, all in test files) is held."

[tables.species_thermo.fields.T_max]
disposition = "out_of_scope"
holds = true
reason = "A temperature limit stated by a block (T-max) is the range the source recommends for its data, beside the fitted range of a polynomial set; the recommended range of a polynomial set is not mapped yet, so such a block is held."

[tables.species_thermo.fields.dimensionless]
disposition = "out_of_scope"
holds = true
reason = "Only a piecewise-Gibbs block states whether its values are divided by RT."

[[tables.species_thermo.partitions]]
name = "nasa7"
where = { model = "NASA7" }
disposition = "mapped"
origin_role = "fitted"
loss = "The piece bounds are taken as kelvin and the coefficients with the units the published form gives them (the file states none); the set stands in the convention set of the Cantera code: its gas constant and its reference pressure of 1 atm, and no enthalpy or entropy datum."

[tables.species_thermo.partitions.constants]
"validity_region.kind" = "fitted_range"
"region_clause.observable" = "temperature"

[tables.species_thermo.partitions.derivation]
kind = "fit"
outcome = "not_stated"
method = "A fit of NASA seven-coefficient polynomials to thermodynamic data, made by the authors of the data the file carries (the notes of an entry may name them). The file records neither the data, the software nor how the fit ended."

[[tables.species_thermo.partitions]]
name = "nasa9"
where = { model = "NASA9" }
disposition = "mapped"
origin_role = "fitted"
loss = "The piece bounds are taken as kelvin and the coefficients with the units the published form gives them (the file states none); the set stands in the convention set of the Cantera code: its gas constant and its reference pressure of 1 atm, and no enthalpy or entropy datum."

[tables.species_thermo.partitions.constants]
"validity_region.kind" = "fitted_range"
"region_clause.observable" = "temperature"

[tables.species_thermo.partitions.derivation]
kind = "fit"
outcome = "not_stated"
method = "A fit of NASA nine-coefficient polynomials to thermodynamic data, made by the authors of the data the file carries (the notes of an entry may name them). The file records neither the data, the software nor how the fit ended."

[[tables.species_thermo.partitions]]
name = "shomate"
where = { model = "Shomate" }
disposition = "mapped"
origin_role = "fitted"
loss = "The piece bounds are taken as kelvin and the coefficients with the units the published form gives them (the file states none); the set stands in the convention set of the Cantera code: its gas constant and its reference pressure of 1 atm, and no enthalpy or entropy datum."

[tables.species_thermo.partitions.constants]
"validity_region.kind" = "fitted_range"
"region_clause.observable" = "temperature"

[tables.species_thermo.partitions.derivation]
kind = "fit"
outcome = "not_stated"
method = "A fit of Shomate polynomials to thermodynamic data, made by the authors of the data the file carries (the notes of an entry may name them). The file records neither the data, the software nor how the fit ended."

[[tables.species_thermo.partitions]]
name = "constant_cp"
where = { model = "constant-cp" }
disposition = "mapped"
origin_role = "published"
loss = "An absent reference temperature, enthalpy, entropy or heat capacity is Cantera's documented default (298.15 K and 0.0), which the file cannot tell from a stated zero; a value given as text states its own unit; a number given without one is in the units of the file's units section, which the mapping does not apply yet, so a block that states one is held. The block states no validity limits in the pinned tree."

[tables.species_thermo.partitions.constants]
"validity_region.kind" = "recommended_range"
"region_clause.observable" = "temperature"

[tables.species_thermo.partitions.fields.T0]
target = "constant_cp.pure.T0"
unit = "K"
precision = "exact"
default = 298.15
loss = "An absent reference temperature is Cantera's documented default of 298.15 K; the unit of a temperature is always kelvin."

[tables.species_thermo.partitions.fields.T0_text]
target = "constant_cp.pure.T0"
text_unit = true
precision = "exact"
loss = "A reference temperature written with its unit (200 K)."

[tables.species_thermo.partitions.fields.h0_text]
target = "constant_cp.pure.h0"
text_unit = true
unit = "J/mol"
default = 0.0
precision = "exact"
loss = "An absent enthalpy is Cantera's documented default of 0.0; one written with its unit states it."

[tables.species_thermo.partitions.fields.h0]
disposition = "deferred"
wave = 2
holds = true
reason = "A number without a unit is in the energy and quantity units of the file's units section (Cantera's default J/kmol otherwise), which the mapping does not apply yet."

[tables.species_thermo.partitions.fields.s0_text]
target = "constant_cp.pure.s0"
text_unit = true
unit = "J/(mol*K)"
default = 0.0
precision = "exact"
loss = "An absent entropy is Cantera's documented default of 0.0; one written with its unit states it."

[tables.species_thermo.partitions.fields.s0]
disposition = "deferred"
wave = 2
holds = true
reason = "A number without a unit is in the energy and quantity units of the file's units section, which the mapping does not apply yet."

[tables.species_thermo.partitions.fields.cp0_text]
target = "constant_cp.pure.cp0"
text_unit = true
unit = "J/(mol*K)"
default = 0.0
precision = "exact"
loss = "An absent heat capacity is Cantera's documented default of 0.0; one written with its unit states it."

[tables.species_thermo.partitions.fields.cp0]
disposition = "deferred"
wave = 2
holds = true
reason = "A number without a unit is in the energy and quantity units of the file's units section, which the mapping does not apply yet."

[tables.species_thermo.partitions.fields.T_min]
target = "region_clause.lower"
unit = "K"
precision = "exact"
optional = true
loss = "The lower temperature limit of the block (the unit of a temperature is always kelvin); no block of the pinned tree states one."

[tables.species_thermo.partitions.fields.T_max]
target = "region_clause.upper"
unit = "K"
precision = "exact"
optional = true
loss = "The upper temperature limit of the block; no block of the pinned tree states one."

[[tables.species_thermo.partitions]]
name = "piecewise_gibbs"
where = { model = "piecewise-Gibbs" }
disposition = "mapped"
origin_role = "published"
loss = "The chemical potentials are given divided by RT (every block of the pinned tree says so) and are kept as stated, with the gas constant of the convention set; an absent enthalpy is the documented 0.0 and an absent reference pressure the documented 1 atm; a number given without a unit is in the units of the file's units section, which the mapping does not apply yet, so a block that states one is held."

[tables.species_thermo.partitions.fields.dimensionless]
role = "structure"
equals = true
reason = "The data are the chemical potential divided by RT; a block of values in energy units would need the units mapping and is held."

[tables.species_thermo.partitions.fields.h0_text]
target = "piecewise_gibbs.pure.h0"
text_unit = true
unit = "J/mol"
default = 0.0
precision = "exact"
loss = "An absent enthalpy is the documented default of 0.0; one written with its unit states it."

[tables.species_thermo.partitions.fields.h0]
disposition = "deferred"
wave = 2
holds = true
reason = "A number without a unit is in the energy and quantity units of the file's units section, which the mapping does not apply yet."

[tables.species_thermo.partitions.fields.reference_pressure]
target = "piecewise_gibbs.pure.p_ref"
unit = "Pa"
precision = "exact"
default = 101325.0
loss = "The unit of the number is not stated (Cantera's internal unit, pascal, is assumed); an absent reference pressure is the documented default of 1 atm."

[tables.species_thermo.partitions.fields.reference_pressure_text]
target = "piecewise_gibbs.pure.p_ref"
text_unit = true
precision = "exact"
optional = true
loss = "A reference pressure written with its unit (1 bar); the four blocks of the pinned tree that write one also state a number for the enthalpy, so they are held until the units mapping is applied."

# ------------------------------------------------------------------------------------------
# thermo_pieces: a piece of a polynomial model.

[tables.thermo_pieces]
disposition = "deferred"
wave = 2
reason = "The partitions below cover the pieces of every block of the mapped polynomial models."

[tables.thermo_pieces.joins.thermo]
table = "species_thermo"
on = { thermo_locator = "_locator" }

[tables.thermo_pieces.fields.thermo_locator]
role = "structure"
reason = "Links the piece to its block."

[[tables.thermo_pieces.partitions]]
name = "nasa7"
where = { "thermo.model" = "NASA7" }
disposition = "mapped"
origin_role = "fitted"
loss = "The coefficients are those of Cp/R = sum a_k T^(k-1) in kelvin, in the order of the NASA seven-coefficient form; the file states no unit."

[tables.thermo_pieces.partitions.fields.piece_index]
target = "nasa7.pure.piece.n"
offset = 1
precision = "exact"

[tables.thermo_pieces.partitions.fields.temperature_low]
target = "nasa7.pure.piece.T_low"
unit = "K"
precision = "exact"
loss = "Cantera states no unit for the bounds of a piece; kelvin is assumed (a temperature is always kelvin)."

[tables.thermo_pieces.partitions.fields.temperature_high]
target = "nasa7.pure.piece.T_high"
unit = "K"
precision = "exact"
loss = "Cantera states no unit for the bounds of a piece; kelvin is assumed (a temperature is always kelvin)."

[tables.thermo_pieces.partitions.fields.coefficient_count]
role = "structure"
equals = 7
reason = "The form has 7 coefficients for each piece."

[tables.thermo_pieces.partitions.fields."coefficients[0]"]
target = "nasa7.pure.piece.a1"
unit = "dimensionless"
precision = "exact"
loss = "The file states no unit for the coefficient; `dimensionless` is the unit of a1 in the form's equation."

[tables.thermo_pieces.partitions.fields."coefficients[1]"]
target = "nasa7.pure.piece.a2"
unit = "1/K"
precision = "exact"
loss = "The file states no unit for the coefficient; `1/K` is the unit of a2 in the form's equation."

[tables.thermo_pieces.partitions.fields."coefficients[2]"]
target = "nasa7.pure.piece.a3"
unit = "1/K^2"
precision = "exact"
loss = "The file states no unit for the coefficient; `1/K^2` is the unit of a3 in the form's equation."

[tables.thermo_pieces.partitions.fields."coefficients[3]"]
target = "nasa7.pure.piece.a4"
unit = "1/K^3"
precision = "exact"
loss = "The file states no unit for the coefficient; `1/K^3` is the unit of a4 in the form's equation."

[tables.thermo_pieces.partitions.fields."coefficients[4]"]
target = "nasa7.pure.piece.a5"
