[[tables.thermo_pieces.partitions]]
name = "nasa9"
where = { "thermo.model" = "NASA9" }
disposition = "mapped"
origin_role = "fitted"
loss = "The coefficients are those of Cp/R with the exponents -2 to 4 in kelvin and the two integration constants, in the order of the NASA nine-coefficient form; the file states no unit."

[tables.thermo_pieces.partitions.fields.piece_index]
