# Mapping of the NASA CEA source (sources/nasa_cea.toml, tag v3.3.4), wave 1: the species
# records of data/thermo.inp as species forms with their composition and charge, their NASA
# nine-coefficient polynomial intervals and the heats of formation of the reactant-only records.
# The transport database (trans.inp) is wave 7. The format is documented in docs/pipeline.md
# section 2.1; the constructs are those of survey/nasa_cea.toml, dispositioned in
# survey/dispositions/nasa_cea.toml.

source = "nasa_cea"
doc = "NASA CEA species forms, composition, charge and NASA-9 standard-state thermochemistry."

# ------------------------------------------------------------------------------------------
# Source entities: one per record name. A record states its phase by a flag and a suffix of its
# name, not by an aggregation, and names no registry number, so the class is a species form whose
# aggregation the decoding below gives, and whose species the formula and charge identify
# (resolution rule 4) where they do.

[scopes.species]
table = "species_records"
key = "name"
class = "species_form"
doc = "A record of thermo.inp, keyed by the name of its first line. Records that repeat a name are the consecutive temperature ranges of one form (a transition between condensed phases of one suffix), or, for n-Butanol, a gas and a condensed phase the flag tells apart."

[[formula_scope]]
scope = "species"
reason = "thermo.inp names a record by a label that is not an identifier (a suffix states its phase, a comment may follow a comma) and gives no CAS number or structure, but every record states its formula as element symbols with atom counts, and its charge as the pseudo-element E. A formula and charge identify the species by the convention of the thermochemical tables; where several records of this or another source share them, a decision of identity/decisions.toml says so."

[decodings.aggregation_of_record]
doc = "The aggregation and polymorph of a record from its phase flag and the suffix of its name, as RP-1311 and the file's own names use them. The flag is 0 for a gas and counts the condensed phases of a name from 1; the suffix (L) is a liquid, (cr) a crystal of no stated polymorph, any other parenthesised suffix the polymorph of a crystal."

[[decodings.aggregation_of_record.rules]]
where = { phase_flag = 0 }
to = "gas"
reason = "A phase flag of 0 marks a gas species."

[[decodings.aggregation_of_record.rules]]
where = { phase_flag = [1, 2, 3, 4, 5], name = { pattern = '.*\(L\)(,.*)?' } }
to = "liquid"
reason = "A condensed record whose name ends in (L), with or without a comment after a comma, is a liquid."

[[decodings.aggregation_of_record.rules]]
where = { phase_flag = [1, 2, 3, 4, 5], name = { pattern = '.*\(cr\)' } }
to = "crystalline"
reason = "A condensed record whose name ends in (cr) is a crystal; the suffix names no polymorph."

[[decodings.aggregation_of_record.rules]]
where = { phase_flag = [1, 2, 3, 4, 5], name = { pattern = '.*\((?P<polymorph>[^()]+)\)' } }
to = "crystalline"
polymorph = "{polymorph}"
reason = "A condensed record whose name ends in another parenthesised suffix, (a), (b), (II), (gr), is a crystal of the polymorph the suffix names, verbatim."

# ------------------------------------------------------------------------------------------
# The body of data: one parameterization with the conventions the program's code states.

[energy_references.thermo_inp]
key = "nasa_cea_thermo_inp_{pin}"
enthalpy = "not_stated"
entropy = "not_stated"
pressure = { value = 1.0, unit = "bar" }

[convention_sets.thermo_inp]
key = "nasa_cea_thermo_inp"
revision = "{pin}"
temperature_scale = "not_stated"
energy_reference = "thermo_inp"
gas_constant = { value = 8314.51, unit = "J/(kmol*K)" }
boltzmann_constant = { value = 1.380658e-23, unit = "J/K" }
avogadro_constant = { value = 6.0221367e26, unit = "1/kmol" }

[parameterizations.thermo_inp]
key = "nasa_cea_thermo_inp"
revision = "{pin}"
title = "NASA CEA thermo.inp"
coherence = "independent_records"
origin_role = "published"
convention_set = "thermo_inp"

# ------------------------------------------------------------------------------------------
# species_records

[tables.species_records]
disposition = "deferred"
wave = 1
reason = "The partitions below cover every record; a record they did not cover would stay deferred."

[[tables.species_records.partitions]]
name = "fitted"
where = { interval_count = [1, 2, 3, 4, 5, 6] }
disposition = "mapped"
origin_role = "published"
loss = "The record is the identity of the form, which the file states (name, phase flag, formula); its coefficients are the fitted rows of thermo_intervals, whose derivation the partition declares. The aggregation and polymorph are decoded from the flag and the suffix of the name (an assumption about how RP-1311 uses them), the charge is the pseudo-element E with its sign converted, the heat of formation is not imported because the coefficients carry the enthalpy, and the record's gas constant, standard pressure and enthalpy and entropy data come from the program's code and are stated in the convention set, not in the record."

[tables.species_records.partitions.constants]
"validity_region.kind" = "fitted_range"
"region_clause.observable" = "temperature"

[tables.species_records.partitions.derivation]
kind = "fit"
outcome = "not_stated"
method = "A fit of nine-coefficient NASA polynomials to tabulated thermodynamic data, by the database's authors (McBride, Zehe and Gordon, NASA/TP-2002-211556). The file records neither the software nor the data nor how the fit ended."

[[tables.species_records.partitions]]
name = "reactant_only"
where = { interval_count = 0 }
disposition = "mapped"
origin_role = "published"
loss = "A record without coefficients states a heat of formation and, on its interval line, the temperature it holds at; the unit of the heat of formation is taken as J/mol. Its heat capacity and entropy are not stated and none is asserted; the program's window and zero values are code, not data."

[tables.species_records.fields.section]
disposition = "out_of_scope"
reason = "Whether the program lists a record as a product or as a reactant is the role it plays in a calculation, not knowledge about the species."

[tables.species_records.fields.record_index]
role = "structure"
reason = "The position of the record in the file; the locator states it."

[tables.species_records.fields.name]
target = "identity_assertion.value"
scheme = "source_local"
precision = "close"
loss = "The first field of the record's first line, with its phase suffix and any comment after a comma: a label of the program, asserted as the source's own key."

[tables.species_records.fields.notes]
disposition = "out_of_scope"
reason = "Free-text literature references of the record (author, year, pages) with no identifier; no construct of the model holds an unparsed reference, and the row's locator names the line they stand on."

[tables.species_records.fields.interval_count]
role = "structure"
reason = "The number of intervals of the record; it selects the fitted records (partition fitted) from those without coefficients (partition reactant_only)."

[tables.species_records.fields.reference_date_code]
disposition = "out_of_scope"
reason = "A letter for the reference of the record's data and its revision date (g 8/99); the file's legend of the letters is text, so no code can be mapped to a publication."

[tables.species_records.fields.phase_flag]
target = "source_entity.aggregation"
decode = "aggregation_of_record"
precision = "close"
loss = "The flag and the suffix of the name are decoded to an aggregation (and a polymorph) by the table aggregation_of_record, an interpretation of RP-1311 the file does not state; a condensed record whose name has no suffix is held."

[tables.species_records.fields.molecular_weight]
disposition = "deferred"
wave = 2
reason = "A molar mass depends on the atomic-weight edition the program uses, which the file does not state; it is mapped with the atomic data once the edition is identified."

[tables.species_records.fields.heat_of_formation]
target = "assigned_enthalpy.pure.h_ref"
unit = "J/mol"
precision = "close"
loss = "The unit of the column is not stated; J/mol is inferred from its values and agrees with the coefficients of the fitted records. Only a record without coefficients takes it as data."

[tables.species_records.fields.line]
disposition = "out_of_scope"
reason = "The line number of the record in the file; the locator states it."

[tables.species_records.fields.raw_line_1]
disposition = "out_of_scope"
reason = "The record's first line exactly; it is kept in the staged table."

[tables.species_records.fields.raw_line_2]
disposition = "out_of_scope"
reason = "The record's second line exactly; it is kept in the staged table (its formula pairs are the rows of species_formula_pairs)."

[tables.species_records.fields."derived:formula"]
target = "identity_assertion.value"
scheme = "formula"
precision = "close"
loss = "The formula is assembled from the record's element-and-count pairs in Hill order (thermo_knowledge.mapping.formula) with the pseudo-element E left out; the charge is the entity's stated charge."

# ------------------------------------------------------------------------------------------
# species_formula_pairs: the composition of a record, which is also its charge.

[tables.species_formula_pairs]
disposition = "mapped"
origin_role = "published"
loss = "Composition is asserted per form, on the pairs as written; a record whose pairs name an element the declaration does not hold (the inert copies IH, IC and IO, the isotope D) is held whole."

[[tables.species_formula_pairs.partitions]]
name = "electron"
where = { symbol = "E" }
disposition = "mapped"
origin_role = "published"
loss = "The pseudo-element E counts electrons the species has gained; the charge number is the count with its sign converted."

[tables.species_formula_pairs.partitions.constants]
"composition.quantity" = "charge"

[tables.species_formula_pairs.partitions.fields.symbol]
role = "structure"
reason = "The symbol E stands for the charge quantity (constant composition.quantity)."

[tables.species_formula_pairs.partitions.fields.count]
target = "composition.value"
unit = "dimensionless"
precision = "close"
factor = -1.0
loss = "The count of E is the number of electrons gained, so the charge number is its negative."

[tables.species_formula_pairs.fields.species_locator]
role = "structure"
reason = "Links the pair to its record."

[tables.species_formula_pairs.fields.slot]
role = "structure"
reason = "The position of the pair on the record's line."

[tables.species_formula_pairs.fields.symbol]
target = "composition.quantity"
case = "capitalize"
precision = "close"
loss = "CEA writes element symbols in capitals (AL, CL); the declared element is the one with the symbol in its usual case."

[tables.species_formula_pairs.fields.count]
target = "composition.value"
unit = "dimensionless"
precision = "exact"
loss = "The count is stated without a unit; it is a number of atoms."

# ------------------------------------------------------------------------------------------
# thermo_intervals: a NASA-9 piece of a fitted record, or the reference line of one without.

[tables.thermo_intervals]
disposition = "deferred"
wave = 1
reason = "The partitions below cover every interval line; a line they did not cover would stay deferred."

[tables.thermo_intervals.joins.record]
table = "species_records"
on = { species_locator = "_locator" }

[tables.thermo_intervals.fields.species_locator]
role = "structure"
reason = "Links the interval to its record."

[tables.thermo_intervals.fields.interval_index]
role = "structure"
reason = "The position of the interval among the record's; the set's pieces are numbered from it."

[tables.thermo_intervals.fields.raw_line_interval]
disposition = "out_of_scope"
reason = "The interval line exactly; it is kept in the staged table."

[tables.thermo_intervals.fields.raw_line_coefficients_1]
disposition = "out_of_scope"
reason = "The first coefficient line exactly; it is kept in the staged table."

[tables.thermo_intervals.fields.raw_line_coefficients_2]
disposition = "out_of_scope"
reason = "The second coefficient line exactly; it is kept in the staged table."

[tables.thermo_intervals.fields.enthalpy_increment]
disposition = "out_of_scope"
reason = "The increment of enthalpy from 0 K to 298.15 K that the interval line carries is derived content the fits do not use; it is not read by the program's thermodynamic functions."

[[tables.thermo_intervals.partitions]]
name = "nasa9_intervals"
where = { "record.interval_count" = [1, 2, 3, 4, 5, 6] }
disposition = "mapped"
origin_role = "fitted"
loss = "The bounds of the interval are taken as kelvin and the coefficients as those of Cp/R = sum a_k T^k in kelvin (unit not stated); the exponents are checked to be the fixed NASA-9 set, which the form's expression states."

[tables.thermo_intervals.partitions.fields.interval_index]
target = "nasa9.pure.piece.n"
offset = 1
precision = "exact"

[tables.thermo_intervals.partitions.fields.t_low]
target = "nasa9.pure.piece.T_low"
unit = "K"
precision = "exact"
loss = "The source states no unit for the bounds of an interval; kelvin is assumed."

[tables.thermo_intervals.partitions.fields.t_high]
target = "nasa9.pure.piece.T_high"
unit = "K"
precision = "exact"
loss = "The source states no unit for the bounds of an interval; kelvin is assumed."

[tables.thermo_intervals.partitions.fields.exponent_count]
role = "structure"
equals = 7
reason = "The number of exponents the interval states; the form has the seven of NASA-9."

[tables.thermo_intervals.partitions.fields.exponents]
role = "structure"
equals = [-2, -1, 0, 1, 2, 3, 4, 0]
reason = "The exponents of the seven terms of Cp/R (the eighth slot is blank or zero): the fixed set of the form nasa9, so the interval is held if a record ever states another."

[tables.thermo_intervals.partitions.fields."coefficients[0]"]
target = "nasa9.pure.piece.a1"
unit = "K^2"
precision = "exact"
loss = "The source states no unit for the coefficients; `K^2` is the unit that makes a1 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[1]"]
target = "nasa9.pure.piece.a2"
unit = "K"
precision = "exact"
loss = "The source states no unit for the coefficients; `K` is the unit that makes a2 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[2]"]
target = "nasa9.pure.piece.a3"
unit = "dimensionless"
precision = "exact"
loss = "The source states no unit for the coefficients; `dimensionless` is the unit that makes a3 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[3]"]
target = "nasa9.pure.piece.a4"
unit = "1/K"
precision = "exact"
loss = "The source states no unit for the coefficients; `1/K` is the unit that makes a4 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[4]"]
target = "nasa9.pure.piece.a5"
unit = "1/K^2"
precision = "exact"
loss = "The source states no unit for the coefficients; `1/K^2` is the unit that makes a5 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[5]"]
target = "nasa9.pure.piece.a6"
unit = "1/K^3"
precision = "exact"
loss = "The source states no unit for the coefficients; `1/K^3` is the unit that makes a6 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[6]"]
target = "nasa9.pure.piece.a7"
unit = "1/K^4"
precision = "exact"
loss = "The source states no unit for the coefficients; `1/K^4` is the unit that makes a7 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[7]"]
target = "nasa9.pure.piece.b1"
unit = "K"
precision = "exact"
loss = "The source states no unit for the coefficients; `K` is the unit that makes b1 of Cp/R a number in kelvin."

[tables.thermo_intervals.partitions.fields."coefficients[8]"]
target = "nasa9.pure.piece.b2"
unit = "dimensionless"
precision = "exact"
loss = "The source states no unit for the coefficients; `dimensionless` is the unit that makes b2 of Cp/R a number in kelvin."

[[tables.thermo_intervals.partitions]]
name = "reactant_reference"
where = { "record.interval_count" = 0 }
disposition = "mapped"
origin_role = "published"
loss = "The interval line of a record without coefficients states only the temperature its heat of formation holds at, in a column the program reads as a lower bound; kelvin is assumed."

[tables.thermo_intervals.partitions.fields.t_low]
target = "assigned_enthalpy.pure.T_ref"
unit = "K"
precision = "close"
loss = "The source states no unit; kelvin is assumed. The value is the reference temperature of the record's heat of formation (298.15 K for most records, the temperature of a cryogenic liquid's own state for the others)."

[tables.thermo_intervals.partitions.fields.t_high]
disposition = "out_of_scope"
reason = "Zero on the line of a record without coefficients: a placeholder of the fixed format, not an upper bound."

[tables.thermo_intervals.partitions.fields.exponent_count]
role = "structure"
reason = "Zero for a record without coefficients."

[tables.thermo_intervals.partitions.fields.exponents]
disposition = "out_of_scope"
reason = "Blank or zero on the line of a record without coefficients."

[tables.thermo_intervals.partitions.fields.coefficients]
disposition = "out_of_scope"
reason = "Absent for a record without coefficients."

# ------------------------------------------------------------------------------------------
# Every other table.

[tables.frame_lines]
disposition = "out_of_scope"
reason = "The comment lines (the legend of the reference-date letters, the change log), the keyword line, the grid line the compiler hard-codes again, the section sentinels and the closing line of the two files: framing of the text format, not knowledge about a substance. Each record states its own ranges."

[tables.trans_entries]
disposition = "deferred"
wave = 7
reason = "Transport-property fits (viscosity and conductivity) map with the transport forms in wave 7."

[tables.trans_intervals]
disposition = "deferred"
wave = 7
reason = "Coefficients of the transport-property fits; wave 7."
