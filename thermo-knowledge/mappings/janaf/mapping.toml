# Mapping of the NIST-JANAF tables (sources/janaf.toml, retrieved 2026-09-30), wave 1: each table as
# evaluated datasets, one for each phase segment of the table, with the species form each is
# about and the conventions the tables assume. The format is documented in docs/pipeline.md
# section 2.1; the constructs are those of survey/janaf.toml, dispositioned in
# survey/dispositions/janaf.toml. The index and the formula index of the site are not staged
# tables; the table files carry the title, the formula and the designator the mapping reads.

source = "janaf"
doc = "NIST-JANAF tables as evaluated datasets of the standard-state properties of species forms."

# ------------------------------------------------------------------------------------------
# Source entities: one per phase segment of a table. The files give a formula with atom counts
# and a charge, a phase designator and no registry number, so the class is a species form whose
# aggregation the designator (or, for a table of several phases, its transition markers) gives,
# and whose species the formula and charge identify (resolution rule 4) where they do.

[scopes.tables]
table = "tables"
key = "code"
class = "species_form"
doc = "A table file, keyed by its code (element symbol, hyphen, sequence number); an entity is one phase segment of it (the key, `#` and the segment's number)."

[[formula_scope]]
scope = "tables"
reason = "A table states the formula of its substance with explicit atom counts and its charge, and names no CAS number or structure. A formula and charge identify the species by the convention of the thermochemical tables; where entries of this or another source share them, a decision of identity/decisions.toml says so."

[decodings.aggregation_of_designator]
doc = "The aggregation a table's phase designator states when it names one phase: g for a gas, cr for a crystal, l for a liquid, fl for a fluid. The designators of tables that cover several phases (cr,l and l,g) or name an element's reference form (ref) state no single aggregation."

[[decodings.aggregation_of_designator.rules]]
where = { phase_designator = "g" }
to = "gas"
reason = "The designator g is a gas (the marker texts of the tables call the gas phase IDEAL GAS)."

[[decodings.aggregation_of_designator.rules]]
where = { phase_designator = "cr" }
to = "crystalline"
reason = "The designator cr is a crystal."

[[decodings.aggregation_of_designator.rules]]
where = { phase_designator = "l" }
to = "liquid"
reason = "The designator l is a liquid."

[[decodings.aggregation_of_designator.rules]]
where = { phase_designator = "fl" }
to = "fluid"
reason = "The designator fl (water at stated pressures) does not distinguish liquid from vapour."

[decodings.phase_change]
doc = "The two phases a transition marker row names, `<lower> <--> <upper>`, in the words the tables use; a marker that names none (TRANSITION, a fugacity or pressure statement, a lambda or hump of the heat capacity) does not change the phase."

[[decodings.phase_change.rules]]
where = { marker = { pattern = '(?P<lower>.+?) <--> (?P<upper>.+)' } }
to = "{lower}"
reason = "A marker of the form X <--> Y is the change of the lower phase X into the upper phase Y at that temperature."

[decodings.aggregation_of_phase_name]
doc = "The aggregation of a phase a transition marker names: CRYSTAL and the polymorph labels (the Greek letters and the Roman numerals) are crystals, LIQUID a liquid, GLASS an amorphous solid, IDEAL GAS and REAL GAS a gas."

[[decodings.aggregation_of_phase_name.rules]]
where = { phase_name = ["CRYSTAL", "ALPHA", "BETA", "GAMMA", "DELTA", "EPSILON", "I", "II", "III", "IV", "V"] }
to = "crystalline"
reason = "These words name a crystal or one of its polymorphs."

[[decodings.aggregation_of_phase_name.rules]]
where = { phase_name = "LIQUID" }
to = "liquid"
reason = "LIQUID is the liquid phase."

[[decodings.aggregation_of_phase_name.rules]]
where = { phase_name = "GLASS" }
to = "amorphous"
reason = "GLASS is the vitreous, amorphous solid."

[[decodings.aggregation_of_phase_name.rules]]
where = { phase_name = ["IDEAL GAS", "REAL GAS"] }
to = "gas"
reason = "IDEAL GAS and REAL GAS are the gas phase."

[decodings.charge_of_formula]
doc = "The charge number a JANAF formula states as a trailing sign: a plus sign is a charge of one, a minus sign of minus one, and no sign neutral."

[[decodings.charge_of_formula.rules]]
where = { janaf_formula = { pattern = '.*\+' } }
to = "1"
reason = "A trailing plus sign is one unit of positive charge."

[[decodings.charge_of_formula.rules]]
where = { janaf_formula = { pattern = '.*-' } }
to = "-1"
reason = "A trailing minus sign is one unit of negative charge."

[[decodings.charge_of_formula.rules]]
where = { janaf_formula = { pattern = '.*[0-9]' } }
to = "0"
reason = "A formula that ends in an atom count states no charge."

[decodings.standard_state_of_aggregation]
doc = "The standard state of a segment from its aggregation, at the pressure the mapping assumes: a gas is the pure substance as an ideal gas, a condensed phase the pure substance in its real state."

[[decodings.standard_state_of_aggregation.rules]]
where = { aggregation = "gas" }
to = "pure_ideal_gas"
key = "janaf_pure_ideal_gas_1_bar"
reason = "The standard state of a gas in a table of thermochemical properties is the ideal gas."

[[decodings.standard_state_of_aggregation.rules]]
where = { aggregation = ["liquid", "crystalline", "amorphous", "fluid"] }
to = "pure_real"
key = "janaf_pure_real_1_bar"
reason = "The standard state of a condensed phase is the pure substance in its real state."

# ------------------------------------------------------------------------------------------
# The conventions the tables assume: the energy reference, inferred from the tables (survey/janaf.toml,
# conventions), and no gas constant, which no table states.

[energy_references.janaf]
key = "janaf_{pin}"
enthalpy = "formation_from_elements"
entropy = "third_law"
temperature = { value = 298.15, unit = "K" }
pressure = { value = 1.0, unit = "bar" }

[convention_sets.janaf]
key = "janaf"
revision = "{pin}"
temperature_scale = "not_stated"
energy_reference = "janaf"

# ------------------------------------------------------------------------------------------
# tables

[tables.tables]
disposition = "mapped"
origin_role = "evaluated"
loss = "No unit, edition, pressure or uncertainty is stated in a file: the units of the columns and the standard pressure of 1 bar are assumptions recorded in the rules, the energy reference (formation from the elements at 298.15 K, third-law entropy) is inferred from the tables, and the dataset's kind is inferred from the title of the site. The aggregation comes from the designator, or from the transition markers of a table that covers several phases; polymorph labels inside one aggregation do not split a segment."

[tables.tables.fields.code]
target = "identity_assertion.value"
scheme = "source_local"
precision = "exact"

[tables.tables.fields.title_field_1]
disposition = "out_of_scope"
reason = "The first field of the title line, which the reader splits into the substance name and the formula in the name (the next two rules); it is kept in the staged table."

[tables.tables.fields.title_field_2]
disposition = "out_of_scope"
reason = "The second field of the title line, which the reader splits into the JANAF formula and the phase designator (the rules for those columns); it is kept in the staged table."

[tables.tables.fields.substance_name]
target = "identity_assertion.value"
scheme = "name"
precision = "close"
loss = "The name as the title writes it (Silicon Oxide), which does not distinguish the substance from its isomers of the same name."

[tables.tables.fields.name_formula]
target = "identity_assertion.value"
scheme = "source_local"
precision = "exact"
loss = "The formula as the title writes it inside the name (SiO2): a label of the table, not the formula asserted for identity, which is the JANAF formula in Hill order."

[tables.tables.fields.janaf_formula]
target = "identity_assertion.value"
scheme = "formula"
precision = "close"
loss = "The JANAF formula writes every count, even 1 (O2Si1), with the charge as a trailing sign; it is asserted in Hill order (thermo_knowledge.mapping.formula), the sign being the entity's stated charge. The electron e1- has no atoms and so no formula assertion."

[tables.tables.fields.phase_designator]
target = "source_entity.aggregation"
decode = "aggregation_of_designator"
precision = "close"
optional = true
loss = "The designator names the phase or phases of the table (g, cr, l, fl; cr,l and l,g cover two; ref is an element's reference form, which states none); where it names one the aggregation is the decoded one, and where not the transition markers of the table decide."

[tables.tables.fields."derived:phase_name"]
target = "source_entity.aggregation"
decode = "aggregation_of_phase_name"
precision = "close"
optional = true
loss = "A marker names the phases it separates in words (CRYSTAL, LIQUID, GLASS, ALPHA, II); the words are decoded to aggregations, and a polymorph label inside one aggregation does not split the segment."

[tables.tables.fields."derived:charge"]
target = "source_entity.stated_charge"
decode = "charge_of_formula"
precision = "exact"
loss = "The charge is the sign the JANAF formula ends in; the electron e1- (which has no atom) is not read."

[tables.tables.fields.header_line]
role = "structure"
equals = "T(K)\tCp\tS\t-[G-H(Tr)]/T\tH-H(Tr)\tdelta-f H\tdelta-f G\tlog Kf"
reason = "The eight columns of every table, as the rules of the rows table read them; a table with another header is held."

[tables.tables.fields.line_count]
disposition = "out_of_scope"
reason = "The number of lines of the file, a count of the reader."

[tables.tables.fields.data_row_count]
disposition = "out_of_scope"
reason = "The number of data lines of the file, a count of the reader."

[tables.tables.fields.plus_count]
disposition = "out_of_scope"
reason = "The number of separator lines holding only a plus sign, a count of the reader."

[tables.tables.fields.empty_count]
disposition = "out_of_scope"
reason = "The number of separator lines holding only tabs, a count of the reader."

[tables.tables.fields.blank_count]
disposition = "out_of_scope"
reason = "The number of blank lines, a count of the reader."

[tables.tables.fields.ends_with_newline]
disposition = "out_of_scope"
reason = "Whether the file ends with a line feed, a fact about the text."

# ------------------------------------------------------------------------------------------
# rows

[tables.rows]
disposition = "deferred"
wave = 1
reason = "The partitions below cover every line of a table file."

[[tables.rows.partitions]]
name = "separators"
where = { row_kind = ["plus", "empty", "blank"] }
disposition = "out_of_scope"
reason = "A line holding only a plus sign, only tabs or nothing separates the two rows of a phase change or pads the file; it carries no value."

[[tables.rows.partitions]]
name = "data"
where = { row_kind = "data" }
disposition = "mapped"
origin_role = "evaluated"
loss = "The units of the columns are not stated in the files (only T(K) is): they are assumed as the rules say, from the published tables. The divergent cells (INFINITE at 0 K) state no value and have no datum; the marker texts are kept only as far as they name the phases of the segments; a row whose cells run together is held."

[tables.rows.partitions.constants]
"dataset.kind" = "evaluated"
"standard_state.pressure" = { value = 1.0, unit = "bar" }
"standard_state.pressure_rule" = "fixed"
"dataset_component.function" = "component"
"dataset_component.ordinal" = 1
"dataset_phase.ordinal" = 1
"datum.state" = "known"

[tables.rows.partitions.fields."derived:standard_state"]
target = "standard_state.kind"
decode = "standard_state_of_aggregation"
precision = "close"
loss = "The standard state of a segment is taken from its aggregation (an ideal gas for a gas, the real pure substance for a condensed phase) at 1 bar; no table states either."

[tables.rows.partitions.fields.line_number]
role = "structure"
reason = "The line of the file; the locator states it."

[tables.rows.partitions.fields.row_index]
role = "structure"
reason = "The position of the line after the header; the points of a dataset are numbered in this order."

[tables.rows.partitions.fields.row_kind]
role = "structure"
reason = "Selects the data lines (partition data) from the separators."

[tables.rows.partitions.fields.raw_line]
disposition = "out_of_scope"
reason = "The line exactly; it is kept in the staged table."

[tables.rows.partitions.fields.cell_count]
disposition = "out_of_scope"
reason = "The number of tab-separated cells of the line, a count of the reader."

[tables.rows.partitions.fields.marker]
target = "dataset_phase.label"
decode = "phase_change"
precision = "close"
loss = "The marker text of a phase change names the phases it separates; it is decoded to decide where a table changes aggregation, and is kept nowhere else (the texts TRANSITION, FUGACITY and the lambda and hump notes state nothing the model holds)."

[tables.rows.partitions.fields.fused_cells]
disposition = "out_of_scope"
reason = "Says which columns took their values from one space-separated field of three numbers (the formation cells after a marker row); the values themselves are mapped."

[tables.rows.partitions.fields.parse_note]
disposition = "out_of_scope"
holds = true
reason = "A cell whose digits run together with its neighbour's (a fixed-width column that overflowed): the mapping does not split such cells by width, so the line is held."

[tables.rows.partitions.fields.t]
target = "datum.value"
text = "t_text"
unit = "K"
precision = "exact"

[tables.rows.partitions.fields.t.column]
role = "variable"
observable = "temperature"
source_name = "T(K)"

[tables.rows.partitions.fields.t_text]
role = "structure"
reason = "The cell of `t` as written: the digits it writes are the digits of that value (the rule's `text`)."

[tables.rows.partitions.fields.cp]
target = "datum.value"
text = "cp_text"
unit = "J/(mol*K)"
precision = "close"
loss = "The unit is not stated in the file; J/(mol*K) is assumed from the published tables."

[tables.rows.partitions.fields.cp.column]
role = "property"
standard_state = true
observable = "standard_molar_heat_capacity_isobaric"
source_name = "Cp"

[tables.rows.partitions.fields.cp_text]
role = "structure"
reason = "The cell of `cp` as written: the digits it writes are the digits of that value (the rule's `text`)."

[tables.rows.partitions.fields.s]
target = "datum.value"
text = "s_text"
unit = "J/(mol*K)"
precision = "close"
loss = "The unit is not stated in the file; J/(mol*K) is assumed from the published tables."

[tables.rows.partitions.fields.s.column]
role = "property"
standard_state = true
observable = "standard_molar_entropy"
source_name = "S"

[tables.rows.partitions.fields.s_text]
role = "structure"
reason = "The cell of `s` as written: the digits it writes are the digits of that value (the rule's `text`)."

[tables.rows.partitions.fields.g_function]
target = "datum.value"
text = "g_function_text"
unit = "J/(mol*K)"
precision = "close"
loss = "The unit is not stated in the file; J/(mol*K) is assumed from the published tables. The value at 0 K is INFINITE and has no datum."

[tables.rows.partitions.fields.g_function.column]
role = "property"
standard_state = true
observable = "standard_gibbs_energy_function"
source_name = "-[G-H(Tr)]/T"

[tables.rows.partitions.fields.g_function_text]
role = "structure"
reason = "The cell of `g_function` as written: the digits it writes are the digits of that value (the rule's `text`)."

[tables.rows.partitions.fields.h_increment]
target = "datum.value"
text = "h_increment_text"
unit = "kJ/mol"
precision = "close"
loss = "The unit is not stated in the file; kJ/mol is assumed from the published tables. The column is the enthalpy minus its value in the reference phase at Tr, 298.15 K (inferred from the row at that temperature, where it is zero)."

[tables.rows.partitions.fields.h_increment.column]
role = "property"
standard_state = true
observable = "standard_molar_enthalpy"
source_name = "H-H(Tr)"
presentation = "difference_from_reference"
reference_state_kind = "reference_phase_fixed_tp"
reference_temperature = { value = 298.15, unit = "K" }
reference_pressure = { value = 1.0, unit = "bar" }

[tables.rows.partitions.fields.h_increment_text]
role = "structure"
reason = "The cell of `h_increment` as written: the digits it writes are the digits of that value (the rule's `text`)."

[tables.rows.partitions.fields.delta_f_h]
target = "datum.value"
text = "delta_f_h_text"
unit = "kJ/mol"
precision = "close"
loss = "The unit is not stated in the file; kJ/mol is assumed from the published tables."

[tables.rows.partitions.fields.delta_f_h.column]
role = "property"
observable = "molar_enthalpy_of_formation"
source_name = "delta-f H"

[tables.rows.partitions.fields.delta_f_h_text]
role = "structure"
reason = "The cell of `delta_f_h` as written: the digits it writes are the digits of that value (the rule's `text`)."

[tables.rows.partitions.fields.delta_f_g]
target = "datum.value"
text = "delta_f_g_text"
unit = "kJ/mol"
precision = "close"
loss = "The unit is not stated in the file; kJ/mol is assumed from the published tables."

[tables.rows.partitions.fields.delta_f_g.column]
role = "property"
observable = "molar_gibbs_energy_of_formation"
source_name = "delta-f G"

[tables.rows.partitions.fields.delta_f_g_text]
role = "structure"
reason = "The cell of `delta_f_g` as written: the digits it writes are the digits of that value (the rule's `text`)."

[tables.rows.partitions.fields.log_kf]
target = "datum.value"
text = "log_kf_text"
unit = "dimensionless"
precision = "close"
loss = "The base of the logarithm is not stated in the file; base ten is assumed from the published tables. The value at 0 K is INFINITE in some tables and has no datum."

[tables.rows.partitions.fields.log_kf.column]
role = "property"
observable = "log10_equilibrium_constant"
source_name = "log Kf"

[tables.rows.partitions.fields.log_kf_text]
role = "structure"
reason = "The cell of `log_kf` as written: the digits it writes are the digits of that value (the rule's `text`)."
