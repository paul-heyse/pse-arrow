# A standalone uv project: not a member of the repository's root project or of any workspace
# (Plan 24). Runtime libraries are pinned with `==` to the versions uv.lock resolved; tools
# that only execute carry floors in the dependency group.

[project]
name = "thermo-knowledge"
version = "0.0.0"
description = "Standalone thermodynamic knowledge base: source procurement, domain model and PostgreSQL consolidation (Plan 24)"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT OR Apache-2.0"
dependencies = [
  "psycopg[binary]==3.3.6",
  "pyarrow==25.0.1",
  "adbc-driver-postgresql==1.12.0",
  "adbc-driver-manager==1.12.0",
  "msgspec==0.22.0",
  "pyyaml==6.0.3",
  "typer==0.27.2",
  "pint==0.26.1",
  "sympy==1.14.0",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "httpx==0.28.1",
  "rdkit==2026.3.6",
  "CoolProp==8.0.0",
]

[project.scripts]
tk = "thermo_knowledge.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
