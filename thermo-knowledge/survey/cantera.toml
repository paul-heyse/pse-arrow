read_by_source = "all"
notes = "Files are mostly generated conversions: across the 23 data/*.yaml files 14 carry generator cti2yaml and 6 carry ck2yaml (measured); cantera-version values 2.5.0 (17 files), 2.6.0 (3), 3.0.0 (1). Several files are explicit illustrations: sofc.yaml states its rate coefficients and thermochemistry are not real values, and data/README.md says all shipped inputs are for illustration only. The same species name recurs across files with different parameters (see the selection 'species data by including file'). 13 of the 19 files declare a top-level units mapping."

