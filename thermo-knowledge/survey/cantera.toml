source = "cantera"
pin = "4a8358eb80cf"
surveyed = "2026-09-30"

summary = "Cantera v3.2.0 (tag v3.2.0; data/example_data submodule b9e0731611bc) contributes a YAML model-input format (phases, species, elements, reactions, units) with 113 YAML files (23 under data/, 10 under data/example_data, 80 under test/data) holding 1473 species-thermo entries in data/ (1425 NASA7, 15 NASA9, 33 constant-cp; 1305 distinct names, 69 of which carry different parameters in more than one file), 697 critical-property records, 87 element entropies and 1378 reactions in data/, 1345 species and 5728 reactions in example_data, eight pure-fluid equation sets embedded in C++ (src/tpx), and a code-defined set of 23 thermo-phase names, 5 species-thermo models, 5 standard-state (PDSS) names, 16 rate-parameterisation names, 10 transport model names (plus DustyGas by API only) and 3 equilibrium solvers. It bundles no fitted activity-model data outside small test fixtures (HMW NaCl, Debye-Huckel, Margules, Redlich-Kister), no phase-stability analysis, no bubble or dew point for mixtures, no regression and no group contribution; reactor and flame models are out of thermodynamic scope."

