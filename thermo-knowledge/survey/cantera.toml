  { name = "note", meaning = "free text", unit = "not applicable", shape = "scalar", role = "metadata" },
]
origin = "authored (or generated by cti2yaml, ck2yaml or ctml2yaml per the generator field; model-specific parameters are transcribed from the literature named in each file's description)"
