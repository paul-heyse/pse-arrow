# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "enthalpy datum of polynomial species data"
question = "No file or header names the zero of enthalpy and entropy of NASA7, NASA9 or constant-cp data (only the library origin suggests formation from the elements at 298.15 K). Does the source intend each body of data to use the standard formation datum, and is that recorded anywhere beyond the units block and the note field?"
why_it_matters = "h and s of two species from different files (nasa_gas.yaml versus a hand-written constant-cp entry with h0 defaulting to 0) are not comparable without a declared energy_reference; the model must not assume one."

[[question]]
about = "gas constant used when the polynomials were fitted"
question = "Cantera evaluates dimensionless polynomials with its CODATA-2019 gas constant, but the gas constant used to fit the NASA coefficient libraries it ships is not stated in the files (the sibling NASA CEA tree uses 8314.51 J/kmol/K, which differs in the sixth digit). Is any correction applied, and is the fitting constant recorded in the bundled files or documentation?"
why_it_matters = "A convention_set is meant to hold the gas constant a body of data was built with; here the value is unrecorded and only the evaluating constant is known, so recomputed properties differ at the parts-per-million level from the source."

[[question]]
about = "temperature scale"
question = "No file, header or document names a practical temperature scale (ITS-90 or other) for any polynomial, range or fixed point."
why_it_matters = "The model's convention_set has a temperature_scale field; it must be not_stated for every Cantera record."

[[question]]
about = "competing species definitions across files"
question = "69 species names carry different thermo blocks in different data files and no file or rule ranks them (for example H2 in gri30.yaml, nasa_gas.yaml, liquidvapor.yaml and others). Which file is the intended source for a bare name?"
why_it_matters = "The model keeps several parameter sets per subject and needs a selection_policy; the source supplies none, only the include path of each phase."

[[question]]
about = "documented versus registered thermo names"
question = "The registered thermo names none and ideal-gas-VPSS are absent from the documented list in phases.md and from all data; ideal-gas-VPSS is an alias-by-class of ideal-solution-VPSS. Are they supported inputs?"
why_it_matters = "The model's form catalogue needs one entry per supported model; two names may map to one class."

[[question]]
about = "liquid-water-IAPWS95 versus tpx water versus the IAPWS pure-fluid"
question = "Cantera has three representations of water: the tpx water equation set (Reynolds 1979), WaterSSTP/PDSS_Water (IAPWS-95, liquid only) and the incompressible phases of water.yaml. Which is authoritative for which condition, and how do their enthalpy datums relate?"
why_it_matters = "Three parameter sets exist for one subject; the model needs three assemblies and a policy, and the datum linking tpx to species thermo is applied only at run time."

[[question]]
about = "HKFT datum and element entropies"
question = "HKFT data require element-standard-entropies.yaml (entropy298 for each element of the species), and the file states J/kmol/K; the code converts h0 and g0 to a NIST-based chemical potential. Which reference (apparent versus true formation Gibbs energy) does a bare h0, s0 block in the test data use?"
why_it_matters = "Benson-Helgeson apparent energies need their own energy_reference and conversion; the block does not say."

[[question]]
about = "pH scale selection"
question = "setpHScale exists in the API but no YAML key selects the scale; is the Pitzer scale therefore the only scale reachable from data files?"
why_it_matters = "The scale changes single-ion activity coefficients; a convention that only exists in the API cannot be recorded against a data file."

[[question]]
about = "unread fields in critical-properties.yaml"
question = "descriptive-name, molecular-weight, critical-molar-volume and critical-compressibility are present on 695 to 697 records and read by nothing in src. Are they intended for future use or only documentation?"
why_it_matters = "They are values with role unread; importing them as parameters would create unused content, while dropping them loses a cross-check on critical volume."

[[question]]
about = "sofc.yaml and other illustrative data"
question = "sofc.yaml says its rate coefficients and thermochemistry are not real values, and data/README.md says all shipped inputs are illustrations; which data files are intended as recommended data?"
why_it_matters = "The provenance role (synthetic or illustrative versus published) cannot be read from the file; importing them as published would be wrong."

[[question]]
about = "HDF5 payload"
question = "The eight .h5 files were not parsed (no HDF5 reader in this environment); their group layout and any thermodynamic content are unknown."
why_it_matters = "If they hold computed state tables they could serve as oracle data."

[[question]]
about = "electron element and isotopes as identities"
question = "The electron is an element named E with a negative count for cations; the tree names no rule for isotopes, deuterium D or tritium Tr except in Elements.cpp. Are custom element symbols and isotopes meant to be interchangeable identities with the standard elements?"
why_it_matters = "The model's element entities hold neither isotopes nor the electron, so species containing them need an explicit identity decision."

[[question]]
about = "standard-concentration-basis value solvent_volume"
question = "A test fixture writes solvent_volume, which is not among unity, species-molar-volume and solvent-molar-volume; does the code accept it (the lookup at IdealSolidSolnPhase.cpp line 412 is case-insensitive equality on three names) or is the fixture an error test?"
why_it_matters = "Undocumented spellings must not be imported as vocabulary members."
