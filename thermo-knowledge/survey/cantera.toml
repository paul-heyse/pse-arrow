# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "internal unit system and amount of substance"
locator = "doc/sphinx/yaml/general.md (Units); src/base/Units.cpp lines 399-425"
statement = "Cantera works internally in SI with the kilomole: amounts in kmol, molar properties per kmol (J/kmol, J/kmol/K), concentrations in kmol/m^3 for bulk phases, kmol/m^2 for surfaces and kmol/m for edges, activation energy in J/kmol. Input values in other units are converted at load time using the nearest units mapping."
scope = "all numeric inputs and every internal property"

[[convention]]
name = "physical constants"
locator = "include/cantera/base/ct_defs.h lines 80-131; include/cantera/base/Units.h; src/base/Units.cpp lines 25-90"
statement = "Avogadro 6.02214076e26 per kmol, Boltzmann 1.380649e-23 J/K, GasConstant = Avogadro times Boltzmann (8314.46261815324 J/kmol/K, the 2019 exact-SI value), OneAtm 101325 Pa, OneBar 1e5 Pa, electron charge 1.602176634e-19 C, electron mass 9.1093837015e-31 kg; the calorie is 4.184 J (thermochemical) in both the unit table and GasConst_cal_mol_K = R/4184. One constant is used everywhere; data fitted with another R are not corrected."
scope = "every conversion between dimensionless polynomials and dimensional properties (NASA7, NASA9, piecewise-Gibbs dimensionless data, Shomate via its own units)"

[[convention]]
name = "activation energy units"
locator = "doc/sphinx/yaml/general.md (Units, last paragraph); src/base/Units.cpp convertActivationEnergy (line 674)"
statement = "An activation energy may be given as an energy per quantity (J/kmol, cal/mol), a bare energy (eV, multiplied by the Avogadro constant) or a temperature (K, multiplied by the gas constant, Units.cpp line 682); the default follows the energy and quantity defaults unless activation-energy is set. The prose in general.md says temperature-unit values are converted 'by dividing by the gas constant', which contradicts the code (documentation error, not a data difference)."
scope = "Ea, Ea0, w, Ea-gas, Ea-electron, E in coverage dependencies"

[[convention]]
name = "reference state versus standard state"
locator = "doc/sphinx/reference/thermo/species-thermo.md (Models for Species Standard State, caution box); src/thermo/MultiSpeciesThermo.cpp lines 31-38"
statement = "The documentation states that Cantera says reference-state properties for those evaluated at the species' reference pressure p0 (a function of T only) and standard-state properties for those evaluated at the mixture's current pressure with the standard-state composition. The reference pressure defaults to 1 atm (setupSpeciesThermo), is not fixed by Cantera, and must be the same for every species of a phase within 1e-6 Pa (MultiSpeciesThermo::install)."
scope = "species thermo models, PDSS models and every phase model"

[[convention]]
name = "standard state by phase family"
locator = "include/cantera/thermo/MolalityVPSSTP.h lines 60-140; MixtureFugacityTP.h line ~430; MargulesVPSSTP.h; SurfPhase.cpp line 120; IdealGasPhase.cpp"
statement = "Ideal gas: pure species as ideal gas at p0, activity is the mole fraction times P/p0. Mixture-fugacity phases (Redlich-Kwong, Peng-Robinson): standard state is an ideal gas at the solution temperature and pressure. Molality phases (Debye-Huckel, HMW, ideal-molal-solution): solutes at unit molality (infinite dilution reference), solvent as the pure liquid, chemical potential mu_k = mu0_k + RT ln(gamma_k m_k/m0). Margules and Redlich-Kister: symmetric pure-component standard states at the solution T and P. Surfaces: standard concentration is site density divided by the species' site occupancy."
scope = "phase models as named"

[[convention]]
name = "enthalpy and entropy datum"
locator = "doc/sphinx/reference/thermo/species-thermo.md (NASA 7, NASA 9); src/thermo/PDSS_HKFT.h lines 200-255; src/thermo/PureFluidPhase.cpp lines 20-46"
statement = "No global datum is declared. For polynomial species data the enthalpy constant (a5 in NASA7, a7 in NASA9) carries whatever datum the source used, which for the NASA libraries is formation from the elements at 298.15 K (inferred from the library origin; the files state none); constant-cp h0 defaults to 0; HKFT data are referenced to Tr = 298.15 K, Pr = 1 atm with a Gibbs energy of formation converted to an internal chemical potential using the element entropies of element-standard-entropies.yaml; a tpx pure fluid is re-anchored at run time so that its enthalpy and entropy at 298.15 K equal those of the species thermo of the phase's species. No energy reference or entropy datum name is recorded anywhere."
scope = "all species and phase enthalpies and entropies"

[[convention]]
name = "temperature scale"
locator = "whole tree (keyword search in src, include, data, doc for ITS-90, IPTS and temperature scale)"
statement = "not stated: the hits are about unit scale (Units.cpp accepts C as a temperature difference-preserving unit) and not about a practical temperature scale such as ITS-90."
scope = "every temperature field"

[[convention]]
name = "composition bases and solvent designation"
locator = "doc/sphinx/yaml/phases.md (Setting the state); include/cantera/thermo/MolalityVPSSTP.h lines 70-110"
statement = "State composition may be mass fractions (Y), mole fractions (X), coverages (surface phases) or molalities (molality phases); values are normalised where needed. Molality m_i = n_i / (M_0/1000 n_0) in gmol/kg with the solvent as the first species of the phase. Cantera stores intensive state only (temperature, mass density, mass fractions by default)."
scope = "phase state, activity models, equilibrium inputs"

[[convention]]
name = "activity convention and pH scale"
locator = "include/cantera/thermo/ThermoPhase.h lines 136-138 (cAC_CONVENTION_MOLAR 0, cAC_CONVENTION_MOLALITY 1); MolalityVPSSTP.h lines 26-69 and 258; src/thermo/MolalityVPSSTP.cpp line 31"
statement = "Activities are molar-based by default and molality-based for classes derived from MolalityVPSSTP. Two scales exist for single-ion activity coefficients: PHSCALE_PITZER (0, internal; cation and anion of one salt have equal coefficients) and PHSCALE_NBS (1, Bates-Guggenheim with ln gamma_Cl = -A_phi sqrt(I)/(1 + 1.5 sqrt(I))). The scale is set through setpHScale in the API; no YAML key selects it (no pH string in the YAML parsing of src/thermo; inferred)."
scope = "Debye-Huckel, HMW and other molality phases"

[[convention]]
name = "rate-constant units"
locator = "src/kinetics/Reaction.cpp calculateRateCoeffUnits (line 576); src/thermo/ThermoPhase.cpp standardConcentrationUnits (line 64)"
statement = "The unit of a forward rate constant is computed, not stored: standard concentration units (kmol per m^(nDim) of the reactant's phase) raised to (1 - total order) per second, where the order sums the reactants' stoichiometric coefficients or explicit orders (orders entries replace them), and a mass-action third body adds one more concentration power. Internal values are SI per kmol; files use the units mapping (usually cm, mol, s)."
scope = "A of elementary, three-body, falloff (low limit carries one extra power), PLOG, interface and sticking rates"

[[convention]]
name = "reverse rates and thermodynamic consistency"
locator = "src/kinetics/BulkKinetics.cpp getRevRateConstants (line 177)"
statement = "A reversible reaction (<=> or =) has its reverse rate constant computed as the forward constant divided by the equilibrium constant from the species standard-state Gibbs energies; an irreversible reaction (=>) has none; explicit reverse rates are written as separate irreversible reactions (test/data/explicit-reverse-rate.yaml)."
scope = "all bulk and interface reactions"

[[convention]]
name = "charge and the electron element"
locator = "src/thermo/Species.cpp line 126; src/thermo/Elements.cpp (electron weight); doc in data files"
statement = "Charge is carried by the pseudo-element E in species composition: charge = -count(E) (a cation has a negative E count); the element E has the mass of the electron (ElectronMass times Avogadro), so species molecular weights include electron mass; Cantera has no separate charge attribute in the file."
scope = "all charged species, electrochemical reactions, plasma phases"

[[convention]]
name = "temperature limits and interval ordering"
locator = "src/thermo/MultiSpeciesThermo.cpp lines 48-79; species.md (NASA7 data paragraph)"
statement = "A phase's valid temperature range is the intersection of its species ranges. Polynomial intervals are listed in ascending temperature order in YAML (the opposite of Chemkin); the converter reorders. Evaluation picks a polynomial by the midpoint or lower bounds only (NasaPoly2.h lines 107-116), so outside the stated range the end polynomial is extrapolated; no range check was found in the species evaluation path (inferred from the search of ThermoPhase.cpp, Phase.cpp, MultiSpeciesThermo.cpp)."
scope = "species thermo, phases"

[[convention]]
name = "transport parameter units and basis"
locator = "doc/sphinx/yaml/species.md (Species transport models)"
statement = "Species transport parameters are an exception to SI: collision diameter in Angstrom, well depth in K, dipole in Debye, polarizability in Angstrom^3, dispersion and quadrupole polarizability in Angstrom^5; 'No conversions are supported.' Mixture properties are returned in SI."
scope = "gas transport blocks"

[[convention]]
name = "atomic weights"
locator = "src/thermo/Elements.cpp lines 15-62"
statement = "Standard atomic weights follow the CIAAW 2017 table (conventional weights where a range is published, -1 for elements with no stable isotope); named isotopes from the AME2016 mass evaluation (D, Tr) and the electron. Units kg/kmol."
scope = "molecular weights derived from composition"

