# ---------------------------------------------------------------------------
# CONSTRUCTS: document, units, phases, elements
# ---------------------------------------------------------------------------

[[construct]]
name = "YAML input document (sections)"
locator = "doc/sphinx/yaml/general.md (Sections); src/base/AnyMap.cpp AnyMap::fromYamlFile; src/thermo/ThermoFactory.cpp setupPhase"
meaning = "One file is a mapping of named sections, each a list of entries of one kind. The names phases, species, elements and reactions are defaults; any other section name is legal and is addressed by name from a phase."
subject = "A file: keyed by path. Sections are keyed by their name; entries inside a section are keyed by name (phases, species), symbol (elements) or position (reactions)."
fields = [
  { name = "phases", meaning = "list of phase entries", unit = "not applicable", shape = "list", role = "input" },
  { name = "species", meaning = "default species section", unit = "not applicable", shape = "list", role = "input" },
  { name = "reactions", meaning = "default reaction section; other names such as gas-reactions are chosen by the author", unit = "not applicable", shape = "list", role = "input" },
  { name = "elements", meaning = "custom or isotope element entries", unit = "not applicable", shape = "list", role = "input" },
  { name = "units", meaning = "default unit mapping for the whole file (see construct 'units mapping')", unit = "not applicable", shape = "table", role = "input" },
  { name = "description", meaning = "free text; 57 of 113 files carry one", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "generator", meaning = "converter that produced the file (cti2yaml, ck2yaml, ctml2yaml, lxcat2yaml, YamlWriter)", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "cantera-version", meaning = "version of the writer or converter", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "date", meaning = "time of conversion", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "input-files", meaning = "list of the converter's source files", unit = "not applicable", shape = "list", role = "metadata" },
  { name = "source", meaning = "citation text, present in critical-properties.yaml and element-standard-entropies.yaml", unit = "not applicable", shape = "scalar", role = "metadata" },
]
origin = "generated (70 of 113 files by a converter whose version is recorded in cantera-version: cti2yaml 33 of which 3 also say manual edits or additions, ctml2yaml 24 of which 2 say manual additions, ck2yaml 12, lxcat2yaml 1 with manual edits; counted over the generator field; the other 43 files are authored)"
conventions = "Section names are free text except the four defaults; a phase that omits species takes every entry of the section named species."
absence = "A file without a phases section is a pure data library (nasa_gas.yaml, critical-properties.yaml); an absent units mapping means Cantera defaults (SI with kmol)."
validity = "not stated"
provenance = "description, generator, cantera-version, date and input-files fields; no DOI or citation key structure, and 57 of 113 files have a description."
count = "113 files"
example = "data/gri30.yaml#/ (top level)"
candidate = "chemical_system plus parameterization plus convention_set (one database file), with software_release or source for the converter"
precision = "close"
loss = "The file mixes identity, parameters and conventions; the units default and the cross-file include graph must be resolved at import and then disappear; free section names carry author grouping that has no target."

[[construct]]
name = "units mapping"
locator = "doc/sphinx/yaml/general.md (Units); src/base/Units.cpp UnitSystem::setDefaults (line 429) and UnitSystem::defaults (line 399)"
meaning = "Declares default units for a whole file, a list or a mapping, and lets a single value carry its own unit as a string suffix."
subject = "A scope: the file, or the YAML list or mapping that contains the units key (a units entry inside a list must be its first item)."
fields = [
  { name = "length", meaning = "default length unit", unit = "unit string such as cm", shape = "enum", role = "input" },
  { name = "time", meaning = "default time unit", unit = "unit string such as s", shape = "enum", role = "input" },
  { name = "mass", meaning = "default mass unit", unit = "unit string such as g", shape = "enum", role = "input" },
  { name = "quantity", meaning = "default amount unit (mol, kmol, molec)", unit = "unit string", shape = "enum", role = "input" },
  { name = "pressure", meaning = "default pressure unit used when a conversion target is written as Pa", unit = "unit string such as atm", shape = "enum", role = "input" },
  { name = "energy", meaning = "default energy unit", unit = "unit string such as J", shape = "enum", role = "input" },
  { name = "activation-energy", meaning = "default unit of activation energies (energy per quantity, a temperature, or a bare energy)", unit = "unit string such as cal/mol or K", shape = "enum", role = "input" },
  { name = "temperature", meaning = "temperature scale name (K or C); C is accepted for the scale unit", unit = "unit string", shape = "enum", role = "input" },
]
origin = "authored (or written by a converter from the source file's own unit line)"
conventions = "Internal unit system is SI with the kilomole (quantity kmol, activation energy J/kmol); activation energy defaults to energy per quantity unless given. A value is converted with the innermost applicable mapping, then outer mappings, then the defaults. Temperature-unit activation energies are divided by the gas constant rule stated in general.md; bare energies such as eV are multiplied by the Avogadro constant."
absence = "An absent key means the Cantera default for that dimension; the source does not distinguish an absent key from a key set to the default."
validity = "not applicable"
provenance = "not stated"
count = "21 of 33 top-level data and example files declare units: length is cm in all 21, time s in 9, quantity mol in 19 and molec in 2, activation-energy cal/mol in 14, J/mol 2, kJ/mol 2, K 2, kcal/mol 1; 36 of 80 test files; per-value string suffixes occur only in test fixtures (8 rate-constant entries with A as a string)"
example = "data/gri30.yaml#/units"
candidate = "none: a unit declaration is resolved at import to the storage units of quantity types"
precision = "unmapped"
loss = "Scope-inherited default units and in-string suffixes have no counterpart; the importer must convert every number to storage units and drop the mapping, and a rate constant's unit depends on the reaction order (see convention 'rate-constant units')."

