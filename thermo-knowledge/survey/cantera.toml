# SELECTION RULES
# ---------------------------------------------------------------------------

[[selection]]
name = "species data by including file"
locator = "src/thermo/ThermoFactory.cpp setupPhase lines 218-300 (addSpecies at line 183)"
rule = "A phase takes each species from the section and file its species list names, in list order; there is no precedence among files. The same species name occurs in several files with different parameters: across data/*.yaml 1305 distinct names carry thermo, 78 of them occur in more than one entry and 69 of those differ in their thermo block (example H2 in 8 files)."
scope = "species thermo, eos, transport, composition"
documented = "yes: phases.md describes the include forms; it says nothing about conflicting definitions or a preferred source"

[[selection]]
name = "real-gas parameter source"
locator = "src/thermo/RedlichKwongMFTP.cpp initThermo line 360; src/thermo/PengRobinson.cpp initThermo line 326"
rule = "Per species: (1) a and b (and acentric-factor for PR) in an equation-of-state block whose model name matches; (2) else critical-parameters in the species entry, from which a and b are computed; (3) else the record of the same name (upper-cased) in critical-properties.yaml; (4) else an error. binary-a entries are read in step 1 only."
scope = "Redlich-Kwong and Peng-Robinson species parameters"
documented = "partly: critical-properties.yaml's own description states the fallback; species.md lists the blocks without the order"

[[selection]]
name = "standard-state model per species"
locator = "src/thermo/ThermoFactory.cpp lines 302-335; StoichSubstance.cpp line 126; IdealSolidSolnPhase.cpp line 309"
rule = "For VPSS phases the loader walks the species' equation-of-state list and uses the first entry whose model is a registered PDSS name; for other phases that read an eos (ideal-condensed, fixed-stoichiometry, lattice) the code picks the map with model constant-volume; for Redlich-Kwong and Peng-Robinson it picks the map with that model name. A species can therefore carry several eos maps for different phase models."
scope = "species equation-of-state blocks"
documented = "partly: species.md says the block is a mapping or a list of mappings and does not state the picking rules"

[[selection]]
name = "polynomial interval"
locator = "include/cantera/thermo/NasaPoly2.h line 107; src/thermo/Nasa9PolyMultiTempRegion.cpp lines 116-127"
rule = "NASA7: the low polynomial for T <= Tmid, else the high one; one-range data are duplicated. NASA9: the region whose lower bound is the largest one not exceeding T (a value equal to a bound belongs to the upper region). Outside the overall range the end polynomial is used."
scope = "NASA7 and NASA9 evaluation"
documented = "no: the boundary rule is code only"

[[selection]]
name = "equilibrium solver order"
locator = "src/thermo/ThermoPhase.cpp equilibrate (line 1210); src/equil/MultiPhase.cpp equilibrate (line 644)"
rule = "ThermoPhase::equilibrate with solver auto tries ChemEquil (element potential) first, restores the state on failure, then builds a single-phase MultiPhase and tries VCS and then the Gibbs solver; MultiPhase::equilibrate with auto tries VCS then the Gibbs solver (MultiPhaseEquil); a named solver (element_potential, vcs, gibbs) is used alone and its failure is raised."
scope = "equilibrate calls"
documented = "yes: ThermoPhase.h describes the four solver names and the auto order"

[[selection]]
name = "reaction type resolution"
locator = "src/kinetics/Reaction.cpp lines 93-200; doc/sphinx/yaml/reactions.md (type)"
rule = "type defaults to elementary (Arrhenius); a reaction containing M or with one species on both sides and total coefficient three is a three-body reaction; on an interface phase rate-constant gives interface-Arrhenius and sticking-coefficient gives sticking-Arrhenius, Blowers-Masel becomes the interface or sticking variant; falloff and chemically-activated pick Lindemann, Troe, SRI or Tsang by which of the keys Troe, SRI, Tsang is present."
scope = "reaction entries"
documented = "yes"

[[selection]]
name = "file and section lookup path"
locator = "doc/sphinx/yaml/phases.md (elements, species); src/base/application.cpp findInputFile (line 313)"
rule = "A relative file path in a section reference is searched first in the directory of the referring file and then along the Cantera data path."
scope = "section references, critical-properties.yaml lookup"
documented = "yes"

[[selection]]
name = "acentric factor precedence"
locator = "doc/sphinx/yaml/species.md (Gas transport, acentric-factor)"
rule = "When an acentric factor appears both in the gas transport block and in critical-parameters, the critical-parameters value supersedes the transport one."
scope = "high-pressure transport models"
documented = "yes (stated in species.md; not confirmed in code)"

[[selection]]
name = "explicit third-body duplicates"
locator = "doc/sphinx/yaml/phases.md (explicit-third-body-duplicates)"
rule = "A reaction with an explicit collider that duplicates the generic-M reaction is handled by the phase option warn (default), error, mark-duplicate or modify-efficiency."
scope = "three-body reactions with explicit colliders"
documented = "yes"

