# ---------------------------------------------------------------------------

[[selection]]
name = "departure model per pair"
locator = "AGA8CODE/C/GERG2008.cpp lines 1228-1254"
rule = "mNumb(i,j) names the departure model of a pair: 1 to 7 pair-specific, 10 the generalised function, minus one none; every pair not listed gets minus one by the initialisation loop."
scope = "binary departure contribution of GERG-2008"
documented = "yes in comments (model numbers for excess functions, 10 is for generalized equation); the assignment of models to pairs is not documented beyond the code"

[[selection]]
name = "binary parameter default"
locator = "AGA8CODE/C/Detail.cpp lines 547-560 (initialisation of Eij, Gij, Kij, Uij to 1)"
rule = "A pair without an assigned value takes 1 for each of the four DETAIL binary matrices; nothing is refused."
scope = "DETAIL binary parameters"
documented = "not stated in words; visible from the initialisation loop"

[[selection]]
name = "density root by phase flag"
locator = "AGA8CODE/C/GERG2008.cpp lines 155-276 (DensityGERG); Detail.cpp lines 145-208; Gross.cpp lines 140-208"
rule = "GERG-2008: iFlag 0 gives the gas-phase root without checks, 1 adds checks for possible two-phase states, 2 searches the liquid root; a negative density on input is used as an initial liquid guess. DETAIL and GROSS have no flag and return the ideal-gas density with an error code on non-convergence."
scope = "state construction from (T, P, x) for one phase"
documented = "yes (header comments of DensityGERG); the routine states that no phase boundary is located and a two-phase input returns a metastable state"

[[selection]]
name = "GROSS characterisation method"
locator = "AGA8CODE/C/Gross.cpp lines 359-467"
rule = "Method 1 is used when the volumetric heating value, relative density and CO2 fraction are known; Method 2 when relative density and the N2 and CO2 fractions are known; both iterate Z up to 20 times with a 1e-7 tolerance."
scope = "GROSS equivalent-hydrocarbon definition"
documented = "yes (routine header comments)"

