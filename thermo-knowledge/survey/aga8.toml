# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "two reference values for d2P/dD2 of GERG-2008"
question = "GERG2008.cpp and Rust gerg_demo.rs print a reference of 1130.481239114938 while GERG2008_test_01.cpp and Rust gerg-tests.rs check 1129.526655214841 for the same state. Which is the value the current code produces, and why do the files disagree?"
why_it_matters = "A verification dataset built from these files would contain two conflicting expected values for one point; the record must carry the conflict, not choose silently."

[[question]]
about = "verbatim status of stored coefficients"
question = "The setup routines say some values are modified for speed but do not list them. The survey identifies, from the code, pre-combined n0, gvij, gtij, bvij, btij, cijk, eijk, gijk, Bsnij2, Kij5, Uij5, Gij5; is that list complete, and which numbers are verbatim published coefficients (noik, doik, toik, coik, nijk, dijk, tijk appear untouched)?"
why_it_matters = "A knowledge base that stores published parameters must not store a pre-combined number under the name of the published one; equivalence assessments between this source and any source that stores the published form depend on it."

[[question]]
about = "units of the DETAIL characterisation and binary parameters"
question = "No unit or dimension statement accompanies Ei, Ki, Gi, Qi, Fi, Si, Wi, an, un or the binary matrices; only the formulas (powers of T, fifth powers of K and E) hint at them."
why_it_matters = "Dimensioned slots cannot be typed without inference; the model requires units to be stated or explicitly unknown."

[[question]]
about = "origin and version of the equations"
question = "Which publication and edition are the DETAIL and GROSS tables taken from (header gives no citation; Tables.xls mentions the 1994 publication and ISO 20765), and how do the versions 2.0 and 2.01 and the beta-testing notices relate to a released standard?"
why_it_matters = "Provenance and the qualification basis (verification tables) depend on the edition."

[[question]]
about = "reference state of enthalpy and entropy"
question = "The code computes zero enthalpy and entropy at 298.15 K and 101.325 kPa only nearly (published n0(1), n0(2)) and contains an unexecuted exact alternative; which one defines the reference state of the standard?"
why_it_matters = "The energy_reference record must state the datum and its numerical tolerance; different implementations of the same equation differ at the level of these constants."

[[question]]
about = "Fortran comment on the exponential density term"
question = "Fortran DETAIL.FOR states that the c_n factor is not included since it is 1 when kn is not equal to 1 and 0 otherwise; the C++ comment says kn not equal to 0, and the code multiplies by exp(-D^kn) with kn = 0 giving a factor of 1 while terms with kn equal to 1 exist (terms 29, 30 and 54). Which comment is meant?"
why_it_matters = "The comment is the only statement of the meaning of kn = 0; the model needs a correct rule for the absence of the exponential factor."

[[question]]
about = "Rust departure models 8 and 9"
question = "The Rust crate sets KPOLIJ and KEXPIJ entries (6 and 6) for models 8 and 9 with no coefficients and no pair referencing them, while the C++ code leaves them unset. Are these vestiges of pairs that were planned for GERG-2008?"
why_it_matters = "Indicates whether departure pairs exist in some other edition that the knowledge base should not silently lose."

[[question]]
about = "workbook values and REFPROP"
question = "The saturation states in Test Data.xls come from REFPROP 9.1 and the workbook cells are formulas calling the VBA modules; Deviation Calculator.xls requires REFPROP. Which numbers are frozen cached values and which are recomputed on opening, and is the VBA the same version as the C++ code? The natural-gas points carry gas numbers 2 to 202 (201 distinct values) against 200 composition rows, so the number looks like a spreadsheet row index with one row unused or missing."
why_it_matters = "The workbooks are a potential independent verification set only if their cached values are known to come from the stated code version."

[[question]]
about = "GERG-2008 coefficients carried by other sources"
question = "The setup constants here are combined and reordered relative to the published tables (n3 reduced by one, isobutane before n-butane, pre-multiplied reducing pairs). How should the equivalence of this carrier with a carrier that stores the published form (for example a multifluid JSON) be assessed without losing the orientation and reciprocal-beta handling?"
why_it_matters = "Two carriers of one published parameter set must map to one parameter_set with an equivalence assessment, not to two sets."
