source = "aga8"
pin = "3bdb9ab8ff31"
surveyed = "2026-09-30"
summary = "The NIST AGA8 repository contributes the complete constant tables of three natural-gas equations over one fixed list of 21 components (GERG-2008: pure-fluid residual and ideal-gas terms, 210 binary reducing-parameter pairs, 15 departure-function pairs; AGA8 DETAIL: 58 equation terms, 7 characterisation parameters per component, four binary-parameter matrices; AGA8 GROSS: virial correlations and heating values), each as setup code in C++, Fortran, Visual Basic and Rust, plus Excel workbooks of test points; several stored numbers are pre-combined by the setup routines rather than published coefficients. It bundles no identifiers beyond positional index and comment names, no uncertainty or validity statements in machine-readable form, and no citation per table."

