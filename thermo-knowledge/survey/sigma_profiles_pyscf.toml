# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "scientific validity of the profile set"
question = "Is the set validated beyond the author's own claims? The bytes hold no independent check: the paper is not cited ('TBD'), validation numbers are only in the README text (gamma infinity RMSE 0.898 against 0.961, 12 VLE systems, 22 SLE pairs) and come from NIST ThermoData Engine data that is not distributed, and a comparison with the DMol3 reference profiles (median 1.37 A^2) is quoted but not reproducible from the deposit."
why_it_matters = "This is a new single-author dataset; a model built on it would carry unverified derived data, so the derivation and qualification records must mark its level of evidence."

[[question]]
about = "which profile to use for a structure with several CIDs"
question = "For the 19,948 InChIKeys shared by several CIDs the profiles differ through independent PM6 geometries (area spread up to 10 percent); does the source intend the profiles to be treated as conformers, duplicates or competing values?"
why_it_matters = "A canonical species would receive several competing sigma profiles and a selection rule is needed; the source gives none."

[[question]]
about = "refit constants and the dispersion term"
question = "The five refitted constants were fitted with the dispersion term included (get_lngamma) on CHNO pairs only, while the dispersion energy is undefined for all S and P molecules and the dispersion constants were not refitted. Are the constants intended for molecules with S, P, F or Cl, and for COSMO-SAC-2010 without the dispersion term?"
why_it_matters = "The dependency between the profiles, the refitted constants and the model variant must state which combinations the fit covers."

[[question]]
about = "pairing with the NIST implementation"
question = "The published set was produced with commit 21dd92b of the NIST repository, but the pinned NIST tree of source cosmosac_nist is commit 1b82456b. Do the parser, the COSMO-SAC-2010 constants and the to_sigma conventions agree between the two commits?"
why_it_matters = "The profiles are consumed with the NIST model constants; a mismatch would invalidate the pairing the conventions record."

[[question]]
about = "units of the Parquet columns"
question = "The Parquet files carry no unit metadata. Are area_A2, volume_A3, p_000..p_152 (A^2) and disp_e_kB (K) exactly as in DATA_DICT.md, including the float32 rounding of the profile values?"
why_it_matters = "Values are stored as float32 in the main file; the source states units only through column suffixes and the dictionary."
