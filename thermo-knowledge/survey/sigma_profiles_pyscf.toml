# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "profile grid, blocks and total"
locator = "DATA_DICT.md section 3; sigma_profiles_main.parquet columns p_000 to p_152"
statement = "51 bins from -0.025 to 0.025 e/A^2 in steps of 0.001, repeated for each of three blocks in the order NHB, OH, OT; psigmaA is an area in A^2, so the total profile p(sigma)A is the bin-wise sum of the three blocks and the sum over all bins is the cavity area."
scope = "sigma profile row"

[[convention]]
name = "averaging radius and decay"
locator = "DATA_DICT.md section 1 and 3; Parquet columns r_av_A and f_decay"
statement = "Hsieh-2010 averaging with radius 1.5191 A and decay factor 3.57 for every molecule, and hydrogen-bond cutoff 0.0084 e/A^2; the values are constant over the dataset."
scope = "sigma profile row"

[[convention]]
name = "refitted constants replace the Hsieh-2010 defaults"
locator = "DATA_DICT.md section 7; README.md 'Use the refitted parameters'; smiles_to_sigma.py"
statement = "Profiles from this pipeline must be used with the five refitted constants and not with the Hsieh-2010 defaults; the constants are not transferable to DMol3 or other generators without re-evaluation, because the absolute profile mass and cavity volume differ by a few percent between generators. The other COSMO-SAC-2010 constants are not refitted and stay at the NIST defaults."
scope = "sigma profile row; sequential refit parameters"

[[convention]]
name = "level of theory and geometry"
locator = "DATA_DICT.md section 1; README.md; process_chunk.py"
statement = "PySCF single point at BP86/def2-SVP with COSMO at infinite dielectric constant (conductor limit), Klamt radii at scale 1.0, density fitting; geometries are PubChemQC PM6 minima used as given (no DFT reoptimisation); the integrity file names the same level with the word Klamt cavity."
scope = "all profiles"

[[convention]]
name = "absent values are empty strings or null"
locator = "build_public_sigma_index.py; DATA_DICT.md section 6"
statement = "In the index an absent CAS, InChIKey or family is the empty string (no Parquet null); in the main file the placeholder text '?' is stored for name and cas and a missing dispersion energy is a Parquet null (the text files carry JSON null)."
scope = "index row; main row"

[[convention]]
name = "units"
locator = "DATA_DICT.md sections 3 and 4"
statement = "Areas in A^2, volumes in A^3, charge density in e/A^2, molecular weight in g/mol, dispersion energy over k_B in K, constants in kcal A^4/(mol e^2) (B_ES with an additional K^2); the Parquet files carry no unit metadata, so every unit comes from the data dictionary and column-name suffixes."
scope = "all constructs"

# ---------------------------------------------------------------------------
# SELECTIONS
# ---------------------------------------------------------------------------

[[selection]]
name = "input filter of the molecule set"
locator = "src/generation/filter_to_jsonl.py (condition before the output write)"
rule = "A PubChemQC record from the b3lyp_pm6 CHNOPSFCl subset is kept when heavy-atom count <= 25, molecular mass <= 250, charge 0 and multiplicity 1; 361,583 of the roughly 362,303 attempted molecules ended with a profile."
scope = "which molecules exist in the dataset"
documented = "yes in README.md and DATA_DICT.md (molecular weight up to about 250 g/mol)"

[[selection]]
name = "CAS number assignment"
locator = "src/generation/cas_to_cid.py lookup_one; build_master_index.py phase_d (groupby cid first)"
rule = "CAS numbers that occur in the NIST TDE gamma infinity, VLE, SLE, vapour pressure and melting data are looked up against PubChem's registry cross-reference; the first CID returned is taken as the primary CID, and the first hyphenated CAS per CID is kept."
scope = "the CAS column of the index"
documented = "not documented in DATA_DICT.md, which says only that CAS is empty when PubChem has no CAS for this CID; the CAS column is therefore a function of NIST dataset overlap, inferred from the two scripts"

[[selection]]
name = "chemical family label"
locator = "src/generation/build_master_index.py phase_e"
rule = "Patterns are tried in fixed priority; one match gives that name, several give the highest-priority name with a trailing '+', none gives 'other'; an unparseable SMILES gives an empty family in the public index."
scope = "Chemical_Family"
documented = "yes (DATA_DICT.md section 4)"

[[selection]]
name = "duplicate structures"
locator = "sigma_profile_index.parquet InChIKey column"
rule = "none: a structure that appears under several CIDs keeps every CID with its own profile; no deduplication, ranking or averaging rule exists in the source."
scope = "19,948 InChIKeys shared by two to 11 CIDs"
documented = "DATA_DICT.md mentions five CIDs of molecular hydrogen as an artefact of several CIDs pointing at one structure, but not the general duplication"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "DATA_DICT.md section 6 (five H2 entries) versus sigma_profile_index.parquet"
documented = "five PubChem CIDs for molecular hydrogen H2, identical structure under different CIDs"
actual = "the five rows (Heavy_Atoms 0) have SMILES '[H].[H]', which is two disconnected hydrogen atoms in the notation; the structure-level reading as a bonded molecule is not in the row"
consequence = "A species resolution from the SMILES or from an InChIKey would not yield H2; these rows need exclusion or a curated identity."

[[discrepancy]]
locator = "DATA_DICT.md section 3 ('disp. e/kB ... can be null for molecules without a tabulated value') and README.md (elements H, C, N, O, F, P, S and Cl are supported) versus the Parquet"
documented = "P and S molecules are inside the supported scope and a null dispersion energy is an occasional gap"
actual = "disp_e_kB is null in 74,094 of 361,583 rows (20.5 percent), and the null rows are exactly those whose formula contains S or P (joined index formulas to the main file: 74,094 rows with S or P, all null; no other row null)"
consequence = "The dispersion contribution of the COSMO-SAC-dsp model is undefined for every molecule with sulfur or phosphorus although the profiles exist."

[[discrepancy]]
locator = "src/generation/fix_sigma_nan.py docstring versus the NIST cCOSMO reader"
documented = "null dispersion energy is handled by cCOSMO (treated as default or zero)"
actual = "in the NIST reader pinned in source cosmosac_nist the two loaders differ: the Delaware loader turns null into NaN and DirectImport leaves it absent, read as 0.0 by the dispersion term; the refit scripts load with DirectImport"
consequence = "Whether a null dispersion energy acts as zero or as NaN depends on the loader; in this dataset a null never enters the refit because only CHNO pairs were used."

[[discrepancy]]
locator = "MANIFEST.md (pubchemqc_to_cosmo_bp86.py described as the PySCF BP86/def2-SVP COSMO driver) versus src/generation"
documented = "pubchemqc_to_cosmo_bp86.py is the COSMO driver with the dataset's settings"
actual = "that script sets no radii table and no density fitting; the Klamt radii, vdw_scale 1.0 and the --df switch are set in process_chunk.py, which imports only the .cosmo writer and geometry builder from the first script"
consequence = "The settings that define the profiles are spread over two scripts; a derivation record must cite process_chunk.py for the cavity."

[[discrepancy]]
locator = "src/generation/pubchemqc_to_cosmo_bp86.py lines 105-115 versus DMol3 .cosmo format"
documented = "DMol3-style .cosmo file compatible with the NIST parser"
actual = "input-block values that are not produced by PySCF are placeholders: 'Basic Grid Size' and 'Number of Segments' both equal the segment count, and the Non-Electrostatic Energy A and B are written as zero"
consequence = "A .cosmo file from this pipeline cannot be told apart from a DMol3 output by those lines; nothing in the .sigma profile depends on them."

[[discrepancy]]
locator = "README.md (Zenodo file table) versus DATA_DICT.md section 2 and the acquired Zenodo files"
documented = "the deposit contains .sigma files, an index CSV and Parquet and the parameters; DATA_DICT.md specifies the .sigma text format and the index but no Parquet column of the main file"
actual = "the acquired deposit has the main Parquet with snake_case columns (cid, area_A2, volume_A3, r_av_A, disp_flag, disp_e_kB, p_000..p_152) that differ from the .sigma header keys and from the index column names (CID, Vcosmo_A3, Acosmo_A2); only the README names the p_ layout"
consequence = "A mapping must take the main file's column meanings from the header keys of the text format by name correspondence, which the source does not state."

[[discrepancy]]
locator = "README.md Citation section versus its License section"
documented = "attribution requires citing the paper and the Zenodo deposit"
actual = "the paper citation reads 'TBD'"
consequence = "The primary publication for the refit and validation numbers cannot be recorded."

