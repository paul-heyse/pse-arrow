[[discrepancy]]
locator = "idaes/models/properties/general_helmholtz/components/parameters/h2o.json (eos.last_term_residual, eos.n, eos.a)"
documented = "the package and the wrapper Iapws95 are described as the IAPWS-95 property package for water and steam"
actual = "eos.n has 56 entries (keys \"1\" to \"56\") while d and t have 54, c has 44 (terms 8 to 51), and a, b, g, e have 3 (terms 52 to 54); last_term_residual is [7, 51, 54], and phi_residual_type02.py builds its three sums over exactly the ranges 1 to 7, 8 to 51 and 52 to 54 from that list, so the n values of terms 55 and 56 are not referenced by the tree-visible expression code (whether the compiled library reads them is not visible; the number of further parameters the two extra terms of IAPWS-95 would need is not present)"
consequence = "the tree-visible formulation evaluates 54 of the 56 coefficients n; a mapping of this file must not assume all 56 enter the equation"

[[discrepancy]]
locator = "idaes/models/properties/general_helmholtz/components/parameters/__init__.py (auto_register)"
documented = "the registry stores eos_ref, viscosity_ref, thermal_conductivity_ref and surface_tension_ref per component"
actual = "the reference variables are reset for every .json file in the loop but consumed after it, so every registered component receives the references of the last .json file listed; eos_ref is never passed to register_helmholtz_component; the viscosity block assigns to thermal_conductivity_ref, and each list-valued branch joins eos_ref instead of its own reference"
consequence = "eos_reference() of an auto-registered fluid returns None (the registry default) and the transport references are those of one arbitrary fluid or overwritten"

