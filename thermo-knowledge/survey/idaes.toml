]
format = "Python source: base (4 files), eos (8), pure (11), phase_equil (6), reactions (6), state_definitions (8), transport_properties (4), coolprop (3), examples (12 including the reactions example), each with an __init__.py"
files = 63
bytes = 923684
records = "63 non-test files, 24089 lines (counted with a line counter over .py files; 81 test files of 1741607 bytes are excluded from scope)"
reader = "the framework itself (Python imports; classes are located by name in a configuration dictionary: GenericParameterBlock and GenericReactionParameterBlock in base/generic_property.py and base/generic_reaction.py)"
read_by_source = "all"
notes = "The method libraries are classes with static methods build_parameters and return_expression; configuration values are the classes themselves (not names). The bundled examples are the only parameter sets."

