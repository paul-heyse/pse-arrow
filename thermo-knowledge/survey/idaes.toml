[[convention]]
name = "unit handling"
locator = "idaes/models/properties/modular_properties/base/generic_property.py:1108 and idaes/core/util/misc.py:72"
statement = "base_units holds the seven base quantities (the examples supply five); derived units follow from metadata; each parameter may be given as (value, unit) and is converted to the unit of the pyomo Var the library declares; a bare float is taken to be in base units; libraries convert temperature and pressure with pyunits.convert before evaluating (NIST: kK and bar; RPP3: cal and mmHg; Perrys: kmol); state_bounds 4-tuples carry units."
scope = "all parameters and state bounds"

[[convention]]
name = "gas constant"
locator = "idaes/core/util/constants.py and idaes/models/properties/modular_properties/eos/eos_base.py:36"
statement = "The EoS classes take the gas constant from a global Constants class (8.314462618 J/mol/K, written as the product of the Avogadro and Boltzmann constants) and convert it to base units; it is not a per-package parameter and cannot differ between parameter sets, unlike the IAPWS and CoolProp sources. RPP5 heat-capacity coefficients are multiplied by the same constant."
scope = "cubic, ideal, ENRTL and reaction forms"

[[convention]]
name = "energy and entropy reference state"
locator = "idaes/models/properties/modular_properties/eos/ideal.py, pure/RPP4.py, pure/NIST.py, base/generic_property.py:1054-1057"
statement = "pressure_ref and temperature_ref are required. Gas enthalpies integrate cp from temperature_ref and add a formation enthalpy when include_enthalpy_of_formation is true (default); gas entropies integrate cp/T from temperature_ref, add an entropy of formation at the reference state (always required for RPP3, RPP4, RPP5, Perrys and Constant) and, for a gas, the mixing term R ln(x P/pressure_ref); ideal liquids add (P - pressure_ref)/molar density to the enthalpy and no pressure term to the entropy. The cubic EoS refers both its liquid and vapor phases to the ideal-gas enthalpy and entropy slots and adds a departure function. The NIST library folds formation enthalpy into its Shomate constants and removes it when the switch is false. Formation enthalpy is not stored separately for ions in the eNRTL examples (they set no enthalpy slots)."
scope = "enthalpy and entropy of every phase"

[[convention]]
name = "standard states of the electrolyte model"
locator = "idaes/models/properties/modular_properties/eos/enrtl_reference_states.py:32-114"
statement = "ENRTL composition terms are evaluated at the actual composition and at a reference composition; the reference_state option chooses Symmetric (the reference composition contains only ions, in proportion to the actual ions: the fused-salt state, default) or Unsymmetric (the reference composition contains solvents and solutes, with ions set to a near-zero value: an infinite-dilution-type reference). The activity-coefficient scale is mole fraction; concentrations of true species are used (apparent species enter through dissociation_species)."
scope = "activity coefficients of electrolyte phases"

[[convention]]
name = "composition basis"
locator = "idaes/models/properties/modular_properties/base/utility.py:39-44 and 252-258"
statement = "State and phase compositions are mole fractions; true versus apparent species are chosen by StateIndex for electrolyte systems; reaction rates and equilibrium constants use ConcentrationForm (molarity, activity, molality, moleFraction, massFraction, partialPressure) and the unit of an equilibrium or rate constant is derived from the form and the sum of the reaction orders (for example a constant in mole-fraction form is dimensionless, in molarity form has units of concentration to the power of the order)."
scope = "reaction parameters, flows and compositions"

[[convention]]
name = "temperature scale"
locator = "idaes/models/properties/modular_properties/"
statement = "No temperature scale is stated anywhere in the modular framework; temperatures are absolute (K) through units."
scope = "all temperatures"

