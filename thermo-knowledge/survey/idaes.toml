source = "idaes"
pin = "84532d7f99a9"
surveyed = "2026-09-30"
summary = "idaes-pse 2.13.0 (commit 84532d7f99a9, the pinned reading copy external/idaes-pse/; clean-room source: structure and behaviour only) holds property data and property-model structure in two forms: the generic \"modular properties\" framework, in which a configuration dictionary selects, per component and per phase, pure-component method classes, an equation-of-state class, phase-equilibrium forms and a state definition, and supplies parameters in a parameter_data dictionary; and older dedicated packages (IAPWS-95 and other Helmholtz packages whose parameters sit in JSON and expression files behind a compiled library, an activity-coefficient VLE package, the saponification example). The framework bundles no parameter database: parameters are in the user configuration or in the bundled examples (which this record lists but does not copy) and the Helmholtz JSON files; the pure-component classes carry only correlation forms. Everything is Python code with no data files in the modular framework, so all \"records\" here are classes and configuration keys."

