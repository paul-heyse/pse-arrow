# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "provenance of the DFT kernel and the standard isotherms"
question = "Which DFT method, adsorbate and pore models produced DFT-N2-77K-carbon-slit.csv, and which publications or measurements are the two standard isotherms? Neither file nor the tree says."
why_it_matters = "Both are reference data that determine pore size results; a dataset or tabulated function record needs an origin and a citation."

[[question]]
about = "origin of the adsorbate and HK constants"
question = "Where do the 176 adsorbate property values and the three Horvath-Kawazoe parameter sets come from? The registry has no citation per value, and the critical constants look like CoolProp values copied into the file (inferred from the keys)."
why_it_matters = "Constants without an origin cannot carry attribution, and a duplicate of CoolProp values would be a second, unlinked source."

[[question]]
about = "meaning of the STP unit"
question = "Does cm3(STP) mean 273.15 K and 101325 Pa? The factor 4.461e-5 mol/cm3 is the only statement, and no text defines the standard conditions."
why_it_matters = "The most common non-SI loading unit of the ISODB and of instrument files converts to moles only through this definition."

[[question]]
about = "behaviour of the NIST reader for wt% and relative pressure"
question = "Does isotherm_from_json with fmt NIST really take wt% as g/g without scaling, and how does it treat the two ISODB isotherms with pressureUnits RELATIVE? The code raises for RELATIVE, but the wt% path was not executed."
why_it_matters = "Any mapping that follows the pyGAPS reading of ISODB units would inherit a factor error."

[[question]]
about = "units of model parameters and Material properties"
question = "Are the DA and DR characteristic energy and the ChemiPhysisorption activation energy in J/mol, and are Material density and molar mass in g/cm3 and g/mol? The code uses them with SI gas constant and gram and cubic-centimetre tables but states no units."
why_it_matters = "Parameter sets fitted by pyGAPS carry units only through the isotherm's unit fields and these implicit choices."
