source = "pygaps"
pin = "34279c1bd373"
surveyed = "2026-09-30"
summary = "pyGAPS v4.6.1 contributes Python data models for point and model isotherms with explicit pressure, loading and material basis and unit fields, parsers for AIF, JSON, CSV, Excel, SQLite and the NIST ISODB JSON, a registry of 176 adsorbates with physical properties, 18 isotherm equations with a least-squares fit, IAST mixture prediction, and characterisation procedures (BET and Langmuir area, t-plot, alpha-s, Dubinin plots, mesopore, micropore and DFT-kernel pore size distributions, isosteric enthalpy, Henry constants); it carries no measured isotherm data of its own beyond examples and two reference thickness curves, states outright that it does not distinguish excess from absolute adsorption, and converts between bases by calling CoolProp for adsorbate density and saturation pressure."

