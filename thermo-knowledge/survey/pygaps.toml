name = "loading basis and unit conversion machinery"
locator = "src/pygaps/units/converter_mode.py lines 37-425"
statement = "A conversion between loading bases needs adsorbate data: molar mass (mass and molar), gas density or gas molar density at the isotherm temperature (volume_gas), liquid density or liquid molar density (volume_liquid), all obtained from the adsorbate record or from CoolProp at the isotherm temperature; a conversion to or from percent or fraction needs the material basis and unit; a conversion between material bases needs the material density (mass and volume) or molar mass (mass and molar). Loading is per material quantity: loading_unit per material_unit. Conversions inside one basis use only the unit tables."
scope = "PointIsotherm.convert_loading, convert_material and every analysis that converts to a common basis"

[[convention]]
name = "relative pressure and saturation pressure"
locator = "src/pygaps/units/converter_mode.py lines 44-140; docs/manual/units.rst; src/pygaps/core/adsorbate.py lines 482-628"
statement = "Relative pressure is p divided by the saturation pressure of the adsorbate at the isotherm temperature, obtained from a thermodynamic backend (CoolProp by default, REFPROP on request); the relative% mode divides by 100; for a supercritical adsorbate a pseudo-saturation pressure (Dubinin) can be used; relative pressure has meaning only for sub-critical temperatures, per the manual."
scope = "pressure conversions, BET, Langmuir area, t-plot, alpha-s, DR and DA, pore size methods"

[[convention]]
name = "temperature"
locator = "src/pygaps/core/baseisotherm.py lines 79-87 and 260-275; src/pygaps/units/converter_mode.py line 400"
statement = "Temperature is stored in temperature_unit (K or degree Celsius, default K with a logged warning) and the temperature property always returns kelvin; methods that need a temperature (saturation pressure, DA and DR, ChemiPhysisorption, conversions) read the kelvin value."
scope = "all isotherms"

[[convention]]
name = "adsorption and desorption branches"
locator = "src/pygaps/core/pointisotherm.py lines 120-200; src/pygaps/utilities/math_utilities.py line 11"
statement = "Each point carries branch 0 (adsorption) or 1 (desorption). By default the branch is guessed: the point of maximum pressure ends adsorption and later points are desorption. Models are fitted to one branch (ads by default) and IAST uses one branch (ads by default)."
scope = "point and model isotherms, IAST, characterisation"

[[convention]]
name = "pressure treated as fugacity"
locator = "src/pygaps/core/modelisotherm.py docstring notes; src/pygaps/prediction/iast.py"
statement = "The documentation says L is uptake and P is pressure (fugacity technically); no fugacity coefficient is applied, so the pressure used in isotherm models and IAST is the pressure in the isotherm unit."
scope = "isotherm models, IAST"

# ---------------------------------------------------------------------------
# SELECTIONS
# ---------------------------------------------------------------------------

[[selection]]
name = "adsorbate, material and default unit resolution"
locator = "src/pygaps/core/baseisotherm.py lines 139-160, 229-258"
rule = "An adsorbate name is matched case-insensitively against the alias lists of the registry; a miss creates an unregistered adsorbate and disables the thermodynamic backend with a warning. A material name is looked up in the material list, and a miss creates a new material. Missing unit fields take the defaults (absolute pressure in bar, loading in mmol per g, kelvin) with a warning."
scope = "isotherm construction"
documented = "partly: the defaults are in the class docstring and the warnings; the silent creation of unknown materials is not"

[[selection]]
name = "model guessing"
locator = "src/pygaps/core/modelisotherm.py guess line 362; src/pygaps/modelling/__init__.py _GUESS_MODELS"
rule = "When several models are given or none is named, every model in the quick list (Henry, Langmuir, DSLangmuir, DR, Freundlich, Quadratic, BET, TemkinApprox, Toth, JensenSeaton) is fitted and the one with the lowest relative RMSE is kept; a fit that raises a calculation error is dropped from the attempts."
scope = "model choice"
documented = "yes (docstring of guess)"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "src/pygaps/characterisation/psd_kernel.py docstring lines 100-110 versus lines 148-156 and data/kernels/DFT-N2-77K-carbon-slit.csv"
documented = "the kernel file structure table has a first column headed Pressure(bar)"
actual = "the loader defaults kernel_units to relative pressure, mmol/g, and the shipped kernel's first column runs from 7.65E-07 to 0.997 (relative pressures)"
consequence = "A reader who took the documentation's pressure unit would mislabel the kernel axis."

[[discrepancy]]
locator = "src/pygaps/core/adsorbate.py line 10 (TODO comment) versus data/adsorbate_props.json"
documented = "adsorbate_props.json states p_critical in bar and rhomolar_critical in mol m^{-3}"
actual = "a code comment says units in the properties dictionary and those returned by CoolProp do not always match (for example p_critical); the property type descriptors carry a unit string per key but nothing checks them"
consequence = "A property value read from the registry and the same quantity from CoolProp may differ in unit."

[[discrepancy]]
locator = "src/pygaps/parsing/json.py lines 213-222"
documented = "the NIST reader treats the ISODB adsorptionUnits string as loading unit over material unit"
actual = "the string wt% is converted to loading and material units of g over g without scaling the values by 0.01, so percent values are read as mass ratios (by reading the code; not executed)"
consequence = "Isotherms entered as wt% from ISODB (3,313 in the pinned ISODB mirror) would be 100 times too large after import."

[[discrepancy]]
locator = "src/pygaps/units/converter_unit.py (_MASS_UNITS amu entry)"
documented = "_MASS_UNITS maps units to grams"
actual = "the amu entry is 1.66054e-27, which is the mass of an atomic mass unit in kilograms, while the others (mg 0.001, kg 1000) are in grams"
consequence = "A conversion from or to amu is off by a factor of 1000 by reading the tables; it is not used by any other code in the tree."

[[discrepancy]]
locator = "src/pygaps/modelling/henry.py (param_names) versus other models"
documented = "param_names is a tuple of parameter names in every other model"
actual = "Henry declares param_names as the string 'K' and param_default_bounds as a one-element tuple; iteration over the string yields the single character K"
consequence = "It works by coincidence of the single-letter name; a two-character parameter would break it."

