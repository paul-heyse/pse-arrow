# PAYLOADS
# ---------------------------------------------------------------------------

[[payload]]
paths = ["data/*.dat"]
format = "ChemSage DAT text (FactSage export format): free-form numbers and names in a fixed block order; phase and species names are read by fixed-width fields (phase name 25 characters, species name 26 characters, constituent names 25 characters, three per 75-character line); lines beginning '#' are comments inside the preamble and at the end of files"
files = 27
bytes = 975539
records = "27 files; 228 solution-phase entries and 263 stoichiometric phases declared in the headers (sums of header values). Solution-phase entries by model code: SUBL 83, QKTO 63, SUBLM 30, IDMX 19, SUBI 13, RKMP 8, RKMPM 7, SUBQ 2, SUBG 2, SUBM 1 (counted as lines equal to a code word, preceded by the phase name line). Per file (elements; solution-phase slots with per-slot species or pair counts, a 0 meaning no gas; stoichiometric phases; model codes): AlMg-Liang 2 el, 7 slots [4,2,4,2,16,2,2], 7 stoich, IDMX 1 RKMP 1 SUBL 2 RKMPM 3; CO 2 el, 1 slot [12], 4 stoich, IDMX 1; CaMnS 3 el, 8 slots [8,6,6,2,3,3,2,2], 5 stoich, IDMX 1 SUBI 2 SUBL 2 SUBLM 3; ClAlNa 3 el, 2 slots [6,18], 7 stoich, IDMX 1 SUBQ 1; CsI-Pham 2 el, 2 slots [6,3], 7 stoich, IDMX 1 RKMP 1; CsTe-1 2 el, 3 slots [14,3,2], 11 stoich, IDMX 1 SUBI 1 SUBLM 1; CsTe-2 2 el, 2 slots [0,3], 0 stoich, SUBI 1; CuFeC-Kang 3 el, 7 slots [0,6,6,4,4,4,4], 4 stoich, SUBG 2 SUBLM 4; FeMnCaS-1 4 el, 11 slots [8,9,9,3,4,2,2,4,3,2,3], 2 stoich, IDMX 1 SUBI 2 SUBL 4 SUBLM 4; FeMnCaS-2 4 el, 10 slots [8,9,3,4,2,2,4,3,2,3], 2 stoich, IDMX 1 SUBI 1 SUBL 4 SUBLM 4; FeTiVO 4 el, 5 slots [8,15,8,3,2], 21 stoich, IDMX 1 SUBQ 1 SUBL 2 QKTO 1; HO 2 el, 1 slot [9], 2 stoich, IDMX 1; MoPdRuRhTc-Kaye 5 el, 11 slots [6,5,5,2,2,5,5,5,5,5,5], 10 stoich, IDMX 1 QKTO 10; NobleMetals-Kaye 4 el, 9 slots [5,4,4,4,4,4,4,4,2], 8 stoich, IDMX 1 QKTO 8; PdRuTcMo 4 el, 42 slots (5 gas species then 41 QKTO slots of 2 or 4 species), 8 stoich, IDMX 1 QKTO 41; WAuArNeO-1 5 el, 2 slots [0,5], 5 stoich, RKMP 1; WAuArNeO-2 5 el, 3 slots [0,4,5], 5 stoich, RKMP 2; WAuArO-1 4 el, 2 slots [0,4], 4 stoich, RKMP 1; WAuArO-2 4 el, 2 slots [0,4], 4 stoich, RKMP 1; ZIRC-noSUBI 9 el, 22 slots, 28 stoich, IDMX 1 SUBLM 3 SUBL 16 RKMPM 1 RKMP 1; ZIRC-test64 9 el, 2 slots [29,21], 0 stoich, IDMX 1 SUBLM 1; ZIRC_no_liq, ZIRC_no_liq_mod1 and ZIRC_no_liq_mod2 each 9 el, 23 slots, 28 stoich, IDMX 1 SUBI 2 SUBLM 3 SUBL 16 RKMPM 1; ZrFeKClNaFOLi 8 el, 2 slots [0,15], 16 stoich, SUBM 1; ZrH-Dupin 2 el, 7 slots [5,2,2,2,2,2,2], 11 stoich, IDMX 1 SUBLM 1 SUBL 5; ternaryMiscibility-Kaye 4 el, 4 slots [0,4,4,4], 8 stoich, QKTO 3."
reader = "Thermochimica's own ParseCSDataFile (src/parser/ParseCSDataFile.f90) calling ParseCSHeader, ParseCSDataBlock and, per solution model, ParseCSDataBlock{QKTO,RKMP,SUBL,SUBG,SUBI,SUBM}; pycalphad's cs_dat.py reads a subset of the same format (see the pycalphad survey); a plain whitespace tokenizer reads the headers"
read_by_source = "all"
notes = "All 27 files have the same Gibbs-term index line '6 1 2 3 4 5 6' twice (Gibbs and excess layout). A phase name may repeat within a file to describe a miscibility gap (for example PdRuTcMo: 41 QKTO entries). Three files (WAuArO-1, WAuArO-2, WAuArNeO-2) have a solution phase named Delete. 20 stoichiometric entries in 4 files (CaMnS 5, FeMnCaS-1 2, FeMnCaS-2 2, CsTe-1 11) carry a label of the form 'NAME = COMPOUND PHASE = 1.0000' instead of a suffix such as (s); 18 names in ZrH-Dupin and similar files end (s2) to (s8). Species lines ending with a '#' token mark dummy species; 27 files contain lines with '#' (comment banners and dummy species). The title line may begin with '#' or 'System'."

