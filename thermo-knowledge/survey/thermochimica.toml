# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "gas constant and units"
locator = "src/setup/InitThermo.f90 (dIdealConstant); src/setup/CheckThermoInput.f90"
statement = "R = 8.314472 J/mol/K, fixed in the code. Internal units are K for temperature, atm for pressure (inputs in bar, Pa, kPa, psi, atm are converted) and moles or grams for masses; an internal normalisation sum of 1000 is set at initialisation (purpose inferred: scaling of input amounts). Chemical potentials inside the solver are divided by RT."
scope = "all calculations"

[[convention]]
name = "temperature interval selection and extrapolation"
locator = "src/setup/CompThermoData.f90 (interval loops near :130-215)"
statement = "The Gibbs equation of a species at temperature T is that of the first interval whose Tmax is at least T; if T exceeds every Tmax the last interval is used, so data are extrapolated upward; if T is below the first interval the first is used."
scope = "standard Gibbs energies of solution species and compounds"

[[convention]]
name = "ordering of constituents in excess terms"
locator = "src/parser/ParseCSDataBlockRKMP.f90, ParseCSDataBlockSUBL.f90"
statement = "Constituents of an excess term are taken in the order the file lists their indices; no sort is applied. Odd-order binary terms change sign under swap. pycalphad's DAT reader also keeps file order (its TDB reader sorts alphabetically)."
scope = "RKMP, RKMPM, SUBL, SUBLM, SUBI excess terms"

[[convention]]
name = "composition coordinates by model"
locator = "src/gem/CompExcessGibbsEnergy.f90 and the model routines"
statement = "IDMX, RKMP and RKMPM use species mole fractions; QKTO uses species mole fractions converted to equivalent fractions; SUBL and SUBLM use endmember species mole fractions with site fractions derived; SUBG and SUBQ use quadruplet (pair) fractions with pair, site and coordination-equivalent fractions derived; SUBI and SUBM use species fractions on two ionic sublattices."
scope = "all solution phases"

[[convention]]
name = "pure condensed phase and dummy species conventions"
locator = "src/parser/ParseCSDataBlockGibbs.f90; src/setup/CompThermoData.f90"
statement = "Stoichiometric entries follow the solution phases; an entry whose name carries a '#' token is a dummy species with its constant Gibbs term replaced by 1e6 so it never stabilises; a ':n' suffix after '):' in a species name multiplies stoichiometry and chemical potential by n particles per formula mass."
scope = "stoichiometric entries and species names"

[[convention]]
name = "format coverage compared with pycalphad cs_dat.py"
locator = "src/parser/ (Thermochimica) versus pycalphad/io/cs_dat.py"
statement = "Read by Thermochimica and not by pycalphad: model codes SUBI and SUBM; fixed-width name fields with trailing labels (for example the COMPOUND PHASE label) and the ':n' particles-per-mole suffix; '#' dummy species with a fixed 1e6 energy; the limit of three additional Gibbs terms per interval is Thermochimica's only. Read by pycalphad and not by Thermochimica: the model codes PITZ, IDVD and IDWZ (parsed, not insertable), arbitrary Gibbs-term and excess-term index layouts (Thermochimica requires 6 1 2 3 4 5 6), the ':N' atoms-per-formula suffix of a SUBL phase name, and arbitrary numbers of additional Gibbs terms. Both accept Gibbs equation types 1, 4, 13 and 16 and treat exponent 99 as ln T. the parsed pycalphad expression is zero outside the listed intervals (and its Model widens the first and last interval by default), while Thermochimica uses the first interval below and the last above."
scope = "DAT files"

