# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "src/parser/ParseCSHeader.f90 (line 5 comment and the two reads of iGequation)"
documented = "The comment describes line 5 as the definition of the temperature dependence terms and the code checks it against the fixed layout 6 1 2 3 4 5 6"
actual = "The layout line is read twice into the same array (the Gibbs layout then the excess layout) and only the second read is compared with the fixed layout; all 27 data files have the standard line twice, so no file shows the effect."
consequence = "A DAT file with a non-standard Gibbs layout but a standard excess layout would be accepted and misread."

[[discrepancy]]
locator = "src/parser/ParseCSDataBlockGibbs.f90 header comment versus the data files and the code"
documented = "Dummy species are said to be those following the pure separate phases whose names do not end with ')', and all pure separate phases are said to end their name with '(s)'"
actual = "The code marks a dummy species by a '#' in the species name when the phase index is 0; stoichiometric names in the data end (s) 62 times, (s2) to (s8) 14 times, and 20 entries in four files (CaMnS, FeMnCaS-1, FeMnCaS-2, CsTe-1) use a label 'NAME = COMPOUND PHASE = 1.0000' with no (s) suffix."
consequence = "A reader that keys on the suffix cannot identify stoichiometric entries or dummy species in those files; pycalphad's token-based reader cannot parse the COMPOUND PHASE label lines."

[[discrepancy]]
locator = "src/gem/CompThermoData.f90 header comment (additional terms) versus src/parser/ParseCSDataBlockGibbs.f90"
documented = "The description says the additional terms of the Gibbs equation are given as up to three coefficient-exponent pairs (G T^U ... L T^Z)"
actual = "The parser reads a count l of 0 to 3 pairs and fails for any other count; types 1 and 13 have no additional-term line at all, so a data file can contain 0 pairs on a type 4 or 16 equation, which the parser handles as a count line holding 0."
consequence = "Additional terms beyond three pairs, which pycalphad's reader would accept, are rejected by Thermochimica."

[[discrepancy]]
locator = "src/gem/CompExcessGibbsEnergyQKTO.f90 header comment versus PolyRegularQKTO"
documented = "The routine description gives a binary excess term as L x1^a x2^b with mole fractions and Kohler scaling (x1+x2)^2, and the ternary analogue"
actual = "PolyRegularQKTO computes equivalent fractions with the per-species factor, sums them by chemical group into xi1 and xi2, and evaluates L xi1^(p-1) xi2^(q-1) over a power of the denominator (citing Pelton and Bale 1977); ternary terms are forced symmetric."
consequence = "A mapping that reads the description alone would assign the wrong composition coordinate and exponent meaning to QKTO terms."

