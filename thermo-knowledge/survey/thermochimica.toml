# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "which data files were modified"
question = "Disclaimer.txt says some files in data/ were modified from their original use for testing but does not say which. Are the 27 DAT files original exports or test-modified variants (the names ZIRC_no_liq_mod1 and _mod2 and ZIRC-noSUBI suggest edits)?"
why_it_matters = "Modified data are not evaluated knowledge; provenance and the origin role (oracle_input versus published) depend on it."

[[question]]
about = "datum and constants of the export"
question = "The files do not state the reference enthalpy or entropy datum of the species equations, the gas constant used when FactSage computed them, or the pressure standard; the code uses R = 8.314472 and atm. Is the 0.10945 J/mol B-coefficient correction for gases an artefact of the export or of the ideal-gas reference pressure? (inferred: from 0.10945/R numerically equalling ln(101325/100000), a gas standard pressure of 1 bar, but the source does not say so)"
why_it_matters = "The convention_set of each file needs these values, and recomputing with a different R breaks reproduction."

[[question]]
about = "SUBQ and SUBG excess lines"
question = "Two lines of six numbers per excess term are read and ignored by Thermochimica, and three of five pair stoichiometry numbers are only partly explained. Do any data files carry non-zero values there?"
why_it_matters = "A lossless import must keep them if they are non-zero."

[[question]]
about = "SUBI mixing cases"
question = "The twelve mixing cases are derived from charges alone. Are there parameter types in the export that do not fall into any case (the code leaves their type 0)?"
why_it_matters = "It decides whether the ionic-liquid excess slot group needs an explicit case field or can rely on species charges."

[[question]]
about = "QKTO first species number"
question = "The first of the two numbers after each QKTO species Gibbs equation is labelled in a comment as a mole-to-equivalent fraction conversion; pycalphad calls it a stoichiometric factor and requires 1. Are there files with other values?"
why_it_matters = "The model has an equivalent_fraction composition basis that needs a conversion source."
