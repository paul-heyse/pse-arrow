source = "thermochimica"
pin = "0c35c8d7d1cf"
surveyed = "2026-09-30"
summary = "Thermochimica (Fortran, BSD 3-Clause, pinned commit 0c35c8d7) contributes a parser for ChemSage DAT data files that covers ten solution-model codes (IDMX, QKTO, RKMP, RKMPM, SUBL, SUBLM, SUBG, SUBQ, SUBI, SUBM), the excess-energy equations of each in species mole fractions, site fractions or quadruplet fractions, and a Gibbs energy minimiser (leveling, Newton iteration on element potentials, subminimisation for phase addition) for equilibrium at fixed temperature, pressure and element amounts plus finite-difference heat capacity, enthalpy and entropy; it ships 27 DAT files (228 solution-phase entries, 263 stoichiometric phases) whose terms are not stated beyond a short disclaimer that some were modified for testing, and it supports only four Gibbs-equation types and a fixed coefficient layout."

