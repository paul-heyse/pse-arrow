[[construct]]
name = "QKTO block (quasichemical Kohler-Toop)"
locator = "src/parser/ParseCSDataBlockQKTO.f90; src/parser/ParseCSInterpolationOverrides.f90; src/gem/CompExcessGibbsEnergyQKTO.f90"
meaning = "A solution phase whose species each carry, after their Gibbs equation, two numbers: a mole-to-equivalent fraction factor and a chemical group number; excess terms of arity 2 or 3 list the constituent indices and exponents with 6 coefficients; a 0 or a negative count ends the list, a negative count -N being followed by N interpolation override lines that switch individual ternary subsystems between Kohler and Toop interpolation."
subject = "One solution phase with its species, keyed by phase name."
fields = [
  { name = "stoichiometric factor and chemical group", meaning = "two numbers per species; the first is read by Thermochimica for mole/equivalent conversion (pycalphad requires it to be 1.0) and the second is the group number used by Toop interpolation", unit = "not applicable (dimensionless, integer group)", shape = "list", role = "input" },
  { name = "excess term", meaning = "arity (2 or 3), constituent indices, exponents, six coefficients of 1, T, T ln T, T^2, T^3, 1/T", unit = "not stated (inferred: J/mol)", shape = "table", role = "input" },
  { name = "interpolation override line", meaning = "ten items encoding a ternary triad, K (Kohler) or T (Toop with the named constituent) per binary, and a constituent index", unit = "not applicable (text)", shape = "list", role = "input" },
]
origin = "generated by FactSage or ChemSage export"
conventions = "The solver variables are species mole fractions, converted to equivalent fractions y_i = x_i f_i / sum(x_j f_j) with f the per-species factor. For a binary term the code evaluates L times xi1^(p-1) times xi2^(q-1) divided by (xi1+xi2)^(p+q-2), where p and q are the file exponents (a file exponent of 1 means power 0) and xi1, xi2 are sums of equivalent fractions of the species in the chemical group of constituent 1, respectively 2, when the groups differ (Toop-type asymmetry) and of the named constituents alone when they are equal; ternary terms are always treated symmetrically, whatever the groups, and an override line can switch a triad. The routine cites Pelton and Bale, CALPHAD 1 (1977)."
absence = "No override line means groups decide Kohler versus Toop. An excess term of arity other than 2 or 3 fails the parse."
validity = "not stated"
provenance = "none"
count = "63 QKTO entries in 5 files (FeTiVO, MoPdRuRhTc-Kaye, NobleMetals-Kaye, PdRuTcMo, ternaryMiscibility-Kaye)"
example = "data/NobleMetals-Kaye.dat"
candidate = "phase_definition with structure none and a Kohler-Toop excess form; selection of interpolation as a per-subsystem relation"
precision = "broader"
loss = "Interpolation overrides are a per-triad choice with no slot in the model; the equivalent-fraction conversion factor is a phase property."

[[construct]]
name = "RKMP and RKMPM block (Redlich-Kister-Muggianu polynomial)"
locator = "src/parser/ParseCSDataBlockRKMP.f90; src/gem/CompExcessGibbsEnergyRKMP.f90; src/gem/CompGibbsMagneticSoln.f90"
meaning = "Excess terms as a list: arity (2, 3 or 4), constituent indices and the number of order rows, then one row of 6 coefficients per order; a 0 ends the list. RKMPM prepends a list of magnetic terms (two values per order, critical temperature and moment) and a line with two phase-level magnetic factors before the species."
subject = "One solution phase."
fields = [
  { name = "excess term", meaning = "arity, constituent indices, number of orders, coefficients per order", unit = "not stated (inferred: J/mol)", shape = "table", role = "input" },
  { name = "magnetic terms", meaning = "arity, indices, orders, critical temperature and moment per order (RKMPM only)", unit = "K and Bohr magneton (inferred)", shape = "table", role = "input" },
  { name = "phase-level magnetic factors", meaning = "two numbers after the model code for RKMPM", unit = "dimensionless (inferred)", shape = "list", role = "input" },
]
origin = "generated by FactSage or ChemSage export"
conventions = "Binary: x1 x2 sum over orders of L (x1 - x2)^order with the constituents in file order (no alphabetical sort). Ternary: x1 x2 x3 times the Muggianu-corrected fraction of the constituent selected by the order index. Quaternary: x1 x2 x3 x4 L with no order dependence. Species mole fractions are the composition variables."
absence = "Arities other than 2, 3 and 4 fail the parse (code 43 for magnetic, 1600 + phase index otherwise)."
validity = "not stated"
provenance = "none"
count = "8 RKMP entries in 7 files and 7 RKMPM entries in 5 files"
example = "data/AlMg-Liang.dat"
candidate = "phase_definition (structure none) with Redlich-Kister-Muggianu excess slot groups over species (not constituent arrays)"
precision = "close"
loss = "Terms index species of the phase by position in the list, so the subject is an ordered tuple of species with the file order significant for odd orders."

[[construct]]
name = "SUBL and SUBLM block (compound energy formalism)"
locator = "src/parser/ParseCSDataBlockSUBL.f90; src/gem/CompExcessGibbsEnergySUBL.f90; src/gem/CompGibbsMagneticSoln.f90"
meaning = "After the species (the endmembers) come: number of sublattices, atoms per sublattice, constituent count per sublattice, constituent names (25 characters each, three per line), then per sublattice a list giving, for each endmember species, the index of its constituent in that sublattice; SUBLM then has a magnetic term list; then the excess term list: constituent count, constituent indices (linear over all constituents of the phase; the code converts them to 10000 times the sublattice plus the constituent index), number of orders, one row of 6 coefficients per order, 0 ending the list."
subject = "One solution phase whose species are endmembers of a sublattice model."
fields = [
  { name = "sublattice count and atom fractions", meaning = "number of sublattices and atoms per formula per sublattice", unit = "not applicable (count of atoms)", shape = "list", role = "input" },
  { name = "constituent lists", meaning = "names per sublattice", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "endmember index table", meaning = "for each species, which constituent it puts on each sublattice", unit = "not applicable (index)", shape = "table", role = "input" },
  { name = "excess term", meaning = "constituent indices (linear over the phase, converted to sublattice-qualified codes in CompThermoData), order count, coefficient rows", unit = "not stated (inferred: J/mol)", shape = "table", role = "input" },
  { name = "magnetic terms", meaning = "as RKMPM, sublattice-qualified", unit = "K and Bohr magneton (inferred)", shape = "table", role = "input" },
]
origin = "generated by FactSage or ChemSage export"
conventions = "The degrees of freedom in the solver are the mole fractions of the endmember species; site fractions are computed from them, and a species mole fraction is the product of its constituents' site fractions (the code comment gives x_i = product of y over sublattices). A ternary with a single order-0 row is expanded into three identical order terms (the lTripleTerm logic). Magnetic critical temperature and moment of a solution are linear in species mole fractions plus excess terms."
absence = "A phase with more or fewer species than the product of constituent counts has no extra internal freedom beyond endmember fractions."
validity = "not stated"
provenance = "none"
count = "83 SUBL entries in 10 files and 30 SUBLM entries in 11 files"
example = "data/ZrH-Dupin.dat"
candidate = "phase_definition with structure sublattice; site_class, site_occupant, constituent_array, site_equivalence where present; parameter_set rows per slot group"
precision = "broader"
loss = "The solver variables are endmember mole fractions, not independent site fractions, so a phase with fewer endmembers than site-fraction degrees of freedom is a reduced description; the model's site-fraction basis is a different composition coordinate."

