[[construct]]
name = "DAT header block"
locator = "src/parser/ParseCSHeader.f90 (whole file; line 2 read at its start, line 5 checks at the end)"
meaning = "Line 1: title (ignored). Line 2: number of elements, number of solution-phase slots, then the species or pair count per slot (the first slot is the gas; a count of 0 means the gas is absent and the phase count is reduced by one), then the number of stoichiometric phases. Next: element names (names beginning 'e(' become the electron e-), element atomic masses, and two index lines describing the Gibbs-energy and excess-energy term layout, each of which must be 6 1 2 3 4 5 6 or the parse fails with code 105."
subject = "One data file."
fields = [
  { name = "title", meaning = "system title, cropped by the export and not used", unit = "not applicable (text)", shape = "scalar", role = "unread" },
  { name = "element count and solution-phase slot count", meaning = "two integers", unit = "not applicable (count)", shape = "list", role = "input" },
  { name = "species or pair counts per slot", meaning = "one integer per solution-phase slot, first slot the gas", unit = "not applicable (count)", shape = "list", role = "input" },
  { name = "stoichiometric phase count", meaning = "number of pure condensed entries", unit = "not applicable (count)", shape = "scalar", role = "input" },
  { name = "element names", meaning = "system components", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "atomic masses", meaning = "one per element", unit = "not stated (inferred: g/mol)", shape = "list", role = "input" },
  { name = "term index lines", meaning = "the Gibbs and excess layouts: terms 1, T, T ln T, T^2, T^3, 1/T; checked against the fixed layout and then discarded", unit = "not applicable (index)", shape = "list", role = "metadata" },
]
origin = "generated by FactSage or ChemSage export; program version not recorded"
conventions = "The code reads the layout line twice and compares only the second read with the fixed layout (the first is overwritten), so a non-standard first line is not detected. The maximum number of solution phases per system is bounded (error 8 above the limit). Temperatures are in K, pressure in atm inside the code."
absence = "A gas count of 0 means there is no gas phase; 0 stoichiometric phases is allowed."
validity = "not stated"
provenance = "none beyond the title line"
count = "27 files"
example = "data/WAuArO-1.dat (first 8 lines)"
candidate = "chemical_system (elements, phases) plus convention_set"
precision = "close"
loss = "Datum, gas constant and atomic-weight edition of the export are not in the file."

[[construct]]
name = "Gibbs-energy equation block (species or compound)"
locator = "src/parser/ParseCSDataBlockGibbs.f90; evaluation in src/setup/CompThermoData.f90:30-215"
meaning = "One species or compound: name (26-character field); an equation-type integer, the number of temperature intervals, then the stoichiometry per element; per interval an upper temperature and 6 polynomial coefficients (A + BT + CT ln T + DT^2 + ET^3 + F/T), then for types 4 and 16 a count of additional terms (0 to 3) and, for each, a coefficient and exponent (exponent 99 means ln T); types 13 and 16 add a line of magnetic coefficients. Only types 1, 4, 13 and 16 are accepted; others fail with code 1400+."
subject = "One species or one pure condensed compound within a phase, keyed by name and position."
fields = [
  { name = "species name", meaning = "label in a 26-character field; a ':n' suffix after '):' gives particles per formula mass; a '#' marks a dummy species (phase index -1, energy set to 1e6 by the code); names of stoichiometric entries often end (s) or (s2) to (s8) or carry an 'NAME = COMPOUND PHASE = 1.0000' label", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "equation type", meaning = "1 plain, 4 with additional terms, 13 magnetic, 16 magnetic with additional terms", unit = "not applicable (code)", shape = "enum", role = "input" },
  { name = "stoichiometry", meaning = "atoms of each element in the formula; multiplied by the particles-per-mole integer", unit = "not applicable (count)", shape = "list", role = "input" },
  { name = "interval upper temperature", meaning = "Tmax of each interval", unit = "K (inferred)", shape = "scalar", role = "input" },
  { name = "six coefficients", meaning = "A to F of the standard Gibbs energy polynomial", unit = "not stated (inferred: J/mol)", shape = "list", role = "input" },
  { name = "additional terms", meaning = "up to 3 coefficient-exponent pairs, exponent 99 = ln T", unit = "not applicable (coefficient)", shape = "list", role = "input" },
  { name = "magnetic coefficients", meaning = "critical temperature, magnetic moment and, for pure condensed phases, structure factor and p (four values); for a solution species two values with the phase-level factors supplied separately", unit = "K and Bohr magneton (inferred)", shape = "list", role = "input" },
]
origin = "generated by FactSage or ChemSage export"
conventions = "The interval used at a given T is the first whose Tmax is greater than or equal to T (upper-inclusive), and a T above the last Tmax uses the last interval, so the equation is extrapolated upward; below the first interval the first is used. Energies are J per mole of species formula; the code divides by RT to make chemical potentials dimensionless and multiplies by the particles-per-mole integer. When the first phase is an IDMX the code adds ln P (P in atm) and the constant 0.10945 divided by R to the dimensionless chemical potential of its species; a code comment explains the constant as a correction of the B coefficient of gaseous species that FactSage introduces in exported files."
absence = "An interval with zero additional terms still has a line with the count 0 for types 4 and 16; type 1 has no such line. A dummy species has its constant term replaced by 1e6."
validity = "each interval's temperature range; upward extrapolation beyond the last"
provenance = "none"
count = "263 stoichiometric phases and the species of 228 solution-phase entries in 27 files"
example = "data/CsI-Pham.dat (species I, I2, Cs ...)"
candidate = "standard_state_species form with piecewise temperature polynomial, species_form per entry"
precision = "close"
loss = "Interval selection (upper-inclusive, upward extrapolation) differs from the TDB convention and must be a declared rule; the gas correction constant 0.10945 is a code behaviour, and 0.10945/R equals ln(101325/100000) to about four significant figures, which implies (inferred: from the numerical equality, not stated by the source) a gas standard pressure of 1 bar against the code's atm pressure unit; dummy species are a numerical device, not chemistry."

