# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "Antoine saturation pressure form"
question = "AntoineEqSat.jl:75 computes psat = 10^(A - B/(T + C - 273.15)), while its docstring writes log10(psat/Pa) = A + B/(T/K - 273.15 + C). The file values (for example argon A 8.74, B 304.2, C 267.3 over 82.6 to 94.3 K) reproduce a pressure near 1e5 only with the minus sign and with pressure in Pa or an unstated unit. Which form and which pressure unit do the 329 rows use?"
why_it_matters = "A mapping must carry the sign and the unit of A; the docstring and the code disagree, and the file states nothing."

[[question]]
about = "bondvol meaning by family"
question = "The column bondvol holds 0.01 to 0.04 in PC-SAFT, CKSAFT, ogSAFT and CPA tables, 1e-27 to 1e-30 in SAFT-VR Mie, SAFT-VR SW, softSAFT and SAFT-gamma Mie tables, about 35 to 40 in LJSAFT, and 0.228 in CP-PC-SAFT, while every docstring says m3. Is it a dimensionless association volume in the first group and a physical volume in the second, and what is the LJSAFT unit?"
why_it_matters = "One parameter name with at least two physical meanings breaks a slot typed by unit; the knowledge model needs separate slots per definition."

[[question]]
about = "CKSAFT and BACKSAFT vol unit"
question = "Docstrings state vol in dm3, but the constructors divide by 1e6 (and N_A) which treats it as cm3/mol; values near 12 to 19 are consistent with cm3/mol. Which is intended?"
why_it_matters = "The factor 1000 between the two readings changes the segment diameter by a factor of 10."

[[question]]
about = "SAFTVRMie k parameter"
question = "The SAFTVRMie docstring lists an optional pair k, but transform_params uses only the tabulated cross epsilon and lambda_r and the combining rules; k is not read. Is k intended to be unsupported?"
why_it_matters = "A user-supplied k would be silently ignored; the knowledge model should not advertise a slot the model does not use."

[[question]]
about = "Asymmetric cross-association"
question = "The user guide warns that cross-association values can be asymmetric (water with acetonitrile) and tells users to list both orientations, but compile_assoc canonicalises each pair by swapping to the lower component index, so both rows map to one stored entry and the later one wins. Can an asymmetric pair be represented?"
why_it_matters = "It determines whether the model needs an ordered site-pair transposition rule for this source."

[[question]]
about = "SAFTVRQMie Feynman-Hibbs order"
question = "fh_order accepts :fh1 and :fh2, but both branches of default_locations_vrq name the same directory SAFT/SAFTVRQMie, so one table serves both orders. Are the tabulated parameters for fh1, fh2 or both?"
why_it_matters = "The parameter set depends on the correction order; the files do not record it."

[[question]]
about = "CPA default location function"
question = "default_locations(model::CPA) reads an undefined variable radial_dist, so the instance method cannot run as written; the type-level method returns SAFT/CPA. Which path does the package actually use for :KG models?"
why_it_matters = "Determines which table (CPA or sCPA) a :KG model draws from."

[[question]]
about = "Unreferenced database files"
question = "Files not named by any code path: properties/rackett.csv, Electrolytes/properties/salts.csv, Electrolytes/RSP/WAvg_like.csv, Zhuang_like.csv, SAFT/PCSAFT/ePCSAFTAdv/*_like and *_unlike, SAFT/eCPA (3), SAFT/ePCSAFT (3), SAFT/sCPA (3), Activity/eCPANRTL, Activity/NRTL/eNRTL, ideal/BurkhardtIdeal/BurkhardtIdeal_mw.csv, AnalyticalSLV/SLV_like.csv (capital-L path mismatch). Are they intended data for unfinished models?"
why_it_matters = "Their content is knowledge that no package evaluation has checked; extraction would need to mark them unqualified."

[[question]]
about = "Dead model files"
question = "Not included by src/Clapeyron.jl: Activity/NRTL/variants/eNRTL.jl, Activity/UNIFAC/old.jl, SAFT/SAFTgammaMie/SAFTgammaMie_old.jl, cubic/translation/Clausius.jl (include commented out), and the commented eCPANRTL include; eCPA still names eCPANRTL as its default activity. Are the exported names (eNRTL, ClausiusTranslation) usable?"
why_it_matters = "The catalogue lists exported types that cannot be constructed in this version."

[[question]]
about = "Duplicate and placeholder-looking rows"
question = "The first data row (methanol with ethanol) of margules_unlike.csv, vanlaar_unlike.csv, NRTL_unlike.csv and aspenNRTL_unlike.csv carries the same two numbers (4.712 and -1162.3) in the first two parameter columns, which are different parameters in each model; FH_unlike.csv has 8 exactly duplicated pair rows; PCSAFT_like.csv has 8 duplicate species rows. Are these placeholder or test values?"
why_it_matters = "Parameter sets copied across models with different meanings cannot be trusted as data of record."

[[question]]
about = "Fluid JSON keys never read"
question = "T_max, p_max, rhomolar_max (EOS level), critical_region_splines, BibTeX_CP0, all *_units, ANCILLARIES hL, hLV, sL, sLV, melting_line, surface_tension, TRANSPORT and most INFO fields are not read; the reader also takes the lower volume bound from STATES/critical/rhomolar_max which no bundled file has, so the EOS-level rhomolar_max is unused."
why_it_matters = "Validity ranges and auxiliary curves exist in the files but the package does not enforce them, so evaluating outside the stated range is not refused."

[[question]]
about = "lb estimate for multifluid gamma_v"
question = "In recombine_mixing_reduced! the estimate = :lb branch for a missing gamma_v assigns gamma_T[i,j] = 1.0 instead of gamma_v[i,j]."
why_it_matters = "A user following the documented :lb estimate gets gamma_v left at its missing value."

[[question]]
about = "DETPFlash naming"
question = "DETPFlash is documented as a global Gibbs minimisation whose file name is historical: the optimiser backend is self-adaptive spherical search (backend = :sass), not differential evolution."
why_it_matters = "The capability is named for its algorithm in the source; the knowledge model should record the method by behaviour."

[[question]]
about = "UNIFAC variants share grouptype"
question = "UNIFAC_unlike.csv (Dortmund) and UNIFAC2_unlike.csv (UNIFAC 2.0 refit) both declare grouptype = UNIFACDortmund, and ogUNIFAC and its 2.0 refit both declare originalUNIFAC, so the reader accepts merging the classic and refit interaction tables."
why_it_matters = "Distinct parameterisations share one scheme label; the knowledge model needs revision-level scheme identity."

[[question]]
about = "GlennJL and CoolProp extensions"
question = "GlennJL reads a NASA-polynomial database from Glenn.jl, SingleFluid can read CoolProp's library, SAFTgammaMie-related code downloads sigma profiles (COSMOSAC02 use_nist_database) from an external repository, and lib/ClapeyronHANNA exports machine-learned activity models (HANNA, ogHANNA, multHANNA) from MLThermoProperties. None of these data are in the tree."
why_it_matters = "Model families whose parameters are external cannot be surveyed from the pinned bytes; they are listed as present in the package but without bundled data."

[[question]]
about = "FixedComps"
question = "src/models/utility/FixedComps.jl is wrapped in a block comment and has no code."
why_it_matters = "An apparent utility model is inactive."

[[question]]
about = "Units of the estimation examples"
question = "examples/data/*.csv give columns T, out_pre, out_rho with no units; the example values (90.694 and 28142.0 in the saturation example) suggest K and mol/m3 but the pressure scale (0.0117e6) is written with an explicit factor."
why_it_matters = "Estimation data cannot be typed without units."

[[question]]
about = "Twu alpha table shares species list with cPR"
question = "alpha/Twu/Twu_like.csv and cubic/cPR/cPR_single.csv both hold 2571 species keys and the same L, M, N columns."
why_it_matters = "Whether the two tables are copies of one fit (one source, two locations) or independent fits decides if they are two parameter sets or one."
