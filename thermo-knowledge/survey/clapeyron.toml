# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "SI inputs and total Helmholtz energy"
locator = "src/base/EoSModel.jl:32-57 (eos docstring and eos_impl)"
statement = "eos(model, V, T, z) takes total volume in m3, temperature in K and mole amounts z in mol (not fractions) and returns the total Helmholtz energy in J as R*sum(z)*T*(a_ideal + a_res) plus a reference-state offset; all property functions are derivatives of it. Fractions are formed inside models."
scope = "every EoSModel (Helmholtz-based); activity and composite models define their own entry points"

[[convention]]
name = "Gas constant: 2019 definition as default, per-model override"
locator = "src/base/EoSModel.jl:19-30 (Rgas); src/modules/constants/Constants.jl:1-21; src/base/constants.jl:1-9"
statement = "Rgas() returns 8.31446261815324 J/(mol K) (the exact 2019 value, written as a Float64 literal in Constants.R; base/constants.jl also defines R = N_A * k_B from N_A = 6.02214076e23 and k_B = 1.380649e-23). SingleFluid takes the gas constant from its JSON file (8.314472 in the GERG files), MultiFluid uses the pure value for one component and the 2019 value for mixtures unless Rgas is given, GERG2008 and EOS-LNG pass 8.314472, TillnerRothFriend 8.314471, GlennJL has its own R0 of the fit (8.314510 by default in its docstring)."
scope = "all models; constants in constants.jl: e_c = 1.60217662e-19 and eps_0 = 8.85418782e-12 are older-precision values than the exact 2019 elementary charge"

[[convention]]
name = "Parameter units in the database: stated only in docstrings"
locator = "src/models/**/*.jl docstrings (## Input parameters); database files"
statement = "The CSV files carry no unit row. Units come from the model docstrings: Tc in K, Pc in Pa, Vc in m3/mol, Mw in g/mol, sigma in Angstrom, epsilon and epsilon_assoc in K (energy over k_B), dipole in D, quadrupole in D*Angstrom, site counts as plain numbers, bondvol in m3 (docstring; magnitudes disagree for some families, see the assoc constructs). Constructors convert to SI internally."
scope = "all parameter tables"

[[convention]]
name = "Internal unit conversions in model constructors"
locator = "transform_params functions: src/models/SAFT/PCSAFT/PCSAFT.jl:19; SAFTVRMie.jl:20; LJSAFT.jl:14 (b x 1e-3); CKSAFT.jl:15 (vol x 6*0.74048/N_A/1e6/pi then cube root); BACKSAFT.jl:15; gcsPCSAFT.jl (msigma3 x 1e-30); PCPSAFT.jl:32 (dipole2 conversion); SAFTVRQMie.jl:58 (Mw x 1e-3); MonomerIdeal.jl; JobackIdeal.jl:255-363"
statement = "sigma x 1e-10 (Angstrom to m) in every SAFT model; dipole squared = mu^2/(m k_B) times 1e-36 * (1e-10*1e-3) (Debye and Angstrom to SI); quadrupole squared likewise with 1e-56; CKSAFT and BACKSAFT sigma^3 = vol * const / (N_A * 1e6) which treats vol as cm3/mol; LJSAFT b x 1e-3 treats it as dm3/mol; Joback results scaled by 1e-6 (volume), 1e5 (pressure from bar), 1e3 (energies from kJ)."
scope = "SAFT family, Joback, Monomer ideal, SAFTVRQMie"

[[convention]]
name = "Combining-rule convention: k and l as deviations"
locator = "src/database/combiningrules.jl:1-120; src/models/cubic/equations.jl:85-92"
statement = "k_ij scales an energy or attraction by (1 - k_ij) applied to a geometric mean; l_ij scales a size or covolume by (1 - l_ij) applied to an arithmetic mean; a pair value already read from a table is never replaced. LKP's table stores 1 - kappa of the paper (the line-2 text says so)."
scope = "SAFT, cubic, LKP, multifluid LorentzBerthelotMixing"

[[convention]]
name = "Multifluid reducing-function orientation"
locator = "src/models/EmpiricHelmholtz/MultiFluid/mixing/Asymmetric.jl (transform_params, mixing_rule_asymmetric)"
statement = "beta_v and beta_T are stored for the row orientation and mirrored by inversion for the reversed orientation; gamma_v and gamma_T are symmetric. The reducing volume uses a cube-root mean of the pure reducing volumes and the reducing temperature a geometric mean, both scaled by gamma and an asymmetric weight in beta and the mole fractions."
scope = "multifluid models (GERG-2008, EOS-CG, EOS-LNG, user multifluids)"

[[convention]]
name = "Reference states of the ideal models"
locator = "src/database/params/ReferenceState.jl; src/models/ideal/*.jl"
statement = "Each ideal model builds its ideal Helmholtz energy by integrating its heat-capacity form from a fixed reference temperature: ReidIdeal uses T0 = 298 K (a literal 298.0), AlyLeeIdeal and the JSON converters use T0 = 298.15 K; BasicIdeal is 5R/2 with its own additive constants; MonomerIdeal is the translational partition function. The resulting enthalpy and entropy zeros are therefore model-specific until a ReferenceState is applied (see the ReferenceState construct)."
scope = "ideal models and every model that contains one"

[[convention]]
name = "Setting the enthalpy and entropy reference"
locator = "src/database/params/ReferenceState.jl:1-110, 289-372; src/methods/methods.jl:313-330"
statement = "The reference_state keyword of a model constructor accepts a symbol (ashrae, iir, nbp, stp, stp_old, ntp, zero, no_set) or a ReferenceState with T0, P0, H0, S0, phase and z0 for the volume, ideal_gas, saturation_pressure and saturation_temperature types; set_reference_state! computes a0 and a1 offsets through the model's own saturation or volume solution; IGFormReferenceState builds an ideal_gas reference from formation_ig.csv (1 bar, 298.15 K). Only models whose ideal part carries a ReferenceState field accept it."
scope = "models with a ReferenceState in the ideal part or MultiFluidParam"

[[convention]]
name = "Composition bases"
locator = "src/models/Electrolytes/electrolytes.jl (molality_to_composition); src/methods/pT.jl (mass_* functions); src/modules/fractions/Fractions.jl"
statement = "Mole amounts z [mol] are the basic composition; mass-based properties (mass_density, mass_enthalpy, ...) use Mw in g/mol; electrolyte models include ion amounts in z and convert molality to mole amounts with molality_to_composition; group-contribution models work with group counts per component and group fractions (X_k) formed from z; Unitful inputs are accepted through an extension and stripped to these bases."
scope = "all property functions; electrolytes; group-contribution models"

[[convention]]
name = "Temperature scale and phases"
locator = "src/methods/methods.jl (phase symbols); database files"
statement = "Temperatures are Kelvin; the Antoine model subtracts 273.15 internally (so its B and C act on degrees Celsius); references to a named temperature scale (ITS-90 and so on) do not occur in the source. Phase arguments are the symbols :vapour, :liquid, :unknown and related (is_vapour, is_liquid, is_solid)."
scope = "all"

[[convention]]
name = "Missing-value semantics in the reader"
locator = "src/database/database_rawparam.jl:153-373; src/database/combiningrules/implace.jl:31-90"
statement = "An empty CSV cell is missing; missing is tracked per component or per pair in ismissingvalues and drives the combining rules; the flag stays on the packaged container where recombine steps still consult it, but evaluation code reads only the numeric values, so at evaluation time an explicit zero and a missing value are one number."
scope = "all parameter tables"

[[convention]]
name = "Name normalisation and alias delimiter"
locator = "src/database/database_utils.jl:139-147; src/database/ParamOptions.jl:22-36"
statement = "Names are compared case-folded, diacritic-stripped and with spaces removed; aliases in one cell are separated by the literal '~|~' (component_delimiter). Header names are normalised differently (additionally stripping digits, hyphens and underscores) when matching against the ignore list."
scope = "all tables"

[[convention]]
name = "File encoding, line ends and separators"
locator = "database/**/*.csv (measured)"
statement = "All non-empty CSV-format files in database/ (192 including the .old files) decode as UTF-8; 15 start with a byte order mark (all in database/Activity) and 19 use CRLF line ends (measured); decimal separator is a point, scientific notation uses e or E; the delimiter is a comma except where line 2 states sep = ;."
scope = "all CSV"

[[convention]]
name = "Group labels and site labels are free text"
locator = "database/**/*_groups.csv, *_assoc.csv"
statement = "Group labels (CH3, aCH, OH, ...) and site labels (H, e, e1, e2, a, b, BR) have no declared vocabulary; 'e' and 'H' suggest electron-donor and hydrogen sites by convention only. Labels are scheme-local: the same label in two schemes need not denote the same fragment, and nothing in the files links them."
scope = "groups and assoc tables"

[[convention]]
name = "Quantity of association volume"
locator = "src/models/SAFT/PCSAFT/PCSAFT.jl:224-233 (PC-SAFT delta); src/models/SAFT/SAFTVRMie/SAFTVRMie.jl:460-472 (SAFT-VR Mie delta); src/models/SAFT/CKSAFT/CKSAFT.jl:198-204; database/SAFT/**/*_assoc.csv"
statement = "Association strength is computed from epsilon_assoc and bondvol with the model's own size scale; in PC-SAFT-type models bondvol is a dimensionless kappa that is multiplied by a cube of a diameter, in SAFT-VR Mie-type models it is already a volume, so the same column name has two meanings (inferred from magnitudes and from the pure-component diameter use)."
scope = "association models"

[[convention]]
name = "Automatic differentiation and numeric types"
locator = "src/modules/solvers/ad.jl; src/database/params/*.jl"
statement = "Models are differentiated with ForwardDiff duals; parameter containers are generic in the element type (ParametricEoSParam{T}); primalval strips duals. Model results are reproducible across element types only as far as the algebra is, so validation values produced with Float64 do not cover dual inputs."
scope = "all models"

