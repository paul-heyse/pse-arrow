source = "clapeyron"
pin = "cbe8401f0132"
surveyed = "2026-09-30"
summary = "Clapeyron.jl v0.6.29 contributes a parameter database of 190 CSV files (188 in a three-line framing, 55504 data rows counting the raw CAS-to-InChIKey list) and 42 CoolProp-layout fluid JSON files (31 distinct fluids), plus the Julia source of about 210 model types built by composition: cubic cores with separate alpha, mixing-rule and translation slots, SAFT family models with association sites and group-contribution forms, activity models including UNIFAC variants and COSMO-SAC, electrolyte compositions of neutral, ion and permittivity models, multifluid Helmholtz models, ideal-gas heat-capacity models and composite correlation models; it encodes the kind of a parameter in the table framing and column names, not in any unit or scheme declaration, and it bundles no transport data, no reactive equilibrium and no adsorption models."

