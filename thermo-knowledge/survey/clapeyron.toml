# SELECTIONS
# ---------------------------------------------------------------------------

[[selection]]
name = "Later file wins for a repeated parameter"
locator = "src/database/database.jl:215-221 (comment), 341-437 (createparams, merge_allparams!); database_rawparam.jl:51-81, 153-250"
rule = "Files are read in order: the model's default locations (a directory is read in alphabetical file order, non-recursively, keeping only .csv and .json), then user locations. The entries of a parameter from all files are joined in that order and compiled; a later entry overwrites an earlier one for the same key, whether it comes from a later row of the same file or from a later file."
scope = "all parameters of all parameter-table models"
documented = "yes: the getparams docstring says files in later paths take priority"

[[selection]]
name = "Directory as location reads only its direct files"
locator = "src/database/database_utils.jl:60-92 (_getpaths)"
rule = "A location that is a directory expands to its direct .csv and .json files (readdir order); subdirectories are not entered, and files with other extensions (for example .old) are ignored; a location that is a file is used as is; in-memory tables start with 'Clapeyron Database File'."
scope = "all locations"
documented = "yes: the code comment says the reader is not recursive"

[[selection]]
name = "@REPLACE and @REMOVEDEFAULTS"
locator = "src/database/database.jl:71-97 (docstring), database_utils.jl:46-51, 101-107; database.jl:406-437"
rule = "A user path prefixed @REPLACE clears all earlier occurrences of every parameter name the file defines (and parameters it lists as not found); a first user location @REMOVEDEFAULTS drops the default locations; @DB points at the package database."
scope = "user-supplied locations"
documented = "yes"

[[selection]]
name = "Single-to-pair promotion and kind clashes"
