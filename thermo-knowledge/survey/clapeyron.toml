locator = "database/SAFT/CPA/CPA_assoc.csv; same layout in: database/SAFT/eCPA/eCPA_assoc.csv, database/SAFT/sCPA/sCPA_assoc.csv"
meaning = "Association energy and volume for CPA, eCPA (unreferenced) and sCPA (top-level, unreferenced) without a source column."
subject = "a site pair: (component, site) with (component, site)"
fields = [
  { name = "species1", meaning = "first component (or group) name of the pair; alias lists allowed", unit = "not applicable (text)", shape = "reference", role = "input" },
  { name = "SMILES1", meaning = "SMILES string of the first species", unit = "not applicable (text)", shape = "scalar", role = "unread" },
  { name = "site1", meaning = "association site label on the first species (values in this tree: H, e, e1, e2, a, b, BR, O)", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "species2", meaning = "second component (or group) name of the pair; alias lists allowed", unit = "not applicable (text)", shape = "reference", role = "input" },
  { name = "SMILES2", meaning = "SMILES string of the second species", unit = "not applicable (text)", shape = "scalar", role = "unread" },
  { name = "site2", meaning = "association site label on the second species", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "epsilon_assoc", meaning = "association energy over the Boltzmann constant for the site pair", unit = "K (docstrings)", shape = "scalar", role = "input" },
  { name = "bondvol", meaning = "association (bonding) volume for the site pair", unit = "dimensionless (inferred from magnitudes near 0.01; docstring says m³ in one place and m³·mol⁻¹ in another)", shape = "scalar", role = "input" },
]
origin = "authored; no source column"
conventions = "Units are not in the file; those shown come from the model docstrings or are marked inferred. Column order is free (columns are read by name)."
absence = "Only listed site pairs exist; other cross pairs are absent (zero) and may be filled by a cross-association combining rule, which cannot tell absent from an explicit zero. An empty epsilon_assoc or bondvol cell leaves that one parameter absent for the pair."
validity = "not stated"
provenance = "none: the table has no source column"
count = "24 data rows in 3 file(s): SAFT/CPA/CPA_assoc.csv 11; SAFT/eCPA/eCPA_assoc.csv 11; SAFT/sCPA/sCPA_assoc.csv 2"
example = "database/SAFT/CPA/CPA_assoc.csv row 1"
candidate = "parameter_set keyed by two (species_form, site) endpoints with a permutation_group transposition; association_site rows under a site_scheme"
precision = "close"
loss = "The site scheme is implicit in the labels and counts; the reader canonicalises the pair orientation, so asymmetric cross-association values cannot be stored."

