# PAYLOADS
# ---------------------------------------------------------------------------

[[payload]]
paths = ["database/properties/*.csv"]
format = "CSV in the Clapeyron framing (three preamble lines); identifiers.csv, formation_ig.csv use sep = ; ; 'like' (csvtype single) tables keyed by species name, except the two *_groups files keyed by group label; three framing lines then data: line 1 starts with the literal 'Clapeyron Database File' (padded with empty cells in most files), line 2 is free text that must carry the kind keyword (like, unlike, assoc, groups, intragroups) or a bracketed option list, line 3 is the column header; delimiter is a comma unless line 2 carries sep = ; ; an empty cell is a missing value"
files = 7
bytes = 854512
records = "12113 data rows over 7 files, counted by parsing each file after its three framing lines (critical.csv 2045; formation_ig.csv 1361; identifiers.csv 3747; molarmass.csv 3761; molarmass_groups.csv 125; natoms_groups.csv 80; rackett.csv 994)"
reader = "Clapeyron's own loader: getparams (src/database/database.jl:179) -> flattenfilepaths (src/database/database_utils.jl:96) -> createparams (database.jl:341) -> findparamsincsv (database.jl:688) using read_csv (database.jl:583 or 617, CSV.jl with header=3) and read_csv_options (database.jl:978); a plain CSV parser reads the same files once the two preamble lines are skipped; identifiers are additionally read through by_cas, by_cas2, cas and SMILES in database_utils.jl:282-379 and formation_ig.csv through IGFormReferenceState in src/methods/methods.jl:313"
read_by_source = "partly"
notes = "properties/rackett.csv (994 rows, column ZRA) is named by no path literal in src (measured by scanning string literals) and is therefore never read by the package. critical.csv is the default source of Tc, Pc, Vc and acentricfactor for every cubic and most correlation models through critical_data() (database_utils.jl:258); molarmass.csv supplies Mw for most SAFT and ideal models. Empty cells in critical.csv: Vc 278, acentricfactor 2, CAS 5. Many rows key species with '~|~'-joined alias lists (1145 of 2045 critical rows). Duplicate species keys exist (7 in critical.csv, 11 in molarmass.csv): the later row wins when the file is read."

