source = "cosmosac_nist"
pin = "1b82456be380"
surveyed = "2026-09-30"
summary = "usnistgov/COSMOSAC (commit 1b82456b) contributes three profile payloads (2261 DMol3 .cosmo quantum-chemistry outputs, 2260 single-profile and 2259 three-profile Delaware .sigma files, and 1432 Virginia Tech 2005 profiles with their index), a compound list keyed by InChIKey, and C++ and Python implementations of COSMO-SAC-2002, COSMO-SAC-2010 and COSMO-SAC-dsp whose model constants live only in code (no parameter file); it carries the .cosmo to .sigma generation script and a published verification table inside a test file, but no level-of-theory statement in the .cosmo files, no rights file for the VT-2005 profiles, and no check that a profile set is used with the constants it was generated for."

