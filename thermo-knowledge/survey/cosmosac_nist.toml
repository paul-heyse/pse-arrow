# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "sigma grid and area weighting"
locator = "profiles/to_sigma.py lines 316-338 and 685-700; include/COSMO_SAC/profile_db.hpp lines 17-35"
statement = "All profiles use 51 bins from -0.025 to 0.025 e/A^2 in steps of 0.001; the stored quantity is p(sigma) times the total area A_i in A^2 (psigmaA), each segment split linearly between the two nearest grid points; p(sigma) is psigmaA divided by the total area, and the total area is the column sum."
scope = "UD sigma, UD sigma3, VT-2005 profiles"

[[convention]]
name = "units"
locator = "include/COSMO_SAC/COSMO.hpp constants comments; profiles/to_sigma.py line 18"
statement = "Lengths in Angstrom, areas A^2, volumes A^3, charge density e/A^2, energies kcal/mol, temperature K, composition mole fraction; segment positions in the .cosmo table are in atomic units (Bohr) and are converted with 0.52917721067."
scope = "all constructs"

[[convention]]
name = "profile set and model constants are paired by generation settings"
locator = "profiles/to_sigma.py lines 623-630; profiles/generate_all_profiles.py docstring; include/COSMO_SAC/COSMO.hpp"
statement = "The averaging radius and decay factor recorded in each .sigma meta block (Mullins: 0.8176 A and 1.0; Hsieh: 1.5191 A and 3.57) belong to the model constant set the profile was generated for (the generator's own comment ties the Mullins radius to an effective area of 7.5 A^2, the Hsieh radius to 7.25 A^2). The COSMO-SAC-2002 constants have AEFFPRIME 7.5 and the 2010 constants 7.25. No code checks that a profile set matches the constants in use; the pairing exists only in these values and comments."
scope = "UD sigma versus UD sigma3; COSMO1 versus COSMO3"

[[convention]]
name = "level of theory"
locator = "profiles/UD/Readme.txt; profiles/UD/cosmo/*.cosmo banner; profiles/ORCA_TEST/ethanol.inp"
statement = "UD profiles: DMol3 in Materials Studio (Accelrys/Biovia/Dassault); functional, basis set and optimisation level not stated in the Readme or the files. VT-2005: the index has a 'Pre-opt tool' column (None, Amber8 or MS Forcite) but the quantum-chemistry method is not stated in the tree. The ORCA test input states a GGA functional with a triple-zeta basis and an infinite dielectric constant."
scope = "UD/cosmo, UD sigma and sigma3, VT2005 profiles"

[[convention]]
name = "gas constant"
locator = "include/COSMO_SAC/COSMO.hpp lines 137 and 279"
statement = "COSMO-SAC-2002 uses the truncated decimal 0.001987 kcal/(mol K) (comment: consistent with Mullins, not with CODATA); COSMO-SAC-2010 computes R from k_B, N_A and 4184 (comment cites the 2018 SI redefinition)."
scope = "COSMO1 versus COSMO3 constants"

[[convention]]
name = "hydrogen-bonding class order"
locator = "profiles/to_sigma.py lines 746-757; include/COSMO_SAC/COSMO.hpp lines 25 and 367"
statement = "In a three-profile file and in the 153-vector the order is NHB, OH, OT; the code names them NHB_PROFILE, OH_PROFILE, OT_PROFILE. A profile's position is the only marker of its class."
scope = "UD sigma3, COSMO3"

# ---------------------------------------------------------------------------
# SELECTIONS
# ---------------------------------------------------------------------------

[[selection]]
name = "compound lookup in the profile databases"
locator = "include/COSMO_SAC/profile_db.hpp lines 143-166 (VT), 258-275 (Delaware)"
rule = "An identifier is used as a key if it is one; otherwise the first row in map order whose name equals it, then whose CAS equals it; the map is ordered by zero-padded index (VT) or InChIKey (Delaware). A miss throws. Name matching is exact (case-sensitive)."
scope = "normalize_identifier for both databases"
documented = "not documented; names are unique in both lists (measured), so the first-match order only matters across the name/CAS boundary (an identifier that is both a name and a CAS of another row)."

[[selection]]
name = "which profile block the model reads"
locator = "include/COSMO_SAC/profile_db.hpp lines 299-309; include/COSMO_SAC/COSMO.hpp lines 233 and 478"
rule = "A 51-row file fills only the nhb profile; a 153-row file fills nhb, oh and ot. COSMO1 reads only the nhb profile of a compound, COSMO3 reads all three. A file of any other length throws."
scope = "all profile reads"
documented = "partly: a comment in COSMO.hpp describes the 51 and 153 cases"

[[selection]]
name = "dispersion weight sign"
locator = "include/COSMO_SAC/COSMO.hpp lines 503-520"
rule = "Weight +0.27027 by default; -0.27027 when the pair is (water, HB-acceptor-only), (water, COOH), or (COOH, NHB or HB-donor-acceptor), in either order; A = w (mean of the two e/kB minus their geometric mean); ln gamma_dsp of component 1 is A x2^2 and of component 2 is A x1^2."
scope = "COSMO-SAC-dsp, binary mixtures only"
documented = "not documented in the source; consistent with the pair-specific treatment implied by the class names"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "profiles/UD/Readme.txt line 14 versus profiles/UD"
documented = "The Readme refers to a file 'compoundlist' and says the directory contains COSMO files of 2261 compounds"
actual = "The list is complist.txt and has 2262 rows; there are 2261 .cosmo files, 2260 single-profile and 2259 three-profile .sigma files; complist row 2193 has no .cosmo file and two compounds lack .sigma or .sigma3 files"
consequence = "Counts of compounds differ by directory; a join by InChIKey loses one complist row and one or two profiles."

[[discrepancy]]
locator = "profiles/generate_all_profiles.py docstring lines 1-6 versus code"
documented = "The script grabs all cosmo files and generates split profiles by Hsieh and single profiles by Mullins; it also says single profiles are generated with the Hsieh averaging approach"
actual = "The only executed configuration writes UD/sigma3 with num_profiles 3 and averaging Hsieh; the files in UD/sigma carry averaging Mullins and r_av 0.8176, and nothing in the tree produces them"
consequence = "The single-profile UD files have no recorded generator run; their pairing with the 2002 constants rests on the meta block alone."

[[discrepancy]]
locator = "include/COSMO_SAC/profile_db.hpp lines 334-340 versus 425-429; 522-523 of COSMO.hpp"
documented = "a null dispersion energy is a missing value (comment: the null from JSON is mapped to a NaN)"
actual = "DelawareProfileDatabase stores NaN, so the dispersion contribution of any pair that contains one of the 237 sigma3 files with a null energy evaluates to NaN; DirectImport stores no value and get_lngamma_disp reads it as 0.0 through value_or"
consequence = "The same profile file gives a NaN or a finite dispersion term depending on how it is loaded."

[[discrepancy]]
locator = "README.md lines 11-13 versus profiles/VT2005"
documented = "The .cosmo files in profiles/UD and profiles/VT2005 are covered by less permissive licences; the respective README file should be consulted"
actual = "profiles/VT2005 contains no README, licence or .cosmo file: only the index, 1432 profiles and a Fortran program"
consequence = "The rights of the VT-2005 profiles are not stated anywhere in the pinned tree."

[[discrepancy]]
locator = "profiles/VT2005/COSMO-SAC-VT-2005_v2.F90 header lines 10-11 versus lines 244-250"
documented = "the program uses the COSMO-SAC model as published by Lin and Sandler 2002"
actual = "the Staverman-Guggenheim terms GAMMASG1 and GAMMASG2 are computed but the final GAMMA lines have them commented out, so the program prints the residual part only; and EPS is set to 3.667 with a comment that the published constant polarity factor corresponds to 3.68"
consequence = "The Fortran program's gamma is not the full published model; the derived alpha_prime (16466.72 to the printed digits when evaluated from the program's constants) equals the C++ COSMO1 constant."

[[discrepancy]]
locator = "profiles/UD/sigma/*.sigma lines 2-3"
documented = "'In the case of three sigma profiles, the order is NHB, OH, then OT'"
actual = "the same two comment lines are written into the single-profile files, which have 51 rows and only one profile"
consequence = "The comment lines cannot be used to tell the variants apart; only the row count and the meta keys (disp. flag absent) do."

