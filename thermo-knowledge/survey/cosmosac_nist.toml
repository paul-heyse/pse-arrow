# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "level of theory of the UD and VT-2005 profiles"
question = "Which functional, basis set and geometry-optimisation level were used for the DMol3 calculations behind profiles/UD and for the VT-2005 profiles? The .cosmo files and the Readme give only the program name, and the VT index names a pre-optimisation tool but not the quantum method."
why_it_matters = "A sigma profile is a computed quantity whose meaning depends on the method; the derivation record for 3693 profiles cannot carry a method detail the source does not hold."

[[question]]
about = "which .cosmo belongs to the 1941 UD and which to the 320 author-generated compounds"
question = "Readme.txt splits the 2261 compounds into 1941 from the University of Delaware and 320 generated by the authors; does any file, column or ordering in the tree record the split? The IDs 1931 to 1941 in complist.txt carry odd CAS tokens ('-0-1', '1-1-1' to '1-1-5'), but the tree states no link."
why_it_matters = "The two groups were produced by different procedures, so per-record provenance and the derivation input would differ."

[[question]]
about = "reading of UD/sigma by the code"
question = "Can DelawareProfileDatabase or DirectImport read a 51-row UD/sigma file? The code reads meta['disp. flag'] unconditionally, which these files lack, so the read appears to throw, but this was not executed."
why_it_matters = "If the single-profile set is unreadable by the source's own loader, it is a carried-only payload and its use with the 2002 constants is undocumented in code."

[[question]]
about = "units and meaning of VT-2005 columns"
question = "What are the pressure unit and temperature role of 'ln Pvap' and 'Temp. (K)' in the VT index, and the unit of the sigma and psigmaA columns of the VT profile files?"
why_it_matters = "The index has an apparent vapour-pressure observation with no unit; the profile columns are taken as e/A^2 and A^2 only by inference from the code."

[[question]]
about = "potential and charge units in the .cosmo segment table"
question = "What is the unit of the 'potential' column and of the 'Charge' column of the atomic data table? The header defines six of the nine segment columns, and to_sigma.py names the ninth 'potential' without a unit."
why_it_matters = "A mapping that keeps the segment table would need a unit; the survey marks these fields not stated."

[[question]]
about = "provenance of the model constants"
question = "Which publication supplies each constant of COSMO1Constants and COSMO3Constants and the 14 dispersive atom-type values? The C++ and Python code give units but no citation; the test file cites only Hsieh 2014 Table 6 for verification values."
why_it_matters = "Constants cannot be attributed to a primary source without a citation; a parameter_set would carry an unattributed origin."

[[question]]
about = "null dispersion energy next to a finite dispersion class"
question = "The 237 UD sigma3 files whose molecule has an element outside C, H, N, O, F and Cl carry a null dispersion energy but a finite dispersion class (NHB, HB-ACCEPTOR and others). Does the dsp model define a class-only contribution for them, or is the dispersion term simply undefined?"
why_it_matters = "A mapping must record the parameter as not applicable for those compounds, not as zero, and the dsp calculation for a pair that contains one of them has no defined value in either reader."
