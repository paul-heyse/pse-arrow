name = "Fortran numeric syntax"
locator = "data/thermo.inp; data/trans.inp"
statement = "thermo.inp writes numbers with the exponent letter D (1.000000000D+00); trans.inp writes E with a blank in place of the sign in the exponent for 990 of 1516 coefficient fields (0.61205763E 00). Both are readable by Fortran formatted input only; a generic parser must normalise them."
scope = "both data files"

# ---------------------------------------------------------------------------
# SELECTION RULES
# ---------------------------------------------------------------------------

[[selection]]
name = "thermo interval selection"
locator = "source/thermo.f90 lines 141-177"
rule = "idx starts at 1 and becomes i for each interval whose lower bound is below T; evaluation uses that interval's fit."
scope = "all species properties"
documented = "no: code only"

[[selection]]
name = "transport interval selection"
locator = "source/transport.f90 lines 95-101, 118-124, 141-147"
rule = "idx starts at 1 and becomes i when the upper bound of interval i-1 is below T."
scope = "viscosity, conductivity, binary interaction"
documented = "no: code only"

[[selection]]
name = "species lookup order"
locator = "source/mixture.f90 get_species (line 1236)"
rule = "A species name is searched in the product list first and then in the reactant list; the first match is used. A reactant absent from both needs a formula in the input or the run aborts."
scope = "reactants and named products"
documented = "partly: example comments say exploded formulas are taken from the thermodynamic library when not given"

[[selection]]
name = "product set"
locator = "source/main.f90 lines 293-297 and 425-427; source/mixture.f90 mixture_get_products (line 406)"
rule = "With an only list the products are exactly those names; else every product whose elements are all among the reactants' elements, less any omit list; ions appear only with the ions option (which adds E); insert lists condensed species to place in the initial set."
scope = "equilibrium products"
documented = "yes: sample comments describe only and omit"

[[selection]]
name = "transport species for mixtures"
locator = "source/equilibrium.f90 lines 5220-5330; source/transport.f90 get_mixture_transport (line 289)"
rule = "Seed from a cached component basis, then add monoatomic species and then species in decreasing abundance until 99.9999999 percent of moles are covered or 40 species are selected; species without pure transport data get estimated values; a binary entry is used only when both species are selected."
scope = "mixture viscosity and conductivity"
documented = "no: code only"

[[selection]]
name = "which database record defines a condensed substance's phases"
locator = "source/equilibrium.f90 get_species_other_phases (line 5038) and condensed checks (line 1648)"
rule = "All records of one substance that share a base name participate; the solver adds the phase that lowers the Gibbs energy most and handles phase changes by condensed-phase swapping; the final phase is the equilibrium result, not a selection by the database."
scope = "condensed products"
documented = "partly: theory.rst says there are 'additional considerations for handling phase changes'; not documented further"

