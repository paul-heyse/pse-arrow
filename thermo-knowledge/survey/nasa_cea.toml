source = "nasa_cea"
pin = "4c5c612efa20"
surveyed = "2026-09-30"

summary = "NASA CEA v3.3.4 (the 2025 Fortran rewrite of CEA2) contributes one thermodynamic database file, data/thermo.inp, with 2111 species records (1269 gas and 761 condensed-phase records for 750 condensed names as products, 81 reactant-only records; 3820 nine-coefficient NASA polynomial intervals, all with the exponent set -2 to 4), a transport database data/trans.inp with 107 entries (66 pure species, 41 binary viscosity interactions), two sample problem files (15 problems) and 14 legacy reference outputs, plus a code-defined equilibrium formulation (Gibbs minimisation with element balance for tp, hp, sp, tv, uv, sv) and rocket, shock and detonation solvers. The database is compiled to a binary thermo.lib that the solver reads, and that compile step discards the stated temperature ranges of gas species, fills a third interval by extrapolation and ignores the listed heat of formation of fitted species; it bundles no activity-coefficient, electrolyte, kinetics or fitting data, and its stated enthalpy datum is not written anywhere but is reproducible numerically (formation from the elements at 298.15 K)."

