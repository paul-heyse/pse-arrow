files = 1
bytes = 1234323
records = "2111 species records: products 2030 (gas 1269 with 2 intervals 1014 or 3 intervals 255; condensed 761 records carrying 750 distinct names), reactant-only 81 (54 with no coefficients, 18 with one interval, 9 with two); 3820 polynomial intervals in total (every interval states 7 exponents -2 -1 0 1 2 3 4); counted by parsing the file with the field widths of database_compile.f90 (formats 99001 to 99006), with zero parse anomalies"
reader = "CEA's own compiler of the file: compile_thermo_database and utherm in source/database_compile.f90 (lines 140-324), run by 'cea --compile-thermo' and during the build (README.md lines 152-164); the solver itself reads the compiled binary thermo.lib through read_thermo (source/thermo.f90 line 641), not this text file; a plain fixed-width parser reads it, and Cantera's ck2yaml.py read_NASA9_entry (line 1056) reads the same record layout"
