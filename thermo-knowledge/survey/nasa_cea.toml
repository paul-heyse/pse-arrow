# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "enthalpy and entropy datum statement"
question = "No file or document states the datum of the fits. The numbers reproduce formation enthalpies from the elements at 298.15 K and absolute entropies at 1 bar, but only by computation. Does the source intend exactly this datum for every record, including the reactant-only ones?"
why_it_matters = "An energy_reference with enthalpy formation_from_elements and entropy third_law can be attached to these data only as an inferred value; the model must label it so."

[[question]]
about = "stated temperature ranges versus the runtime grid"
question = "thermo.f90 replaces each gas record's stated interval bounds with a fixed 200-1000-6000-20000 K grid, so the first stated bound (300 K for 1024 gas records) and the last (3000 K for K2+) are lost, and a third interval is extrapolated for 1014 records. Is the listed range a recommended validity envelope, the fitted range or only a slot label?"
why_it_matters = "The envelope of a parameter set must say whether its bounds are fitted, recommended or validated (envelope_kind); here the file and the solver disagree about the bounds."

[[question]]
about = "heat-of-formation and H(298.15)-H(0) columns"
question = "The heat of formation is kept only for reactant-only records and listed in the compile report for the rest; the H(298.15)-H(0) column is read and dropped. Are these meant as cross-checks on the fits?"
why_it_matters = "They carry independent checks (the heat of formation matches the polynomial at 298.15 K for 406 of 406 records); an import that drops them loses a consistency test, one that keeps them as parameters duplicates the datum."

[[question]]
about = "phase flag stepping rule for condensed records"
question = "The condensed phase flag rises by one in most substances but by two or more in 28 records (for example 1 then 3 for ALN(cr) and ALN(L)); no comment or code states the rule, and the compiler recomputes an ordinal."
why_it_matters = "Phase order and polymorph identity are needed to build species forms and adjacent envelopes; the stepping may encode missing or merged intermediate phases."

[[question]]
about = "duplicate names"
question = "Ten condensed product names repeat (for example Co(b) below and above a lambda transition) and the reactant n-Butanol appears twice with different phase flags and heats of formation; name lookup returns the first product match and the reactant de-duplication merges same-name reactants."
why_it_matters = "Identity in the source is the name alone; several records per name are legitimate for transitions but may be data errors for n-Butanol, and one of its two records is unreachable."

[[question]]
about = "transport names not matching thermo names"
question = "Five pure transport entries (CCLF3, CCL2F2, CCL3F, CHCLF2, CHCL2F) have names that do not occur in thermo.inp, where the apparently same species are CF3CL, CF2CL2, CFCL3 and similar."
why_it_matters = "The join is by exact text; the five entries are orphans unless renamed, so any identity resolution step must decide whether they assert the same species."

[[question]]
about = "units of the transport fits"
question = "trans.inp does not state the units of exp(fit); the code treats the viscosity fit as micropoise-scale and the conductivity fit as a scale that is then divided by 1e3 to give W/m/K (equilibrium.f90 lines 5634-5635). Is the conductivity fit in microwatt per centimetre per kelvin or another unit?"
why_it_matters = "A transport parameter set needs a declared quantity type; here the unit is inferred from code comments."

[[question]]
about = "reference outputs are from a different database version"
question = "test/main_interface/reference_output/*.out print 'LAST thermo.inp UPDATE: 9/09/04' and banner CEA2 May 21, 2004, while data/thermo.inp is dated 9/8/2021 with revised ranges and added species."
why_it_matters = "These outputs cannot verify this database; they are comparison values for the solver only, and any qualification that uses them must record the mismatch."

[[question]]
about = "gas constant 8314.51 versus CODATA"
question = "The legacy gas constant 8314.51 J/kmol/K is hard-coded and is the value consistent with the heat-of-formation column; the atomic weights in atomic_data.f90 are also older than current tables. Is the compile step's use of 8314.51 the gas constant with which the published fits were produced?"
why_it_matters = "A convention_set must carry the gas constant a body of data was built with; recomputing with another value changes properties at the parts-per-million level."

[[question]]
about = "gas reactant records and the missing third fit"
question = "Seven reactant-only records with gas flag and two intervals (Air, JP-10(g) and others) are not extended to 20000 K by the compile step, and the read code allocates three fit slots for them; the third slot appears to stay zero."
why_it_matters = "If so, properties above 6000 K for those reactants are silently zero heat capacity; inferred from the code path, not executed."

[[question]]
about = "inert species and the inert elements"
question = "18 records use the elements IH, IC and IO (inert copies of H, C and O) so that an inerted fuel does not react; there is no documentation beyond the header comment of thermo.inp."
why_it_matters = "The model's element vocabulary has no inert elements; an importer must decide whether these are separate species with their own identity."
