# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "stable element reference and reference phases"
locator = "unary50.tdb:68-147 (ELEMENT), GHSER functions from :288"
statement = "Each element's energies are measured from its stable element reference: the reference phase named in its ELEMENT line, with H298-H0 and S298 of that phase given on the same line. The file expresses every other phase of an element as a polynomial added to that element's GHSER function. The file does not spell out the datum (enthalpy of the reference phase at 298.15 K taken as zero for GHSER); this is the SGTE convention inferred from the names and the ELEMENT columns. Reference phases: HCP_A3 22 elements, FCC_A1 15, BCC_A2 14, DHCP 4, RHOMBOHEDRAL_A7 3, DIAMOND_A4 2, HEXAGONAL_A8 2, and 1 each for 18 other names (including LIQUID for Hg, GRAPHITE for C, WHITE_P for P, and half-molecule gas strings for N and O)."
scope = "all FUNCTION and PARAMETER energies"

[[convention]]
name = "function naming"
locator = "unary50.tdb:288-1938"
statement = "GHSER<symbol> is the reference-phase energy of an element; G<PHASE><symbol> is the lattice stability for a named structure, where the phase part is the first three letters for LIQ, BCC, FCC and HCP and is shortened for other phases or two-letter symbols. The naming is a convention of the author and not declared in the file."
scope = "FUNCTION statements"

[[convention]]
name = "temperature ranges of expressions"
locator = "unary50.tdb (all FUNCTION and PARAMETER statements)"
statement = "Expressions are given in pieces, each with an upper limit and a Y or N flag; the first piece begins at 298.15 K for most entries, at 200, 250, 100 or 130 K for low-temperature data. Upper limits range from 1000 K to 6000 K (3000 K, 4000 K and 6000 K most common). No pressure terms occur anywhere."
scope = "all expressions"

[[convention]]
name = "units"
locator = "unary50.tdb"
statement = "No unit is stated anywhere in the file. Values are read as J/mol (energies), J/mol/K (S298), K, g/mol (masses) by the conventions of the TDB format, which the file does not repeat."
scope = "all numbers"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "unary50.tdb:68-147 (ELEMENT NP, SM) versus the PHASE statements and the header change log"
documented = "The change log states a phase name change from RHOMB to RHOMB_C19, and the PHASE statements declare ORTHO_AC (for Np) and RHOMB_C19 (for Sm)"
actual = "The ELEMENT line of Np names the reference phase ORTHORHOMBIC_AC and the ELEMENT line of Sm names RHOMBOHEDRAL_SM; neither name is a declared PHASE or appears in any parameter. Six reference names in all are not declared phases: ORTHORHOMBIC_AC, RHOMBOHEDRAL_SM, ELECTRON_GAS, VACUUM, and the gas strings 1/2_MOLE_N2(G) and 1/2_MOLE_O2(G) (the other four are the two pseudo-element references and the two half-molecule gas strings)."
consequence = "The reference phase of Np and Sm cannot be joined to a phase definition by name; for N, O, Np and Sm the reference phase has no G parameter of its own."

[[discrepancy]]
locator = "unary50.tdb:182-219 (TYPE_DEFINITION) and the PHASE statements of BCC_A2, HCP_A3, CBCC_A12, FCC_A1"
documented = "Each of these four PHASE statements lists the type characters I and a magnetic character"
actual = "Only the magnetic character (&, +, ', () is defined by a TYPE_DEFINITION; the character I is not defined in the file."
consequence = "A reader that checks type characters reports four unmatched I characters; the meaning of I is not recoverable from the file."

# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "reference-state datum"
question = "The file says nothing about the enthalpy zero of the GHSER functions. Is it H(298.15 K) of each element's reference phase exactly (so that GHSER(298.15) equals the stated H298-H0 shift), or does it include the H298-H0 given in the ELEMENT line for elements where that is non-zero?"
why_it_matters = "The energy_reference of the convention set needs the datum to be stated; the file supplies two candidate quantities and no statement."

[[question]]
about = "zero H298-H0 and S298"
question = "For 29 elements both columns are 0. Does the source mean those values are not assessed, or that they are exactly zero by definition (as for the pseudo-elements)?"
why_it_matters = "A mapping must decide between value_state known and not applicable for these element references; the file does not distinguish them."

[[question]]
about = "terms of use"
question = "The file carries no licence or copyright line and was downloaded from a members-area path of the SGTE website (from the acquisition record). What terms apply to the data, and does public availability of the file grant any?"
why_it_matters = "Rights determinations are a required part of the model's provenance; this source offers none in its bytes."
