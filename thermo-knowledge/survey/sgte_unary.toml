source = "sgte_unary"
pin = "8e38dcefbeaa"
surveyed = "2026-09-30"
summary = "The SGTE unary database version 5.0 (2 June 2009) is one TDB file that gives, for 78 elements plus the vacancy and electron-gas pseudo-elements, the Gibbs energy of each element in the 34 phases of the file relative to its stable element reference (GHSER functions and lattice-stability functions, 305 FUNCTION statements with 658 temperature pieces), 396 G parameters that assign them to phases, and 34 magnetic parameters; it states the element reference phase, mass, H298-H0 and S298 in its ELEMENT lines, states no terms of use and no statement of the reference-state datum, and uses only ordinary TDB constructs (no pressure, volume or excess terms)."

# ---------------------------------------------------------------------------
# PAYLOAD
# ---------------------------------------------------------------------------

[[payload]]
paths = ["unary50.tdb"]
format = "Thermo-Calc TDB text (see the pycalphad survey for the keyword syntax), ASCII, LF line endings, 3199 lines of which 651 start with '$' (comment) and 3042 are non-empty; a comment header gives the version and change log, then ELEMENT, SPECIES, TYPE_DEFINITION, PHASE and CONSTITUENT statements, then FUNCTION statements grouped by element, then PARAMETER statements grouped by element"
files = 1
bytes = 118145
records = "80 ELEMENT, 2 SPECIES, 34 PHASE with 34 CONSTITUENT (407 constituent entries in all), 5 TYPE_DEFINITION, 1 DEFINE_SYSTEM_DEFAULT, 1 DEFAULT_COMMAND, 305 FUNCTION (658 temperature pieces; pieces per function: 1 piece 120, 2 pieces 75, 3 pieces 68, 4 pieces 32, 5 pieces 7, 6, 7 and 8 pieces one each) and 430 PARAMETER (454 temperature pieces): G 396, TC 17, BM 15 (abbreviation of BMAGN), BMAGN 2; all 430 parameters have order 0; counted by splitting on '!' after removing '$' comments, pieces counted as ';' terminators (the parameter header's ';0' excluded)"
reader = "pycalphad's Database(path) -> read_tdb (pycalphad/io/tdb.py:953) reads it (see the pycalphad survey); or any TDB reader; a plain '!'-split is enough to count statements"
read_by_source = "none"
notes = "The file has no terms of use, copyright line or licence statement (searched for licence, copyright, permission, rights); the acquisition record names a members-area path on the SGTE website as the download URL, which the file itself does not mention. 16 comment lines begin 'Source of data' and name an assessment, an unpublished work or a published system assessment, each placed above the parameters it concerns; all other comments are banners or element headings. No parameter is repeated for the same (type, phase, constituent array, order), and every constituent of every parameter is among the listed constituents of its phase (checked by script). The shipped file is the only carrier: no other release of the database is in the pinned tree."

