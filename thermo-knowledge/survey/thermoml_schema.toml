[[construct]]
name = "Compound and RegNum"
locator = "ThermoML.xsd:264-420 (element Compound) and 641-645 (global element RegNum)"
meaning = "Identification and structure description of one material component: local index, registry number, PubChem id, standard InChI and InChIKey, organisation identifiers, CAS name, IUPAC name, common names, molecular formula, SMILES, and one of a polymer, ion, biomaterial or multicomponent-substance specialisation, a speciation state, and the samples used."
subject = "One compound, keyed inside the document by the optional nCompIndex (integer) that Property, Constraint, Variable and Component elements cite; alternatively cited by RegNum (nCASRNum integer with optional nOrgNum and sOrganization)."
fields = [
  { name = "nCompIndex", meaning = "index that links the compound to data", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "RegNum/nCASRNum", meaning = "CAS registry number as an integer (no check digit, no hyphens stated)", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "RegNum/nOrgNum and sOrganization", meaning = "registry number assigned by a named organisation", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "nPubChemID", meaning = "PubChem compound identifier", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "sStandardInChI", meaning = "Standard InChI string", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "sStandardInChIKey", meaning = "Standard InChI key", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "sOrgID (repeatable)", meaning = "identifier string plus organisation name", unit = "not applicable", shape = "table", role = "not established" },
  { name = "sCASName", meaning = "CAS name", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "sIUPACName", meaning = "IUPAC name", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "sCommonName (repeatable)", meaning = "common name", unit = "not applicable", shape = "list", role = "not established" },
  { name = "sFormulaMolec", meaning = "chemical molecular formula", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "sSmiles (repeatable)", meaning = "SMILES notation", unit = "not applicable", shape = "list", role = "not established" },
  { name = "polymer/nNumberAvgMolMass, nPeakAvgMolMass, nViscosityAvgMolMass, nMassAvgMolMass, nZAvgMolMass", meaning = "polymer molecular-mass averages, documented as kg/kmol", unit = "kg/kmol (stated in the element documentation)", shape = "scalar", role = "not established" },
  { name = "polymer/nMolarMassDispersity, nDegOfPolymerizationDispersity", meaning = "dispersity values", unit = "not stated", shape = "scalar", role = "not established" },
  { name = "ion/nCharge", meaning = "integer charge", unit = "not stated", shape = "scalar", role = "not established" },
  { name = "biomaterial/sECNumber, sPDBIdentifier", meaning = "enzyme commission number and Protein Data Bank identifier", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "MulticomponentSubstance/Component (nCompIndex or RegNum, nAmount)", meaning = "components of a defined multicomponent substance with an amount each", unit = "given by attribute compositionBasis", shape = "list", role = "not established" },
  { name = "MulticomponentSubstance/@type", meaning = "alloy, clathrate, complex, crystal or solution (5 values)", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "MulticomponentSubstance/@compositionBasis", meaning = "number of molecules, mole fraction or mass fraction (3 values); optional attribute", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "eSpeciationState", meaning = "equilibrium or single species", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "Sample (repeatable)", meaning = "samples of this compound", unit = "not applicable", shape = "table", role = "not established" },
]
origin = "authored"
conventions = "Registry number is an integer, so leading-zero and check-digit conventions are not represented; name fields are free strings with no declared naming scheme beyond the element name."
absence = "Every field is optional, including all identifiers: a Compound with no element is schema-valid. Absence is not distinguished from unknown. The documentation text \"CASRN is necessary for mixtures only\" sits on property, phase, constraint and variable identifiers, not on Compound (see the discrepancy)."
validity = "not applicable"
provenance = "Samples carry their own source and status enumerations; identifiers carry no per-value attribution."
count = "1 global element; 13 direct child elements plus a choice of 4 specialisations (polymer, ion, biomaterial, MulticomponentSubstance)"
example = "ThermoML.xsd:264-420"
candidate = "source_entity (carrier-local key nCompIndex) with identity_assertion rows per scheme (cas, inchi, inchikey, pubchem_cid, smiles, formula, name, source_local for sOrgID); ion: species with charge; polymer: polymer_type with distributed_attribute molar_mass_distribution_number and molar_mass_distribution_mass; MulticomponentSubstance: defined_mixture with mixture_component rows"
precision = "close"
loss = "CAS numbers arrive as integers and must be re-rendered with hyphen and check digit before they match an identity scheme; the polymer averages are point statistics (number, mass, viscosity, peak, Z average), not distributions, and the viscosity and peak averages have no weighting member in the model (weighting has number, mass and area); mixture_definition has by_definition and by_measurement but the substance types alloy, clathrate, complex, crystal and solution have no attribute; eSpeciationState (mixture in equilibrium of species versus a single species) has no facet; biomaterial identifiers (EC number, PDB id) have no naming_scheme."

[[construct]]
name = "Sample (purity and purification)"
locator = "ThermoML.xsd:128-172 (element Sample)"
meaning = "A physical batch of a compound: sample number, source, status, and a repeatable purity record per purification step, with purification methods, purity values with their digits in several bases, water and halide impurities and the analytical methods."
subject = "One sample, keyed in the document by nSampleNm (integer) which Component, Participant and ComponentSample elements cite."
fields = [
  { name = "nSampleNm", meaning = "sample number", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "eSource", meaning = "source of the sample: 7 values", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "eStatus", meaning = "sample status: unknown, notDescribed, previousPaper, noSample", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "purity/nStep", meaning = "purification step number (repeatable purity block)", unit = "not applicable", shape = "scalar", role = "not established" },
  { name = "purity/ePurifMethod (repeatable), sPurifMethod (repeatable)", meaning = "purification methods: 25 enumerated values or free text", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "purity/nPurityMol + nPurityMolDigits", meaning = "purity value in mole percent with significant digits", unit = "percent (mole), stated in documentation", shape = "scalar", role = "not established" },
  { name = "purity/nPurityMass + nPurityMassDigits", meaning = "purity in mass percent", unit = "percent (mass)", shape = "scalar", role = "not established" },
  { name = "purity/nPurityVol + nPurityVolDigits", meaning = "purity in volume percent", unit = "percent (volume)", shape = "scalar", role = "not established" },
  { name = "purity/nUnknownPerCent + nUnknownPerCentDigits", meaning = "purity in a percent of unspecified basis", unit = "percent (basis not specified)", shape = "scalar", role = "not established" },
  { name = "purity/nWaterMassPerCent, nWaterMolPerCent, nHalideMolPerCent, nHalideMassPerCent (each with Digits)", meaning = "water and halide impurity contents", unit = "percent, basis in the element name", shape = "scalar", role = "not established" },
  { name = "purity/eAnalMeth (repeatable), sAnalMeth (repeatable)", meaning = "analytical method used to determine purity: 24 enumerated values or free text", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "ComponentSample (nCompIndex or RegNum, nSampleNm)", meaning = "which sample of which component a multicomponent sample consists of", unit = "not applicable", shape = "reference", role = "not established" },
]
origin = "authored"
conventions = "Purity is expressed in percent (not fraction) and in one of four bases by choosing the element; each of the four basis elements is optional and they may occur together."
absence = "All purity elements are optional; a sample with eStatus unknown or noSample states no purity. The document text of \"nUnknownPerCent\" distinguishes an unspecified basis from a stated one."
validity = "not applicable"
provenance = "eSource (commercial, synthesized by authors, synthesized by others, SRM, natural product, not stated, no sample used), ePurityAnalMethod includes \"Stated by supplier\" and \"Estimated by the compiler\"."
count = "1 global element; purity block repeatable"
example = "ThermoML.xsd:128-172"
candidate = "sample (entity, purity as Fraction, purity_basis mole, mass, volume or not_stated, supplier)"
precision = "close"
loss = "Purity in percent must be divided by 100; nUnknownPerCent maps to purity_basis not_stated; the stepwise purification history, the water and halide impurity contents, several purity values per sample and the analytical method have no attribute; sample source and status enumerations have no attribute (supplier is free text)."

[[construct]]
name = "PureOrMixtureData"
locator = "ThermoML.xsd:173-461 (element PureOrMixtureData)"
meaning = "One dataset of properties of a pure compound or a mixture: the components (with samples), auxiliary substances, purpose, compiler, phases, properties, constraints, variables, numerical values and correlating equations."
subject = "A pure compound or a mixture, determined by the Component elements (one or several). Keyed in the document by the optional nPureOrMixtureDataNumber; Equation elements cite it."
fields = [
  { name = "nPureOrMixtureDataNumber", meaning = "number of the dataset", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "Component (1 to unbounded)", meaning = "component of the system: nCompIndex or RegNum, optional nSampleNm", unit = "not applicable", shape = "reference", role = "not established" },
  { name = "AuxiliarySubstance (repeatable)", meaning = "substance present with a function: eFunction (Buffer, Solvent, Inert) or sFunction, plus component and optional sample", unit = "not applicable", shape = "table", role = "not established" },
  { name = "eExpPurpose", meaning = "purpose of the measurement: principal objective, secondary purpose, identification of a synthesized compound", unit = "not applicable", shape = "enum", role = "metadata" },
  { name = "sCompiler, sContributor", meaning = "who compiled and contributed the data", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "dateDateAdded", meaning = "date added; element declared without a type", unit = "not stated", shape = "scalar", role = "metadata" },
  { name = "Property (1 to unbounded)", meaning = "a measured or evaluated quantity defined by a group, phase, presentation, reference state and uncertainty definitions", unit = "see the property-group constructs", shape = "table", role = "not established" },
  { name = "PhaseID (1 to unbounded)", meaning = "phases present in the system: ePhase (33 values), optional crystal lattice or phase description, optional component", unit = "not applicable", shape = "table", role = "not established" },
  { name = "Constraint (repeatable)", meaning = "a condition held fixed for the dataset", unit = "embedded in ConstraintType string", shape = "table", role = "not established" },
  { name = "Variable (repeatable)", meaning = "a condition that varies from point to point", unit = "embedded in VariableType string", shape = "table", role = "not established" },
  { name = "NumValues (repeatable)", meaning = "the table of numerical values", unit = "per column, from names", shape = "table", role = "not established" },
  { name = "Equation (repeatable)", meaning = "correlating equation with parameters", unit = "not applicable", shape = "table", role = "not established" },
]
origin = "authored"
conventions = "The same element serves pure compounds and mixtures: the property names do not say which, so the subject of a property follows from the number of Component elements. The documentation text \"CASRN is necessary for mixtures only\" is attached to the component reference inside property, phase, constraint and variable identifiers."
absence = "Constraint, Variable, NumValues and Equation are optional; Property and PhaseID are mandatory (at least one). A dataset with properties but no NumValues and no Equation carries no data; the schema does not forbid it."
validity = "not stated as a range; condition ranges are carried by Constraint, Variable and the EqPropRange and EqVariableRange elements of Equation."
provenance = "sCompiler, sContributor, dateDateAdded, eExpPurpose and the per-property method choice (measurement method, CriticalEvaluation or Prediction)."
count = "1 global element; 13 direct child elements"
example = "ThermoML.xsd:173-461"
candidate = "dataset (carrier, local_key from nPureOrMixtureDataNumber), dataset_component rows from Component and AuxiliarySubstance, dataset_phase rows from PhaseID, dataset_column rows from Constraint, Variable and Property, data_point and datum rows from NumValues"
precision = "close"
loss = "dataset_kind (measured, evaluated, computed, verification) is not a field: it has to be read from the Property method choice (CriticalEvaluation gives evaluated, Prediction gives computed, eMethodName or sMethodName give measured or derived). component_function has component, solvent, solute, adsorbent, adsorbate and catalyst, so AuxiliarySubstance functions Buffer, Inert and Cofactor have no member. The dataset title is absent in the schema."

[[construct]]
name = "Property (element of PureOrMixtureData) and Property-MethodID"
locator = "ThermoML.xsd:200-397"
meaning = "One reported quantity: number, the property group with its property name and method, the optional component the property refers to, the phases the property refers to, the presentation, reference state and temperature and pressure of the reference state, solvent, standard state and the uncertainty, repeatability, device-specification and curve-deviation definitions."
subject = "A property of the system of the dataset, of one component (partial, apparent, relative) or of a phase pair; keyed by nPropNumber (integer) which NumValues and Equation elements cite."
fields = [
  { name = "nPropNumber", meaning = "number of the property within the dataset", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "Property-MethodID/PropertyGroup", meaning = "choice of 11 property groups each with ePropName and a method choice", unit = "unit in the ePropName string", shape = "enum", role = "not established" },
  { name = "Property-MethodID/(nCompIndex or RegNum)", meaning = "component the property belongs to (partial molar, apparent molar, Henry constant of a solute)", unit = "not applicable", shape = "reference", role = "not established" },
  { name = "PropPhaseID (repeatable)", meaning = "ePropPhase (33 values), optional eCrystalLatticeType (7) or sPhaseDescription, optional component, optional eBioState or sBioState", unit = "not applicable", shape = "table", role = "not established" },
  { name = "ePresentation", meaning = "means of presentation of the value: 7 values (direct value, differences between upper and lower temperature or pressure, mean, difference, ratio or relative difference with the reference state)", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "eRefStateType", meaning = "type of the reference state: 12 values", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "nRefTemp + nRefTempDigits", meaning = "fixed temperature of the reference state", unit = "K (by the name of the temperature constraint; the element itself states no unit)", shape = "scalar", role = "not established" },
  { name = "nRefPressure + nRefPressureDigits", meaning = "fixed pressure of the reference state", unit = "kPa (inferred: from the Pressure, kPa names; the element itself states no unit)", shape = "scalar", role = "not established" },
  { name = "RefPhaseID", meaning = "phase of the reference state: eRefPhase (33 values), crystal lattice or description, component", unit = "not applicable", shape = "table", role = "not established" },
  { name = "Solvent", meaning = "components constituting the solvent of the property", unit = "not applicable", shape = "reference", role = "not established" },
  { name = "eStandardState", meaning = "standard state: 5 values", unit = "not applicable", shape = "enum", role = "not established" },
  { name = "CombinedUncertainty, PropUncertainty, PropRepeatability, PropDeviceSpec, CurveDev", meaning = "definitions of uncertainty assessments that the numerical values cite by assessment number", unit = "see the uncertainty constructs", shape = "table", role = "not established" },
]
origin = "authored"
conventions = "The unit of a property value is fixed by the ePropName string; ePresentation and eRefStateType then say whether the number is the property itself or a difference or ratio against the reference state."
