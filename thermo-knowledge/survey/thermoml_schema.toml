[[construct]]
name = "DataReport (root) and Version"
locator = "ThermoML.xsd:7-26 (element DataReport, complexType DataReport, Version)"
meaning = "One ThermoML document: the schema version it was written to, one citation, the compounds it uses, and datasets of pure-or-mixture data and of reaction data."
subject = "One publication. The document is keyed by nothing inside the schema; the optional Citation/TRCRefID identifies the paper (first three characters of author 1 and author 2 last names, year, conflict integer)."
fields = [
  { name = "Version/nVersionMajor", meaning = "major version of the format the instance claims", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "Version/nVersionMinor", meaning = "minor version", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "Citation", meaning = "the publication the data come from (required, exactly one)", unit = "not applicable", shape = "table", role = "metadata" },
  { name = "Compound", meaning = "zero or more compound descriptions; datasets reference them by nCompIndex or RegNum", unit = "not applicable", shape = "table", role = "not established" },
  { name = "PureOrMixtureData", meaning = "zero or more datasets of properties of a pure compound or a mixture", unit = "not applicable", shape = "table", role = "not established" },
  { name = "ReactionData", meaning = "zero or more datasets of reaction properties", unit = "not applicable", shape = "table", role = "not established" },
]
origin = "authored (schema edited with XML Spy v4.4 U by Robert D. Chirico, U. S. Department of Commerce, per the file header comment)"
conventions = "The schema annotation says \"ThermoML version 4.0\"; nVersionMajor and nVersionMinor are unconstrained integers, so the schema does not tie an instance to 4.0."
absence = "Compound, PureOrMixtureData and ReactionData are each optional (minOccurs 0), so a report may consist of a citation alone; the schema does not distinguish an empty report from one whose data were not compiled."
validity = "not stated"
provenance = "Citation is mandatory; no licence, compiler or source-status field exists at report level (sCompiler and sContributor occur per dataset)."
count = "1 root element; 1 Version, 1 Citation, 0 to unbounded of each of the three data constructs"
example = "ThermoML.xsd:8-26"
candidate = "carrier (the document), publication (its Citation), and one dataset per PureOrMixtureData or ReactionData element"
precision = "broader"
loss = "A DataReport mixes a publication, a compound table, samples and datasets; a mapping splits it. The version statement has no home other than the carrier pin."

