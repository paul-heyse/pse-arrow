[[discrepancy]]
locator = "ThermoML.xsd:307-312 (sIUPACName documentation)"
documented = "\"International Union of Physics and Applied Chemistry name\""
actual = "the element is named sIUPACName and its appinfo reads \"IUPAC name, string\""
consequence = "none for the mapping; the expansion of the abbreviation in the documentation element differs from the usual name of the organisation and is recorded as written."

[[discrepancy]]
locator = "ThermoML.xsd:219-223 (sISSN documentation)"
documented = "\"The International Standard Subscription Number\""
actual = "the element is named sISSN"
consequence = "none for the mapping; recorded as written."

[[discrepancy]]
locator = "ThermoML.xsd:5 and 13-20 (annotation and Version)"
documented = "annotation \"ThermoML version 4.0\""
actual = "nVersionMajor and nVersionMinor are unconstrained xsd:integer elements, so an instance may claim any version and still validate against this file"
consequence = "the schema version a document was written for cannot be checked from the file."

[[discrepancy]]
locator = "ThermoML.xsd:204, 356, 398, 412, 419, 439, 446 and 379 (documentation \"CASRN is necessary for mixtures only\")"
documented = "the registry number is necessary for mixtures only"
actual = "the structure offers an optional xsd:choice of nCompIndex and RegNum; nothing makes either necessary for a mixture, and RegNum may hold an organisation number instead of a CAS number"
consequence = "a mapping cannot rely on a component being identified in a mixture dataset; unresolved component references must be held, not guessed."

[[discrepancy]]
locator = "ThermoML.xsd:170-172 and 183 (nSampleNm types)"
documented = "nSampleNm is the sample number in Sample, Component and Participant"
actual = "typed xsd:integer in Sample and xsd:int in Component and Participant"
consequence = "none for values in range; a reader that validates types strictly sees two integer types for one identifier."

[[question]]
about = "property usage"
question = "Which of the 193 property names (171 pure-or-mixture, 22 reaction) occur in the ThermoML Archive, how often, and for how many compounds?"
why_it_matters = "The observable vocabulary derived from the enumeration may have large unused parts; usage counts decide which observables are worth declaring first."

[[question]]
about = "unit strings"
question = "Do instance values always carry the unit of the name, or do some files store SI values under a name whose unit suffix says otherwise?"
why_it_matters = "The schema cannot enforce the unit; a mapping factor applied to a mis-stated value silently corrupts data."

[[question]]
about = "uncertainty practice"
question = "How often are standard, expanded, repeatability, device, combined and curve-deviation entries present, and is the level of confidence a fraction or a percent?"
why_it_matters = "The model holds one uncertainty kind per datum; usage decides whether a second relation or new kinds are needed, and the confidence scale is not stated in the schema."

[[question]]
about = "temperature scale"
question = "Which temperature scale do the instance temperatures use, and is it stated anywhere?"
why_it_matters = "The schema states none; convention_set.temperature_scale would be not_stated for the whole source."

[[question]]
about = "energy datum"
question = "Do datasets of molar enthalpy, entropy and Gibbs energy state their datum in text, and is formation enthalpy meant?"
why_it_matters = "The schema has no datum element, yet the values are meaningless across datasets without one."

[[question]]
about = "standard pressure"
question = "What pressure do instance files intend for the standard states \"Pure compound\", \"Pure liquid solute\" and the molality and concentration states (101.325 kPa, 100 kPa or a saturation pressure)?"
why_it_matters = "standard_state.pressure_rule has no unstated member and the choice changes standard-state properties."

[[question]]
about = "composition and subject"
question = "How do instance files denote a pure compound measured in a mixture-named property, and how often are component references missing in mixture datasets?"
why_it_matters = "The observable subject follows from the component count; ambiguity changes the observable."

[[question]]
about = "equation definitions"
question = "What do the urlMathSource documents define for each of the ten equation names, and do parameter symbols follow a fixed order?"
why_it_matters = "The form catalogue can only be populated after the equation definitions are read; the schema states no forms."

[[question]]
about = "sample and purity"
question = "How are purification histories and multiple purity values used in practice and does nUnknownPerCent occur often?"
why_it_matters = "purity_basis not_stated and a single purity lose the history."

[[question]]
about = "CAS numbers"
question = "Are CAS numbers in nCASRNum always complete integers, and is sOrgID or nOrgNum used for compounds without CAS numbers?"
why_it_matters = "Identity resolution depends on re-forming CAS strings and on the registry vocabulary of organisation identifiers."

[[question]]
about = "instance conformance"
question = "Do the archive files validate against this schema version, and do later schema versions exist that change the enumerations?"
why_it_matters = "Only version 4.0 (by annotation) is pinned; later versions would change the vocabulary."
