source = "thermoml_schema"
pin = "5c9945ce07c2"
surveyed = "2026-09-30"
summary = "ThermoML.xsd (NIST TRC, schema annotation \"ThermoML version 4.0\") describes the measurement model of the IUPAC ThermoML exchange format: a DataReport holds a citation, compounds with samples, and datasets of pure, mixture or reaction data in which every property, constraint and variable is named by an enumeration string that embeds its unit, every numeric value carries significant digits and several typed uncertainty elements, and correlating equations are referenced by name. This survey is of the schema only: the ThermoML data archive is not acquired, so no instance file has been read and no count of instances, properties used or compounds exists. The vocabularies (64 enumerations, 743 values, 60 distinct value sets) are the main payload and are listed in full."

[[payload]]
paths = [
  "ThermoML.xsd",
]
format = "XML Schema (XSD 1.0) in namespace http://www.iupac.org/namespaces/ThermoML, UTF-8, tab-indented, 2651 lines, elementFormDefault qualified; first line comment states the file was edited with XML Spy v4.4 U by Robert D. Chirico (U. S. Department of Commerce); the only schema-level annotation reads \"ThermoML version 4.0\""
files = 1
bytes = 128779
records = "14 global element declarations, 10 named complexTypes, 11 named simpleTypes, 524 element declarations and 94 complexTypes and 64 simpleTypes in all (the last two counts include anonymous types), 64 enumerated restrictions with 743 enumeration values (60 distinct value sets), 95 documentation elements (78 distinct texts), 6 appinfo elements, 2 attributes (both on MulticomponentSubstance); counted by parsing the file with python xml.parsers.expat and xml.etree.ElementTree"
reader = "none in the tree: the pinned tree contains only the schema and no loader. Any XSD 1.0 validating parser reads it (the survey used python xml.etree.ElementTree and xml.parsers.expat); an instance document would be validated against it"
read_by_source = "none"
notes = "sha256 5c9945ce07c2a0c4d7bd249ba4d1f76b4a37eba0b872f1f1f6656b4df247ab89 (from ACQUISITION.json beside the tree); retrieved 2026-09-30 from https://trc.nist.gov/ThermoML.xsd. No xsd:key, xsd:unique, xsd:keyref, xsd:pattern, xsd:union or numeric range facet occurs, so every cross-reference (nCompIndex, nPropNumber, nVarNumber, nSampleNm, nUncertAssessNum, nPureOrMixtureDataNumber) is an unconstrained integer whose referent is not checked by the schema. Element types: 100 xsd:string, 92 xsd:integer, 64 xsd:float, 4 xsd:int, 1 xsd:double, 1 xsd:date, 1 xsd:gYear; dateDateAdded has no type at all (anyType). Every restriction is of base xsd:string."

