[[convention]]
name = "temperature and pressure units"
locator = "ThermoML.xsd: eTemperature, ePressure, nTemperature-K, nPressure-kPa"
statement = "Temperature is in kelvin and pressure in kilopascal wherever a unit is attached (the names \"Temperature, K\", \"Pressure, kPa\"; the element names nTemperature-K and nPressure-kPa in ReactionData). No temperature scale (ITS-90 or other) is stated anywhere in the schema, and absolute versus gauge pressure is not stated."
scope = "every temperature and pressure name, constraint, variable, reference state and reaction condition"

[[convention]]
name = "amount basis in names"
locator = "ThermoML.xsd: ePropName enumerations"
statement = "Amount-based and mass-based properties are separate names: molar names use mol (J/K/mol, m3/mol, kJ/mol), specific names use kg or g (J/K/kg, m3/kg, J/g), amount density is mol/m3 and mass density kg/m3, and per-volume heat capacity is J/K/m3. Mass versus amount is a property of the name, not a field."
scope = "heat capacity, volume and density, energy groups, transport groups"

[[convention]]
name = "unit prefixes differ by quantity"
locator = "ThermoML.xsd: ePropName enumerations"
statement = "Enthalpy, Gibbs energy, Helmholtz energy and internal energy are in kJ/mol, entropy and heat capacity in J/K/mol, amount concentration in mol/dm3 while amount density is in mol/m3, polymer molecular mass in kg/kmol, wavelength in nm and frequency in MHz."
scope = "unit conversion factors of the mapping"

[[convention]]
name = "composition expression"
locator = "ThermoML.xsd: eComponentComposition, eSolventComposition, Sample purity, Participant composition"
statement = "Composition is a Constraint or Variable whose type names the basis (mole fraction, mass fraction, molality, molarity, volume fraction, ratios) and whose component is given by nCompIndex or RegNum; solvent compositions are separate \"Solvent:\" names; purity is given in percent on a chosen basis (mole, mass, volume or unspecified); reaction participant composition is nNumericalComposition with a representation enumeration."
scope = "composition columns and sample purity"

[[convention]]
name = "significant digits"
locator = "ThermoML.xsd: nPropDigits, nVarDigits, nConstrDigits, nRefTempDigits, nRefPressureDigits, nPurity*Digits, nEqParDigits, nEqConstantDigits"
statement = "Every reported number is paired with an integer count of significant digits; the digits are not stated for uncertainty magnitudes, ranges or coverage factors."
scope = "values and parameters"

[[convention]]
name = "component identification in mixtures"
locator = "ThermoML.xsd: documentation \"CASRN is necessary for mixtures only\""
statement = "The documentation text on Property-MethodID, PropPhaseID, PhaseID, ConstraintID, VariableID, ConstraintPhaseID, VarPhaseID and RefPhaseID says the registry number is necessary for mixtures only. The structure offers nCompIndex or RegNum as an optional choice at each place."
scope = "component references inside identifiers"

[[convention]]
name = "version"
locator = "ThermoML.xsd:5 (annotation), 13-20 (Version)"
statement = "The schema annotation reads \"ThermoML version 4.0\". The instance Version element holds two free integers. The header comment states XML Spy v4.4 U editing by R. D. Chirico (U. S. Department of Commerce)."
scope = "the whole schema"

[[convention]]
name = "numbering of repeated phases"
locator = "ThermoML.xsd: ePhaseName"
statement = "Numbered phase names (Crystal 1 to 5, Liquid mixture 1 to 3, Solution 1 to 4, liquid-crystal numbers, Crystal of intercomponent compound 1 to 3) are labels local to a dataset."
