count = "1 element; 17 direct child elements (the temperature and pressure of the reference state count as two elements each)"
example = "ThermoML.xsd:200-397"
candidate = "dataset_column with role property: observable from ePropName through an observable_alias (carrier_scope thermoml), dataset_phase and second_phase from PropPhaseID, component from the component reference, standard_state from eStandardState, source_name the ePropName string"
precision = "close"
loss = "The model has no slot for ePresentation or eRefStateType as data on a column: the reference-dependent quantities must become distinct observables (relation facet) and ratios and temperature differences need observable identities the facets cannot express (see the mapping of ePresentation and eRefStateType). The reference temperature, pressure and phase of a reference state have no column attribute."

[[construct]]
name = "Constraint and Variable (ConstraintVariableType)"
locator = "ThermoML.xsd:408-434 (Constraint), 435-459 (Variable), 652-674 (complexType ConstraintVariableType)"
meaning = "Conditions of a dataset. A Constraint is held fixed and states its one value and digits; a Variable varies and its values are given in NumValues. Both are identified by a type chosen from seven groups of enumerated names (temperature, pressure, component composition, solvent composition, miscellaneous, bio variables, participant amount), optionally for one component, in a phase and with a solvent."
subject = "A condition of the dataset, of one component where the name is a composition; keyed by nConstraintNumber or nVarNumber (integers)."
