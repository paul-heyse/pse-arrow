  { name = "eLanguage", meaning = "language of publication: enumeration of 8", unit = "not applicable", shape = "enum", role = "metadata" },
  { name = "sDOI", meaning = "DOI", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "urlCit", meaning = "URL to the publication", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "sCASCit", meaning = "Chemical Abstracts Service citation", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "sIDNum", meaning = "identification number such as a patent or document number", unit = "not applicable", shape = "scalar", role = "metadata" },
