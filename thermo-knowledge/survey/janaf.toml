source = "janaf"
pin = "2026-09-30"
surveyed = "2026-09-30"
summary = "The NIST-JANAF Thermochemical Tables as retrieved: all 1796 tables listed by the index, plus the JSON index (janaf.json) and the formula index page (formula.html). Each table is a plain-text, tab-separated grid of eight columns against temperature (heat capacity, entropy, Gibbs energy function, enthalpy increment, enthalpy and Gibbs energy of formation, log of the formation constant) with phase-change marker rows; the files state no unit except the temperature header T(K), no edition, no uncertainty and no citation. Everything measured here is over the 1796 tables, the complete set the index lists."

[[payload]]
paths = [
  "*.txt (table files named <element>-<nnn>.txt, for example Al-001.txt)",
]
format = "plain ASCII text, LF line ends, final newline; line 1 is the title (two tab-separated fields: \"<substance name> (<formula-in-name>)\" and \"<JANAF formula>(<phase designator>)\"); line 2 is the header T(K)<tab>Cp<tab>S<tab>-[G-H(Tr)]/T<tab>H-H(Tr)<tab>delta-f H<tab>delta-f G<tab>log Kf (identical in all files); then one row per temperature"
files = 1796
bytes = 5053145
records = "85421 data rows, counted as lines after the header that are neither blank nor a lone \"+\" line; per table between 7 and 67 rows; 1796 title lines and 1796 header lines; 43 lines holding only \"+\" in 33 tables; 43 blank lines in 5 tables. Row shapes: 80993 rows with all eight cells in all 1796 tables; 1827 marker rows in 736 tables; 545 rows in 492 tables whose last three cells are one space-separated field, each directly after a marker row; 1360 rows with the temperature only in 422 tables; 518 rows with five cells and blank formation cells in 174 tables; 174 rows with six cells in 174 tables; 1 row with seven cells in 1 table (Ta-002.txt:3, log Kf blank); 3 rows with two cells in 3 tables. Counted by splitting every line on tab and on the pattern of alphabetic text"
reader = "no loader in the tree: a plain tab splitter suffices for 80993 rows, but the marker rows, the fused triple fields, the \"INFINITE\" cells and the blank cells need explicit handling"
read_by_source = "none"
notes = "Table sizes range 439 to 4963 bytes. The sidecar of each table (.response.json: final_url, status, redirects, retrieved, sha256, size, headers) agrees with the file (size and sha256 checked for all tables); the Last-Modified headers of the tables fall on 2018-09-05 between 21:03:54 and 21:04:01 GMT, that of janaf.json also on 2018-09-05 and that of formula.html on 2026-04-28 (a header fact, not an edition statement). Content-Length headers describe the transferred (compressed) bytes and differ from the file sizes in all tables. Two title fields mismatch the formula index (see discrepancy)."

[[payload]]
paths = [
  "janaf.json",
]
format = "JSON object with two keys, display and index, each an array of the same length"
files = 1
bytes = 66955
records = "1796 entries in each array, all strings; every index code is unique; the 1796 table files correspond one to one to the 1796 positions; the display string ends in the same phase designator as the title of the table in all 1796 tables"
reader = "json.load (a plain JSON parser)"
read_by_source = "none"
notes = "The index code is an element prefix, a hyphen and a three-digit number, for example Al-001; the display string is a short symbol list, the substance name and the phase designator, for example \"Al, Aluminum (ref)\". The array has no schema, no key for the JCODE of the formula index and no statement of units or editions."

[[payload]]
paths = [
  "formula.html",
]
format = "HTML page titled \"NIST-JANAF Thermochemical Tables\" / \"Formula index\" with one preformatted block (pre) of fixed-width lines, a footer loaded by script and a style sheet link"
files = 1
bytes = 156145
records = "1796 index rows in the pre block (JCODE 1 to 1796, each used once; page numbers 61 to 1856, each used once); 1750 distinct FORMULA strings, of which 35 occur more than once; header line \"JCODE FORMULA NAME ** JANAF INDEX SORTED BY FORMULA PAGE\""
reader = "a plain regular expression over the pre block (four columns: JCODE, FORMULA, NAME, PAGE)"
read_by_source = "none"
notes = "The formula index is sorted by the formula string with explicit atom counts (for example Al1Cl1F1(g)). The page column runs to 1856, which suggests page numbers of a printed edition; the file names no edition."

[[payload]]
paths = [
  "*.response.json",
]
format = "JSON sidecar per fetched file with keys final_url, headers, redirects, retrieved, sha256, size, status, url"
files = 1798
bytes = 2216058
records = "1798 sidecars (1796 tables, formula.html, janaf.json)"
reader = "json.load"
read_by_source = "none"
notes = "Acquisition metadata written by the retrieval tool, not part of the source."

