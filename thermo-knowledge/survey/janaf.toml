name = "temperature grid"
locator = "first column"
statement = "Tables start at 0 K (1763 tables) or 298.15 K (33 tables) and end at 6000 K (960 tables), 2000 K (161 tables), 1500 K (151 tables), 3000 K (140 tables), 1000 K (69 tables), 2500 K (68 tables), 4000 K (54 tables), 3500 K (27 tables); the spacing between rows is 100 K or 50 K in the tables examined by eye (Al-001, Al-002, Ba-001) and is not measured over all tables, with 298.15 K and the transition temperatures as extra rows; the two common starts are \"0, 100, 200, 250\" (1028 tables) and \"0, 100, 200, 298.15\" (696 tables)."
scope = "temperature axis"

[[convention]]
name = "number format"
locator = "all cells"
statement = "Numbers are written in fixed decimal notation with three decimals for most values, \"0.\" for zero (and \"0.000\" in 91 tables at 298.15), integers for round temperatures, three decimals for transition temperatures and 298.15 with two; 72 cells in 11 tables omit the leading zero (for example \".088\" in the H-H(Tr) column of S-016.txt; 61 of the cells are in the log Kf column)."
scope = "parsing and digits"

[[discrepancy]]
locator = "formula.html rows \"1109 C1N1O1(G)\" and \"831 E1-(ref)\" versus C-087.txt:1 and D-020.txt:1"
documented = "the formula index lists every table by formula"
actual = "the formula of C-087 is written C1N1O1(g) in the table but C1N1O1(G) (capital G) in the index, and D-020 is e1-(ref) in the table but E1-(ref) in the index; the names also differ (\"NCO Radical (NC101)\" versus \"NCO radical (NCO)\", \"Electron Gas (e-)\" versus \"Electron gas (E-)\")"
consequence = "a join on the formula string misses these two tables (2 of 1796); the other 1794 match exactly"

[[discrepancy]]
locator = "janaf.json index codes versus formula.html JCODE"
documented = "the formula index gives a JCODE for every table and janaf.json gives a code for every table"
actual = "the two codes are different schemes (index code: element prefix and sequence, for example Al-004; JCODE: integer by formula, for example 1759 for the same table Al1(cr,l)) and no file carries both; 35 formula strings are repeated in the index so a join on formula is ambiguous for them"
consequence = "there is no key shared by the index page and the table files other than the formula and name strings"

[[question]]
about = "units"
question = "What are the units of the tabulated columns and the base of log Kf?"
why_it_matters = "Nothing in the files states them; every mapping factor is an assumption until the site or publication is read."

[[question]]
about = "edition and date"
question = "Which edition and revision of the JANAF tables do these files represent, and when was each table evaluated?"
why_it_matters = "Only the Last-Modified headers (2018-09-05 for the tables) and the page title are available; evaluations differ between editions."

[[question]]
about = "uncertainty"
question = "Where do the uncertainties of the tabulated values come from?"
why_it_matters = "The tables state none; uncertainty_kind would be not_stated for every datum."

[[question]]
about = "citations"
question = "Which publications are the sources of each table?"
why_it_matters = "The files carry no citation; provenance for each table would be only the carrier."

[[question]]
about = "marker semantics"
question = "What do \"+\" rows, \"UNDEFINED\" and \"Cp LAMBDA MAXIMUM\" mean exactly, and does TRANSITION always mean a first-order change?"
why_it_matters = "They are not explained in the files and affect how rows map to phases."

[[question]]
about = "standard state"
question = "Is the standard pressure 1 bar (as the FUGACITY marker suggests) for all tables and for condensed phases?"
why_it_matters = "pressure_rule of the standard state cannot be filled from the bytes."

[[question]]
about = "extrapolation"
question = "Are the rows of a crystal table beyond its melting point (Al-002 above 933.45 K) metastable extensions or extrapolations?"
why_it_matters = "Validity envelopes per phase depend on it."

[[question]]
about = "reference of Tr"
question = "Is Tr = 298.15 K the only reference temperature, and is the enthalpy datum of the compound tables the formation enthalpy at 298.15 K?"
why_it_matters = "convention_set.energy_reference.temperature and datum depend on it."

[[question]]
about = "duplicates"
question = "Are the values in the cr, l and cr,l tables of one substance identical where they overlap, and which table should a mapping prefer?"
why_it_matters = "The same substance data appear in up to four tables (ref, cr, l, cr,l and g for aluminium) and a snapshot must choose."
