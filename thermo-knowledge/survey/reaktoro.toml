# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "standard states by aggregate state"
locator = "Reaktoro/Models/ActivityModels/ActivityModelIdealAqueous.cpp, ActivityModelIdealGas.cpp, ActivityModelHKF.cpp; Core/StandardThermoProps.hpp"
statement = "G0 and H0 of a species are the standard molar Gibbs energy and enthalpy 'of formation' in J/mol (the HKF and mineral parameters call them apparent). Aqueous solutes: ln a = ln m in the molality scale with water in the mole-fraction scale (unsymmetric), reference the hypothetical unit molality ideal solution (inferred from the ideal model); gases: ln a = ln x + ln(P/bar), ideal gas at 1 bar; minerals and condensed species: pure phase, activity by mole fraction. The standard state pressure is 1 bar (100000 Pa) in the Reaktoro models and 101325 Pa in PHREEQC-derived reaction models. The code states none of this in a docstring."
scope = "all species and phases"

[[convention]]
name = "units"
locator = "Reaktoro/Common/Constants.hpp; Core/StandardThermoProps.hpp"
statement = "Quantities are SI: J/mol, J/(mol K), m3/mol, Pa, K, kg/mol for molar masses; the gas constant is 8.3144621 J/(mol K), the Faraday constant 96485.3329 C/mol, the calorie 4.184 J, the atmosphere 101325 Pa, the bar 1e5 Pa; database files state no units and the ExtendedUNIQUAC Gr, Hr use kJ/mol. Water functions work per kg; HKF parameters are in J and Pa (converted by the generator from cal and bar)."
scope = "all models and database files"

[[convention]]
name = "conserved quantities: elements and charge"
locator = "Reaktoro/Core/ChemicalSystem.cpp (formula matrix, lines 72-251)"
statement = "The formula matrix has one row per element of the system plus a final row of species charges; elements come from species Elements strings, charge from Charge; balance constraints in equilibrium are on elements and optionally charge (EquilibriumSpecs charge). Element molar masses come from the database Elements section or the built-in table."
scope = "chemical systems"

[[convention]]
name = "phases defined from species"
locator = "Reaktoro/Core/Phases.cpp GeneralPhase::convert (line 160)"
statement = "A phase is defined by a name, an aggregate state, optional extra aggregate states, an activity model generator and a species selection: explicit names, or element symbols (the system's elements by default), minus species carrying excluded tags; species come from the database's species with that aggregate state. A phase has a single aggregate state family and one activity model (chained models count as one)."
scope = "phase construction"

[[convention]]
name = "species name and state uniqueness"
locator = "Reaktoro/Core/Database.cpp addSpecies (line 124)"
statement = "Names must be unique among species with the same aggregate state; a repeated name gets '!' appended with a warning; species with undefined aggregate state become Aqueous; names are matched literally, not through formulas, except in helper lookups by formula."
scope = "databases"

[[convention]]
name = "sign of reaction coefficients"
locator = "Reaktoro/Core/FormationReaction.cpp (comment in calcfn, about line 84)"
statement = "In a FormationReaction a positive coefficient marks a reactant on the left-hand side and a negative one a product; the defined species is the product; the equilibrium constant is for formation of the species from the reactants."
scope = "formation reactions"

# ---------------------------------------------------------------------------
# SELECTION
# ---------------------------------------------------------------------------

[[selection]]
name = "database choice and species data"
locator = "Reaktoro/Core/Database.cpp; Extensions/*/ *Database.cpp"
rule = "A database is chosen by name from a closed list per family (SupcrtDatabase: 8 names; NasaDatabase: nasa-cea; PhreeqcDatabase: 14 names; ThermoFunDatabase: 7 names; Database::embedded: a file name under databases/reaktoro) or by path; there is no merging across databases except ThermoFunDatabase::fromFiles and Database::addSpecies on a built object; within one database each species has exactly one standard-state model."
scope = "species data"
documented = "yes: the error messages list the supported names (with two name typos noted in the payloads)"

[[selection]]
name = "species of a phase"
locator = "Reaktoro/Core/Phases.cpp lines 160-190"
rule = "From the database species with the phase's aggregate state (plus any additional states), keep those with the given names, else those whose elements are within the given element symbols (else the system elements), then drop species having any excluded tag; an empty result is an error."
scope = "phase construction"
documented = "partly: the header comments describe Speciate and Exclude; the combination order is code only"

[[selection]]
name = "activity model application order"
locator = "Reaktoro/Core/ActivityModel.cpp chain (line 22); dissolved-gas models"
rule = "Chained models run in list order on one ActivityProps object, each overwriting the entries it computes; dissolved-gas models (Setschenow, Drummond, DuanSun, Rumpf) read the AqueousMixtureState exported by an earlier aqueous model in props.extra and raise an error when it is absent; PhreeqcIonicStrengthPressureCorrection must be last."
scope = "aqueous phases with gas models"
documented = "yes: the header example shows chain(Pitzer, PhreeqcIonicStrengthPressureCorrection)"

[[selection]]
name = "model choice by name in a data file"
locator = "StandardThermoModelFromData.cpp line 25; ReactionStandardThermoModelFromData.cpp"
rule = "The single key of a StandardThermoModel or ReactionStandardThermoModel map names the model; more than one key is an error; an unknown name is an error."
scope = "database loading"
documented = "no"

[[selection]]
name = "duplicate PHREEQC species"
locator = "Reaktoro/Extensions/Phreeqc/PhreeqcDatabase.cpp helper addSpecies"
rule = "A species with the same name and aggregate state as one already created is not created again (the first wins); products are created depth-first so a reactant is created before its product."
scope = "PHREEQC import"
documented = "partly: code comments only"

[[selection]]
name = "solvent and water model of a ThermoFun database"
locator = "Reaktoro/Extensions/ThermoFun/ThermoFunEngine.cpp (line 59)"
rule = "The engine solvent is set to the symbol H2O@ for every ThermoFun database; the water equation of state and dielectric models are those listed on that record; gas species get V0 = 0 regardless of the record."
scope = "ThermoFun-derived species"
documented = "partly: one code comment"

[[selection]]
name = "catalyst absence in the Palandri-Kharaka model"
locator = "ReactionRateModelPalandriKharaka.cpp lines 41-50 and 66-75"
rule = "A catalyst whose species is not in the system contributes a factor 1 without a warning (the warning is commented out), so the mechanism stays active but uncatalysed."
scope = "mineral dissolution rates"
documented = "no"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "Reaktoro/Core/Support/DatabaseParser.cpp createFormationReaction (line 220) versus Serialization/Core.cpp FormationReaction encode (line 128)"
documented = "A FormationReaction may carry a StandardVolumeModel (the encoder writes it)."
actual = "The decoder does not read StandardVolumeModel (the call is commented out), so a round trip through YAML loses the product volume."
consequence = "A formation-reaction species loaded from a file has zero standard volume; volume-dependent results differ from the in-memory object."

[[discrepancy]]
locator = "embedded/params/CubicEOS.json and Reaktoro/Models/ActivityModels/Support/CubicEOS.cpp"
documented = "The file lists the constants of five cubic EoS and one BIP model."
actual = "No code reads the file; the constants are hard-coded."
consequence = "The file may diverge from the code without any check; it cannot be taken as authority."

[[discrepancy]]
locator = "Reaktoro/Models/ActivityModels/ActivityModelVanLaar.hpp and .cpp"
documented = "The header documents a Van Laar activity model for solid solutions with parameters a and W."
actual = "The header and the source define no function (everything is commented out) and the equations are marked 'todo'."
consequence = "Van Laar is listed among models but is not available."

[[discrepancy]]
locator = "embedded/databases/phreeqc/*.dat versus phreeqc pin database directory"
documented = "The files are named after the PHREEQC distribution databases."
actual = "phreeqc.dat, pitzer.dat and Amm.dat are older revisions, sit.dat is 829 lines shorter, and six further files have the same line count but 800 to 4800 lines whose content differs."
consequence = "Numbers taken from a Reaktoro copy cannot be assumed equal to those of the pinned PHREEQC distribution."

[[discrepancy]]
locator = "embedded/databases/supcrt/*.xml versus embedded/databases/reaktoro/supcrt*.json"
documented = "Both serialise the SUPCRT98 and SUPCRT07 databases."
actual = "Species counts differ (supcrt98 976 against 983; supcrt07 1010 against 1018; supcrt07-organics 1925 against 1920) and the XML has Dissociation, acentric factor and temperature-range data that the JSON lacks; no code reads the XML."
consequence = "The XML is stale or extra data; content present only there is unused."

[[discrepancy]]
locator = "Reaktoro/Extensions/Nasa/NasaDatabase.cpp and embedded/databases/nasa/burcat.dat"
documented = "The NASA directory embeds both cea.dat and burcat.dat."
actual = "Only the name nasa-cea is accepted and only cea.dat is converted; burcat.dat has no loader; cea.dat is the 2004 CEA library (9/09/04) while the pinned NASA CEA data file is dated 9/8/2021 and holds 25 more species."
consequence = "NASA data in Reaktoro is older than the pinned CEA and excludes the Burcat database."

[[discrepancy]]
locator = "Reaktoro/Extensions/ThermoFun/ThermoFunDatabase.cpp lines 133-153"
documented = "The error message names files 'psinagra-thermofun.json' and 'slop98-thermofun.json' for the names psinagra-12-07, slop98-organic and slop98."
actual = "The names map to psinagra-12-07-thermofun.json, slop98-organic-thermofun.json and slop98-thermofun.json; the ThermoHub datasets mines19 and slop16 are not offered."
consequence = "Messages mislabel files; newer datasets from the mirror are not reachable by name."

[[discrepancy]]
locator = "Reaktoro/Water/WaterInterpolation.cpp line 243"
documented = "waterThermoPropsWagnerPrussInterp takes a StateOfMatter and the table is called one per state."
actual = "The parser ignores the state (TODO) and a single table serves every state."
consequence = "Vapour requests interpolate in the liquid and supercritical table."

[[discrepancy]]
locator = "embedded/databases/reaktoro/supcrt*.yaml versus .json"
documented = "The YAML and JSON files are two formats of one database."
actual = "As parsed by a YAML 1.1 parser the twins differ in one species per file (2e-08 read as text) and in the formula NO of supcrtbl (read as false); a YAML 1.2 reader is needed for equality."
consequence = "Loaders other than yaml-cpp can misread the YAML twins; JSON is safe."

[[discrepancy]]
locator = "StandardThermoModelHollandPowell.hpp comments versus supcrtbl JSON"
documented = "The code comments say the Landau data in SUPCRTBL (critical temperature, Smax, Vmax) is from HP98 and not actually used."
actual = "17 records of supcrtbl and supcrtbl-organics carry Tcr, Smax and Vmax that the decoder drops."
consequence = "Phase-transition contributions of those 17 minerals are missing from the evaluated properties."

