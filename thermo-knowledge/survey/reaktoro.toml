source = "reaktoro"
pin = "3c5838e7c0ed"
surveyed = "2026-09-30"
summary = "Reaktoro v2.13.0 contributes 61 embedded data files (36.5 MB) in six database families with no Elements section and no formation reactions in its own format (nasa-cea 1658 species; SUPCRT98, SUPCRT07, SUPCRT16 and SUPCRTBL, each plain and with organics, 983 to 2029 species; four Extended UNIQUAC species sets of 40 to 91 species), 14 PHREEQC .dat files read through an embedded PHREEQC engine, 7 ThermoFun JSON files byte-identical to ThermoFun's, parameter files for Pitzer (266 parameter rows), Extended UNIQUAC (four layouts), Palandri-Kharaka mineral rates (73 minerals, 149 mechanisms) and cubic EoS, and a 2180-row water property table; its C++ code implements 23 activity-model files (chained through a shared props object), 9 standard-thermo model names plus a data dispatcher, 4 reaction-thermo model names, one rate model, three surface-area models, water EoS and Johnson-Norton electrostatics, and a Gibbs minimiser with six specification sets, kinetics and on-demand-learning solvers; it carries no mixture interaction data beyond Pitzer and Extended UNIQUAC and no data for cubic binary parameters except four PHREEQC pairs, and the JSON databases hold exactly one standard-state model per species."

