[[construct]]
name = "database document"
locator = "Reaktoro/Core/Support/DatabaseParser.cpp Impl::Impl (line 51); Serialization/Core.cpp Database encode (line 64)"
meaning = "A database file is a document with an optional Elements section and a required Species section; Species is a map (name to record) or a list of records; YAML and JSON are read by the same parser."
subject = "one database; species are keyed by unique Name within one aggregate state"
fields = [
  { name = "Elements", meaning = "optional map symbol -> {MolarMass, Name, Tags} or list of {Symbol, MolarMass, Name, Tags}; absent in all 13 data files that Reaktoro ships in its own format", unit = "MolarMass in kg/mol (inferred from the built-in table, in kg/mol)", shape = "table", role = "input" },
  { name = "Species", meaning = "map name -> species record, or list of records (the Extended UNIQUAC files use lists)", unit = "not applicable", shape = "table", role = "input" },
]
origin = "generated (for nasa-cea and SUPCRT files by utilities scripts) or authored (Extended UNIQUAC files)"
conventions = "an element not declared in Elements is created from the built-in element table on first use in a species; the section order is irrelevant"
absence = "missing Elements means 'use defaults'; a species missing Formula, AggregateState, Elements or both FormationReaction and StandardThermoModel is an error; Elements: null is required for species without elements (the electron)"
validity = "not stated; Tmax fields in models"
provenance = "none in JSON/YAML databases; the Extended UNIQUAC files have header comments citing the source tables"
count = "9 JSON/YAML pairs plus 4 Extended UNIQUAC YAML files plus 7 ThermoFun JSON files that are not in this format"
example = "embedded/databases/reaktoro/supcrt98.json"
candidate = "chemical_system, parameterization, convention_set"
precision = "close"
loss = "The file carries no identity, version, convention or provenance statement; the parameterisation and system have to be named by the loader from the file name."

[[construct]]
name = "species record"
locator = "Reaktoro/Core/Support/DatabaseParser.cpp addSpecies (line 146); Serialization/Core.cpp Species encode (line 173)"
meaning = "A chemical species (name, formula, elemental composition, charge, aggregate state, tags) with its standard-state thermodynamics given either directly by a StandardThermoModel or through a FormationReaction from other species."
subject = "one species form; keyed by Name (unique among species of the same aggregate state: a repeat gets a '!' appended with a warning)"
fields = [
  { name = "Name", meaning = "unique key, often carrying the state suffix: H2O(aq), CO2(g); mineral names may contain commas (Albite,low)", unit = "not applicable", shape = "scalar", role = "input" },
  { name = "Formula", meaning = "chemical formula text, parsed by ChemicalFormula; charge is not read from it", unit = "not applicable", shape = "scalar", role = "input" },
  { name = "Substance", meaning = "optional name of the substance the species belongs to; read when present; absent in every shipped file", unit = "not applicable", shape = "scalar", role = "input" },
  { name = "Elements", meaning = "string of 'count:symbol' pairs separated by spaces (2:Ca 1:Mg 2:Si 7:O); null for species without elements", unit = "stoichiometric count", shape = "scalar", role = "input" },
  { name = "Charge", meaning = "net charge number; absent means zero (present in 9602 of 13008 species)", unit = "charge number", shape = "scalar", role = "input" },
  { name = "AggregateState", meaning = "string parsed by parseAggregateState: Gas, Liquid, Solid, Plasma, CondensedPhase, Fluid, LiquidCrystal, CrystallineSolid, AmorphousSolid, Vitreous, Adsorbed, Monomeric, Polymeric, SolidSolution, IonExchange, Aqueous or the short symbols g, l, s, pl, cd, fl, lc, cr, am, vit, ads, mon, pol, ss, ex, aq", unit = "not applicable", shape = "enum", role = "input" },
  { name = "Tags", meaning = "string split on spaces or list of strings; used to exclude species from phases", unit = "not applicable", shape = "list", role = "input" },
  { name = "StandardThermoModel", meaning = "map with exactly one key (the model name) mapping to that model's parameters", unit = "see model families", shape = "table", role = "input" },
  { name = "FormationReaction", meaning = "map {Reactants: 'coeff:name ...', ReactionStandardThermoModel: {...}, StandardVolumeModel written by the encoder but not read}", unit = "see the formation reaction construct", shape = "table", role = "input" },
]
origin = "transcribed (SUPCRT92 slop98/07/16 files, SUPCRTBL, NASA CEA; see the lineage payload), authored (Extended UNIQUAC)"
conventions = "aggregate states found in data: Aqueous 9386, Solid 1835, Gas 1454, CondensedPhase 277, Liquid 56 (13008 species); species with undefined state become Aqueous when added; Charge and Elements together define the conserved quantities (elements plus charge row of the formula matrix); the species Name, not the Formula, is the key"
absence = "no Charge means neutral; StandardThermoModel and FormationReaction are exclusive; a species without either is rejected"
validity = "model-specific Tmax (optional) in K"
provenance = "none per species in the JSON files; the linearized lineage files have trailing comments with references and dates"
count = "13008 species over 9 JSON files (1658 NASA, 11350 SUPCRT family) plus 265 in the Extended UNIQUAC YAML files"
example = "embedded/databases/reaktoro/supcrt98.json#/Species/Akermanite"
candidate = "species_form, species, composition, aggregation"
precision = "close"
loss = "Formula plus Charge plus Elements is stored redundantly; no structure identifiers, so identity resolution has to work from the formula, charge and aggregate state; the species Name carries the aggregate suffix in some databases and not in others."

[[construct]]
name = "StandardThermoModel block"
locator = "Reaktoro/Models/StandardThermoModels/StandardThermoModelFromData.cpp (line 25); Serialization/Models/StandardThermoModels.cpp"
meaning = "A standard-state model of a species as a single-key map {model name: parameter record}; nine model names exist and six occur in shipped data."
subject = "one species form"
fields = [
  { name = "MaierKelley", meaning = "Gf, Hf, Sr, Vr, a, b, c, Tmax (Tmax optional)", unit = "J/mol, J/mol, J/(mol K), m3/mol, J/(mol K), J/(mol K^2), (J K)/mol, K", shape = "table", role = "input" },
  { name = "MineralHKF", meaning = "Gf, Hf, Sr, Vr, ntr, a[], b[], c[], Ttr[], Htr[], Vtr[], dPdTtr[], Tmax; arrays have ntr+1 entries for a, b, c and ntr for the transition arrays", unit = "SI; Vtr in m3/mol and dPdTtr in Pa/K", shape = "table", role = "input" },
  { name = "HKF", meaning = "Gf, Hf, Sr, a1, a2, a3, a4, c1, c2, wref, charge, Tmax (Tmax optional; charge required)", unit = "J/mol, J/mol, J/(mol K), J/(mol Pa), J/mol, (J K)/(mol Pa), (J K)/mol, J/(mol K), (J K)/mol, J/mol", shape = "table", role = "input" },
