# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "interaction of Elements-less databases with the built-in element table"
question = "Which atomic-weight edition do the 120 built-in molar masses follow, and does the SUPCRT XML element list (116 elements, units g/mol) agree with them?"
why_it_matters = "Molar masses fix mass-based quantities; the convention set of every Reaktoro-format database inherits this unstated edition."

[[question]]
about = "units of the nasa-cea polynomial coefficients b1 and b2 and of dHf"
question = "Are b1 (K) and b2 in the NASA convention (enthalpy constant in kelvin, entropy constant dimensionless) and is dHf in J/mol as the parameter docs say, given that the converter is not recorded?"
why_it_matters = "A mapping to the model's nasa forms needs the exact coefficient meaning."

[[question]]
about = "kij of the four PHREEQC pairs and critical properties in CriticalProps.cpp"
question = "What are the published sources of the 89 critical-property entries (the working sheet and a PDF of Isidoro Martinez are in resources/data but not linked)?"
why_it_matters = "These are the only pure-component critical data bundled with Reaktoro; provenance is needed to reuse them."

[[question]]
about = "PHREEQC databases: content differences against the PHREEQC pin"
question = "What exactly differs in the 800 to 4800 lines of iso, llnl, minteq, minteq.v4, Tipping_Hurley and wateq4f that have equal non-comment line counts (number formatting, edited values, or column layout)?"
why_it_matters = "Whether Reaktoro's species data equal the original distribution matters for any cross-source agreement check."

[[question]]
about = "which species of the Pitzer file are cations, anions or neutral"
question = "Does the model classify species by charge only, so that a neutral-neutral interaction (Mu) can be given? The shipped file has none."
why_it_matters = "Some entries of nested arity are absent from the data, and the transposition rules for the arity-3 sections depend on the classification."
