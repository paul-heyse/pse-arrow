[[construct]]
name = "thermodataset file header"
locator = "Resources/databases/*.json#/thermodataset, #/datasources, #/date; Database.cpp Impl::fromFile"
meaning = "The dataset label (for example aq17-gem), the list of source labels the dataset was assembled from (a web address and bibliographic short names such as [2017MIR/WAG]) and the export timestamp."
subject = "one dataset (a file); keyed by its thermodataset string, which is not unique across files (aq17-thermofun.json and water-thermofun.json both say aq17-gem; the slop98 file says slop98-inorganic)"
fields = [
  { name = "thermodataset", meaning = "dataset label", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "datasources", meaning = "short names of the literature and web sources behind the dataset", unit = "not applicable", shape = "list", role = "metadata" },
  { name = "date", meaning = "export timestamp", unit = "not stated", shape = "scalar", role = "metadata" },
  { name = "conventions", meaning = "optional object; only water_triple_point_reference is read (HKF_HGK_1974, NEA_HGK or NEA_IAPWS)", unit = "not applicable", shape = "table", role = "input" },
]
origin = "generated (exported from the ThermoHub database by thermohubclient; the tool version is not recorded in the file)"
conventions = "none stated in the file; the default water_triple_point_reference is HKF_HGK_1974 (Database.h)"
absence = "conventions is absent from all 7 main files, so the default applies silently"
validity = "not stated"
provenance = "datasources lists source labels for the whole dataset only; per-record datasources exist on substances and reactions"
count = "8 headers in Resources/databases (7 datasets and the misc water file); thermodataset values: aq17, cemdata18, heracles, mines16, psinagra-12-07, slop98-inorganic, slop98-organic, aq17-gem"
example = "Resources/databases/psinagra-12-07-thermofun.json#/thermodataset"
