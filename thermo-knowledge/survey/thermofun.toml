[[question]]
about = "gas-phase water record in heracles-thermofun.json (symbol H2O, class SC_GASFLUID, AS_GAS, methods water_eos_hgk84_reaktoro and fug_critical_param, both with empty blocks)"
question = "How does the engine evaluate this record? Class is not SC_AQSOLVENT, genEoS is unset (so isH2Ovapor is false), the T slot holds a water equation-of-state code that the non-solvent branch does not handle, and the P slot holds the gas code that has no case."
why_it_matters = "It is the only water vapour record in the datasets; if it evaluates to undefined properties, gas-phase water has no thermodynamics in ThermoFun data."

[[question]]
about = "twelfth coefficient in m_heat_capacity_ft_coeffs (1048 blocks) and eighth value in eos_hkf_coeffs (2009 blocks)"
question = "What do these extra values mean? They have no name and no unit and are never read; the twelfth is zero in every block."
why_it_matters = "Format drift from an earlier schema; a loader must either drop or carry them, and dropping must be recorded."

[[question]]
about = "limitsTP of reactions (lowerP 0.1, upperP 1000000, range false) and the substance-level limitsTP that the reader looks for"
question = "In which unit are the pressure limits stated, and what does range=false mean? The ThermoHub dataset records give upperP 500000000 with upperT 1273.15 for the HKF datasets (inferred: Pa, which would be 5 kbar), but the file itself states no unit."
why_it_matters = "These are the only stated validity limits for reactions, and the engine ignores them; the envelope for a parameter set cannot be recovered without the unit."

[[question]]
about = "ThermoFun 'errors' arrays"
question = "What statistic does an error denote, and is the zero that appears in 322 of the 331 aq17 sm_ errors arrays a true zero or an unknown?"
why_it_matters = "Uncertainty is a declared kind in the model; loading the zeros as stated uncertainties would assert precision the sources do not claim."

[[question]]
about = "the status code {3: CALCULATED} in test fixtures (548 occurrences)"
question = "Which properties are marked calculated and with which method? The fixture databases come from a newer exporter that also writes conventions."
why_it_matters = "It is the only trace of value provenance inside the format; it is unread by the code in this pin."
