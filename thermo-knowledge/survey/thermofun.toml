# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "substances m_expansivity and m_compressibility; ParseJsonToData.cpp read_value_unit lines 150-180; SolidMurnaghanHP98.cpp lines 15-16"
documented = "The units arrays say m_compressibility is in 1e-05/K and m_expansivity is in kbar."
actual = "m_compressibility holds a bulk modulus in kbar (values up to 5800, 9 zeros) and m_expansivity holds an expansivity in 1/K (values 5e-6 to 2.7e-4); the reader has 'temporary fixes' that relabel the units and multiplies expansivity by 1e5 on reading and by 1e-5 in the models, so the net number is the stored one."
consequence = "A reader that trusts the unit strings would convert the wrong physical quantity; a mapping must key the quantity by the code's use, not by the field name or unit."

[[discrepancy]]
locator = "substances TPMethods eos_hkf_coeffs; ParseJsonToData.cpp read_values_units lines 125-147"
documented = "The block declares 7 names and 6 units."
actual = "All 2009 blocks carry 8 values; the third unit label '(cal*K)/mol' is overridden by the reader with the expected '(cal*K)/(mol*bar)' ('temporary fix for bad data'); the eighth value is never read."
consequence = "The unit strings of the HKF block are unreliable; the reader's unit list, not the record's, states the units."

[[discrepancy]]
locator = "Substances/EmpiricalCpIntegration.cpp line 155 versus lines 215-235"
documented = "Unit strings and the integrals in the same file give the a9 term as T^0.5."
actual = "The heat-capacity value is computed with pow(TK, (1 / 2)), integer division, which is T^0, so the a9 term adds a9 rather than a9 sqrt(T) to Cp while H, S and G integrate a sqrt(T) term; a9 is nonzero in one block of 2049."
consequence = "Cp and the integrated properties are inconsistent for records with a nonzero a9; effect confined to one block in these data."

[[discrepancy]]
locator = "ThermoEngine.cpp thermoPropertiesReaction (line 670, CTPM_REA case at line 684) versus reactions TPMethods lists"
documented = "The data list three methods per reaction: logk_fpt_function, then logk_3_term_extrap (447) or logk_nordstrom_munoz88 (18), then dr_volume_constant."
actual = "The logk_fpt_function entry makes the engine use the 7-term analytic form; the 3-term extrapolation and Nordstrom-Munoz entries have no effect on evaluation when logk_fpt_function is present and carry no parameters themselves."
consequence = "The method name in the record (for example logk_3_term_extrap) does not say what is evaluated; the coefficients that are used sit on a different entry."

[[discrepancy]]
locator = "status arrays in pytests/*.json versus Common/ThermoScalar.hpp lines 28-35"
documented = "Fixture property blocks have a status list such as [{3: CALCULATED}]."
actual = "The status is never read; the run-time enum has notdefined 0, read 1, calculated 2, assigned 3, initialized 4, outofbounds 5, so the code 3 in the fixtures would denote 'assigned' if it were the same numbering; the JSON name says CALCULATED."
consequence = "Status codes cannot be mapped to provenance; they are not evidence for which values were computed."

[[discrepancy]]
locator = "GlobalVariables.h substance_method_parameters versus data: solute_eos_ryzhenko_gems"
documented = "The code maps solute_eos_ryzhenko_gems to the block dr_ryzhenko_coeffs (3 values) and reads it with unit list 1, 1, 1."
actual = "The ThermoHub export attaches dr_marshall_franck_coeffs (12 values, 32 reactions) to method 10; the fixture in pytests/Reactions carries dr_ryzhenko_coeffs."
consequence = "A record of method 10 may hold parameters of a different equation than the method implies; the engine branch for this method is commented 'NOT TESTED'."

[[discrepancy]]
locator = "Database.cpp Impl::fromFile; files misc/water-thermofun.json"
documented = "A database is a map from symbol to record."
actual = "The misc water file has two substance records with symbol H2O@; the map keeps the later one; thermodataset, datasources and date are read by no code."
consequence = "Duplicated symbols lose records silently; file-level identity is not available to the engine."

