# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "reference state and apparent properties"
locator = "ThermoEngine.h EngineConventions; ThermoEngine.cpp toBermanBrown (line 138), toSteamTables (line 129)"
statement = "Stored G0, H0, S0, Cp0, V0 are taken at Tst = 298.15 K and Pst = 100000 Pa; by default they are treated as apparent (Benson-Helgeson) properties; Berman-Brown conversion and steam-table water properties are optional post-processing. The JSON does not say whether the G0 of an element or species is a formation energy or an apparent energy, and the record of H+ is replaced by zero in all properties."
scope = "all substance records"

[[convention]]
name = "standard states by class"
locator = "not stated in the JSON; inferred from Substances/ code and GlobalVariables.h enums"
statement = "No standard state or concentration scale is stated in the records. The code treats SC_AQSOLUTE species with HKF or density models as solutes referred to a solvent (default solvent record H2O@), SC_AQSOLVENT as water whose properties come from an equation of state, SC_GASFLUID with pressure correction optional (ideal gas at Pst unless the flag or an EoS is used) and SC_COMPONENT as a pure phase. The ThermoHub export adds a standard_cscale field (CS_MOLALITY) on 1456 records that ThermoFun JSON lacks. (inferred: from code paths and Reaktoro HKF usage)"
scope = "substance records"

[[convention]]
name = "unit strings and their conversion"
locator = "ThermoFun/Common/Units.cpp; ParseJsonToData.cpp read_values_units (line 125), read_value_unit (line 150), readValueErrorUnit (line 72)"
statement = "Every numeric property is converted from the unit string in the record to an engine unit through a built-in unit table (SI and common units; a unit string may carry a numeric prefix such as 1e-05/K); with no unit string the engine unit is assumed; array blocks are converted element by element with the engine unit list, padding missing entries with the dimensionless unit. Main databases use one spelling per property (J/mol, J/(mol*K), J/bar); fixtures mix J/(K*mol), kJ/mol and cal/mol."
scope = "all property blocks"

[[convention]]
name = "temperature, pressure and amount units of the engine"
locator = "ThermoModelsSubstance.cpp (conversions at each model entry); GlobalVariables.h"
statement = "The engine takes T in K and P in Pa at its interface and converts to bar inside most models (P / bar_to_Pa with bar_to_Pa = 1e5), to degC inside the GEMS HKF implementation; volumes are J/bar (1 J/bar = 10 cm3/mol); the gas constant is 8.31451 J/(mol*K); the calorie is 4.184 J."
scope = "all evaluations"

[[convention]]
name = "water triple-point references"
locator = "GlobalVariables.h waterTripleData; Database.h DatabaseConventions"
statement = "Three sets of water triple-point properties (HKF_HGK_1974 from Helgeson and Kirkham 1974 p. 1098, NEA_HGK, NEA_IAPWS) make the water equation-of-state properties consistent with the geochemical G0 of liquid water (for example -237140 versus -237181 J/mol as stated in the code comment); the dataset selects one through conventions.water_triple_point_reference, default HKF_HGK_1974."
scope = "water solvent records and any dataset that states conventions"

[[convention]]
name = "reaction sign convention"
locator = "reactions/*/reactants; ParseJsonToData.cpp getReactants; Reaction.cpp"
statement = "Reaction coefficients are negative for species consumed and positive for species produced in the written equation; logKr and drsm_* refer to that direction. For a reaction that defines a substance, the defined species has a positive coefficient and the properties are divided by it."
scope = "reaction records"

