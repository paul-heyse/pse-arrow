source = "thermofun"
pin = "53741e9b0ac0"
surveyed = "2026-09-30"
summary = "ThermoFun v0.6.3 contributes seven curated thermodynamic datasets in its own JSON format (4056 substance records, 465 reaction records, 309 element records in Resources/databases, plus a 5-record water file) in which each substance carries reference properties and an unordered list of 'TPMethods' entries (16 distinct substance methods, 4 distinct reaction methods occur), together with the C++ engine that evaluates them (empirical Cp integration, HKF and density-model solutes, Murnaghan/Landau solids, cubic and CG gas EoS, IAPWS-95/HGK/Zhang-Duan water, Johnson-Norton/Fernandez/Sverjensky dielectric, logK(T) forms and density-model reaction equations); the JSON states no standard state, no concentration scale and no solvent link, the method list has no order (the numeric method code decides the slot it fills), and several unit labels and fields in the data disagree with what the reader does."

# ---------------------------------------------------------------------------
# PAYLOADS
# ---------------------------------------------------------------------------

[[payload]]
paths = ["Resources/databases/*.json"]
format = "JSON, one object per file with top-level keys thermodataset (string), datasources (array of strings), date (string dd.mm.yyyy hh:mm:ss), substances, reactions, elements (arrays of records); indent 2 style; no schema file; records carry no _id or _label"
files = 7
bytes = 10071277
records = "4051 substance records (aq17 161, cemdata18 228, heracles 888, mines16 536, psinagra-12-07 690, slop98-organic 573, slop98 975), 465 reaction records (psinagra-12-07 440, mines16 18, cemdata18 7, all others 0), 309 element records (aq17 11, cemdata18 15, heracles 72, mines16 39, psinagra-12-07 41, slop98-organic 48, slop98 83; 302 class ELEMENT and 7 class CHARGE), counted by json.load of each file; 5742 substance TPMethods entries in 3586 substance records (all 4056 records, misc file included) and 1395 reaction TPMethods entries"
reader = "ThermoFun::Database in ThermoFun/Database.cpp (Impl::fromFile line 335 reads the keys conventions, elements, substances, reactions and ignores every other top-level key) calling parseElement, parseSubstance and parseReaction in ThermoFun/Common/ParseJsonToData.cpp; a plain JSON parser reads every file"
read_by_source = "partly"
notes = "thermodataset, datasources and date are never read by the source code (grep of the tree), so dataset identity and its citation list are data only. 'conventions' is read when present but no file in Resources/databases has it. A second record with the same symbol overwrites the first (Database.cpp checkIfSymbolExists then map assignment). Seven of the eight files in the tree are byte-identical to the copies under Reaktoro embedded/databases/thermofun (see survey/reaktoro.toml); the ThermoHub mirror carries newer versions of the same datasets (see survey/thermohub.toml)."

[[payload]]
