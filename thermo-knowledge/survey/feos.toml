# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units of parameter files"
locator = "struct comments in crates/feos/src/*/parameters.rs; crates/feos-core/src/parameter/mod.rs lines 100-212"
statement = "Segment diameter sigma in Angstrom; energy parameters epsilon_k and epsilon_k_ab in K; dipole moment mu in Debye; quadrupole moment q in Debye times Angstrom; molarweight converted with GRAM/MOL (g/mol); temperature in K in data (permittivity data); DIPPR coefficients J/kmol/K. The library works internally in reduced units built from 1 ps, 1 Angstrom, k_B and 1/N_A, and thermal wavelengths are carried as ln of Angstrom cubed."
scope = "all parameter files and records"

[[convention]]
name = "identifier selection"
locator = "crates/feos-core/src/parameter/model_record.rs lines 95-142 and 145-182; chemical_record.rs lines 69-114; mod.rs lines 872-931"
statement = "The user names the substances and one identifier kind (Rust: IdentifierOption; Python default Name); a record matches when its field of that kind equals the string exactly. For pure records the first match in file order wins and a repeated query is an error; for chemical records the records are collected into a map keyed by the chosen kind, so a later duplicate overwrites an earlier one. A record that lacks the chosen kind is skipped."
scope = "from_json, from_multiple_json, from_json_segments and the binary matrix construction"

[[convention]]
name = "binary symmetry and orientation"
locator = "crates/feos-core/src/parameter/mod.rs lines 134-150 and 261-329"
statement = "Binary parameters are stored once and applied symmetrically: lookups try (id1, id2) and (id2, id1), the matrix is filled in both orders, and the self pair (i, i) is included because molecules with several association sites may need it. Site ids of a binary association record are swapped with the orientation."
scope = "binary and binary segment records"

[[convention]]
name = "missing binary record"
locator = "crates/feos-core/src/parameter/mod.rs lines 134-150; association.rs lines 147-203"
statement = "No record means the matrix entry is the type default (k_ij = 0, l_ij = 0, gamma_ij = 0) and association parameters of a site pair fall back to the model's combining rule; sites without parameters on either side contribute no pair. No error is raised."
scope = "all Parameters built from records"

[[convention]]
name = "association site grammar"
locator = "crates/feos-core/src/parameter/association.rs lines 8-30 and 123-145"
statement = "A site record carries counts na, nb, nc of three site types: A associates with B, C with C; counts of a group-contribution segment are multiplied by the number of segment instances when the molecule is built; a count of zero is omitted."
scope = "association in all models"

[[convention]]
name = "composition basis"
locator = "crates/feos-core/src/state/composition.rs"
statement = "States take mole numbers or mole fractions (Composition trait: molefracs, moles, total moles, or a dimensionless vector); phase equilibria take mole fractions or moles of the feed; mass basis is not offered in these crates."
scope = "state construction and equilibria"

[[convention]]
name = "reference state of ideal-gas models"
locator = "crates/feos/src/ideal_gas/joback.rs lines 33-48 and 175-183; dippr.rs lines 139-160; multiparameter/mod.rs lines 115-130"
statement = "Model dependent and partly inconsistent: Joback integrates from T0 = 298.15 K in code (the comment says 289.15 K), with p = 1e5 Pa and V = 1e-30 Angstrom^3 in the thermal wavelength; DIPPR integrates enthalpy and entropy from T0 = 298.15 K without a pressure constant (ln T term); multiparameter ideal terms carry their own offset coefficients and ignore the named reference of the offset term."
scope = "ideal-gas enthalpy and entropy of every model"

[[convention]]
name = "gas constant"
locator = "crates/feos/src/ideal_gas/joback.rs line 175; dippr.rs line 136; crates/feos/src/multiparameter/mod.rs"
statement = "Joback uses R = 6.022140857 times 1.38064852 (2014 CODATA k_B and N_A values); DIPPR uses 8.31446261815324 times 1000; the quantity library supplies RGAS elsewhere; the multiparameter molar properties use the library constant, not the gas constant of the equation's original publication."
scope = "ideal-gas models and molar properties"

[[convention]]
name = "temperature scale"
locator = "not stated anywhere in the tree"
statement = "not stated"
scope = "all temperatures"

