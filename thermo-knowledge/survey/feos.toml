surveyed = "2026-09-30"
summary = "FeOS 0.10.1 contributes JSON parameter files in a flat record format (parameters/: PC-SAFT, group-contribution PC-SAFT, ePC-SAFT, SAFT-VR Mie, SAFT-VRQ Mie, Joback and DIPPR ideal-gas, and 124 CoolProp-derived multiparameter fluids; 12 244 records in 32 JSON files), the Rust parameter structs and combining rules that give those fields meaning, and the implementations of the equations of state, classical DFT functionals, entropy-scaling transport and phase-equilibrium algorithms built as ideal-gas plus residual contributions. It bundles no PeTS or uv-theory parameters, no equation citations inside the data, no validity ranges, and its identifiers are a six-key block whose equality is defined by CAS number only; the legacy 0.8 format sits beside the current one in parameters_old."

