# ---------------------------------------------------------------------------
# CONSTRUCTS
# ---------------------------------------------------------------------------

[[construct]]
name = "identifier object (Identifier)"
locator = "crates/feos-core/src/parameter/identifier.rs lines 6-152; parameters/pcsaft/gross2001.json#/0/identifier"
meaning = "A block of up to six names for one substance: cas, name, iupac_name, smiles, inchi, formula. A query picks one of six IdentifierOption kinds (Cas, Name, IupacName, Smiles, Inchi, Formula) and matches a record whose field of that kind equals the query string exactly."
subject = "One compound (pure record) or one member of an ordered pair (binary record id1, id2); keyed by the chosen identifier kind, not by a primary key."
fields = [
  { name = "cas", meaning = "CAS registry number (Option<String>); present in every shipped identifier object", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "name", meaning = "commonly used English name; used as the selector of parameter variants (for example water_2B, para-hydrogen)", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "iupac_name", meaning = "IUPAC name; absent for 26 of 1842 records in esper2023", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "smiles", meaning = "SMILES string", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "inchi", meaning = "InChI (the struct comment calls it an InChI key but the values are full InChI strings); 18 922 of the identifier and pair-partner objects in the current files start with InChI=1S/, 286 with InChI=1/ and one is an empty string", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "formula", meaning = "chemical formula; absent from every record of esper2023, rehner2023_binary and lafitte2013", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
]
origin = "not stated (no source is given for any identifier value)"
conventions = "The Eq and Hash implementations of Identifier compare the cas field only, so two identifier objects are equal exactly when their CAS strings are equal (including two records with no CAS). Matching by name is case-sensitive exact. In segment and binary-segment files the identifier is a plain string (the segment name) and has no kind."
absence = "a missing key is None; the serde layer skips None on output, so the file distinguishes a missing identifier from an empty string only where an empty string was written (gross2006.json has one record with inchi empty); the match loop skips records that lack the queried kind and errors if a queried pure record lacks the kind needed to build the binary matrix"
validity = "not applicable"
provenance = "not stated; no source is attached to identifiers"
count = "2146 pure records and 15 714 binary-partner objects in pcsaft; every identifier object has all six keys in gross2001, gross2002, gross2005_fit, gross2005_literature, gross2006, loetgeringlin2018, rehner2020, eller2022, burkhardt2025, gc_substances and the three saftvrqmie pure files; five keys (no formula) in esper2023, rehner2023_binary and lafitte2013; held2014 has six keys with iupac_name and inchi on one record only; two keys (cas, name) in poling2000"
example = "parameters/pcsaft/gross2001.json#/0/identifier"
candidate = "species (or pseudo_component) with identity_assertion rows per naming_scheme (CAS, name, IUPAC name, SMILES, InChI, formula), assertion_status unstated"
precision = "close"
loss = "Names are used both as labels and as parameter-variant keys (water_2B is a name whose CAS is that of water), so a name assertion would claim a wrong identity for the variant; an empty string must become not asserted; equality by CAS alone conflicts with distinct parameter sets under one CAS; InChI versions (1S and 1) are mixed."

[[construct]]
name = "pure-component record (PureRecord)"
locator = "crates/feos-core/src/parameter/model_record.rs lines 17-27; parameters/pcsaft/gross2002.json#/0"
meaning = "One substance's parameters for one model: identifier, molarweight, model-specific fields flattened into the same object, and an association_sites list. In the legacy format the model fields sit in a model_record object."
subject = "One compound; keyed by identifier under the queried kind."
fields = [
  { name = "identifier", meaning = "identifier object (or a segment-name string for segments)", unit = "not applicable (record)", shape = "table", role = "input" },
  { name = "molarweight", meaning = "molar mass; serde default 0 and omitted when zero", unit = "not stated in the struct (inferred: Parameters::new multiplies the value by GRAM/MOL, so g/mol)", shape = "scalar", role = "input" },
  { name = "model fields", meaning = "the flattened model record (PcSaftRecord, GcPcSaftRecord, ElectrolytePcSaftRecord, SaftVRMieRecord, SaftVRQMieRecord, PetsRecord, UVTheoryRecord, JobackRecord, MultiParameterRecord or the Dippr enum)", unit = "see the model constructs", shape = "table", role = "input" },
  { name = "association_sites", meaning = "list of association site records (empty by default and omitted when empty)", unit = "not applicable (list)", shape = "list", role = "input" },
]
origin = "not stated"
conventions = "molarweight is carried by the record, not derived from a formula; the record has no temperature, pressure or composition basis; in the homosegmented and heterosegmented group-contribution paths the pure record is constructed from segment records (FromSegments)."
absence = "a missing molarweight becomes 0 (DIPPR files and the chemical-record file carry none: 1558 of 1558 records), which is not flagged as an error; a missing association_sites is an empty list meaning non-associating"
validity = "not stated"
provenance = "file-level only: the file name NameYear and the README table link a publication; there is no per-record citation field"
count = "3934 records of this shape in the current JSON files: 2146 PC-SAFT pure, 110 segment, 17 ePC-SAFT, 1492 ideal-gas (22 Joback groups, 308 and 1162 DIPPR), 124 multiparameter, 27 SAFT-VR Mie and 18 SAFT-VRQ Mie"
example = "parameters/pcsaft/gross2002.json#/0"
candidate = "parameter_set per slot group (pure) of a parameterization, with molar mass as an attribute of species_form or a separate observable value"
precision = "broader"
loss = "The record mixes identity, a molar mass and a model-specific parameter set and (for association) a nested list; the parameterization (the file) is the provenance unit, so a per-record citation must be invented from the file name and README."

[[construct]]
name = "PC-SAFT pure parameters (PcSaftRecord)"
locator = "crates/feos/src/pcsaft/parameters.rs lines 9-36; parameters/pcsaft/esper2023.json#/0"
meaning = "Segment number, segment diameter, dispersion energy, optional dipole and quadrupole moments, and optional entropy-scaling coefficient arrays for viscosity, diffusion and thermal conductivity."
subject = "One compound (or one group, in the group-contribution files)."
fields = [
  { name = "m", meaning = "segment number", unit = "not stated (dimensionless)", shape = "scalar", role = "input" },
  { name = "sigma", meaning = "segment diameter", unit = "Angstrom (struct comment)", shape = "scalar", role = "input" },
  { name = "epsilon_k", meaning = "dispersion energy parameter", unit = "K (struct comment: energetic parameter in units of Kelvin)", shape = "scalar", role = "input" },
  { name = "mu", meaning = "dipole moment; default 0, omitted when zero", unit = "Debye (struct comment)", shape = "scalar", role = "input" },
  { name = "q", meaning = "quadrupole moment; default 0, omitted when zero", unit = "Debye * Angstrom (struct comment)", shape = "scalar", role = "input" },
  { name = "viscosity", meaning = "4 entropy-scaling coefficients", unit = "not stated (dimensionless; used as a + b s + c s^2 + d s^3 of the reduced residual entropy s)", shape = "list", role = "input" },
  { name = "diffusion", meaning = "5 entropy-scaling coefficients (pure components only)", unit = "not stated", shape = "list", role = "input" },
  { name = "thermal_conductivity", meaning = "4 entropy-scaling coefficients (pure components only)", unit = "not stated", shape = "list", role = "input" },
]
origin = "transcribed (published PC-SAFT parameter sets named by file: Gross and Sadowski 2001 and 2002, Gross 2005 and 2006, Loetgering-Lin 2018, Rehner 2020, Eller 2022, Esper 2023 per the README tables; per-record source not stated)"
conventions = "The struct is deny_unknown_fields, so a pure file with any other key fails to load. The moments enter through mu^2/(m sigma^3 epsilon_k) and q^2/(m sigma^5 epsilon_k) times a fixed unit factor (1e-19 times JOULE/KELVIN/KB). The viscosity array is combined in the group-contribution path with sigma^3-weighted sums and a Chapman-Enskog reference correction of minus half of ln m."
absence = "mu and q default to 0 and are omitted when zero, so a nonpolar compound and a dipole of exactly zero are the same; viscosity, diffusion and thermal_conductivity are Option: absent means no correlation, and a mixture has a transport correlation only if every component has one"
validity = "not stated"
provenance = "file name (for example esper2023 links to the README table with a DOI); no per-record citation"
count = "2146 pure PC-SAFT records; mu present in 457 of 1842 (esper2023), 24 (gross2006), 84 of 146 (loetgeringlin2018) and 3 of 24 (rehner2020); q present in 7 (gross2005_fit), 6 (gross2005_literature) and 4 (loetgeringlin2018); viscosity present in 146 of 146 (loetgeringlin2018, always 4 numbers) and 16 of 22 (loetgeringlin2015_homo); no shipped record carries diffusion or thermal_conductivity"
example = "parameters/pcsaft/esper2023.json#/0"
candidate = "parameter_set in pure slot groups of the PC-SAFT parameterization (m, sigma, epsilon, dipole, quadrupole) and of an entropy-scaling transport form (coefficient lists as a family), quantity-typed slots"
precision = "exact"
loss = "Zero-as-default for mu and q hides not applicable versus known zero; the entropy-scaling coefficient arrays belong to a transport form with a different consumer; units of the dimensionless coefficients are assumed."

[[construct]]
name = "association site record (AssociationRecord) and induced-association sites"
locator = "crates/feos-core/src/parameter/association.rs lines 10-28 and 105-215; parameters/pcsaft/esper2023.json (any record with association_sites)"
meaning = "A bonding site type on a molecule or group: a site count of type A (na), type B (nb) and type C (nc), an optional site id, and the flattened association parameters of the model (kappa_ab and epsilon_k_ab for PC-SAFT, rc_ab and epsilon_k_ab for SAFT-VR Mie). Sites of type A associate with sites of type B; sites of type C associate with other C sites."
subject = "A site class on one compound (or group): keyed by the record and the site id (default empty string); cross association is keyed by the pair of sites."
fields = [
  { name = "id", meaning = "site identifier; default empty, omitted when empty; never written in any shipped file", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "na", meaning = "number of association sites of type A; default 0 and omitted when zero", unit = "not applicable (count, stored as a float)", shape = "scalar", role = "input" },
  { name = "nb", meaning = "number of association sites of type B", unit = "not applicable (count, float)", shape = "scalar", role = "input" },
  { name = "nc", meaning = "number of association sites of type C; never present in any shipped file", unit = "not applicable (count, float)", shape = "scalar", role = "input" },
  { name = "kappa_ab", meaning = "association volume parameter (PC-SAFT)", unit = "not stated (inferred: dimensionless, since it is multiplied by (sigma_i sigma_j)^1.5)", shape = "scalar", role = "input" },
  { name = "epsilon_k_ab", meaning = "association energy parameter", unit = "K (struct comment)", shape = "scalar", role = "input" },
  { name = "rc_ab", meaning = "association radius parameter (SAFT-VR Mie)", unit = "not stated (inferred: in units of sigma, from the combining rule that multiplies it by the segment diameter)", shape = "scalar", role = "input" },
]
origin = "transcribed (same published sets as the PC-SAFT pure parameters; induced-association sites from Rehner et al. 2023 per the README)"
conventions = "na and nb of a group-contribution segment are multiplied by the segment count when a molecule is built; the association parameters of a pair of sites come from a binary association record when one exists, else from the combining rule (kappa_ab geometric mean, epsilon_k_ab arithmetic mean for PC-SAFT; for SAFT-VR Mie rc_ab is a sigma-weighted mean and epsilon_k_ab a geometric mean); a site with no parameters (kappa_ab absent) takes part only through an explicit binary association record."
absence = "a record without association_sites is non-associating; a site with counts but no kappa_ab and epsilon_k_ab (parameterless site) is legal and means that association is defined only by the binary association records (induced association); zero counts are omitted, so nb-only (acceptor-only) sites have no na key"
