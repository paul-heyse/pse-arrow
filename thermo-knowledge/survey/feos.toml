# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "binary segment parameters of the group-contribution models in the current format"
question = "gc-PC-SAFT and uv-theory use a bare f64 as the binary model type, while BinaryRecord flattens its model field and the current JSON files store the number under the key k_ij (the legacy files held the bare number as model_record); the homosegmented PC-SAFT binary type is a struct with a k_ij field and is not affected. How is {id1, id2, k_ij} turned into the f64, and does any Rust code path read rehner2023_hetero_binary.json? No Rust test or example reads a binary segment file."
why_it_matters = "If the k_ij key is silently ignored the 134 heterosegmented segment-pair records have no effect in Rust, and a mapping cannot assume the data are used."

[[question]]
about = "Joback reference temperature"
question = "The struct comment states the integration reference as T = 289.15 K while the constant in the same file is T0 = 298.15 K. Which is intended?"
why_it_matters = "The reference state of the ideal-gas energy and entropy must be stated; a transposed digit shifts the datum."

[[question]]
about = "origin and version of coolprop.json"
question = "The multiparameter file is described only as the CoolProp fluid list. The pinned CoolProp (8.0.0) has 12 fluids that are absent here and 3 of the 124 records differ; which CoolProp version or commit and which script produced the file, and are the extra fields reference, R, _note and Tcrit_units intentionally ignored?"
why_it_matters = "Two carriers of overlapping equation sets need an equivalence assessment with a known derivation; without the version the assessment cannot distinguish a real difference from drift."

[[question]]
about = "units of kappa_ab, rc_ab and the multiparameter reducing values"
question = "kappa_ab is documented as an association volume parameter and rc_ab as an association radius parameter without units; rhoc and tc have no unit statement."
why_it_matters = "Dimensioned slots must not be typed from inference alone; the inferences (kappa dimensionless, rc in units of sigma, rhoc in mol/m^3, tc in K) come from formulas and unit factors in code."

[[question]]
about = "parameterless association sites"
question = "703 of the 1090 association sites of esper2023 carry only nb and no kappa_ab or epsilon_k_ab; the 938 association-only binary records pair compounds that each have exactly one site. Is the intended meaning that a cross-association record is an induced association between an acceptor-only site and the partner's self-associating site, and what happens for an acceptor-only site whose partner pair has no binary record (no parameters, no pair)?"
why_it_matters = "Whether the absence of a pair record means no association or an undefined one decides how the model stores a site without a parameter set."

[[question]]
about = "21 binary records with no parameters"
question = "rehner2023_binary.json contains 21 records (for example benzene with 1,2-dimethoxyethane) with neither k_ij nor association_sites. Are they placeholders for a pair that was fitted to zero, or pairs deliberately left without parameters?"
why_it_matters = "The knowledge base must distinguish not asserted, known zero and intentionally absent."

[[question]]
about = "water identification in ePC-SAFT"
question = "The code identifies water by m close to 1.205 and epsilon_k close to 354 (a commented-out variant would add association values) to apply a temperature-dependent diameter. Is this intended to extend to other water parameter sets, and does a parameter set fitted to water but with different numbers lose the correction?"
why_it_matters = "An assembly rule keyed on parameter values rather than identity cannot be represented by identity-based selection; the survey must flag it."

[[question]]
about = "same-sign ion pairs in ePC-SAFT"
question = "Code sets k_ij = 1 for same-charge ion pairs and zeroes the polynomial terms regardless of the record, and the README says the water-ion k_ij correlation was replaced by a constant at 298.15 K. Which of the 56 shipped binary records are affected?"
why_it_matters = "Rules applied on top of data are assembly knowledge that a parameter import would otherwise miss."

[[question]]
about = "name variants sharing a CAS number"
question = "rehner2020.json lists water_2B, water_3B, water_4C and their polar variants under the CAS of water, and saftvrqmie lists three hydrogen variants under one CAS and formula; identifier equality is defined by CAS only. Is the name field meant as a parameter-set selector, and how should such variants be identified?"
why_it_matters = "Identity assertions must not be made from a name that encodes a model variant."

[[question]]
about = "sodium ion CAS number"
question = "held2014 lists sodium ion with CAS 7440-23-5 while the other ions carry ion-specific CAS numbers. Does that number denote the ion or the element?"
why_it_matters = "A species identity built from a CAS assertion could merge an ion with the neutral element."

[[question]]
about = "estimator module"
question = "crates/feos/src/estimator (binary VLE, liquid density, vapor pressure, viscosity, diffusion, thermal conductivity datasets with loss functions) is commented out of lib.rs and of py-feos. Is it retired in favour of feos_core::ad, or only disabled?"
why_it_matters = "Decides whether regression capability includes property types (viscosity, diffusion, thermal conductivity) that the ad module lacks."

[[question]]
about = "units and meaning of the ePC-SAFT permittivity data"
question = "ExperimentalData pairs are [T, permittivity] with no unit statement; ion records carry a single point and the README says ion permittivity was set to 8.0. Is a single point a constant for all temperatures?"
why_it_matters = "A tabulated_function with one point needs a stated interpolation or constancy rule."

[[question]]
about = "identity of duplicated compounds across parameter files"
question = "The same compound appears in many parameter files with different parameters (for example methane in gross2001 and esper2023) and the CAS is the only shared key; no record states which measurement or fit it came from."
why_it_matters = "Several coherent parameter sets for one subject need parameterizations with provenance and a selection policy; the source gives only a README recommendation."
