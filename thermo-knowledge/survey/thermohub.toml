source = "thermohub"
pin = "c3e4acf45312"
surveyed = "2026-09-30"
summary = "The ThermoHub mirror (commit c3e4acf) contributes two ArangoDB snapshots of the ThermoHub thermodynamic database as graphs (hub_main: 7585 vertices and 17784 edges in 14 collections, datasets dated 2020-2021; hub_ord: 16767 vertices and 42569 edges in 23 collections, records dated September 2024, including 3428 SIT interaction records, 840 phase definitions, ThermoChimie and PSI/Nagra 2020 law-of-mass-action data and 2067 NASA polynomial species that have no counterpart in the ThermoFun-format files) and nine ThermoFun-format dataset files (6803 substances, 509 reactions, 439 elements, dated 17.07.2021) that are newer revisions of seven ThermoFun datasets plus mines19 and slop16; it supplies data only (no calculation code), the graph carries relations that the flat files lack (defines, takes, citing, pulls, basis, master species, phase membership, interactions) but several of its code-label pairs, edge multiplicities, unit fields and README claims disagree with the data."

