  { name = "for_field", meaning = "list of JSON paths of the cited properties (['properties'] for the whole record in 6535 hub_main and 5225 hub_ord cases; specific paths such as properties.logKr.values.0 or properties.TPMethods.eos_hkf_coeffs otherwise)", unit = "not applicable", shape = "list", role = "metadata" },
