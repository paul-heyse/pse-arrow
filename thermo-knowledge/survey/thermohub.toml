# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "source-database code vocabulary"
locator = "sourcetdb codes across vertices; hub_main versus hub_ord"
statement = "Every vertex carries the source database as {code: name}; the integer codes are shared only partly between the snapshots (26 is MINES19 in hub_main and PSI_NAGRA20 in hub_ord), so a code is meaningful only together with its snapshot or its label."
scope = "all vertices"

[[convention]]
name = "standard states and concentration scales"
locator = "substances standard_cscale, component edges pc_conscale, substance class_"
statement = "The only explicit scale statements are standard_cscale {CS_MOLALITY} on 1456 ThermoChimie substances and pc_conscale {C_UNITY} on all 2160 phase-membership edges; the standard state of a species is otherwise implied by the class and aggregate state as in ThermoFun data (survey/thermofun.toml)."
scope = "hub_ord substances and phases"

[[convention]]
name = "reaction direction and defined species"
locator = "takes edges (stoi_coeff, rct); defines edges"
statement = "A reaction's stoichiometry is the set of takes edges with signed coefficients; rct 1 marks products and 0 reactants; the defines edge names the substance whose properties the reaction defines, and that substance may be a reactant with a negative coefficient (496 of 2525 defining pairs in hub_ord)."
scope = "reactions"

[[convention]]
name = "temperature and pressure ranges of datasets"
locator = "thermodatasets limitsTP"
statement = "Dataset limitsTP states lowerT 273.15 and upperT 1273.15 with upperP 500000000 for HKF-based datasets (aq17, slop98) and upperT 298.15 with upperP 1000000 for equilibrium-constant and cement datasets (PSI/Nagra, MINES, CEMDATA, slop16, Heracles); units are not stated (inferred: K and Pa)."
scope = "datasets"

[[convention]]
name = "record timestamps"
locator = "properties.time_stamp"
statement = "Records carry {year, month, day, hour, minute, second}; hub_ord records are stamped 2024-09-10 and 2024-09-11, hub_main records 2020-2021; the thermofun files carry date 17.07.2021 16:49."
scope = "all vertices"

# ---------------------------------------------------------------------------
# SELECTION
# ---------------------------------------------------------------------------

[[selection]]
name = "dataset membership and export to ThermoFun files"
locator = "pulls and basis edges; thermohub-remote-tdb--export-thermofun.py; thermohubclient (not in the tree)"
rule = "A dataset consists of the substance vertices that have a pulls edge to it and the elements with a basis edge; in hub_main the cemdata18 dataset has 704 pulls edges over 238 distinct substance vertices (228 symbols with one vertex, 10 symbols with a CEMDATA18 and a PSI_NAGRA vertex of identical values) and its ThermoFun file lists 238 substances; how two vertices of one symbol are reduced to one record is not shown in the tree."
scope = "dataset export"
documented = "no: the script only calls saveDatabase for every available dataset"

[[selection]]
name = "species belonging to a phase"
locator = "phases substances list and component edges"
rule = "For 838 of 840 phases the substances list and the component edges agree; the two aqueous SIT phases have an empty substances list and take their members from component edges (1012 and 264)."
scope = "hub_ord phase membership"
documented = "no"

[[selection]]
name = "which dataset of a snapshot is current"
locator = "README.md; thermofun/*.json dates; hub_ord thermodatasets"
rule = "The README says the files in thermofun/ are the up-to-date database files; the ThermoFun files date from 17.07.2021 and do not include the datasets that exist only in hub_ord (PsiTDB2020, ThermoChimie10a, Mines23, Nasa02, codata89)."
scope = "all datasets"
documented = "no: README claim contradicted by the hub_ord snapshot"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "README.md lines 3-4 and thermofun/*.json#/date"
documented = "The README says the files in /thermofun/ are the up-to-date database files."
actual = "All nine carry date 17.07.2021 while the hub_ord snapshot carries records stamped September 2024 and five datasets (PsiTDB2020, ThermoChimie10a, Mines23, Nasa02, codata89) that have no file."
consequence = "The flat files alone are not the latest content; a loader that uses only thermofun/ omits the law-of-mass-action and NASA datasets."

[[discrepancy]]
locator = "substances aggregate_state in hub_main and hub_ord (SLOP16 records); ThermoFun GlobalVariables.h enum AggregateState"
documented = "ThermoFun's enum gives code 2 as GLASS and code 3 as CRYSTAL."
actual = "248 SLOP16 substances carry {2: AS_CRYSTAL} beside 1332 (hub_main) and 1717 (hub_ord) with {3: AS_CRYSTAL}; 2067 NASA-TDB substances carry {101: AS_OTHER} and the electron {101: SC_OTHER}."
consequence = "A code-keyed mapping reads 248 crystalline solids as glass; a label-keyed mapping needs both codes; NASA species lose their aggregate state."

[[discrepancy]]
locator = "arangodb/hub_main_remote_export/edges/*.json"
documented = "The edge collections represent relations between vertices."
actual = "Edges repeat: pulls 7269 edges over 6813 pairs (228 pairs three times), master 135 over 95 pairs (one pair 12 times), basis 469 over 439, citing 6605 over 6375, takes 1793 over 1759, defines, prodreac and product 10 pairs twice each; hub_ord has a repeat only in takes (one pair)."
consequence = "Counting edges overstates dataset size and the number of reactants; membership must be deduplicated by pair."

[[discrepancy]]
locator = "phases vertices (hub_ord) Ncomps and substances"
documented = "Ncomps is the number of components of the phase."
actual = "Ncomps is 1 in all 840 phases although 19 phases list 2 to 8 substances; the two aqueous phases have an empty substances list and 1012 and 264 members on edges."
consequence = "Neither field can be trusted for phase size; component edges are the complete source."

[[discrepancy]]
locator = "substances of NASA-TDB: e- mass_per_mole"
documented = "mass_per_mole is a molar mass (values such as 107.8682 for Ag)."
actual = "The electron record carries 548579903 (the NASA file's 0.000548579903 multiplied by 1e12); no other record is off."
consequence = "A bulk load would put an electron mass of 5.5e8; a units check is needed."

[[discrepancy]]
locator = "reactions with method solute_eos_ryzhenko_gems (32 in hub_ord) and ThermoFun GlobalVariables.h"
documented = "ThermoFun reads dr_ryzhenko_coeffs (three values) for method 10."
actual = "The 32 ThermoHub reactions with method 10 carry dr_marshall_franck_coeffs (12 values); method 9 logk_marshall_frank78 does not occur."
consequence = "The method name and the parameter block disagree; it is unknown which equation the coefficients belong to."

[[discrepancy]]
locator = "thermofun/cemdata18-thermofun.json versus ThermoFun Resources/databases/cemdata18-thermofun.json"
documented = "The mirror holds ThermoFun database files."
actual = "The mirror's cemdata18 has 238 substances and 27 reactions against ThermoFun's 228 and 7; the water record H2O@ of three datasets differs (hgk84 here, iapws95 there); mass_per_mole is added."
consequence = "Two versions of nominally one dataset exist with different content; version labels are absent from the files (date only)."

[[discrepancy]]
locator = "interactions vertices, properties.Tst (all 3428)"
documented = "Reference temperatures of other records are 298.15."
actual = "Every SIT interaction record states Tst = 298.5."
consequence = "The SIT reference temperature (SIT is defined at 25 C) is stated as 298.5 in both source compilations; the value is either a shared typo or a different reference, and the record does not say."

