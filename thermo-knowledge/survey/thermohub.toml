# ---------------------------------------------------------------------------
# CONSTRUCTS
# ---------------------------------------------------------------------------

[[construct]]
name = "document key and identity convention"
locator = "arangodb/*/vertices/*.json#/*/_key and edges/*.json#/*/_from"
meaning = "Vertex keys are composite strings that encode the natural key and its source: substances 'symbol;code:CLASS;code:SOURCE' (Ag(CO3)-;2:SC_AQSOLUTE;26:MINES19), reactions 'symbol;code:SOURCE;level', elements 'symbol;code:CLASS;code:SOURCE', phases and interactions likewise, thermodatasets 'symbol;code:STYPE;level', datasources a slug of the short name (_2002HUM_CUR_). Edges point with _from and _to to these _id strings."
subject = "any vertex; the same symbol from two source databases is two vertices"
fields = [
  { name = "_key, _id", meaning = "composite natural key with source and class codes embedded", unit = "not applicable", shape = "scalar", role = "input" },
  { name = "_rev, _type, _label", meaning = "ArangoDB revision, vertex or edge, and the collection-level label", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "properties", meaning = "the record content in the ThermoFun-like layout", unit = "not applicable", shape = "table", role = "input" },
]
origin = "generated (ArangoDB exports)"
conventions = "source-database codes are integers with a label, kept in a code-to-label enum that differs between the two snapshots: code 26 is MINES19 in hub_main and PSI_NAGRA20 in hub_ord; hub_ord adds 0 CODATA, 24 NASA-TDB, 25 THERMOCHIMIE, 27 MINES23; 15 PSI_NAGRA, 20 CEMDATA18, 22 HERACLES, 23 SLOP16 are common, 2 SUPCRT, 18 MINES and 19 AQ17 occur only in hub_main"
absence = "no dangling edge endpoints in either snapshot (measured: every _from and _to resolves); hub_main has repeated edges between one pair (pulls 7269 edges over 6813 pairs, citing 6605 over 6375, master 135 over 95 with up to 12 repeats, takes 1793 over 1759, basis 469 over 439), hub_ord has none except one takes pair"
validity = "not applicable"
provenance = "the key embeds the source database; per-field provenance is on citing edges"
count = "16767 vertices in hub_ord and 7585 in hub_main"
example = "arangodb/hub_ord_remote_export/vertices/substances.json (first document)"
candidate = "source_entity, identity_assertion, naming_scheme, import_record"
precision = "close"
loss = "The same species from several source databases is several vertices with no explicit identity link; any identity resolution is left to the loader. Code-label enums differ between snapshots, so codes cannot be loaded without the snapshot."

[[construct]]
name = "substance vertex"
locator = "arangodb/*/vertices/substances.json; dump collection substances"
meaning = "A substance record of the ThermoFun layout (survey/thermofun.toml) extended with source database, comment, timestamp, Debye-Hueckel parameters and a concentration scale."
subject = "one species form from one source database; keyed by symbol plus class and source codes"
fields = [
  { name = "symbol, name, formula, formula_charge, class_, aggregate_state, Tst, Pst, TPMethods, sm_*, m_expansivity, m_compressibility, datasources", meaning = "as in the ThermoFun substance record; formula_charge is a float in 38 hub_ord records", unit = "as in ThermoFun records", shape = "table", role = "input" },
  { name = "sourcetdb", meaning = "object {code: name} of the source database", unit = "not applicable", shape = "enum", role = "metadata" },
  { name = "mass_per_mole", meaning = "molar mass as a bare number (no values or units wrapper); present in 4040 hub_ord and 4671 hub_main records", unit = "not stated (inferred: g/mol; one hub_ord record, e- of NASA-TDB, carries 548579903)", shape = "scalar", role = "unread" },
  { name = "aq_edh_props", meaning = "extended Debye-Hueckel parameters {a0, b} for aqueous species; 1825 hub_ord records have the block, 401 with two values and 1424 with an empty values array although names [a0, b] and unit are present, 2 with no names", unit = "Angstrom for a0 (units array); b unitless", shape = "list", role = "input" },
  { name = "standard_cscale", meaning = "object {code: name}; {3: CS_MOLALITY} on all 1456 ThermoChimie substances, null elsewhere", unit = "not applicable", shape = "enum", role = "input" },
  { name = "comment", meaning = "free text, sometimes the literal reaction or a reference marker ('ref:5')", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "time_stamp", meaning = "{year, month, day, hour, minute, second} of record creation or import", unit = "not applicable", shape = "table", role = "metadata" },
]
origin = "transcribed (as in ThermoFun records; sourcetdb names the compilation: SUPCRT, SLOP16, PSI_NAGRA, PSI_NAGRA20, MINES, MINES19, MINES23, CEMDATA18, AQ17, HERACLES, CODATA, NASA-TDB, THERMOCHIMIE)"
conventions = "aggregate_state code-label pairs are not those of ThermoFun's enum: {2: AS_CRYSTAL} on 248 SLOP16 records (ThermoFun code 2 is GLASS) next to {3: AS_CRYSTAL} on 1332 (hub_main) and 1717 (hub_ord); {101: AS_OTHER} on all 2067 NASA-TDB records; class_ {101: SC_OTHER} on the electron of NASA-TDB and SC_GASFLUID on the other NASA-TDB species; standard states are not stated except through standard_cscale"
absence = "sm_* are missing for whole sources: THERMOCHIMIE (1456 substances) has none and no TPMethods (properties come from reactions); PSI_NAGRA20 has 1356 substances without TPMethods and sm_gibbs_energy on 176; CODATA (151) has only sm_enthalpy and sm_entropy_abs; NASA-TDB (2067) has only sm_enthalpy; SLOP16 has no sm_heat_capacity_p and sm_volume on 272 of 2035 (the HKF method supplies them); an empty 'values' array occurs inside method blocks (eos_hkf_coeffs with values [] on the record that also carries water_eos_hgk84_reaktoro and fug_critical_param)"
validity = "as in ThermoFun records (limitsTP in cp entries and nasa entries)"
provenance = "datasources strings plus citing edges (see the citing edge construct)"
count = "hub_main 6708 (SLOP16 2038, SUPCRT 1557, HERACLES 888, MINES19 705, PSI_NAGRA 690, MINES 536, AQ17 161, CEMDATA18 133); hub_ord 9039 (NASA-TDB 2067, SLOP16 2035, THERMOCHIMIE 1456, PSI_NAGRA20 1356, HERACLES 949, MINES23 775, CODATA 151, CEMDATA18 127, PSI_NAGRA 123); 6204 and 5888 with TPMethods respectively"
example = "arangodb/hub_ord_remote_export/vertices/substances.json (key e-;101:SC_OTHER;24:NASA-TDB)"
candidate = "species_form, species, composition, parameter_set, standard_state (standard_cscale)"
precision = "broader"
loss = "As for the ThermoFun substance record; in addition the source database, concentration scale and Debye-Hueckel parameters are extra attributes that the model places on the parameterisation, the standard state and a model assembly respectively; unit-free mass_per_mole must be given a unit by assumption."

[[construct]]
name = "reaction vertex"
locator = "arangodb/*/vertices/reactions.json"
meaning = "A reaction with equation text, reference logK and optional reaction properties and methods, typed as a formation-from-elements or a dissolution reaction."
subject = "one reaction; keyed by symbol plus source code and level"
fields = [
  { name = "symbol, equation, name, Tst, Pst, logKr, drsm_*, TPMethods, limitsTP, datasources", meaning = "as in ThermoFun reaction records; the equation uses signed coefficients with three decimals on the right side, for example 'Am(PO4):0.5H2O = -2.000H+ + +1.000Am+3 + +1.000H2(PO4)- + +0.500H2O'", unit = "as in ThermoFun records", shape = "table", role = "input" },
  { name = "reactyp", meaning = "object {code: name}: FE_FORMATION 1 (499 in hub_main, 2271 in hub_ord) or RE_DISSOLUTION 2 (452 in hub_ord)", unit = "not applicable", shape = "enum", role = "input" },
  { name = "level", meaning = "integer 0 in all records", unit = "not stated", shape = "scalar", role = "unread" },
  { name = "elements", meaning = "list of {symbol[, class_]} of the elements involved (1406 of 2723 hub_ord records, all 499 hub_main)", unit = "not applicable", shape = "list", role = "metadata" },
  { name = "comment, time_stamp, sourcetdb", meaning = "free text, import time, source code", unit = "not applicable", shape = "scalar", role = "metadata" },
]
origin = "transcribed (ThermoChimie and PSI/Nagra logK tables; older formation reactions from MINES, CEMDATA and PSI/Nagra 12/07)"
conventions = "logKr is for the written equation; the stoichiometry lives on takes edges (see the takes edge construct) with coefficient signs and a product flag; in 496 of 2525 defining pairs in hub_ord the defined substance is on the reactant side with a negative coefficient (dissolution), in 2019 it is a product"
absence = "ThermoChimie reactions carry logKr and a TPMethods entry with 5 named coefficients (A1 to A5), no drsm_* values; drsm_enthalpy is present on 1274 of 2723 hub_ord reactions, drsm_gibbs_energy and drsm_entropy on about 133; 1180 hub_ord reactions have no TPMethods; 56 entries are an empty method object {}; 6 hub_ord reactions have no takes edge and 199 have no defines edge"
validity = "limitsTP on 269 hub_ord and 475 hub_main reactions; not enforced by any code here"
provenance = "datasources per reaction plus citing edges whose for_field names logKr, drsm_enthalpy or drsm_heat_capacity_p values"
count = "hub_main 499 (PSI_NAGRA 440, MINES19 24, MINES 18, CEMDATA18 17); hub_ord 2723 (THERMOCHIMIE 1406, PSI_NAGRA20 1180, HERACLES 61, MINES23 56, CEMDATA18 20)"
example = "arangodb/hub_ord_remote_export/vertices/reactions.json (key Am(PO4):0.5H2O(am);25:THERMOCHIMIE;0)"
candidate = "reaction, reaction_participant, parameter_set, system_reaction"
precision = "close"
loss = "Stoichiometry sits on edges, not on the vertex, and the equation text repeats it; the law-of-mass-action datasets define every species by a reaction, so a mapping must treat those reactions as the standard-state parameter sets of the species rather than as independent reactions."

[[construct]]
name = "reaction method blocks new to ThermoHub"
locator = "arangodb/hub_ord_remote_export/vertices/reactions.json#/*/properties/TPMethods"
meaning = "Reaction method entries beyond those of the ThermoFun files: logk_fpt_function with five named coefficients, dr_heat_capacity_ft (method 11) carrying logk and Cp coefficients, dr_volume_fpt (12) with one coefficient, solute_eos_ryzhenko_gems (10) carrying a Marshall-Franck coefficient block, logk_2_term_extrap (6), logk_1_term_extrap1 (5), logk_lagrange_interp (8)."
subject = "one reaction"
fields = [
  { name = "logk_ft_coeffs", meaning = "values of length 5 (1406 blocks, names A1..A5), 12 (94) or 0 (5)", unit = "not stated (the 5-term form follows the ThermoChimie analytic logK form; inferred from term order and the ThermoFun A0..A4 layout)", shape = "list", role = "input" },
  { name = "dr_heat_capacity_ft_coeffs", meaning = "12 values in 49 blocks, 0 values in 15", unit = "not stated", shape = "list", role = "input" },
  { name = "dr_volume_fpt_coeffs", meaning = "one value per block (55 blocks), for example a reaction volume", unit = "not stated (inferred: cm3/mol or J/bar)", shape = "list", role = "input" },
  { name = "dr_marshall_franck_coeffs", meaning = "12 values in 32 blocks attached to method 10 solute_eos_ryzhenko_gems, where ThermoFun reads dr_ryzhenko_coeffs", unit = "not stated", shape = "list", role = "input" },
]
origin = "transcribed"
conventions = "method counts in hub_ord reactions: logk_fpt_function 1501, dr_volume_constant 117, empty {} 56, dr_volume_fpt 55, dr_heat_capacity_ft 42, logk_3_term_extrap 32, solute_eos_ryzhenko_gems 32, logk_nordstrom_munoz88 19, logk_2_term_extrap 11, logk_lagrange_interp 6, logk_1_term_extrap1 1"
absence = "empty values arrays; method entries without parameters mark a code path"
validity = "limitsTP on dr_heat_capacity_ft and some logk_fpt_function entries (range false, lowerP 0 or 0.1)"
provenance = "reaction datasources"
count = "see conventions"
example = "arangodb/hub_ord_remote_export/vertices/reactions.json (key Mackawite;25:THERMOCHIMIE;0)"
candidate = "parameter_set (forms logk_general_analytic, reaction_volume_polynomial, marshall_franck)"
precision = "close"
loss = "Coefficient naming differs from the ThermoFun layout (A1..A5 here, A0..A6 there) and the unit statements are absent, so term identity is inferred."

