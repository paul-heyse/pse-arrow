# PAYLOADS
# ---------------------------------------------------------------------------

[[payload]]
paths = ["thermofun/*.json"]
format = "ThermoFun database JSON (layout of survey/thermofun.toml): top-level datasources, date, elements, reactions, substances, thermodataset (here a one-element list, for example ['aq17'], where ThermoFun's files have a string)"
files = 9
bytes = 15277475
records = "6803 substance records (aq17 161, cemdata18 238, heracles 888, mines16 536, mines19 705, psinagra-12-07 690, slop16 2038, slop98-inorganic 975, slop98-organic 572), 509 reactions (psinagra-12-07 440, cemdata18 27, mines19 24, mines16 18, others 0), 439 elements (11, 15, 72, 39, 41, 41, 89, 83, 48), counted by json.load"
reader = "ThermoFun::Database (survey/thermofun.toml); produced by thermohubclient saveDatabase called from thermohub-remote-tdb--export-thermofun.py"
read_by_source = "none"
notes = "All nine files carry date 17.07.2021 16:49. None is byte-identical to a ThermoFun file. Against the ThermoFun copies of the seven shared datasets (compared by symbol): every substance symbol of aq17, heracles, mines16, psinagra-12-07, slop98 (as slop98-inorganic) and slop98-organic is present in both; cemdata18 has 238 substances and 27 reactions here against 228 and 7 there; slop98-organic has 572 here and 573 there. Differences inside common records: mass_per_mole is added here as {values: [..]} with no unit (all 161 aq17 records, all others likewise); datasources strings are rewritten in another style (here 'Slop98_dat:1998:data:' or 'Holland and Powell (2002)', there bibliographic short names such as [1998SHO/EA]; they differ in all 161 aq17 and all 975 slop98-inorganic substances and in none of the 228 cemdata18 and 690 psinagra-12-07 ones); in the water record H2O@ of cemdata18, psinagra-12-07 and slop98-inorganic the equation-of-state method is water_eos_hgk84_reaktoro here where ThermoFun has water_eos_iapws95_reaktoro; reactant lists are reordered. Values of sm_* and TPMethods are equal in all other compared records."

