# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "reduction of several vertices with one symbol to one record in an exported dataset"
question = "When two source vertices with the same symbol are pulled into one dataset (10 symbols in cemdata18 of hub_main, 9 in CEMDATA18, 16 in Heracles and 1 in slop16 of hub_ord), which one does the ThermoFun export keep, and is a disagreement possible between them?"
why_it_matters = "Dataset content and the mapping of duplicate identities depend on this rule, which is in thermohubclient and not in the tree."

[[question]]
about = "logk_ft_coeffs with five coefficients named A1..A5 (1406 ThermoChimie reactions)"
question = "Which functional form do the five coefficients have and is the logarithm natural or decimal? The ThermoFun layout has A0..A6 with ln T."
why_it_matters = "A wrong term identity would change logK at every temperature away from 298.15 K for 1406 reactions."

[[question]]
about = "unit of SIT epsilon in intpar and of dr_volume_fpt_coeffs values"
question = "What units do the values of intpar and dr_volume_fpt_coeffs have? The records have no units arrays."
why_it_matters = "SIT coefficients are by convention kg/mol; the reaction volume could be J/bar or cm3/mol, which differ by a factor of ten."

[[question]]
about = "hub_ord production"
question = "How was the hub_ord snapshot produced and with what version of the server? The script handles only hub_main."
why_it_matters = "The provenance and stability of the newer datasets (NASA, ThermoChimie, PSI/Nagra 2020) cannot be traced to a script."
