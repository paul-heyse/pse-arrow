rule = "When subgroups and interaction_data are not passed, version 0 uses UFSG and UFIP (original, not LLE), 1 uses DOUFSG and DOUFIP2016 (not 2006), 2 PSRKSG and PSRKIP, 3 VTPRSG and VTPRIP, 4 LUFSG and LUFIP, 5 NISTKTUFSG and NISTKTUFIP. NIST 2015, UNIFAC 2.0 and LLE data are used only when passed explicitly. The version integer thus couples the equation form and the default data."
