# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "Henry tables (all four files)"
question = "What are the unit of H, the concentration basis and the exact functional form for Sander Const, Sander T dep and PRTranslated best, and what is the meaning of E equal to 1.0 in all 20138 PRTranslated rows?"
why_it_matters = "The JSON states no units or form; the only statement is the GibbsExcessLiquid lnHenry docstring (log Pa, six-term form). A model that stores these as parameter sets needs the form and basis, and a constant 1.0 in the 1/T^2 slot may be a flag or an artefact of the missing generator script."

[[question]]
about = "ChemSep NRTL JSON versus nrtl.ipd"
question = "Is the JSON a last-wins merge of the 23 duplicated .ipd pairs, and what produced the JSON (no converter in the tree)? Only one pair was checked numerically."
why_it_matters = "Duplicate pairs carry different values and alpha; a rule other than last-wins would change values for other pairs. The alphaij range up to 9.16 also needs checking against the source."

[[question]]
about = "PR kij table window fields"
question = "Why does pr.json keep Tmin but drop Tmax, and what are the units of P, Pmin and Pmax (bar per the .ipd comments)?"
why_it_matters = "Validity windows are needed to build envelopes; half the window is lost in the machine form and the pressure unit is stated only in free text."

[[question]]
about = "DDBST sqlite absent from the tree"
question = "What exactly does thermo/Phase Change/DDBST_UNIFAC_assignments.sqlite contain at this pin, and does it equal the TSV restricted to flag-1 cells, re-keyed by CAS integer through the chemicals InChIKey index?"
why_it_matters = "The library's runtime lookup depends on an artefact that is not in the acquired bytes; a model built from the TSV must assume equivalence, and CAS-to-InChIKey ambiguity decides which compounds receive an assignment."

[[question]]
about = "DDBST TSV invalid cells"
question = "What does a flag of 0 mean precisely (not attempted, ambiguous, failed), and why do invalid cells still contain pairs, some with subgroup id -1?"
why_it_matters = "Invalid partial decompositions must not be imported as assignments, and the -1 id has no defined group."

[[question]]
about = "Subgroup numbering across schemes"
question = "Do the original UNIFAC, Dortmund, PSRK, VTPR, LLE, Lyngby, NIST and NIST KT subgroup ids follow published numbering in each case, given that shared ids often denote different groups (for example only 24 of 57 shared ids between UFSG and LLEUFSG have the same main group)?"
why_it_matters = "Group identity must be keyed by (scheme, label); a mapping that reuses ids across schemes would merge different groups."

[[question]]
about = "NISTUFMG"
question = "Why does the main-group map NISTUFMG (52 entries) disagree with NISTUFSG (86 main-group ids) on 51 entries, and which numbering does NISTUFMG follow?"
why_it_matters = "The map is unused by code, so the disagreement is invisible at run time, yet a reader importing main-group names from it would mislabel groups."

[[question]]
about = "UNIFAC zero interaction versus missing"
question = "Do the published tables treat an absent main-group pair as zero interaction, or as unpublished? Two original rows hold a = 0 and one holds a = 10000.0; what is the meaning of 10000.0?"
why_it_matters = "The library treats every absent pair as a = 0 (psi = 1); an unpublished pair assumed ideal could produce misleading activity coefficients, and a 10000 value may flag prohibited or unavailable interaction."

[[question]]
about = "NIST 2015 validity intervals"
question = "Are the Tmin and Tmax columns the fitted intervals of each pair, and why does the loader discard them?"
why_it_matters = "Applicability limits exist in the data but no code enforces them."

[[question]]
about = "Twu, API-SRK and Mathias-Copeman table mappings"
question = "What is the exact mapping from the table parameter names to alpha_coeffs orders (Twu L, M, N to Twu91 c1, c2, c3; C1, C2, C3 to the four-element polynomial), and which critical constants were used in the source fits?"
why_it_matters = "The fitted parameters are only valid with the critical constants of the source paper; stored numbers are meaningless without the dependency (fitted_given) and the order convention."

[[question]]
about = "Scalar table source labels"
question = "Why do the ChemSep-derived tables say ChemSep 8.26 while their values equal the 8.32 XML in dev (350 of 350 and 423 of 423 match), and why does one compound carry C2 without C1?"
why_it_matters = "Provenance and versioning of the parameters must not be taken from the source label."

[[question]]
about = "PSRK class completeness"
question = "Which PSRK quantities are missing (fugacities and their derivatives are stated as not implemented), so which parts of the PSRK assembly can be evaluated?"
why_it_matters = "A model assembly named PSRK cannot be qualified against this library for fugacity-dependent calculations."

[[question]]
about = "Reference states of Helmholtz phases"
question = "What are the H and S reference states of IAPWS95, DryAirLemmon, IAPWS06 and CoolProp phases relative to the 298.15 K, 101325 Pa ideal-gas zero used by the ideal-gas-basis phases?"
why_it_matters = "Energy balances across phases of different classes depend on consistent references; the tree neither states nor converts them."

[[question]]
about = "Electrolyte and other chemicals-held data"
question = "Which behaviour of thermo depends on data files in the chemicals package (Electrolytes, Identifiers, Critical Properties and others listed in package-data but absent from this tree)?"
why_it_matters = "The thermo pin alone does not contain those inputs; the survey of chemicals must be read alongside, and a version mismatch would change results."

[[question]]
about = "Default method selection with JSON data"
question = "Which method does a newly constructed property object select when several JSON labels exist for a compound (HEOS_FIT versus REFPROP_FIT versus 'Fit 2023')?"
why_it_matters = "The constructor selects each added correlation in turn (inferred), which can contradict the documented ranked order; the actual default decides which coefficients a simulation uses."

[[question]]
about = "Law files and headerless CSV"
question = "Are the first rows of the headerless NLP and HPV files lost by pandas header inference, and is 'EPA Chemical Data Reporting - 2012.csv.gz' meant to replace the uncompressed .csv?"
why_it_matters = "Inventory membership tests may miss one compound each; only relevant if regulatory data is ever imported (currently outside the model)."

[[question]]
about = "PPR78 docstring versus code"
question = "The PPR78_kij docstring prints a different denominator and a product where the code uses a power and a 1e6 factor on the group sum; which form do the tabulated A and B (MPa) belong to, and what are the units of A and B?"
why_it_matters = "The group-pair table is unusable without the exact equation and units; the code form matches the literature form but the docstring does not."

[[question]]
about = "Coefficient order of polynomial leaves"
question = "What is the coefficient order and scaling of stable_polynomial, exp_stable_polynomial and ln_tau polynomial leaves (Horner order, use of Tmin and Tmax as offset and scale)?"
why_it_matters = "The leaves cannot be evaluated from the JSON alone; the order and stable-variable definition live in fluids.numerics."

[[question]]
about = "Bell 2018 TSV and Phase Change directory"
question = "Why does the Bell 2018 Twu table (2571 rows) sit in Phase Change and is not read by any module, while the JSON derived from it has 2304 rows?"
why_it_matters = "It is the only unsplit evidence behind PRTwu_ibell_2018; dropped rows (no CAS match) are lost coverage."

[[question]]
about = "VTPR R set to zero"
question = "Do all VTPR consumers ignore R entirely (the comment says it is not used in the calculation), and is Q in VTPR the published VTPR surface area rather than the Dortmund value?"
why_it_matters = "A group scheme whose R is placeholder zero must not be mixed with schemes where R is physical."

[[question]]
about = "Regular-solution reference temperature"
question = "At what temperature are RegularSolutionV and RegularSolutionSP valid (ChemSep data), given the model docstring says often 298.15 K?"
why_it_matters = "The solubility-parameter model has no temperature dependence, so the reference state fixes its meaning."

[[question]]
about = "Symmetry enforced silently in cubic mixtures"
question = "Is an asymmetric kij matrix an error or by design ignored below the diagonal?"
why_it_matters = "The one-fluid rule here uses the upper triangle only; asymmetric interaction data would be silently symmetrised."

[[question]]
about = "Group-contribution table units"
question = "What are the units of the Joback, Wilson-Jasperson and Bondi table fields and where are conversions applied?"
why_it_matters = "The tables store published-method numbers with no unit statement."

[[question]]
about = "Survey coverage limits"
question = "Model-family statements for Wilson-Jasperson, Bondi, the Laliberte and Magomedov electrolyte correlations, the chemicals-held equations and xlsx contents were taken from module headers and signatures, not from reading every function; which of these need a line-by-line check?"
why_it_matters = "The record is evidence for mapping; these families are the least verified."
