# ---------------------------------------------------------------------------
# CONSTRUCTS: interaction-parameter database (Interaction Parameters/)
# ---------------------------------------------------------------------------

[[construct]]
name = "InteractionParameterDB table (metadata plus data)"
locator = "thermo/interaction_parameters.py:60 InteractionParameterDB; load_json at :68 documents the file format; loader table names at :551"
meaning = "One named table of interaction parameters of one model for ordered or unordered tuples of compounds, with a metadata block that states whether the tuple order is significant, which parameters each row must hold, and the value returned for a missing tuple."
subject = "An n-tuple of compounds keyed by the string 'CAS1 CAS2' (components = 2 in every shipped table; the loader also documents ternary and higher keys). For symmetric tables the key is the two CAS sorted ascending by integer value; for asymmetric tables the key order is the parameter's own orientation."
fields = [
  { name = "metadata.symmetric", meaning = "whether (i, j) and (j, i) are the same fact; selects sorted versus given key order in the lookup", unit = "not applicable (boolean)", shape = "scalar", role = "input" },
  { name = "metadata.source", meaning = "free-text origin label (values found: ChemSep, Sander Const, Sander T dep, PR Translated Best)", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "metadata.components", meaning = "number of compounds in each key (2 in all six shipped tables)", unit = "not applicable (count)", shape = "scalar", role = "input" },
  { name = "metadata.necessary keys", meaning = "parameter names every row must carry; checked only by validate_table, which the loader does not call", unit = "not applicable (names)", shape = "list", role = "input" },
  { name = "metadata.T dependent", meaning = "whether the parameters are temperature dependent; stated as a flag, the functional form is not in the file", unit = "not applicable (boolean)", shape = "scalar", role = "unread" },
  { name = "metadata.P dependent", meaning = "whether the parameters are pressure dependent (false in every table)", unit = "not applicable (boolean)", shape = "scalar", role = "unread" },
  { name = "metadata.missing", meaning = "dict parameter name to the value returned when a tuple or parameter is absent", unit = "per parameter, not stated", shape = "table", role = "input" },
  { name = "metadata.type", meaning = "grouping label of table kind; values found: 'PR kij', 'NRTL original T', 'Uniquac original T', 'Wilson original T', 'henry'; used only to find tables of a kind and tied to no equation", unit = "not applicable (text)", shape = "enum", role = "input" },
  { name = "data", meaning = "dict from the CAS-tuple key to an object of named parameters", unit = "per parameter", shape = "table", role = "input" },
]
origin = "transcribed or generated per table; see each table's construct. No file records tool versions."
conventions = "CAS are written with hyphens and joined by a single space. The lookup get_ip_specific sorts the key with chemicals.identifiers.sorted_CAS_key only when metadata.symmetric is true, otherwise the caller's CAS order is the key; the library never tries the reversed key for an asymmetric table. Sorting by integer CAS value is inferred from the docstring ('sorted from small to high as integers') and from every key of pr.json and eppr78_common.json being in ascending integer order; sorted_CAS_key itself is not in this tree. The matrix helpers get_ip_symmetric_matrix and get_ip_asymmetric_matrix take a temperature argument T=298.15 that is never used: temperature-dependent tables come back as raw coefficient matrices."
absence = "A missing tuple or a missing parameter returns metadata.missing[parameter] (for example kij 0, NRTL bij 0 and alphaij 0.3, Wilson aij 0.0 and bij 0, UNIQUAC bij 0, Henry A to F all 0.0) through a KeyError catch, so a missing pair is indistinguishable from a stored value equal to the default in get_ip_specific; has_ip_specific is the only call that distinguishes them. Matrix helpers force the diagonal to 0.0 and use the default off the diagonal."
validity = "Only pr.json carries per-row Tmin, Pmin, Pmax and P; no other table states a range and get_ip_* ignore even those."
