source = "thermo"
pin = "4f51c4343773"
surveyed = "2026-09-30"
summary = "thermo 0.6.1 (commit 4f51c4343773c8e50480b32eb81b014ae3945ebb) contributes 53 data files (17619772 bytes) under thermo/ plus 77 Python modules (4913473 bytes) that embed most of the model structure: a small CAS-keyed interaction-parameter database (ChemSep PR kij, NRTL, UNIQUAC, Wilson and four Henry-law pair tables, 25498 Henry rows, plus an unread 87990-pair predicted PR kij table), eight scalar pure-component parameter tables (Twu alpha, volume translation, API-SRK, Mathias-Copeman, regular-solution V and SP), thirteen UNIFAC-family interaction tables (17689 rows) with eight subgroup/R/Q definition sets and a 31778-compound DDBST group-assignment table embedded in or beside unifac.py, seven loaded fitted-correlation JSON files (4018 leaves in 2021 distinct CAS keys) and two shipped unread ones, and regulatory inventories; the model code covers 23 pure and 18 mixture cubic EOS classes (plus a mixture base class and two mixing-rule classes), 26 alpha-function classes, 3 mixing-rule implementations, IdealSolution/NRTL/UNIQUAC/Wilson/UNIFAC(6 versions)/RegularSolution/FloryHuggins/Hansen excess-Gibbs models, virial, Helmholtz (IAPWS-95, air), IAPWS-97/06, CoolProp-backed and Grayson-Streed/Chao-Seader phases, group-contribution estimators, and VL/VLL flash algorithms with Michelsen stability tests. It bundles no electrolyte data (read from the chemicals package), no pseudo-component characterisation, no true critical-point or phase-envelope tracer, no reaction-equilibrium solver, no association model, and it does not ship the sqlite file its own compound group-assignment lookup reads."

