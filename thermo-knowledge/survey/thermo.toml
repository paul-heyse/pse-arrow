[[selection]]
name = "Default method per pure property (ranked_methods)"
locator = "ranked_methods class attributes in thermo/heat_capacity.py, vapor_pressure.py, volume.py, viscosity.py, thermal_conductivity.py, interface.py, permittivity.py, phase_change.py; selection in TDependentProperty.__init__ (thermo/utils/t_dependent_property.py:5102) and valid_methods (:2567)"
rule = "Each property class holds a fixed ordered list of method names (for example VaporPressure begins IAPWS_PSAT, HEOS_FIT, WAGNER_MCGARRY, WAGNER_POLING; HeatCapacityGas begins HEOS_FIT, TRCIG, WEBBOOK_SHOMATE, JANAF, POLING_POLY). At construction the first listed method that has data for the compound is selected when no method was already selected. valid_methods returns the listed methods that have data, the current method first, optionally filtered by whether T lies in the method's range."
scope = "all pure temperature-dependent properties"
documented = "partly: the ranking is documented; the exceptions below (JSON labels that select themselves, extra correlations) are not"

[[selection]]
name = "JSON correlations select themselves on load"
locator = "thermo/utils/t_dependent_property.py:4940-5105 (constructor loop over add_correlation; add_correlation select=True at :3639)"
rule = "(inferred from code) Every JSON leaf is added through add_correlation with select True, so the last added correlation becomes the current method; only when no method has been set, or the set method is an internal extra, does the constructor fall back to ranked_methods. The kwargs dict is iterated in reverse and each model's labels in file order, so which label ends up selected depends on dict order rather than on the ranked list. The label 'Fit 2023' is in no ranked list at all."
scope = "properties with entries in Misc/*.json"
documented = "no: the class docstrings describe ranked_methods as the default order"

[[selection]]
name = "Merging of several JSON databases per compound"
locator = "thermo/utils/t_dependent_property.py:273 json_correlation_lookup"
rule = "Databases are consulted in the order refprop, elements, janaf, inorganic, organic, Ho_1972, pycalphad. For each property the method-key dicts are merged; if two files supply the same method key the label dicts are merged with update, so a later file's same label overwrites an earlier one (10 collisions measured) and the first file's dict object is mutated in place."
scope = "Misc/*.json"
documented = "not documented"

[[selection]]
name = "Out-of-range temperature: no fall-through"
locator = "thermo/utils/t_dependent_property.py:3073 T_dependent_property"
rule = "The selected method is tried only; if T is outside its Tmin to Tmax the result is extrapolated when an extrapolation rule is set, otherwise None (or an error when RAISE_PROPERTY_CALCULATION_ERROR). The library does not move to the next ranked method."
scope = "pure T-dependent properties"
documented = "no: valid_methods and the class text suggest automatic use of ranked alternatives; the call site uses only the current method"

[[selection]]
name = "Component-specific extra correlations"
locator = "thermo/utils/t_dependent_property.py:5108 _add_extra_correlations"
rule = "For a CASRN with entries in the class's extra_correlations dict, each is added as a method and its name is inserted at the front of the ranked list, ahead of all library methods."
scope = "properties with extra_correlations (for example DIPPR_PERRY_8E, VDI_PPDS, ALIBAKHSHI, WEBBOOK_HSUB)"
documented = "partly"

[[selection]]
name = "Mixture property method"
locator = "thermo/utils/mixture_property.py:170-200 constructor, :444 mixture_property; ranked_methods per class"
rule = "At construction the first ranked method with data is selected (for example ViscosityGasMixture BROKAW, HERNING_ZIPPERER, LINEAR, WILKE; HeatCapacityLiquidMixture LALIBERTE, LINEAR). mixture_property then evaluates only the selected method."
scope = "all MixtureProperty subclasses"
documented = "no: the mixture_property docstring says methods are tried in order until one succeeds and the selected method is replaced on success; the code calls only the current method"

[[selection]]
name = "Interaction-parameter table choice (IPDB.get_ip_automatic)"
locator = "thermo/interaction_parameters.py:243 get_ip_automatic; :218 get_tables_with_type; table order at :551-566"
rule = "Takes the first table (in loading order) whose metadata.type equals the requested type and reads the pair from it, returning that table's default when the pair is absent; it does not test other tables. Loading order: ChemSep PR, NRTL, UNIQUAC, Wilson, Henry, Sander Const, Sander T dep, PRTranslated Henry Best. For type 'henry' the first table is ChemSep Henry (41 solute rows, water only), so a solute present only in the Sander or PRTranslated tables yields the zero default."
