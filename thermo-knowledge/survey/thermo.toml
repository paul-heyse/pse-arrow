# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "Units and basis of the model code"
locator = "docstring unit brackets throughout thermo/*.py (for example thermo/eos.py:501 GCEOS attributes)"
statement = "Model code states SI units in square brackets in docstrings: K, Pa, m3/mol, J/mol, J/(mol K), mole fractions. No unit string is stored in any data file under thermo/ except the ChemSep .ipd (cal/mol) and the ChemSep XML (units attributes). The data files therefore carry implied units fixed only by the consuming code."
scope = "all constructs"

[[convention]]
name = "Gas constant"
locator = "from fluids.constants import R (thermo/activity.py:70, thermo/phases/phase.py:55 and others)"
statement = "R comes from the fluids package and is not defined in this tree. The ChemSep conversions in the Wilson and UNIQUAC docstrings use the calorie-based value 1.9872042586408316 (cal/(mol K)); PPR78_kij uses fluids R. A mapping must pin the R of the fluids release."
scope = "all models; ChemSep-derived interaction tables"

[[convention]]
name = "Temperature scale"
locator = "searched for ITS-90 and IPTS in thermo/"
statement = "Not stated anywhere in the tree (kelvin assumed in all code)."
scope = "all constructs"

[[convention]]
name = "Ideal-gas caloric reference state of phase classes"
locator = "thermo/phases/phase.py:115-121 T_REF_IG, P_REF_IG; :3420-3610 Cpig_integrals_pure, S_ideal_gas; :5539 IdealGasDeparturePhase"
statement = "For phases on the ideal-gas basis (IdealGas, CEOSGas, CEOSLiquid, VirialGas, GibbsExcessLiquid and GibbsExcessSolid, flagged ideal_gas_basis), enthalpy is zero for each pure ideal gas at 298.15 K and entropy is zero for each pure ideal gas at 298.15 K and 101325 Pa: H = H_dep + sum z_i integral from 298.15 K to T of Cp_ig dT and S = S_dep + sum z_i integral(Cp_ig/T dT) - R sum z_i ln z_i - R ln(P/101325). The pure-component entropy zero at the reference pressure is not compositional (the mixing entropy is added). The liquid phase is referenced to the same ideal-gas basis through the vapor pressure and enthalpy of vaporization."
scope = "IdealGas, CEOSPhase, VirialGas, GibbsExcessLiquid, GibbsExcessSolid, PropertyPackage"

[[convention]]
name = "Formation-based (reactive) enthalpy, entropy and Gibbs energy"
locator = "thermo/phases/phase.py:2027-2170 H_reactive, S_reactive, H_formation_ideal_gas; :3735-3790 _set_ideal_gas_standard_state; thermo/chemical_package.py:240-292"
statement = "H_reactive = H + sum z_i Hf_i and S_reactive = S + sum z_i Sf_i, with Hf and Gf the ideal-gas standard formation values at 298.15 K and 1 atm (docstrings of the phase classes), and Sf = (Hf - Gf)/298.15 computed in code (VirialGas.__init__, HumidAirRP1485.__init__, chemical_package Sfgs). Flash accepts H_reactive and converts it by subtracting sum z_i Hfg_i. The non-reactive H and S of a phase therefore omit formation terms; the reactive basis is an add-on, not the default."
scope = "phases on the ideal-gas basis; flash specifications H_reactive"

[[convention]]
name = "Reference states of Helmholtz and Gibbs phase classes"
locator = "thermo/phases/helmholtz_eos.py:303 H; thermo/phases/iapws_phase.py; thermo/phases/air_phase.py; thermo/phases/coolprop_phase.py"
statement = "HelmholtzEOS phases compute H = RT (tau dA/dtau + delta dA/ddelta) directly from the residual-plus-ideal Helmholtz function supplied by chemicals.iapws or chemicals.air, so their reference state is whatever those formulations fix; CoolProp phases take the CoolProp reference state. Neither is stated in this tree (a comment in helmholtz_eos.py says the departure check is hard due to the reference state). These phases are not flagged ideal_gas_basis (the Phase default and an explicit False in CoolPropPhase) and are not on the 298.15 K / 101325 Pa ideal-gas zero, so combining them with ideal-gas-basis phases in one flash changes the caloric reference silently; the Flash docstring only warns that mixing models raises the risk of multiple solutions."
scope = "IAPWS95, DryAirLemmon, IAPWS06, CoolPropPhase"

[[convention]]
name = "Standard states of the activity models"
locator = "thermo/phases/gibbs_excess.py:91-140 GibbsExcessLiquid docstring; thermo/unifac.py unifac_lnGammas_subgroups_pure"
statement = "NRTL, UNIQUAC, Wilson, UNIFAC, RegularSolution, FloryHuggins and Hansen are excess-Gibbs models on the symmetric (Raoult) convention: gamma_i tends to 1 as x_i tends to 1, with the pure liquid at the system temperature as reference (UNIFAC subtracts a pure-component group residual per compound). GibbsExcessLiquid combines gamma_i with Psat_i and, optionally, phi_sat and Poynting factors (equilibrium_basis), so the standard-state fugacity of a component is its saturation pressure at T (or a Henry constant for components flagged henry_components, with the solvent mole-fraction mixing in chemicals.solubility). The pressure of the standard state is Psat (or the Poynting-corrected value), not the system pressure, unless equilibrium_basis includes Poynting."
scope = "activity models; GibbsExcessLiquid; Henry tables"

[[convention]]
name = "Composition bases"
locator = "thermo/bulk.py:253 BulkSettings; thermo/mixture.py; thermo/stream.py"
statement = "Models take mole fractions zs or xs. Mass fractions ws and volume fractions Vfls/Vfgs exist in the object layer; liquid volume fractions use T_liquid_volume_ref 298.15 K (Vml_STPs) or 288.7055555555555 K (Vml_60Fs) when those exact values are set, otherwise volumes from the correlations. Gas reference conditions: T_normal 273.15 K and P_normal 101325 Pa; T_standard 288.15 K and P_standard 101325 Pa (BulkSettings)."
scope = "Mixture, Stream, Bulk, flash specifications"

[[convention]]
name = "Interaction-parameter tuple keys and order"
locator = "thermo/interaction_parameters.py:148-214 has_ip_specific, get_ip_specific"
statement = "Keys are 'CAS1 CAS2' joined by one space. Symmetric tables sort the two CAS by integer value before lookup (chemicals sorted_CAS_key, not in tree); asymmetric tables use the caller's order exactly and do not try the reverse. In the ChemSep NRTL, Wilson and UNIQUAC tables the first CAS is the row index i of the parameter matrix [i][j]; in the Henry tables the first CAS is the solute and the second the solvent (inferred)."
scope = "IPDB tables"

[[convention]]
name = "Six-term temperature polynomial family"
locator = "thermo/nrtl.py, thermo/wilson.py, thermo/uniquac.py, thermo/phases/gibbs_excess.py lnHenry_matrix, thermo/redlich_kister.py redlich_kister_excess_binary"
statement = "Five model classes share the temperature form X = c0 + c1/T + c2 ln T + c3 T + c4/T^2 + c5 T^2 (X is tau for NRTL, ln Lambda for Wilson, ln tau for UNIQUAC, ln H for Henry, each Redlich-Kister order). The letter naming differs: NRTL tau uses a, b, e, f, g, h (c and d are reserved for alpha = c + d T); Wilson and UNIQUAC use a to f; Henry uses A to F; Redlich-Kister uses indexed coefficients and N_T truncation. Data tables carry only the letters they use, absent letters being zero."
scope = "NRTL, UNIQUAC, Wilson, Henry, Redlich-Kister tables"

[[convention]]
name = "ChemSep energy parameters to thermo coefficients"
locator = "thermo/wilson.py:464-500, thermo/uniquac.py:565-600 docstrings; numeric check in this survey for NRTL"
statement = "Wilson: a_ij = ln(V_j/V_i) and b_ij = -A_ij/R; UNIQUAC: b_ij = -A_ij/R; both with R = 1.9872042586408316 cal/(mol K) and A_ij in cal/mol (docstrings). NRTL: json b_ij = A_ij/R with the same R (inferred from numeric agreement with nrtl.ipd; the sign is opposite to Wilson and UNIQUAC because ChemSep's NRTL tau is A/(RT) while its Wilson and UNIQUAC forms carry exp(-A/(RT))). The data files store only the converted values."
scope = "ChemSep NRTL, Wilson, UNIQUAC tables"

[[convention]]
name = "UNIFAC numbering and equations by scheme"
locator = "thermo/unifac.py (subgroup sets, load_unifac_ip, unifac_psis, unifac_lngammas_c, from_subgroups)"
statement = "Subgroup ids and main-group ids are scheme-local (two schemes may give the same id to different groups). Interaction tables are indexed by main-group ids of their own scheme. psi = exp(-a/T - b - c T) for versions 0 to 3; psi = exp(-(a + b (T - 298.15) + c (T ln(298.15/T) + T - 298.15))/T) for versions 4 and 5. Combinatorial term: original form (with q and r) for versions 0, 2, 5; r^(3/4) for version 1; dropped for version 3 (VTPR, R not used); ln V' + 1 - V' with r^(2/3) for version 4 (Lyngby). Van der Waals volume and area conversions: 15.17 cm3/mol and 2.5e9 cm2/mol per unit R and Q (code constants 1.517e-05 and 250000.0)."
scope = "UNIFAC family tables and classes"

[[convention]]
name = "Volume translation sign and form"
locator = "thermo/eos.py:8130 PRTranslated, :9968 SRKTranslated"
statement = "The translated equations are written in the shifted volume v + c: P = RT/(v + c - b) - a alpha/(...). The code defines b = b0 - c (b0 the untranslated covolume) and adjusts delta and epsilon accordingly; c is in m3/mol (docstrings)."
scope = "translated EOS classes; volume-translation parameter tables"

[[convention]]
name = "Cubic EOS interaction parameter"
locator = "thermo/eos_mix_methods.py:129-215; thermo/eos_mix.py:333"
statement = "kij is a constant square matrix, default all zero, combined as (a alpha)_ij = (1 - kij) sqrt((a alpha)_i (a alpha)_j); only the upper triangle is read (the lower triangle is set by mirroring), so an asymmetric kij matrix is silently symmetrised. No temperature-dependent kij exists in the mixing rule: PPR78 kij must be re-evaluated and the EOS re-created at each temperature."
scope = "all mixture EOS classes"

[[convention]]
name = "Missing-value defaults in the databases"
locator = "thermo/interaction_parameters.py:182-216, :404-434"
statement = "IPDB and SPDB return a per-table default from metadata.missing for any absent pair or compound through a KeyError catch. The defaults are numeric (0, 0.3, 0.0) for interaction parameters and for volume translation and null for the Twu, API-SRK, Mathias-Copeman and regular-solution parameters. Presence is distinguishable only through has_ip_specific and has_parameter_specific."
scope = "IPDB, SPDB"

[[convention]]
name = "Equation of a correlation is named by its model key"
locator = "thermo/utils/t_dependent_property.py:1551 correlation_parameters; :311 load_json_based_correlations"
statement = "A JSON leaf's equation is identified solely by the model-key string minus the suffix _parameters; the coefficient names inside the leaf must match the registry's required and optional names (A to G for DIPPR, a to d and Tc, Pc for Wagner, sigma0..2 and n0..2 and Tc for REFPROP sigma). Tmin and Tmax bound the use of each leaf."
scope = "Misc correlation JSON"

[[convention]]
name = "Flash specification conventions"
locator = "thermo/flash/flash_base.py:158-508 Flash.flash"
statement = "Specifications are molar unless a mass-basis keyword (H_mass, S_mass, G_mass, U_mass, A_mass, rho_mass) is given, which is converted with the mixture molecular weight; rho is converted to V = 1/rho; H_reactive is converted to H by subtracting sum z_i Hfg_i; VF is a molar vapour fraction and SF a solid fraction. Temperatures below the minimum supported by any phase, or non-positive P or V, are rejected."
scope = "flash calls"

