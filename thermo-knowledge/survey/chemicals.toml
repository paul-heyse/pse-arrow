source = "chemicals"
pin = "7fca9acf7708"
surveyed = "2026-09-30"

summary = "chemicals v1.5.2 (commit 7fca9acf7708e2a646bc04d2b6f6996d0325e77d) contributes 155 data files (70893014 bytes; the whole tree is 78 MB) of CAS-keyed pure-component constants and coefficient tables from many competing named sources, plus a large library of explicit correlations, corresponding-states estimators, DIPPR and PPDS forms, IAPWS and air Helmholtz formulations, Rachford-Rice solvers and unit and scale conversions. It has no binary interaction parameters of any model and no species definition beyond CAS-keyed identifier rows; most coefficient tables have no selection function, and units, reference states and equation identities are stated mostly in docstrings and function bodies rather than in the data files."

