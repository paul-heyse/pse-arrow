[[convention]]
name = "Competing tables for one property are the norm"
locator = "registries listed under method_registry; per-source counts measured by parsing the tables (non-blank cells of the property column, CAS compared with dashes removed)"
statement = "Critical temperature Tc has 11 sources: IUPAC 809, MATTHEWS 120, CRC 860, PSRK 995, PD 192, YAWS 7543, PINAMARTINES 1799, WILSON_JASPERSON 29715 (estimate), WEBBOOK 740, HEOS 145, JOBACK 51983 (estimate); union 55961 CAS. Pc and Zc use subsets of the same sources, Vc adds FEDORS (57445, estimate), omega has HEOS, PSRK, PD, YAWS and the definition-derived estimate table. Enthalpy of formation Hfg has 8 sources: ATCT_G 595, CRC 1361, API_TDB_G 571, WEBBOOK 3486, TRC 1757, JANAF 889, YAWS 5030, JOBACK 52224 (estimate); union 55372 CAS, 6396 CAS in two or more sources, 2162 in three or more, at most 8. Normal boiling point Tb has 8 sources (union 58943 CAS) and melting point Tm has 7 (union 97665 CAS). Vapor pressure has 7 liquid parameter tables of five equation types (Antoine Poling, Landolt Antoine, TRC extended Antoine, Wagner McGarry 3-6, Wagner Poling and VDI PPDS Wagner 2.5-5, Perry DIPPR 101), plus Alcock liquid elements and two sublimation tables that are not in the following counts: over the 7 tables union 6404 CAS, 611 CAS in two or more, 205 in four or more, at most 6 (ethanol has a parameter set in all six of Antoine Poling, Landolt, Perry 2-8, Wagner McGarry, Wagner Poling and VDI, with different values). Further multiplicities: dipole moment 4 sources, Hansen parameters 4, Lennard-Jones 2, radius of gyration 2, surface tension 5 tables (Mulero-Cachadina, Jasper-Lange, Somayajulu original and revised, VDI PPDS), liquid viscosity 6 tables, gas viscosity 2, liquid thermal conductivity 2, gas thermal conductivity 2, saturated liquid density 6 tables, ideal-gas heat capacity 5 tables (Poling, TRC, JANAF, Shomate, statistical-mechanics thetas), liquid heat capacity 3 families (Zabransky, Perry 2-153, PPDS) and solid heat capacity 4 (Perry 2-151, CRC, JANAF, Shomate). The same compound may therefore hold several incompatible parameter sets, each only valid with its own equation and conventions."
