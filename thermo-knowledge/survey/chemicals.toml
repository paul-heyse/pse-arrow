name = "Method registries and source-category constants"
locator = "the xxx_all_methods tuples and xxx_sources dicts in chemicals/critical.py:279, :483, :670, :850 (tuples) and :195-262 (dicts), acentric.py:69, phase_change.py:288-397, reaction.py:224-667, triple.py:103, dipole.py:105, solubility.py:109, safety.py, environment.py, combustion.py; category constants chemicals/miscdata.py:73-112; Tc_all_method_types critical.py:282"
