statement = "The Perry 2-153 heat capacity coefficients are stated to be in J/kmol/K; the Perry 105 density and Perry 2-150 enthalpy of vaporization tables have magnitudes that imply mol/m^3 and J/mol (inferred, not stated), so kmol-based DIPPR data were rescaled for some tables and not others; the ChemSep XML states kmol explicitly (kmol/m3, J/kmol). The viscosity tables Dutt-Prasad and Viswanath-Natarajan 3-term behave as cP (mPa*s) under the coded equation (inferred)."
