origin = "not recorded"
conventions = "retrieve_any_from_df_dict (data_reader.py:164) iterates the dict values in insertion order and returns the first non-NaN, so the dict order, not the documented tuple order, is the default policy. The two orders differ for Tc and Pc (tuple CRC, PD, WEBBOOK, PSRK; dict CRC, PSRK, PD, WEBBOOK), Vc and Zc (PSRK versus WEBBOOK; FEDORS versus JOBACK for Vc), Tb (tuple CRC_INORG before CRC_ORG; dict CRC_ORG before CRC_INORG), Hfg (tuple ATCT_G, TRC, CRC; dict ATCT_G, CRC, API_TDB_G, WEBBOOK, TRC) and logP (tuple SYRRES first; dict CRC first). API_TDB_G is in the Hfg dict but not in Hfg_all_methods. The optional constants database (another construct) precedes all of them when present."
