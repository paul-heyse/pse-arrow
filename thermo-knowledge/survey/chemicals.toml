[[question]]
about = "Antoine Collection Poling unit basis"
question = "The module docstring (vapor_pressure.py:114) says the Poling coefficients were altered to Pa and Celsius, but the data (C = -41.002 for tetrachloromethane, Tmin 259 K) behave as Kelvin and base 10. Which basis is authoritative?"
why_it_matters = "The temperature offset of C changes Psat by orders of magnitude if read as Celsius."

[[question]]
about = "Viswanath-Natarajan and Dutt-Prasad viscosity unit basis and equation"
question = "The docstring of Viswanath_Natarajan_3 gives log10 mu = A + B/(T + C) while the code returns 10**(A + B/(C - T)); the table coefficients reproduce plausible mPa*s values only under the coded form and without the log10(1000) offset. For the 2-term table the docstring log(100) offset gives Pa*s values that are lower than physical. What are the intended unit bases of the three tables?"
why_it_matters = "A fitted parameter set is only valid with its equation and unit basis; a silent factor of 1000 or 100 would pass a dimension check on a viscosity slot."

[[question]]
about = "Mixed kmol and mol bases among DIPPR-derived tables"
question = "Perry 2-153 coefficients are J/kmol/K while Perry 105 and 2-150 appear rescaled to mol (inferred from magnitudes). Was every table rescaled consistently, and is any other table (2-312 to 2-315, Table 2-8) rescaled?"
why_it_matters = "Coefficient units set the slot unit; mixing bases within one source must be recorded per table."

[[question]]
about = "VDI PPDS thermal conductivity tables (five columns)"
question = "PPDS8 (four coefficients plus Tc) and PPDS3 (three coefficients plus Tc) do not match the five-column VDI PPDS liquid and gas tables. Is the intended equation a degree-4 polynomial in T?"
why_it_matters = "The equation identity cannot be typed from the tree."

[[question]]
about = "VDI PPDS boiling temperatures table"
question = "The file name describes boiling temperatures at different pressures but the docstring says the coefficients are for the Wagner 2.5-5 equation; is the temperature validity Tm to Tc?"
why_it_matters = "Equation and envelope are inferred."

[[question]]
about = "Perry DIPPR 114 table"
question = "Tc is not stored and column E is 0 in all 11 rows. Which Tc was used in the fit and is E a placeholder?"
why_it_matters = "A DIPPR 114 value depends on Tc."

[[question]]
about = "Perry Table 2-151 versions"
question = "Three versions exist (JSON 319 CAS and 370 phase entries; TSV 477 rows; TSV-2 403 rows unread). Which is authoritative, are the subphase labels (beta, microcline, sillimanite, disthene) polymorph identities, and do blank CAS rows (74 in the TSV) correspond to formulas without a CAS?"
why_it_matters = "Species_form identity for solids depends on subphase names."

[[question]]
about = "Bell 2018 table"
question = "What model do c0, c1, c2 belong to and what is the citation behind je7b00967_si_001?"
why_it_matters = "The table cannot be typed or attributed."

[[question]]
about = "Laliberte2009 coefficient sets"
question = "Which properties do the c, v and a coefficient sets describe and in what units and variables?"
why_it_matters = "Unread by the library, meaning stated nowhere in the tree."

[[question]]
about = "Default selection policy"
question = "Is the dict insertion order (actual) or the xxx_all_methods tuple (documented) the intended ranking where they differ (Tc, Pc, Vc, Zc, Tb, Hfg, logP), and is API_TDB_G intentionally absent from Hfg_all_methods? The optional default.sqlite bypass is a third policy."
why_it_matters = "The selection_policy recorded in the model must match observed behaviour."

[[question]]
about = "Survey specification: precision vocabulary"
question = "docs/survey.md lists exact, narrower, broader, close and unmapped without stating the direction of narrower and broader. This survey uses narrower when the construct is a special case of the candidate concept and broader when the construct carries more than the candidate."
why_it_matters = "Coverage reports count by precision."

[[question]]
about = "Survey specification: calculation vocabulary"
question = "docs/survey.md points to model/qualification.toml for the calculation keys; only model/manifest.toml exists at the time of the survey. The keys in the task brief were used and the proposed keys are marked (proposed)."
why_it_matters = "Capability keys must resolve in the model."

[[question]]
about = "Gas constant value"
question = "R is imported from fluids.constants, which is outside the pinned tree. What value (CODATA year) did the pinned dependency supply?"
why_it_matters = "R enters every equation that multiplies by R; the convention_set must state the value."

[[question]]
about = "IAPWS-95 reference state"
question = "iapws95_properties returns U, S and H but the tree does not state the zero of internal energy and entropy (the IAPWS-95 convention puts them at the triple-point liquid, which this tree does not assert). What datum do the functions use?"
why_it_matters = "The energy_reference is needed to combine with formation data."

[[question]]
about = "Temperature scale of data tables"
question = "Which temperature scale do the tabulated temperatures (Tm, Tb, Tc, Tt, Tmin, Tmax) assume, given that T_converter exists and most sources predate 1990?"
why_it_matters = "ITS-68 versus ITS-90 differences reach 0.1 K near ambient and more at high temperature."

[[question]]
about = "Standard pressure and temperature of formation tables"
question = "Are Hf and Gf of the CRC, JANAF and ATcT tables at 1 bar or 1 atm, and is 298 in Hvap298 equal to 298.15 K?"
why_it_matters = "Standard-state pressure is a convention_set field."

[[question]]
about = "Zabransky uncertainty classes and data types"
question = "What do the Roman numeral classes I to VI denote numerically, and does data type C (averaged heat capacity) carry a different reference pressure than p?"
why_it_matters = "Uncertainty must be typed and the path (constant pressure or saturation) is part of the observable."

[[question]]
about = "ATcT tables"
question = "What is the coverage factor of the uncertainty column and are the 0 K values of ATcT 1.112 gas retained for species with no 298.15 K value?"
why_it_matters = "slot_uncertainty needs a coverage factor."

[[question]]
about = "JANAF tables"
question = "Do JANAF_1998.tsv and the JANAF Cp JSON files come from the same retrieval, at what reference pressure are the JANAF values and what is the treatment of phases with transition rows?"
why_it_matters = "JANAF Cp tables are an independent check on NASA and Shomate fits in qualification."

[[question]]
about = "ChemSep equation numbers"
question = "eqno values 1, 2, 3, 4, 5, 10, 12, 13, 118, 120, 121 and 200 are not defined in the tree; only numbers 100 to 127 coincide with DIPPR and 16 with Chemsep_16. What are their equations and coefficient units?"
why_it_matters = "Forms of type opaque_bundle cannot be typed without the ChemSep definitions."

[[question]]
about = "psi4 characteristic temperatures"
question = "The docstring descriptions of the adjusted and unadjusted variables are swapped relative to the loader, and the scale factor is not stated. Which file holds the adjusted values and what is the factor?"
why_it_matters = "The factor is a dependency of the derived values."

[[question]]
about = "Staveley triple point temperatures"
question = "Tt values carry six decimals, more than the 1981 source would print, and the Formula column has OCR-like errors. Were the values converted from another temperature scale or unit?"
why_it_matters = "Triple point is a qualification check and needs its scale."

[[question]]
about = "Data rights"
question = "sources/chemicals.toml records the data rights as not stated; Misc/element.txt carries an Open Babel GPL header, ChemSep8.32.xml an Artistic licence 2.0 string, and the JANAF generator a BSD header. Which rights govern redistribution of each bundled table?"
why_it_matters = "Rights attach to import records and a snapshot refuses forbidden uses."

[[question]]
about = "Survey scope outside chemicals/"
question = "The tree also holds data files outside chemicals/: dev/data (janaf_tables_index.csv, JANAF_index.txt, IARC csv, VDI csv, common_chemistry_CASs.tsv; 3.9 MB) and docs, tests. Are these in scope for the payload (the manifest includes only chemicals/**)?"
why_it_matters = "The JANAF index records which JANAF tables exist and their CAS mapping."

[[question]]
about = "Loaded but unconsumed data columns"
question = "Webbook Antoine columns, Hsub and Hvap, CRC Gf columns, Zabransky, Poling, TRC, Perry and JANAF heat capacity tables, Hvap CRC and Ghazerati tables and Common Chemistry molar volumes are loaded but no function in the package selects or evaluates them (selection lives in the sibling thermo library). Should they be modelled as data without a selection policy?"
why_it_matters = "A selection_policy for these properties is not in the source."

[[question]]
about = "Estimate provenance"
question = "The estimation tables (Joback, Fedors, Wilson-Jasperson, omega) depend on the thermo and rdkit versions and on the Tb and vapor-pressure defaults at generation time; which versions produced the committed files?"
why_it_matters = "The derivation needs named inputs to be reproducible."

[[question]]
about = "Heat of vaporization units"
question = "The units of Hfus and Hvap in the Wikidata, Joback and WebBook tables, and of HvapTb, Hvap298 and Hsub in the CRC and Ghazerati tables, are J/mol only by inference."
why_it_matters = "Energy quantity types need a stored unit."

[[question]]
about = "Poling heat capacity constants"
question = "Are the Cpg and Cpl constants of PolingDatabank at exactly 298.15 K and do the docstring counts 348 and 245 include one extra row each (measured 347 and 244)?"
why_it_matters = "Counts disagree by one with the measured table."
