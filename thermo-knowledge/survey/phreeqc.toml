[[convention]]
name = "concentration scale and activity scale per block"
locator = "src/model.cpp gammas line 550; src/read.cpp check_units line 8324; src/read.cpp read_solution line 5249"
statement = "Aqueous species are on the molal scale (moles per kg of water) and their activity is molality times a molal-scale activity coefficient (log10 gamma); the ionic strength is in mol per kg water. Water is an activity a(H2O). Exchange species use equivalent-fraction-like activities (log10 gamma = log10(|equiv|/exchanger total), Gaines-Thomas type, inferred) and surface species mole-fraction-like activities on their site type. Input SOLUTION concentrations may be per liter of solution, per kg of solution or per kg of water (mol, mmol, umol, g, mg, ug; ppm, ppb and ppt map to mg, ug and g per kg solution; equivalents only for alkalinity); the default unit is mmol/kgw. The database itself never states a unit for log K, gamma or volumes."
scope = "all SOLUTION_SPECIES, EXCHANGE_SPECIES, SURFACE_SPECIES and PHASES entries; SOLUTION input"

[[convention]]
name = "standard states"
locator = "src/model.cpp gammas (gflag cases 0-9); src/prep.cpp calc_PR lines 3745-3768; src/tidy.cpp tidy_phases line 1472; database/phreeqc.dat header"
statement = "Not declared as such by the source; the code implies: aqueous solutes referenced to the hypothetical one-molal infinite-dilution state on the molal scale; water referenced to pure water through the activity a(H2O); gases to fugacity in atm with ideal or Peng-Robinson fugacity coefficients (P_c in atm, pressure in atm); pure solids to unit activity (solid-solution members to mole fraction times activity coefficient); exchange species to their equivalent fraction; surface species to their mole-like fraction on the site type; e- to activity with gamma 1 (pe = -log10 a(e-)). The pinned tree has no manual that states these."
scope = "all reactions: the log K of a reaction refers to these states of its participants"

[[convention]]
name = "reference temperature and pressure of log K"
locator = "src/prep.cpp k_calc line 5542; src/global_structures.h REF_PRES_PASCAL line 152"
statement = "log K values refer to 298.15 K (hard-coded 298.15 in k_calc and in the Pitzer and SIT temperature functions) and to 101325 Pa (1 atm); the pressure term is added only above that pressure. No database states its own reference pressure (1 bar versus 1 atm)."
scope = "logK_T0, delta_h, analytic coefficients (A1..A6 fit whatever temperature range their author used), Pitzer and SIT parameters"

[[convention]]
name = "gas constant and other physical constants"
locator = "src/global_structures.h lines 20-33; src/prep.cpp k_calc line 5542; src/PBasic.cpp line 3290"
statement = "Hard-coded: R = 0.0083147 kJ/(mol K) (k_calc) and 0.00198726 kcal/(mol K); R = 0.0820597 L atm/(mol K) (Peng-Robinson); 8.314e-3 kJ/(mol K) in RATE_PK; F = 96493.5 C/mol; Avogadro 6.02252e23; permittivity of free space 8.854e-12; 4.184 J per calorie; ln10 as LOG_10. The values are constants of the program, not of the databases; a database built with another R gives different K at T other than 298.15 K."
