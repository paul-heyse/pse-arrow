source = "phreeqc"
pin = "b0b3be767158"
surveyed = "2026-09-30"
summary = "PHREEQC 3.9.0 (USGS) contributes a reaction-based aqueous geochemistry model in which every species, phase, exchange species and surface species is a reaction written from master species with an equilibrium constant given as log K at 298.15 K plus delta_h or a six-term analytic temperature function, and the activity model is selected per database by which keyword block is present (Pitzer, SIT, LLNL bdot arrays, else per-species WATEQ/Davies options); the pinned checkout holds 49 database files and one example input (15.8 MB, 4366 master-species lines, 36672 species equations, 21097 phase equations, 939 surface and 204 exchange species, 276 Pitzer B0 rows, 3591 SIT rows over copies) and the C++ source that defines every keyword option. It stores no formation enthalpies or entropies, no standard-state declaration, no unit declarations and no licence text for the data (only the software-level USGS notice), and kinetics, isotope ratios, mean gammas and several volume or conductance behaviours are BASIC code or hard-coded correlations rather than data."

