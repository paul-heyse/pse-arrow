# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "database/core10.dat header lines 10-14; src/prep.cpp calc_vm line 5341; src/utilities.cpp lines 88 and 168"
documented = "The header describes a database combining phreeqc.dat molar volumes with llnl.dat species, 'of broad use to anyone seeking to model aqueous geochemistry at pressures that differ from 1 bar'; the file carries -Vm on 224 species and 375 phases."
actual = "The file also carries LLNL_AQUEOUS_MODEL_PARAMETERS and no -use_phreeqc_dha_dhb. In that state calc_rho_0, calc_dielectrics and calc_vm return at once, so species volumes stay 0 and the species side of delta_v is 0; phases still subtract their own -Vm (inferred from reading the code; nothing was executed)."
consequence = "Pressure dependence of species reactions in core10.dat and in the three Kinec files (242 species with -Vm each) may be absent or partial; the model must not assume the stored -Vm values act."

[[discrepancy]]
locator = "database/OtherDatabases/thermochemie/Thermochimie_PhreeqC_Davies_electron_v10a.dat and the oxygen variant; src/model.cpp lines 575 and 659; src/utilities.cpp line 88; src/Phreeqc.cpp line 906"
documented = "The file names are 'Davies' variants of ThermoChimie v10a (eDH siblings use LLNL extended Debye-Hueckel)."
actual = "Both Davies files carry LLNL_AQUEOUS_MODEL_PARAMETERS and have every -llnl_gamma commented out (0 of 1429 species). Species then take the default Davies flag, which uses a = DH_A; DH_A is assigned only in calc_dielectrics, which returns before assigning when the LLNL arrays are present, so DH_A keeps its initial 0.0 (inferred from reading the code; not executed)."
consequence = "If the inference holds, charged species in these files behave as ideal (log10 gamma = 0) although the file is called Davies; the model must record the intended and the effective activity model separately."

[[discrepancy]]
locator = "src/read.cpp read_solid_solutions cases 11 and 13, lines 9280-9303, versus the warning text at line 9297"
documented = "The warning text says the parameter temperature is 'Celsius' for -temp and -tempc, and 'using 25 C' on failure."
actual = "The code stores dummy + 298.15 as kelvin for -temp and -tempc (not + 273.15); only the fallback is 298.15 K."
consequence = "Solid-solution parameters given in Celsius are evaluated at a temperature 25 K too high; no database file uses the option."

[[discrepancy]]
locator = "src/read.cpp read_solid_solutions lines 9474-9489"
documented = "Error text: 'Solid solution, %s, is nonideal. Must define exactly two components (-comp1 and -comp2).'"
actual = "The check iterates over a std::vector ss_v that is declared empty and never filled, so the error is never raised."
consequence = "A non-ideal (a0 or a1 non-zero) solid solution with more than two components is not refused at read time."

[[discrepancy]]
locator = "src/read.cpp read_surface_master_species lines 7412-7416"
documented = "The function declares an option list with two names, capacitance and cd_music_capacitance."
actual = "count_opt_list is 0, so neither name is recognised and any '-' option line in SURFACE_MASTER_SPECIES is an unknown-option input error."
consequence = "Per-site capacitances cannot be given in the database; they belong to the SURFACE input block."

[[discrepancy]]
locator = "src/global_structures.h line 184 versus src/prep.cpp lines 5362-5372 and calc_vm0 lines 5440-5446"
documented = "Enum comment: b_Av is 'b in z^2 * A_v * log(1 + b * I^0.5) / (2 * b)' (Pitzer-type logarithm)."
actual = "The code uses the extended Debye-Hueckel form z^2/2 * A_v * sqrt(I)/(1 + b*DH_B*sqrt(I)); the logarithmic form is present only as a comment. The phreeqc.dat header documents the sixth -Vm number as a0 in f(I^0.5) = I^0.5/(1 + a0*DH_B*I^0.5), which agrees with the code."
consequence = "A reader of the header file alone would pick the wrong functional form for the sixth -Vm number."

[[discrepancy]]
locator = "src/transport.cpp comment lines 6067-6069 versus code lines 6183-6194; database/phreeqc.dat header viscosity block"
documented = "The code comment writes B_i = b0 + b1*exp(b2 * tc) and D_i = d1 * exp(d2 * tc)."
actual = "The code and the database header evaluate exp(-b2*tc) and exp(-d2*tc)."
consequence = "Signs of b2 and d2 must be taken from the code and the database comments, not from the code comment."

[[discrepancy]]
locator = "database/OtherDatabases/IU-bl-2kb.dat header and -co2_coefs line"
