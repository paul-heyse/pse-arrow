# ---------------------------------------------------------------------------
# CONSTRUCTS: database keyword blocks and their options
# ---------------------------------------------------------------------------
# Option matching rule shared by every block below (src/read.cpp get_option line 8556, find_option line 8480):
# a line whose first token is '-' followed by a letter is an option line and is resolved by PREFIX against the
# block's option list, first entry in list order wins ('-analytic' resolves to analytical_expression, '-l' to
# log_k, '-d' to delta_h, '-v' to vm, '-g' to gamma, '-c' to check); an unmatched option is an input error.
# A line without a leading '-' is an option only if its first token equals an option name exactly (lower-cased),
# which is how 'log_k 4.28' after a ';' works. Options are stored on the most recent item of the block.
# A ';' ends a logical line (only outside a '#' comment); '#' starts a comment; a trailing backslash continues.
# A logical line whose first token is a keyword name (Keywords.cpp table, case-insensitive) ends the block.

