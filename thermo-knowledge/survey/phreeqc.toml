offered = "no"
scope = "critical constants are inputs to Peng-Robinson only; no critical-point or phase-envelope search"
locator = "src/prep.cpp calc_PR line 3743"
evidence = "source_inspected"

# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "manual and the meaning of options not in the parser"
question = "The user manual is not in the pinned checkout. The units and intent of most option values (-gamma a and b, -Vm a0, -cd_music fourth and fifth numbers, -dw a and a2, SIT epsilon units) are inferred from code and comments. Are they stated in the published manual for version 3.9.0?"
why_it_matters = "Unit slots in the model need a stated unit or must be recorded as 'not stated'; this survey marks inferred ones."

[[question]]
about = "effective activity model of the Davies ThermoChimie files"
question = "Does a PHREEQC 3.9.0 run with Thermochimie_PhreeqC_Davies_*_v10a.dat really give Davies A = 0 (DH_A never assigned because LLNL arrays suppress calc_dielectrics), or is DH_A set somewhere outside the code read here?"
why_it_matters = "The model must say which activity model such a database defines; if A is 0 the intended Davies behaviour is lost and the 'Davies' label is misleading."

[[question]]
about = "effect of LLNL arrays on -Vm"
question = "Is -Vm deliberately inert in databases with LLNL_AQUEOUS_MODEL_PARAMETERS (core10.dat, Kinec files), or is -use_phreeqc_dha_dhb expected to be set by the user?"
why_it_matters = "Whether pressure-dependent volumes are part of the meaning of these databases' data."

[[question]]
about = "reference pressure of log K in the databases"
question = "The code refers log K to 101325 Pa. Do the THEREDA, ThermoChimie, Thermoddem, PSI/Nagra and CEMDATA exports intend 1 atm or 1 bar (0.98692 atm)?"
why_it_matters = "convention_set.standard_pressure is a field of a coherent parameterisation; 1 bar and 1 atm differ by 1.3 percent, which matters for gas standard states and for any pressure correction applied relative to the reference."

[[question]]
about = "gas constant behind the databases' delta_h and log K"
question = "k_calc uses R = 0.0083147 kJ/mol/K. The databases do not state which R the authors used when deriving analytic coefficients or delta_h from K(T); THEREDA and ThermoChimie exports come from tools with their own constants."
why_it_matters = "convention_set.gas_constant holds the value a body of data was built with; here only the evaluating value is known."

[[question]]
about = "energy reference and formation data"
question = "The databases store reaction log K, reaction delta_h and analytic coefficients, not formation enthalpies, entropies or heat capacities (only comments such as 'Enthalpy of formation: -288.552 kcal/mol'). Is there any place in the source where the reference forms of the elements or the zero of enthalpy are named?"
why_it_matters = "The model's energy_reference is undeclared for all PHREEQC data; the survey marks it not stated and stores relative reaction properties only."

[[question]]
about = "temperature scale"
question = "No file names a practical temperature scale; THEREDA and SUPCRT-derived grids may use ITS-90 or IPTS-68."
why_it_matters = "convention_set.temperature_scale must be not_stated for every record."

[[question]]
about = "Pitzer temperature function provenance"
question = "The six-term function a0 + a1(1/T - 1/TR) + a2 ln(T/TR) + a3 (T - TR) + a4 (T^2 - TR^2) + a5 (1/T^2 - 1/TR^2) is coded for both B, C, theta, lambda, psi and zeta parameters; which published temperature forms do THEREDA, ColdChem and frezchem rows use (for example beta0(T) polynomials in other variables)?"
why_it_matters = "The model's nested temperature-function sets need the form of the function, not only coefficient values; a coefficient list without a declared form is ambiguous."

[[question]]
about = "validity ranges of Pitzer, SIT and analytic log K data"
question = "Rows carry only '# ref' comments; some entries carry prose ranges ('0-300', 'Range: 0-300', 'valid range 0 - 100 C' in CEMDATA headers). Are these ranges machine-readable anywhere?"
why_it_matters = "The model's envelope records scientific applicability; here it can only be filled from comments, which the source does not read."

[[question]]
about = "INCLUDE$ handling and database path resolution"
question = "read.cpp sees only the DATABASE keyword and PHRQ_io.cpp opens INCLUDE$ files by name; how the front ends (PHREEQC, IPhreeqc, PhreeqcI) resolve the default database path and the named files is outside the pinned tree."
why_it_matters = "The same file name can denote different databases; chemical_system keys need a stable source identity."

[[question]]
about = "SURFACE and EXCHANGE options that the database cannot express"
question = "Site density, specific area and capacitance are input-block values; do any of the EPRI or Tipping_Hurley files intend recommended values that appear only in comments?"
why_it_matters = "A surface species parameter set without site density is not evaluable; the model needs to know whether the recommended value is part of the parameterisation."

[[question]]
about = "THEREDA master species columns"
question = "THEREDA lines have five columns with a numeric fourth column (species weight, for example H+ 1.007390 against element weight 1.007940) while other databases give a formula in the fourth column. Is the fourth value intended as mass of the species including the electron correction?"
why_it_matters = "Species weights feed molar masses; the two kinds of weight (species and element) must not be mixed."

[[question]]
about = "meaning of trailing numbers after phase names and stray words"
question = "wateq4f.dat and Tipping_Hurley.dat write an integer after phase names (for example 'Calcite 12'); the Thermoddem files end PHASES with a bare 'References'. The parser drops both silently. Are the integers WATEQ4F reference indices?"
why_it_matters = "An identity or provenance field may be lost if the index is meaningful."

[[question]]
about = "fractional formula charge on phases"
question = "Concrete_PHR.dat phase formulas such as a trailing +0.05 give a charged solid; how does the equation balance check and the surface charge calculation treat a solid with formula charge, and is this a supported feature?"
why_it_matters = "The model's species requires charge_matches_composition; a charged phase is an unusual case."

[[question]]
about = "ISOTOPE unit semantics"
question = "The units permil, pct, pmc, TU, pCi/L are converted by from_permil and related functions; the pinned tree does not state the ratio definitions for each (for example the meaning of pmc for 14C)."
why_it_matters = "Isotopic amounts in these units have unit-specific definitions the model cannot infer."

[[question]]
about = "PARM positions of rate programs"
question = "The meaning of each PARM(i) of each RATES program is stated only in REM lines or header comments; KINETICS -parms supplies the numbers at run time."
why_it_matters = "A rate program is not evaluable without its parameter schema; the model must keep the comment text as the schema."

[[question]]
about = "duplicate detection of species definitions"
question = "Species redefinition within a file was counted with a heuristic (first right-hand term of the equation); a few counts (for example H2O in the SIT files) may include equations that define other species. Which equations define species twice in practice?"
why_it_matters = "Duplicate definitions inside one database file need a declared precedence; the counts here are indicative."

[[question]]
about = "effect of -gamma on exchange species versus the EXCHANGE gammas flag"
question = "With the default -pitzer_exchange_gammas true, do exchange species with -gamma a b in phreeqc.dat change the exchange convention in non-Pitzer runs (exch_gflag 2 path in model.cpp) or only in Pitzer runs?"
why_it_matters = "The same database entry defines a different activity convention depending on an input flag; the model needs to attach the flag to the convention."
