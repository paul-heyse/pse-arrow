source = "pyprism"
pin = "f194a987754e"
surveyed = "2026-09-30"
summary = "pyPRISM v2.0.0 (NIST licence) solves the Polymer Reference Interaction Site Model integral equation for multi-site liquid-state systems in reduced units: a site-type system (densities, diameters, pair tables of potentials, closures and intramolecular correlation functions), a radial Fourier domain, atomic closures (Percus-Yevick, hypernetted chain, mean spherical approximation, Martynov-Sarkisov) and molecular reference closures, analytical intramolecular correlation functions (single site, Gaussian, Gaussian ring, freely jointed, non-overlapping freely jointed, discrete Koyama, from array or file), five pair potentials, post-solution calculations (pair correlations, structure factors, potentials of mean force, second virial coefficient, effective chi, spinodal condition, solvation potential) and a Debye-method trajectory tool. It ships 45 reference data files (intramolecular form factors, structure factors and pair correlation functions from simulation or from published figures) that no package code reads. It carries no temperature-pressure thermodynamics, no equation of state and no compound database."

