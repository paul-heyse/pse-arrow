subject = "A set of site types; there is no notion of molecule, species or component beyond the omega table that says which sites share a molecule."
fields = [
  { name = "types", meaning = "ordered list of site-type labels", unit = "not applicable", shape = "list", role = "input" },
  { name = "kT", meaning = "thermal energy; the potentials are divided by it before entering the closures", unit = "not stated (reduced units with k_B = 1.0 typical)", shape = "scalar", role = "input" },
  { name = "domain", meaning = "Domain object fixing the real and Fourier grids", unit = "not applicable", shape = "reference", role = "input" },
  { name = "density, diameter, potential, closure, omega", meaning = "tables keyed by site type or pair", unit = "see each", shape = "table", role = "input" },
]
origin = "authored"
conventions = "Site types index rows and columns of all matrices; check() refuses a system with any unset table entry or without a domain and warns when a diameter or sigma is not a multiple of the grid spacing (rounding then occurs). Diameters are passed to the closures only and not to potentials."
