locator = "pyPRISM/omega/Gaussian.py, GaussianRing.py, FreelyJointedChain.py, NonOverlappingFreelyJointedChain.py, DiscreteKoyama.py"
class = "explicit_correlation"
inputs = "wavenumber k; Gaussian and freely jointed: omega = (1 - E^2 - 2E/N + 2 E^(N+1)/N)/(1 - E)^2 with E = exp(-k^2 sigma^2/6) or sin(k l)/(k l); ring: 1 + (2/N) sum (N - t) exp(-k^2 sigma^2 t (N - t)/(6N)); Koyama: sin(Bk)/(Bk) exp(-A^2 k^2) with A and B from second and fourth moments of the site-site distance distribution; non-overlapping: an excluded-volume correction to the freely jointed chain"
parameters = "molecule: N (length), sigma or l, persistence length lp"
composes = []
variants = [
  { selector = "", selects = "SingleSite (omega = 1 for single-bead molecules), NoIntra (alias InterMolecular, zero), FromArray and FromFile (tabulated)." },
]
equation_source = "Schweizer and Curro, Macromolecules 1988, 21, 3070 (Gaussian, freely jointed, non-overlapping); Honnell, Curro, Schweizer 1990 (Koyama); Rubinstein and Colby, Polymer Physics"
closed_form = "yes"
data = "intramolecular correlation function object construct"

