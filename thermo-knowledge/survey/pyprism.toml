[[model_family]]
name = "PRISM integral equation (matrix Ornstein-Zernike for polymers)"
locator = "pyPRISM/core/PRISM.py class PRISM (cost, solve, solve_picard); pyPRISM/__init__.py docstring"
class = "other"
inputs = "site-type matrices at each wavenumber: H = Omega C (Omega + H), implemented as totalCorr = (I - Omega C)^-1 Omega C Omega / rho_pair with omega multiplied by the site density; unknown gamma = h - c on the real grid; cost = gamma_out - gamma_in; composition as site number densities, T through kT inside the potentials; no pressure variable"
parameters = "site: density, diameter; pair: potential, closure, omega"
composes = [
  { slot = "closure", accepts = "atomic or molecular closure per site-type pair", default = "none (required for every pair)" },
  { slot = "potential", accepts = "pair potential object per site-type pair", default = "none (required)" },
  { slot = "omega", accepts = "intramolecular correlation object per site-type pair", default = "none (required)" },
]
variants = [
  { selector = "", selects = "solve(method='krylov' default, options passed to scipy.optimize.root) and solve_picard (mixing step default 0.1, tolerance 1e-6, prints the iteration counter); atomic closures use gamma directly, molecular closures additionally use omega convolutions and reference correlation functions (cr0, hk0)." },
]
equation_source = "pyPRISM/__init__.py docstring writes the equation; README cites Schweizer and Curro, Phys. Rev. Lett. 1987, 58, 246-249 and Martin et al., Macromolecules 2018, 51, 2906-2922"
closed_form = "implicit"
data = "reference correlation tables (for comparison only) and the system constructs"

[[model_family]]
name = "Percus-Yevick closure"
locator = "pyPRISM/closure/PercusYevick.py"
