# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "provenance of the .dat reference files"
question = "The BCPSolution and GraftedComposite .dat headers say 'Coarse Grained MD Simulation' and 'calculated from MD simulations using the Debye method' without the simulation code, version or trajectories; where are the underlying runs recorded?"
why_it_matters = "The origin role (computed) needs a derivation record that the tree cannot supply."

[[question]]
about = "units of the reduced quantities"
question = "Headers write lengths as 'd' and energies as 'e' and the data files give no numeric unit; how is d tied to a physical length for each published system (for example the digitised figures), and are all densities in d^-3?"
why_it_matters = "Quantity types for k, r and densities need a unit; the source has only reduced units."

[[question]]
about = "molecule identity"
question = "PRISM has site types and an omega table but no molecule or species record: how are two site types of the same molecule (for example the A and B blocks of a copolymer) linked, given that the same site type can appear in several molecules?"
why_it_matters = "It decides whether a chemical species can be reconstructed from a pyPRISM system or only site types with intramolecular functions."

[[question]]
about = "which closure formulas are intended"
question = "The Martynov-Sarkisov formula, the R-MPY sign and the R-LWC title differ between docstring and code; which expressions do the cited references define?"
why_it_matters = "Closure forms must be recorded from what the code evaluates but attributed to a publication; the tree does not settle it."
