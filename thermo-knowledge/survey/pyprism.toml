# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "reduced Lennard-Jones units"
locator = "pyPRISM/util/UnitConverter.py docstring; pyPRISM/core/System.py"
statement = "All quantities are in reduced units relative to characteristic length d_c, mass m_c and energy e_c; kT is given in units of e_c (k_B = 1 typical). Densities are site number densities per cubed length."
scope = "all constructs"

[[convention]]
name = "composition as site densities"
locator = "pyPRISM/core/Density.py"
statement = "Composition is the set of absolute site number densities rho_alpha; site density on the matrix diagonal is rho_alpha and off the diagonal rho_alpha + rho_beta; pair density is rho_alpha rho_beta; omega is always multiplied by the site density inside PRISM."
scope = "PRISM equation and calculations"

[[convention]]
name = "radial Fourier transform"
locator = "pyPRISM/core/Domain.py"
statement = "k f(k) = 4 pi integral of r f(r) sin(k r) dr on grids r = (i + 1) dr, k = (j + 1) dk; transformed by discrete sine transforms of type II and III; all correlation functions are isotropic."
scope = "all correlation functions"

[[convention]]
name = "intermolecular versus intramolecular functions"
locator = "pyPRISM/calculate/pair_correlation.py; pyPRISM/core/PRISM.py"
statement = "h and g computed by PRISM are strictly intermolecular; omega is intramolecular. g = h + 1. The potential is divided by kT before closures; the closures' U is the dimensionless U/kT."
scope = "PRISM solution"

[[convention]]
name = "symmetric pair tables"
locator = "pyPRISM/core/PairTable.py"
statement = "Assigning an off-diagonal pair also sets the reversed pair to a deep copy of the same object by default; unlike-pair omega, closure and potential are therefore treated as symmetric."
scope = "System tables"

# ---------------------------------------------------------------------------
# SELECTIONS
# ---------------------------------------------------------------------------

[[selection]]
name = "sigma of a potential"
locator = "pyPRISM/core/PRISM.py PRISM.__init__"
rule = "A potential's sigma is taken from the diameter table (additive contact distance) only when the potential was created without one; the closure's sigma is always the diameter-table value."
scope = "potentials and closures"
documented = "yes (System docstring warns that diameters are passed to closures only)"

[[selection]]
name = "atomic versus molecular closure"
locator = "pyPRISM/core/PRISM.py cost"
rule = "isinstance of AtomicClosure uses gamma directly; isinstance of MolecularClosure uses omega convolutions, cr0, hk0 and converts the direct correlation function by dividing by the omega product; any other closure type raises."
scope = "closures"
documented = "partly"

[[selection]]
name = "solver method"
locator = "pyPRISM/core/PRISM.py solve"
rule = "scipy.optimize.root with method 'krylov' by default (other methods by name); a Picard iteration is a separate entry point."
scope = "PRISM solution"
documented = "yes"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "pyPRISM/closure/HyperNettedChain.py (docstring of __init__ versus default)"
documented = "apply_hard_core: 'Defaults to True'"
actual = "def __init__(self, apply_hard_core=False)"
consequence = "The HNC closure is not applied with a hard-core condition unless requested, contrary to the docstring."

[[discrepancy]]
locator = "pyPRISM/closure/MartynovSarkisov.py (class docstring versus calculate)"
documented = "c = (exp(sqrt(gamma - U - 0.5)) - 1) - 1 - gamma"
actual = "code evaluates c = exp(sqrt(gamma - U + 0.5) - 1) - 1 - gamma"
consequence = "The documented and coded closures are different functions; the code value is what a solve uses."

[[discrepancy]]
locator = "pyPRISM/closure/ReferenceMolecularPercusYevick.py and ReferenceLariaWuChandler.py (docstrings versus calculate)"
documented = "both class docstrings carry the title 'Reference Molecular Percus Yevick (R-MPY) closure' and the warning that the closure is not fully implemented and should throw an error; the R-MPY formula contains exp(-u)"
actual = "both classes evaluate; R-MPY evaluates exp(+U) - 1 in the convolved term, and the Laria-Wu-Chandler class implements a different formula under the R-MPY title"
consequence = "The R-MPY sign differs from its documented formula and the R-LWC class is documented as R-MPY."

[[discrepancy]]
locator = "pyPRISM/core/Domain.py (docstring versus dk setter)"
documented = "Delta k = pi/(Delta r (N + 1))"
actual = "dr setter: self._dk = pi/(self._dr*self._length); dk setter: self._dr = pi/(self._dk*self._length)"
consequence = "The grid relation uses N, not N + 1, so the documented and coded k spacings differ."

[[discrepancy]]
locator = "CHANGES.md versus pyproject.toml and the tag v2.0.0"
documented = "CHANGES.md ends at [1.0.4] - 2020/07/01"
actual = "the pinned release is v2.0.0 (version from the VCS tag, requires-python >= 3.12, NumPy >= 2.0) and no changelog entry describes it"
consequence = "The behaviour differences between 1.0.4 and 2.0.0 are not documented in the tree."

[[discrepancy]]
locator = "pyproject.toml (classifiers, license) versus LICENSE"
documented = "license text 'NIST License'; classifiers 'License :: Freely Distributable' and 'License :: Public Domain'"
actual = "LICENSE is the NIST licence notice (works of NIST employees, no copyright in the United States, permission to use, copy, modify and distribute provided the notice is kept); the classifiers state 'freely distributable' and 'public domain', while the licence text says foreign copyright may apply"
consequence = "Not a contradiction of terms but the wording differs; rights determination should use the LICENSE text (recorded, not judged)."

