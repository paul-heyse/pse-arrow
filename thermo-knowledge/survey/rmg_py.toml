# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "rmgpy/constants.py docstring table (lines 34-58) versus module values (lines 63-112)"
documented = "the table lists F = 96485.3365 C/mol, and lists G (gravitational constant) and g (standard gravity)"
actual = "the module sets F = 96485.3321233100184, and defines neither G nor g; epsilon_0 is written 8.8541878128 with no power of ten and no unit comment"
consequence = "The Faraday constant differs from the documented one in the ninth significant figure, and the vacuum permittivity needs an exponent and unit supplied by the reader."

[[discrepancy]]
locator = "rmgpy/constants.py E_h (line 67) versus arkane/encorr/corr.py line 130"
documented = "the Hartree energy is 4.35974434e-18 J"
actual = "arkane/encorr/corr.py converts Hartree with the literal 4.35974394e-18 while arkane/statmech.py line 588 uses constants.E_h"
consequence = "Atom energy corrections use a Hartree value that differs by 4e-26 J (about 1e-8 relative) from the one used for electronic energies in the same job."

[[discrepancy]]
locator = "rmgpy/statmech/translation.pyx lines 126, 182 versus rmgpy/reaction.py line 805"
documented = "gas reference pressure: the reaction code says it assumes 1e5 Pa"
actual = "the translation partition function divides by 101325 Pa"
consequence = "Two standard pressures (1 atm and 1 bar) are in use in one code base, so thermo computed from modes and equilibrium constants built from the same species refer to different standard states."

[[discrepancy]]
locator = "rmgpy/data/solvation.py calc_g (line 2210) versus rmgpy/constants.py R"
documented = "Gibbs energy of solvation from log K at 298 K"
actual = "the factor is -8.314 * 298 * 2.303, not R (8.314472), T and ln 10"
consequence = "Solvation free energies differ by about 5e-5 relative from an evaluation with R and ln 10; temperature 298 is a literal."

[[discrepancy]]
locator = "rmgpy/kinetics/arrhenius.pyx Marcus docstring (line 1803)"
documented = "a kinetics model based on the modified Arrhenius equation using the Evans-Polanyi equation"
actual = "the class computes the Gibbs activation energy from a Marcus expression with inner and outer reorganisation energies"
consequence = "The docstring is copied from ArrheniusEP and does not describe the model; the equation must be taken from the code."

[[discrepancy]]
locator = "rmgpy/kinetics/uncertainties.pyx RateUncertainty.__init__ (line 55) and uncertainties.pxd"
documented = "data_mean is the mean of the data points fit to the uncertainty (class docstring)"
actual = "the constructor contains the statement 'self.data_mean' (a read), so the argument is never stored and the attribute keeps its C double default; 3732 rules in the database write data_mean"
consequence = "data_mean of loaded rules is 0.0, so the auto-generated-tree parent test in rules.py estimate_kinetics (lines 361-365) runs with data_mean = 0."

[[discrepancy]]
locator = "rmgpy/species.py get_symmetry_number docstring (line 677) versus rmgpy/data/thermo.py lines 1522 and 2015"
documented = "the function 'is currently used for website purposes and testing only'"
actual = "get_thermo_data and get_all_thermo_data call it to correct every group-additivity entropy"
consequence = "The symmetry number that enters S298 of every estimate is the resonance-hybrid value the docstring disclaims."

[[discrepancy]]
locator = "rmgpy/thermo/thermodata.pyx class docstring (S298) versus property docstring"
documented = "the class docstring calls S298 the standard entropy at 298 K; the property docstring calls it the standard entropy of formation at 298 K"
actual = "the value is used as the absolute entropy in integrations (get_entropy starts from S298)"
consequence = "An entropy of formation would require a different datum; the code treats it as absolute entropy."

[[discrepancy]]
locator = "rmgpy/thermo/wilhoit.pyx fit_to_data docstring (line 246)"
documented = "the linearity, number of vibrational frequencies and number of internal rotors set the limits at zero and infinite temperature"
actual = "the function takes Cp0 and CpInf as arguments and does not use linearity, Nfreq or Nrotors"
consequence = "The docstring is stale; callers compute the limits (find_cp0_and_cpinf)."

[[discrepancy]]
locator = "rmgpy/data/kinetics/family.py ReactionRecipe docstring (line 303)"
documented = "'There are currently five such actions' followed by a table of seven"
actual = "the code implements nine: GAIN_CHARGE and LOSE_CHARGE are applied in _apply and appear in 19 family actions"
consequence = "Recipe vocabulary is larger than documented; 19 charge actions would be missed by a reader of the docstring."

[[discrepancy]]
locator = "arkane/thermo.py lines 141-146"
documented = "H298 and S298 are evaluated at 298 K"
actual = "the monatomic branch sets Wilhoit H0 and S0 from H298 - get_enthalpy(298.15) and S298 - get_entropy(298.15)"
consequence = "A 0.15 K offset in the reference temperature of the integration constants for species without rotors."

