# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "uncertainty of a group-additivity estimate"
question = "add_thermo_data adds values and never combines uncertainties; group values carry '+|-' uncertainties on about 2700 of 3973 group objects but the estimate starts from a ThermoData with zero uncertainty and ends with zero uncertainty. Is the intended uncertainty model the separate source-based analysis in rmgpy/tools/uncertainty.py (with dG_group, dG_library and covariance files), and is it part of the contract of the estimator?"
why_it_matters = "The model's slot_uncertainty on estimated values has nothing to hold; an estimate's uncertainty must be carried by the estimation derivation or omitted."

[[question]]
about = "stability of the comment grammar"
question = "The group list of an estimate exists only as text in comment and is parsed back by extract_source_from_comments and get_ring_groups_from_comments; other tools (uncertainty, Chemkin annotations) rely on it. Is the grammar a stable interface across RMG versions?"
why_it_matters = "If lineage is imported from comments the mapping depends on that grammar; if not, derivation_input rows cannot be reconstructed from the data."

[[question]]
about = "H atom enthalpy in the HBI step"
question = "The hydrogen-bond-increment step subtracts 52.103 kcal/mol per added hydrogen as a literal (thermo.py line 2283); the same number is the H298 of H in primaryThermoLibrary. Is it meant to follow the loaded library's H value?"
why_it_matters = "It is a hidden parameter of the radical corrections; radical group values are only valid with that H enthalpy."

[[question]]
about = "which standard-state pressure applies to library thermo"
question = "No file states whether NASA and ThermoData values from libraries refer to 1 atm or 1 bar; the code paths use both."
why_it_matters = "convention_set.standard_pressure is required for comparison with other sources; a 1.3 percent pressure difference changes entropies by 0.11 J/(mol*K)."

[[question]]
about = "meaning of E0 for library NASA and ThermoData"
question = "E0 is optional in NASA (1514 of 23520 objects give it) and is obtained by extrapolation of the Wilhoit fit to 0.001 K otherwise; is a given E0 the same quantity (formation datum at 0 K including zero-point energy)?"
why_it_matters = "The model has no slot for E0; a wrong assumption would shift absolute enthalpies in reaction calculations that use E0."

[[question]]
about = "symmetry number of the resonance hybrid"
question = "Species.get_symmetry_number uses the resonance hybrid and takes the highest value among isomers; libraries' entropies include whatever symmetry their authors used. Can library values be checked against the estimator's convention?"
why_it_matters = "Importing library entropies as species properties assumes the same symmetry convention across libraries; the code relies on it without a check."

[[question]]
about = "nodes named Others- in tree descent"
question = "descend_tree returns a last child whose label starts with 'Others-' when no child matches, but no label in the pinned database starts with it. Is the convention retired or used by user databases?"
why_it_matters = "A fallback node is a selection rule that would need modelling if the data used it; it is currently dormant."

[[question]]
about = "thermo_coverage_dependence"
question = "One NASA object in the database carries thermo_coverage_dependence (a dictionary with 'model': 'polynomial' and coefficient lists in eV/molecule and eV/(molecule*K)) and the classes process it; no other file uses it."
why_it_matters = "Coverage dependence of adsorbate thermodynamics has no form in the model and a single example makes its semantics hard to establish."
