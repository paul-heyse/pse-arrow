# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units and quantity representation"
locator = "rmgpy/quantity.py lines 40-130"
statement = "Values are (value, 'unit') tuples, with optional uncertainty and type, stored in SI with the unit of record kept. Degrees Celsius, Fahrenheit and Rankine are refused. Energies accept K and cm^-1 by extra dimensionality, frequencies accept s^-1, Hz, J and K, and cm^-1 is stored unconverted. Rate coefficients are checked against the dimensionalities allowed for reaction orders 1 to 3 (and surface orders)."
scope = "all model classes and database files"

[[convention]]
name = "standard-state and reference pressures"
locator = "rmgpy/statmech/translation.pyx lines 126, 182, 201; rmgpy/reaction.py lines 778-805, 1419-1422"
statement = "The translation partition function divides by 101325 Pa, so thermodynamics from modes are on a 1 atm standard state; equilibrium constants use a reference pressure of 1e5 Pa for gas species and 2.5e-5 mol/m^2 for surface species; the transition-state rate routine divides partition functions by R T / 101325. No module states a standard-state pressure for ThermoData, NASA or Wilhoit values."
scope = "thermo from modes, equilibrium constants, reverse rates"

[[convention]]
name = "enthalpy datum and E0"
locator = "rmgpy/thermo/thermodata.pyx docstring; rmgpy/thermo/wilhoit.pyx E0 property; rmgpy/thermo/thermoengine.py line 78"
statement = "H298 is the standard enthalpy of formation at 298 K; NASA and Wilhoit enthalpies carry the formation datum through their integration constants; E0 is the enthalpy evaluated at 0.001 K on that datum (Wilhoit) or a given value (NASA, ThermoData), not an electronic energy. Species.conformer.E0 is set from the Wilhoit E0 of the thermo."
scope = "all thermo objects"

[[convention]]
name = "gas constant"
locator = "rmgpy/constants.py line 65; rmgpy/data/solvation.py line 2210"
statement = "R = 8.314472 J/(mol*K) throughout the thermo, kinetics and statmech classes; the solvation Gibbs-energy routine uses 8.314 and 2.303 instead."
scope = "every conversion between energy and temperature"

[[convention]]
name = "symmetry-number convention"
locator = "rmgpy/data/thermo.py lines 1522, 1454, 2015, 2255; rmgpy/species.py line 677"
statement = "Library and QM entropies already include R ln(sigma); group values and ML results do not and the estimator subtracts R ln(sigma) after estimation, using the species symmetry number computed from the resonance hybrid; the HBI step adds R ln(sigma of the saturated molecule) back when the saturated value came from a library or QM."
scope = "S298 of any estimate"

[[convention]]
name = "rate-constant units by reaction order"
locator = "rmgpy/quantity.py lines 780-870"
statement = "Allowed dimensionalities: first order 1/s; second order m^3/(mol*s) or m^3/s (molecules); third order m^6/(mol^2*s); the data are written with cm^3 or m^3 and s^-1; surface reactions additionally m^2/(mol*s), m^5/(mol^2*s) and m^4/(mol^2*s). Internally SI (m^3, mol, s)."
scope = "A factors of all rate objects"

[[convention]]
name = "logarithm bases"
locator = "rmgpy/kinetics/chebyshev.pyx line 175; rmgpy/kinetics/uncertainties.pyx; rmgpy/data/solvation.py line 2210; rules.py _get_average_kinetics (line 273)"
statement = "Chebyshev coefficients and solvation logK are base 10; RateUncertainty and the rule-fitting variances are natural log; rate-rule averaging takes the geometric mean of A through log10."
scope = "Chebyshev, LSER, rule averaging, uncertainty"

[[convention]]
name = "temperature 298 versus 298.15"
locator = "rmgpy/thermo/thermodata.pyx lines 215-230; arkane/thermo.py lines 131-146"
statement = "H298 and S298 are at exactly 298 K in model classes and in Arkane's H298 and S298 sums; Arkane's monatomic branch evaluates the Wilhoit H and S constants at 298.15 K."
scope = "H298, S298 and Wilhoit constants"

[[convention]]
name = "reaction enthalpy for Evans-Polanyi and Blowers-Masel"
locator = "rmgpy/kinetics/arrhenius.pyx get_activation_energy (lines 413 and 574)"
statement = "dHrxn is the enthalpy of reaction evaluated at 298 K in J/mol from the species thermo objects; activation energies are therefore tied to the thermo used."
