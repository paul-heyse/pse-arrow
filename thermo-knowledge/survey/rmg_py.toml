source = "rmg_py"
pin = "5c33e07e0999"
surveyed = "2026-09-30"
summary = "RMG-Py 4.0.0 (sparse checkout of rmgpy/ and arkane/: 358 files, 52954443 bytes) contributes the loaders that give meaning to the RMG-database files (Database.load, tree descent, logic nodes, the adjacency-list parser and the atom-type vocabulary of 131 types), the thermo model classes ThermoData, NASA and Wilhoit with their conversions and fits, about twenty rate-law classes, statistical-mechanics modes, the group-additivity thermo estimator (libraries, radical hydrogen-bond increments, ring and polycyclic corrections, symmetry) and the kinetics rate-rule estimator, the Abraham LSER solvation equations, Joback transport estimation and the Arkane thermo-from-quantum-chemistry jobs; it bundles no thermodynamic data of its own beyond arkane example logs, and its thermochemistry conventions are spread over modules (gas constant 8.314472 in constants.py, two different standard pressures, hard-coded factors in several places)."

# ---------------------------------------------------------------------------
# PAYLOADS
# ---------------------------------------------------------------------------

[[payload]]
paths = ["rmgpy/**/*.py", "rmgpy/**/*.pyx", "rmgpy/**/*.pxd"]
format = "Python and Cython sources (pyx implementation, pxd declarations) of the RMG-Py library; excluding rmgpy/tools/data"
files = 182
bytes = 4408941
records = "not applicable: code only (106 .py 3252420 bytes, 36 .pyx 996170 bytes, 40 .pxd 160351 bytes, counted by listing); the survey covers rmgpy/thermo, kinetics, pdep, statmech, molecule, data, quantity.py, constants.py, species.py, reaction.py, transport.py"
reader = "python3 for .py; .pyx and .pxd are Cython and were read as text; nothing was compiled or imported"
read_by_source = "all"
notes = "The Cython modules define the numerical classes (thermo, kinetics, statmech, pdep, part of molecule); the class docstrings are the only documentation in the tree, so the survey cites them and the code together. No rmgpy file contains data tables for thermodynamics; the data come from RMG-database (survey rmg_database)."

