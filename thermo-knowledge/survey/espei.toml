source = "espei"
pin = "769029ca2ee6"
surveyed = "2026-09-30"
summary = "ESPEI 0.9.1 (Python, MIT) is a two-stage CALPHAD parameter-fitting program built on pycalphad: a linear parameter-generation stage that fits Redlich-Kister temperature polynomials to formation and mixing heat-capacity, entropy and enthalpy data with a modified AICc, and an emcee ensemble-MCMC stage whose log-likelihood sums Gaussian terms for phase-boundary driving forces, activities and thermochemical properties with fixed per-type standard deviations; it defines the JSON dataset format (ZPF, single-phase fixed-configuration, equilibrium thermochemical and activity data), the YAML run settings, and embeds SGTE91 and SR2016 pure-element reference data, but it ships no datasets or TDB files in docs/ (the datasets live in the separate espei_datasets source), records only the optimum parameter values in the output TDB under generated symbol names (VV0000 and onward) and the raw chains in NumPy arrays, and discards uncertainty, covariance and the link from a symbol to its dataset."

