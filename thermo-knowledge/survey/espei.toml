# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "bare HM, SM and CPM outputs and SM_EX_FORM"
question = "Do datasets with outputs HM, SM and CPM without suffix enter the MCMC likelihood (and as both formation and mixing data) through the substring query, and is SM_EX_FORM used anywhere? Both answers are inferred from reading, not from running the code."
why_it_matters = "It decides whether 10 datasets with 2157 bare-output points have a stated meaning (formation versus absolute) and a fit role, or are unused evidence."

[[question]]
about = "SR2016 origin"
question = "refdata.py gives no source for SR2016 (an Einstein-form reference for Cu and Mg) and the docs say only that it is supported for certain elements. What is its origin and datum?"
why_it_matters = "An energy_reference needs its datum and provenance; the set cannot be attributed from the files."

[[question]]
about = "SGTE91 label versus content"
question = "The SGTE91SER entries equal the ELEMENT lines of the later unary v5.0 file in all 80 entries, including two reference phase names that are not declared phases there, while some GHSER constants differ from v5.0. Are SER data in SGTE91 a later table than the energy expressions?"
why_it_matters = "Two related reference sets with one name would need two energy_reference records or one with a stated mixed origin."

[[question]]
about = "uncertainty and posterior"
question = "Only the optimum point and the raw chains are kept and the standard deviations are fixed per data type, not per point. Is there any stored uncertainty or covariance that the survey should preserve from a run?"
why_it_matters = "The model's fit and slot_uncertainty records have nothing to hold unless a run's chains are acquired separately."

[[question]]
about = "docs tutorial files"
question = "docs/cu-mg-example.rst describes a tutorial run with input datasets and the outputs cu-mg_dft.tdb and cu-mg_mcmc.tdb, but the pinned tree holds none of these files (datasets live in the ESPEI-datasets repository and small TDB texts in tests/testing_data.py). Is a tutorial run output to be acquired from another source?"
why_it_matters = "The fit output (TDB with VV symbols) has no acquired instance in the raw store to survey."
