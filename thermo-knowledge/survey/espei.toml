locator = "espei/refdata.py; espei/database_utils.py:33-116; espei/paramselect.py:376-414"
meaning = "A reference-state set named ref_state is three attributes of espei.refdata: ref (lattice stabilities, keyed by (element, phase) to a T-expression, possibly referring to the symbol GHSERxx), refStable (the energy of each element in its reference structure, keyed by element) and refSER (per element: reference phase, mass, H298, S298; also /- and VA). The available sets are SGTE91 (78 elements, 339 lattice stabilities) and SR2016 (Cu and Mg only, with Einstein-type logarithmic terms in the low-temperature piece); users can add sets through a setuptools entry point."
subject = "An element (refStable, refSER) or an (element, phase) pair (ref)."
fields = [
  { name = "lattice stability expression", meaning = "Gibbs energy of the element in a phase relative to the reference, piecewise in T with lower limits 298.15 K for most elements (200, 130 or 100 K for a few) and upper limits to 6000 K", unit = "not stated (inferred: J/mol)", shape = "function", role = "input" },
  { name = "refStable expression", meaning = "energy of the element in its reference structure (the content of the GHSER function)", unit = "not stated (inferred: J/mol)", shape = "function", role = "input" },
  { name = "refSER entry", meaning = "reference phase, mass, H298, S298 of the element", unit = "not stated (inferred: g/mol, J/mol, J/mol/K)", shape = "table", role = "input" },
]
origin = "SGTE91: Dinsdale 1991 (comment); SR2016: not stated"
conventions = "The stable element reference: GHSER functions are created for each element as a Database symbol named GHSER + the first two letters of the symbol (the symbol letters are doubled for one-letter elements, so boron is GHSERBB) and set as the endmember energy basis; lattice-stability symbols are named G + the first three letters of the phase or alias name + the element symbol. The SER data fall back to SGTE91 when the chosen set lacks an element."
absence = "An element missing in the chosen SER set falls back to the SGTE91 SER data, with a warning when neither has it; formation energies cannot then be fitted."
validity = "T limits of each piece"
provenance = "SGTE91 comment cites Dinsdale 1991; nothing for SR2016"
count = "SGTE91Stable 78, SGTE91 339, SGTE91SER 80, SR2016Stable 2, SR2016 6"
example = "espei/refdata.py:61-76"
candidate = "a parameterization of standard_state_species parameter sets with an energy_reference of type stable_element_reference and element_reference rows"
precision = "close"
loss = "Both the data and the lattice-stability naming are conventions in code; a reference set is selected by attribute name; SER data mix mass and thermochemical reference data."

[[construct]]
name = "fitted parameter symbols and outputs"
locator = "espei/paramselect.py:143-248 (get_next_symbol, insert_parameter); espei/utils.py:90-96 (sigfigs), :155-172 (database_symbols_to_fit); espei/optimizers/opt_base.py; espei/espei_script.py:236-245"
meaning = "Parameter generation writes each fitted coefficient as a new Database symbol named VV followed by a zero-padded four-digit counter (VV0000, VV0001, ...), whose value is rounded to 6 significant figures, and inserts a PARAMETER whose expression multiplies each symbol by its temperature feature and, for interactions, by the composition feature and Redlich-Kister order; endmember G parameters also add site-ratio-weighted GHSER symbols; pure-element endmembers of phases with a known lattice stability get a G parameter equal to the number of moles times the lattice-stability symbol. After MCMC the database symbols are replaced by the optimum chain point; the trace (chains x iterations x parameters) and the log-probability (chains x iterations) are written with numpy.save to the files named in output."
subject = "A fitted coefficient of a parameter in a phase at a constituent array and order."
fields = [
  { name = "symbol name", meaning = "VV####: no phase, array, order or feature is encoded; the link exists only in the PARAMETER expressions", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "symbol value", meaning = "coefficient rounded to 6 significant figures", unit = "not stated (inferred: J/mol times the feature's unit)", shape = "scalar", role = "computed" },
  { name = "trace array", meaning = "all chain positions of the MCMC run", unit = "not applicable (parameter values)", shape = "table", role = "computed" },
  { name = "lnprob array", meaning = "log prior plus log likelihood per chain and iteration", unit = "not applicable (log probability)", shape = "table", role = "computed" },
]
origin = "generated by ESPEI; the ESPEI version is logged but not written into the TDB"
conventions = "Counter restarts at 0 for each phase and skips names already used; phases are fitted in alphabetical order so numbering is reproducible. The coefficient features are 1, T, T ln T, T^2, T^-1, T^3 of a G parameter (from the heat-capacity, entropy and enthalpy steps) multiplied by the composition features YS*Z^order for binary interactions and YS or YS*V_I, YS*V_J, YS*V_K for ternaries. The optimum written to the TDB is the highest-log-probability point in the trace (first unique maximum)."
absence = "No covariance, no posterior summary, no link from a symbol to the datasets that determined it, and no record of the ridge alpha or penalty factors are written to the TDB."
validity = "not applicable"
provenance = "none in the output file; the TDB written by pycalphad carries a generation-date header"
count = "not applicable (run output)"
example = "espei/paramselect.py:143-158"
candidate = "parameter_set rows (values) with derivation (kind fit) and fit (objective, outcome) plus slot_uncertainty where a posterior is kept"
precision = "narrower"
loss = "A mapping can only assign the fit derivation by supplying the datasets and settings separately; chain and covariance information has no slot except the fit record's objective and a dependency for the prior."

# ---------------------------------------------------------------------------
# MODEL FAMILIES
# ---------------------------------------------------------------------------

[[model_family]]
name = "Parameter generation (feature sets and information criterion)"
locator = "espei/paramselect.py:262-447 (fit_parameters, phase_fit, generate_parameters); espei/parameter_selection/fitting_steps.py; model_building.py; selection.py; redlich_kister.py; fitting_descriptions.py"
class = "regression"
inputs = "single-phase fixed-configuration datasets (HM, SM, CPM with _FORM or _MIX), the phase models, the reference data; data below 298.15 K removed"
parameters = "per constituent array (endmember, binary or ternary interaction) and fitting step: selected feature coefficients; global: ridge_alpha, aicc_penalty_factor per phase and type"
composes = [
  { slot = "fitting step", accepts = "FittingStep objects: StepCPM (features T ln T, T^2, T^-1, T^3), StepSM (T), StepHM (1), StepV0 (1), StepLogVA (T, T^2, T^3, T^-1)", default = "gibbs_energy_fitting_description = [CPM, SM, HM] (molar-volume descriptions exist as alternatives)" },
  { slot = "model class", accepts = "a pycalphad Model subclass that defines the fixed contributions", default = "pycalphad Model" },
  { slot = "candidate builder", accepts = "successive temperature feature sets crossed with successive Redlich-Kister orders (L0 to L3 by default) or, for ternaries, a symmetric term and an asymmetric triple", default = "build_redlich_kister_candidate_models; switches to a simpler cross product above 1000 candidates" },
  { slot = "selection", accepts = "ridge or ordinary least-squares fit plus the modified AICc", default = "ordinary least squares when ridge_alpha is null" },
]
variants = "excess_model: only linear; the order of steps matters because each step fits the residual left by the previous steps (fixed_portions); parameters already present in an input database are not refitted"
equation_source = "docs/ and code comments: the modified AICc with a per-phase parameter penalty; the approach references the ESPEI paper (Bocklund et al. 2019, MRS Communications 9(2)) in docs/index.rst"
closed_form = "procedural"
data = "construct single-phase fixed-configuration dataset"

[[model_family]]
name = "Model scoring: ridge or least-squares fit and modified AICc"
locator = "espei/parameter_selection/selection.py:10-128"
class = "regression"
inputs = "feature matrix, response vector, dataset weights used as sample weights"
parameters = "ridge alpha; AICc penalty factor p (per phase and property); the number of features k; the number of points n"
composes = []
variants = "AICc = n ln(RSS/n) + 2pk plus a correction (2p^2k^2 + 2pk)/(n - pk - 1), replaced by a finite alternative when pk is at least n - 1; RSS below 1e-16 is set to 1e-16; an exact fit (score minus infinity) ends the search; the lowest score among candidates wins"
equation_source = "described in the docstring (modified AICc); no citation"
closed_form = "yes"
data = "none bundled"

[[model_family]]
name = "MCMC optimisation"
locator = "espei/optimizers/opt_mcmc.py:16-315; espei/priors.py; espei/error_functions/context.py; espei/error_functions/residual_base.py"
class = "regression"
inputs = "a Database with fittable symbols, datasets, phase models, priors, data weights"
parameters = "symbols to fit, initial guess = the symbol values (first piece of a Piecewise); chains = number of parameters times chains_per_parameter; each chain starts from a normal draw with standard deviation |parameter| times chain_std_deviation (chain 0 is the exact initial guess); deterministic runs use fixed seeds 1769 and a stored random state"
composes = [
  { slot = "residual functions", accepts = "ResidualFunction objects registered in residual_function_registry: ZPFResidual, ActivityResidual, FixedConfigurationPropertyResidual, EquilibriumPropertyResidual", default = "all four registered" },
  { slot = "prior", accepts = "PriorSpec (normal, uniform, triangular, zero) or a user object with logpdf, per parameter", default = "zero prior (ln p = 0, improper)" },
  { slot = "scheduler", accepts = "a map-able object (dask client or scheduler file) or none", default = "dask local cluster" },
]
variants = "restart from a saved trace: the last iteration of each chain becomes the new start; lnprob = sum of prior log pdf + sum of the registered log-likelihoods; proposals with minus infinity prior skip the likelihood"
equation_source = "Goodman and Weare 2010 affine-invariant ensemble sampler as implemented by emcee (Foreman-Mackey et al. 2013), cited in the class docstring"
closed_form = "procedural"
data = "all dataset constructs"

[[model_family]]
name = "ZPF likelihood (driving force to a target hyperplane)"
locator = "espei/error_functions/zpf_error.py:1-449"
class = "regression"
inputs = "phase boundary datasets, current parameter values"
parameters = "standard deviation 1000 J/mol divided by the ZPF data weight and the dataset weight"
composes = []
variants = "for each phase region: compute chemical potentials at each vertex with all phases active (skipped for unknown compositions and for stoichiometric-only vertices), take their mean as the target hyperplane, then for each vertex the driving force is the hyperplane dot product with the vertex composition minus the phase's energy at that composition (a max over sampled points when the composition is unknown; the disordered configuration when flagged); NaN hyperplane gives zero; infinite driving force returns minus infinity"
equation_source = "docstring cites the PanOptimizer rough-search approach; Bocklund et al. 2019 (docs/index.rst)"
closed_form = "procedural"
data = "construct phase boundary (ZPF) dataset"

[[model_family]]
name = "Activity likelihood"
locator = "espei/error_functions/activity_error.py:62-227"
class = "regression"
inputs = "activity datasets"
parameters = "standard deviation 500 J/mol in chemical potential divided by the ACR data weight and the dataset weight"
composes = []
variants = "residual = computed chemical potential minus (R T ln a + reference-state chemical potential); reference computed by an equilibrium at reference_state.conditions; NaN likelihood returns minus infinity"
equation_source = "not cited"
closed_form = "procedural"
data = "construct activity dataset"

[[model_family]]
name = "Fixed-configuration property likelihood"
locator = "espei/error_functions/non_equilibrium_thermochemical_error.py:250-506"
class = "regression"
inputs = "single-phase datasets with output HM_FORM, SM_FORM, CPM_FORM, HM_MIX, SM_MIX or CPM_MIX"
parameters = "standard deviations 500 J/mol (HM), 0.2 J/K/mol (SM and CPM), described as estimated from NIST TRC uncertainties, divided by the per-type data weight and the dataset weight"
composes = []
variants = "models are built with excluded contributions set to zero; _FORM properties are referenced to the pure elements in the TDB's ELEMENT reference phases (shift_reference_state), _MIX to the endmember reference model; no equilibrium is solved (a solver that does not iterate evaluates the properties at the dataset's site fractions); the query on output uses a substring test, so a bare output such as HM is matched by both the HM_FORM and HM_MIX groups (inferred from Python semantics of x in prop on a string; not executed)"
equation_source = "std deviation comment cites NIST TRC"
closed_form = "procedural"
data = "construct single-phase fixed-configuration dataset"

[[model_family]]
name = "Equilibrium property likelihood"
locator = "espei/error_functions/equilibrium_thermochemical_error.py:38-317"
class = "regression"
inputs = "equilibrium thermochemical datasets"
parameters = "standard deviations 500 J/mol (HM), 0.2 J/K/mol (SM, CPM), other outputs 1.0, divided by data and dataset weights"
composes = []
variants = "an equilibrium is solved at each point; reference_states shift the property; any NaN or infinity difference gives minus infinity"
equation_source = "not cited"
closed_form = "procedural"
data = "construct equilibrium thermochemical dataset"

# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units and composition basis"
locator = "docs/input_data.rst (Units); espei/error_functions/*"
statement = "Energies J/mol-atom (per mole of atoms of the phase) and their derivatives, compositions mole fractions, temperature K, pressure Pa; parameter fitting converts to per mole of formula unit with the pycalphad site-ratio normalisation and back; activities are dimensionless; ZPF driving forces are J/mol."
scope = "all datasets and residuals"

[[convention]]
name = "formation and mixing reference states"
locator = "espei/error_functions/non_equilibrium_thermochemical_error.py:304-336; espei/parameter_selection/fitting_steps.py:103-173"
statement = "_FORM quantities are relative to the pure elements in the reference phases named by the TDB ELEMENT statements at the same temperature, not relative to fixed 298.15 K values; in parameter generation the GHSER functions are set to zero so models are in the formation state. _MIX quantities are relative to the weighted endmembers of the phase. Absolute outputs (HM, SM, CPM without suffix) raise ValueError in the shift step of parameter generation and are not in the error function's list of properties."
scope = "single-phase datasets and fits"

[[convention]]
name = "sublattice configuration encoding"
locator = "espei/datasets.py:190-207; espei/sublattice_tools.py:1-128; docs/input_data.rst (Common Mistakes)"
statement = "A configuration has one entry per sublattice of the phase; a single species name means no mixing on that sublattice, a list means mixing. A single-species sublattice in the phase model is a one-element list but a plain string in a configuration. Mixing lists must be alphabetically sorted; occupancies repeat the structure with 1 for non-mixing entries. Configurations are compared after canonicalisation: sublattices named equivalent are sorted together."
scope = "solver blocks"

[[convention]]
name = "fixed standard deviations and weights"
locator = "espei/error_functions/*.py; espei/parameter_selection/selection.py"
statement = "Likelihoods are Gaussian with standard deviations: ZPF 1000 J/mol, activity 500 J/mol, HM 500 J/mol, SM and CPM 0.2 J/K/mol, each divided by the data-type weight from data_weights and by the dataset weight. In parameter generation the per-type values are not used; dataset weights act as sample weights in the regression. No per-point uncertainty field exists in the dataset format."
scope = "MCMC and parameter generation"

[[convention]]
name = "symbol naming"
locator = "espei/paramselect.py:143-158, :376-414; espei/database_utils.py:99-116; espei/utils.py:155-172"
statement = "Fitted coefficients VV####; element reference functions GHSER plus two letters of the element symbol (letters doubled for one-letter symbols); lattice stabilities G plus three letters of the phase name plus the element. A symbol is fitted by default when it matches V or VV followed by digits."
scope = "output TDB and MCMC parameter selection"

[[convention]]
name = "temperature limits and minimum temperature"
locator = "espei/core_utils.py:48-70 (filter_temperatures); espei/refdata.py"
statement = "Data with T below 298.15 K are discarded before fitting because the unary reference expressions are defined from 298.15 K for most elements; the docstring justifies this by saying pycalphad does not extrapolate outside piecewise temperature limits. The pinned pycalphad 0.11.2 extrapolates them by default (see discrepancies)."
scope = "non-equilibrium thermochemical data"

[[convention]]
name = "random seeds"
locator = "espei/optimizers/opt_mcmc.py (initialize_new_chains, _fit); espei/rstate.py"
statement = "With deterministic set, chain initialisation uses a RandomState seeded 1769 and the sampler uses a stored Mersenne Twister state, so the same database and settings reproduce the same chains."
scope = "MCMC"

