subject = "One dataset, keyed by its file path (no identifier inside the object)."
fields = [
  { name = "components", meaning = "list of component names including VA where a vacancy is involved; must match the components used by the conditions, configurations or tie lines up to the degrees of freedom", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "phases", meaning = "list of phase names: for ZPF every entered phase must appear in some tie-line point; for single-phase data exactly one phase; for equilibrium and activity data all phases that can form", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "conditions", meaning = "dict with P and T (scalar or list) and, for equilibrium and activity data, X_<component> lists of composition", unit = "Pa and K (docs/input_data.rst) and mole fractions", shape = "table", role = "input" },
  { name = "output", meaning = "name of the quantity: ZPF, ACR_<component>, or a property with optional suffix (HM, SM, CPM and _FORM, _MIX variants; V0 and VM are read by the molar-volume fitting steps)", unit = "not applicable (text)", shape = "enum", role = "input" },
  { name = "values", meaning = "array whose shape is fixed by the conditions (see the per-kind constructs); floats are coerced by clean_dataset", unit = "J/mol-atom, J/K/mol-atom, dimensionless (activity) depending on output; ZPF values are compositions", shape = "table", role = "input" },
  { name = "reference", meaning = "source label; required in ZPF datasets (get_zpf_data indexes it) and logged elsewhere", unit = "not applicable (text)", shape = "reference", role = "metadata" },
  { name = "comment", meaning = "free note, stated in the docs to take no effect", unit = "not applicable (text)", shape = "scalar", role = "unread" },
  { name = "weight", meaning = "positive factor that divides the standard deviation of this dataset's likelihood (and is used as a sample weight in parameter generation); default 1.0", unit = "not applicable (dimensionless)", shape = "scalar", role = "input" },
  { name = "disabled", meaning = "if true the dataset is skipped at load (load_datasets) and removed again in run_espei", unit = "not applicable (flag)", shape = "scalar", role = "input" },
  { name = "tags", meaning = "list of tag names used to apply YAML-declared modifications (apply_tags)", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "excluded_model_contributions", meaning = "list of pycalphad Model contribution names (for example idmix, mag) set to zero in the model and its reference when fitting this dataset", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "broadcast_conditions", meaning = "present in test and dataset files; never read by the ESPEI code (occurs only in tests/testing_data.py)", unit = "not applicable (flag)", shape = "scalar", role = "unread" },
  { name = "plot", meaning = "plot styling dictionary in one dataset file; never read by the library code", unit = "not applicable (text)", shape = "table", role = "unread" },
  { name = "bibtex, author", meaning = "named by the ESPEI-datasets README as required; not read by any ESPEI code", unit = "not applicable (text)", shape = "scalar", role = "unread" },
]
origin = "authored or transcribed from publications (experiments) or produced by first-principles calculations; the dataset file records which through reference, not through a field"
conventions = "JSON only (double quotes, no trailing commas). Units: energies J/mol-atom and their derivatives, compositions mole fractions, T in K, P in Pa. clean_dataset converts all numeric conditions, site ratios, occupancies and values to floats; ZPF tie-line points whose compositions are all null are left unchanged. A missing P or T key raises (conditions['P'] and ['T'] are indexed)."
absence = "An absent excluded_model_contributions means no contribution is excluded; an absent weight means 1.0; an absent key that the docs call optional (comment) has no effect. null inside ZPF compositions means an unknown composition (see the ZPF construct); the source distinguishes null from zero there."
validity = "not stated; data below 298.15 K are discarded by filter_temperatures in parameter generation and in the non-equilibrium thermochemical residual"
