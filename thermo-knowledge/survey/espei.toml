# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "docs/input_data.rst (Phase Descriptions) versus espei/refdata.py and docs/writing_input.rst"
documented = "input_data.rst says the reference state is a string for a dictionary in a reference module and only SGTE91 is implemented"
actual = "refdata.py defines SGTE91 and SR2016, and writing_input.rst lists both; the reference state is chosen by generate_parameters.ref_state in the YAML, not by the refdata key of the phase-model JSON, which no code reads."
consequence = "The refdata key in the 5 old phase-model files of espei_datasets has no effect; the reference-state choice is a run setting, not a property of the phase models."

[[discrepancy]]
locator = "docs/writing_input.rst (ridge_alpha) versus espei/input-schema.yaml and espei/parameter_selection/selection.py:10-40"
documented = "ridge_alpha default 1.0e-100"
actual = "the schema default is null and null selects ordinary least squares (LinearRegression), not ridge regression"
consequence = "Fits that rely on the stated default are unregularised; the recorded setting of a run is null, not 1e-100."

[[discrepancy]]
locator = "docs/input_data.rst (Non-equilibrium Thermochemical Data) versus espei/error_functions/non_equilibrium_thermochemical_error.py:311-315 and espei/parameter_selection/fitting_steps.py:103-173"
documented = "currently only CPM*, SM* and HM* are supported, where * is nothing, _MIX or _FORM"
actual = "the error function lists only the six suffixed properties and the regression steps read only _MIX and _FORM (bare HM, SM, CPM raise ValueError in the shift step); by the query in get_prop_data (substring test on a string) a bare HM, SM or CPM dataset is matched by both the _FORM and _MIX groups of the error function, and SM_EX_FORM matches none."
consequence = "In espei_datasets 10 of 114 single-phase datasets (HM 3, SM 3, CPM 3, SM_EX_FORM 1; 2157 data points for the bare outputs) have outputs that the error function's property list does not contain; whether they enter the MCMC likelihood, and twice, depends on the substring behaviour (inferred from Python semantics, not executed)."

[[discrepancy]]
locator = "docs/input_data.rst (Equilibrium Thermochemical Data) versus espei/error_functions/equilibrium_thermochemical_error.py:126-140"
documented = "only activity data are supported at the moment for equilibrium thermochemical data"
actual = "the equilibrium residual accepts any dataset without a solver key whose output is not ZPF, ACR, DIFF or TRACER; activity datasets are handled by a separate residual."
consequence = "Equilibrium thermochemical datasets beyond activity are consumed by the code although the docs say they are not."

[[discrepancy]]
locator = "docs/writing_input.rst (symbols) versus espei/utils.py:155-172"
documented = "by default any symbol following the pattern VV followed by digits is optimised"
actual = "the default regular expression is ^V[V]?([0-9]+)$, so V followed by digits also matches"
consequence = "A database symbol such as V0001 is fitted by default; naming collisions with other V-symbols are possible."

[[discrepancy]]
locator = "espei/core_utils.py:48-70 (filter_temperatures docstring) versus pycalphad/model.py:215-217 and :329-366 (pinned pycalphad 0.11.2)"
documented = "the docstring says pycalphad does not extrapolate outside piecewise temperature limits, which is why data below 298.15 K are filtered"
actual = "in pycalphad 0.11.2 Model.extrapolate_temperature_bounds is True by default and unwrap_piecewise widens the first and last pieces to negative and positive infinity; the filter still removes data below 298.15 K."
consequence = "The filter excludes data that the pinned library would evaluate with an extrapolated expression; which pycalphad version ESPEI 0.9.1 targets is not stated in the files read."

[[discrepancy]]
locator = "docs/writing_input.rst (approximate_equilibrium) versus espei/optimizers/opt_mcmc.py"
documented = "approximate_equilibrium is described as a setting that speeds up ZPF likelihood evaluation"
actual = "a DeprecationWarning says it is deprecated and will be removed in ESPEI 0.10"
consequence = "The setting is carried by the schema but should not be mapped as a supported option."

