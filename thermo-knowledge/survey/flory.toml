source = "flory"
pin = "239a02dbbbb5"
surveyed = "2026-09-30"
summary = "flory 0.3.1 (MIT) finds coexisting phases of incompressible multicomponent mixtures by an improved Gibbs-ensemble method on volume-fraction free energies split into interaction, entropy, ensemble and constraint parts; it ships the Flory-Huggins interaction (full or block chi matrix), ideal-gas-like entropy with relative molecular sizes (including polydispersed components that share a feature), canonical and grand canonical ensembles and linear global or local constraints. A component has no chemical identity, only an index and a relative size. It bundles no data files, no temperature or pressure variables and no equation of state."

