  "examples/requirements.txt",
]
format = "Python example scripts with their console output stored beside them as .py.out text files (Volumes and Compositions arrays as printed by numpy) and three figures"
files = 21
bytes = 75449
records = "10 scripts, 7 output files, 3 images and 1 requirements file, counted by listing"
reader = "python3 runs a script (they import flory); the .out files are plain text written by the scripts themselves (open(__file__ + '.out', 'w'))"
read_by_source = "none"
notes = "The outputs are the only recorded numerical results in the tree (for example two coexisting phases of a binary with chi 4 and sizes 1 and 2: volumes near 0.494 and 0.506, compositions near 0.999 and 0.012). The tests (tests/test_examples.py) rerun the scripts; the examples exercise unequal sizes, ternary systems, polydispersed components, grand canonical ensembles and linear constraints."

