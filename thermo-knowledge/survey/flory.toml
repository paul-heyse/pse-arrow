meaning = "A component is the position i in a vector of N_C entries. It has no name, formula, molar mass or identifier; its only intrinsic attribute is the relative molecular volume l_i = nu_i/nu with respect to an unnamed reference molecule volume nu (default 1). Solvent is an ordinary component: no implicit solvent is assumed."
subject = "An index in the composition vector; the order is the user's."
fields = [
  { name = "sizes", meaning = "relative molecule volumes l_i = nu_i/nu", unit = "not applicable (dimensionless ratio)", shape = "list", role = "input" },
  { name = "num_comp", meaning = "number of components N_C", unit = "not applicable (count)", shape = "scalar", role = "input" },
]
origin = "authored"
conventions = "nu is 'a reference molecule' and is not defined further; sizes all equal to one give the equal-volume case. Volume fractions phi_i of all components sum to one in every phase."
absence = "sizes defaults to a vector of ones; a size of one is not distinguishable from 'not given'."
validity = "not stated"
provenance = "none"
count = "0 bundled"
