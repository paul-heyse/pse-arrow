[[discrepancy]]
locator = "flory/entropy/ideal_gas.py IdealGasEntropyBase docstring and flory/free_energy/flory_huggins.py FloryHuggins docstring"
documented = "f_entropy = sum_i (nu/nu_i) phi_i ln phi_i, described as 'dimensionless entropic energy'"
actual = "README.md writes the same term as sum phi_i/l_i ln phi_i with l_i the relative size; the two agree only with l_i = nu_i/nu, which the docstrings state but the README does not"
consequence = "No value is affected; the size convention l_i = nu_i/nu is the one to record."

[[discrepancy]]
locator = "flory/ensemble/canonical.py CanonicalEnsemble.__init__ and phi_means setter; flory/shortcut.py find_coexisting_phases (docstring)"
documented = "CanonicalEnsemble docstring: 'If omitted, an equimolar system is initialized'; shortcut docstring: the sum of phi_means must be one"
actual = "the default is np.full(num_comp, 1/num_comp), equal volume fractions (equimolar only when all sizes are equal); a sum different from one only logs a warning ('the iteration may never converge')"
consequence = "The default composition is an equal-volume-fraction system, not an equimolar one, when sizes differ; the normalisation requirement is advisory."

