# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "incompressible volume-fraction composition"
locator = "flory/free_energy/base.py check_volume_fractions; docs/source/theory.rst"
statement = "Every phase is incompressible: the volume fractions of all components sum to one, none is negative (values above one are not refused), and there is no implicit solvent. Sizes are relative to a reference molecule volume nu."
scope = "all constructs"

[[convention]]
name = "dimensionless free energy"
locator = "flory/entropy/ideal_gas.py docstrings; docs/source/theory.rst"
statement = "The entropic energy is called 'dimensionless' and the chi parameters carry no unit, so the free energy density is in units of k_B T per reference volume; the source does not state this reference explicitly and no temperature or pressure appears in any function."
scope = "free energy, chemical potentials, pressure"

[[convention]]
name = "chi symmetry and diagonal"
locator = "flory/interaction/flory_huggins.py (chis setter)"
statement = "chi is symmetrised as (chi + chi^T)/2 with a logged warning; the diagonal is unconstrained (convenience constructors default to a vanishing diagonal)."
scope = "interaction matrix"

[[convention]]
name = "number of phases by compartments"
locator = "docs/source/theory.rst; flory/mcmp/finder.py"
statement = "The number of phases is not optimised: a fixed number of compartments N_M (default 8 N_C) is relaxed and compartments that converge to the same composition are clustered into one phase; compartments with vanishing volume are killed and may be revived. The method does not guarantee the global minimum."
scope = "coexistence finding"

[[convention]]
name = "chemical potential conventions"
locator = "flory/free_energy/base.py chemical_potentials, exchange_chemical_potentials, pressure; flory/ensemble/grandcanonical.py"
statement = "chemical_potentials returns the 'original chemical potentials by unit volume'; exchange_chemical_potentials are taken relative to a solvent component chosen by index; pressure is the osmotic pressure of a chosen solvent component; the grand canonical scaled activity is l_i exp(l_i mu_i)."
scope = "free energy derived quantities, grand canonical ensemble"

