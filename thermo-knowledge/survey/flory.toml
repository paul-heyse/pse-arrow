# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "reference molecule volume nu"
question = "Sizes are l_i = nu_i/nu with respect to 'a reference molecule' that is never defined, and chi is per reference volume; how should a chi set record the reference volume so that two sources can be compared?"
why_it_matters = "Two chi sets with different reference volumes are different parameters; the model stores only the ratio."

[[question]]
about = "units of the free energy and of mu"
question = "The free energy density is called dimensionless and the grand canonical ensemble uses mu 'by volume' in l_i exp(l_i mu_i); is mu in units of kT per reference volume, and does any function depend on the value of kT?"
why_it_matters = "It fixes the quantity types of chemical potentials and whether the model has a temperature at all."

[[question]]
about = "uniqueness of the clustered phases"
question = "The phases are obtained by clustering compartments at a distance of 1e-2, the method may not find the global minimum, and the initialisation is random (time-seeded); how should a result record the clustering threshold and the lack of a global-minimum guarantee?"
why_it_matters = "A stored coexistence result is a local solution with a tolerance, not a unique equilibrium."

[[question]]
about = "polydispersed components and feature identity"
question = "IdealGasPolydispersedEntropy groups components of different size into one feature that shares a field and a chi; is the feature meant to represent one polymer species with a chain-length distribution, and is there a constraint on the relation between the component sizes and the mean volume fractions?"
why_it_matters = "It decides how a distribution over molar mass is carried (as one sample with a distributed_attribute or as separate components)."
