[[discrepancy]]
locator = "fundam.pdf Section 2.1 and Dielec.pdf Table 1"
documented = "IAPWS recommends the most recent CODATA values of fundamental constants (2022 adjustment at the time of G5-01(2026))"
actual = "older documents use older constants (R8-97 Table 1: k = 1.380 658e-23 J/K, N_A = 6.022 136 7e23 1/mol; R16-17 uses 2014 CODATA for R) and AN2 note n) says values used in older documents may differ slightly from the latest"
consequence = "constants belong to the parameterisation and must not be replaced by current values"

[[discrepancy]]
locator = "SR4-04 and SR3-03 and SR2-01 consistency tables versus the statement of a tolerated difference"
