summary = "The IAPWS documents in the raw store are 43 PDFs (16 releases, 7 supplementary releases, 14 guidelines, 6 advisory notes; 11100286 bytes, 583 pages) and the index page that lists them. They contribute reference formulations of the properties of ordinary and heavy water and some aqueous mixtures as published equations: Helmholtz-energy potentials (IAPWS-95, heavy water, ammonia-water, humid air), Gibbs-energy potentials (ice Ih, seawater, IF97 regions 1, 2 and 5), the regionally piecewise industrial formulation IAPWS-IF97 with about twenty families of backward equations, correlations (saturation, melting, sublimation, surface tension, Henry constants, critical locus), transport formulations (viscosity, thermal conductivity) and table-lookup methods, each with its range, stated uncertainty and computer-program verification values. It carries no machine-readable data: every coefficient is inside a PDF table. Five PDFs (G1-90, G2-90(1994), R2-83(1992), R8-97, SR1-86(1992)) have no text layer and were read as page images; all page and byte counts are measured from the files, and no coefficient table is reproduced here."

