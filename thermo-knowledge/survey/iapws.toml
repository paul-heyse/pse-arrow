[[question]]
about = "coefficient values"
question = "Are the coefficient tables of each formulation (for example Tables 1 and 2 of IAPWS-95) machine-readable somewhere other than the PDFs, and do transcriptions by other libraries agree digit for digit?"
why_it_matters = "Transcription from PDF is the only route in the store; verification values decide whether a transcription is correct."

[[question]]
about = "IAPWS-95 non-analytic terms"
question = "Which independent parameter set (in other sources) holds the parameters of IAPWS-95 terms 55 and 56 (a, b, B, n, C, D, A, beta)?"
why_it_matters = "The form needs them to reproduce the verification tables; the release lists them in Table 2."

[[question]]
about = "scanned documents"
question = "Is a text version of G1-90, G2-90(1994), R2-83(1992), R8-97 and SR1-86(1992) available from IAPWS?"
why_it_matters = "Their coefficients were read from page images and any transcription is error-prone."

[[question]]
about = "obsolete and superseded"
question = "Which revisions before the ones in the store (R6-95 of 1996, 2009, 2014, 2016; the 1993 melting and sublimation release; R4-84, R3-84 for heavy water; the 1980 ion product release) are needed to reproduce older results?"
why_it_matters = "The index says obsolete recommendations are in a separate document not acquired; data tied to an older revision cannot be checked here."

[[question]]
about = "uncertainty figures"
question = "Can the region boundaries and percentages in the uncertainty figures (IAPWS-95 Figs. 1 to 4, IF97 Figs. 3 to 6, heavy water Figs. 1 to 4, viscosity and thermal conductivity Fig. 1) be obtained as numbers?"
why_it_matters = "They are drawings with approximate lines; envelope rows need numeric boundaries."

[[question]]
about = "IF97 consistency requirement origin"
question = "What are the \"Prague values\" (reference [13] of IF97) and the survey that fixed the tolerances of the backward equations?"
why_it_matters = "These tolerances become max_relative_error of auxiliary_of rows."

[[question]]
about = "heavy-water critical pressure"
question = "Which critical pressure is authoritative for heavy water in the viscosity and thermal-conductivity formulations: 21.6618 MPa (release) or 21.671 MPa (R2-83, G5-01)?"
why_it_matters = "The reducing pressure is part of the transport parameter sets."

[[question]]
about = "standard-state assumptions"
question = "What reference state does the ionization constant use for the conventional ion standard state beyond \"molal standard state for the ionic species and mole-fraction for water\"?"
why_it_matters = "pKw at rho = 0 ideal gas is defined from reference thermodynamic data [5] not in the store."

[[question]]
about = "TTSE and SBTL tables"
question = "Are the stored tables of TTSE and SBTL (node values, spline coefficients) published, and how large?"
why_it_matters = "Only the method is described; using them as a tabulated function needs the table."

[[question]]
about = "dataset of IAPWS-95"
question = "What experimental data were used in fitting IAPWS-95 (the index mentions a compilation of experimental data used to develop IAPWS-95)?"
why_it_matters = "This would be a measured dataset with provenance and an evidence base for qualification; it is a separate acquisition."

[[question]]
about = "ammonia residual"
question = "Do later revisions of G4-01 change the pure ammonia equation in the Appendix?"
why_it_matters = "The mixture form composes that parameter set."

[[question]]
about = "density of water"
question = "Is the CIPM density formulation (Advisory Note 4) acquirable, and does it need a separate record?"
why_it_matters = "AN4 selects between two density standards, only one of which is in the store."
