statement = "The internal energy and entropy of the saturated liquid at the triple point are zero (5th International Conference on the Properties of Steam, London 1956): T_t = 273.16 K. Consequences stated: h'_t = 0.611 782 J/kg (IAPWS-95), 0.611 783 J/kg (IF97), 0.611 786 J/kg (SR1-86), u and s of ice Ih and seawater chosen consistently (R10-06 two s0 values; R13-08 Eqs. (5), (6): s and h of seawater at normal salinity and 273.15 K tied to the water values). Heavy water uses the same convention at T_t = 276.969 K. Humid air fixes s and h of dry air to zero at 273.15 K and 101 325 Pa (G8-10 Eqs. (6), (7))."
scope = "thermodynamic formulations (enthalpy and entropy have no other datum)"

[[convention]]
name = "mass versus molar basis"
locator = "each formulation"
statement = "IAPWS-95, IF97, ice Ih, SR1 to SR7, seawater and humid air are mass-based (J/kg, kg/m3); heavy water (R16-17) and ammonia-water (G4-01) are molar (J/mol, mol/dm3). The conversion requires a molar mass: 18.015 268 g/mol for ordinary water (G5-01, VSMOW) and 20.027 508 g/mol for heavy water. R18-21 uses a specific gas constant for heavy water (0.415 151 99 kJ/kg/K) in transport correlations while R16-17 is molar."
scope = "all thermodynamic documents"

[[convention]]
name = "gas constants used"
locator = "IAPWS-95 Eq. (3); IF97 Eq. (1); SR6-08 Eq. (1); G12-15 Table 1; R16-17 Eq. (3); G4-01 Section 2; R13-08 Table 1; G8-10 Table 1; G11-15 Section 1; R15-11 Eq. (6); R18-21 Eq. (6)"
statement = "Each document fixes its own value: IAPWS-95 0.461 518 05 kJ/kg/K (from older molar gas constant and molar mass; using newer values would change it by about 1 part in 60 000, and the release says the value in Eq. (3) must be used); IF97 0.461 526 kJ/kg/K; SR6-08, G9-12 and R15-11 use 461.518 05 J/kg/K; G12-15 uses 461.523 087 J/kg/K; R16-17 uses 8.314 459 8 J/mol/K (2014 CODATA); G4-01 uses 8.314 471 J/mol/K; R13-08 and G8-10 use 8.314 472 J/mol/K; G8-10 uses 8.314 51 J/mol/K for dry air; G11-15 uses 8.314 462 1 J/mol/K; R18-21 uses 0.415 151 99 kJ/kg/K for heavy water."
scope = "every formulation; a value belongs to the parameterisation that used it"

[[convention]]
name = "critical constants"
locator = "R2-83(1992); G5-01; IAPWS-95 Eqs. (1), (2); R16-17 Eqs. (1), (2)"
statement = "Ordinary water: T_c = 647.096 K (ITS-90), p_c = 22.064 MPa, rho_c = 322 kg/m3. Heavy water (R2-83, G5-01): T_c = 643.847 K, p_c = 21.671 MPa, rho_c = 356 kg/m3. R16-17 uses T_c = 643.847 K and rho_c = 17.775 55 mol/dm3 (massic critical density converted with M = 20.027 508 g/mol). R2-83 gives the uncertainties: delta1 = 0.000 +- 0.100 K for the temperature with p_c = (22.064 + 0.27 delta1 +- 0.005) MPa, and rho_c = 322 +- 3 kg/m3 (heavy water: +-0.200 K, 21.671 + 0.27 delta2 +- 0.010 MPa, 356 +- 5 kg/m3)."
scope = "reduced variables of all formulations"

[[convention]]
name = "triple point"
locator = "R10-06 Table 1; IAPWS-95 footnote 1; IF97 Eq. (9); G5-01 Section 4.2"
statement = "T_t = 273.16 K; the experimental triple-point pressure is 611.657(10) Pa (G5-01 recommends (611.657 +- 0.010) Pa); the pressure calculated from IAPWS-95 and ice Ih is 611.654 771 007 894 Pa and is used as the numerical triple point in R10-06, R13-08, SR7-09, G12-15 and quoted as 611.654 771 Pa in R6-95; IF97 uses 611.657 Pa; heavy water T_t = 276.969 K."
scope = "reference states and melting and sublimation equations"

[[convention]]
name = "uncertainty vocabulary"
locator = "IAPWS-95 Section 6; R12-08 Section 2.5; R16-17 Section 7; R10-06 Section 6; SR6-08 Section 2.3"
statement = "The releases of different age use different words: IAPWS-95 and IF97 give \"tolerances\" with \"no statistical significance\" (a judged range); R10-06 and G8-10 give combined standard uncertainties uc and expanded uncertainties U = k uc with k = 2 (about 95 %); R12-08, R15-11, R16-17, R17-20, R18-21 and G14-19 give expanded uncertainties with coverage factor two; SR6-08 calls its values \"an estimate of the standard uncertainty with coverage factor k=2\"; G10-15 gives an overall standard uncertainty of 0.44 %; estimates for the high-pressure region of Figs. 2 and 3 of IAPWS-95 are stated as \"no definitive uncertainty estimates possible\", which is not zero."
scope = "uncertainty_kind of every mapped uncertainty"

[[convention]]
name = "reduced variables"
locator = "each formulation"
statement = "Helmholtz forms use delta = rho/rho_c and tau = T_c/T; IF97 regions 1, 2, 5 use pi = p/p* and tau = T*/T with region-specific p* and T*, sometimes with a shift in the series ((7.1 - pi), (tau - 1.222)); the backward equations use their own reducing values (for example h* = 2500 kJ/kg, s* = 1 kJ/kg/K); seawater and the oceanographic polynomial use tau = (T - 273.15 K)/40 K, pi = (p - 101 325 Pa)/1e8 Pa."
scope = "parameter sets (the reducing values belong to the parameter set)"

[[convention]]
name = "salinity and composition scales"
locator = "R13-08 Section 2; G14-19 footnote; G10-15 footnote; G8-10; G3-00"
statement = "Seawater uses Reference-Composition Salinity S in kg/kg (normal salinity S_n = 0.035 165 04 kg/kg, molar mass of sea salt 31.403 821 8 g/mol); practical salinity S_P converts by S = (35.165 04/35) S_P; humid air uses the mass fraction of dry air A; ammonia-water and the NaCl critical locus use mole fractions; G7-04 Henry constants use mole fraction and pressure ratio; Na2SO4 solubility uses molality."
scope = "composition columns of mixtures"

[[selection]]
name = "roles of the thermodynamic documents"
locator = "Advise2.pdf (notes a) to p))"
rule = "IAPWS-95 is the source of the thermodynamic properties of water and steam; the low-temperature extension reduces its gas limit from 130 K to 50 K; the ice Ih release defines the solid phase below the melting and sublimation curves; IF97 is fitted to IAPWS-95 and is not definitive; SR1-86 and the backward-equation supplementary releases reduce computing time; the supercooled-water guideline is believed more accurate than an extrapolation of IAPWS-95; R2-83 gives constants that other formulations use as parameters; G5-01 is reviewed annually so older documents may use older values."
scope = "all thermodynamic properties of ordinary water"
documented = "yes (this is the statement)"

[[selection]]
name = "CIPM density standard versus IAPWS-95"
locator = "Advise4.pdf (Section 2)"
rule = "Use the CIPM density formulation for metrology in liquid water from 0 C to 40 C at pressures near atmospheric; use IAPWS-95 outside that range and, where a calculation spans both ranges, IAPWS-95 for the whole calculation to avoid discontinuities; IF97 and the supplementary releases are not considered."
scope = "density of liquid water"
documented = "yes"

[[selection]]
name = "IAPWS-95 versus IF97 and the regions of IF97"
locator = "IF97-Rev.pdf (Sections 2 and 10)"
rule = "IF97 consists of regions chosen by temperature and pressure (region 2 versus 3 by the B23 equation, region 1 versus 4 by ps(T)); in the regions the basic equation of the region is used; in the boundary sections the equations are consistent within Prague values; backward equations T(p,h) and T(p,s) are chosen by subregion (p = 4 MPa, s = 5.85 kJ/kg/K or B2bc)."
scope = "properties of water and steam in industrial calculations"
documented = "yes"

[[selection]]
name = "supercooled water"
locator = "IAPWS-95.pdf (Section 5 item (3))"
rule = "For the subcooled liquid, IAPWS-95 agrees fairly with data but some high-pressure data are not represented within their uncertainties; the separate guideline G12-15 \"better represents\" the properties; for the subcooled gas below 10 MPa IAPWS-95 is reasonable close to the saturation line and an alternative \"gas equation\" exists in the source article."
scope = "metastable subcooled liquid and gas"
documented = "yes"

[[selection]]
name = "seawater water part"
locator = "Advise6.pdf (notes b) and g))"
rule = "The water part of seawater and humid air is IAPWS-95; SR7-09 substitutes it in oceanic ranges of temperature and pressure; AN5 substitutes IF97 region 1 for industrial use."
scope = "seawater and humid air"
documented = "yes"

[[selection]]
name = "critical-point equations"
locator = "crits.pdf (Table 1)"
rule = "Values of T_c, p_c and rho_c with a stated coupling of the uncertainties through the vapor pressure curve (p_c depends on the deviation delta1 of T_c); the same values are used as reducing parameters by other formulations."
scope = "ordinary and heavy water critical constants"
documented = "yes"

[[discrepancy]]
locator = "IAPWS-95.pdf Section 2 versus IF97-Rev.pdf Section 3"
documented = "the specific gas constant of ordinary water is 0.461 518 05 kJ/kg/K in IAPWS-95 (with a statement that a value derived from newer constants would be greater by about 1 part in 60 000)"
actual = "IF97 uses 0.461 526 kJ/kg/K; SR6-08, G9-12 and R15-11 use 0.461 518 05; G12-15 uses 0.461 523 087"
consequence = "properties computed in one formulation and mixed with another differ in the fifth significant digit unless each parameter set keeps its own R"

[[discrepancy]]
locator = "nh3h2o.pdf Section 3"
documented = "the mixture formulation is constrained to reproduce IAPWS-95 in the limit of pure water"
actual = "the release states differences up to 1 part in 60 000 arise from different gas constants and rounding of common reducing parameters; R = 8.314 471 J/mol/K differs slightly from the CODATA value 8.314 472 J/mol/K it cites"
consequence = "pure-water values from the mixture formulation are not equal to IAPWS-95 values"

[[discrepancy]]
locator = "Supp-sat.pdf Section 6 and IAPWS-95.pdf note under Section 4"
documented = "saturation properties of the release SR1-86 are identical to the IAPS Skeleton Tables 1985"
actual = "IAPWS-95 states the values from SR1-86 are not identical with values derived from Eq. (4) but agree within the uncertainties of the simple equations; SR1-86 itself states the IAPS-85 and IAPS-84 formulations give values that are not identical but agree within quoted tolerances"
consequence = "two saturation values coexist for ordinary water; the SR1 set is an approximation of the IAPWS-95 set"

[[discrepancy]]
locator = "MeltSub.pdf introduction"
documented = "the 1993 release on melting and sublimation pressures existed"
actual = "the 2011 revision states the 1993 equations were fitted to old data and are not thermodynamically consistent with IAPWS-95 and the ice Ih equation; the Ih melting, III melting and sublimation equations were replaced while V, VI, VII were unchanged"
consequence = "the superseded 1993 curves (not in the store) and the 2011 curves differ; only the current ones are here"

[[discrepancy]]
locator = "IAPWS-95.pdf Section 2, IF97-Rev.pdf Eq. (10), Supp-sat.pdf Section 5.2"
documented = "h of saturated liquid at the triple point follows from u = s = 0"
actual = "the three documents state 0.611 782 J/kg (IAPWS-95), 0.611 783 J/kg (IF97) and 0.611 786 J/kg (SR1-86)"
consequence = "enthalpy of the reference state differs in the last digits between documents and is not a single constant"

[[discrepancy]]
locator = "R10-06 Table 1; R6-95 footnote; IF97 Eq. (9)"
documented = "triple-point pressure"
actual = "IF97 states 611.657 Pa; R10-06, R13-08, SR7-09 and G12-15 use 611.654 771 007 894 Pa (calculated); R6-95 quotes 611.654 771 Pa calculated from the formulation; G5-01 recommends the measured 611.657(10) Pa"
consequence = "the triple point is a pair of values (experimental and numerical) whose use depends on the parameterisation"

[[discrepancy]]
locator = "R17-20 Section 2.2, R18-21 Section 2.2 versus R2-83 Table 1 and G5-01 Section 4.1 and G7-04 Section 2"
documented = "R18-21 says the reference temperature, pressure and density agree with the presently accepted values of the critical constants of heavy water recommended by IAPWS; G5-01 and G7-04 give p_c = 21.671 MPa for heavy water"
actual = "R17-20 and R18-21 use p* = 21.6618 MPa (R17-20 says it is the critical pressure of the IAPWS reference equation of state); R2-83 gives 21.671 MPa with a coupled tolerance"
consequence = "the heavy-water critical pressure has two values by document"

[[discrepancy]]
locator = "Supp-VPT3-2016.pdf cover and Advise2.pdf list"
documented = "SR5-05(2016) is revised in September 2016 (Advisory Note 2)"
actual = "the cover of the SR5 PDF is dated June 2014 (Moscow) and the membership statement refers to the June 2014 meeting while the identifier carries 2016"
