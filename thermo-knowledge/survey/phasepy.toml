# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "phasepy/actmodels/virial.py Tsonopoulos (docstring line 58, code line 62)"
documented = "docstring: B0 = 0.1445 - 0.33/Tr - 0.1385/Tr^2 - 0.0121/Tr^3 - 0.000607/Tr^8"
actual = "code evaluates the constant term as 0.1145 (B0 = 0.1145 - 0.330/Tr - 0.1385/Tr^2 - 0.0121/Tr^3 - 0.000607/Tr^8)"
consequence = "Tsonopoulos second virial coefficients differ from the documented equation by the change in the leading constant."

[[discrepancy]]
locator = "phasepy/actmodels/virial.py Abbott (docstring line 81, code line 85)"
documented = "docstring: B1 = 0.139 + 0.179/Tr^4.2"
actual = "code evaluates B1 = 0.139 - 0.172/Tr^4.2 (different sign and coefficient)"
consequence = "Abbott second virial coefficients differ from the documented equation."

[[discrepancy]]
locator = "phasepy/mixtures.py mixture.NRTL (docstring), phasepy/actmodels/nrtl.py nrtl"
documented = "g1 is 'Matrix of energy interactions [1/K]' with tau = g/T + g1"
actual = "tau = g/T + g1 requires g1 to be dimensionless; nrtlter's docstring writes tau = (g + g1 T)/T, which has the same meaning"
consequence = "The unit given for g1 cannot be used as the slot unit; a mapping must take the dimensionless unit from the equation."

[[discrepancy]]
locator = "phasepy/cubic/cubicpure.py class rkpure (lines 832-838; nested a_eos at line 837)"
documented = "class rkpure is the pure Redlich-Kwong EoS with alpha_rk(T, Tc)"
actual = "a_eos is defined nested inside rkpure.__init__ and is therefore not a method; instances use the inherited cpure.a_eos, which calls alpha_eos(T, k, Tc), while alpha_rk accepts only (T, Tc). vtrkpure and rkmix define a_eos at method level with the two-argument call. Not executed here; read from the source."
consequence = "The pure (untranslated) RK class appears unable to evaluate a_eos as written; the mixture and translated forms can."

[[discrepancy]]
locator = "phasepy/actmodels/original_unifac.py unifac_original and dunifac_original (docstrings)"
documented = "docstrings read 'Derivatives of Dortmund UNIFAC activity coefficient model' and describe amn as an energy interactions coefficient"
actual = "the functions implement the original UNIFAC (combinatorial part without the 3/4 exponent, constant a_mn) and unifac_original does not return derivatives"
consequence = "The text copied from the Dortmund function misidentifies the variant; the workbook and function body are the variant evidence."

[[discrepancy]]
locator = "phasepy/cubic/__init__.py module docstring"
documented = "mhv_unifac and ws_unifac are described as 'with Wilson model'"
actual = "mixingrules.py dispatches them to the (Dortmund) UNIFAC activity model; mhv_uniquac, mhv_original_unifac and the mhv1_ family are not listed in that docstring although they exist"
consequence = "The list of mixing rules in the package docstring is incomplete and mislabelled; the dispatcher is the authoritative list."

[[discrepancy]]
locator = "phasepy/mixtures.py kij_ws and kij_saft (docstrings)"
documented = "the matrix must be symmetrical and the main diagonal must be zero"
actual = "the code checks only that the matrix is square and symmetric; only kij_cubic checks for a zero diagonal"
consequence = "A non-zero diagonal is accepted for Kijws and KIJsaft; whether it has any effect is not established."

[[discrepancy]]
locator = "phasepy/mixtures.py component.ci (docstring) and phasepy/cubic/cubicpure.py cii (docstring)"
documented = "influence parameter in J m5 / mol (component.ci) and J m5 mol-2 (cubic EoS classes, mixture.ci not stated)"
actual = "the same polynomial is evaluated in both places"
consequence = "Two different units are stated for one quantity; the SGT tension scaling (sgt_adim) is consistent with J m5 mol-2 by its use of a/ci with a in bar cm6 mol-2."

[[discrepancy]]
locator = "phasepy/actmodels/virialgama.py docstring (actmodel options) versus code (actmodel == 'nrtlt' branch, line 86)"
documented = "actmodel: 'nrtl', 'wilson', 'original_unifac', 'unifac', 'uniquac', 'rkb' or 'rk'"
actual = "the code also accepts 'nrtlt' (NRTL with the ternary term)"
