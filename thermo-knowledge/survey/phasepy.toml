[[model_family]]
name = "Cubic EoS, pure component (vdW, RK, RKS, PR, PRSV, custom c1 and c2)"
locator = "phasepy/cubic/cubicpure.py (cpure, prpure, prsvpure, rkspure, rkpure), vdwpure.py (vdwpure), cubic.py (vdweos, preos, prsveos, rkeos, rkseos, cubiceos)"
class = "helmholtz_potential"
inputs = "Pressure-explicit form P = RT/(v - b) - a/((v + c1 b)(v + c2 b)) with v in cm3/mol, T in K, P in bar; natural variables (T, v) or (T, P) with a cubic root solve for Z. Pure component, no composition."
parameters = "pure: Tc, Pc, w (acentric factor), ksv (PRSV), alpha_params (custom alpha); global constants per EoS: c1, c2, Omega_a (oma), Omega_b (omb)"
composes = [
  { slot = "alpha_eos", accepts = "alpha function alpha(T, k, Tc)", default = "alpha_soave (PR, RKS), alpha_sv (PRSV), alpha_rk (RK); alpha_vdw (vdW)" },
  { slot = "volume_translation", accepts = "constant volume shift c", default = "none unless volume_translation=True" },
]
variants = "vdweos: c1 = c2 = 0, Omega_a = 27/64, Omega_b = 1/8, alpha = 1. preos: Peng-Robinson constants c1 = 1 - sqrt 2, c2 = 1 + sqrt 2, k from a quadratic polynomial in w. prsveos: PR constants with SV alpha, k0 from a cubic polynomial in w and k1 = 0 unless ksv is non-zero. rkseos: RK constants c1 = 0, c2 = 1 with Soave alpha and a cubic polynomial in w. rkeos: RK constants with the RK alpha. cubiceos(c1, c2, alpha_eos): Omega_a and Omega_b are solved from c1 and c2 (cubic polynomial root, smallest positive root for omb)."
equation_source = "The docs page states P = RT/(v-b) - a/((v+c1 b)(v+c2 b)); no literature citation for the constants or the k correlations (Chaparro and Mejia, J. Comput. Chem. 2020, doi 10.1002/jcc.26405, is the citation request in README)."
closed_form = "implicit"
data = "component construct (Tc, Pc, w, ksv, alpha_params); no bundled component data"

