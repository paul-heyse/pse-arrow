surveyed = "2026-09-30"
summary = "PhasePy v0.0.56 (MIT) contributes a small component/mixture data model with no bundled compound database, pressure-explicit cubic equations of state (vdW, RK, RKS, PR, PRSV, custom c1/c2) with volume translation and quadratic, MHV, MHV1 and Wong-Sandler mixing rules that embed NRTL, Wilson, UNIQUAC, two UNIFAC variants and Redlich-Kister activity models, a virial-gamma-phi model, model-agnostic equilibrium algorithms (bubble, dew, flash, LLE, VLLE, TPD stability, SLE/SLLE), square-gradient-theory interfacial tension, fitting utilities, and four UNIFAC workbooks (two of which the code reads). It bundles no SAFT equation of state (the SAFT fields on its component class are read by nothing), no ideal-gas heat capacity, no enthalpy/entropy/volume flash and no critical-point or envelope tracing."

