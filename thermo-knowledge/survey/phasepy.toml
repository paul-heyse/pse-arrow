# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "units of the UNIFAC A0, A1, A2 sheets"
question = "The workbooks and the unifac() docstring give no unit for a0, a1, a2; psi = exp(-(a0 + a1 T + a2 T^2)/T) implies K, dimensionless and 1/K. Is that the DDBST convention these values were transcribed from?"
why_it_matters = "A parameter set needs a declared unit per slot; the source cannot supply it."

[[question]]
about = "orientation of the UNIFAC matrices"
question = "The sheets label rows and columns both GroupID. The code uses a.loc[groups, groups] and SumA = theta @ psi, which contracts over the first index; does the row index denote m (the group whose environment is described) as in the published convention?"
why_it_matters = "Transposition rule (ordered pair) needs the roles of the two indices."

[[question]]
about = "which Dortmund release the two files represent"
question = "Is dortmund-2018.xlsx the 2018 and dortmund-2021.xlsx the 2021 DDBST Dortmund release? Only the file names and workbook creation dates say so, and the repository commits that might record the source are not in the pinned tree."
why_it_matters = "The group scheme revision and the parameterisation revision must be recorded; the survey can only assert file names."

[[question]]
about = "alpha_rk exponent"
question = "alpha_rk evaluates (T/Tc)^(-1/4) through sqrt(T/Tc)**-0.5, and the tree states no equation for the Redlich-Kwong alpha; is the exponent as intended?"
why_it_matters = "If the RK alpha is taken to be Tr^(-1/2) elsewhere, the same name denotes two different functions."

[[question]]
about = "SAFT fields of component"
question = "The component class carries ms, sigma, eps, lambda_r, lambda_a, eAB, rcAB, rdAB and sites, the mixture class carries KIJsaft, and a corresponding-states correlation fills them, but no PhasePy EoS or algorithm reads them. Are they placeholders for a SAFT-VR-Mie model that is absent from v0.0.56?"
why_it_matters = "They must be recorded as unread and kept out of any parameterisation that claims to be usable by this source."

[[question]]
about = "tpd trial phase 'S'"
question = "tpd_val accepts stateW = 'S' (pure solid through dHf and Tf) but the tpd_min and tpd_minimas docstrings list only L and V; is solid stability analysis supported beyond the SLE functions?"
why_it_matters = "Affects whether solid stability belongs to the phase_stability capability."

[[question]]
about = "units of UNIQUAC r and q and of Mw use"
question = "component.ri and qi are documented as molecular volume and surface for UNIQUAC without units, and Mw (g/mol) is used only to form a mass-basis quantity in the cubic classes; what do they mean in a dimensional sense?"
why_it_matters = "Whether r and q are dimensionless relative sizes or areas and volumes changes the quantity type of the slot."

[[question]]
about = "citations for the equations"
question = "Apart from the citation request for Chaparro and Mejia (J. Comput. Chem. 2020, doi 10.1002/jcc.26405) and the Mejia et al 2014 comment, the code names no publication for PR, RK, MHV, MHV1, WS, NRTL, Wilson, UNIQUAC or UNIFAC. Which publications define the coded equations?"
why_it_matters = "Forms need citations; the survey cannot invent them."
