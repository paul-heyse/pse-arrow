actual = "A0 has 55 body rows and 51 columns; row labels 1..51 are positional and four rows are unlabelled; Sheet1 (identical values by position) lists main groups 29, 34 and 43 on more than one row, so for labels 30 and above the row with label L is not the row of main group L; 11 main groups present in RkQk (53, 61, 84, 85, 87, 89, 90, 91, 93, 98, 99) have no column"
consequence = "Original-UNIFAC interaction values for main groups 30 to 51 are read from rows belonging to other groups, and components containing the 11 uncovered main groups cannot be looked up. Derived by comparing the sheets; the library was not run."

