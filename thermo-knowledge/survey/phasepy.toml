# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units and constants"
locator = "phasepy/constants.py; component and mixture docstrings"
statement = "T in K, P in bar, molar volume in cm3/mol, molar density in mol/cm3, molar weight in g/mol, enthalpy of fusion in J/mol. Constants: kb = 1.3806488e-23 J/K, Na = 6.022142e23 1/mol (saft_forcefield.py uses 6.02214e23), R = 83.14 bar cm3/(mol K) and r = 8.314 J/(mol K). Tension in mN/m, SGT influence parameter in J m5 mol-2 (cubic classes) or J m5 / mol (component.ci docstring); SGT lengths in angstrom."
scope = "all models"

[[convention]]
name = "composition basis"
locator = "phasepy/equilibrium/*.py; phasepy/cubic/*.py; phasepy/actmodels/*.py"
statement = "All composition vectors are mole fractions in component order. Activity models compute volume, surface and group-mole fractions internally from mole fractions and the pure r, q or Vk (UNIQUAC, UNIFAC) without the user supplying them as composition. Residual energies are per mole."
scope = "all models and equilibrium algorithms"

[[convention]]
name = "reference state and ideal-gas term"
locator = "phasepy/cubic/cubicpure.py a0ad (line 282), ares (line 430)"
statement = "Fugacity coefficients and residual properties (EntropyR, EnthalpyR, CvR, CpR, speed_sound helpers) are departures from the ideal gas at the same T and P. The dimensionless Helmholtz density used by SGT includes an ideal term with reference pressure Pref = 1 in dimensionless units. No ideal-gas heat capacity model is provided (speed_sound takes CvId and CpId arguments whose defaults are monatomic-gas values), so total enthalpy and entropy are not available."
scope = "cubic EoS objects and SGT"

[[convention]]
name = "phase labels and K-values"
locator = "phasepy/equilibrium/flash.py, multiflash.py, stability.py"
statement = "Phases are identified by the strings 'L' (liquid root), 'V' (vapour root) and, for solids, 'S'; K = exp(ln phi_first - ln phi_second) where the first entry of the equilibrium list is the reference phase. For a cubic EoS the liquid root is the smallest and the vapour root the largest real compressibility root above B."
scope = "equilibrium algorithms and cubic EoS"

[[convention]]
name = "pair-matrix symmetry and diagonals"
locator = "phasepy/mixtures.py (setter methods)"
statement = "kij (QMR), Kijws, KIJsaft and the NRTL alpha matrix are square and symmetric; kij must have an exactly zero diagonal, the others should by docstring but are unchecked. NRTL g and g1, Wilson A and UNIQUAC a0 and a1 are full ordered matrices. Redlich-Kister rows follow the combinations of component indices in order 1-2, 1-3, ..., n-1 n."
scope = "interaction tables"

[[convention]]
name = "liquid fugacity in the virial-gamma model"
locator = "phasepy/actmodels/virialgama.py logfugef (line 270)"
statement = "ln phi_i^L = ln gamma_i + ln(psat_i/P) + v_i^L (P - psat_i)/RT + B_ii psat_i/RT, with psat from Antoine, v^L from Rackett and B_ii the pure virial coefficient from the selected virial model; the vapour fugacity uses the mixture partial virial coefficient."
scope = "virialgamma"

