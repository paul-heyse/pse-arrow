source = "espei_datasets"
pin = "e3b536426e20"
surveyed = "2026-09-30"
summary = "ESPEI-datasets (commit e3b53642, licensed CC-BY-4.0) is a data-only repository of 215 active ESPEI JSON datasets for 34 binary and ternary metal systems (94 phase-boundary ZPF datasets with 1625 phase regions, 114 single-phase fixed-configuration thermochemical datasets, 7 activity datasets), 4 disabled files, 5 old phase-model JSON files, a BibTeX file of 73 entries and a contributors list; it carries no equilibrium thermochemical datasets, no uncertainty or weight fields, no unary systems (the README example paths name a 1-unary directory that is absent), no tags and no author or bibtex keys although the README requires them, and 10 of its 114 single-phase datasets use output names that the ESPEI error function's property list does not contain."

