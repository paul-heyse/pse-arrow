# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units and bases in the data"
locator = "README.md; espei survey (docs/input_data.rst)"
statement = "No unit appears in the dataset files. By the ESPEI documentation: energies J/mol-atom, entropy and heat capacity J/K/mol-atom, compositions mole fractions, T in K, P in Pa (101325 in all files), activity dimensionless."
scope = "all datasets"

[[convention]]
name = "formation, mixing and absolute property names"
locator = "datasets/**/non-equilibrium-thermochemical/"
statement = "Output suffix _FORM means formation, _MIX mixing, no suffix an absolute value (HM, SM, CPM in 9 files, apparently DFT series for Al-Ni BCC_B2 and FCC_L12 by the file names 'Yi Wang et al 2009' and 'Shunli DFT calculations (2010)'), and SM_EX_FORM one estimated excess formation entropy; the meaning of the bare outputs (formation or absolute) is not stated in the files."
scope = "single-phase datasets"

[[convention]]
name = "reference field"
locator = "datasets/**/*.json (reference key); references.bib"
statement = "reference is a string that is sometimes a key of references.bib (148 datasets), sometimes free text with author, year and method, and once empty; no DOI or BibTeX type is carried in the dataset."
scope = "all datasets"

[[convention]]
name = "disabling a dataset"
locator = "datasets/**/*.json.disabled, *.json.disable; espei/datasets.py (disabled key)"
statement = "Datasets are disabled by renaming the file with a .disabled or .disable extension (4 files); the JSON key disabled, which ESPEI honours, is not used."
scope = "the repository"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "README.md (contribution steps) versus datasets/**/*.json"
documented = "each dataset must have a BibTeX citation key in a bibtex key and the contributor's name in an author key"
actual = "no dataset has a bibtex or author key; all 215 have a reference key, which in 148 cases equals a references.bib key and in 67 is free text or an unlisted key."
consequence = "Authorship and citation linkage cannot be read from keys; ESPEI does not read either key."

[[discrepancy]]
locator = "README.md (layout examples) versus the datasets directory"
documented = "examples datasets/1-unary/Al/non-equilibrium-thermochemical/HM/..., datasets/2-binary/Al-Ni/zpf/..., datasets/2-binary/Al-Ni/equilibrium-thermochemical/SM/..."
actual = "there is no 1-unary directory and no equilibrium-thermochemical directory in the pinned tree; Al-Ni has only non-equilibrium-thermochemical and zpf directories."
consequence = "No unary datasets and no equilibrium thermochemical datasets exist at this pin."

[[discrepancy]]
locator = "datasets/3-ternary/Cr-Fe-Ti/zpf/CR-FE-TI-ZPF-BCC_A2-LAVES-LAVES_C36-TAU-Zeng2017investigationof_phase_equilibria.json and 4 other ZPF files"
documented = "a ZPF dataset's phases list names the phases of the dataset"
actual = "tie-line points use phase names absent from the list in 5 files (LIQUID in 2, BCC_B2 in 2, BCC_A3 in 1, LAVES_36 in 1 where the list has LAVES_C36; one file has two such names); the ESPEI check only verifies that every entered phase is used."
consequence = "Phase names in tie-line points cannot be resolved against the phases list alone; LAVES_36 may be a variant spelling of LAVES_C36 and BCC_A3 of BCC_A2 (neither is stated)."

# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "bare HM, SM and CPM datasets"
question = "The 9 datasets with bare HM, SM and CPM outputs hold 2157 points as temperature series at fixed configurations (DFT-like). Are they formation quantities, absolute values or mixing values?"
why_it_matters = "The observable's reference relation (formation, absolute, mixing) is part of the model's observable identity and is not stated."

[[question]]
about = "provenance of digitised and computed data"
question = "Which datasets are digitised from figures, which are calculations and which are estimates (file names and references hint at it), and who digitised them (CONTRIBUTORS lists systems per person only)?"
why_it_matters = "The origin role (published, computed, estimated) of each dataset is required by the model's derivation rules, and no field states it."

[[question]]
about = "phase models for most systems"
question = "Only 5 old phase-model files exist for 34 systems. Where are the sublattice models and site ratios of the other phases (SIGMA_D8B, LAVES_C15, CUMG2, ...) declared for these datasets?"
why_it_matters = "A configuration in a dataset can only be interpreted against a phase's sublattice model, which this source does not supply for most phases."

[[question]]
about = "terms of use of the underlying publications"
question = "The repository's own contributions are CC-BY-4.0, but many datasets are transcriptions of published figures and tables whose original terms are not addressed. Does the CC-BY-4.0 licence of the repository settle rights for those transcriptions?"
why_it_matters = "Rights determinations attach to the carrier and to parts of it; the statement covers contributed data as a whole and records nothing per dataset."
