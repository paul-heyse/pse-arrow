format = "ESPEI dataset JSON, one object per file; directory layout datasets/<n>-<name>/<system>/<kind>/[<phase>/<property>/]<file>.json with <name> binary or ternary, <system> sorted element symbols, <kind> one of zpf, non-equilibrium-thermochemical, activity; file names follow SYSTEM-OUTPUT-PHASE-reference; 34 of the 215 names contain spaces"
files = 215
bytes = 321934
records = "215 dataset objects: zpf 94, non-equilibrium-thermochemical 114, activity 7 (by directory); 186 in 2-binary and 29 in 3-ternary; 185 datasets with two non-VA components and 30 with three; 34 systems. Datasets per system (kind counts): Al-Co non-eq 3; Al-Co-Cr non-eq 5 zpf 2; Al-Co-Mo zpf 1; Al-Co-Nb zpf 1; Al-Co-Ni zpf 1; Al-Co-Ta zpf 1; Al-Co-W zpf 1; Al-Cr non-eq 5; Al-Ni non-eq 39 zpf 7; Al-V non-eq 13; Co-Cr non-eq 5 zpf 1; Co-Cr-Ni zpf 1; Co-Ni-V zpf 1; Cr-Fe zpf 3; Cr-Fe-Mo zpf 2; Cr-Fe-Ti zpf 4; Cr-Nb zpf 1; Cr-Ni activity 5 non-eq 7 zpf 10; Cr-Pd zpf 1; Cr-Pt zpf 1; Cr-Ta zpf 1; Cr-Ti-V zpf 6; Cr-V activity 1 non-eq 5 zpf 2; Cu-Fe zpf 1; Cu-Mg activity 1 non-eq 21 zpf 7; Cu-Ti zpf 1; Fe-Mn zpf 2; Fe-Mn-Ti zpf 1; Fe-Ni zpf 1; Fe-Ni-V zpf 2; Fe-Ti zpf 8; Fe-V zpf 2; Ni-V non-eq 8 zpf 14; Ti-V non-eq 3 zpf 7. Counted by json.load of every file and the path components."
reader = "ESPEI's own load_datasets in espei/datasets.py (see the espei survey), driven by recursive_glob with the pattern *.json; espei --check-datasets datasets is the repository's CI check (.github/workflows/check.yaml); a plain JSON parser reads every file"
read_by_source = "all"
notes = "Distinct output values with counts (215 datasets): ZPF 94, HM_FORM 47, HM_MIX 33, SM_FORM 20, ACR_CR 6, CPM 3, HM 3, SM 3, CPM_FORM 2, SM_MIX 2, SM_EX_FORM 1, ACR_MG 1 (12 values). Data points (number of values): ZPF 1625 phase regions; HM 697, SM 763, CPM 697 (bare outputs); HM_FORM 331, HM_MIX 272, SM_FORM 218, CPM_FORM 188, SM_EX_FORM 12, SM_MIX 2; ACR_CR 74, ACR_MG 10. Top-level keys and counts: components 215, phases 215, conditions 215, output 215, values 215, reference 215, comment 160, solver 114, broadcast_conditions 93 (all false), reference_state 21 (14 the string SGTE91 on HM_FORM 8, SM_FORM 3, CPM_FORM 2, SM_EX_FORM 1; 7 dicts on the activity datasets), plot 1; no dataset has weight, tags, disabled, excluded_model_contributions, bibtex or author. Conditions: P is an integer in all 215 (101325); T is a list in 93 ZPF and 15 other datasets, a scalar elsewhere (62 floats, 44 integers, 1 scalar ZPF); X_CR in 6 and X_CU in 1 activity datasets. 62 datasets list VA among their components. 114 single-phase datasets have exactly one phase, a solver with mode manual, 474 sublattice configurations in all, and 1 to 5 sublattices (1 sublattice 28, 2 43, 3 24, 4 2, 5 17); sublattice_occupancies in 52 and solver comment in 22. Most frequent single-phase phases: BCC_B2 20, FCC_L12 17, BCC_A2 15, LIQUID 12, FCC_A1 7, SIGMA_D8B 6, LAVES_C15 6, AL3NI2 5, HCP_A3 4, CUMG2 4. ZPF datasets name 30 distinct phases in their phases lists; 5 ZPF datasets use tie-line phase names that their phases list lacks (LIQUID in 2 files, BCC_B2 in 2, BCC_A3 in 1 and LAVES_36 in 1 whose list has LAVES_C36), which check_dataset accepts because it only requires every entered phase to be used."

