# ---------------------------------------------------------------------------
# CONSTRUCTS (as found in the data; the schema is in the espei survey)
# ---------------------------------------------------------------------------

[[construct]]
name = "phase boundary (ZPF) dataset file"
locator = "datasets/*/*/zpf/*.json; schema in espei survey (espei/datasets.py:124-188)"
meaning = "A set of phase regions at temperatures from one publication, for one system, in the ESPEI ZPF form: output ZPF, conditions P (101325) and T (a list with one temperature per phase region, in 93 files; a scalar in 1), values a list of phase regions each a list of tie-line points [phase, components, compositions]."
subject = "A phase region at a temperature: the phases in equilibrium with their known compositions."
fields = [
  { name = "components", meaning = "element symbols, upper case, sometimes with VA", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "phases", meaning = "phase names entered in the dataset", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "conditions.T", meaning = "temperature of each region", unit = "K (docs)", shape = "list", role = "input" },
  { name = "conditions.P", meaning = "pressure, 101325 in all files", unit = "Pa (docs)", shape = "scalar", role = "input" },
  { name = "values", meaning = "phase regions; tie-line point compositions may be null (983 null points); 7 points carry a fourth entry 'disordered'", unit = "mole fraction", shape = "list", role = "input" },
  { name = "reference", meaning = "source label", unit = "not applicable (text)", shape = "reference", role = "metadata" },
  { name = "broadcast_conditions", meaning = "present with value false in 93 of the 94 ZPF files (and in one disabled file); not read by ESPEI", unit = "not applicable (flag)", shape = "scalar", role = "unread" },
  { name = "comment", meaning = "note, present in some files", unit = "not applicable (text)", shape = "scalar", role = "unread" },
]
origin = "other (digitised from phase-diagram publications (the reference field names them); the digitiser, method and date are not stated; contributors listed in CONTRIBUTORS by system, not by dataset)"
conventions = "Tie-line points give compositions for all but one component; regions: 2 phases 1565, 3 phases 36, 1 phase 24; sum of known fractions at most 1; no __HYPERPLANE__ meta-phase is used."
absence = "null composition: unknown, estimated by ESPEI; the dataset distinguishes null from zero. Missing weight: 1.0 (no dataset sets one)."
validity = "temperatures of the regions; no range statement"
provenance = "reference string per dataset (a BibTeX key in part of the files); file name repeats it"
count = "94 datasets, 1625 phase regions, 3262 tie-line points (3255 with three entries, 7 with four)"
example = "datasets/2-binary/Al-Ni/zpf/AL-NI-ZPF-AL3NI2-BCC_B2-37ALE.json"
candidate = "dataset (kind measured) of phase-equilibrium points with dataset_phase per phase, composition columns and constraint T, P; data_point and datum rows"
precision = "broader"
loss = "null compositions, the implied dependent component, the disordered flag and tie-line grouping need typed column and group constructs; per-point uncertainty is absent in the source."

[[construct]]
name = "single-phase thermochemical dataset file"
locator = "datasets/*/*/non-equilibrium-thermochemical/<phase>/<property>/*.json; schema in espei survey (espei/datasets.py:84-95, :118-123)"
meaning = "A property of one phase at listed sublattice configurations and site occupancies, from first-principles calculations or experiments: output among HM_FORM 47, HM_MIX 33, SM_FORM 20, CPM 3, HM 3, SM 3, CPM_FORM 2, SM_MIX 2, SM_EX_FORM 1; solver block (mode manual, site ratios, configurations, occupancies in 52 files); conditions T (list or scalar) and P; values of shape (1, number of T, number of configurations)."
subject = "One phase and a set of (sublattice configuration, occupancy, temperature) points."
fields = [
  { name = "solver.sublattice_configurations", meaning = "strings for non-mixing sublattices and alphabetically sorted lists for mixing ones", unit = "not applicable (text)", shape = "list", role = "input" },
  { name = "solver.sublattice_occupancies", meaning = "site fractions in the configurations' shape", unit = "not applicable (fraction)", shape = "list", role = "input" },
  { name = "solver.sublattice_site_ratios", meaning = "site ratios of the phase's sublattices", unit = "not applicable (count of sites)", shape = "list", role = "input" },
  { name = "values", meaning = "property values", unit = "J/mol-atom (HM), J/K/mol-atom (SM, CPM) per ESPEI docs", shape = "table", role = "input" },
  { name = "reference_state", meaning = "string SGTE91 on 14 datasets (HM_FORM 8, SM_FORM 3, CPM_FORM 2, SM_EX_FORM 1); not read by ESPEI for these datasets", unit = "not applicable (text)", shape = "scalar", role = "unread" },
  { name = "plot", meaning = "one dataset carries a plot styling dictionary", unit = "not applicable (text)", shape = "table", role = "unread" },
]
origin = "other (first-principles calculations (DFT, SQS, OQMD in references or file names) and calorimetry, per reference; some datasets are estimates (file names say est. or estimate))"
conventions = "FORM: formation from the elements; MIX: relative to endmembers; bare HM, SM and CPM outputs (9 files) and SM_EX_FORM (1 file) are not among the properties the ESPEI error function lists (see the espei survey discrepancies). Mixing configurations have ideal mixing removed per the ESPEI docs."
absence = "No excluded_model_contributions in any file: the DFT data are not flagged to drop the ideal mixing or magnetic contribution through the dataset, only (in the ESPEI docs) through tags, and no dataset carries tags."
validity = "temperatures of the values; values below 298.15 K are discarded by ESPEI"
provenance = "reference string, file name and comment"
count = "114 datasets, 474 configurations; points: HM 697, SM 763, CPM 697, HM_FORM 331, HM_MIX 272, SM_FORM 218, CPM_FORM 188, SM_EX_FORM 12, SM_MIX 2"
example = "datasets/2-binary/Al-Ni/non-equilibrium-thermochemical/BCC_B2/CPM/AL-NI-CPM-BCC_B2-Yi Wang et al 2009.json"
candidate = "dataset (kind computed or measured) with dataset_phase, a column for the constituent array and site fractions, property columns with observable and reference relation formation or mixing"
precision = "close"
