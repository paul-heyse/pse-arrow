[[convention]]
name = "units of inputs and outputs"
locator = "docs/vCurrent/units.md; cpp/KineticGas.h:55-66; cpp/utils.h:155-190 struct Units"
statement = "All input and output in SI on a molar basis: temperature K, molar volume m3/mol, pressure Pa, composition mole fraction; viscosity in Pa s (Units.visc), thermal conductivity in W/(m K), diffusion and thermal diffusivity and kinematic viscosity in m2/s, thermal diffusion factor dimensionless, Soret coefficient in 1/K (python docstring), molar masses input in g/mol. Internally the C++ code uses particle density (1/m3) and particle mass (kg). The Units struct supplies reducing factors (T = E/k, V = L^3, t = sqrt(m/E) L, rho = 1/(N_A V), D = L^2/t, p = E/V, visc = p t, tcond = E/(t T L)) for reduced-unit work."
scope = "all transport properties and potential parameters (sigma in m, eps_div_k in K)"

[[convention]]
name = "frame of reference vocabulary"
locator = "cpp/utils.h:137-145 enum FrameOfReference; cpp/KineticGas.cpp:105-116 frame_of_reference_map; pykingas/py_KineticGas.py:204-290; README.md diffusion section"
statement = "The exact names accepted are CoN, CoM, CoV, solvent, zarate, zarate_x, zarate_w (enum order CoM, CoN, CoV, solvent, zarate, zarate_x, zarate_w; any other string raises 'Invalid frame of reference'). CoN is the centre-of-moles (molar) frame and the default for interdiffusion and thermal diffusion; CoM is the barycentric frame and the default of conductivity_matrix; CoV is centre of volume; solvent needs solvent_idx and sets the dependent component to it; zarate, zarate_x and zarate_w are the Ortiz de Zarate definitions D^(z), D^(x) and D^(w); zarate_x is implemented only for ideal-gas models. The python docstring lists CoN, CoM, solvent and the zarate variants but omits CoV, which the code accepts. The default diffusion coefficients are for an independent set of forces with the last component dependent (dependent_idx -1) and use_binary returns a single number for a binary."
scope = "interdiffusion, thermal_diffusion_coeff, soret_coefficient, conductivity and resistivity matrices"

[[convention]]
name = "transfer length model vocabulary"
locator = "cpp/utils.h:147-153; cpp/KineticGas.cpp:151-200"
statement = "Models by id: DEFAULT -1 (resolves to the default), collision_diameter 0 (model of the 2022 thesis and the 2023 paper), EWCA 1 (exchange weighted closest approach, unpublished in the header), correlation 2 (argon-only, unpublished), INVALID terminates loops; the default is EWCA; set_transfer_length_model with an invalid id falls back to the default and then throws. The descriptions printed by get_valid_transfer_length_models are Default (default), Collision diameter, Exchange weighted closest approach (EWCA), Correlation."
scope = "dense-gas momentum and energy transfer lengths; ideal-gas models return zero transfer lengths for the collision diameter model"

[[convention]]
name = "natural constants"
locator = "cpp/global_params.h; pykingas/py_KineticGas.py:7-18"
statement = "C++: BOLTZMANN 1.38064852e-23, GAS_CONSTANT 8.31446261815324, AVOGADRO = GAS_CONSTANT/BOLTZMANN (6.0221428537e23, about 3.5e-7 relative above the exact 6.02214076e23), PLANCK 6.62607015e-34, PI 3.14159265359 (truncated), HBAR derived. Python uses scipy.constants (Boltzmann, Avogadro, gas_constant). The two sides therefore use different values of Avogadro's number and of the Boltzmann constant."
scope = "all conversions between molar and particle quantities"

[[convention]]
name = "Enskog approximation order N"
locator = "cpp/KineticGas.h (N=2 defaults); pykingas/py_KineticGas.py:52 (default 3) and subclass constructors; pykingas/py_KineticGas.py soret and thermal diffusion methods"
statement = "N is the order of the Sonine polynomial (Enskog) approximation: 1 is the first approximation; thermal diffusion and the thermal-diffusion contribution to conductivity need N >= 2 (python returns NaN with a warning for N < 2). Defaults differ by class (Mie, HardSphere, QuantumMie 4; PseudoHardSphere, LJSpline 3; Sutherland 2; C++ 2; py_KineticGas base default 3)."
scope = "all properties"

[[convention]]
name = "single-component and infinite-dilution handling"
locator = "cpp/KineticGas.cpp:26-66, 141-153; pykingas/py_KineticGas.py:52-95, 143-165"
statement = "A single component is duplicated into a two-component system of identical species and mole fractions are replaced by [0.5, 0.5] (python accepts [1]); is_idealgas=True sets the radial distribution function to 1, removes density corrections (zero transfer lengths, density contributions and density-dependent factors) and uses the ThermoPack ideal equation; it is the infinite-dilution limit."
scope = "all models"

[[convention]]
name = "mixing rules for Mie-type pair parameters"
locator = "pykingas/MieType.py:200-245; cpp/MieKinGas.cpp:48-78"
statement = "sigma_ij = (1 - lij)(sigma_i + sigma_j)/2 for i not equal to j; eps_ij = (1 - kij) sqrt(eps_i eps_j); exponents 3 + sqrt((l_i - 3)(l_j - 3)) with (1 - lij) multiplying the root for lambda_r only in the python version; the C++ standalone constructor applies no lij or kij. The warning in the docstrings says use of mixing parameters is not thoroughly tested."
scope = "Mie, QuantumMie, MieKinGas"

[[convention]]
name = "length and energy units inside potential records"
locator = "fluids/E_bound/README.MD; fluids/*.json#/ModTangToennis, /Patowski, /HFD-B2; cpp/multiparam.cpp"
statement = "Bound-state energies are in K (converted to J by the Boltzmann constant; to cm^-1 by dividing by h c); ModTangToennis records declare their own length unit L_unit (nm for argon, Bohr for helium, Angstrom for neon) with energies in K except sigma in metres; Patowski works in Angstrom internally and multiplies by the Boltzmann constant (so energies are in K although the Note says J); HFD-B2 lengths are in units of rm (nm) and energies in units of eps. Phase-shift wave vectors are in an unstated unit (inferred 1/sigma)."
scope = "ab initio potentials and quantum tables"

[[convention]]
name = "cache resolution of collision integrals and transfer lengths"
locator = "cpp/utils.h:40-90 StatePoint and OmegaPoint"
statement = "Collision integrals are cached at a temperature resolution of 0.1 K (the key rounds T*10 to an integer; the state point for transfer lengths rounds T*100), so results for temperatures closer than that are reused; this is a numerical convention that affects reproducibility at fine temperature steps."
scope = "collision integrals, transfer lengths"

[[convention]]
name = "thermal diffusion sign and independent-force conventions"
locator = "pykingas/py_KineticGas.py:204-290, 547-607; docs/memo/diffusion"
statement = "Fluxes are defined in the chosen frame; diffusion coefficients by default refer to independent molar-density gradients with the dependent component index -1 (last); the Soret coefficient with use_zarate=True is defined so that X S_T grad T = - grad x, with S_T = - grad x1 / (x1 (1 - x1) grad T) for a binary whose species 2 is dependent; the thermal diffusion factor alpha_ij relates to S_T = alpha / T when use_zarate is False."
scope = "thermal diffusion outputs"

