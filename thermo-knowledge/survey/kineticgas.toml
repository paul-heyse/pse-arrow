# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "layout of the fluid database"
question = "The README and docs say parameters are read from pykingas/fluids; the pin has a top-level fluids directory, the python code loads from the package directory, the CMake default for the C++ side is ../fluids relative to the library (C++ fallback ./fluids). Is the top-level fluids directory the single authoritative copy, and is it copied into the package at build time?"
why_it_matters = "Two file locations would mean two possible versions of the same parameter sets; the survey treats fluids/ as the authority."

[[question]]
about = "submodules"
question = "cpp/external holds empty directories for thermopack, autodiff, eigen, json and pybind11, and the C++ side includes cppThermopack headers. Which ThermoPack version provides the equations that density, chemical potentials and Cp come from?"
why_it_matters = "Transport results depend on the equation of state; without the version the dependency cannot be recorded as a consistent_with relation."

[[question]]
about = "meaning of default across blocks"
question = "For eight fluids (KR, O2, HE3, HE, CO2, N2, XE, AR) the Mie default and the Mie-FH0 default differ, and HardSphere sigma differs from Mie sigma for eight fluids. Is default meant to identify one parameterisation or only the set each model reads by default?"
why_it_matters = "The store needs a parameterization identity across the potential blocks of one fluid; the name alone does not provide it."

[[question]]
about = "q-Mie block and default_fh_order"
question = "The CO q-Mie block cannot be selected (the alias is replaced before lookup, CO has no default_fh_order, and no Mie-FH0 block exists for CO). Is the CO block meant to be read through a path not in the pin?"
why_it_matters = "An orphan parameter set; it should not become an unqualified parameter_set."

[[question]]
about = "unit statements versus code (Patowski, HFD-B2)"
question = "The Patowski Note says internal units are Angstrom and joule, but the code multiplies by the Boltzmann constant after evaluating the terms; the HFD-B2 notes are informal (one says units are not as they appear). Which energy unit do the stored numbers carry?"
why_it_matters = "The potential parameters cannot be given quantity types without a decided unit."

[[question]]
about = "phase-shift files"
question = "The .phase_shifts files have no header: what are the unit of k, the potential and parameter set that generated them, and the code version? Only the first component's file is read and HE3 and O-H2 have none."
why_it_matters = "The table is a cache of a computation and cannot be attributed to a parameter_set, nor reproduced, without that provenance."

[[question]]
about = "natural constants mismatch"
question = "The C++ constants mix BOLTZMANN 1.38064852e-23 with GAS_CONSTANT 8.31446261815324 and derive AVOGADRO from their ratio (3.5e-7 above the exact value), while python uses scipy.constants. Is the mismatch intended and what size of effect on transport results is expected?"
why_it_matters = "A convention_set records the constants a body of results was built with; here the C++ and python sides disagree."

[[question]]
about = "documentation contradicting code"
question = "bulk_viscosity states Not implemented and raises NotImplementedError in its docstring but computes a value; the python interdiffusion docstring omits the CoV frame that the code and README accept; kinematic_viscosity_tp uses Vm before assigning it (self.eos.specific_volume(T, Vm, ...)) and so cannot run as written (inferred); conductivity_matrix accepts frame_of_reference but only the centre-of-mass formulation is implemented."
why_it_matters = "Capability claims (bulk viscosity, frames) cannot be taken from the docstrings alone."

[[question]]
about = "zarate_x frame for non-ideal gases"
question = "interdiffusion raises for zarate_x unless is_idealgas is true although the docs present zarate frames as general options. Is the restriction temporary?"
why_it_matters = "Scope of the frame vocabulary for dense fluids."

[[question]]
about = "Tp interface phase assumption"
question = "Every _tp method calls specific_volume with the vapour phase flag; for liquid states at given (T, p) the vapour root may be absent or unphysical. Is there a supported way to select the liquid root?"
why_it_matters = "The calculation as offered covers only states where the vapour root is the physical one."

[[question]]
about = "hard-coded internal conductivity factor"
question = "The internal contribution uses the constant 1.32e3 times the dilute viscosity and (Cp_ideal - 5R/2) over the molar mass in g/mol; the unit and origin of 1.32e3 are not stated."
why_it_matters = "A semi-empirical constant embedded in code determines one of the three conductivity terms."

[[question]]
about = "unpublished and argon-only models"
question = "The default transfer-length model EWCA is labelled unpublished in cpp/utils.h, and the correlation model is labelled argon-only; the RDF matrix C_coeff_matr uses unpublished regressed values instead of the published table. What is the citable source for the default model?"
why_it_matters = "Attribution for the default calculation path."

[[question]]
about = "duplicate quantum parameters"
question = "Patowski parameters are identical for H2, O-H2 and P-H2; O-H2 and P-H2 carry the same bound-state energies; H2 lacks a Quantum block although its Patowski set is named. Are these intentional aliases or copy artifacts, and can the H2 set be used without a Quantum block?"
why_it_matters = "Spin-isomer identity and whether equal parameter values are separate facts or one fact."

[[question]]
about = "dependency declaration"
question = "pyproject.toml lists only numpy and scipy, while pykingas imports thermopack (saftvrmie, saftvrqmie, ideal, cubic, saft) at import time."
why_it_matters = "The data and equation dependency on ThermoPack is implicit and unversioned."
