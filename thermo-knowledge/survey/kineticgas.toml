source = "kineticgas"
pin = "4545e40a7e49"
surveyed = "2026-09-30"
summary = "KineticGas v2.3.0 (C++ core with the pykingas Python package) computes dilute-to-dense gas transport properties (shear and bulk viscosity, thermal conductivity with translational, density and internal contributions, inter- and self-diffusion in several frames of reference, thermal diffusion coefficients, ratios, factors and Soret coefficients) from the Chapman-Enskog solution to Sonine-polynomial order N and revised Enskog theory, for hard-sphere, Mie, extended-Sutherland, Feynman-Hibbs-corrected Mie, Lennard-Jones/spline and several ab initio multiparameter pair potentials, and it contributes 30 fluid JSON records with named potential-parameter sets plus bound-state and phase-shift tables for 6 light species. It holds no thermodynamic equation of its own, taking density, chemical-potential derivatives and ideal-gas heat capacity from a ThermoPack (or user) equation of state, and the ThermoPack, autodiff, Eigen, json and pybind11 submodule directories are empty in the pin."

