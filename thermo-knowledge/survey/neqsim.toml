[[model_family]]
name = "SystemSrkEos (SRK-EOS)"
locator = "src/main/java/neqsim/thermo/system/SystemSrkEos.java"
class = "wrapper"
inputs = "T (K), P (bar) and component mole numbers; composition as mole numbers and mole fractions; phases are identified by flash and classified gas, oil or aqueous"
parameters = "pure: TC, PC, ACSFACT, RACKETZ (volume correction), MOLARMASS; ACSFACT; pair: KIJSRK (KIJTSRK, KIJTType with temperature-dependent rules)"
composes = [
  { slot = "phase class (one per phase slot)", accepts = "Phase subclass of PhaseEos, PhaseGE or a reference-equation phase", default = "PhaseSrkEos (delta1 = 1, delta2 = 0)" },
  { slot = "component class created by the phase", accepts = "Component subclass", default = "ComponentSrk (a = 0.42748 R^2Tc^2/Pc-type constant 1/(9(2^(1/3)-1)), b = (2^(1/3)-1)/3 R Tc/Pc)" },
  { slot = "attractive term (alpha function)", accepts = "AttractiveTermInterface selected by attractiveTermNumber (0..23)", default = "0 (Soave)" },
  { slot = "volume correction", accepts = "useVolumeCorrection flag on the phases", default = "true (Phase default)" },
  { slot = "TBP property model (characterisation)", accepts = "TBPModelInterface", default = "PedersenSRK" },
  { slot = "mixing rule", accepts = "EosMixingRuleType code (1 NO, 2 CLASSIC, 3 CLASSIC_HV, 4 HV, 5 WS, 7 CPA_MIX, 8 CLASSIC_T, 9 CLASSIC_T_CPA, 10 CLASSIC_TX_CPA, 11 SOREIDE_WHITSON, 12 CLASSIC_T2)", default = "1 (no interaction, kij = 0) is applied at first init when no mixing rule has been set (PhaseEos.init); autoSelectMixingRule would choose 4 (Huron-Vidal with temperature terms) only when the fluid contains water, otherwise 2 (classic)" },
  { slot = "solid and hydrate phases", accepts = "PhasePureComponentSolid, PhaseHydrate appended by the constructor flags", default = "absent unless checkForSolids or setHydrateCheck is set" },
]
variants = [
  { selector = "checkForSolids constructor argument / setSolidPhaseCheck", selects = "adds PhasePureComponentSolid as an extra phase (phase count 5)" },
  { selector = "setHydrateCheck(true)", selects = "adds PhaseHydrate as the last phase" },
]
equation_source = "not stated (class names only)"
closed_form = "implicit"
data = "construct 'COMP columns: critical constants, acentric factor and basic state data' and construct 'INTER columns: cubic-EOS and PC-SAFT kij'"

