statement = "PhaseType members with values and descriptors: LIQUID 0 (liquid), GAS 1 (gas), OIL 2 (oil), AQUEOUS 3 (aqueous), HYDRATE 4 (gas hydrate), WAX 5 (wax), SOLID 6 (solid), SOLIDCOMPLEX 7 (solidComplex), ASPHALTENE 8 (asphaltene), LIQUID_ASPHALTENE 9 (asphaltene liquid). StateOfMatter maps GAS to gas; LIQUID, OIL, AQUEOUS and LIQUID_ASPHALTENE to liquid; SOLID, SOLIDCOMPLEX, WAX, HYDRATE and ASPHALTENE to solid. Default system layout: two fluid phases (gas, liquid) with the flash classifying liquids as oil or aqueous; with the solid check in a constructor the system gets 5 phases and PhasePureComponentSolid sits in the last slot (index 4), a constructor with the hydrate check puts PhaseHydrate in that last slot; SystemThermo.addHydratePhase puts PhasePureComponentSolid in slot 3 and PhaseHydrate in slot 4 (5 phases), addHydratePhase2 puts PhaseHydrate in slot 3 (4 phases), and addSolidComplexPhase puts PhaseWax or PhaseSolidComplex in slot 5 (6 phases); PhaseGE decides OIL versus AQUEOUS by comparing the mole sum of hydrocarbon, inert and TBP components against the rest."
scope = "every phase and system"

