summary = "NeqSim v3.23.0 (sparse checkout of the data, thermo, physicalproperties and util/database trees; 40 data files, 172683957 bytes) contributes one wide pure-component table (COMP: 172 columns; COMP_EXT: 76704 mostly template-filled rows) read by per-class Java code for the named system assemblies, a 39-column binary interaction table with model-specific columns, UNIFAC, Pitzer, reaction, salt, MBWR, ISO 6976, adsorption and Henry tables, embedded reference-equation and ion parameter tables, petroleum characterisation and physical-property methods. It does not bundle the flash, phase-envelope or reaction-equilibrium algorithms, the PHREEQC data file its code names, or units and citations for most coefficient columns; unknown cells hold water or methane template values rather than being empty."

