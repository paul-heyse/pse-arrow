statement = "Temperature in K; pressure in bar absolute (bara); molar mass in kg/mol; molar volume in m3/mol multiplied by 1e5 (getMolarVolume, so that P[bar] x V equals J/mol scale); mass density from 1/V x M x 1e5 in kg/m3; enthalpy and entropy extensive in J and J/K for the moles in the phase; Cp in J/K; molar amounts in mol. Critical volume in cm3/mol (inferred from ComponentBWRS comment). SystemProperties reports in Pa, K, mol/m3, kg/m3, J/mol, J/molK, Pa s, W/mK, m/s."
scope = "every model assembly; the COMP table converts on read"

[[convention]]
name = "Units of the COMP table versus the object model"
locator = "src/main/java/neqsim/thermo/component/Component.java:313-346"
statement = "TC and NORMBOIL are degrees Celsius in the table and Kelvin in the object (273.15 added); MOLARMASS g/mol to kg/mol (divided by 1000); PC stays in bar; CRITVOL cm3/mol; sigma columns (sigmaSAFT, sigmaSAFTVRMie) are Angstrom divided by 1e10; the UMR-CPA block is in bar litre units converted by x 1e4, x 1e2, x 1e2; every other column is read unchanged. The table states no unit anywhere."
scope = "COMP columns"

[[convention]]
name = "Gas constant and physical constants"
locator = "src/main/java/neqsim/thermo/ThermodynamicConstantsInterface.java; util/gerg/GERG2008.java:833; util/leachman/Leachman.java:708; util/spanwagner/NeqSimSpanWagner.java:16; util/referenceequations/Ammonia2023.java:18; phase/PitzerBinaryVolumetricModel.java:24"
statement = "Library default R = 8.3144621 J/mol/K, Boltzmann constant 1.38066e-23, Avogadro number 6.023e23, electron charge 1.6021917e-19, Faraday 96486.70, vacuum permittivity 8.85419e-12, atm 101325 Pa, reference pressure 1.01325 bar, reference temperature 273.15 K, standard-state temperature 288.15 K, normal-state temperature 273.15 K, air molar mass 28.96546 g/mol. Modules use other gas constants: 8.314472 (GERG-2008, Vega), 8.31451 (Leachman, Span-Wagner), 8.31446261815324 (Ammonia2023, Pitzer volumetric). A coefficient set is consistent only with the R of its module."
scope = "all calculations; reference equations use their own R"

[[convention]]
name = "Reference states for enthalpy and entropy"
locator = "src/main/java/neqsim/thermo/component/Component.java:1664-1730"
statement = "Ideal-gas enthalpy is the integral of the Cp0 polynomial from 273.15 K (sensible, zero at 273.15 K) by default. With useIdealGasEnthalpyOfFormation enabled it becomes Hf(298.15 K) plus the sensible change from 298.15 K and requires a reviewed formation enthalpy (FORMATIONENTHALPYSOURCE non-empty, non-ion). Entropy integrates Cp0/T from 273.15 K and adds -R ln(P/1.01325 bar) - R ln x. Reference equations (GERG, Leachman, Vega, Span-Wagner, IF97, Ammonia2023) carry their own internal references that are not reconciled with these in the pinned tree."
scope = "enthalpy and entropy of all EOS phases"

