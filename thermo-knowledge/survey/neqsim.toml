scope = "chemical reaction initialisation"

[[convention]]
name = "Absence markers"
locator = "src/main/resources/data/COMP.csv; COMP_EXT.csv; INTER.csv; component/Component.java"
statement = "The tables do not use NULL except a few empty cells: zero and 0.0 mean 'no data' for coefficient groups, the text none means 'no correlation' (AntoineVapPresLiqType), 0 means 'no scheme' (associationscheme), 900/0/0/0 means 'no Henry data' (HenryCoef), 1.0 is a placeholder ionic diameter (DeshMatIonicDiameter) and 1 is a placeholder kij for ion pairs (KIJSRK), template values (water or methane rows) fill unknown cells of generated COMP_EXT rows, and a missing INTER row means zero interaction. Code returns NaN for absent correlations (vapour pressure, Henry) rather than zero."
scope = "all table groups"

[[convention]]
name = "Temperature scale"
locator = "src/main/java/neqsim/thermo/component/Component.java:315-346"
statement = "No temperature scale (ITS-90, IPTS-68) is named anywhere in the pinned tree; the Celsius-to-Kelvin offset is always 273.15 and the water triple point in COMP is 273.16 K with a melting point of 273.15 K."
scope = "all temperatures"

[[selection]]
name = "Pure-component row lookup, fallback row and failure"
locator = "src/main/java/neqsim/thermo/component/Component.java:253-310"
rule = "The component name is first passed through ComponentNameResolver. The reader selects * from comp (or comptemp when temporary tables are on, then comp) WHERE name equals the resolved name. A missing row is an error unless the name contains _PC, in which case the row named default is used. Any failed numeric parse of a required column raises an exception for the whole component; optional columns (InChIKey is never read, FORMATIONENTHALPYSOURCE, SAFT-VR Mie, UMR-CPA blocks) are read in try blocks with fallbacks."
scope = "every pure-component property"
documented = "Not documented beyond code comments; the error text says 'Component <name> not found in comp database table'."

[[selection]]
name = "Standard versus extended component database"
locator = "src/main/java/neqsim/util/database/NeqSimDataBase.java:433-530"
rule = "Global and static: COMP is the 389-row table at start-up. useExtendedComponentDatabase(true) drops COMP, recreates it from COMP_EXT, adds any missing COMP columns as VARCHAR, inserts COMP rows whose NAME is absent with new IDs, overwrites ENTHALPYOFFORMATION and FORMATIONENTHALPYSOURCE for rows where COMP has a source, and overwrites the Antoine columns for COMP rows of type none and for acetone, ammonia and H2S. useExtendedComponentDatabase(false) reloads COMP.csv. COMPTEMP and INTERTEMP made at start-up are not refreshed."
scope = "which rows and which parameter values a component receives"
documented = "The javadoc states the merge rules; the INTER table is not switched."

[[selection]]
name = "Which INTER column a phase reads for the EOS kij"
locator = "src/main/java/neqsim/thermo/mixingrule/EosMixingRuleHandler.java:205-282"
rule = "Decided by the phase class: exact class name PhasePrEos reads KIJPR and KIJTPR; every other phase starts from KIJSRK and KIJTSRK; then instance checks override in this order: PhasePrCPA reads cpakij_PR; PhaseSrkCPA (and subclasses) reads cpakij_SRK, cpakijT_SRK and the oriented cpakijx_SRK and cpakjix_SRK; any other PhaseCPAInterface (including PhaseUMRCPA) reads cpakij_SRK and cpakijT_SRK; PhaseSoreideWhitson reads KIJWhitsonSoriede and computes aqueous kij; finally exact class names PhasePCSAFTRahmat, PhasePCSAFT and PhasePCSAFTa read KIJPCSAFT with no temperature term. An optional static flag calcEOSInteractionParameters replaces all database kij by the Chueh-Prausnitz estimate."
scope = "binary interaction parameters of cubic and SAFT-type phases"
documented = "Not documented; PhasePrEosvolcor, PhaseBNS and PhaseUMRCPA fall on the SRK or CPA columns by construction."

[[selection]]
name = "Missing INTER row and pseudo-component overrides"
locator = "src/main/java/neqsim/thermo/mixingrule/EosMixingRuleHandler.java:171-470"
rule = "Pairs containing a TBP fraction never read INTER. A pair without a row (or any pair whose read fails) keeps kij 0, except: with calcEOSInteractionParameters the Chueh-Prausnitz value from critical volumes; mercury with a hydrocarbon heavier than ethane the Tb/MW correlation of BIPEstimator; CO2 with a TBP fraction 0.1; nitrogen with a TBP fraction 0.08; water with a TBP fraction 0.2 (for PhaseSrkCPA -0.1533 ln(1000 M) + 0.7055, M in kg/mol); MEG with a TBP fraction 0.2 (PhaseSrkCPA: -0.0701 ln(1000 M) + 0.3521); ethanol 0.0 (PhaseSrkCPA -0.05, or -0.1 above 200 g/mol); methanol 0.0 (PhaseSrkCPA -0.1, or -0.2 above 200 g/mol); TEG 0.12; S8 0.05. HVTYPE and WSTYPE default to Classic and the HV and NRTL matrices to 0. A missing CPA cross-association row means combining rule ER with no stored cross values."
scope = "kij and the other pair parameters"
documented = "Not documented; the values are literals in the handler."

[[selection]]
name = "Mixing-rule choice by system class and by fluid"
locator = "src/main/java/neqsim/thermo/system/SystemThermo.java:1292-1320 (autoSelectMixingRule); mixingrule/EosMixingRuleHandler.java:526-590"
rule = "setMixingRule(int|String|enum) sets the rule on every phase. autoSelectMixingRule (called only by setModel and autoSelectModel paths, not by constructors) maps the modelName string: CPAs-SRK-EOS, CPA-SRK-EOS, Electrolyte-CPA-EOS-statoil, CPAs-SRK-EOS-statoil, Electrolyte-CPA-EOS to 10; ScRK-EOS-HV, SRK-EOS or ScRK-EOS with water present to 4; PR-EOS to 2; Electrolyte-ScRK-EOS to 4; Kent Eisenberg-model to 4; UMR-PRU-EoS, UMR-PRU-MC-EoS, UMR-CPA to HV with the GE model UNIFAC_UMRPRU; GERG-water-EOS to 8; GERG-2008-EOS to 2; PC-SAFT to 8; anything else to 2. Without any call a PhaseEos applies rule 1 (kij = 0) at its first init. FluidBuilder.withMixingRule sets a name or number explicitly."
scope = "which kij and mixing form a fluid uses"
documented = "The javadoc of EosMixingRuleType documents the codes; the string keys of autoSelectMixingRule partly fail to match the real model names (see discrepancy)."

[[selection]]
name = "Alpha-function choice"
locator = "src/main/java/neqsim/thermo/component/ComponentEos.java:194-259; component/ComponentSrkCPA.java:139-145; component/ComponentUMRCPA.java:179-220"
rule = "attractiveTermNumber is fixed by the assembly constructor (see the assembly records) and pushed to each phase and component by setAttractiveTerm. Component classes may override the requested number: ComponentSrkCPA keeps it but replaces the alpha slope m by mCPA when aCPA is non-zero; ComponentUMRCPA ignores it and picks 22, 1 (with m = mCPA) or 19 from the UMR-CPA columns; attractive term 18 and 23 branch on the component name (mercury, water)."
scope = "temperature dependence of the EOS attractive parameter"
documented = "Only in code comments."

[[selection]]
name = "Model choice by composition (autoSelectModel) and by name (setModel)"
locator = "src/main/java/neqsim/thermo/system/SystemThermo.java:1321-1345 (autoSelectModel), 5452-5530 (setModel)"
rule = "autoSelectModel: MDEA with water and CO2 gives Electrolyte-ScRK-EOS; water, methanol, MEG, TEG, ethanol or DEG present gives Electrolyte-CPA-EOS-statoil when any of Na+, K+, Br-, Mg++, Cl-, Ca++, Fe++, SO4-- is present and CPAs-SRK-EOS-statoil otherwise; water alone gives ScRK-EOS; mercury gives SRK-TwuCoon-Statoil-EOS; otherwise SRK-EOS. setModel accepts exactly the strings SRK-EOS, GERG2004-EOS, PrEos or PR-EOS, ScRK-EOS or ScRK-EOS-HV, Electrolyte-ScRK-EOS, GERG-water-EOS, CPAs-SRK-EOS, CPAs-SRK-EOS-statoil, Electrolyte-CPA-EOS-statoil or Electrolyte-CPA-EOS, UMR-PRU-EoS, PC-SAFT, GERG-2008-EoS, SRK-TwuCoon-Statoil-EOS or SRK-TwuCoon-EOS, SRK-TwuCoon-Param-EOS, and refuses Duan-Sun; any other string raises an exception. The new system copies components (TBP and plus fractions re-characterised by the new system's TBP model), turns volume correction on, autoselects the mixing rule and sets the multi-phase check."
scope = "fluid-level model assembly"
documented = "Not documented."

[[selection]]
name = "TBP model, plus-fraction model and lumping model defaults"
locator = "src/main/java/neqsim/thermo/characterization/Characterise.java:33-60; system/SystemSrkEos.java:44; system/SystemPrEos.java:61; system/SystemSrkPenelouxEos.java:44"
rule = "Characterise defaults: TBP model PedersenSRK, plus-fraction model Pedersen (standard), lumping standard. SystemSrkEos and SystemSrkPenelouxEos set PedersenSRK; SystemPrEos (and every subclass: PR variants, UMR-PRU, UMR-CPA, GERG-water, Soreide-Whitson) sets PedersenPR; SystemIdealGas sets RiaziDaubert; all others keep PedersenSRK. characterisePlusFraction switches to Pedersen Heavy Oil when the plus molar mass exceeds 0.605 kg/mol. Unrecognised names select the default with a warning. TBPfractionModel.recommendTBPModel gives a recommendation but nothing calls it automatically."
scope = "pseudo-component generation"
documented = "The class comment of TBPfractionModel describes the models; defaults are in code."

[[selection]]
name = "Physical-property model defaults by phase and model name"
locator = "src/main/java/neqsim/physicalproperties/PhysicalPropertyHandler.java:50-157; system/gasphysicalproperties/GasPhysicalProperties.java:45-66; system/liquidphysicalproperties/LiquidPhysicalProperties.java:45-66"
rule = "PhysicalPropertyHandler builds gas, oil, aqueous and solid objects by PhysicalPropertyModel. Gas and oil objects use PFCT conductivity, PFCT-Heavy-Oil viscosity, Chapman-Enskog (gas) or Siddiqi-Lucas (liquid) diffusivity and EOS density, except that a PhaseSpanWagnerEos phase uses the CO2 conductivity and viscosity methods, and a single-component phase of hydrogen or water uses the hydrogen or water conductivity with PFCT-Heavy-Oil viscosity. Aqueous objects: Water (polynomial conductivity and viscosity), Glycol, Amine, CO2water or SaltWater variants. Phase type LIQUID is mapped to the oil object (TODO comment questions it). Viscosity model strings with no branch leave the current method unchanged; conductivity strings with no branch select PFCT."
scope = "transport properties, density, interfacial tension"
documented = "Not documented beyond the PhysicalPropertyModel class comment."

[[selection]]
name = "Hydrate, wax and solid model selection"
locator = "src/main/java/neqsim/thermo/phase/PhaseHydrate.java:36-110; phase/PhaseWax.java; system/SystemThermo.java:5762-5770"
rule = "The model name is consulted only by the constructor PhaseHydrate(String), which SystemThermo.addHydratePhase calls with getModelName(); the no-argument constructor used by the system constructors' hydrate check keeps PVTsimHydrateModel. PhaseHydrate(String) picks PitzerHydrateModel when the fluid model name is Pitzer-GE-model, CPAHydrateModel when it is CPAs-SRK-EOS-statoil, CPAs-SRK-EOS, CPA-SRK-EOS or Electrolyte-CPA-EOS-statoil, and PVTsimHydrateModel otherwise. The wax component model is one of Pedersen (default), Won, Wilson, Coutinho, set before any wax component exists. Components compete for solid or hydrate only if flagged (waxformer = 1, HydrateFormer = yes); methane is excluded from pure-component solid checks."
scope = "solid-phase parameters and model form"
documented = "Wax model names are documented in PhaseWax; hydrate model names only in code."

[[selection]]
name = "UNIFAC table choice"
locator = "src/main/java/neqsim/thermo/phase/PhaseGEUnifacUMRPRU.java:198-217; component/ComponentGEUnifac.java:55-95"
rule = "Classic UNIFAC reads UNIFACcomp and UNIFACInterParam; PSRK adds the B and C matrices; UMR-PRU reads UNIFACcompUMRPRU and the _umr matrices, or the _umrmc matrices when the first component's attractive-term number is 13, 19 or 22. Pseudo-components get groups by the CH3/CH2 rule. The first row with a matching Name wins."
