statement = "PhysicalPropertyModel: DEFAULT 0, WATER 1, GLYCOL 2, AMINE 3, CO2WATER 4, BASIC 6, SALT_WATER 7 (5 is unused). PhysicalPropertyType: MASS_DENSITY, DYNAMIC_VISCOSITY, THERMAL_CONDUCTIVITY (legacy DENSITY, VISCOSITY, CONDUCTIVITY). Viscosity selector strings: polynom, friction theory, LBC, PFCT, CSP, PFCT-Heavy-Oil, KTA, KTA_mod, Muzny, Muzny_mod, MethaneModel, CO2Model, Salt Water. Conductivity: PFCT, polynom, Chung, Chung-dense, CO2Model, friction theory, Filippov, WaterModel, H2Model (default PFCT). Diffusivity: CSP, Chapman-Enskog, Wilke Lee, Siddiqi Lucas, Alkanol amine, Fuller-Schettler-Giddings, Wilke-Chang, Tyn-Calus, Hayduk-Minhas, High Pressure. Density: Peneloux volume shift, Costald, Costald polar, Rackett. Interfacial tension: Linear Gradient Theory, Simple Gradient Theory, Full Gradient Theory, cDFT or Classical DFT, Firozabadi Ramley, Parachor or Weinaug-Katz (default Parachor), integer model codes 0 to 5."
scope = "physical-property objects of phases"

[[convention]]
name = "Component naming conventions"
locator = "src/main/java/neqsim/thermo/component/ComponentNameResolver.java; system/SystemThermo.java:929-1000; characterization/PlusFractionModel.java; characterization/LumpingModel.java"
statement = "Database names are shorthand (224-TM-C5, nC10, c-C5, MEG, TEG, water, methane); ions carry the charge in the name (Na+, Ca++, SO4--, OH-, MDEA+). A name containing _PC is a pseudo-component: its COMP data come from the row default and then from correlations. TBP fractions are C<n>_PC; plus fractions are C<n>_PC with the carbon number parsed from the name; lumps are PC<k>_PC (standard lumping) or PC<first>-<last>_PC. A double underscore in a name truncates the name for INTER lookups. Sulfur has the names S8 and sulfur(S8) in COMP."
scope = "all lookups by name"

[[convention]]
name = "Composition bases and amount units"
locator = "src/main/java/neqsim/thermo/system/SystemThermo.java:addComponent(name, value, unit) (494-540); phase/PhaseInterface.java:54-60"
statement = "Composition coordinates are moles and mole fractions; Phase.getComposition supports molefraction, wtfraction, molespersec and volumefraction. addComponent with a unit string converts through RateUnit using MOLARMASS (kg/mol), STDDENS and NORMBOIL of the COMP row; setComponentFlowRates accepts mol/sec, kmol/sec, kmol/hr, mol/hr, mol/min, kg/hr, kg/sec, kmol/day. Salinity for Soreide-Whitson is given as NaCl-equivalent moles per second or per hour and converted to molality inside the phase; the salt-specific equivalence factors (Na2SO4 3.0, MgSO4 2.75, Mg(NO3)2 1.3, NaCl 1.0, NaNO3 0.6, KCl 0.5, KNO3 0.3) are in SystemSoreideWhitson."
scope = "system inputs"

[[convention]]
name = "System size limit"
locator = "src/main/java/neqsim/thermo/ThermodynamicModelSettings.java:12-13"
statement = "MAX_NUMBER_OF_COMPONENTS = 200 sizes the derivative arrays of every component, so a fluid can hold at most 200 components even when COMP_EXT offers 76704 names."
scope = "every system"

[[convention]]
name = "Reaction data sources"
