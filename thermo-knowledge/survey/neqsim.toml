locator = "src/main/java/neqsim/thermo/system/SystemBnsEos.java (model name set at the constructor; lumped five-component property model driven by gas relative density)"
class = "wrapper"
inputs = "T (K), P (bar) and component mole numbers; composition as mole numbers and mole fractions; phases are identified by flash and classified gas, oil or aqueous"
parameters = "pure: built-in Tc, Pc, molar mass, acentric factor, omegaA, omegaB and volume-shift arrays for the five components (degrees Rankine and psia constants converted in the class); the HC pseudo-critical from the gas relative density with separate associated-gas and gas-condensate correlations; pair: built-in temperature-dependent kij constants and slopes per pair (setBnsBips); no database columns"
composes = [
  { slot = "phase class (one per phase slot)", accepts = "Phase subclass of PhaseEos, PhaseGE or a reference-equation phase", default = "PhaseBNS (PR with five fixed pseudo-components CO2, H2S, N2, H2 and HC)" },
  { slot = "component class created by the phase", accepts = "Component subclass", default = "ComponentBNS" },
  { slot = "attractive term (alpha function)", accepts = "AttractiveTermInterface selected by attractiveTermNumber (0..23)", default = "1 (PR76)" },
  { slot = "volume correction", accepts = "useVolumeCorrection flag on the phases", default = "true" },
  { slot = "mixing rule", accepts = "EosMixingRuleType code (1 NO, 2 CLASSIC, 3 CLASSIC_HV, 4 HV, 5 WS, 7 CPA_MIX, 8 CLASSIC_T, 9 CLASSIC_T_CPA, 10 CLASSIC_TX_CPA, 11 SOREIDE_WHITSON, 12 CLASSIC_T2)", default = "1 (no interaction, kij = 0) is applied at first init when no mixing rule has been set (PhaseEos.init); autoSelectMixingRule would choose 2 (classic, default branch)" },
  { slot = "solid and hydrate phases", accepts = "PhasePureComponentSolid, PhaseHydrate appended by the constructor flags", default = "absent unless checkForSolids or setHydrateCheck is set" },
]
variants = [
  { selector = "associatedGas", selects = "selects the associated-gas pseudo-critical correlation instead of the gas-condensate one" },
]
equation_source = "Burgoyne, Nielsen and Stanko named in the class comment (no citation)"
closed_form = "implicit"
data = "none bundled: parameters are constants in SystemBnsEos.java and PhaseBNS.java"

[[model_family]]
name = "SystemSoreideWhitson (Soreide-Whitson-PR-EoS)"
locator = "src/main/java/neqsim/thermo/system/SystemSoreideWhitson.java (model name set at the constructor; extends SystemPrEos1978; addSalinity(salt, value, unit) upper-cases the salt name before comparing it with mixed-case labels, see discrepancy)"
class = "wrapper"
inputs = "T (K), P (bar) and component mole numbers; composition as mole numbers and mole fractions; phases are identified by flash and classified gas, oil or aqueous"
parameters = "pure: TC, PC, ACSFACT, RACKETZ (volume correction), MOLARMASS; ACSFACT; global: salinity (NaCl-equivalent); pair: KIJWhitsonSoriede (base kij); aqueous kij computed from reduced temperature, acentric factor and salinity with three parameterizations"
composes = [
  { slot = "phase class (one per phase slot)", accepts = "Phase subclass of PhaseEos, PhaseGE or a reference-equation phase", default = "PhaseSoreideWhitson (PR with modified water alpha and salinity-dependent aqueous kij)" },
  { slot = "component class created by the phase", accepts = "Component subclass", default = "ComponentSoreideWhitson" },
  { slot = "attractive term (alpha function)", accepts = "AttractiveTermInterface selected by attractiveTermNumber (0..23)", default = "20 (Soreide-Whitson water alpha)" },
  { slot = "volume correction", accepts = "useVolumeCorrection flag on the phases", default = "true (Phase default)" },
  { slot = "TBP property model (characterisation)", accepts = "TBPModelInterface", default = "PedersenPR" },
  { slot = "mixing rule", accepts = "EosMixingRuleType code (1 NO, 2 CLASSIC, 3 CLASSIC_HV, 4 HV, 5 WS, 7 CPA_MIX, 8 CLASSIC_T, 9 CLASSIC_T_CPA, 10 CLASSIC_TX_CPA, 11 SOREIDE_WHITSON, 12 CLASSIC_T2)", default = "1 (no interaction, kij = 0) is applied at first init when no mixing rule has been set (PhaseEos.init); autoSelectMixingRule would choose 2 (classic, default branch)" },
  { slot = "solid and hydrate phases", accepts = "PhasePureComponentSolid, PhaseHydrate appended by the constructor flags", default = "absent unless checkForSolids or setHydrateCheck is set" },
]
variants = [
  { selector = "setSoreideWhitsonParameterization", selects = "LEGACY, CHABAB_2019 (aqueous CO2-water kij of Chabab et al. 2019) or BURGOYNE_NIELSEN_2026 (water paired with CO2, H2S, methane, nitrogen, hydrogen, ethane, propane, n-butane)" },
]
equation_source = "Chabab et al. (2019) and Burgoyne and Nielsen (Fluid Phase Equilibria 114824, 2026, doi 10.1016/j.fluid.2026.114824) in class comments"
closed_form = "implicit"
data = "construct 'COMP columns: critical constants, acentric factor and basic state data' and construct 'INTER columns: cubic-EOS and PC-SAFT kij'"

