documented = "The class comment lists NO 1, CLASSIC 2, CLASSIC_HV 3, HV 4, WS 5, CPA_MIX 7, CLASSIC_T 8, CLASSIC_T_CPA 9, CLASSIC_TX_CPA 10 and SOREIDE_WHITSON 11."
