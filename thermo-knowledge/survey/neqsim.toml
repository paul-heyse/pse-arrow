[[question]]
about = "hydrate parameters"
question = "What does the suffix GF stand for, and what are the units and source of the HydrateA*/B* and *_GF Langmuir coefficients?"
why_it_matters = "Two coexisting parameter sets for one phenomenon need separate parameterizations with sources."

[[question]]
about = "UNIFAC group and matrix provenance"
question = "Which published tables do the UNIFAC, PSRK, UMR-PRU and UMR-PRU-MC matrices come from, and what are the units of the b and c matrices?"
why_it_matters = "Only a group-table Reference column exists; matrices carry no source."

[[question]]
about = "Duan-Sun coefficients"
question = "Are the arrays c and d holding 0.1 to 0.5 in DuanSun.java placeholders, and which constants does ComponentGeDuanSun use?"
why_it_matters = "A placeholder in a correlation class would make the model non-mappable."

[[question]]
about = "Bukacek water content"
question = "Why does BukacekWaterInGas use 393.99 C as the critical temperature of water?"
why_it_matters = "The constant differs from the COMP and IAPWS values and shifts every dew point."

[[question]]
about = "EOS-CG parameters"
question = "Are the EOSCGModel parameters those of the EOS-CG publication (28 components) or a GERG-2008 derived set?"
why_it_matters = "Decides whether the model can be recorded as EOS-CG."

[[question]]
about = "TST-EOS"
question = "What does TST stand for and which publication defines the a and b constants 0.427481 and 0.086641 with PR delta values?"
why_it_matters = "The class mixes SRK-like constants with PR denominators."

[[question]]
about = "default component row"
question = "What are the intended semantics of the COMP row named default (ID 64), which every pseudo-component borrows unoverwritten cells from, and of the water-like INSERT into COMPTEMP used when temporary tables are on?"
why_it_matters = "Template cells leak into pseudo-components (hydrate, association, dielectric) and affect models that read them."

[[question]]
about = "H2 case sensitivity"
question = "Is string comparison case-insensitive in any deployed configuration (IGNORECASE setting), which would resolve the 28 INTER and other name mismatches?"
why_it_matters = "The pinned connection string has no IGNORECASE; behaviour with other drivers is unknown."

[[question]]
about = "PVTsim tables"
question = "What is the source of the embedded PVTsimMolarMass (195 values) and PVTsimDensities (75 values) tables?"
why_it_matters = "Plus-fraction characterisation depends on them and they carry no citation."

[[question]]
about = "validity ranges"
question = "Do any pure-component correlations (Cp polynomial, Antoine, liquid density) have applicability ranges stored anywhere other than the Pitzer Tmin/Tmax columns and class comments?"
why_it_matters = "Envelope rows cannot be filled for COMP-derived parameter sets."

[[question]]
about = "other database back ends"
question = "What do the MySQL, Access and ODBC databases named in NeqSimDataBase, NeqSimFluidDataBase, NeqSimBlobDatabase and NeqSimExperimentDatabase contain relative to the CSV tables?"
why_it_matters = "A deployment may use data that the pinned tree does not show."

[[question]]
about = "COMPTYPE values"
question = "What distinguish COMPTYPE 0 (18 rows, mostly nitrogen oxides and small reactive species), GEN, other, inert and Component, given that the Component field comment itself asks what HC, inert and Component do?"
why_it_matters = "The class drives phase typing and ion handling."

[[question]]
about = "liquid viscosity units"
question = "What are the units of the LIQVISC correlations (the result is divided by 1e3), and is the intended unit mPa s or cP?"
why_it_matters = "The type 1 to 4 correlations need a stated output unit."

[[question]]
about = "PhysicalPropertyHandler LIQUID mapping"
question = "Should PhaseType LIQUID map to the oil object (a TODO in the handler questions it)?"
why_it_matters = "Decides which transport methods a generic liquid gets."
