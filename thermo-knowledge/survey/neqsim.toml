[[construct]]
name = "COMP (table)"
locator = "src/main/resources/data/COMP.csv; table COMP created by NeqSimDataBase.initH2DatabaseFromCSVfiles (util/database/NeqSimDataBase.java:598-650)"
meaning = "The pure-component database: one wide row per component holding every pure-component constant or coefficient that any NeqSim model, physical-property method or characterisation step might need. One row feeds dozens of models; which columns a model consumes is decided by the Java class that reads the row, not by the file."
subject = "One component, keyed by the NAME column (text, case-sensitive in H2). ID, CASnumber and COMPINDEX are not keys used by the readers: lookups are always WHERE name='...', and a pseudo-component (name containing _PC) falls back to the row named default."
fields = [
  { name = "(172 columns)", meaning = "See the twelve 'COMP columns' constructs that partition the header; every header name is assigned to exactly one group (checked).", unit = "see groups", shape = "table", role = "metadata" },
]
origin = "not stated (no file-level source statement; individual columns carry none; FORMATIONENTHALPYSOURCE and the UMRCPA_* code comments cite NIST-Chase-1998 and Tasios et al. 2025)"
conventions = "Temperatures TC, NORMBOIL in degrees Celsius (Component.java:315-316 and 346 add 273.15); MOLARMASS in g/mol (divided by 1000); PC in bar; everything else as listed per group. The Java side works in K, bar (bara), kg/mol, molar volume m3/mol x 1e5, J and J/mol."
absence = "No NULLs in COMP.csv except InChIKey (21 empty) and FORMATIONENTHALPYSOURCE (376 empty) and associationboundingvolume_PR (4 empty). Everything else is filled, with 0 or 0.0 standing for 'no data' in most coefficient groups and with template values standing for 'no data' in critical-constant, transport and EOS columns. The file does not distinguish a measured zero from a missing value; only the consumer code decides (for example HenryCoef rows 900/0/0/0 are treated as absent, Antoine type none means no correlation)."
validity = "not stated"
provenance = "none at row level; one optional text column (FORMATIONENTHALPYSOURCE, 13 rows filled) names a NIST-Chase entry for the formation enthalpy."
count = "389 rows x 172 columns"
example = "src/main/resources/data/COMP.csv row with NAME methane (ID 1)"
candidate = "species (identity), species_form (aggregation-specific properties) and a family of parameter_set rows, one per (slot group, form) consumer; the row itself has no single counterpart"
precision = "broader"
loss = "One row mixes identity, conventions-dependent constants, parameters of many incompatible models and placeholders. A mapping must split it by consuming model, must drop template-filled cells rather than import them as data, and must carry the units (degrees Celsius, g/mol, bar) in a per-column conversion."

