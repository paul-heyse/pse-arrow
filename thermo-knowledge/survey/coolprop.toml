surveyed = "2026-09-30"
summary = "CoolProp v8.0.0 contributes per-fluid multiparameter Helmholtz data (136 JSON fluids with ideal and residual term lists, ancillaries, superancillary Chebyshev expansions, melting lines, surface tension, transport), the GERG-style multifluid mixture parameters (888 binary reducing-parameter pairs, 28 departure functions, 154 predefined mixtures), 116 cubic pure-fluid records, 180 PC-SAFT fluids with 140 pair parameters, and 126 fitted incompressible-liquid records with their raw grids; it bundles no IF97 coefficients, no REFPROP data, no UNIFAC/VTPR parameters and no cubic binary interaction parameters, and it encodes several equation families, all hard-coded transport models, humid air and ice only as C++ code."

