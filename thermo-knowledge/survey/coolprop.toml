# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "second EOS entries (23 fluids)"
question = "The pinned code uses EOS[0] only (CoolPropFluid.h:539; EOSVector[0] everywhere); the second entry of 23 fluids (for example Ammonia Tillner-Roth, Methanol Piazza, R1234yf Richter) has no selection switch in the tree. Are these alternates selectable by any documented route, and which is the library's intended default per fluid?"
why_it_matters = "Two coherent parameter sets exist for one subject; the model needs a selection_policy, and the source supplies none."

[[question]]
about = "reference labels OTH and CUSTOM"
question = "EnthalpyEntropyOffset.reference takes the values NBP, IIR, OTH and CUSTOM in data; the code defines IIR, ASHRAE, NBP, DEF, RESET and 'custom' (lower case) but nothing defines OTH (4 entries: Air, Ammonia, Argon, R14) or the upper-case CUSTOM (Oxygen)."
why_it_matters = "These five offsets cannot be assigned a named energy_reference and their h and s zero is not documented."

[[question]]
about = "default energy reference of 88 EOS entries without an offset term"
question = "For entries without an EnthalpyEntropyOffset term the reference state of h and s is whatever the published alpha0 gives; the data do not name it. Is it the source paper's convention in every case?"
why_it_matters = "h and s values from two such fluids are not comparable without a declared energy_reference; the model must not assume one."

[[question]]
about = "Ttriple versus sat_min_liquid temperature"
question = "EOS/Ttriple is never read; the code sets the lower limit and triple temperature from STATES/sat_min_liquid/T. In 16 of 136 first entries the two differ by more than 1e-6 K. Which is authoritative for the triple point?"
why_it_matters = "Two assertions of one physical constant disagree; both must be kept with their roles."

[[question]]
about = "fields present in data but never read by the pinned loader"
question = "Unread fields: conductivity q_D (18 ECS records; unit string m but magnitude about 1e9 to 2e9, suggesting inverse metre), critical nu (CarbonDioxide), viscosity kappa (2 Chung records), R and T0 in CP0PolyT and PlanckEinsteinFunctionT terms (Methanol, R1336mzz(Z)), superancillary crit_anc and most meta keys, EOS Ttriple. Are they documentation or meant to drive a model?"
why_it_matters = "Importing them as slots would create meaning the library does not have; dropping them may lose lineage."

[[question]]
about = "list-valued viscosity records"
question = "In 7 fluids TRANSPORT/viscosity is a list of two models and the loader uses viscosity.front(); the second element (ECS in 6, a component-sum in R152A) is inert. Is the second element an intended fallback, a retired model or an alternative?"
why_it_matters = "It affects whether one or two parameter sets exist for the subject and how a selection_policy is written."

[[question]]
about = "composition conversion functions mass2input, volume2input, mole2input"
question = "29 polynomial conversion objects are in the incompressible JSON but inputFromMass, inputFromVolume and inputFromMole throw NotImplementedError for any non-native basis (implementation commented out). What do their argument, range and output mean?"
why_it_matters = "The data exist without an executable definition, so a mapping cannot be qualified by evaluation."

[[question]]
about = "T_freeze coefficient orientation"
question = "IncompressibleFluid.h says T_freeze rows are concentration and columns pressure, but the evaluator calls the polynomial with pressure first and composition second (IncompressibleFluid.cpp:216-240), and most stored arrays are 1 row by n columns, which fits rows = pressure powers. Which orientation is meant?"
why_it_matters = "A transposed 2-D family would give wrong freezing temperatures."

[[question]]
about = "TminPsat equal to Tmax"
question = "99 incompressible records have TminPsat equal to Tmax, 13 of them with a defined saturation-pressure function; the evaluator then throws for every T in range (IncompressibleFluid.cpp:187-195, issue note in the code). Is the function intended to be unusable?"
why_it_matters = "It decides whether the function is a valid parameter set or a retained artefact."

[[question]]
about = "PC-SAFT volA unit"
question = "volA_units is Angstrom^3 in all 18 associating records, but the values (around 0.03) and their use (geometric mean with a size factor, then multiplied into the association strength) match a dimensionless kappa^AB. Which unit is correct?"
why_it_matters = "A wrong unit assignment would scale the association strength by sigma cubed."

[[question]]
about = "Kunz-Wagner table A8 flag and column order"
question = "35 of 210 rows carry an extra token 'a' (dropped by the converter) and the column order of A8 is given only by the converter script. What does 'a' denote (estimated or adjusted parameters?) and is the script order (betaV, gammaV, betaT, gammaT) guaranteed?"
why_it_matters = "The flag is an evidence distinction (fitted versus estimated) that the JSON lost."

[[question]]
about = "departure function shared across attributions"
question = "Pair R134a/R245fa (Akasaka-Purdue-2014) names the function Methane-Ethane, defined with Kunz-JCED-2012 for a different pair. Is the reuse intentional (a generalised shape) or a data error?"
why_it_matters = "Attribution of the excess term for that pair is ambiguous; the function is a many-to-one reference."

[[question]]
about = "meaning of F = 0 in binary pairs"
question = "F = 0 occurs in 848 of 888 pair records; the Kunz-Wagner converter sets it for every A8 pair not in A6 and the Bell injection fixes it at 0. The file cannot distinguish 'no published departure function' from 'fitted F of zero'."
why_it_matters = "Open-world knowledge base must record absence of an excess term differently from a known zero."

[[question]]
about = "IF97 coefficients"
question = "The IF97 backend includes <IF97.h> from an external repository pinned in cmake/dependencies.cmake (CoolProp/IF97 at 7aaced024a702f0985474bf293cdaae9c8d06521); the header is not in the pinned tree. Where are the region equations, backward equations and verification values to be read from?"
why_it_matters = "The regional_piecewise class has no data or equations in this source; qualification against IAPWS-IF97 needs the other repository."

[[question]]
about = "REFPROP and UNIFAC data"
question = "No REFPROP fluid or HMX.BNC file and no VTPR UNIFAC JSON exist in the tree; only parsers. Are any such files vendored elsewhere in the repository (for example in wrappers, doc or externals) that should be surveyed?"
why_it_matters = "Coverage of the mixture and group-contribution concepts from this source depends on it."

[[question]]
about = "units of ancillary, melting-line, splines and superancillary fields"
question = "Most ancillary, melting-line (T_0, p_0, T_min, T_max), spline and superancillary fields have no unit key; kelvin, pascal and mol/m^3 are inferred. Is there a documentation source in the repository (docs tree not present at this pin) that states them?"
why_it_matters = "Dimensioned slots must not be typed from inference alone."

[[question]]
about = "temperature scale"
question = "No file names ITS-90 or IPTS-68 for T. Each published equation was fitted on its own scale; does CoolProp make them uniform?"
why_it_matters = "The model's convention_set has a temperature-scale slot that the source cannot fill."

[[question]]
about = "validity of transport models and mixtures"
question = "No range is stated for any viscosity or conductivity model, binary pair, cubic or PC-SAFT parameter, or departure function. The pure EOS T_max and p_max are the only bounds; are transport models assumed valid over the EOS range?"
why_it_matters = "Envelope records for these sets would otherwise be invented."

[[question]]
about = "superancillary expansion quantities and dependency"
question = "jexpansions_p is read as p(T) (inferred from the evaluator), the quantity and unit of the expansions are not in the JSON, and source_eos_hash is the only link to the EOS that produced them. How is the hash computed and is it checked at load time (it is not read by the pinned loader)?"
why_it_matters = "A dependency record needs a verifiable link between derived expansions and their EOS."

[[question]]
about = "pseudo-pure fluids and predefined mixtures"
question = "Air, R404A, R407C, R410A, R507A and SES36 are pseudo-pure fluids in dev/fluids (CAS slot holding a REFPROP file name) and also appear as predefined mixtures with component lists (Air as N2, Ar, O2). Is the pseudo-pure record an EOS for the defined mixture or an independent entity?"
why_it_matters = "Decides whether these six are defined_mixture with a model assembly or species-like records."

[[question]]
about = "cubic parameter duplication and precedence"
question = "The cubic fluid record duplicates critical constants derived from the Helmholtz fluid and alpha0; the code builds a '-SRK' fluid from the Helmholtz reducing state with R = 8.3144598 when the name exists in the Helmholtz library, else from the cubic record with R_U_CODATA. Which source defines the cubic parameters, and do they differ (reducing versus critical values)?"
why_it_matters = "One model with two parameter carriers and two gas constants; an equivalence assessment and a precedence rule are required."

[[question]]
about = "VTPR, humid air and ice equation provenance"
question = "VTPRCubic.h hard-codes -0.53087 and cites nothing; Ice.cpp states no citation; HumidAirProp.cpp cites ASHRAE RP-1485 in places but holds correlation constants inline. Where are their equations documented?"
why_it_matters = "These families can be catalogued only as structure_declared_equation_external or opaque_bundle until the equations are sourced."

[[question]]
about = "identity gaps"
question = "REFPROP_NAME is N/A for several fluids; 4 predefined-mixture occurrences of R1132a resolve to no fluid alias; 10 fluids lack InChI and SMILES; the pseudo-pure CAS slot is not a CAS number; 6 BibTeX strings do not resolve to bibliography entries."
why_it_matters = "Identity assertions and their resolution need explicit unresolved states; none of these may be silently dropped or filled."

[[question]]
about = "rights of the incompressible data and of the bibliography"
question = "sources/coolprop.toml records that the incompressible data derive from SecCool and vendor grids and cites a DATA_AUDIT.md that is not in the pinned tree (only the MIT LICENSE is present). Are there per-file terms for dev/incompressible_liquids and for the BibTeX library?"
why_it_matters = "Rights attach to the import record; the survey cannot supply them."

[[question]]
about = "calculations of the shared vocabulary that the library does not offer"
question = "A keyword search of src, include and dev finds no constrained Gibbs minimisation, aqueous speciation, adsorption prediction, pseudo-component characterisation from assay data, group-contribution property estimation (beyond VTPR's activity term and the Chung rule) or interfacial density-profile calculation. Is this a complete negative result?"
why_it_matters = "The capability inventory must record the absences as findings, and only a positive record can be attached to the library."
