name = "validity statements"
locator = "dev/fluids/*.json#/EOS/<i>/{T_max,p_max}; ANCILLARIES Tmin/Tmax; incompressible Tmin/Tmax/xmin/xmax/TminPsat; FluidLibrary.h:384"
statement = "Only equations of state, ancillaries and incompressible records state ranges (T_max, p_max, lower T from sat_min_liquid; per-curve Tmin and Tmax; xmin, xmax, TminPsat). Transport models, mixture parameters, cubic and PC-SAFT records state no range beyond schema bounds; humid air enforces ranges in code (p 10 Pa to 10 MPa and T 130 K to 623 K in check_bounds, HumidAirProp.cpp:106-130)."
scope = "all constructs"

[[convention]]
name = "incompressible polynomial shifts and reference state"
locator = "include/CoolProp/fluids/IncompressibleFluid.h:70-130; include/CoolProp/numerics/PolyMath.h:213-220; IncompressibleBackend.h:89"
statement = "Polynomials are evaluated in (T - Tbase) and (x - xbase) (Tbase and xbase from the record, 0 by default); exponential types ignore Tbase; the freezing-temperature function is evaluated as a function of (p, x) with Tbase = 0. The enthalpy and entropy zero is set at run time (defaults 293.15 K, 101325 Pa, x0 = 0, h0 = s0 = 0) and no reference state is stored in the data."
scope = "incompressible records"

[[convention]]
name = "PC-SAFT and cubic parameter conventions"
locator = "src/Backends/PCSAFT/PCSAFTBackend.cpp:284-304; src/Backends/Cubics/GeneralizedCubic.cpp:344-360, 769-800"
statement = "PC-SAFT dispersion energy e_ij = sqrt(u_i*u_j)*(1 - (kij + kijT*T)), zero for like ions; association energy and volume combine by arithmetic and geometric means; terms switch on when the parameter is nonzero. Cubic a_ij = (1 - kij)*sqrt(a_i*a_j) with kij symmetric and 0 by default; SRK and PR constants are given as exact irrational expressions (Bell and Deiters 2021)."
scope = "PC-SAFT and cubic records"

[[convention]]
name = "configuration keys that change results"
locator = "include/CoolProp/detail/configuration_keys.h"
statement = "NORMALIZE_GAS_CONSTANTS (default true), R_U_CODATA, DONT_CHECK_PROPERTY_LIMITS (default false), OVERWRITE_FLUIDS, OVERWRITE_BINARY_INTERACTION, OVERWRITE_DEPARTURE_FUNCTION (default false; duplicates then raise errors), HENRYS_LAW_TO_GENERATE_VLE_GUESSES, SPINODAL_MINIMUM_DELTA, PHASE_ENVELOPE_STARTING_PRESSURE_PA, VTPR_UNIFAC_PATH, ALTERNATIVE_REFPROP_PATH; results of a calculation depend on the values of these global switches, which are not recorded in any data file."
scope = "library behaviour"

