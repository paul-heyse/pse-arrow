[[convention]]
name = "gas constant"
locator = "dev/fluids/*.json#/EOS/<i>/gas_constant; include/CoolProp/detail/configuration_keys.h:11 and :49; HelmholtzEOSMixtureBackend.cpp:599-614"
statement = "The gas constant is a per-equation data field (J/mol/K, 10 distinct values over 159 entries, for example 8.314472 in 77 entries and 8.314462618 in 15). For mixtures the library returns the CODATA value in the R_U_CODATA configuration key (8.31446261815324) when NORMALIZE_GAS_CONSTANTS is true (the default), otherwise the mole-fraction average of the component values. Cubic and transformed fluids use R_U_CODATA, or a hard-coded 8.3144598 when a cubic is derived from a Helmholtz fluid's reducing state; humid air uses 8.314472 and 8.314510 as inline constants."
scope = "EOS entries, multifluid mixtures, cubic records, transformed fluids, humid air"

[[convention]]
name = "units and basis of thermodynamic data"
locator = "dev/fluids/*.json (all *_units keys); dev/cubics/cubic_fluids_schema.json; dev/pcsaft/pcsaft_fluids_schema.json"
statement = "Fluid JSON numbers are SI on a molar basis, confirmed by the _units siblings (T K in 1053 of 1053 occurrences, p Pa, rhomolar mol/m^3, hmolar J/mol, smolar J/mol/K, molar_mass kg/mol, gas_constant J/mol/K, T_max K, p_max Pa, acentric '-'); ancillary and melting-line fields carry units only in a few keys (max_abs_error_units, _note), the rest inferred. Exceptions: conductivity residual reducing density is in kg/m^3 (rhomass_reducing_units), sigma_eta and q_D are in m, dipole moment in Debye, PC-SAFT sigma in Angstrom and uAB in K, incompressibles and IF97 are mass based."
scope = "all fluid JSON constructs, cubic and PC-SAFT records, transport blocks"

[[convention]]
name = "temperature scale"
locator = "whole tree (keyword search for ITS-90, IPTS-68, temperature scale in src, include, dev, README.md found nothing)"
statement = "not stated: no file, schema or source comment names the temperature scale (ITS-90 or other)."
scope = "every temperature field"

[[convention]]
name = "reduced variables and reducing state"
locator = "include/CoolProp/fluids/Helmholtz.h:182-183; dev/fluids/*.json#/EOS/<i>/STATES/reducing"
statement = "tau = T_red/T and delta = rho/rho_red with T_red, rho_red from EOS/STATES/reducing; alpha0 and alphar are dimensionless Helmholtz energies divided by R*T. For mixtures T_red and rho_red come from the composition-dependent reducing function. Pure-fluid reducing values can differ from critical values (9 entries differ in temperature, 13 in density)."
scope = "all Helmholtz terms and ancillaries with using_tau_r (whose T_r is the curve's own reducing temperature)"

[[convention]]
name = "enthalpy and entropy reference encoding"
locator = "include/CoolProp/fluids/Helmholtz.h:926-975; src/CoolProp.cpp:951-1040 (set_reference_stateS, set_reference_stateD); FluidLibrary.cpp:64-127"
statement = "The zero of enthalpy and entropy is carried by the alpha0 terms a1 + a2*tau (Lead plus the EnthalpyEntropyOffset term). The library adds a run-time offset (separate from the JSON 'core' offset) computed as delta_a1 = delta_s/(R/M) and delta_a2 = -delta_h/((R/M)*T_red) (mass basis in set_reference_stateS, molar in set_reference_stateD), and then recomputes the stored hs_anchor, reducing, critical, triple and max-saturation h and s."
scope = "every EOS entry; every stored hmolar and smolar; hL, hLV, sL, sLV ancillaries (relative to hs_anchor)"

[[convention]]
name = "named reference states"
locator = "src/CoolProp.cpp:971-1022"
statement = "IIR: saturated liquid at 273.15 K has h = 200 kJ/kg and s = 1 kJ/(kg K); ASHRAE: saturated liquid at 233.15 K has h = 0 and s = 0; NBP: saturated liquid at 101325 Pa has h = 0 and s = 0; DEF: return to the source equation's own reference; RESET: clear the offset; custom: a user state given by (T, rho, h0, s0). JSON labels NBP (35 entries) and IIR (31) name the state the stored offset realises; OTH (4) and CUSTOM (1) are not defined in the pinned source."
scope = "EnthalpyEntropyOffset terms and the run-time reference-state setter"

[[convention]]
name = "default energy reference of entries without an offset term"
locator = "dev/fluids/*.json (88 of 159 EOS entries have no EnthalpyEntropyOffset term)"
statement = "not stated: the zero of h and s for these entries is whatever the source equation's alpha0 (Lead a1, a2 and CP0 anchors) produces; the file names no state."
scope = "88 EOS entries"

[[convention]]
name = "binary pair orientation and keying"
locator = "src/Backends/Helmholtz/MixtureParameters.cpp:116-175 and :556-640; PCSAFTLibrary.cpp:330-392"
statement = "Multifluid pairs are keyed by the lexically sorted pair of CAS strings; when the file order differs from the sorted order the loader swaps names and inverts betaT and betaV while gamma, xi, zeta and F are invariant; at use, the orientation of (i, j) relative to the sorted pair decides whether beta is inverted. PC-SAFT pairs are found in either order without inversion. A missing pair is an error."
scope = "binary pair records (both families)"

[[convention]]
name = "composition basis"
locator = "dev/mixtures/predefined_mixtures.json; dev/mixtures/ASHRAE_predefined_2026.tsv; dev/incompressible_liquids/json/*.json#/xid"
statement = "Mixture parameters and predefined mixtures use mole fractions; ASHRAE source compositions are mass percent and are converted with CoolProp molar masses; incompressible solutions state their basis in xid (mass or volume fraction) with pure fluids marked pure; no mole-fraction incompressible record exists."
scope = "mixtures, predefined mixtures, incompressible records"

[[convention]]
name = "sign and orientation conventions inside term lists"
locator = "src/Backends/Helmholtz/Fluids/FluidLibrary.h:218-250; src/Helmholtz.cpp:629-660; include/CoolProp/fluids/Helmholtz.h:156-162"
statement = "The Gaussian term has a minus sign before eta*(delta-epsilon)^2 while the GaoB term has a plus sign (stored eta negative); the Planck-Einstein term stores t positive and the loader negates it while the generalised Planck-Einstein term is used as stored; PlanckEinsteinFunctionT derives theta = -v/Tcrit; Aly-Lee conversion maps sinh and cosh to d = -1 and d = +1. Field names (eta, beta, gamma) repeat across term types with different meanings."
scope = "residual and ideal term constructs"

[[convention]]
