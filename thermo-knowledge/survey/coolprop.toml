# ---------------------------------------------------------------------------
# CONSTRUCTS: fluid JSON (identity, EOS container, states, limits)
# ---------------------------------------------------------------------------

[[construct]]
name = "fluid record"
locator = "dev/fluids/*.json#/ (top level); loader src/Backends/Helmholtz/Fluids/FluidLibrary.cpp:150 add_one"
meaning = "One pure or pseudo-pure fluid: identifiers (INFO), one or two Helmholtz equation-of-state entries (EOS), critical and triple states (STATES), saturation, melting and surface-tension curves (ANCILLARIES) and optional viscosity and conductivity models (TRANSPORT)."
subject = "One compound or one pseudo-pure mixture. Keyed by INFO/CAS (for the 6 pseudo-pure fluids the CAS slot holds a REFPROP file name such as AIR.PPF) and by INFO/NAME; the file name equals INFO/NAME in 135 of 136 files."
fields = [
  { name = "INFO", meaning = "identifiers and environmental data of the fluid", unit = "not applicable (record)", shape = "table" },
  { name = "EOS", meaning = "list of equation-of-state entries; only element 0 is used by the loader at run time", unit = "not applicable (record)", shape = "list" },
  { name = "STATES", meaning = "critical, triple_liquid and triple_vapor state points of the fluid", unit = "per-field *_units siblings", shape = "table" },
  { name = "ANCILLARIES", meaning = "auxiliary curves: saturation, melting line, surface tension", unit = "see ancillary constructs", shape = "table" },
  { name = "TRANSPORT", meaning = "viscosity and conductivity models; absent in 70 fluids", unit = "see transport constructs", shape = "table" },
]
conventions = "SI on a molar basis for thermodynamic fields (K, Pa, mol/m^3, J/mol, J/mol/K, kg/mol) as stated by the _units siblings; enthalpy and entropy of every stored state depend on the ideal-gas offset encoded in EOS alpha0; no temperature-scale statement anywhere."
absence = "A missing TRANSPORT block means no transport model (the loader then estimates only the Lennard-Jones-like parameters by a Chung-type rule, FluidLibrary.h:1005); a missing ANCILLARIES member (for example melting_line in 106 fluids) means the curve is not available; the loader distinguishes missing from zero only through these presence tests."
validity = "EOS-level T_max, p_max and lower temperature given by the minimum saturation state; ancillaries carry their own Tmin and Tmax."
provenance = "BibTeX keys per EOS (BibTeX_EOS, BibTeX_CP0), per melting line, surface tension and transport model; no fluid-level citation and no licence field."
count = "136 files"
example = "dev/fluids/1-Butene.json"
candidate = "species_form plus model_assembly (pure Helmholtz assembly with subform slots for the ideal part and additive residual terms) with parameter_set rows per slot group, envelope, auxiliary_relation rows and value records"
precision = "broader"
loss = "The container mixes identity, several parameter sets, conventions, limits and derived values; a mapping has to split it, and the link between values derived from the EOS (STATES p, h, s, hs_anchor) and the parameter sets they were computed from has to be rebuilt as derivations."

[[construct]]
name = "INFO (identifiers)"
locator = "dev/fluids/*.json#/INFO; loader FluidLibrary.cpp:163-230"
meaning = "Names and structure identifiers of a fluid: NAME, CAS, REFPROP_NAME, ALIASES, FORMULA, INCHI_STRING, INCHI_KEY, SMILES, CHEMSPIDER_ID, 2DPNG_URL."
subject = "One fluid; keys the library: loader builds a lookup from CAS, NAME, upper-case NAME and every alias (upper-cased too); a repeated identifier replaces the entry only when OVERWRITE_FLUIDS is set."
fields = [
  { name = "NAME", meaning = "primary name, unique per fluid", unit = "not applicable (text)", shape = "scalar" },
  { name = "CAS", meaning = "CAS registry number, or a REFPROP file name for pseudo-pure fluids (AIR.PPF, R404A.PPF, R407C.PPF, R410A.PPF, R507A.PPF, SES36.ppf)", unit = "not applicable (text)", shape = "scalar" },
  { name = "REFPROP_NAME", meaning = "name of the REFPROP fluid file; the value N/A occurs on several fluids", unit = "not applicable (text)", shape = "scalar" },
  { name = "ALIASES", meaning = "alternative names; 0 to 8 per fluid (20 fluids have none), scheme not stated", unit = "not applicable (text)", shape = "list" },
  { name = "FORMULA", meaning = "molecular formula in a LaTeX-like subscript notation, for example C_{4}H_{8}; present in 126 fluids", unit = "not applicable (text)", shape = "scalar" },
  { name = "INCHI_STRING", meaning = "InChI string; present in 126 fluids", unit = "not applicable (text)", shape = "scalar" },
  { name = "INCHI_KEY", meaning = "InChIKey; present in 126 fluids", unit = "not applicable (text)", shape = "scalar" },
  { name = "SMILES", meaning = "SMILES string; present in 126 fluids", unit = "not applicable (text)", shape = "scalar" },
  { name = "CHEMSPIDER_ID", meaning = "ChemSpider integer identifier; present in 126 fluids", unit = "not applicable (integer id)", shape = "scalar" },
  { name = "2DPNG_URL", meaning = "URL of a structure image on chemspider.com; present in 126 fluids", unit = "not applicable (text)", shape = "scalar" },
]
conventions = "No scheme or normalisation rule is stated for ALIASES; alias matching is case-insensitive in practice because the loader adds upper-cased copies."
absence = "Missing InChI, InChIKey, SMILES, ChemSpider id and image URL (10 fluids, for example Air) are replaced by the literal N/A or -1 inside the loader, so a consumer of the loader cannot tell absent from unknown; the JSON itself simply omits the key."
validity = "not stated"
provenance = "not stated; the identifiers come from scripts (dev/scripts/inject_InChI.py, get_molecular_formulas.py) but carry no per-value source."
count = "136 records"
example = "dev/fluids/1-Butene.json#/INFO"
candidate = "species (canonical key from structure identifier or formula) plus identity_assertion per identifier scheme (CAS, InChI, InChIKey, SMILES, ChemSpider id, REFPROP file name, alias)"
precision = "close"
loss = "The pseudo-pure fluids are mixtures identified by a file name in the CAS slot, so they need defined_mixture or pseudo_component rather than species; aliases have no declared scheme; the loader-side 'N/A' sentinels must not be imported as values."

[[construct]]
