[[construct]]
name = "fluid record (identity block)"
locator = "fluids/*.json#/ (top-level scalar keys); addon/pyUtils/datadb/compdata.py:30-47 component.__init__; src/compdata.f90:95-123 type gendatadb"
meaning = "One pure component or pseudo-component known to the library: its short identifier, names, formula, CAS number, InChI, atom-count string and molar mass."
subject = "One compound, keyed by ident (case-insensitive, at most 20 characters in Fortran); name, aliases, CAS and InChI are labels. Five entries (H2, E-H2, N-H2, O-H2, P-H2) share cas_number 1333-74-0 and InChI 1S/H2/h1H, so ident alone separates hydrogen spin isomers and the equilibrium mixture. Two entries (LJF, PSEUDO) have empty InChI."
fields = [
  { name = "ident", meaning = "short component identifier used to request the fluid (for example C1, NC6, R134a); matched case-insensitively", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "name", meaning = "upper-case full name (for example METHANE); returned by the name query when the long name is requested", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "formula", meaning = "formula string (for example C4H10O); XXX for PSEUDO", unit = "not applicable (text)", shape = "scalar", role = "unread" },
  { name = "cas_number", meaning = "CAS registry number; XXX for PSEUDO, empty for LJF", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "InChI", meaning = "InChI string without the InChI= prefix; empty in 2 files", unit = "not applicable (text)", shape = "scalar", role = "unread" },
  { name = "aliases", meaning = "1 to 4 alternative names per fluid (2 names in 56 fluids); scheme not stated", unit = "not applicable (text)", shape = "list", role = "unread" },
  { name = "mol_weight", meaning = "molar mass; 100 for PSEUDO", unit = "g/mol (stated only in the gendatadb comment in src/compdata.f90, not in the JSON)", shape = "scalar", role = "input" },
]
origin = "authored"
conventions = "Identifiers are upper-cased on input (initCompList) and compared with str_eq; ident values can be mixed case (9 of 109, for example R134a, ClF3Si). File names are long names, not idents (Methane.json holds ident C1)."
absence = "No optional fields: all 109 records carry all keys. PSEUDO and LJF use placeholder text (XXX, empty string) rather than omission; the Fortran record has no way to tell a placeholder from a value."
validity = "not applicable"
provenance = "not stated for identity fields; no ref or bib_reference key on the identity block"
count = "109 records"
example = "fluids/Methane.json#/"
candidate = "species (canonical key from InChIKey where resolved, else formula and charge) with identity_assertion rows per naming scheme (source_local ident, cas, inchi, name, formula); PSEUDO and LJF as pseudo_component (abstract_component)"
precision = "close"
loss = "The five hydrogen entries carry one structure but are distinct components (nuclear-spin isomer or equilibrium composition): the model's species identity has no spin-state attribute, so they need separate species or a declared discriminator; the InChI is written without prefix and is not an InChIKey; placeholders for PSEUDO and LJF must not be imported as identifiers."

