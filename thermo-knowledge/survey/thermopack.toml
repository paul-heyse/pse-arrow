# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "generators of pc_saft_datadb.f90, saftvrmie_datadb.f90 and solid_correlation_datadb.f90"
question = "addon/pyUtils/datadb/pc-saft.py, saftvrmie.py and solid_correlations.py read self.comp, but component.__init__ in compdata.py sets only self.fluid (fluid_file.__init__), and compdata.py eos_list lacks a comma between 'PC-SAFT' and 'SAFT-VR-MIE'. Which version of the generators produced the committed Fortran modules, whose values match the JSON exactly?"
why_it_matters = "The JSON-to-Fortran lineage cannot be reproduced from the pinned tree; the survey treats the JSON as the authored source and the Fortran as a rendering (checked equal on all compared values)."

[[question]]
about = "MC alpha selection"
question = "In cbalpha.f90 tpInitAlphaCorr the case for the MC alpha calls getAlphaTwuParamsFromDb (lines 137-138) while getAlphaMCParamsFromDb is called only inside the UMR branch for water (line 146). Is the MC table (65 sets) meant to supply the MC alpha in a normal request?"
why_it_matters = "If the TWU table is read for MC requests, the MC sets in the JSON are effectively unused and a mapping would attribute a model behaviour to the wrong parameter set."

[[question]]
about = "default requests for TWU and volume-shift sets"
question = "No TWU or volume-shift set carries the tag DEFAULT, so a default request appears to fall back to the classic alpha and to the Rackett-based shift (messages printed). Is alpha='TWU' with the default reference intended to work without naming tcPR, and what is the intended default set for PR versus SRK?"
why_it_matters = "The model needs a selection_policy for these sets; the source defines none in data, only behaviour keyed by tags."

[[question]]
about = "second ideal-gas heat capacity sets with empty ref (CO2 set 2 correlation 5, NC16 set 2 correlation 8)"
question = "getCpDBindex selects by substring of the requested name in ref; an empty ref cannot match any non-empty request. Can these two sets be selected, and which is authoritative for CO2 (API-44 set 1 or the Shomate-type set 2 with Tmax 5000)?"
why_it_matters = "Two coherent parameter sets exist for one subject and one is unreachable by name; a mapping must record both and decide precedence."

[[question]]
about = "BUTANAL heat capacity correlation 100"
question = "ideal_heat_capacity-1 of BUTANAL has correlation 100 with an all-zero array and Tmin = Tmax = 0; CPideal has no case for 100, so Cp_id is never assigned (inferred). Is this a placeholder for a pending fit?"
why_it_matters = "A fluid record exists without usable ideal-gas data; importing it would create a parameter set that evaluates to nothing."

[[question]]
about = "sublimation curve id S2 (H2S)"
question = "The H2S sublimation curve has correlation S2; the Fortran reads the fourth character of a 4-character field, which is blank for S2, and stops with 'Wrong correlation' in sublimation_pressure_correlation. Is S2 a typo for SL-2?"
why_it_matters = "One of 16 sublimation curves cannot be evaluated as written."

[[question]]
about = "unused fields in the excess-Gibbs records and the Classic rule id"
question = "interGEdatadb stores kij but get_binary_cubic_ge_db_entry and get_binary_cpa_ge_db_entry return a dummy 0, and tpSelectInteractionParameters requests the vdW kij of GE pairs (and, for CPA pairs without a CPA record, the classic SRK or PR kij) with the literal rule id Classic or classic, while every stored kijdatadb record has mruleid vdW (str_eq Classic versus vdW is false). Is the vdW kij of HV and NRTL pairs, or the CPA fallback kij, ever applied?"
why_it_matters = "The kij of the 19 GE records (for example 0.52 for C1/H2O under HV1) may never be read, so a mapping would carry a value the source does not use."

[[question]]
about = "documented multiparameter reference states"
question = "init_multiparameter and the wrapper document reference_state options DEFAULT, IIR, NBP, ASHRAE, IDGAS and TRIPLE_POINT, but every meos class inherits get_ref_state_spec_default (REF_NO_SOLVE) and no class overrides it. Are the non-default states implemented elsewhere?"
why_it_matters = "The enthalpy and entropy datum of multiparameter fluids cannot be varied in this pin although the interface suggests it; energy_reference rows must be limited to the default."

[[question]]
about = "formation enthalpy dummy 1e20"
question = "LJF, PSEUDO, R1234yf and R1234ze have reference_state enthalpy 1e20 and entropy 0; set_reference_energy applies the reference whenever sref or href is non-zero, and the 1e10 test exists only for gref in the generator. Does the dummy value reach href_int in these fluids?"
why_it_matters = "Fluids with a dummy reference may yield meaningless ideal-gas enthalpies; the model must represent 'no reference state' explicitly."

[[question]]
about = "conflicting duplicate kij records"
question = "PR_kij.json holds CO2/H2O as 0.074 (comp1 CO2) and -0.065 (comp1 H2O) both with ref Default, and NC4/NC7 as 0.0033 and 0.0074; PC-SAFT.json holds BENZENE/CO2 as 0.025 and 0.087 and CO2/TOLU as 0.026 and 0.108 under one tag; the lookup returns the last Default-tagged record. Which values are intended, and does orientation matter for cubic kij (the classic rule writes the same value to kij(i,j) and kij(j,i))?"
why_it_matters = "A symmetric canonical orientation would collapse two contradictory facts into one; the store needs to keep both and mark one as superseded."

[[question]]
about = "PC-SAFT fluids without a default set"
question = "ACETONE (one set, ref Gross2006), ACETYLENE and C2_1 (Gross2005 and Gross2005ADJQ) have no set tagged Default, so a default PC-SAFT request stops with 'The PC-SAFT parameters don't exist' (inferred). Are these meant to be used only with explicit references?"
why_it_matters = "Availability depends on the tag, not on the data alone; selection policies must be explicit."

[[question]]
about = "units of eps and beta in SAFT-VR Mie"
question = "The JSON eps of SAFT-VR Mie is multiplied by Rgas at use, so it is eps/k in K, although the datadb comment says J/mol (the PC-SAFT eps is truly J/mol); beta is about 1e-28, suggesting m3, but the comment says dimensionless. What are the intended units?"
why_it_matters = "Same field names carry different units in two model families; a wrong assumption silently scales association energies by R."

[[question]]
about = "hydrogen isomers as identity"
question = "H2, E-H2, N-H2, O-H2 and P-H2 share cas_number and InChI; are they five components (spin isomers and the equilibrium and normal mixtures) or variants of one species with different equations (MEOS for N, O and P, SAFT sets for H2)?"
why_it_matters = "The model's species identity is structure-based; the spin-state and composition distinctions have no slot."

[[question]]
about = "UNIFAC duplicate interaction rows"
question = "26 (mgi, mgj) pairs appear twice (Hansen 1991 and PSRK revisions), 25 with different values, and getUNIFACujkdbidx returns the first. Are the PSRK rows intended to be reachable under a PSRK model label?"
why_it_matters = "Two parameterisations share keys in one table and only the first is used; a mapping must separate them into distinct parameterisations."

[[question]]
about = "MBWR set numbers"
question = "mbwr32Array lists three C1 sets (SetNo 1, 2, 3) but getMBWR32index ignores SetNo and returns the first. Is there a path that selects another set?"
why_it_matters = "Coherent alternative parameter sets with no selection route."

[[question]]
about = "GERG-2008 and EOS-CG"
question = "The labels EOSCG, GERG2008 and EOSCG-GERG set the library flag to TREND, but init_trend is commented out and the pinned stubs are empty. What data and code does the TREND library provide, and which versions of GERG-2008 (2008 reducing functions) does it implement?"
why_it_matters = "A standard multifluid model is advertised but not inspectable here; it must be surveyed from its own source, not this one."

[[question]]
about = "temperature scale and rights of the data"
question = "No file states the temperature scale of the stored critical, triple and saturation data, and the fluid and binary data carry only per-set references (no licence statement for the data)."
why_it_matters = "A convention_set needs a temperature scale; provenance and rights attach to the carrier and cannot be inferred here."

[[question]]
about = "compile flags and default real kind"
question = "Compile flags (tp_optim_flags) and the top-level CMakeLists are not in the pin; the code relies on default real being 64 bit (the MSVC branch adds /real-size:64). Is -fdefault-real-8 (or equivalent) used on other platforms?"
why_it_matters = "Stored constants printed to 8 digits and Rgas comparisons (Rgas_is_correct) assume double precision."
