[[selection]]
name = "reference-name matching for pure and pair parameter sets (general mechanism)"
locator = "src/parameters.f90:31-162; src/stringmod.f90:922-994"
rule = "For a component (and equation index), the requested reference is a '/'-separated list of tags. A database record matches when any tag of the request, excluding the tag DEFAULT, equals any tag of the record's ref (case-insensitive exact match); among matches the one with the lowest position in the request wins and ties go to the first database record. If none match, the default is the last database record for that component and equation whose ref contains DEFAULT as a substring of any tag. If no default exists and the caller requires a result, pure lookups stop the program ('The ... parameters don't exist') and pair lookups return the default value (0.0 or 1.0 for LK)."
scope = "alpha (TWU, MC), volume shift, CPA pure, PC-SAFT pure, SAFT-VR Mie pure, cubic kij and lij, GE, CPA and PC-SAFT and SAFT-VR Mie pairs"
documented = "partly: docs/vCurrent documents reference names but not the list or default rule; the code comment example ('TEST/HV/DEFAULT' versus 'HV/HV0/HV1/HV2') documents the matching"

[[selection]]
name = "ideal-gas heat capacity set selection"
locator = "src/compdata_init.f90:48-83 getCpDBindex; src/compdata.f90:212-219 isRef"
rule = "The first record of the component whose ref contains the requested name as a substring (Fortran index of the request in the record's ref, case-sensitive) is returned; otherwise the last record whose ref contains the literal 'Default' (capital D, lower-case rest) is used; with no default the lookup fails. The initialisation passes the requested name DEFAULT in upper case, so the default branch is what runs unless a specific tag is requested."
scope = "construct 'ideal_heat_capacity-N'"
documented = "no: the two sets with an empty ref (second sets of CO2 and NC16) cannot be reached by a non-empty requested name (inferred from the substring test); docs/vCurrent/new_fluids.md describes selection only by the correlation key of the first set"

[[selection]]
name = "alpha and volume-shift defaults (absence of a DEFAULT tag)"
locator = "src/cbalpha.f90:85-182; src/volume_shift.f90:33-76; src/compdatadb.f90 (refs)"
rule = "TWU and volume-shift sets carry model tags (tcPR, tcRK, Aasen2024, QuantumCubic, tcPR-ENGINEERING) and none contains DEFAULT, so with the default request nothing is selected: the alpha falls back to the classic acentric-factor alpha with a printed message, and the volume shift falls back to the Rackett estimate. The TWU set is selected only when the request names its tag, which init_cubic arranges for tcPR (alpha TWU and volume shift forced on) and QuantumCubic. MC sets: some carry Default (14 PR, 11 SRK), others Chapoy2005 (20 and 20). The MC alpha request reads the TWU table (inferred from the code) and the MC table is reached only through the UMR alpha for water."
scope = "cubic alpha and volume translation"
documented = "partly: cubic_keys.md lists the alpha keys TWU and MC; it does not say that default requests fall back to the classic alpha"

[[selection]]
name = "reference tags that change model behaviour"
locator = "src/eoslibinit.f90:339-342 (tcPR), 349-386 (QuantumCubic), 504-525 (init_tcPR, init_quantum_cubic), 1007-1046 (quantum SAFT-VR Mie defaults), 1117 (PC-SAFT polar default)"
rule = "A requested reference containing tcPR switches the cubic alpha to TWU and turns volume translation on; QuantumCubic additionally switches beta(T) to the quantum correlation and overwrites critical constants; init_tcPR builds the list 'tcPR/DEFAULT' and init_quantum_cubic 'QuantumCubic/tcPR/DEFAULT'; polar PC-SAFT with default reference requests 'Gross2005/Gross2006'; quantum SAFT-VR Mie with default reference requests AASEN2019-FH0, -FH1 or -FH2 according to the order."
scope = "cubic, PC-SAFT polar, SAFT-VR Mie quantum"
documented = "yes for tcPR and QuantumCubic (init docstrings); not stated in the data files"

[[selection]]
name = "CPA kij and fallback to the cubic pair database"
locator = "src/cpa_parameters.f90:222-330; src/cbselect.f90:385-398"
rule = "CPA kij_a is looked up with an empty reference, so only the DEFAULT-tagged CPA pair record can match; if none exists for a CPA-SRK or CPA-PR pair, the classic SRK or PR kij database is consulted (with the requested reference) through getkij with the literal rule id classic, which is not equal to the stored id vdW, so as read the lookup matches no record and yields 0.0 (inferred from get_binary_db_idx); kij_eps and kij_beta default to 0 and the combining rules default to arithmetic eps and geometric beta for CPA-SRK, geometric for both for CPA-PR."
scope = "CPA pair data"
documented = "no"

[[selection]]
name = "pair parameters: missing records and conflicting duplicates"
locator = "src/parameters.f90:84-162; src/pc_saft_parameters.f90:68-160; src/saftvrmie_parameters.f90:72-112; src/cbselect.f90:518-628"
rule = "A pair is matched in either orientation. kij and lij default to 0.0 (1.0 for LK), PC-SAFT and SAFT-VR Mie kij to 0.0 and combining rules to a hard-coded default; GE parameters stay zero with correlation 0. When several records match with the same rank the first wins, but the default fallback takes the last Default-tagged record, which decides conflicting duplicates under the tag Default (for CO2/H2O in PR_kij the later record, -0.065; for BENZENE/CO2 in the PC-SAFT file, 0.087)."
scope = "binary constructs"
documented = "partly: the routine comment states that a default value is returned when no pair is stored"

[[selection]]
name = "parameter availability stops (no fallback)"
locator = "src/pc_saft_parameters.f90:54-63; src/saftvrmie_parameters.f90:140-175; src/parameters.f90:67-81"
rule = "If a PC-SAFT, SAFT-VR Mie or CPA pure set is absent for a component and no DEFAULT-tagged set exists, pure lookups that demand a result stop the program with an error. Three PC-SAFT fluids (ACETONE with one set; ACETYLENE and C2_1 with two sets) have no DEFAULT-tagged set, so a default request for them stops (inferred from the data and the rule)."
scope = "PC-SAFT, SAFT-VR Mie, CPA pure sets"
documented = "no"

[[selection]]
name = "component lookup in hand-maintained modules (MBWR, UNIFAC)"
locator = "src/mbwrdata.f90:1475-1514; src/unifac.f90:197-235"
rule = "MBWR: the first record whose ComId equals the requested component (case-insensitive) is used and SetNo is ignored, so the second and third C1 MBWR-32 sets are unreachable (inferred). UNIFAC: a component is matched by exact case-sensitive equality of uid; the interaction row is the first match on (mgi, mgj), which makes the PSRK rows that duplicate a Hansen pair unreachable (inferred)."
scope = "MBWR and UNIFAC data"
documented = "no"

