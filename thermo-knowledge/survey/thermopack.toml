# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units of inputs, outputs and stored data"
locator = "docs/vCurrent/getting_started.md (Doing calculations); src/compdata.f90 type comments; src/extcsp.f90:8-9"
statement = "The Python and Fortran interfaces are in SI: K, Pa, m3, mol, J, molar volume in m3/mol. Stored data do not follow one system: fluid mol_weight is in g/mol, dipole in D, quadrupole in Angstrom*D, CPA a0 in Pa L^2/mol^2 and b in L/mol, cubic internals use L/mol and kRgas in J/kmol/K, extended corresponding states use mol/L and L/mol internally, ideal heat capacity arrays carry unit systems that depend on the correlation id, and the Antoine constants are for mmHg. Heat capacities are not returned directly; they are derivatives of enthalpy."
scope = "all constructs and the public interface"

[[convention]]
name = "gas constant"
locator = "src/thermopack_constants.f90:7-10; src/multiparameter_c3.f90:100; multiparameter_r134a.f90:83; idealh2.f90:52; co2_gibbs.f90:19; addon/pyUtils/datadb/entropy.py:2; src/pc_saft_parameters.f90:19-23; src/saftvrmie_parameters.f90:256"
statement = "The library gas constant is Rgas_default = N_Avogadro * kB_const with kB = 1.380649e-23 and N_A = 6.02214076e23 (exact SI values, 8.314462618...). Other values appear: 8.314472 (propane and hydrogen-isomer equations, CO2 solid), 8.314471 (R134a), 8.3144772 (hydrogen ideal routines, commented as the value NIST used in the fit), 8.31446261815324 (entropy.py). PC-SAFT eps is stored in J/mol with R applied at generation time and the code aborts unless Rgas equals Rgas_default; SAFT-VR Mie eps is stored over k and multiplied by the active Rgas at use. A multiparameter equation uses Rgas_default when embedded, its fitted value only on request. The default real kind is assumed 64 bit (inferred from the MSVC flag)."
scope = "PC-SAFT and SAFT-VR Mie association energies, multiparameter equations, solid equations, ideal-gas reference energies"

[[convention]]
name = "reference state of ideal-gas enthalpy and entropy"
locator = "src/ideal.f90:1133-1312; addon/pyUtils/datadb/compdata.py:55-67 and entropy.py; fluids/*.json#/reference_state"
statement = "At 298.15 K, the ideal-gas enthalpy equals href (enthalpy of formation) and the ideal-gas entropy at 1 bar (or 1 atm as named by entropy_ref_state, converted by R ln(1.01325)) equals sref (absolute entropy); href_int and sref_int store the offsets. The entropy is applied only when sref or href is non-zero. gref (Gibbs energy of formation) is computed at generation from the formation enthalpy, entropy and tabulated element entropies and is not read at run time. Residual properties of the equations of state are added on top of this ideal reference. Multiparameter equations of the NIST type bring their own reference and ignore these values unless a reference option is applied (only DEFAULT is implemented)."
scope = "all models based on the pure-component record"

[[convention]]
name = "temperature scale"
locator = "whole tree (keyword search for ITS-90, IPTS-68, temperature scale in src, addon, docs found no statement)"
statement = "not stated: no file names the temperature scale."
scope = "all temperature values"

[[convention]]
name = "composition basis and phase identifiers"
locator = "src/thermopack_constants.f90:22-26; docs/vCurrent/phase_flags.md; src/apparent_composition.f90"
statement = "Composition is by mole fraction or mole number in the public interface. Phase flags are TWOPH 0, LIQPH 1, VAPPH 2, MINGIBBSPH 3, SINGLEPH 4, SOLIDPH 5, FAKEPH 6, VAPSOLPH 7 (the documentation lists 0 to 6). An apparent composition approach maps apparent to true species for reactive and electrolyte systems."
scope = "flash and property interfaces"

[[convention]]
name = "identifier handling and pair symmetry"
locator = "src/compdata.f90:196-232; src/stringmod.f90:825-842 str_eq; src/parameters.f90:84-162; src/cbselect.f90:343-408"
statement = "Component idents are uppercased on input and compared case-insensitively; ident is at most 20 characters, ref 40, bib_ref 100, component name 40. Binary parameters are found in either orientation (kij and lij symmetric, written to both kij(i,j) and kij(j,i) for the classic rule; the Reid rule is directional); excess-Gibbs records hold both directions and are swapped on read. The pair key names differ between files (comp1 and comp2 in cubic, LK, GE, lij and CPA files; uid1 and uid2 in PC-SAFT and SAFT-VR Mie files)."
scope = "all binary constructs"

[[convention]]
name = "numeric precision of the generated Fortran modules"
locator = "addon/pyUtils/datadb/compdata.py:95-129 and cp/alpha/VS generators; src/compdatadb.f90"
statement = "Generated constants are printed with fixed formats: mw, Tb, Ttr, Ptr, sref and Tc with 4 decimals, Pc 2, Zc and acf 6, others in exponent form with 8 decimals; binary kij values use 8 decimals. Values are therefore rounded copies of the JSON."
scope = "src/compdatadb.f90, src/mixdatadb.f90"

[[convention]]
name = "zero and dummy sentinels"
locator = "fluids/*.json (triple, saturation, reference_state, PSEUDO); addon/pyUtils/datadb/entropy.py:47-49"
statement = "Absent information is expressed as values: 0.0 for unknown triple point, acentric factor, dipole moment, quadrupole moment and unused saturation parameters; 1e20 for unavailable formation enthalpy (the generator treats values above 1e10 as unavailable only for gref, giving 1e11); an empty string for unknown ref or bib_reference; text placeholders XXX and PSEUDO for identifiers. The runtime does not apply a uniform rule."
scope = "fluid JSON constructs"

[[convention]]
name = "association parameter conventions"
locator = "src/pc_saft_parameters.f90:1-8; src/compdata.f90:85; src/saftvrmie_datadb.f90 type comments"
statement = "Authors differ on whether the association volume beta includes a factor pi/6 (module header warning: try multiplying by pi/6 = 0.5236 if results look wrong); CPA eps may be tabulated as eps/R elsewhere (comment); the combination rule for cross association energy and volume is 1 arithmetic, 0 geometric or 2 default (hard-coded); association schemes are named 1, 2A, 2B, 2C, 3A, 3B, 4A, 4B, 4C, 1EA with no self-association indicated by NONE or None."
scope = "CPA, PC-SAFT, SAFT-VR Mie association parameters"

[[convention]]
name = "ideal heat capacity correlation units and temperature limits"
locator = "src/ideal.f90:1-41 and 203-309; docs/vCurrent/new_fluids.md"
statement = "The unit of the coefficients, and whether Cp is per mole or per mass, depend on the id: ids 1 (cal/(mol K)), 2 (per mass, unit not stated), 5 and 6 (kJ/(kg K)); ids 2, 5 and 6 are multiplied by the molar mass in g/mol, 4, 9, 12 (J/(mol K), id 12 in T/1000), 7 (J/(kmol K)), 8 and 13 (units of R). For id 2 the limits Tmin and Tmax are degrees Celsius while the model temperature is in K (the code adds 273.15); for id 7 they are in K. Only ids 2 and 7 read Tmin and Tmax, and only to print a message."
scope = "construct 'ideal_heat_capacity-N'"

[[convention]]
name = "technical memos under docs/memo (one line each)"
locator = "docs/memo/*/*.tex"
statement = "apparent: apparent-composition approach and its differentials; binaryXY: binary Txy and Pxy algorithms; CPA: cubic-plus-association theory and the Q function; critical: stability limit and critical-point equations in T and P and T and V; envelopes: phase-envelope tracing; flash: algorithms for TP, PH, PS, UV flashes and solid phases; hyperdual: hyperdual number arithmetic; intro: basic thermodynamics and potentials; leekesler: Lee-Kesler implementation and modification tests; PC-SAFT: derivatives to second order; peneloux: volume shift for generic equations; SAFT-VR-Mie: the model and derivatives; SPUNG: MBWR and extended corresponding-state implementation; thermopack (2013): overview of the workbench; truncation_correction: corrections to equations of state for truncated potentials; UNIFAC: excess Gibbs mixing rules; user_guide: phase keys and usage; WongSandler: infinite-pressure limits and derivatives. Only the memos define symbols and working equations; they are not versioned with the code."
scope = "model families"

