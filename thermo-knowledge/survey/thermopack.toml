source = "thermopack"
pin = "ca75d8e095e8"
surveyed = "2026-09-30"
summary = "ThermoPack v2.2.4 (Fortran core, Python wrapper) contributes 109 pure-fluid JSON records (identity, scalar constants, ideal-gas heat capacity, cubic alpha and volume-translation sets, CPA, PC-SAFT and SAFT-VR Mie sets, melting and sublimation curves) and 12 binary files (827 pair records) compiled into generated Fortran modules, plus hand-maintained UNIFAC (117 subgroups, 1603 interaction rows) and MBWR (65 sets) modules, inline multiparameter, solid and LJ constants, and 28 labelled equation-of-state models with the flash, saturation, envelope, critical, stability, spinodal and solid-fluid algorithms around them. It bundles no hydrate model, no GERG-2008 or EOS-CG code (an external TREND library not in the pin), no transport properties and no regression or speciation driver, and several documented selection options are not implemented in the pinned code (see questions)."

