# ---------------------------------------------------------------------------

[[payload]]
paths = ["fluids/*.json"]
format = "JSON, one object per fluid (indent 2, LF, no BOM, ASCII except two files); top-level keys ident, formula, cas_number, InChI, structure, name, aliases, mol_weight, critical, triple, acentric_factor, boiling_temperature, saturation, ideal_heat_capacity-N, reference_state, rackett_factor, dipole_moment, quadrupole_moment in all 109; optional blocks PR and SRK (108 each, each a dict of named parameter sets), PC-SAFT-N (77 blocks in 50 fluids), SAFTVRMIE-N (77 blocks in 32 fluids), melting_curve (23), sublimation_curve (16); no schema file exists; the numeric suffix N of a repeated block name is arbitrary and the generator matches blocks by substring of the key"
files = 109
bytes = 340876
records = "109 fluid objects, counted by json.load of every file; parameter-set counts: ideal_heat_capacity 111, PR/TWU 100, SRK/TWU 92, PR/MC 34, SRK/MC 31, PR/volume_shift 99, SRK/volume_shift 92, SRK/CPA 25, PC-SAFT 77, SAFTVRMIE 77, melting_curve 23, sublimation_curve 16 (all by json.load and key-prefix counting)"
reader = "no reader in the compiled library; the generator scripts addon/pyUtils/datadb/compdata.py (class comp_list, component via fluid_file.fluid_file.__init__ in fluid_file.py), pc-saft.py, saftvrmie.py and solid_correlations.py read it with json.load and write the Fortran data modules; a plain JSON parser reads every file"
read_by_source = "partly"
notes = "The library never reads these files at run time; only the generators do. The generator ignores aliases, InChI, and every bib_reference of the scalar blocks (critical, acentric_factor, boiling_temperature, triple, rackett_factor, dipole_moment, quadrupole_moment, saturation, reference_state) because the gendatadb record has no attribution fields (the ref line is commented out at compdata.py:105); cas_number is used only for the generated wiki table; the alpha (TWU, MC) bib_reference is dropped because alphadatadb has no bib field. 77 sets of each of PC-SAFT and SAFT-VR Mie, all 25 CPA sets, all 99+92 volume-shift sets, 111 heat-capacity sets and 39 solid-curve sets were compared with the generated Fortran values (relative tolerance 1e-6) and all match, so the JSON and the Fortran are in step at this pin. Two files (Methane.json, n-Decane.json) contain non-ASCII characters. Numeric spellings mix int and float for the same quantity (critical/temperature is int in 1 file, mol_weight int in 1, triple/pressure int in 1)."

[[payload]]
paths = ["binaries/*.json"]
format = "JSON, one object per file whose keys are record names made of a prefix and a number (vdW-N, LK-N, LIJ-N, HV1-N, HV2-N, NRTL-N, CPA-N, KIJ-N); the prefix is read by the generator to choose the record type (vdW or LK, LIJ, CPA, else excess-Gibbs); the eos is taken from the file name up to the first underscore (PR, SRK, CSP-PR, CSP-SRK, LK, PT) or from an eos field (CPA.json, PC-SAFT.json, SAFTVRMIE.json); no schema file"
files = 12
bytes = 124443
records = "827 records, counted by json.load: CPA 12, CSP-PR_kij 69, CSP-SRK_kij 86, LK_kij 123, PC-SAFT 34, PR_GE 2, PR_kij 289, PR_lij 3, PT_kij 31, SAFTVRMIE 30 (18 KIJ and 12 LIJ), SRK_GE 17, SRK_kij 131; the Fortran modules hold 763 (mixdatadb) + 34 + 30 = 827 records, so none is dropped"
reader = "generator scripts addon/pyUtils/datadb/binarydata.py (class binary_list, binaries) with subclasses in pc-saft.py and saftvrmie.py; not read by the compiled library"
read_by_source = "partly"
notes = "Cubic, LK, GE and lij files key a pair by comp1 and comp2; PC-SAFT.json and SAFTVRMIE.json key it by uid1 and uid2; CPA.json by comp1 and comp2 plus an eos field. Pairs are stored in arbitrary orientation (for example 182 of 289 PR_kij records have comp1 < comp2 lexically); a pair can occur several times in one file with different ref values, and PR_kij holds one pair in both orientations with different values under the same ref (CO2/H2O 0.074 and H2O/CO2 -0.065). The GE files carry a kij field that no Fortran routine reads; PR_lij.json carries a mixing_rule field that the generator ignores (it writes vdW). Component identifiers are matched case-insensitively against the fluid ident; CSP-PR and CSP-SRK name R113 and R13B, and SRK_GE names the ions NA+ and CL-, none of which has a fluid record."

