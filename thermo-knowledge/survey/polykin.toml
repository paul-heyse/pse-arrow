# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "provenance of the Tait table"
question = "Tait_parameters.tsv has no per-row citation and the class docstring cites only the Handbook of polymer solution thermodynamics; which table or publication gave each polymer row, and do the Tmin, Tmax, Pmin, Pmax columns record the fitted data range or the recommended range?"
why_it_matters = "The envelope kind (fitted or recommended range) and the attribution of each parameter set cannot be recorded without it."

[[question]]
about = "basis of the Flory-Huggins chi"
question = "FloryHuggins accepts volume, mass or segment fractions, states that chi must match the variable, and stores neither; how should a parameterisation record the basis and the reference molar volume or segment definition?"
why_it_matters = "Two chi values that differ by basis are different parameters; the model cannot tell them apart."

[[question]]
about = "meaning of the PolyNRTL size factors s and the composition matrix F"
question = "polynrtl.py defines s (default ones, length Ns + Nru) and F (Np x Nru) but the class is unfinished; what does a value of s different from 1 represent and is F a count per chain or a mole fraction of repeating units?"
why_it_matters = "It determines whether a polymer is a type (repeat-unit counts) or a sample (degree of polymerization)."

[[question]]
about = "Wesslau distribution"
question = "The tree has no Wesslau name; does the log-normal class with mu = ln(DPn/sqrt(PDI)) correspond to the Wesslau form used in the literature?"
why_it_matters = "A distribution family mapping by name would miss the equivalence."

[[question]]
about = "units of Vrentas-Duda K11 and K12"
question = "The docstring writes K11 and K12 as [L3/M/K] and D0 as [L2/T] with generic length, mass and time placeholders chosen through the unit argument; which unit system do the docstring example values (cm2/s, g, cm3) assume and are the K21 and K22 values in K?"
why_it_matters = "Quantity types need concrete units; the source leaves them to the caller."
