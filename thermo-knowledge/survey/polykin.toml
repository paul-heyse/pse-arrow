# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units and constants"
locator = "src/polykin/constants.py; docstrings throughout"
statement = "SI units: T in K (many methods also take a Tunit of 'C' or 'K'), P in Pa (Punit 'bar', 'MPa', 'Pa' in some), molar volume in m3/mol, specific volume in m3/kg, viscosity in Pa s. The gas constant, Boltzmann, Avogadro and Planck constants and g are re-exported from scipy.constants under short names (R, kB, NA, h, g), so their values follow the installed SciPy."
scope = "all models"

[[convention]]
name = "composition bases by model"
locator = "src/polykin/thermo/acm/*.py; properties/*; copolymerization/*; distributions/*"
statement = "Molecular activity models, EoS and flash solvers use mole fractions. Flory-Huggins uses volume, mass or segment fractions phi and a size m per component, and the variable must be the one used to fit chi. PolymerACM takes segment-based mole fractions with degree of polymerization and a repeating-unit composition matrix. Vrentas-Duda uses solvent mass fraction. Scatchard-Hildebrand derives volume fractions from mole fractions and molar volumes. Li liquid conductivity mixing uses mass fractions with densities. Copolymerization uses molar fractions of monomer f and of repeating units F. Distributions are number pdfs of chain length with optional mass and gpc weightings."
scope = "all models"

[[convention]]
name = "chain-length and moment definitions"
locator = "src/polykin/distributions/base.py"
statement = "Chain length k starts at 1. The chain-length moment of order n of the number distribution is mu_n; the molar-mass moment is mu_n M0^n; DPn = mu1/mu0, DPw = mu2/mu1, DPz = mu3/mu2, Mn, Mw, Mz likewise, PDI = Mw/Mn, M0 = Mn/DPn. kind 'number', 'mass', 'gpc' multiply the number pdf by k^0, k^1, k^2 and normalise by the corresponding moment."
scope = "distribution classes"

[[convention]]
name = "Aspen Plus temperature functions"
locator = "src/polykin/thermo/acm/*.py class docstrings"
statement = "Activity-model parameters are coefficient matrices of an empirical temperature function 'as used in Aspen Plus' (for example chi = a + b/T + c ln T + d T + e T^2; ln Lambda and ln tau with four terms; NRTL tau with four terms and alpha linear in T - 273.15); the same letter denotes different terms in different classes."
scope = "activity models"

[[convention]]
name = "reactivity ratio and Tait conventions"
locator = "src/polykin/copolymerization/*.py; src/polykin/properties/pvt/tait.py"
statement = "Reactivity ratios are r_ij = k_ii/k_ij (terminal r1 = k11/k12); penultimate monomer ratios r11 = k111/k112 and radical ratios s1 = k211/k111. The Tait equation uses the Celsius offset T - 273.15 in both v(T,0) and B(T)."
scope = "copolymerization and Tait"

