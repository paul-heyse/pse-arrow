# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "src/polykin/distributions/analyticaldistributions.py class SchulzZimm (docstring versus _update_internal_parameters)"
documented = "docstring: k = 1/(DPn - 1) and theta = DPn (PDI - 1)"
actual = "code: self._k = 1/(PDI - 1) and self._theta = DPn (PDI - 1)"
consequence = "For the same DPn and PDI the documented and the coded (k, theta) define different gamma distributions; which one is intended is not stated."

[[discrepancy]]
locator = "src/polykin/properties/diffusion/vrentasduda.py class VrentasDudaBinary (docstring) versus selfd"
documented = "E: activation energy [J/mol/K]"
actual = "selfd evaluates exp(-E/(R T)) with R in J/(mol K), which requires E in J/mol"
consequence = "The documented unit of E is dimensionally inconsistent with the equation."

[[discrepancy]]
locator = "README.md (Installation) versus pyproject.toml and AGENTS.md"
documented = "README: PolyKin currently runs on Python>=3.10; AGENTS.md: Python >= 3.10"
actual = "pyproject.toml: requires-python >= 3.11.0"
consequence = "The supported interpreter statements disagree; no model value is affected."

[[discrepancy]]
locator = "src/polykin/kinetics/reaction.py versus src/polykin/kinetics/__init__.py and src/polykin/utils"
documented = "reaction.py defines Species, Reaction and ReactionSystem classes for a polymerization scheme"
actual = "kinetics/__init__.py imports coefficients and emulsion only; reaction.py imports polykin.utils.types, which does not exist in the tree (the module is polykin.utils.typing), and Reaction.species() is called but not defined in the file"
consequence = "The reaction framework is neither exported nor importable as written; its semantics are not evidence of supported behaviour."

[[discrepancy]]
locator = "src/polykin/thermo/acm/polynrtl.py and base.py PolymerACM"
documented = "class docstrings describe a polymer activity model; README lists Poly-NRTL as unchecked"
actual = "polynrtl.py is not imported by thermo/acm/__init__.py; PolyNRTL.gamma calls NRTL_gamma, which is not imported in that module; PolymerACM.Dgmix, Dsmix set x = 0 with the comments 'to be done' and 'fix'; the docstring of PolyNRTL_a repeats the Flory-Huggins activity text"
consequence = "Poly-NRTL is a stub: the class is not part of the working model inventory."

[[discrepancy]]
locator = "README.md (feature list) versus src/polykin/distributions"
documented = "Weibull-Nycander-Gold listed among the distributions; Sanchez-Lacombe EoS listed with an unchecked box"
actual = "Weibull-Nycander-Gold is the function WeibullNycanderGold_pdf only, with no moments, cdf or Distribution subclass; no Sanchez-Lacombe code exists (searched the tree for 'Sanchez', 'Lacombe', 'Hartmann')"
consequence = "The distribution inventory has four analytical classes plus a pdf function; the EoS inventory has no lattice-fluid polymer equation."

