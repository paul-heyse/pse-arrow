source = "polykin"
pin = "459445c5de64"
surveyed = "2026-09-30"
summary = "PolyKin v0.8.0 (MIT) is a polymerization-kinetics and chemical-engineering library whose thermodynamic value is a model inventory in SI units: activity models (ideal, Flory-Huggins, NRTL, Wilson, UNIQUAC, Scatchard-Hildebrand, plus an unexported unfinished Poly-NRTL), gas and cubic equations of state, two-phase flash solvers that take a user K-value function, the Tait PVT equation, property and transport correlations (DIPPR, Antoine, Wagner, Yaws, Vrentas-Duda free-volume diffusivity and Reid-Prausnitz-Poling style estimators), molecular-weight distribution classes with moments, kinetic coefficient forms and copolymerization composition models. Its only data file is Tait_parameters.tsv (28 polymers); it bundles no Sanchez-Lacombe, Flory or Hartmann-Haque equation of state, no component database, and no polymer-solution viscosity or conductivity model."

# ---------------------------------------------------------------------------
# PAYLOADS
# ---------------------------------------------------------------------------

[[payload]]
paths = ["src/polykin/properties/pvt/Tait_parameters.tsv"]
format = "Whitespace-delimited text with a header line (Polymer, A0, A1, A2, B0, B1, Tmin, Tmax, Pmin, Pmax); fields are separated by a tab followed by space padding and are parsed with a regular-expression separator, not by tabs alone. ASCII, LF, scientific notation for A and B, integers for Tmin and Tmax."
files = 1
bytes = 2954
records = "28 polymer rows plus the header (29 non-empty lines), counted by splitting on whitespace"
reader = "load_PVT_parameters in src/polykin/properties/pvt/io.py (pandas.read_csv(sep=r'\\s+'), index Polymer, file name built from the class name Tait plus _parameters.tsv) called by Tait.from_database in src/polykin/properties/pvt/tait.py"
read_by_source = "all"
notes = "No units are stated in the file; the Tait class docstring states A0 in m3/kg, A1 in m3/(kg K), A2 in m3/(kg K2), B0 in Pa, B1 in 1/K, Tmin and Tmax in K, Pmin and Pmax in Pa. Polymers are keyed by short code names (BR, HDPE, LDPE, PS, PMMA, PVAC, PTFE, PDMS with numeric viscosity suffixes PDMS3 to PDMS1000, and others). The class docstring cites Danner and High, Handbook of polymer solution thermodynamics (2010), for the equation; the file has no per-row source. Pmin is 0 in 18 rows and 1.00E+05 in 10 rows; Tmin starts at 277 K and Tmax reaches 646 K over the file (measured). The universal constant C = 0.0894 is a class attribute, not a column. The constructor checks hard-coded bounds on A0, A1, A2, B0 and B1."

[[payload]]
paths = ["src/polykin/distributions/sampledata.py"]
format = "Python source holding a dict literal sample_mmd with keys size_data (500 floats from 1 to about 3.2e6), pdf_data (500 floats), kind ('gpc') and comment; a commented block records the generating code (a 0.2/0.3/0.2/0.05 mixture of four Schulz-Zimm distributions evaluated with kind gpc on a logarithmic chain-length grid)."
files = 1
bytes = 30255
records = "500 points, counted by parsing the literal with ast"
reader = "imported as polykin.distributions.sample_mmd; DataDistribution(sample_mmd['size_data'], sample_mmd['pdf_data'], kind=sample_mmd['kind'])"
read_by_source = "none"
notes = "Synthetic example data for the documentation and tutorial notebooks; the package code itself never reads it. The generating recipe is a comment, not code that runs."

