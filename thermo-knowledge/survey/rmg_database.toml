# ---------------------------------------------------------------------------
# CONSTRUCTS
# ---------------------------------------------------------------------------

[[construct]]
name = "database file framing (entry / tree / file-level variables)"
locator = "input/thermo/groups/group.py lines 1-9 and 'tree(' at line 60481; loader rmgpy/data/base.py Database.load (line 204)"
meaning = "Every .py payload is a script run by RMG with a restricted namespace: entry and tree are bound to the loader's methods, the variables name, shortDesc, longDesc (and solvent, metal, site, facet) describe the file as a whole, and the classes of the data objects (ThermoData, NASA, Arrhenius, SoluteData and so on) are injected by the calling database."
subject = "One file (one library, one family part or one group tree). Keyed by file path; library label is the file stem for thermo libraries and the directory name for kinetics libraries."
fields = [
  { name = "name", meaning = "title of the file or library", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "shortDesc", meaning = "one-line description of the file", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "longDesc", meaning = "long description, often the reference legend", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "solvent", meaning = "name of the solvent a thermo library was computed for (3 files)", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "metal, site, facet", meaning = "file-level surface defaults; none of the pinned files sets them at file level", unit = "not applicable (text)", shape = "scalar", role = "not established" },
  { name = "autoGenerated, duplicatesChecked", meaning = "kinetics-library flags: 40 libraries set autoGenerated = False and 2 set duplicatesChecked", unit = "not applicable (flag)", shape = "enum", role = "input" },
]
origin = "authored (files are hand-edited or written by RMG's save routines, which reproduce the same layout)"
conventions = "Python string literals; energies and other quantities are tuples; the file is executed, so any expression could appear, but the survey found only calls, assignments and docstring expressions (9 bare expressions in kinetics libraries, 1 in quantum_corrections, 1 in transport libraries)."
absence = "A missing shortDesc or longDesc is an empty string; metal, site and facet default to None when absent."
validity = "not stated"
provenance = "file-level longDesc text; there is no citation field at file level"
count = "742 .py files parsed without error by ast.parse"
example = "input/thermo/libraries/primaryThermoLibrary.py"
