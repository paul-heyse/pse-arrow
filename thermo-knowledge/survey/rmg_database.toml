  { name = "atomization_energy, zpe", meaning = "on 16 reference entries", unit = "kJ/mol (per the ScalarQuantity unit)", shape = "scalar", role = "input" },
  { name = "adjacency_list, smiles, inchi, inchi_key, label, charge, multiplicity, symmetry_number, formula, molecular_weight", meaning = "identity fields; inchi missing in 9 files", unit = "not applicable", shape = "scalar", role = "metadata" },
  { name = "RMG_version, datetime, index", meaning = "provenance of the file", unit = "not applicable", shape = "scalar", role = "metadata" },
]
origin = "transcribed (reference values named by source) and computed (calculated data; software and method per key)"
conventions = "Reference H298 in kJ/mol and calculated H298 in kcal/mol in the same file."
absence = "An entry with no reference or no calculated data is skipped by the loader."
validity = "298 K"
provenance = "source name per reference entry"
count = "421 species"
example = "input/reference_sets/main/111-Trichloroethane.yml"
candidate = "dataset of formation-enthalpy evidence (evidence module) with the species as component"
precision = "close"
loss = "Only H298; the level-of-theory key strings must be parsed; geometry has no construct."

# ---------------------------------------------------------------------------
# MODEL FAMILIES (data-defined; the procedures live in RMG-Py, see survey rmg_py)
# ---------------------------------------------------------------------------

[[model_family]]
name = "Benson-type group additivity data (thermo trees)"
locator = "input/thermo/groups/*.py; procedure in rmgpy/data/thermo.py (surveyed in rmg_py)"
class = "group_contribution"
inputs = "a molecular graph; temperature enters only through the 7-point heat capacity table"
parameters = "group: one ThermoData increment per tree node (6003 nodes in 10 files)"
composes = [
  { slot = "primary group", accepts = "group.py nodes matched per non-hydrogen, non-halogen atom", default = "required for every such atom" },
  { slot = "radical correction", accepts = "radical.py nodes via the hydrogen-bond-increment route", default = "applied only to radicals" },
  { slot = "ring correction", accepts = "ring.py and polycyclic.py nodes matched once per ring", default = "applied only when the molecule has a ring" },
  { slot = "interaction correction", accepts = "longDistanceInteraction_noncyclic and _cyclic nodes over atom pairs", default = "applied when a pair matches" },
  { slot = "other correction", accepts = "other.py nodes", default = "applied when an atom matches" },
  { slot = "adsorption correction", accepts = "adsorptionPt111 (default) or adsorptionLi nodes per surface site", default = "applied only to surface species" },
]
variants = [
  { selector = "", selects = "adsorption-groups setting: 'adsorptionPt111' (default), 'adsorptionLi' or a name containing 'SIDT' which switches to the decision-tree JSON files" },
  { selector = "", selects = "library order: a user list decides which libraries are tried before any group estimate" },
]
equation_source = "the node shortDesc texts name the sources (for example BENSON); the file longDesc texts carry citations; no code comment cites equations"
closed_form = "procedural"
data = "constructs 'entry() of a thermo group tree', 'group node data states', 'ThermoData', 'thermo group file roles'"

[[model_family]]
name = "kinetics rate rules on reaction-family trees"
locator = "input/kinetics/families/*/groups.py and rules.py; procedure in rmgpy/data/kinetics/rules.py and family.py (surveyed in rmg_py)"
class = "kinetics"
inputs = "a reaction mapped to one tree node per reactant; temperature; reaction enthalpy at 298 K for EP and BM rules"
parameters = "template: one rate object per rule (4134 rules); node distances (default 1)"
composes = [
  { slot = "training depository", accepts = "reactions matched by isomorphism", default = "training (the only depository loaded by default)" },
  { slot = "rate rules", accepts = "rules.py entries at the matched template or at averaged neighbouring templates", default = "required when no depository reaction matches" },
]
variants = [
  { selector = "", selects = "autoGenerated families (39): rules carry RateUncertainty and a parent node is used when its estimated error is smaller" },
  { selector = "", selects = "rule rank 0, 1 to 11 weights selection and fitting" },
]
equation_source = "rank accuracy map and fits cite no paper in code; the ArrheniusBM docstring cites Blowers and Masel 2000"
closed_form = "procedural"
data = "constructs 'entry() of a kinetics rate rule', 'entry() of a training reaction', 'RateUncertainty'"

[[model_family]]
name = "Abraham solute and solvent LSER data"
locator = "input/solvation/libraries/*.py and input/solvation/groups/*.py; equations in rmgpy/data/solvation.py (surveyed in rmg_py)"
class = "group_contribution"
inputs = "a solute species (library value, or group-additivity estimate) and a solvent"
parameters = "pure solute: S, B, E, L, A, V; pure solvent: 6 Abraham and 6 Mintz coefficients, viscosity A to E, alpha, beta, eps, n; group: S, B, E, L, A increments"
composes = [
  { slot = "solute descriptors", accepts = "SoluteData from library, radical or halogen correction, or group additivity", default = "library first, then group additivity" },
]
variants = []
equation_source = "docstrings cite Abraham and McGowan 1987 (McGowan volumes) and Zhao et al. 2003; solvent parameters are not cited in code"
closed_form = "yes"
data = "construct 'SoluteData, SolventData and DataCount objects'"

[[model_family]]
name = "Joback critical-property group contributions"
locator = "input/transport/groups/*.py; procedure in rmgpy/data/transport.py estimate_critical_properties_via_group_additivity (line 439)"
class = "group_contribution"
inputs = "a molecular graph split into ring and non-ring atom groups"
parameters = "group: Tc, Pc, Vc, Tb, structureIndex"
composes = []
variants = []
equation_source = "Joback, K. G., PhD thesis, MIT, 1984 (cited in the group file longDesc)"
closed_form = "yes"
data = "construct 'TransportData and CriticalPointGroupContribution'"

# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units as written"
locator = "all input/**/*.py tuples"
statement = "Each value carries its own unit string and several units are used for the same quantity: energies as kcal/mol, kJ/mol, cal/mol, J/mol, eV/molecule; heat capacity and entropy as cal/(mol*K) or J/(mol*K); A factors as cm^3/(mol*s), m^3/(mol*s), cm^3/(molecule*s), 1/s, s^-1; pressures as Pa, atm, bar, torr. No file states a conversion and a consumer must convert per value (RMG does so through the quantities package)."
scope = "all constructs with tuples"

[[convention]]
name = "thermodynamic datum and temperature"
locator = "input/thermo/libraries/*.py; rmgpy/thermo/thermodata.pyx docstring"
statement = "H298 is the standard enthalpy of formation at 298 K (exactly 298, not 298.15) and S298 the entropy at 298 K; the standard-state pressure is not stated in any data file. The translation model of RMG-Py uses 101325 Pa, which is the only pressure in the pinned trees."
scope = "ThermoData, NASA, Wilhoit values and group increments"

[[convention]]
name = "symmetry number in entropy"
locator = "rmgpy/data/thermo.py get_thermo_data (line 1349), estimate_radical_thermo_via_hbi (line 2206)"
statement = "Library and quantum-chemistry entropies already include the symmetry term; group-additivity and machine-learning entropies do not and RMG subtracts R ln(sigma) afterwards; a radical estimated from a saturated library value first adds R ln(sigma_saturated) back."
scope = "S298 of libraries and of group values"

[[convention]]
name = "reaction-path degeneracy"
locator = "input/kinetics/families/H_Abstraction/training/reactions.py; rmgpy/data/kinetics/family.py line 1225"
statement = "A training or library rate is for the reaction as written including its degeneracy; turning a training reaction into a rate rule divides A by the degeneracy, and using a rate rule multiplies A by the new reaction's degeneracy."
scope = "training reactions, rate rules, libraries"

[[convention]]
name = "label and index"
locator = "rmgpy/data/base.py Entry (line 51)"
statement = "index is a nonnegative integer and label a unique string identifier; thermo group, library and kinetics family loaders key entries by label, kinetics depositories and libraries by index. The data break the documentation in places: radical.py repeats 5 labels, solvation groups have 13 negative indices and one kinetics library entry has a float index."
scope = "all entries"

[[convention]]
name = "rank"
locator = "rmgpy/data/base.py Entry docstring; rmgpy/kinetics/uncertainties.pyx rank_accuracy_map"
statement = "rank is an integer confidence; lower is better and 0 or absent means unranked. The kinetics code reads it in three places (rule choice, best-entry choice, fitting weights through rank_accuracy_map in kcal/mol); the thermo library lookup never reads it, although every rank present on a thermo library entry is 5."
scope = "rate rules, training reactions, ring groups, thermo libraries"

[[convention]]
name = "adjacency-list atom labels"
locator = "input/kinetics/families/H_Abstraction/groups.py; rmgpy/molecule/adjlist.py"
statement = "An atom label beginning '*' marks the centre or reactive atoms: '*' in single-centre thermo groups, '*1', '*2', '*3' and so on in pair and reaction patterns. The match requires every labelled atom of the pattern to map to the labelled atom of the structure."
scope = "all group patterns"

[[convention]]
name = "temperature scale and gas constant"
locator = "whole tree; rmgpy/constants.py"
statement = "No file states a temperature scale. The gas constant used by the code is 8.314472 J/(mol*K) (see survey rmg_py); NASA coefficients and Wilhoit objects in the libraries are evaluated with it."
scope = "all thermodynamic values"

# ---------------------------------------------------------------------------
# SELECTION
# ---------------------------------------------------------------------------

[[selection]]
name = "thermo library precedence"
locator = "rmgpy/data/thermo.py get_thermo_data_from_libraries (line 1906), get_thermo_data_from_library (line 2041), load_libraries (line 935)"
rule = "Libraries are tried in the order of the user's list (library_order); the first library with an entry whose molecule is isomorphic to any resonance structure of the species and whose data is not None is taken and the search stops. For a liquid-phase run, libraries with a solvent are tried first. If no list is given every .py file is loaded in directory-walk order. Only after all libraries fail does estimation begin. Entry rank is not consulted."
scope = "thermo of a species"
documented = "yes (docstrings say first match in order); the library entries' rank and referenceType play no role, although the Entry documentation describes rank as confidence"

[[selection]]
name = "tree descent and sibling order"
locator = "rmgpy/data/base.py descend_tree (line 1033), match_node_to_structure (line 950)"
rule = "From the first top node that matches, test the children in tree order; with one match descend into it; with no match stay (or take a last child whose label starts with 'Others-'); with several matches descend into the first listed. The match requires labelled atoms to correspond and every labelled atom of the node to map (strict mode for kinetics)."
scope = "all group trees"
documented = "partly: the class docstring says siblings should be mutually exclusive and that a warning is raised for overlaps, but the warning is commented out and the first match is used silently"

[[selection]]
name = "group node data resolution"
locator = "rmgpy/data/thermo.py _add_group_thermo_data (line 2724), _add_ring_correction_thermo_data_from_tree (line 2622)"
rule = "Non-ring files: the most specific matching node is used; None climbs to the first ancestor with data; a string is followed by label scan (up to 100 hops). Ring and polycyclic files: None is replaced by the average of the descendants' data when any exist (written back onto the node), otherwise the parent is tried; among several ring matches the deepest wins and complete matches beat partial ones."
scope = "group-additivity estimation"
documented = "the loader docstring states that items in the tree may be absent from the library and the search falls up the tree; the averaging behaviour for rings is stated in docstrings of the averaging helper"

[[selection]]
name = "rate rule choice and rank"
locator = "rmgpy/data/kinetics/rules.py get_rule (line 141)"
rule = "Among several rules with the same template label, the smallest rank wins with rank 0 or None counted as 1000, and ties go to the smaller index."
scope = "kinetics rate rules"
documented = "yes (comment in the code); note that _select_best_kinetics in family.py treats rank 0 differently: it drops rank-0 entries unless all are 0"

[[selection]]
name = "kinetics source order within a family"
locator = "rmgpy/data/kinetics/family.py get_kinetics (line 2586), get_kinetics_from_depository (line 2545), _select_best_kinetics (line 2575)"
rule = "Depositories are searched in load order (training first); every depository reaction isomorphic to the reaction is a candidate and the best is the lowest non-zero rank then lowest index; if none matches, the estimator uses rate rules at the nearest templates (Euclidean distance over node distances) and averages ties. With return_all_kinetics the depository hits and the rate-rule estimate are all returned."
scope = "kinetics of a family reaction"
documented = "yes (docstrings)"

[[selection]]
name = "rate-rule estimate and averaging"
locator = "rmgpy/data/kinetics/rules.py estimate_kinetics (line 348), _get_average_kinetics (line 273)"
rule = "If the exact template has a rule it is used; otherwise parents of each reactant node are tried, keeping templates at the minimum Euclidean distance, and several rules are averaged with log A and Ea arithmetic means of ln A (geometric mean of A), n, alpha and E0 and a summed comment; A is multiplied by the reaction's degeneracy."
scope = "kinetics estimation"
documented = "yes (docstring of _get_average_kinetics)"

[[selection]]
name = "libraries versus families for reactions"
locator = "rmgpy/data/kinetics/database.py generate_reactions (line 448)"
rule = "Library reactions are generated first and family reactions after them; the merge of duplicates between the two lives in rmgpy/rmg/model.py and was not traced."
scope = "reaction generation"
documented = "yes that libraries come first; the duplicate handling is not documented in this function"

[[selection]]
name = "recommended sets"
locator = "rmgpy/data/auto_database.py determine_chemistry_sets (line 208), determine_kinetics_families (line 264); input/recommended_libraries.yml; input/kinetics/families/recommended.py"
rule = "Chemistry sets are chosen from the elements present (N, S, O, halogens, Li), surface and liquid flags and a 800 K threshold on the maximum reactor temperature; the union of the named sets' libraries is used in the listed order."
scope = "automatic library selection"
documented = "yes (header comments of the yml and the docstrings)"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "rmgpy/data/base.py Entry docstring (line 71) versus input/**/ referenceType values"
documented = "referenceType is the way the data was determined: 'theoretical', 'experimental' or 'review'"
actual = "values in the data are 'Theory' (18997 thermo entries), 'review', 'theory' (1064), 'experiment' (1369), 'estimate', 'uncategorized' and one free sentence"
consequence = "No closed vocabulary exists for the kind of source; a mapping to origin_role needs a manual table."

[[discrepancy]]
locator = "rmgpy/data/base.py Entry docstring (line 74) versus input/thermo/libraries/*.py and rmgpy/data/thermo.py"
documented = "rank is an integer indicating the degree of confidence in the entry data"
actual = "all 18996 thermo library entries that carry a rank have rank 5 and the library lookup never reads it; only the three ring-group ranks are read (prioritize_thermo line 2183)"
consequence = "Thermo library rank carries no information and must not be imported as a precedence."

[[discrepancy]]
locator = "rmgpy/data/base.py Entry docstring (line 64) versus input/thermo/groups/radical.py"
documented = "label is a unique string identifier"
actual = "radical.py has 2000 entries and 1995 distinct labels; the five repeated labels (for example bicyclo[4.1.0]heptane-C3-7) have identical data; ThermoGroups.load_entry overwrites silently while KineticsGroups.load_entry raises on a repeat"
consequence = "Node identity by label loses 5 nodes; both tree lines survive, so the parent relation for those labels is ambiguous."

[[discrepancy]]
locator = "input/kinetics/families/Surface_Carbonate_CO_2F_Decomposition/groups.py line 16 versus rmgpy/data/kinetics/family.py line 689"
documented = "the file writes irreversible = True"
actual = "the loader reads reversible (default True) and never reads irreversible, so the family is treated as reversible"
consequence = "The intended irreversibility is not applied; a mapping should record the written flag but not derive reversibility from it."

[[discrepancy]]
locator = "rmgpy/data/thermo.py load_groups categories (line 1014) versus input/thermo/groups/adsorptionNi111.py"
documented = "the thermo directory ships adsorptionNi111.py beside adsorptionPt111.py and adsorptionLi.py"
actual = "only adsorptionPt111 and adsorptionLi are loaded; adsorptionNi111 is unreferenced in the pinned RMG-Py"
consequence = "18 adsorption nodes (12 with data) are dormant in this release; the survey still records them."

[[discrepancy]]
locator = "rmgpy/data/solvation.py load_groups categories (line 1248) versus input/solvation/groups/abraham.py and nonacentered.py"
documented = "nine solvation group files are shipped"
actual = "load_groups loads seven; abraham.py is used only by load_old (line 1321) and nonacentered.py is unreferenced"
consequence = "92 group entries (54 and 38) carry data never used by the estimator."

[[discrepancy]]
locator = "input/thermo/groups/longDistanceInteraction_noncyclic.py (label 'Cs(Br)3-Cd-Cd-Cs(Br)3') and rmgpy/data/thermo.py lines 2752-2767"
documented = "a string thermo value names another node whose data is used"
actual = "the named node 'Cs(Br)3-Cs(Br)3' has thermo = None, so after following the pointer the code attaches a comment to None (inferred AttributeError, not caught by the KeyError handler at thermo.py line 2400)"
consequence = "One pair correction is a latent failure if ever matched; the mapping must treat a pointer to an empty node as unresolved."

[[discrepancy]]
locator = "rmgpy/data/solvation.py SoluteLibrary docstring (line 982) versus SolvationDatabase.load (line 1154) and get_solute_data (line 1392)"
documented = "the solute library is 'not currently used'"
actual = "solute.py (450 entries) is loaded by every database load and is the first lookup in get_solute_data"
consequence = "The solute library is live data, contrary to the docstring."

[[discrepancy]]
locator = "rmgpy/data/rmg.py RMGDatabase.load (line 74; 'if surface:' at line 112)"
documented = "the keyword comment says surface is on by default because solvation is on by default, and the call following it is 'if surface: load_thermo(...)'"
actual = "thermo is loaded only when the surface argument is truthy, so surface=False loads no thermo database at all"
consequence = "No effect on the files; recorded because the thermo payload is gated by a surface flag in the loader."

