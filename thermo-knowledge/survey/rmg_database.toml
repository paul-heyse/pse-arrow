# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "species identity of library molecules"
question = "Library entries are identified by label and graph isomorphism with multiplicity; no InChI, SMILES or registry number accompanies the 25218 thermo molecules. Which canonicalisation defines the identity of a species, and should resonance forms of one species be merged?"
why_it_matters = "species.canonical_key must be reproducible and identity_assertion needs a structure scheme; two libraries that draw the same species in different resonance forms would otherwise stay unresolved."

[[question]]
about = "meaning of thermo = None in a library entry"
question = "14 library entries (C3, CHN, vinylCPD_H) have a molecule and thermo None; the lookup skips them. Are they placeholders, intentionally withdrawn values or incomplete imports?"
why_it_matters = "The model must either import them as species without a parameter_set or drop them; the loader's silent skip gives no hint."

[[question]]
about = "quantity of the covariance matrices"
question = "covariance.csv does not say which quantity (free energy at 298 K, enthalpy or entropy) its entries refer to; the reading tool treats it as a free energy in (kJ/mol)^2."
why_it_matters = "Uncertainty evidence cannot be tied to a slot without that statement; the model has no place for a covariance matrix over parameter sets at all."

[[question]]
about = "standard-state pressure of thermo data"
question = "No data file states the standard-state pressure of thermo library and group values; the only pressure in the pinned trees is 101325 Pa in the translation partition function. Is every value on the 1 atm standard state?"
why_it_matters = "convention_set.standard_pressure is required to compare these values with bar-based sources."

[[question]]
about = "group node None semantics per file"
question = "The estimator treats None as 'use an ancestor' in group, radical and pair files and as 'average the children' in ring and polycyclic files. Are there other readers, such as the ATG tools, with different readings for the same None?"
why_it_matters = "The model needs a single rule per scheme; a wrong one changes every estimate that falls on a None node (872 nodes)."

[[question]]
about = "degeneracy and units of A in training reactions"
question = "Training degeneracies are floats on 9474 of 9585 reactions. Is A in training and library entries the total rate for the reaction as written (including path multiplicity) in all files, and why are float degeneracies used?"
why_it_matters = "Dividing by degeneracy at import or not changes every rate rule derived from training data by that factor."

[[question]]
about = "unit of Troe and Lindemann A factors in pressure-dependent libraries"
question = "Arrhenius A units include '1/s' (45 objects) next to 's^-1' and '(cm^3/(mol*s))' in parentheses on one object; the loader accepts them through the quantities package, but nothing in the tree states which are intended."
why_it_matters = "Unit strings must be normalised to a declared set before mapping; an unparsable spelling would drop a rate."

[[question]]
about = "NIST and other non-default depositories"
question = "42 families have a NIST depository of 2698 Arrhenius reactions without rank that the default load ignores. Are these data meant as validation only, as potential training data or as a parallel source?"
why_it_matters = "They can be mapped as a separate parameterization with no precedence or dropped; the tree does not say which."

[[question]]
about = "library versus family precedence for one reaction"
question = "generate_reactions returns library reactions and family reactions together; the pinned tree was not traced through rmg/model.py for how a library reaction suppresses or coexists with a family reaction of the same reactants and products."
why_it_matters = "selection_policy must state whether a library parameterization overrides a family estimate for the same reaction."

[[question]]
about = "provenance of generated rules and trees"
question = "3851 BM rules, 39 auto-generated trees, the G4 NASA libraries and the SIDT trees are generated by tools whose versions and inputs are not recorded in the files."
why_it_matters = "derivation records for these values can name the method but not the software release or the training set, so they cannot be marked reproducible."
