source = "rmg_database"
pin = "fc7bb138f938"
surveyed = "2026-09-30"
summary = "RMG-database 4.0.0 (input/ tree: 1764 files, 223660722 bytes) contributes Python-syntax entry() files in which chemical structure patterns carry parameters: 10 thermo group-additivity trees (6003 nodes, each node either a ThermoData object, a string naming another node, or None), 77 ordered thermo libraries (25218 species, 23520 of them NASA), 134 kinetics families (8511 tree nodes, 4134 rate rules, 9585 training reactions, 399 forbidden patterns), 183 kinetics libraries (35081 reactions in 19 rate representations), solvation Abraham solute and solvent data, Joback transport groups, frequency groups, Arkane quantum-correction dictionaries and 421 reference species; it carries no code for matching or estimating (that lives in RMG-Py) and thermo/ml (10 neural-network weight files, 130544537 bytes) holds no rows."

