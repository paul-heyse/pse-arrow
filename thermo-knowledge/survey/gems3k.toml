[[payload]]
paths = ["**/*-dch.dat", "**/*-dch.json"]
format = "DCH (data for chemistry): key-value text '<tag> values' with '#' comment lines and section headers, or a JSON array with one object {_key, set, dch: {...}}; a sibling binary form exists (gdatastream.cpp) but no example is in the tree"
files = 21
bytes = 859774
records = "21 chemical-system definitions (12 key-value, 9 JSON): nIC 7 to 12, nDC 19 to 63 (787 dependent components in all), nPH 3 to 21, nPS 1 to 3; lookup grids (nTp x nPp, mLook): 1x1 (mode 0) in most, 1x21 (0), 3x3 (1), 7x4 (0), 21x21 (1), 101x101 (1); iGrd 0 in all; DC class codes found: S 482, O 179, G 48, T 21, W 21, J 18, M 18 (counted by parsing the ccDC arrays)"
reader = "datach_from_text_file in GEMS3K/datach_formats.cpp (line 619) with io_keyvalue.cpp, io_nlohmann.cpp or io_simdjson.cpp; TNode::GEM_init in node.cpp reads the file set named in a '-dat.lst' list"
read_by_source = "all"
notes = "The example sets are small laboratory and demonstration systems (Kaolinite pH titration, calcite-dolomite column, lime-brine, seawater, feldspar solvus, a 68-substance aqueous series); they are the only chemical-system data in the tree. Every lookup grid row is for the temperatures and pressures stated in TKval and Pval; the grids are precomputed by GEM-Selektor or ThermoFun, not by GEMS3K."

[[payload]]
paths = ["**/*-ipm.dat", "**/*-ipm.json"]
format = "IPM (internal data of the GEM IPM kernel): key-value text or a JSON array with one object {_key, set, ipm: {...}}; dimensions, numerical controls, per-phase model arrays"
