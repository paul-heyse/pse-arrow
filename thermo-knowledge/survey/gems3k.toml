source = "gems3k"
pin = "d98513959bc5"
surveyed = "2026-09-30"
summary = "GEMS3K v4.6.1 (its version header still says 4.5.5) contributes a chemical-system input in three files, in key-value text, JSON and binary forms (DCH: independent and dependent component lists, a stoichiometry matrix with a charge column, phases with class codes, and T-P lookup grids of G0, V0, H0, S0, Cp0 plus water density and permittivity; IPM: 8 flags, about 50 numerical controls and per-phase arrays for 30 built-in TSolMod mixing and equation-of-state classes, sorption and kinetics models; DBR: node composition in moles of independent components, state and results), 71 source files implementing an interior-point Gibbs energy minimiser with two-sided metastability constraints, and 79 example files (21 DCH, 21 IPM, 37 DBR) plus 37 result nodes; the standard-state data are tables at given T and P or (optionally) ThermoFun, there is no species database, the formula basis is elements plus a charge component with special classes (Nit, Zz), the sorption and most kinetics classes are stubs, one model class (TModOther) is an empty shell, and the bundled format documents describe an older revision of the files in units and names."

