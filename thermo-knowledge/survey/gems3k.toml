# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "standard-state convention of the G0 grids"
question = "Are the DCH G0 values apparent Gibbs energies of formation (Benson-Helgeson convention, as ThermoFun defaults), and what pressure and concentration scale do they assume for aqueous species and gases? The files state neither."
why_it_matters = "The grid values are facts about the exporting system; combining them with another source's Gibbs energies requires the same datum."

[[question]]
about = "units and order of the PMc coefficient rows for each model"
question = "For models with no example (PRSV, SRK, PR78, CORK, STP, CG, NRTL, Wilson, Margules, Berman, CEF, EUNIQUAC, ELVIS) what do DMc and PMc values denote in units (for example Wu in J/mol, Ws in J/(mol K), Wv in J/bar)?"
why_it_matters = "Parameters cannot be loaded into typed slots without units, and only the Van Laar, Helgeson and Davies layouts have example data."

[[question]]
about = "position meanings of the 8-character sMod string"
question = "What do positions 1, 2, 4, 6 and 7 of sMod encode (enum solmod_switches lists SPHAS_TYP, DCOMP_DEP, SPHAS_DEP, SGM_MODE, DCE_LINK, MIX_TYP and link modes) beyond positions 0 and 3?"
why_it_matters = "MixCode (mixing rule) and link modes select model variants; the examples use only N for them."

[[question]]
about = "coverage of the examples"
question = "Do any of the 21 example chemical systems include non-ideal gases, sorption phases or kinetics? The IPM files show only D, H, V and I phases and Lads = FIa = 0."
why_it_matters = "Parameter layouts for fluids, sorption and kinetics can only be inferred from code comments; there is no data to verify them."

[[question]]
about = "TELVIS and mixed-solvent model data"
question = "Which publication defines the ELVIS modified extended UNIQUAC parameters and are the 13 per-species coefficients radii polynomials?"
why_it_matters = "The class has no citation in the header; it is the only mixed-electrolyte model in the tree."
