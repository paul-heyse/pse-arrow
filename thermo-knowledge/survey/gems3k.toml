# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "independent-component basis and species"
locator = "DCH ICNL, ccIC, A; m_const_base.h enum IC_CLASSES"
statement = "Species are not stored with formulas: each is a row of the stoichiometry matrix over independent components (elements, hydrogen and oxygen by class, a charge component, optional formula-unit, volume, isotope and site components); the mass-balance constraints of the minimiser are exactly A^T n = b over these components, and the charge row with pa_PE set to 1 enforces electroneutrality."
scope = "all systems"

[[convention]]
name = "units of the file formats"
locator = "datach_formats.cpp comments; ms_multi_format.cpp comments"
statement = "Temperature in K (TK, TKval), pressure in Pa (P, Pval), molar masses in kg/mol (ICmm, DCmm), standard volumes in J/Pa (m3/mol), Gibbs energies in J/mol, and the total Gibbs energy and component chemical potentials in J/(RT); amounts in mol, masses in kg, volumes in m3, specific surface area in m2/kg in DBR (m2/g in the IPM file); the gas constant is 8.31451 J/(mol K) and the Faraday constant 96485.309 C/mol in the TSolMod classes."
scope = "current file writer; the bundled documents state older units"

[[convention]]
name = "concentration scales and reference states"
locator = "m_const_base.h enum PH_CLASSES comment (line 233); ipm_chemical.cpp activity code"
statement = "The phase class code 'defines standard state and reference scale of concentrations': solutes of an aqueous phase are on the molality scale referred to the solvent (water 55.50837344 mol/kg, ln55.51 kept in the work structure), water and non-aqueous components on the mole-fraction scale, gases by partial pressure in bar, pure condensed phases unity; the DCH states none of this and the standard-state Gibbs energy grid G0 must be consistent with it (inferred from the code paths; the files do not declare the standard-state kind)."
scope = "all phases"

[[convention]]
name = "species order and naming"
locator = "DCH section comments and DCNL"
statement = "Species must be ordered by phase in a fixed order (aqueous, gas, condensed solutions, sorption, pure phases); aqueous neutral species end in @; names may not contain spaces; independent component names are at most 5 characters and start with a capital letter; 'Zz' is reserved for charge."
scope = "DCH files"

[[convention]]
name = "interpolation and lookup"
locator = "DCH mLook, Ttol, Ptol; node.cpp"
statement = "With mLook 0 the standard-state arrays are interpolated over the nTp x nPp grid by Lagrange interpolation with five points (LagranInterp, node2.cpp); with mLook 1 the nTp entries are (T, P) pairs used without interpolation and a (T, P) must match one pair within Ttol and Ptol; a (T, P) within the tolerances of a grid point uses that point; outside the grid plus tolerance the accessors return 7777777 and check_TP reports an error."
scope = "standard-state data"

