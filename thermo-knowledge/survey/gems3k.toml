# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "Docs/txt/dch-dat-doc.txt, node-gem/doc/scm-dch-dat-doc.txt, Docs/txt/dbr-dat-doc.txt versus datach_formats.cpp and the example files"
documented = "Temperature is given as Tval in C (DCH) and TC in degrees C (DBR), pressure in bar (Pval, P, Ptol in bar), atomic and molar masses in g/mol, molar volumes V0 in J/bar, interpolation tolerance Ttol in degrees and default 1, grid tags roW and epsW."
actual = "The code and example files use TKval and TK in kelvin, Pval and P in pascal, ICmm and DCmm in kg/mol, V0 in J/Pa, denW and epsW with derivatives, and the extra tags mLook, Psat, denWg, epsWg, S0, Cp0, A0, U0 and DD."
consequence = "A reader following the documents misreads every unit by a scale factor (for example 25 versus 298.15, 1 bar versus 1e5 Pa, 12 versus 0.012); units must be taken from the code comments."

[[discrepancy]]
locator = "Docs/txt/dch-dat-doc.txt and the DCH comment versus datach_api.cpp check_TP (line 46) and node2.cpp accessors"
documented = "The documentation says a T or P beyond the interpolation interval is automatically replaced by the closest available value."
actual = "check_TP returns an error message for T beyond the first or last grid value by more than Ttol (or for a pair outside the list when mLook is 1), and the node accessors return the sentinel 7777777 for such requests."
consequence = "Out-of-range requests do not clamp; a caller must treat 7777777 as 'outside the validity of the tables'."

[[discrepancy]]
locator = "Docs/html/gems3k-tsolmod.html (Pitzer code table) versus s_solmod.h enum eTableType (line 1487)"
documented = "The Pitzer parameter type codes run from -10 (beta0) to -60 (zeta) in the table."
actual = "The code also defines Lam1 -31, Lam2 -32, Theta1 -41, Psi1 -51, Eta -70, Eta1 -71, Alp1 -80 and Alp2 -81."
consequence = "Parameter rows of the extra types are not documented; the alpha parameters can be read from data as well as defaulted."

[[discrepancy]]
locator = "s_solmod4.cpp THelgeson constructor (line 45) versus the LsMod shape"
documented = "Interaction coefficient rows are NPar x NPcoef (the example has 2 x 4)."
actual = "The Helgeson and Karpov constructors read five phase-level values aIPc[0] to aIPc[4] from the table; with NPcoef 4 the fifth value (flagElect) is the first element of the second row."
consequence = "The layout of the phase-level parameters is a convention that does not follow the declared table shape; flagElect depends on how the second row is filled."

[[discrepancy]]
locator = "s_solmod3.cpp TCEFmod::PTparam and TMBWmod::PTparam versus their size test"
documented = "The constructors test for NPcoef < 3 (a comment says three parameters are the default)."
actual = "Both read four coefficients per parameter (Wu, Ws, Wc, Wv at offsets 0 to 3); with NPcoef 3 the fourth is the first coefficient of the next row."
consequence = "A three-coefficient table is misread silently for all but the layout the code expects."

[[discrepancy]]
locator = "s_solmod6.cpp TModOther and m_const_base.h SM_OTHER"
documented = "Code O selects 'other built-in phase-specific models of non-ideal solutions (selected by phase name)'."
actual = "TModOther's methods return 0 with all model bodies commented out; the feldspar and garnet branches do not execute."
consequence = "A phase with model code O computes no activity-coefficient terms."

[[discrepancy]]
locator = "s_solmod.h TMBWmod header (line 1290) and ipm_chemical3.cpp line 855"
documented = "TMBWmod is constructed for code #."
actual = "The class header marks it 'TEST MODEL'; its reference is Vinograd et al. 2018."
consequence = "The model is experimental; no example uses it."

[[discrepancy]]
locator = "GEMS3K/gems3k_version.h versus the pinned tag"
documented = "The pin is tag v4.6.1."
actual = "gems3k_version.h states GEMS3K_VERSION 4.5.5, hash 9f5d032, ThermoFun 0.6.0 and ChemicalFun 0.1.13; example file headers state GEMS3K v.3.3."
consequence = "File headers and the library version are not evidence of the pinned behaviour; written files carry the writer's version stamp."

[[discrepancy]]
locator = "files written by older releases (sMod of 6 characters) versus ms_multi_format.cpp (8)"
documented = "The sMod array holds one code string per multicomponent phase."
actual = "Examples have strings of 6 characters ('DNNSNN', 'INNINN', in 3 files) and 8 characters ('DNNSNNNN' and others) in the rest."
consequence = "A reader must accept both lengths; the two trailing positions are link and sorption or kinetics controls added later."

[[discrepancy]]
locator = "DCH example series1-dch.dat in tools-build versus the mixed-solvent aqueous models in s_solmod.h"
documented = "Codes exist for TELVIS and a mixed-solvent model (C, reserved)."
actual = "Code C (SM_AQMIX) has no class; code J selects TELVIS; the TELVIS header cites no publication and needs at least 13 per-species parameters (it returns an error below NP_DC 2 and uses indices up to +13)."
consequence = "Mixed-solvent and ELVIS data cannot be interpreted from the tree alone."

