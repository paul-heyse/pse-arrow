# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "Lennard-Jones spline and truncated-shifted functionals"
question = "Which repository or release contains the functional for which the ljs scripts (src.interface, src.dft_numerics, thermopack.ljs_wca) and the ljts tables were written, and does any file of the pinned tree define it?"
why_it_matters = "The survey can only record MD reference data and scripts; the functionals themselves are absent from this pin."

[[question]]
about = "units and provenance of ljs and ljts data"
question = "The ljs CSV headers carry no units, the ljts tables carry no source, the first column of surftens.dat is headed rho although it looks like temperature, and the cut-off 4.0 occurs twice with different values; which simulation set and which reduced units do they come from?"
why_it_matters = "Reference data without units and method cannot be attached to a dataset record."

[[question]]
about = "licence"
question = "Which licence governs the pinned tree: the GPLv3 text in LICENSE and the citation page, or the MIT classifier in pyproject.toml?"
why_it_matters = "Rights determination for any use of the package content depends on it; the survey records exactly what each file says and does not choose."

[[question]]
about = "SAFT-VR-Mie for multi-segment fluids"
question = "SAFT_VR_Mie inherits a SAFT class that implements only hard-sphere and dispersion contributions, yet the eos may hold m > 1 and sets the chain flag; is a chain contribution for SAFT-VR-Mie intended to exist, or is the class restricted to single-segment fluids?"
why_it_matters = "It determines the scope of the functional (single-segment Mie only) that a model of this source must record."

[[question]]
about = "definition of the hard-sphere diameter"
question = "Which diameter does ThermoPack's hard_sphere_diameters return for PC-SAFT and for SAFT-VR-Mie (the Barker-Henderson expression is named only in one docstring), and does it include the temperature derivative used in the dT weights?"
why_it_matters = "The weight functions and all weighted densities depend on it, and it is defined outside this tree."
