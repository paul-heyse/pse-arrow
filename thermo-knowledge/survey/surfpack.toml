# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units"
locator = "surfpack/readme.md (Units); docs/vcurrent/getting_started.md"
statement = "SI with two exceptions: lengths in angstrom and amounts as particle counts, so densities are in particles per cubic angstrom, energies in joule (J per particle), surface tension in J per square angstrom, adsorption in mol per square angstrom in the examples (converted by 1e20 to mol/m2). The conversion factor 1e30/Avogadro appears where ThermoPack SI values are used. The docs table lists time as 1e-20 s."
scope = "all functionals and properties"

[[convention]]
name = "reduced Helmholtz energy density"
locator = "surfpack/Functional.py reduced_helmholtz_energy_density"
statement = "phi = a_res/(kB T) where a_res is the residual Helmholtz energy density in J per cubic angstrom, so phi has units of inverse cubic angstrom; the integrand of eq. 3.4 of Roth's introduction is cited. The ideal-gas part is added through the de Broglie wavelength from ThermoPack."
scope = "all functionals"

[[convention]]
name = "reduce_temperature"
locator = "surfpack/saft.py SAFT.reduce_temperature"
statement = "The docstring says the temperature is reduced in LJ units; the code returns T divided by the critical temperature of the near-pure fluid obtained from ThermoPack."
scope = "SAFT functionals"

[[convention]]
name = "dividing surfaces"
locator = "surfpack/Functional.py dividing_surface_position, surface_tension, adsorbtion"
statement = "Equimolar surface ('e' or 'equimolar', default for most properties) or surface of tension ('t' or 'tension'); adsorption and surface tension are referred to the chosen surface."
scope = "surface tension and adsorption"

# ---------------------------------------------------------------------------
# SELECTIONS
# ---------------------------------------------------------------------------

[[selection]]
name = "solver key"
locator = "surfpack/saft.py SAFT.__init__; surfpack/solvers.py get_solver"
rule = "'single_segment' if all segment numbers are one, overridden by 'assoc' if association sites exist, overridden by 'NH3,H2O' if both NH3 and H2O occur in the component string; unknown keys fall back to 'default' with a warning."
scope = "profile solvers"
documented = "yes (get_solver docstring lists the keys; the automatic choice is in code)"

[[selection]]
name = "hard-sphere model"
locator = "surfpack/saft.py SAFT.__init__ (hs_model argument)"
rule = "SAFT_WhiteBear by default; any class of the same kind may be passed."
scope = "SAFT functionals"
documented = "yes (constructor docstring)"

[[selection]]
name = "ThermoPack parameter reference"
locator = "surfpack/saft.py (parameter_ref)"
rule = "'default' unless given; the set is chosen inside ThermoPack."
scope = "all SAFT parameters"
documented = "partly (docs defer to ThermoPack)"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "LICENSE; pyproject.toml; setup.py; docs/metapages/please_cite.md; README.md"
documented = "LICENSE: the stock text 'GNU GENERAL PUBLIC LICENSE, Version 3, 29 June 2007' (35149 bytes, beginning 'Copyright (C) 2007 Free Software Foundation, Inc.', no software-specific copyright line), with the GPL appendix on applying the licence; docs/metapages/please_cite.md: 'SurfPack is distributed under the GNU General Public Licence.'"
actual = "pyproject.toml classifiers: 'License :: OSI Approved :: MIT License' (no license key and no MIT text anywhere in the tree); setup.py gives no licence argument and version 'v0.0.0'; pyproject.toml version is '1.0.0' while the tag is v1.1.0; README.md states no licence"
consequence = "The licence of the tree is stated as GPLv3 by the licence file and the citation page and as MIT by one packaging classifier; which applies is not settled by the bytes."

[[discrepancy]]
locator = "surfpack/saft.py SAFT.reduce_temperature (docstring versus code)"
documented = "'Compute the reduced temperature (LJ units)'"
actual = "returns T/Tc with Tc from eos.critical of a near-pure composition, not a Lennard-Jones reduction by epsilon/k"
consequence = "The quantity is a critical-reduced temperature despite the documentation."

[[discrepancy]]
locator = "surfpack/saft.py (multipole flag and chain flag) versus the methods of SAFT and SAFT_VR_Mie"
documented = "set_multipole_active and set_chain_active toggle contributions, stored in __contributions__"
actual = "SAFT defines no multipole or chain energy method; only PC_SAFT implements a chain contribution and nothing implements multipole"
consequence = "The flags have no effect for SAFT_VR_Mie and for multipole in every class."

[[discrepancy]]
locator = "surfpack/grid.py Geometry and Grid; surfpack/Convolver.py"
documented = "Geometry enumerates PLANAR, POLAR and SPHERICAL"
actual = "Grid raises NotImplementedError for any geometry but planar and spherical; convolve_ad_polar raises NotImplementedError"
consequence = "Polar (cylindrical) geometry is declared but not supported."

[[discrepancy]]
locator = "surfpack/Functional.py tolmann_length and docstrings"
documented = "method and docstrings spell the quantity 'Tolmann length'"
actual = "the quantity is the Tolman length (docs/memo/tolman/tolman.tex)"
consequence = "Spelling only; search keys must include both spellings."

[[discrepancy]]
locator = "ljs/planar_ljs_energy.py comments versus plot labels"
documented = "script comment 'Load experimental data'"
actual = "plot calls label the same data 'MD'"
consequence = "The origin of the ljs/*.csv data (simulation or experiment) is stated inconsistently; simulation is the reading used here."

