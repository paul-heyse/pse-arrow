source = "surfpack"
pin = "e4844d7fbe09"
surveyed = "2026-09-30"
summary = "SurfPack v1.1.0 is a pure-Python classical density functional theory package for planar and spherical interfaces and confined fluids: it implements fundamental-measure-theory hard-sphere functionals (Rosenfeld, White Bear, White Bear Mark II), SAFT functionals built on those (a dispersion term that evaluates ThermoPack's bulk dispersion Helmholtz energy at weighted densities, PC-SAFT chain and association terms, a SAFT-VR-Mie class that adds only dispersion), weighted-density machinery, external potentials, profile solvers, and surface-tension, adsorption, Tolman-length and related property routines. Every bulk quantity it needs (hard-sphere diameters, dispersion and association energy densities, chain contact values, pure-fluid parameters, phase equilibria, de Broglie wavelengths) comes from a ThermoPack equation-of-state object; it carries no parameter database of its own. Lennard-Jones-spline and truncated-shifted Lennard-Jones functionals named in the brief are not in the pinned tree: only molecular-dynamics reference data and scripts that import code from outside the tree ship. The licence files of the tree disagree (see discrepancy)."

