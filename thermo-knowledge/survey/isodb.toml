[[construct]]
name = "isotherm file"
locator = "Library/10.1002adem.200500223/10.1002adem.200500223.isotherm1.json (whole object)"
meaning = "One digitised adsorption isotherm: the measured or simulated amount of one or more adsorbates on one adsorbent as a function of pressure (and composition) at one temperature, from one figure or table of one article."
subject = "A measurement series: one adsorbent, one or several adsorbates, one temperature; keyed by filename (the file stem) and the DOI; the adsorbent by hashkey, each adsorbate by InChIKey."
fields = [
  { name = "DOI", meaning = "DOI of the source article, exact form (the folder name is a lossy stub)", unit = "not applicable (text)", shape = "reference", role = "metadata" },
  { name = "filename", meaning = "the file stem; unique across the library", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "adsorbent", meaning = "object {hashkey, name}: registry key and the article's name for the material", unit = "not applicable", shape = "reference", role = "input" },
  { name = "adsorbates", meaning = "list of objects {InChIKey, name}, one per gas or liquid component; 1 to 8 entries", unit = "not applicable", shape = "list", role = "input" },
  { name = "temperature", meaning = "isotherm temperature; a whole number (JSON integer) in all 39,988 files, 345 distinct values, from -200 to 1073; unit not stated (kelvin is implied by 77 and 298 being the commonest values)", unit = "not stated", shape = "scalar", role = "input" },
  { name = "pressureUnits", meaning = "unit of point pressures: 'bar' in 39,986 files, 'RELATIVE' in 2 (10.1021jacs.3c02100 isotherms 11 and 12, inferred to be p over p0)", unit = "not applicable (enum)", shape = "enum", role = "input" },
  { name = "adsorptionUnits", meaning = "unit string of every adsorption and total_adsorption value; 83 distinct spellings, empty in 186 files (see convention 'adsorption units')", unit = "not applicable (free text)", shape = "enum", role = "input" },
  { name = "isotherm_type", meaning = "kind of adsorbed amount: 'excess' in 1,834 files, 'absolute' in 567, empty in 37,587 (94.0 percent)", unit = "not applicable (enum)", shape = "enum", role = "input" },
  { name = "category", meaning = "nature of the data: exp 14,468, sim 1,916, mod 633, qua 121, empty 22,850; the word meanings are not stated (experimental, simulated, modelled and a fourth inferred from the abbreviations and from a bibliography entry whose category sim belongs to a Monte Carlo paper)", unit = "not applicable (enum)", shape = "enum", role = "metadata" },
  { name = "compositionType", meaning = "what each species_data composition value means: molefraction 37,659, concentration 1,385, moleratio 812, volumefraction 57, relhumidity 28, partialpressure 26, massfraction 21", unit = "not applicable (enum)", shape = "enum", role = "input" },
  { name = "concentrationUnits", meaning = "unit of a concentration composition; the empty string in all 39,988 files, including the 1,385 whose compositionType is concentration", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "tabular_data", meaning = "a 0/1 flag; 1 in 1,019 files; its meaning is not stated; it does not follow articleSource wording (631 flagged files cite a non-table source and 1,041 files citing a Table are unflagged)", unit = "not applicable (flag)", shape = "scalar", role = "not established" },
  { name = "articleSource", meaning = "where in the article the data were taken: 'Figure 3', 'Table 2', 'Supplementary Information' and similar, 1,995 distinct strings, UNKNOWN in 22,828 files", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "digitizer", meaning = "name of the person or team that digitised the data (43 distinct values including UNKNOWN), UNKNOWN in 22,853 files", unit = "not applicable (text)", shape = "scalar", role = "metadata" },
  { name = "date", meaning = "date of entry into the library, ISO date; the placeholder 1000-01-01 in 22,863 files (57.2 percent); the other 247 distinct dates fall in 2014 to 2026", unit = "not applicable (date)", shape = "scalar", role = "metadata" },
  { name = "isotherm_data", meaning = "list of points, each {pressure, total_adsorption, species_data}; see the next construct", unit = "see construct", shape = "table", role = "input" },
]
origin = "transcribed (digitised from figures or tables of the cited article with the NIST isotherm digitizer web application per the README; category sim records computed values from simulation papers, and for the 22,850 files with empty category the nature of the data is not stated)"
conventions = "Pressure in bar; temperature a whole number without a unit; adsorption in the file's own unit string; composition as in compositionType. Legacy block: 22,823 files carry all four placeholders at once (date 1000-01-01, digitizer UNKNOWN, category empty, articleSource UNKNOWN)."
absence = "An empty string is the missing value for category, isotherm_type, concentrationUnits and (186 files) adsorptionUnits; UNKNOWN for articleSource and digitizer; 1000-01-01 for date; none of these is distinguished from a true value except by string comparison. A temperature is always present."
validity = "not stated per isotherm; the point list itself gives the pressure range"
provenance = "DOI, articleSource and digitizer; the authors, title and journal come from the bibliography record. No licence text in the file."
count = "39,988 files; 3,827 DOIs; 37,044 single-component and 2,944 multicomponent isotherms (2 species 2,439, 3 species 359, 4 species 133, 5 species 12, 8 species 1)"
example = "Library/10.1002adem.200500223/10.1002adem.200500223.isotherm1.json"
candidate = "dataset (kind measured, or computed when category is sim, with a transcription derivation from the article) with dataset_component rows for the adsorbent and each adsorbate, a temperature constraint column, a pressure variable column, composition variable columns, an adsorption property column typed by adsorbed_amount_excess or adsorbed_amount_absolute, and data_point rows"
precision = "close"
loss = "Adsorption kind is absent for 94 percent of isotherms, so the observable (adsorbed_amount_absolute or _excess) cannot be chosen and the mapping must assume or hold the point; the loading unit is a free-text string and only per-mass amounts fit the model's Loading type; temperature has no unit and includes negative values; composition types moleratio, partialpressure, relhumidity and concentration have no declared composition basis; there is no adsorption or desorption branch field (the model's branch would be not_applicable); the placeholder date, digitizer and articleSource must not become values."

