evidence = "source_inspected"

# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "temperature unit and scale"
question = "What is the unit of the temperature field, and how do the 36 isotherms with negative temperature (-200; 18 in each of two article folders) arise (a Celsius entry, a sign error)?"
why_it_matters = "The model stores kelvin; a value without a stated unit cannot be converted exactly, and negative kelvin values are impossible, so some isotherms need to be held."

[[question]]
about = "meaning of category and tabular_data"
question = "What do the category values exp, sim, mod and qua and the flag tabular_data mean exactly, and is an empty category equivalent to unknown or to experimental?"
why_it_matters = "Whether a dataset is measured or computed (the model's dataset kind) depends on it for 22,850 files whose category is empty."

[[question]]
about = "kind of adsorbed amount"
question = "For the 37,587 isotherms with empty isotherm_type is the amount excess, absolute or neither (for example a net or total uptake reported by the article)? The field is not filled, and the file has no other statement."
why_it_matters = "The model's adsorption observables distinguish excess from absolute; a wrong assumption would mislabel most of the data."

[[question]]
about = "phase and pressure basis of composition"
question = "Does composition refer to the bulk gas or the adsorbed phase, and is pressure the total pressure or a partial pressure for multicomponent isotherms? Why is concentrationUnits empty for the 1,385 isotherms whose compositionType is concentration?"
why_it_matters = "A multicomponent dataset needs a declared composition basis and phase to be usable for mixture-prediction validation."

[[question]]
about = "definition of STP and of the hash key"
question = "Which standard temperature and pressure does cm3(STP) use, and how is the NIST-MATDB hash key derived from a material?"
why_it_matters = "Conversion of the most common non-SI loading unit to moles needs a stated STP, and the stability of the adsorbent identity across releases depends on the hash definition."

[[question]]
about = "licence of the mirror"
question = "Which terms govern the mirror? It has no licence file; the site footer states copyright by the Department of Commerce with all rights reserved, while data.nist.gov records for the database list the NIST open licence (from the source manifest, not from the pinned bytes)."
why_it_matters = "The store copy, redistribution and commercial use of 40 thousand isotherms depend on which statement governs."
