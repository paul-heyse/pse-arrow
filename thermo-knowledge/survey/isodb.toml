source = "isodb"
pin = "9e1ee472967d"
surveyed = "2026-09-30"
summary = "The NIST-ISODB/isodb-library mirror (commit 9e1ee472) contributes 39,988 isotherm JSON files in 3,827 DOI folders (960,990 pressure points, 7.4 percent of the isotherms multicomponent) plus registries of 9,328 adsorbents, 455 adsorbates and 4,648 bibliography entries, all digitised from literature figures or tables; it states temperature without a unit, adsorption kind (excess or absolute) for only 6 percent of the isotherms, a loading unit as free text in 83 spellings, and no adsorbent composition, structure or texture, and it carries no schema file or licence file."

