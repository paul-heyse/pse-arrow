[[payload]]
paths = ["Library/<DOI stub>/*.json"]
format = "JSON, one isotherm per file (indent 4, keys sorted, UTF-8, pretty-printed by a pre-commit hook), folder name is the lower-case DOI with '/' and some punctuation removed, file name <DOI stub>.<Isotherm|isotherm|ISOTHERM><number and suffix>.json; 16 top-level keys in every file"
files = 39988
bytes = 336245011
records = "39,988 isotherm objects in 3,827 DOI folders (every file in a DOI folder parsed as JSON, none failed; one key set for all files), 960,990 points in total (1 to 344 per isotherm, median 17) carrying 977,084 species_data rows, counted by json.load of every file with the system python3"
reader = "no reader in the tree: .github/validate.py reads pressure and species_data adsorption of each point for two checks (both commented out in .pre-commit-config.yaml and both exit 0 on findings); utilities.py wraps the external isodbtools package (clean_json, download_isotherm, regenerate_library) which is not in the tree; a plain JSON parser reads every file"
read_by_source = "partly"
notes = "File names are not uniform: of 38,065 names that begin with the folder stub plus a dot (compared case-insensitively; the other 1,923 names do not), the suffix takes 63 shapes, among them Isotherm<N> 29,584, isotherm<N> 7,414, Isotherm<N>-<N> 340, isotherm<N> with a letter a to f, ISOTHERM<N> 44, misspelled isothherm<N> 31, and names of the form Lab<N>_Aliquot<N>_Cycle<N>_Adsorption (84 files) or _Desorption (76 files) (desorption branches appear only in such file names, never as a field). The filename key equals the file stem in all 39,988 files. 3,072 isotherms (7.7 percent) have non-monotone pressure along the point list."

[[payload]]
