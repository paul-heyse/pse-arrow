# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "adsorption units"
locator = "Library/**/*.json#/adsorptionUnits (all 39,988 isotherm files)"
statement = "The unit of every adsorbed amount in a file is one free-text string; 83 distinct strings occur (mmol/g 17,019; cm3(STP)/g 10,934; wt% 3,313; mg/g 1,960; molecules/unitcell 1,607; ml/g 553; cm3(STP)/cm3 498; g/g 490; g/l 361; micromoles/m2 357 and 73 more), 186 files have the empty string. A survey grouping of the strings by regular expression (the source makes no such grouping) puts about 34,751 files on a per-mass basis, 2,035 per structural unit (cell, cage, pore, site, metal centre), 1,629 per volume, 763 per area, 624 as ratios, fractions, per-mole or bare amounts and 186 empty. The basis (per mass, volume, area or unit) is part of the string and is stated nowhere else. Whether the amount is excess or absolute is given only by isotherm_type, which is empty for 94.0 percent of the files; two strings mention it inside the unit ('grams (excess)' in 2 files). STP is not defined in any file, so cm3(STP) cannot be converted to moles without an assumption. A conversion between bases needs the adsorbate molar mass (for mass units and wt%), the adsorbent density or unit-cell content (for volume and unit-cell units) or the adsorbent surface area (for area units), none of which the mirror holds."
scope = "adsorption and total_adsorption of every isotherm"

[[convention]]
name = "pressure"
locator = "Library/**/*.json#/pressureUnits"
statement = "Pressure is in bar (39,986 files) or the word RELATIVE (2 files, inferred to be relative pressure); absolute or gauge pressure and the fugacity or partial-pressure meaning for mixtures are not stated."
scope = "isotherm point pressure"

[[convention]]
name = "temperature"
locator = "Library/**/*.json#/temperature"
statement = "Integer with no unit and no scale; values from -200 to 1073 with 36 isotherms negative (18 files in each of two articles, folders 10.1021je00024a002 and 10.1002aic.690150410, all at -200) and 391 below 50, so a single unit (kelvin) cannot hold for every file; 298 (9,925 files) and 77 (9,217 files) are the commonest values, which suggests kelvin with rounding of 298.15 to 298."
scope = "isotherm temperature"

[[convention]]
name = "composition"
locator = "Library/**/*.json#/compositionType and species_data composition"
statement = "compositionType names the basis of the per-species composition value: molefraction, moleratio, volumefraction, massfraction, concentration (with empty concentrationUnits in all 1,385 files), partialpressure or relhumidity; the phase the composition refers to (bulk gas or adsorbed phase) is not stated, although one units string says 'molefraction (adsorbed phase)'."
scope = "species composition of every point"

[[convention]]
name = "digitisation and placeholders"
locator = "Library/**/*.json; README.md (digitizer web application)"
statement = "Values are digitised by hand from the article, so they carry digitisation error that is not stated. Placeholder values stand for unknown: date 1000-01-01 (22,863 files), digitizer UNKNOWN (22,853), articleSource UNKNOWN (22,828), category empty (22,850); 22,823 files have all four."
scope = "isotherm metadata"

# ---------------------------------------------------------------------------
# SELECTIONS
# ---------------------------------------------------------------------------

[[selection]]
name = "competing isotherms of the same system"
locator = "Library/ (no rule); .pre-commit-config.yaml doi-uniqueness hook"
rule = "none: every digitised isotherm is kept as its own file, including repeated digitisations of the same article data; the only uniqueness rule is one folder per lower-case DOI."
scope = "isotherms from one article and isotherms of the same adsorbent, adsorbate and temperature in different articles"
documented = "not documented"

# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "Library/**/*.json#/isotherm_data/*/species_data versus #/adsorbates"
documented = "each isotherm lists its adsorbates, and each point carries per-species data"
actual = "at 11,950 of 960,990 points species_data lists fewer species than the adsorbates list of the isotherm (the extra species has no row)"
consequence = "Mixture columns have no value at those points; a dataset column per header species cannot be assumed complete."

[[discrepancy]]
locator = "Library/**/*.json#/isotherm_data/*/total_adsorption versus species_data adsorption"
documented = "total_adsorption is the total over the species"
actual = "total_adsorption is null at 337,858 points and differs from the sum of species adsorption beyond 1e-6 relative at 1,817 of the 623,132 points that have a non-null total"
consequence = "The total cannot be taken as a redundant check; it is an independent, often missing column."

[[discrepancy]]
locator = ".pre-commit-config.yaml (commented hooks) and .github/validate.py versus the data"
documented = "the validation script checks that pressures and adsorption values are not negative"
actual = "both hooks are commented out and the script exits 0 on findings; the data contain 1,435 negative pressures and 2,549 negative adsorption values"
consequence = "Negative values are accepted into the library and need a load rule."

[[discrepancy]]
locator = "Library/**/*.json#/tabular_data versus #/articleSource"
documented = "not documented; the name suggests data taken from a table rather than a figure"
actual = "tabular_data is 1 in 1,019 files, but only 388 of those cite a 'Table' source, and 1,041 files citing a Table have tabular_data 0"
consequence = "The flag cannot be used to decide whether values were digitised or typed; it is carried as not established."

