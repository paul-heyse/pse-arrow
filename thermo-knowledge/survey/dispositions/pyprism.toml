[[disposition]]
construct = "System (site types and kT)"
disposition = "mapping_loss"
ref = "kind:pseudo_component"
reason = "Site types map to pseudo_component entities of kind abstract_component, but the grouping of site types into molecules exists only through the omega table and is not a record, so no molecule entity is invented; kT, the domain and the unset-entry checks belong to one solve and are not mapped."

[[disposition]]
construct = "site density"
disposition = "mapping_loss"
ref = "kind:composition_basis"
reason = "site_number_density is the declared composition basis for the density of each site type, so the stated loss no longer applies, but the values are reduced (units not stated, inverse cubed diameter by the data headers) with no declared reference length, an assumption; the derived pair, site and total densities are computed and not stored."

[[disposition]]
construct = "site diameter and contact distance"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The diameter maps to a slot of a hard-core or pair-potential form per site type and the arithmetic mixing of diameters to a combining-rule component; diameters are reduced lengths with units not stated and no declared reference length, kept as dimensionless numbers, and the derived volume and sigma are computed, not stored."

[[disposition]]
construct = "pair tables (potential, closure, omega)"
disposition = "out_of_scope"
reason = "The tables are in-memory containers keyed by site-type pair whose cells are code objects (a potential, a closure, an omega); the knowledge is in those objects, mapped as their own constructs, and the symmetric flag only governs how entries are assigned."

[[disposition]]
construct = "pair potential object"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The five potentials map to forms with epsilon, sigma, alpha and cut-off slots per site-type pair; epsilon in units of kT and sigma in reduced length are assumed since none is stated, the default sigma taken from the diameter table is a rule, and high_value, a large finite stand-in for an infinite core, is a numerical device that is not kept."

[[disposition]]
construct = "intramolecular correlation function object"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The analytic omega functions map to forms with length, sigma or l and lp as slots over a site-type pair, and arrays or files to a tabulated_function of k, all in reduced units that are not stated; the architecture stays implicit in the choice of form and its length as in the source, and tables made by the Debye method carry no recorded lineage."

[[disposition]]
construct = "Domain (radial real and Fourier grids)"
disposition = "out_of_scope"
reason = "The real-space and Fourier grids and their discrete sine transforms are numerical discretisation, the solver state of one calculation, and hold no thermodynamic knowledge."

[[disposition]]
construct = "closure object"
disposition = "held_by_model"
ref = "relation:subject_subform_choice"
reason = "The closure (PY, HNC, MSA and the molecular ones) is a form of the closure catalogue chosen per site-type pair, which is what subject_subform_choice records, with apply_hard_core a variant of the form; it is not a parameter of a species and need not be."

[[disposition]]
construct = "reference correlation tables (data files)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The 45 files map to datasets of the intramolecular correlation, structure factor and pair correlation with a tabulated_function of k or r, the observables being vocabulary data; the header system parameters are free text mapped only as far as dataset conditions can state them, values are in reduced units that are not stated, and digitised files carry no digitisation uncertainty."
