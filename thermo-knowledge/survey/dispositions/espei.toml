[[disposition]]
construct = "dataset record (common envelope)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "A file becomes a dataset (its kind stated by the mapping from the output and solver keys, since the source infers it from key presence) with dataset_component, dataset_phase and dataset_column rows and one datum per value, and the weight maps to derivation_input.weight only when a fit derivation can name the dataset. The fit controls and hints of the program (excluded_model_contributions, tags, disabled, plot, broadcast_conditions) are not kept, no uncertainty is written because the source has none per point, and the units (J/mol-atom, K, Pa, mole fractions) come from the ESPEI documentation, not the file."

[[disposition]]
construct = "single-phase fixed-configuration dataset (solver block)"
disposition = "mapping_loss"
ref = "kind:dataset_column"
reason = "The configuration and site occupancies of each point are site fractions of species on the sublattices of one phase: dataset_column names the site_class, and its dataset_phase the phase_definition it reports on, so a column says which sublattice a species or site fraction belongs to; the implied formation reference (elements in the TDB's reference phase at the same T) is a separate mapping assumption."

[[disposition]]
construct = "equilibrium thermochemical dataset"
disposition = "mapping_loss"
ref = "relation:element_reference"
reason = "The reference_states dict becomes an energy_reference with an element_reference row per element (its phase) and the R-suffixed outputs a difference_from_reference presentation, but the optional fixed_state_variables become the reference temperature and pressure of a column, which holds only when they agree across elements since a column carries one reference state. The pinned espei_datasets holds no dataset of this kind, and the documentation's statement that only activity data are supported is a program limit that is not stored."

[[disposition]]
construct = "activity dataset (ACR)"
disposition = "mapping_loss"
ref = "kind:standard_state"
reason = "The activity becomes a column of an activity observable (added to the vocabulary) whose standard_state is a pure_real state at the stated pressure, but standard_state carries no phase, so the reference phases allowed in the reference calculation and a reference temperature that differs from the data's are kept only as a dataset_phase label and a reference_temperature. The R T ln a relation with pycalphad's R = 8.3145 belongs to the program's error function and is not stored."

[[disposition]]
construct = "phase boundary (ZPF) dataset and tie-line point"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "A phase region becomes one data point whose columns are the temperature constraint and, per dataset_phase, the mole fractions of all but the dependent component, a null composition being a datum of state not_measured, and the mapping splits the file into datasets by phase set so that a phase absent from a region is not confused with an unknown composition. The dependent component implied by mass balance is not stored, the 'disordered' flag has no typed slot and survives only as a dataset_phase label, and __HYPERPLANE__ is used by no pinned dataset."

[[disposition]]
construct = "tags and apply_tags"
disposition = "out_of_scope"
reason = "A per-run rewrite of dataset fit controls (weights, excluded contributions) is program behaviour that holds no thermodynamic knowledge, and no dataset of the pinned repository carries a tag."

[[disposition]]
construct = "phase models JSON"
disposition = "mapping_loss"
ref = "relation:disordered_partner"
reason = "Components, sublattice_model, site ratios and equivalent_sublattices map to chemical_system, phase_definition, site_class, site_occupant and site_equivalence, and an alias (BCC_B2 also describing BCC_A2) says one phase is the disordered partner of an ordered one, which the relation disordered_partner holds. The refdata key is unread by the source and the model class import path is program behaviour, so neither is kept."

[[disposition]]
construct = "run settings (input YAML)"
disposition = "mapping_loss"
ref = "kind:fit"
reason = "Only the settings that change the fitted values (ref_state, ridge_alpha, aicc_penalty_factor, prior, data_weights, the symbols fitted) can be kept, as text in the fit's objective and derivation method with data_weights as derivation_input.weight. Execution settings (verbosity, output and trace files, iterations, scheduler, cores, seeds, deterministic, approximate_equilibrium) are process configuration and are not kept, and the pinned source holds only the schema, no settings instance."

[[disposition]]
construct = "reference data sets (refdata)"
disposition = "mapping_loss"
ref = "enum:enthalpy_datum"
reason = "refStable and ref become temperature-function parameter sets (model_components whose GHSER and G-phase names are labels) of a parameterization whose convention_set has datum stable_element_reference, and refSER becomes element_reference rows with the mass as separate atomic-weight data, so mixing mass and thermochemical data is only an arrangement. The datum is implied by the code's names, the per-mole-of-atoms energy units are inferred, SR2016 states no source, and the differences from unary v5.0 (the Al constant -11278.378 against -11278.361) are equivalence assessments of level conflicting, not reconciled."

[[disposition]]
construct = "fitted parameter symbols and outputs"
disposition = "mapping_loss"
ref = "kind:fit"
reason = "The optimum values become parameter sets produced by a fit of outcome not_stated, the symbol-to-coefficient link being read from the PARAMETER expressions (the VV#### names carry none) and the values taken as rounded to six significant figures. The TDB records no datasets, ridge alpha, penalty factors, covariance or ESPEI version, so derivation_input rows, fit_free_parameter uncertainties and fit_correlation rows are not written and the trace and lnprob arrays are not kept."
