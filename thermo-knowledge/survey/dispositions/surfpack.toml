[[disposition]]
construct = "component set (ThermoPack identifier string)"
disposition = "out_of_scope"
reason = "The comma-separated ThermoPack identifiers are the input of one calculation that names components, and both identity and parameters are delegated to ThermoPack, which carries them; the string holds no knowledge of its own."

[[disposition]]
construct = "weighted-density weight set"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The functional is catalogued as a form with completeness structure_declared_equation_external, because weight functions stored as Fourier transforms and a functional of density fields lie outside a pointwise expression; the weights are authored analytic functions in code and their definitions are not kept."

[[disposition]]
construct = "density profile (Profile) and grid"
disposition = "out_of_scope"
reason = "A Profile is the computed state of a calculation, a density field on a solver grid that the profile solvers or constructors produce, so it is a state at a process location and solver discretisation and not knowledge about material."

[[disposition]]
construct = "external potential"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The wall-fluid potentials (9-3 Lennard-Jones, Steele 10-4-3, Mie, square well) are forms pointwise in a distance argument with subject an adsorbate and a host material and parameters sigma and epsilon as slots; the hard wall and slit pore are setup geometry of one calculation and are not catalogued."

[[disposition]]
construct = "solver specification"
disposition = "out_of_scope"
reason = "Picard and Anderson-mixing schedules, tolerances, grid refinement and the four tuned solver keys are solver settings, procedural tuning of the profile solvers rather than thermodynamic knowledge."

[[disposition]]
construct = "planar LJ-spline MD profile row"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The rows map to a computed dataset with position and local-state columns, but no units or method are stated, so the mapping assumes reduced Lennard-Jones units from the star notation and keeps values as dimensionless numbers without the sigma and epsilon/k of the scripts, recording the simulation details as not stated."

[[disposition]]
construct = "LJTS critical and surface tension table"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The critical and surface-tension columns map to a dataset under an assumed reduced-unit scale with origin not stated, the cut-off radius Rc being a condition of the model variant; the twice-listed Rc of 4.0 with different numbers is kept as two points, and the NaN cells (15 of 60) are read as not_measured, an assumption."
