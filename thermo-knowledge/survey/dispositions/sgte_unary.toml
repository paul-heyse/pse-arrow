[[disposition]]
construct = "file header and change log"
disposition = "mapping_loss"
ref = "relation:supersedes"
reason = "Version 5.0 and the title become the revision and title of the parameterization, but the change log is free text and is not parsed: the versions it compares with (3.0 and before) are not carriers in the pinned tree, so no supersedes row or per-parameter revision can be written. The log is not kept as typed data."

[[disposition]]
construct = "ELEMENT (reference phase, mass, H298-H0, S298)"
disposition = "mapping_loss"
ref = "relation:element_reference"
reason = "The reference phase of each element becomes an element_reference species_form (N and O name half a mole of N2 and O2 gas) under an energy_reference whose datum stable_element_reference is the SGTE convention inferred from the columns, not a statement of the file. H298-H0 and S298 are both zero for 29 of 78 elements, which the file does not distinguish from not given, their units are inferred, and the names ORTHORHOMBIC_AC and RHOMBOHEDRAL_SM (Np, Sm) match no declared PHASE, so their aggregation and polymorph are assumed from the names."

[[disposition]]
construct = "SPECIES and the GAS phase"
disposition = "mapping_loss"
ref = "relation:convention_standard_state"
reason = "N2 and O2 become species with a gas species_form and GAS a phase_definition of aggregation gas, the half-molecule SER reference of N and O following from G(GAS,N2) = 2*GHSERN. The gas parameters state no pressure dependence or standard pressure, so the mapping records no standard_state for the gas member role (not stated) instead of assuming 1 bar or 1 atm."

[[disposition]]
construct = "PHASE and CONSTITUENT"
disposition = "mapping_loss"
ref = "kind:phase_definition"
reason = "The 34 phases become phase_definitions with site_class rows (the ratios 1:3 for BCC_A2 and 1:0.5 for HCP_A3 kept as stated, the VA sublattice a vacancy site_occupant) and the constituent lists become site_occupant rows. The prototype is encoded only in the phase names (A1, A2, A3), so it is left absent rather than parsed from a name, aggregation is assumed (liquid for LIQUID, gas for GAS, crystalline otherwise), and the type characters, including the undefined I, are kept verbatim in source_directives."

[[disposition]]
construct = "FUNCTION GHSER (element energy relative to SER)"
disposition = "mapping_loss"
ref = "enum:enthalpy_datum"
reason = "Each GHSER function becomes a temperature-function parameter set (a model_component) of the Gibbs-polynomial form for the element in its reference phase, under an energy_reference of datum stable_element_reference. The file states no datum: taking the enthalpy of the reference phase at 298.15 K as zero is inferred from the function name and the ELEMENT columns, so it is a mapping assumption, as are the J/mol units."

[[disposition]]
construct = "FUNCTION lattice stability (G<phase code><element>)"
disposition = "held_by_model"
ref = "kind:model_component"
reason = "A lattice-stability function is a model_component whose term family holds the polynomial and a set reference to the element's GHSER function, so the symbol reference inside the expression is a set reference and not a dependency the mapping must invent. The function names (GHCPAG, GBCCAG) are labels and are not parsed for the phase or element."

[[disposition]]
construct = "PARAMETER G (unary endmember energy)"
disposition = "mapping_loss"
ref = "relation:attribution"
reason = "Each G parameter becomes a parameter set of an endmember form whose subject is the constituent_array of the phase (the element, or the element and VA), its expression an inline polynomial or a set reference to a function, and the order, always 0 and meaningless for an endmember, is dropped. The 16 'Source of data' comments attach to the parameters that follow them only under a mapping assumption about comment scope, and the other parameters stay unattributed."

[[disposition]]
construct = "PARAMETER TC and BM/BMAGN (magnetic)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "TC and BM or BMAGN (BM expanded as the abbreviation of BMAGN) become slots of the array-level group of a magnetic form, a negative TC being held in a TemperatureDifference slot. The file states neither the antiferromagnetic sign convention (a negative value divided by the phase's afm factor) nor the units (K, Bohr magneton), so the mapping assumes both from the TDB format."

[[disposition]]
construct = "TYPE_DEFINITION"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The four MAGNETIC definitions become the afm-factor and structure-factor slots of a phase-level group of the magnetic form for CBCC_A12, BCC_A2, FCC_A1 and HCP_A3, the assignment of the two numbers to those slots being the TDB format's and not stated in the file. The sequence marker '% SEQ' carries nothing, and the type character I, which no TYPE_DEFINITION defines, has no recoverable meaning and is kept only verbatim in source_directives."

[[disposition]]
construct = "DEFINE_SYSTEM_DEFAULT and DEFAULT_COMMAND"
disposition = "out_of_scope"
reason = "Thermo-Calc command-interpreter defaults (a system starts with the vacancy as an element), which are program behaviour holding no thermodynamic knowledge; the vacancy is a species in the model regardless."
