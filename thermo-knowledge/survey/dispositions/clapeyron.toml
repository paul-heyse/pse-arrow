[[disposition]]
construct = "Clapeyron Database File (framing)"
disposition = "mapping_loss"
ref = "kind:parameterization"
reason = "The file names no form, parameterisation key or revision, site scheme or convention set, so the mapping asserts all of them from the directory and from the model that lists the directory as its default location; line 2 is free text that also carries the kind keyword, so it is kept only as source text and the keyword scan the reader applies (and its silent skip of a line with two keywords) has to be reproduced by the mapping."

[[disposition]]
construct = "csvtype option list"
disposition = "mapping_loss"
ref = "kind:group_scheme"
reason = "grouptype names a scheme (UNIFACDortmund, originalUNIFAC, PSRK, VTPR, gcPCPSAFT) but no revision, and the Dortmund and UNIFAC 2.0 refit files share one name, so the mapping must assign group_scheme.revision per file from the directory; csvtype and sep only steer the reader and are not mapped."

[[disposition]]
construct = "species key (normalised name with alias lists)"
disposition = "mapping_loss"
ref = "kind:identity_assertion"
reason = "Each cell becomes one `name` identity assertion per '~|~' alias on a source entity whose class the mapping states, with no assertion status, because the source matches by normalised string equality and cannot see an alias shared by two compounds; such a clash appears as an ambiguous resolution, not as something the source stated."

[[disposition]]
construct = "like / single parameter file"
disposition = "mapping_loss"
ref = "kind:parameter_set"
reason = "One parameter_set per row, but the file states no parameterisation, site scheme or aggregation, so the mapping asserts them from the directory; the duplicate species rows (8 in PCSAFT_like.csv) are kept as occurrences 1 and 2 with the reader's later-row-wins rule recorded as a selection fact, so nothing is dropped."

[[disposition]]
construct = "unlike / pair parameter file"
disposition = "held_by_model"
ref = "kind:parameter_set"
reason = "The transposition rule (symmetric by default, ordered for the parameters the source lists in asymmetricparams) is declared on the pair slot group of the form the mapping names for the table and values are stored as asserted with their arrangement, which is only a difference of arrangement; the 8 gc-PCP-SAFT self-pair rows are kept because the group declares diagonal = allowed."

[[disposition]]
construct = "assoc / association parameter file"
disposition = "mapping_loss"
ref = "kind:site_scheme"
reason = "Sites are free labels (H, e, e1, e2, a, b) with counts taken from n_<site> columns and no named scheme, so the mapping must infer the site_scheme from labels and counts; both orientations of an asymmetric cross pair that the file lists are kept as two occurrences with the reader's canonicalise-and-later-wins rule recorded, and an explicit cross 0 is stored as known although the source cannot tell it from an absent pair."

[[disposition]]
construct = "groups file"
disposition = "mapping_loss"
ref = "kind:group_assignment"
reason = "Each row gives group_count rows under a group_scheme whose revision and kind of label (subgroup, main group, first or second order) the file does not state, so the mapping asserts the scheme and the UNIFAC main-group structure is not recovered from this file; salts.csv lists ions, not fragments, and maps to speciation_coefficient rows of a speciation_map instead of a group_assignment."

[[disposition]]
construct = "intragroups file (group connectivity)"
disposition = "model_change"
ref = "alignment-notes #21"
reason = "The declaration holds group counts (relation group_count keyed by assignment and group) but no bond between two groups of one assignment; add a relation group_bond_count keyed by (assignment, group, group) with a Count value, symmetric with diagonal allowed, provenance inherit:assignment, so the intragroups matrix n_intergroups of the heterosegmented models has a home."

[[disposition]]
