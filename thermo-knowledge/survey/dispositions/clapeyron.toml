reason = "A DOI-shaped cell (10828 rows) becomes a publication and an attribution of the import record, but the 374 free-text cells carry no DOI and cannot become publications, an empty cell means unattributed and not unpublished, and attribution is per row, so jointly fitted columns are not tied to one fit and origin_role cannot be derived."

