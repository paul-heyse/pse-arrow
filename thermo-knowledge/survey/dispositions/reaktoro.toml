[[disposition]]
construct = "database document"
disposition = "mapping_loss"
ref = "kind:parameterization"
reason = "The file states no identity, version, convention or provenance, so the mapping names the parameterisation and chemical system from the file name and the pin and records that no convention set is stated. No unit is stated in the file (SI is the library's documented convention) and an Elements section is optional."

[[disposition]]
construct = "species record"
disposition = "mapping_loss"
ref = "kind:species_form"
reason = "Formula, Charge and Elements become a species form with explicit composition rows (the redundancy is checked by charge_matches_composition), and with no structure identifier the species is identified by formula, charge and aggregate state in a declared formula-identified scope. AggregateState is read from the field, never from a name suffix, but Aqueous (a liquid solute), Solid (crystalline or amorphous is not said) and CondensedPhase (liquid or solid is not said) each need an assumption."

[[disposition]]
construct = "StandardThermoModel block"
disposition = "held_by_model"
ref = "relation:entity_model"
reason = "The single model name of the block selects the standard-state form of the species form, which is an entity_model assembly row under the database's parameterisation, so one model per species is how the declaration already holds it and alternatives from other compilations are other parameterisations. Tmax is a validity region and the apparent (HKF) energy convention is the energy_reference of the convention set."

[[disposition]]
construct = "FormationReaction block"
disposition = "held_by_model"
ref = "relation:system_reaction"
reason = "The reaction is a reaction with participants and a system_reaction row whose defines column is the product, which is how a species defined by a reaction is held; the source's positive-reactant sign is reversed by the mapping to the model's negative-reactant sign, a stated convention that loses nothing. No shipped Reaktoro-format file contains one, so the block is exercised only through the PHREEQC conversion."

[[disposition]]
construct = "Pitzer parameter file"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The eleven correction forms chosen by name are nested sets accepting a temperature-function contract and the triples use permutation_group transposition, both held, but the coefficient units (beta in kg/mol, C-phi in kg^2/mol^2) are not stated and are inferred by Pitzer convention. A missing entry means zero interaction to Reaktoro while the mapping emits no set for an unlisted tuple, and the validity of the PHREEQC-derived values (about 0 to 60 C) is not stated per parameter."

[[disposition]]
construct = "Extended UNIQUAC parameter file"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The four versions are four parameterisations of r, q and symmetric-pair u forms with a temperature family whose length differs by version, and the uP pressure term of v2023 is a separate form, all data of the form catalogue. The u0 of 1e16 the code uses for a missing pair is a selection_policy stated default, not a stored pair."

[[disposition]]
construct = "Palandri-Kharaka parameter file"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "Each mechanism is a row of a family keyed by its name, with the catalyst a species reference slot and its exponent a slot, the catalyst being extracted from the key text a(H+) by the mapping, and the aliases are identity assertions on the mineral's source entity. The surface area, the mineral's reaction and the gas constant 8.3144621 come from the consumer and the convention set, not from the rows."

[[disposition]]
construct = "cubic EoS parameter file"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The constants of the five equations (sigma, epsilon, Omega, Psi and the alpha-function coefficients) are the form catalogue's own and the four H2O kij are symmetric pair parameter sets; that the library never reads the file and hard-codes its constants in Support/CubicEOS.cpp is a survey discrepancy, not lost content."

[[disposition]]
construct = "PHREEQC keyword blocks as Reaktoro consumes them"
disposition = "out_of_scope"
reason = "This describes which parts of a PHREEQC database Reaktoro's extraction copies into its own structures, a consumer's behaviour; the content of the 14 embedded .dat files is mapped as PHREEQC database constructs (phreeqc survey), so what the extraction drops is not content lost from the source."

[[disposition]]
construct = "NASA CEA species as converted (nasa-cea)"
disposition = "mapping_loss"
ref = "form:nasa9"
reason = "Each interval's State splits a species into one species form per aggregate state with its own nasa9 pieces, so a species merged under one Name becomes several forms, and the gas constant, which the JSON does not state, must be assumed for the a1..a7, b1, b2 that are coefficients over R. The enthalpy datum of dHf and dH0 is not stated and the version of the converter is not recorded."

[[disposition]]
construct = "SUPCRT linearized line and the legacy XML species"
disposition = "mapping_loss"
ref = "mechanism:payload selection"
reason = "Only the current JSON content is mapped: the SUPCRT model codes and scaled units reach the JSON through the generator (cal to J at 4.184), while the legacy XML, with its different species set and its Dissociation, acentric-factor and temperature-range blocks that the model could hold as reactions, an observable and validity regions, is not mapped."

[[disposition]]
construct = "built-in element, critical-property and dissociation tables"
disposition = "mapping_loss"
ref = "kind:convention_set"
reason = "The 120 element molar masses carry no stated atomic-weight edition, so convention_set.atomic_weights stays absent, and the 89 critical-property rows and 170 dissociation reactions are keyed only by alias names and formulas, so they become identity assertions that resolution may leave ambiguous. The sources of the critical data are not linked, so their origin is recorded as not stated."
