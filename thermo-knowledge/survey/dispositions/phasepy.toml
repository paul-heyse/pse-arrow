[[disposition]]
construct = "component"
disposition = "mapping_loss"
ref = "mechanism:split by consuming form"
reason = "The mapping splits the object into one parameter set per form that reads its fields (critical constants, Antoine, Rackett inputs, UNIQUAC r and q, SGT polynomial, fusion properties) for a species known only by its label; it assumes the Antoine units from the docstring equation (ln(P/bar), B and C in K) and cannot tell an absent parameter from its zero default. The nine SAFT fields (ms, sigma, eps, lambda_r, lambda_a, eAB, rcAB, rdAB, sites) are read by nothing in PhasePy and are not mapped."

[[disposition]]
construct = "mixture"
disposition = "out_of_scope"
ref = ""
reason = "It is the user's working assembly for one calculation: an ordered component list, the active activity model (actmodelp, last setter wins) and the attached matrices, which are mapped through their own constructs, so the assembly itself holds no knowledge beyond them."

[[disposition]]
construct = "quadratic mixing rule kij matrix"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Maps to the k_ij slot of a quadratic-mixing-rule form, but the source picks symmetric or asymmetric by the balanced flag of the call, which is not in the data, so the mapping assumes an ordered pair group with both orientations asserted unless the matrix is symmetric. A missing matrix means zeros inside the EoS constructor, a policy and not a stored value, and the zero diagonal is not stored."

[[disposition]]
construct = "Wong-Sandler and SAFT kij matrices"
disposition = "mapping_loss"
ref = "relation:dependency"
reason = "Kijws maps to a symmetric pair slot of the Wong-Sandler form, but its meaning is tied to the pure a and b of the chosen alpha function, which the source does not name, so the dependency on those pure sets cannot be recorded. KIJsaft is read by no model and is not mapped, and a non-zero diagonal of Kijws is accepted by the code though documented as zero."

[[disposition]]
construct = "NRTL interaction matrices"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Maps to an NRTL form with an ordered pair group for g and g1 and a symmetric one for alpha; the docstring gives g1 in 1/K while tau = g/T + g1 makes it dimensionless, so the mapping takes the dimension from the equation the code evaluates. An absent g1 means zeros, which is a stated default of a policy and not a stored value."

[[disposition]]
construct = "ternary NRTL correction vector"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Held by a slot group whose subject is the ordered triple (i, j, k) of the three components with the three D values as a family over position, so the pair-keyed limitation of the survey no longer applies; what is assumed is the unit of D (not stated, taken as dimensionless from the routine) and that the vector's order is the subject order. The form is reconstructed from the Cython routine alone, because the docstrings omit nrtlt."

[[disposition]]
construct = "Wilson interaction matrix"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "Slot A (K) of an ordered pair group of a Wilson form with a sub-form slot for the pure liquid molar volume (Rackett, chosen per subject), so the energy-in-K parameterisation with volumes from a correlation is one form among those that share the name Wilson, and slots are form-local. The as-coded transposed orientation of Lambda_ij is fixed by the form's expression."

[[disposition]]
construct = "UNIQUAC interaction matrices"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The form's expression carries the coordination number as the literal 5 (z/2 with z = 10), which is where the source also fixes it, so no slot is lost; a0 (K) and a1 (dimensionless) are ordered pair slots and r and q pure slots of the same form."

[[disposition]]
construct = "Redlich-Kister pair polynomials"
disposition = "held_by_model"
ref = "mechanism:parity transposition"
reason = "The pair slot group declares transposition parity by the polynomial order with a family over order holding c and c1, so the sign of the odd coefficients under the positional (i, j) row order is held as data with the arrangement recorded. The positional pair list is restored to component identities by the mapping."

[[disposition]]
construct = "UNIFAC component group assignment (GC)"
disposition = "mapping_loss"
ref = "kind:group_assignment"
reason = "Maps to group_assignment rows with group_count values, but the scheme (Dortmund 2018, 2021 or original) is implicit in which workbook the called method reads, so the mapping must assume one per call. A subgroup name duplicated in a workbook (CHO) cannot be assigned unambiguously and the row is held."

[[disposition]]
construct = "UNIFAC subgroup record (RkQk row)"
disposition = "model_change"
ref = "alignment-notes #21"
reason = "Subgroups become group rows of a scheme whose revision comes only from the workbook file name, with Rk and Qk as slots and the main group as partition_class; because a group's identity is (scheme, label), the duplicated names (CHO twice in both Dortmund files, CH3S, CH2S and CHS in original-unifac) cannot keep the bare name, and the mapping qualifies the label by main group. Rk and Qk carry no unit and are taken as dimensionless."

[[disposition]]
construct = "UNIFAC main-group interaction cell (Dortmund A0, A1, A2)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Maps to a modified-UNIFAC pair group over main groups with slots a0, a1, a2; the sheets label rows and columns alike, so the mapping assumes the orientation the code uses (row m, column n), and the units K, dimensionless and 1/K are inferred from psi = exp(-a/T). A blank cell produces no set (the source's fillna(0) is a stated default of a selection policy), while the explicit zeros of the 2018 file are stored as known."

[[disposition]]
construct = "original UNIFAC main-group interaction matrix (A0 sheet)"
disposition = "mapping_loss"
ref = "mechanism:row labels from Sheet1"
reason = "The 55 body rows carry positional labels 1 to 51 that are wrong for main groups above 29, so the mapping rebuilds the row-to-main-group association from Sheet1 instead of trusting GroupID, an assumption read off a comparison of the sheets (the library was not run). Eleven main groups of RkQk have no column, so pairs with them produce no set, and the unit K is inferred from psi = exp(-a/T)."

[[disposition]]
construct = "legacy unifac.xlsx tables"
disposition = "mapping_loss"
ref = "kind:group_scheme"
reason = "The tables could be held as a name-keyed UNIFAC group scheme with a parameterisation, but nothing states their variant or revision (no code, document or citation refers to them; the properties date them 2018-09), so scheme revision and origin would be not stated. PhasePy never reads them, so no qualification against the source is possible."

[[disposition]]
construct = "SGT influence parameter polynomial and beta matrix"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Maps to a square-gradient-theory form with a pure family over polynomial order (highest first, numpy.polyval) and a symmetric pair slot beta; that the source keeps them on different objects does not matter to one parameterisation. The influence-parameter unit is stated twice for one polynomial (J m5 mol-2 in the cubic classes, J m5 / mol in component.ci), and the mapping takes J m5 mol-2, the one the tension scaling is consistent with."

[[disposition]]
construct = "SAFT-VR-Mie corresponding-states coefficient tables"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The six 6 x 6 tables are the coefficients of the Mejia et al. (2014) correlation, held as the parameter set of a form whose outputs are the Mie parameters, with a derivation of kind estimation for the values it produces; that PhasePy has no consumer of those values concerns the source's programs, not the knowledge. The segment-number extent 1 to 6 is the extent of the family index."
