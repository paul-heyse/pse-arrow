[[disposition]]
construct = "document key and identity convention"
disposition = "held_by_model"
ref = "kind:source_entity"
reason = "Each vertex is a source entity keyed verbatim by its composite key (symbol, class code, source-database code), so the same symbol from two source databases is two source entities that resolution joins by identity assertions or leaves apart, and the source has no identity link to record. The integer codes are read with their snapshot's label, never as numbers alone."

[[disposition]]
construct = "substance vertex"
disposition = "mapping_loss"
ref = "kind:species_form"
reason = "As for the ThermoFun substance record (split by method, standard state and solvent assumed, a stored zero error not read as zero), with the source database as the parameterisation and standard_cscale as the scale of the standard state where present. The unit-free mass_per_mole is assumed to be g/mol and the electron's 548579903 (0.000548579903 times 1e12) is not taken literally, and aggregate_state code-label pairs differ from ThermoFun's enum so the label is read, not the code."

[[disposition]]
construct = "reaction vertex"
disposition = "mapping_loss"
ref = "relation:system_reaction"
reason = "The takes edges give the signed stoichiometry (rct marks products) and the defines edge the defined species, which is a reactant in 496 of 2525 pairs, so the reaction is a system_reaction with defines and not an independent fact. Only standard_cscale on ThermoChimie substances states a scale, so the participants' standard states are assumed from the convention set."

[[disposition]]
construct = "reaction method blocks new to ThermoHub"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The five logk_ft_coeffs are named A1..A5 against ThermoFun's A0..A6 and no block states a unit, so the term each coefficient multiplies and whether the logarithm is natural or decimal are inferred from the ThermoChimie analytic form, an assumption the mapping records. The same holds for dr_heat_capacity_ft, dr_volume_fpt (cm3/mol or J/bar inferred) and the Marshall-Franck blocks."

[[disposition]]
construct = "nasa_polynomial method entries"
disposition = "mapping_loss"
ref = "form:nasa9"
reason = "The survey's candidate is wrong: the 9-value blocks a1..a7, b1, b2 are pieces of the nasa9 form (not nasa7) over 298.15, 1000, 6000 and 20000 K, and blocks of other lengths fit no declared form and are not mapped. The aggregate state is AS_OTHER and the gas constant, the enthalpy datum of sm_enthalpy (J/mol inferred) and the coefficient units are not stated, so the mapping assumes them."

[[disposition]]
construct = "element vertex"
disposition = "model_change"
ref = "alignment-notes #17"
reason = "LIGAND and OTHER_EC elements and the decoupled nitrogen Nit are conserved quantities that are not chemical elements, charge or site totals, which enum:conserved_kind cannot hold; add members for a decoupled inventory of an element and for a moiety or ligand placeholder. The isotope_mass and isotope_abundance fields need the isotope member proposed for PHREEQC ISOTOPES, and the reference-form entropy belongs to the energy reference of the convention set."

[[disposition]]
construct = "thermodataset vertex and reactionset vertex"
disposition = "mapping_loss"
ref = "kind:parameterization"
reason = "The dataset becomes a parameterisation, a chemical system (from the pulls and basis edges) and a convention set that the file does not state, with limitsTP a validity region of the parameterisation in K and Pa (units inferred). TDS_LMA and TDS_GEM select different forms (equilibrium constants against standard-state properties), which the mapping states per dataset."

[[disposition]]
construct = "datasource vertex"
disposition = "mapping_loss"
ref = "relation:citation"
reason = "Authors, journal, volume, number and pages are kept only inside the citation text and the title and year as attributes, and the abstract, keywords, annotation, editor, publisher and links are not kept. Only one of 277 hub_ord records carries a DOI, so a publication is identified by the carrier key built from the short name, not by the work."

[[disposition]]
construct = "graph edges of the substance-reaction-dataset graph"
disposition = "mapping_loss"
ref = "relation:attribution"
reason = "takes, defines and master edges become reaction_participant rows, system_reaction.defines and basis system_member roles, and pulls and basis edges dataset membership. A citing edge's for_field (which fields of a record a datasource supports) survives only as the locator of its import record, because attribution is per import record and the model cannot say which slot a publication supports."

[[disposition]]
construct = "phase vertex, component edge and mixing model"
disposition = "mapping_loss"
ref = "kind:phase_definition"
reason = "Each phase is a phase_definition of structure none (the file states no sublattices) with its substances taken from the component edges (Ncomps is 1 in all 840 phases and is ignored) and its mixing model an assembly choice. The non-ideal solid-solution parameters are free text in temp_import with blank-padded names and no units, which the mapping parses into slots of an assumed Redlich-Kister form with assumed units."

[[disposition]]
construct = "SIT interaction vertex and its edges"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Each interaction is a symmetric pair set of a SIT form, the species order in the key text being arbitrary, with the 1856 stored zeros kept as known zeros and the 36 interactions without a value giving no set. The unit of epsilon (kg/mol by SIT practice) is not stated, and the Tst of 298.5 in all 3428 records differs from the 298.15 K reference of the form, so the mapping does not use it."
