[[disposition]]
construct = "index of IAPWS documents (release.html)"
disposition = "mapping_loss"
ref = "kind:publication"
reason = "Each of the 43 documents becomes a publication keyed by carrier and identifier, with the revision note kept only as citation text, because the earlier revisions it says are replaced are not acquired and so no supersession can be written between records."

[[disposition]]
construct = "rights statement on the cover page"
disposition = "mapping_loss"
ref = "kind:rights_determination"
reason = "Each cover statement becomes a rights_determination quoting it, but the mapping has to choose the store, redistribute and commercial permissions because neither wording names a licence, and the statement covers the document, not its numerical content."

[[disposition]]
construct = "computer-program verification values (IAPWS-95, R6-95(2018))"
disposition = "held_by_model"
ref = "relation:dataset_verifies"
reason = "A verification dataset linked by `dataset_verifies` rows to the IAPWS-95 assembly and to the parameterisation of its coefficients, with T and density as variable columns and pressure as a property column, so a qualification run takes inputs and outputs as the tables give them; origin computed."

[[disposition]]
construct = "computer-program verification values (IAPWS-IF97, R7-97(2012))"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The verification tables of each equation map to verification datasets, but Tables 43 and 44 (maximum and rms differences between equations along region boundaries, compared with Prague values) state agreement between two formulations and no current concept holds them, so they are not mapped."

[[disposition]]
construct = "verification tables of the other documents"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "Tables that mix computed and observed columns (G2-90 Table 1, with '--' for unavailable observed values) split into a computed and a measured dataset with not_measured points, and the SR3 and SR4 tables of differences state consistency statistics that no concept holds, so they are not mapped; the two scans are transcribed from page images."

[[disposition]]
construct = "IAPWS-95 coefficient tables (Tables 1 and 2)"
disposition = "mapping_loss"
ref = "kind:convention_set"
reason = "The forms and 64 coefficients map directly, but the specific gas constant 0.46151805 kJ/(kg K) must be stated as a molar constant with the molar mass 18.015268 g/mol assumed, the zero of u and s at the triple point is recorded only as energy_reference text (its enthalpy datum is not internal energy), and the release does not say which envelope kind its stated ranges are."

[[disposition]]
construct = "IAPWS-95 uncertainty statements (Section 6, Figs. 1 to 4)"
disposition = "held_by_model"
ref = "relation:accuracy_statement"
reason = "Estimated uncertainties of density, speed of sound, isobaric heat capacity and saturation properties are stated as a percentage per region of the (T, p) plane: validity_region holds the regions, and the relation accuracy_statement, keyed by record, observable and ordinal, holds the percentage with its region, an uncertainty kind (interval fits IAPWS 'tolerance'), a statistic (stated bound, maximum or rms) and an absolute or relative magnitude, under the magnitude-matches-kind rule of slot_uncertainty."

[[disposition]]
construct = "IF97 region structure and boundaries"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The region membership predicate is a conditional expression of a wrapper form that calls the B23 equation and the saturation equation as sub-forms, the limits of each region are validity_region clauses on T and p, and the B23 curve is an auxiliary_of row of kind validity_boundary, so nothing is forced to be an interval on one axis."

[[disposition]]
construct = "IF97 consistency tolerances and estimates"
disposition = "held_by_model"
ref = "relation:accuracy_statement"
reason = "IF97 states its consistency requirements as absolute and relative tolerances (25 mK on backward T(p,h), 0.2 kJ/kg on h, 0.05 % on v) with measured maximum and rms differences and uncertainty estimates in figures, which accuracy_statement holds against a second record with an observable and a magnitude in its unit, where auxiliary_of holds only a max_relative_error against its target."

[[disposition]]
construct = "IF97 coefficient tables by equation"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The Gibbs forms in (p, T) and the region 3 Helmholtz form in (rho, T) are forms with their own contracts (a form has no potential class), the shifted reduced variables (7.1 - pi)^I and (tau - 1.222)^J are in the expression with integer I and J family slots, and the backward equations are auxiliary_of rows; the second adjusted pair of region 2 ideal coefficients is a second slot group for the metastable use."

[[disposition]]
construct = "backward equations and boundary equations (SR2, SR3, SR4, SR5)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "Each backward equation is a form with an auxiliary_of row of kind approximate_inverse, and the choice among the 26 region 3 subregions is a chain of conditions on boundary-equation sub-form calls in a wrapper form, so the procedural selection is written in the expression."

[[disposition]]
construct = "ice Ih Gibbs potential (R10-06(2009))"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The complex constants t1, r1, t2 and r20 to r22 are stored as real and imaginary slots (Scalar for t, SpecificEntropy for r) of the terms of a family, and the form's expression carries the complex arithmetic in real terms with the principal logarithm taken by a sub-form (the grammar has an arctangent but no two-argument one), which a fixture compares with cmath, and the two s0 alternatives are two parameterisations, each with its own convention set, that share the other coefficients."

[[disposition]]
construct = "melting and sublimation curve equations (R14-08(2011))"
disposition = "mapping_loss"
ref = "relation:auxiliary_of"
reason = "The six curves map to forms with auxiliary_of rows, one of kind validity_boundary to the IAPWS-95 assembly and one of kind approximation to the ice assembly, but the expanded uncertainties (k = 2) of 2 %, 3 % and 7 % stated per equation have no record that holds a magnitude against observation and are not kept."

[[disposition]]
construct = "saturation-property equations (SR1-86(1992))"
disposition = "held_by_model"
ref = "relation:auxiliary_of"
reason = "The vapor-pressure equation has the form of vapor_pressure_exp_series_tau and every curve is an auxiliary_of row of kind approximation to the IAPWS-95 assembly, so the slight differences the release states from IAPWS-95 are the approximation's accuracy, not a second authority."

[[disposition]]
construct = "transport correlation structure (R12-08, R15-11, R17-20, R18-21)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "Each factor is a slot group of a transport form whose sub-form slot takes the equation of state for rho, cp, cv and (d rho/d p)_T, the viscosity form is a sub-form of the thermal-conductivity form, the industrial option is the same form under an IF97 assembly choice, and the correlation-length thresholds are slots per isotopologue."

[[disposition]]
construct = "verification of liquid water correlations at 0.1 MPa (SR6-08(2011))"
disposition = "mapping_loss"
ref = "relation:auxiliary_of"
reason = "The correlations map to forms with auxiliary_of rows of kind approximation to the IAPWS-95, viscosity and thermal-conductivity formulations, but the 'standard uncertainty with coverage factor k = 2' wording mixes vocabularies and no current record holds an output uncertainty against observation, so it is kept as text only."

[[disposition]]
construct = "critical-point values with coupled uncertainties (R2-83(1992))"
disposition = "mapping_loss"
ref = "kind:slot_uncertainty"
reason = "T_c, p_c and rho_c map to slots of a critical-constants set with slot_uncertainty of kind interval, but the pressure uncertainty, which the release expresses through the temperature deviation, is stored as an independent magnitude and the correlation is dropped; the density is stored as MassDensity under a declared critical_mass_density observable."

[[disposition]]
construct = "fundamental constants and basic constants of water (G5-01(2026))"
disposition = "held_by_model"
ref = "mechanism:quantity type PolarizabilityVolume"
reason = "G5-01 states the mean static dipole polarizability in cm^3, which is a PolarizabilityVolume (storage unit m^3, scale absolute); the atomic-weight, gas-constant and temperature-scale recommendations already map to one convention_set per revision."

[[disposition]]
construct = "advisory-note content (AN1-03, AN3-07(2018), AN6-16)"
disposition = "mapping_loss"
ref = "relation:dependency"
reason = "The roles of AN6 among the four mutually consistent potentials map to dependency rows of kind consistent_with, but AN3 is a derivative procedure (an algorithm, catalogued as a capability and not mapped) and the enthalpy uncertainty figures of AN1 are not kept, since no record states an output uncertainty and enthalpy has no datum without a convention."

[[disposition]]
construct = "heavy-water coefficient tables (R16-17(2018))"
disposition = "mapping_loss"
ref = "kind:energy_reference"
reason = "The molar parameter set maps with its own convention set (R = 8.3144598 J/(mol K), M = 20.027508 g/mol), but the zero of u and s of the saturated liquid at 276.969 K is recorded as energy_reference text only, and the melting and sublimation curves become auxiliary_of rows of kind validity_boundary without the release's statement that they are not recommendations."
