ref = "mechanism:form catalogue"
reason = "The arrays map to a multiparameter Helmholtz form with families of polynomial, exponential and ideal terms, but the constants are in Fortran with no per-value reference, so attribution is at the equation level only; the gas constant of the fit (Rgas_fit) is stated as the parameterization's convention, and which constant a run uses by default is a runtime switch kept only as a qualification condition."

[[disposition]]
