ref = "kind:pseudo_component"
reason = "Only the existence of a user-parameterised pseudo-component is data: it maps to a pseudo_component of kind abstract_component (asserted by the mapping, since no source statement gives the kind), and the placeholder Tc, Pc, acentric factor and molar mass are not imported."
