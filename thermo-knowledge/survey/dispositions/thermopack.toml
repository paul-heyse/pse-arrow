ref = "mechanism:form catalogue"
reason = "The 19 and 32 coefficients map to a family of an MBWR form plus gamma, with the unit of each coefficient derived from its power of density and the Pa, K, mol/L units of the code comments (assumed, not declared per value); SetNo is unused by the lookup, so the three C1 sets stay separate occurrences and the first-match rule is recorded as a selection fact."

[[disposition]]
construct = "multiparameter Helmholtz parameters in code (propane, hydrogen isomers, R134a, Lennard-Jones)"
