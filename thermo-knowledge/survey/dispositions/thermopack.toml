[[disposition]]
construct = "fluid record (identity block)"
disposition = "mapping_loss"
ref = "kind:source_entity"
reason = "Each ident becomes a source entity with a source_local assertion beside the cas, name and formula ones; the five hydrogen entries share CAS and InChI and stay distinct source entities settled by curated decisions, PSEUDO and LJF carry placeholder text that the mapping does not assert, and the InChI written without its InChI= prefix is completed by the mapping, an assumption. Molar mass is taken as g/mol from a generator comment, not from the JSON."

[[disposition]]
construct = "structure (element count string)"
disposition = "model_change"
ref = "alignment-notes #17"
reason = "Deuterium appears as its own element D in the count string, but the declared elements are the 118 chemical elements and conserved_kind has no isotope; add an isotope refinement of conserved_quantity (symbol, mass number, parent element; entities D and T) that composition can count beside its element, with a verify invariant tying the isotope to the element balance. The string is also the only composition record and duplicates formula without a stated consistency rule."

[[disposition]]
construct = "critical (critical point block)"
disposition = "mapping_loss"
ref = "kind:observable"
reason = "Tc and Pc map to the declared critical_temperature and critical_pressure and the compressibility to an observable declared as vocabulary data, each value attributed through the import_record to the block's single ref tag, which the mapping applies to all three; the PSEUDO placeholder constants (Tc 100 K, Pc 1e7 Pa, Zc 0.3) are not distinguishable from data and are declared absent. The Fortran image's truncated decimals and the run-time redefinition of criticals by some models are not in the JSON and not kept."

[[disposition]]
construct = "acentric_factor"
disposition = "mapping_loss"
ref = "kind:observable"
reason = "The value maps to an acentric-factor observable declared as vocabulary data, attributed through the ref tag (missing for 95 percent of records); 0.0 is stored for PSEUDO and the source cannot tell an acentric factor of zero from not available, so the mapping declares the PSEUDO value absent and maps every other 0.0 as known, an assumption."

[[disposition]]
construct = "boiling_temperature"
disposition = "mapping_loss"
ref = "kind:observable"
reason = "The value maps to a normal-boiling-temperature observable, and the pressure of the boiling point is implicit in the word normal, so the mapping assumes 101325 Pa; 0.0 for PSEUDO is not distinguished from a real zero and is declared absent."

[[disposition]]
construct = "triple (triple point block)"
disposition = "mapping_loss"
ref = "kind:observable"
reason = "Temperature and pressure map to triple-point observables, but 0.0 is the only absence marker (105 of 109 temperatures, 107 of 109 pressures) and the mapping declares every zero absent, since a zero triple temperature is not physical; the pressure unit is inferred as Pa because the field comment says temperature, and the triple_temperature of the melting and sublimation curves stays a second statement of the same quantity."

[[disposition]]
construct = "rackett_factor"
disposition = "held_by_model"
ref = "kind:selection_policy"
reason = "Z_RA maps to an observable value of the species, and the fallback that derives a Peneloux shift from it with the SRK and PR constants when no volume-shift set exists is a named rule recorded as a selection_policy with unasserted named_rule, its equation declared as a form in the wave that maps this source."

[[disposition]]
construct = "dipole_moment and quadrupole_moment"
disposition = "model_change"
ref = "alignment-notes #34"
reason = "The quadrupole Q is given in Angstrom*Debye but model/physical.toml has a DipoleMoment type and no quadrupole quantity type; add a QuadrupoleMoment quantity type (storage unit C*m^2, signed scale). The dipole maps to DipoleMoment with D converted exactly, and 0.0 meaning none or unknown is a mapping assumption."

[[disposition]]
construct = "reference_state (enthalpy and entropy of formation data)"
disposition = "mapping_loss"
ref = "kind:energy_reference"
reason = "The 298.15 K values map to an energy_reference with a formation_from_elements enthalpy datum and third_law entropy, the ideal-gas state of the formation enthalpy being implied and assumed; the 1e20 dummy enthalpies with zero entropy (LJF, PSEUDO, R1234yf, R1234ze) are declared absent, sref stated at 1 atm is kept with its stated state and not converted, and gref is computed and not imported."

[[disposition]]
construct = "gendatadb (generated pure-component record)"
disposition = "out_of_scope"
reason = "A generated Fortran rendering of the fluid JSON with no attribution and truncated decimals: importing it would duplicate every fact, and only the JSON carries the authored precision, so it is a build artifact and not a second source of knowledge."

[[disposition]]
construct = "saturation (vapour-pressure estimate block)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Correlation 1 maps to a ln(mmHg) Antoine form with the stated Tmin and Tmax as a validity region, and the 27 records whose all-zero parameters are the placeholder are declared absent; the Michelsen-type and Starling estimates have no parameters and are procedures on Tc, Pc, acf and Zc, so they are not data and not kept. No solver reads these fields in the pin."

[[disposition]]
construct = "ideal_heat_capacity-N (ideal-gas heat capacity correlation set)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Each correlation id becomes its own form with its coefficient slots, unit and mass or molar basis taken from code comments (assumed), mass-basis sets being multiplied by the molar mass and Celsius limits of id 2 converted by the offset; zero-padded array tails cannot be told from data and are assumed padding. Ids 10, 13 and 100 (zero array) have no data representation and are held."

[[disposition]]
construct = "PR and SRK container blocks"
disposition = "held_by_model"
ref = "kind:parameterization"
reason = "The container is an arrangement: each inner set becomes a parameter set under a parameterization keyed by the equation and its ref tag, the four slot groups are split by form, and the arbitrary key suffixes (TWU-1, TWU-2) are discarded in favour of the tag and the occurrence number."

[[disposition]]
construct = "alpha correlation set (TWU and MC)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "TWU and MC are alpha-function forms whose three parameters are slots, chosen for a cubic through a subject_subform_choice with the set's own parameterization as source; the default tag is handled as a selection_policy override, and the fallback to the acentric-factor alpha when a set is absent or all zero is a named rule of that policy."

[[disposition]]
construct = "volume_shift (Peneloux volume translation set)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The JSON holds three coefficients ciA, ciB, ciC (m3/mol, m3/mol/K, m3/mol/K^2) of a polynomial family, and the correlation tag decides how many are live, which the mapping must assume because remaining stored zeros may be padding; the higher coefficients the code supports are not in the data, and the Rackett fallback is a named rule (see rackett_factor)."

[[disposition]]
construct = "CPA pure-component set"
disposition = "held_by_model"
ref = "kind:site_scheme"
reason = "The association scheme is the site_scheme of the parameterization the set belongs to (one parameterization per scheme and variant), the radial-distribution-function flag is a per-subject sub-form choice, and litre-based a0 and b convert to SI by the recorded factor; the set is thus valid only under the scheme it states."

[[disposition]]
construct = "PC-SAFT pure-component set"
disposition = "model_change"
ref = "alignment-notes #34"
reason = "mu is DipoleMoment but Q is given in Angstrom*Debye and model/physical.toml has no quadrupole quantity type; add a QuadrupoleMoment quantity type (C*m^2). eps_depth_divk (K) is mapped and eps (J/mol, which embeds the library gas constant) is computed and not imported, and the pi/6 convention of beta has to be stated per parameterization by the mapping."

[[disposition]]
construct = "SAFT-VR Mie pure-component set (including quantum variants)"
disposition = "mapping_loss"
ref = "relation:dependency"
reason = "fh_order is held as a consistent_with dependency of the set on the model assembly's quantum-correction choice; eps is taken as K (inferred from the multiplication by Rgas, against the datadb comment that says J/mol) and beta as m3 per molecule (inferred from its magnitude, the comment says dimensionless), both assumptions."

[[disposition]]
construct = "ref and bib_reference (parameter-set attribution pair)"
disposition = "mapping_loss"
ref = "kind:selection_policy"
reason = "The tag list becomes the parameterization key and title with bib_reference as its publication, and the in-band DEFAULT tag becomes a policy_override of a carrier-asserted selection_policy; a string naming several parameterizations is kept as one whole tag, so set membership in each single tag is not represented, and behavioural tags (tcPR, QuantumCubic) are model switches that the mapping records as assembly choices."

[[disposition]]
construct = "melting_curve"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The curve is a form implementing a melting-pressure contract whose family rows are the terms of each type (the n1, n2, n3 counts become per-type families), the id suffix 1, 2 or 3 and the piecewise MP-1 form being separate forms, with triple_temperature to maximum_temperature as a validity region."

[[disposition]]
construct = "sublimation_curve"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The curve maps to a sublimation-pressure form with its sign convention in the form, but the H2S record's id S2 has no valid closing character and so selects no form, which the mapping holds with a typed reason; the validity range from minimum_temperature to triple_temperature is inferred from use below the triple point."

[[disposition]]
construct = "binary kij record (cubic vdW mixing; PR, SRK, CSP-PR, CSP-SRK, PT files)"
disposition = "held_by_model"
ref = "kind:parameter_set"
reason = "Repeated assertions for one pair under one ref (CO2/H2O at 0.074 and -0.065) are kept as parameter sets distinguished by occurrence, stored in the asserted orientation with arrangement recorded, and the code's rule of taking the last Default-tagged record is a selection fact recorded beside them."

[[disposition]]
construct = "Lee-Kesler binary kij record"
disposition = "held_by_model"
ref = "kind:selection_policy"
reason = "The model-wide default of 1.0 is a selection_policy with unasserted stated_default scoped to the Lee-Kesler pair slot group, and the multiplicative mixing meaning is a separate form from the vdW kij."

[[disposition]]
construct = "binary lij record (cubic covolume interaction)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "kij and lij are slots of the pair slot groups of the vdW mixing form, symmetric, under the QuantumCubic parameterization; whether they sit in one slot group or in two is a declaration choice and the two source files are an arrangement."

[[disposition]]
construct = "binary excess-Gibbs mixing record (HV1, HV2, NRTL)"
disposition = "mapping_loss"
ref = "kind:source_entity"
reason = "The record is held as one set whose ij and ji slots are swapped on reading by a linear transposition, so the closed-rule objection no longer applies; the nine ion pairs with NA+ or CL- have no fluid record, so those components stay provisional source entities or the rows are held as unknown_subject."

[[disposition]]
construct = "CPA cross-association and kij record"
disposition = "held_by_model"
ref = "relation:subject_subform_choice"
reason = "The eps and beta combining rules are sub-form choices per pair held as subject_subform_choice rows, the kij slots sit in a symmetric pair slot group, and the fallback to the classic database and to the default rules for a missing pair is a selection_policy with named_rule; the missing attribution stays absent."

[[disposition]]
construct = "PC-SAFT binary record"
disposition = "held_by_model"
ref = "kind:selection_policy"
reason = "The default combining rule selected by DEFAULT is a named_rule of the selection_policy and not data, the uid1 and uid2 key names are an arrangement, and the twice-listed pairs with different kij under one tag (BENZENE/CO2, CO2/TOLU) are kept as occurrences."

[[disposition]]
construct = "SAFT-VR Mie binary record (kij and lij)"
disposition = "mapping_loss"
ref = "relation:dependency"
reason = "kij and lij map to symmetric pair slots, but the coupling of the set tag to the pure set's Feynman-Hibbs order is implicit in the tag, so the mapping asserts the consistent_with dependency from the tag name (assumed); no gamma_ij is bundled, so none is mapped."

[[disposition]]
construct = "UNIFAC subgroup (unifacprm)"
