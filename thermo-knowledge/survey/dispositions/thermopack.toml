ref = "kind:group_scheme"
reason = "Subgroups map to group rows with the main group as partition_class and Rk and Qk to a group-keyed slot group, but the file carries no scheme revision, so the mapping takes it from the dataSource strings (assumed); the commented alternative CO group is not imported, group numbers are this file's own labels, and Rk and Qk are taken as dimensionless though their reference is not stated."

[[disposition]]
construct = "UNIFAC interaction row (unifacUij)"
disposition = "held_by_model"
ref = "kind:parameterization"
reason = "The Hansen 1991 and PSRK rows are two parameterizations told apart by dataSource, each with directed group-pair sets (ordered transposition) and the 25 overlapping pairs kept as sets of different parameterizations; the first-row-wins lookup and the zeros used for a missing pair are a selection_policy fact and a stated_default, not stored values."

[[disposition]]
construct = "MBWR coefficient set (mbwr32Data, mbwr19Data)"
