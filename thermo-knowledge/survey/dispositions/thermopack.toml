reason = "The literal Tc, Pc and molar mass overrides and the beta(T) parameters become a QuantumCubic parameterization of slots naming those observables that supersedes the fluid-record constants for the six components, the tag-matching rule being a selection_policy fact."

[[disposition]]
construct = "pseudo-component record (PSEUDO)"
