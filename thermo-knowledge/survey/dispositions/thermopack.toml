disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The two equations map to Gibbs-energy forms of crystalline species forms, read from Fortran parameters with no per-value reference; their gas constant 8.314472 and the per-mass ice equation with its own reference temperature 273.152519 K are stated as parameterization conventions, and the overwriting of the triple point at initialisation is program behaviour that is not kept."

[[disposition]]
