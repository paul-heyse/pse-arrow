[[disposition]]
construct = "DCH dimensions and index lists"
disposition = "out_of_scope"
reason = "The dimension counts, the node-subset index lists (xic, xdc, xph) and the iGrd, fAalp and mLook flags size arrays and select a view or lookup mode for one program's files, which is storage bookkeeping with no thermodynamic content."

[[disposition]]
construct = "independent components (ICNL, ccIC, ICmm)"
disposition = "mapping_loss"
ref = "enum:conserved_kind"
reason = "The list holds components that are not elements, charge or site totals (Nit as a decoupled nitrogen inventory, isotopes, formula-unit components), which enum:conserved_kind holds as the members decoupled_inventory, isotope and moiety. The class letters that mark the h and o components and drive the minimiser's water logic are solver behaviour and are not mapped, and ICmm is kg/mol in the current writer against g/mol in the bundled documentation."

[[disposition]]
construct = "dependent components and the formula matrix (DCNL, ccDC, DCmm, A)"
disposition = "mapping_loss"
ref = "relation:composition"
reason = "Each column of A becomes explicit composition rows (charge from the Zz column), and since no formula text is stored the mapping reconstructs the formula assertion from that expansion, which resolution can use only in a declared formula-identified scope. The class code is split into aggregation and member_role by the mapping, and the same substance in two phases (gas CO2, aqueous CO2@) stays two source entities because nothing in the file links them."

[[disposition]]
construct = "phases (PHNL, ccPH, nDCinPH)"
disposition = "mapping_loss"
ref = "kind:phase_definition"
reason = "Each phase's species are taken from the ordered list by nDCinPH as system_member rows, and its aggregation, phase_structure and standard-state scale come from the phase and model class codes (stated only in a header comment), since the DCH states none of them. The structure is taken as none unless the model code is a sublattice model."

[[disposition]]
construct = "thermodynamic lookup grids (Ttol, TKval, Ptol, Pval, Psat, denW, denWg, epsW, epsWg, V0, G0, H0, S0, Cp0, A0, U0, DD)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The grid values are evaluations of an unrecorded standard-state model, so they are held as a computed dataset of T-P points with G0, H0, S0, Cp0, V0, A0, U0 and the water density and permittivity as property columns and no uncertainty stated, in the writer's units (K, Pa, J/mol, V0 in J/Pa) rather than the bundled documentation's C and bar. GEMS3K's five-point Lagrange interpolation, the Ttol and Ptol tolerances and the 7777777 sentinel outside the grid are consumer behaviour and are not kept, and DD is unread."

[[disposition]]
construct = "IPM numerical controls and flags"
disposition = "out_of_scope"
reason = "The flags and about fifty numerical controls and cutoffs are execution settings of the GEM interior-point kernel (tolerances, allocation switches, defaults of the exporting run), that is, solver settings, which are not domain facts."

[[disposition]]
construct = "phase-model arrays (sMod, LsMod, LsMdc, LsMdc2, IPxPH, PMc, DMc, MoiSN, DQFc, PhLin, lPhc, LsPhl)"
disposition = "mapping_loss"
ref = "kind:model_assembly"
reason = "sMod selects a form per phase through a code table in the mapping, and the collected index, PMc, DMc and MoiSN arrays are split by LsMod and LsMdc into parameter sets whose subjects are the species at the stated positions, the fourth Pitzer column choosing the parameter kind. The units of PMc and DMc are unknown for most models, and an interaction that is not stored (zero parameters are omitted) cannot be told from one that is zero."

[[disposition]]
construct = "metastability constraints and phase properties (RLC, RSC, DLL, DUL, fDQF, lnGmf, Pparc, B, Aalp, Sigw, Sigg, YOF)"
disposition = "out_of_scope"
reason = "DLL, DUL, RLC and RSC limit species amounts in a calculation, B is the bulk composition and Aalp a phase's surface area in the state, all run specifications at a process location; Sigw, Sigg, YOF, fDQF, Pparc and lnGmf are in most examples the defaults of the exporting run with no stated meaning, so nothing is mapped."

[[disposition]]
construct = "sorption and surface-complexation arrays"
disposition = "mapping_loss"
ref = "kind:site_class"
reason = "No example uses sorption, so the layouts of site types, capacitances, permanent charge and species allocation are known only from tag comments, with the units (mkmol/g, F/m2, mkeq/m2) and the meaning of the electrostatic-model code letter per surface type assumed. They map to site_class rows, site occupants and parameter sets of surface-complexation forms with the electrostatic model as a sub-form choice."

[[disposition]]
construct = "kinetics and uptake arrays (kMod, LsKin, LsUpt, xSKrC, ocPRkC, feSArC, rpConC, apConC, AscpC, UMpcC, xICuC, PfFact)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The parallel reactions of a phase are a family of terms that share surface-area fractions, and each affinity operation code (ocPRkC) selects a form of the catalogue, but the rate constants rpConC are in the unit that a scaling code in the same record selects, so the mapping must convert per code. No example uses kinetics, so the layout is known only from tag comments."

[[disposition]]
construct = "DBR node: state, composition and results"
disposition = "out_of_scope"
reason = "A node is the composition and state of a reactive subsystem at a time (bulk composition in moles of independent components, T, P, warm-start values and equilibrium results), which is process-location state and a calculation result, not thermodynamic knowledge."

[[disposition]]
construct = "file set and list files, JSON dialect and binary form"
disposition = "out_of_scope"
reason = "The list files name the DCH, IPM and DBR files of one set and select the text, JSON or binary encoding, and carry no thermodynamic content; the files themselves are artifacts of the carrier that the mapping reads."
