[[disposition]]
construct = "ePurifMethod"
disposition = "held_by_model"
ref = "relation:purification_step"
reason = "A sample holds its purification history as purification_step rows (nStep and the method: one of 25 declared purification_method values or free text)."

[[disposition]]
construct = "ePurityAnalMethod"
disposition = "held_by_model"
ref = "relation:purity_statement"
reason = "A purity statement states its analytical method as an analysis_method (24 values, including 'Stated by supplier' and 'Estimated by the compiler') or as free text in method_text."

[[disposition]]
construct = "eExpPurpose"
disposition = "out_of_scope"
ref = ""
reason = "The purpose of a measurement (principal objective, by-product, identification of a synthesized compound) annotates why the data were taken and says nothing about the thermodynamic values; nothing branches on it."

[[disposition]]
construct = "eCrystalLatticeTypeSelection"
disposition = "mapping_loss"
