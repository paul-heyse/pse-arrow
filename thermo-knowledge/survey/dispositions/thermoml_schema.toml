reason = "Mole, mass and volume fraction, molality and molarity map to declared bases; the ratios of solute to solvent, mass concentration and amount per mass of solution are entries declared in composition_basis with the mapping, and Initial and Final compositions are observables declared with it."

[[disposition]]
construct = "eSolventComposition (ConstraintVariableType)"
