[[disposition]]
construct = "DataReport (root) and Version"
disposition = "mapping_loss"
ref = "kind:carrier"
reason = "A report splits into a carrier and its publication, source entities, samples and one dataset per PureOrMixtureData or ReactionData element; nVersionMajor and nVersionMinor, which the schema does not tie to version 4.0, are not kept beyond the carrier's pin."

[[disposition]]
construct = "Citation (CitationType) and TRCRefID"
disposition = "mapping_loss"
ref = "kind:publication"
reason = "doi, isbn and the year map to publication and its citation row, and a citation text is composed from sAuthor, sPubName, sVol, sPage and similar fields, which then survive only inside that text. sAbstract, sKeyword, TRCRefID, dateCit and the book, journal and thesis specifics are not kept."

[[disposition]]
construct = "Compound and RegNum"
disposition = "held_by_model"
ref = "kind:defined_mixture"
reason = "defined_mixture states the MulticomponentSubstance type (alloy, clathrate, complex, crystal, solution) as multicomponent_kind, and eSpeciationState is the speciation of a dataset_component. The mapping re-renders nCASRNum with hyphens and check digit, turns the kg/kmol polymer averages into kg/mol constraint columns of each dataset that uses the compound, and declares EC number and PDB identifier as naming schemes."

[[disposition]]
construct = "Sample (purity and purification)"
disposition = "held_by_model"
ref = "relation:purity_statement"
reason = "A sample states its source and status as attributes, its purity statements as purity_statement rows (basis, value, digits, analytical method, impurity content) and its stepwise purification history as purification_step rows, so several purity statements, the water and halide impurity contents, the analytical method and the sample's source and status are held. Percent is divided by 100 and nUnknownPerCent maps to purity_basis not_stated."

[[disposition]]
construct = "PureOrMixtureData"
disposition = "held_by_model"
ref = "enum:component_function"
reason = "component_function has the members buffer, inert and cofactor for AuxiliarySubstance's Buffer and Inert (and Cofactor in reactions), so those components state their function. The dataset kind and method are per dataset in the model but per Property in ThermoML, so properties with different method choices are split into several datasets."

[[disposition]]
construct = "Property (element of PureOrMixtureData) and Property-MethodID"
disposition = "mapping_loss"
ref = "kind:dataset_column"
reason = "ePresentation, eRefStateType and RefPhaseID map to the column's presentation, reference_state_kind and reference_phase, and eStandardState to its standard_state. nRefTemp and nRefPressure carry no unit, so K and kPa are assumed from the names of the temperature and pressure constraints, and a difference or ratio presentation with no eRefStateType, which the schema allows, is refused by reference_state_kind_when_relative and held."

[[disposition]]
construct = "Constraint and Variable (ConstraintVariableType)"
disposition = "held_by_model"
ref = "kind:dataset_column"
reason = "constant, constant_digits and column_uncertainty now hold a constraint's value, digits and its uncertainty, repeatability and device-specification assessments. The composition bases the survey found undeclared (mass concentration, ratios to solvent, per mass of solution), the Initial and Final compositions and the Upper and Lower temperature and pressure names are entries declared in composition_basis and observable with the mapping."

[[disposition]]
construct = "NumValues (VariableValue and PropertyValue)"
disposition = "mapping_loss"
ref = "relation:datum"
reason = "Value, digits, the state (an upper limit becomes censored_below and a lower limit censored_above), several assessments per value and asymmetric minus and plus magnitudes are held by datum and datum_uncertainty. nRepetitions of a repeatability value has no attribute and is dropped."

[[disposition]]
construct = "Uncertainty, repeatability, device-specification and curve-deviation definitions"
disposition = "mapping_loss"
ref = "kind:uncertainty_assessment"
reason = "Each definition becomes an uncertainty_assessment with evaluator, method, coverage factor and confidence level, but the schema does not say whether nUncertLevOfConfid and the relative curve deviation are percent or fraction, and fractions are assumed. nRepetitions has no attribute and sCurveSpec is kept only in the method text."

[[disposition]]
construct = "CriticalEvaluation and Prediction (method alternatives of a property)"
disposition = "mapping_loss"
ref = "kind:derivation"
reason = "The alternative chosen fixes the dataset kind (evaluated or computed) and a derivation of kind evaluation or computation, read from structure. The evaluation descriptions, the equation-of-state name and the cited publications survive only as the derivation's method text and attribution rows."

[[disposition]]
construct = "Equation (equation representation part of a dataset)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Each of the ten equation names becomes a form declared from its urlMathSource (not acquired, so slot meaning and parameter units are the declarer's reading), its parameters a parameter set with a fit, EqPropRange and EqVariableRange fitted_range regions, and the covariance matrix standard uncertainties plus fit_correlation rows. The single nCovarianceLevOfConfid of the matrix has no home."

[[disposition]]
construct = "ReactionData"
disposition = "mapping_loss"
ref = "kind:reaction"
reason = "A participant without nStoichiometricCoef cannot form a reaction and is held, the sign of the coefficients is not stated (reactants negative is assumed), and the participant's phase becomes the species form's aggregation and its composition a dataset column. eReactionType and nElectronNumber have no attribute and are dropped."

[[disposition]]
construct = "Solvent and Catalyst"
disposition = "mapping_loss"
ref = "kind:dataset_component"
reason = "Solvent and Catalyst components become dataset_component rows with function solvent and catalyst, a per-dataset attribute. Properties or columns that name different solvent sets in one dataset force the dataset to be split."

[[disposition]]
construct = "Biomaterial extensions"
disposition = "held_by_model"
ref = "enum:reference_relation"
reason = "The biochemical formalism gives transformed (apparent) quantities at a stated pH, ionic strength and pMg, which the reference_relation member transformed and the standard_state_kind member transformed_biochemical hold, with the conditions as the dataset's constraint columns for them. EC number and PDB identifier become naming schemes, pH, pC and ionic strength observables on Scalar, Molality and MolarDensity, and eBioState a dataset_phase label."

[[disposition]]
construct = "Unit embedded in enumeration strings"
disposition = "mapping_loss"
ref = "mechanism:unit conversion"
reason = "The unit text of each of the 193 property names is checked with pint against the quantity type of its alias's observable (a test states the dimension of each, after restating an exponent written as trailing digits, m3 as m**3, which pint does not parse), and the mapping declares the factors (kPa to Pa 1000, kJ/mol to J/mol 1000, mol/dm3 to mol/m3 1000, kg/kmol to kg/mol 0.001, J/g to J/kg 1000). The 10 property names whose unit has a symbolic exponent n are close aliases stored as dimensionless numbers on the stated scale; the units of the constraint and variable names, among them MHz, still need a quantity type where the wave that maps them declares the observables."

[[disposition]]
construct = "Integer cross-references (nCompIndex, RegNum, nSampleNm, nPropNumber, nVarNumber, nConstraintNumber, nUncertAssessNum)"
disposition = "mapping_loss"
ref = "mechanism:reference check"
reason = "The schema declares no key or keyref, so the mapping resolves every integer index to a compound, sample, property, variable, constraint or assessment of the same report and holds a row whose index names none."

[[disposition]]
construct = "ePropName (PropertyGroup Criticals)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 10 names are observable_alias rows of carrier scope thermoml (module observables_thermoml): critical temperature and pressure reuse critical_temperature and critical_pressure, the density, molar volume, specific volume and compressibility factor and the four consolute names have observables, and the six critical names are broader than the pure-subject observables because they do not say pure or mixture, so the mapping holds the critical point of a mixture."

[[disposition]]
construct = "eMethodName (PropertyGroup Criticals)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The ten strings are kept verbatim in dataset.method and the kind is set to measured, although 'Derived from PVT data', 'Extrapolated vapor pressure' and 'Rectilinear diameter' obtain the critical value from other measurements; a CriticalEvaluation or Prediction choice sets evaluated or computed instead."

[[disposition]]
construct = "ePropName (PropertyGroup VaporPBoilingTAzeotropTandP)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 5 names are aliases: 'Vapor or sublimation pressure' is a broader alias of vapor_pressure whose sublimation case has its own observable sublimation_pressure, which the mapping selects from PropPhaseID and cannot when the phase is omitted, and the boiling and azeotropic names have observables; the 101.325 kPa of the normal boiling temperature comes from a documentation element."

[[disposition]]
construct = "eMethodName (PropertyGroup VaporPBoilingTAzeotropTandP)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The 21 strings are kept verbatim in dataset.method under kind measured, although 'By X=Y', 'By P(X) extreme' and 'By T(X) extreme' locate an azeotrope from equilibrium data rather than measure it directly."

[[disposition]]
construct = "ePropName (PropertyGroup PhaseTransition)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 19 names are aliases: the 'transition or fusion' and 'vaporization or sublimation' names are broader aliases of the fusion and vaporization observables (the sublimation observables exist too) that only PropPhaseID tells apart, so the mapping picks the observable from dataset_phase and second_phase and holds the point when the phases are absent; the invariant-point names, the cryoscopic constants and the 0 K lattice energy (close, its gas-phase reference assumed) have observables and quantity types."

[[disposition]]
construct = "eMethodName (PropertyGroup PhaseTransition)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Obtained from cryoscopic constant', 'Derived from phase diagram analysis', 'Derived by Second law' and 'Derived by Second law from precise ebulliometry' are derived values that the mapping still records as kind measured, with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup CompositionAtPhaseEquilibrium)"
disposition = "held_by_model"
ref = "kind:observable_alias"
reason = "All 31 names are exact aliases of observables of observables_thermoml or of mole_fraction: the invariant-point compositions, the mass, volume and amount ratios of solute to solvent, the concentrations, each Henry's Law constant scale, the Bunsen and Ostwald coefficients and the partial pressure are separate observables, and the kind of equilibrium is read from the dataset phases."

[[disposition]]
construct = "eMethodName (PropertyGroup CompositionAtPhaseEquilibrium)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Calculated by Gibbs-Duhem equation' and the density, refractive-index and speed-of-sound calibration-data methods give values obtained by calculation or from calibrations, which the mapping records as kind measured with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup ActivityFugacityOsmoticProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 8 names are aliases: the activity uses the reference relation relative_to_standard_state and the activity and osmotic coefficients the relation excess, with the convention only implied by eStandardState (see eStandardState), and 'Mean ionic activity, (mol/dm3)^n' is a close alias stored as a dimensionless number on its stated scale because its unit depends on n."

[[disposition]]
construct = "eMethodName (PropertyGroup ActivityFugacityOsmoticProp)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The nine strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup VolumetricProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 24 names are aliases with quantity types declared for the specific volume, virial coefficients, compressibilities and expansion coefficient: the excess compressibilities and expansion coefficient state no mixing rule, the excess and interaction virial coefficients state no order (second assumed from the unit) and 'Relative partial molar volume' states no reference (infinite dilution assumed), each a close alias, and C112 and C122 have pair-subject observables."

[[disposition]]
construct = "eMethodName (PropertyGroup VolumetricProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Derived from speed of sound', 'Derived analytically', 'Derived graphically' and the two 'Calculated with densities ...' strings describe computed values that the mapping records as kind measured, with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup HeatCapacityAndDerivedProp)"
disposition = "held_by_model"
ref = "kind:observable_alias"
reason = "All 20 names are exact aliases: the Joule-Thomson coefficient has the path isenthalpic, the heat capacities at constant pressure, at saturation pressure and at constant volume per mole, per mass and per volume are separate observables, the enthalpy function and the two Gibbs energy functions (references at 0 K and 298.15 K) are separate observables, and the unstated enthalpy and entropy datums belong to the dataset's convention set."

[[disposition]]
construct = "eMethodName (PropertyGroup HeatCapacityAndDerivedProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Derived from speed of sound' and 'Derived from equation of state' describe computed values that the mapping records as kind measured, with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup ExcessPartialApparentEnergyProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 23 names are aliases: the enthalpies of mixing with solvent, of solution and of dilution have the amount basis per_mole_of_solute, the excess, partial, apparent and standard-state properties are separate observables, and the aliases of the heat capacities (constant pressure assumed) and of the relative partial molar properties (infinite-dilution reference assumed) are close because the names state neither."

[[disposition]]
construct = "eMethodName (PropertyGroup ExcessPartialApparentEnergyProp)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The fifteen calorimetry and cell strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup TransportProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 12 names are aliases with their quantity types declared: 'Binary diffusion coefficient' has the frame not_stated, self and tracer diffusion are separate observables with the frame self_diffusion, and 'Excess viscosity' is a close alias because its name states no mixing rule."

[[disposition]]
construct = "eMethodName (PropertyGroup TransportProp)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The 29 viscometry, conductivity and diffusion strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup RefractionSurfaceTensionSoundSpeed)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 14 names are aliases: the sodium D-line refractive index and the refractive index at another wavelength are separate observables (the wavelength of the second is a dataset column), the two parts of the complex permittivity are two observables, liquid-gas surface tension is separate from interfacial tension, speed of sound has its own quantity type, and the excess names are close aliases because they state no mixing rule."

[[disposition]]
construct = "eMethodName (PropertyGroup RefractionSurfaceTensionSoundSpeed)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The 31 refractometry, tensiometry and acoustic strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup BioProperties)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 5 names are aliases with transition-subject observables, one per kind of transition temperature (half conversion, peak, zero Gibbs energy), and the native and denaturated states are dataset_phase labels since eBioState is a conformational state and aggregation has no such member; the heat capacity change is a close alias because its name does not say constant pressure."

[[disposition]]
construct = "eMethodName (PropertyGroup BioProperties)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The one string, DSC/DTA, is a measurement: it is kept verbatim in dataset.method and the dataset kind is read from the alternative chosen (measured), so only the typing of the list is lost."

[[disposition]]
construct = "ePropName (ReactionData PropertyGroup ReactionStateChangeProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The 7 names are aliases with reaction-subject observables for the enthalpy, internal energy, Gibbs energy and entropy of reaction, the enthalpy of a process (the quantity type Energy) and the cell potential difference; 'Specific internal energy of reaction, J/g' does not say per gram of what and is a close alias, and the sign of the participants' coefficients and per mole of the reaction as written are assumed."

[[disposition]]
construct = "eMethodName (ReactionData PropertyGroup ReactionStateChangeProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The method choice repeats per reaction property while dataset.method holds one text, so the mapping joins the strings of a dataset into one text and records the dataset as measured."

[[disposition]]
construct = "ePropName (ReactionData PropertyGroup ReactionEquilibriumProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "K, ln K and log10 K of each of the five scales are 15 separate observables and aliases, as no facet derives the scale or the logarithm base; the nine names with unit (mol/kg)^n, (mol/dm3)^n or kPa^n are close aliases stored as dimensionless numbers on the stated scale because n follows from the participants only when their coefficients are present."

[[disposition]]
construct = "eMethodName (ReactionData PropertyGroup ReactionEquilibriumProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The method choice repeats per reaction property while dataset.method holds one text, so the mapping joins the strings of a dataset into one text and records the dataset as measured."

[[disposition]]
construct = "eType"
disposition = "out_of_scope"
ref = ""
reason = "The publication type (book, journal, patent, thesis and so on) describes the cited work, not the thermodynamic content or its attribution, and nothing branches on it."

[[disposition]]
construct = "eSourceType"
disposition = "out_of_scope"
ref = ""
reason = "Whether the citation is the original, a Chemical Abstracts entry or other is a bibliographic descriptor of the citation record; the publication the values are attributed to is held either way."

[[disposition]]
construct = "eLanguage"
disposition = "out_of_scope"
ref = ""
reason = "The language of the cited publication is a bibliographic descriptor with no bearing on the thermodynamic content or its attribution."

[[disposition]]
construct = "eSpeciationState"
disposition = "held_by_model"
ref = "kind:dataset_component"
reason = "Whether a compound stands for an equilibrium mixture of species or for one species is the speciation of a dataset_component (single_species, equilibrium_mixture or not_stated); speciation_map relates apparent and true species within a chemical system and is not that flag."

[[disposition]]
construct = "eFunction (PureOrMixtureData AuxiliarySubstance)"
disposition = "held_by_model"
ref = "enum:component_function"
reason = "Solvent maps to component_function solvent, and Buffer and Inert to the members buffer and inert (catalyst is present but not a participant, which says nothing about a buffer or an inert medium)."

[[disposition]]
construct = "eFunction (ReactionData AuxiliarySubstance)"
disposition = "held_by_model"
ref = "enum:component_function"
reason = "Cofactor, Buffer and Inert are the component_function members cofactor, buffer and inert in a reaction dataset."

[[disposition]]
construct = "eSampleStatus"
disposition = "held_by_model"
ref = "kind:sample"
reason = "sample states its status (described, not_described, described_previously, no_sample or not_stated) for unknown, notDescribed, previousPaper and noSample, which say whether a sample is described, was described in an earlier paper or was not used; unknown maps to not_stated."

[[disposition]]
construct = "eSampleSource"
disposition = "held_by_model"
ref = "kind:sample"
reason = "sample states its source (sample_source) apart from its supplier, which stays the supplier's name: the seven source values include 'Standard Reference Material (SRM)' and 'Isolated from a natural product', which are not suppliers, and 'Not stated in the document' maps to not_stated."

[[disposition]]
construct = "ePurifMethod"
disposition = "held_by_model"
ref = "relation:purification_step"
reason = "A sample holds its purification history as purification_step rows (nStep and the method: one of 25 declared purification_method values or free text)."

[[disposition]]
construct = "ePurityAnalMethod"
disposition = "held_by_model"
ref = "relation:purity_statement"
reason = "A purity statement states its analytical method as an analysis_method (24 values, including 'Stated by supplier' and 'Estimated by the compiler') or as free text in method_text."

[[disposition]]
construct = "eExpPurpose"
disposition = "out_of_scope"
ref = ""
reason = "The purpose of a measurement (principal objective, by-product, identification of a synthesized compound) annotates why the data were taken and says nothing about the thermodynamic values; nothing branches on it."

[[disposition]]
construct = "eCrystalLatticeTypeSelection"
disposition = "mapping_loss"
ref = "kind:dataset_phase"
reason = "The seven lattice systems are kept only in the phase label (for example Crystal, cubic): dataset_phase has aggregation crystalline and a label but no crystal system, and species_form.polymorph is a designation, not one of seven lattice systems."

[[disposition]]
construct = "eBioState (PropPhaseID)"
disposition = "mapping_loss"
ref = "kind:dataset_phase"
reason = "Native and Denaturated are kept only as the phase label, since aggregation has no conformational state and a dataset_phase is a local role with aggregation and label only."

[[disposition]]
construct = "MulticomponentType"
disposition = "held_by_model"
ref = "kind:defined_mixture"
reason = "defined_mixture states alloy, clathrate, complex, crystal and solution as its multicomponent_kind, which mixture_definition (by_definition, by_measurement) does not express."

[[disposition]]
construct = "MulticomponentComposition"
disposition = "mapping_loss"
ref = "kind:defined_mixture"
reason = "'mole fraction' and 'mass fraction' set mole_basis, but 'number of molecules' amounts are normalised to mole fractions, which keeps the ratio and drops the absolute counts."

[[disposition]]
construct = "eReactionFormalism"
disposition = "held_by_model"
ref = "enum:reference_relation"
reason = "The biochemical value makes the dataset's properties transformed quantities at a stated pH and ionic strength, which the reference_relation member transformed and the standard_state_kind member transformed_biochemical hold."

[[disposition]]
construct = "eReactionType"
disposition = "mapping_loss"
ref = "kind:reaction"
reason = "The 25-value classification has no attribute and is dropped; the participants and coefficients that the model holds fix what the reaction is."

[[disposition]]
construct = "eCompositionRepresentation"
disposition = "held_by_model"
ref = "kind:composition_basis"
reason = "Molality and amount concentration map to the declared bases molality and molarity, and the ratio bases, amount per mass of solution and mass per volume of solution are entries declared in composition_basis with the mapping; the participant's composition is a dataset column, a condition of the measured state, not part of the reaction."

[[disposition]]
construct = "eParticipantAmount (constraint and variable type group)"
disposition = "held_by_model"
ref = "kind:observable"
reason = "'Amount, mol' and 'Mass, kg' fit the existing quantity types Amount and Mass (factor 1) as observables of a reaction participant declared with the mapping."

[[disposition]]
construct = "ePredictionType"
disposition = "mapping_loss"
ref = "kind:derivation"
reason = "The eight types map to derivation kind estimation (Correlation, Corresponding states, Group contribution) or computation (Ab initio, Molecular dynamics, Semiempirical quantum methods, Molecular mechanics, Statistical mechanics) by a mapping rule the schema does not state, with the type string as the derivation's method; no vocabulary of types is declared."

[[disposition]]
construct = "eEqName"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Each of the ten names becomes a form declared from its math-source URL; the schema gives no slot names, so slots and their units are the declarer's reading of content that the pinned bytes do not include."

[[disposition]]
construct = "eTemperature (ConstraintVariableType)"
disposition = "held_by_model"
ref = "kind:observable"
reason = "'Temperature, K' maps to the observable temperature (factor 1); 'Upper temperature' and 'Lower temperature' are observables declared with the mapping, referenced by a column whose presentation is difference_between_temperatures or mean_between_temperatures."

[[disposition]]
construct = "ePressure (ConstraintVariableType)"
