disposition = "mapping_loss"
ref = "kind:defined_mixture"
reason = "'mole fraction' and 'mass fraction' set mole_basis, but 'number of molecules' amounts are normalised to mole fractions, which keeps the ratio and drops the absolute counts."

[[disposition]]
construct = "eReactionFormalism"
disposition = "held_by_model"
ref = "enum:reference_relation"
reason = "The biochemical value makes the dataset's properties transformed quantities at a stated pH and ionic strength, which the reference_relation member transformed and the standard_state_kind member transformed_biochemical hold."

[[disposition]]
construct = "eReactionType"
disposition = "mapping_loss"
