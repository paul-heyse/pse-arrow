reason = "Native and Denaturated are kept only as the phase label, since aggregation has no conformational state and a dataset_phase is a local role with aggregation and label only."

[[disposition]]
construct = "MulticomponentType"
disposition = "held_by_model"
ref = "kind:defined_mixture"
reason = "defined_mixture states alloy, clathrate, complex, crystal and solution as its multicomponent_kind, which mixture_definition (by_definition, by_measurement) does not express."

[[disposition]]
