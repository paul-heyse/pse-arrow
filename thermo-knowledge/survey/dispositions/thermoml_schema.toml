[[disposition]]
construct = "DataReport (root) and Version"
disposition = "mapping_loss"
ref = "kind:carrier"
reason = "A report splits into a carrier and its publication, source entities, samples and one dataset per PureOrMixtureData or ReactionData element; nVersionMajor and nVersionMinor, which the schema does not tie to version 4.0, are not kept beyond the carrier's pin."

[[disposition]]
construct = "Citation (CitationType) and TRCRefID"
disposition = "mapping_loss"
ref = "kind:publication"
reason = "doi, isbn and the year map to publication and its citation row, and a citation text is composed from sAuthor, sPubName, sVol, sPage and similar fields, which then survive only inside that text. sAbstract, sKeyword, TRCRefID, dateCit and the book, journal and thesis specifics are not kept."

[[disposition]]
construct = "Compound and RegNum"
disposition = "held_by_model"
ref = "kind:defined_mixture"
reason = "defined_mixture states the MulticomponentSubstance type (alloy, clathrate, complex, crystal, solution) as multicomponent_kind, and eSpeciationState is the speciation of a dataset_component. The mapping re-renders nCASRNum with hyphens and check digit, turns the kg/kmol polymer averages into kg/mol constraint columns of each dataset that uses the compound, and declares EC number and PDB identifier as naming schemes."

[[disposition]]
construct = "Sample (purity and purification)"
disposition = "held_by_model"
ref = "relation:purity_statement"
reason = "A sample states its source and status as attributes, its purity statements as purity_statement rows (basis, value, digits, analytical method, impurity content) and its stepwise purification history as purification_step rows, so several purity statements, the water and halide impurity contents, the analytical method and the sample's source and status are held. Percent is divided by 100 and nUnknownPerCent maps to purity_basis not_stated."

[[disposition]]
construct = "PureOrMixtureData"
disposition = "held_by_model"
ref = "enum:component_function"
reason = "component_function has the members buffer, inert and cofactor for AuxiliarySubstance's Buffer and Inert (and Cofactor in reactions), so those components state their function. The dataset kind and method are per dataset in the model but per Property in ThermoML, so properties with different method choices are split into several datasets."

[[disposition]]
construct = "Property (element of PureOrMixtureData) and Property-MethodID"
disposition = "mapping_loss"
ref = "kind:dataset_column"
reason = "ePresentation, eRefStateType and RefPhaseID map to the column's presentation, reference_state_kind and reference_phase, and eStandardState to its standard_state. nRefTemp and nRefPressure carry no unit, so K and kPa are assumed from the names of the temperature and pressure constraints, and a difference or ratio presentation with no eRefStateType, which the schema allows, is refused by reference_state_kind_when_relative and held."

[[disposition]]
construct = "Constraint and Variable (ConstraintVariableType)"
disposition = "held_by_model"
ref = "kind:dataset_column"
reason = "constant, constant_digits and column_uncertainty now hold a constraint's value, digits and its uncertainty, repeatability and device-specification assessments. The composition bases the survey found undeclared (mass concentration, ratios to solvent, per mass of solution), the Initial and Final compositions and the Upper and Lower temperature and pressure names are entries declared in composition_basis and observable with the mapping."

[[disposition]]
construct = "NumValues (VariableValue and PropertyValue)"
disposition = "mapping_loss"
ref = "relation:datum"
reason = "Value, digits, the state (an upper limit becomes censored_below and a lower limit censored_above), several assessments per value and asymmetric minus and plus magnitudes are held by datum and datum_uncertainty. nRepetitions of a repeatability value has no attribute and is dropped."

[[disposition]]
construct = "Uncertainty, repeatability, device-specification and curve-deviation definitions"
disposition = "mapping_loss"
ref = "kind:uncertainty_assessment"
reason = "Each definition becomes an uncertainty_assessment with evaluator, method, coverage factor and confidence level, but the schema does not say whether nUncertLevOfConfid and the relative curve deviation are percent or fraction, and fractions are assumed. nRepetitions has no attribute and sCurveSpec is kept only in the method text."

[[disposition]]
construct = "CriticalEvaluation and Prediction (method alternatives of a property)"
disposition = "mapping_loss"
ref = "kind:derivation"
reason = "The alternative chosen fixes the dataset kind (evaluated or computed) and a derivation of kind evaluation or computation, read from structure. The evaluation descriptions, the equation-of-state name and the cited publications survive only as the derivation's method text and attribution rows."

[[disposition]]
construct = "Equation (equation representation part of a dataset)"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Each of the ten equation names becomes a form declared from its urlMathSource (not acquired, so slot meaning and parameter units are the declarer's reading), its parameters a parameter set with a fit, EqPropRange and EqVariableRange fitted_range regions, and the covariance matrix standard uncertainties plus fit_correlation rows. The single nCovarianceLevOfConfid of the matrix has no home."

[[disposition]]
construct = "ReactionData"
disposition = "mapping_loss"
ref = "kind:reaction"
reason = "A participant without nStoichiometricCoef cannot form a reaction and is held, the sign of the coefficients is not stated (reactants negative is assumed), and the participant's phase becomes the species form's aggregation and its composition a dataset column. eReactionType and nElectronNumber have no attribute and are dropped."

[[disposition]]
construct = "Solvent and Catalyst"
disposition = "mapping_loss"
ref = "kind:dataset_component"
reason = "Solvent and Catalyst components become dataset_component rows with function solvent and catalyst, a per-dataset attribute. Properties or columns that name different solvent sets in one dataset force the dataset to be split."

[[disposition]]
construct = "Biomaterial extensions"
disposition = "held_by_model"
ref = "enum:reference_relation"
reason = "The biochemical formalism gives transformed (apparent) quantities at a stated pH, ionic strength and pMg, which the reference_relation member transformed and the standard_state_kind member transformed_biochemical hold, with the conditions as the dataset's constraint columns for them. EC number and PDB identifier become naming schemes, pH, pC and ionic strength observables on Scalar, Molality and MolarDensity, and eBioState a dataset_phase label."

[[disposition]]
construct = "Unit embedded in enumeration strings"
disposition = "mapping_loss"
ref = "mechanism:unit conversion"
reason = "The mapping declares the source unit of each name and its factor (kPa to Pa 1000, kJ/mol to J/mol 1000, mol/dm3 to mol/m3 1000, kg/kmol to kg/mol 0.001, J/g to J/kg 1000) and needs quantity types declared for the units physical.toml lacks. Names whose unit has a symbolic exponent n, such as (mol/dm3)^n and kPa^n, have no fixed quantity type and are stored as dimensionless numbers on the stated scale."

[[disposition]]
construct = "Integer cross-references (nCompIndex, RegNum, nSampleNm, nPropNumber, nVarNumber, nConstraintNumber, nUncertAssessNum)"
disposition = "mapping_loss"
ref = "mechanism:reference check"
reason = "The schema declares no key or keyref, so the mapping resolves every integer index to a compound, sample, property, variable, constraint or assessment of the same report and holds a row whose index names none."

[[disposition]]
construct = "ePropName (PropertyGroup Criticals)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "critical_temperature and critical_pressure (kPa to Pa, factor 1000) exist with subject pure, but the names do not say pure or mixture, so the mapping chooses a pure or mixture-subject observable from the number of Component elements. Critical density, molar volume, specific volume (new quantity type), compressibility factor and the four consolute names need observables declared with the mapping."

[[disposition]]
construct = "eMethodName (PropertyGroup Criticals)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The ten strings are kept verbatim in dataset.method and the kind is set to measured, although 'Derived from PVT data', 'Extrapolated vapor pressure' and 'Rectilinear diameter' obtain the critical value from other measurements; a CriticalEvaluation or Prediction choice sets evaluated or computed instead."

[[disposition]]
construct = "ePropName (PropertyGroup VaporPBoilingTAzeotropTandP)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "'Vapor or sublimation pressure' is one name for two observables, which the mapping separates by PropPhaseID (gas with liquid gives vapor_pressure, gas with crystal a sublimation-pressure observable declared with it) and cannot when the phase is omitted. The 101.325 kPa of the normal boiling temperature comes from a documentation element, and the boiling and azeotropic names need observables declared."

[[disposition]]
construct = "eMethodName (PropertyGroup VaporPBoilingTAzeotropTandP)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The 21 strings are kept verbatim in dataset.method under kind measured, although 'By X=Y', 'By P(X) extreme' and 'By T(X) extreme' locate an azeotrope from equilibrium data rather than measure it directly."

[[disposition]]
construct = "ePropName (PropertyGroup PhaseTransition)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "'Molar enthalpy of transition or fusion' and 'of vaporization or sublimation' are each one name for several processes that only PropPhaseID tells apart, so the mapping picks the transition observable from dataset_phase and second_phase and holds the point when the phases are absent. The invariant-point names and the cryoscopic constants (1/K, kg/mol/K) need observables and quantity types declared, and the gas-phase reference of the 0 K lattice energy is assumed because the name omits it."

[[disposition]]
construct = "eMethodName (PropertyGroup PhaseTransition)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Obtained from cryoscopic constant', 'Derived from phase diagram analysis', 'Derived by Second law' and 'Derived by Second law from precise ebulliometry' are derived values that the mapping still records as kind measured, with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup CompositionAtPhaseEquilibrium)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "Mass concentration, the amount, mass and volume ratios of solute to solvent and amount of solute per mass of solution need composition_basis entries and composition observables declared with the mapping, and each Henry's Law constant scale (mole fraction, molality, amount concentration) its own observable. The kind of equilibrium (solubility, LLE, VLE) is read from the dataset phases and is undecided when PropPhaseID is omitted."

[[disposition]]
construct = "eMethodName (PropertyGroup CompositionAtPhaseEquilibrium)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Calculated by Gibbs-Duhem equation' and the density, refractive-index and speed-of-sound calibration-data methods give values obtained by calculation or from calibrations, which the mapping records as kind measured with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup ActivityFugacityOsmoticProp)"
disposition = "mapping_loss"
ref = "enum:standard_state_kind"
reason = "The activity-coefficient convention is only implied by eStandardState, which states neither the pressure nor whether 'Pure compound' is a real liquid or an ideal gas, and standard_state_kind and pressure_rule have the member not_stated for it (see eStandardState). 'Mean ionic activity, (mol/dm3)^n' is stored as a dimensionless number on its stated scale because its unit depends on n."

[[disposition]]
construct = "eMethodName (PropertyGroup ActivityFugacityOsmoticProp)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The nine strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup VolumetricProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "Specific volume, the virial and acoustic virial coefficients, the compressibilities and the expansion coefficient need observables and quantity types declared with the mapping, and C112 and C122 become observables of a binary mixture. 'Relative partial molar volume' is mapped as an increment against the infinite-dilution standard state, a reference the name does not state."

[[disposition]]
construct = "eMethodName (PropertyGroup VolumetricProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Derived from speed of sound', 'Derived analytically', 'Derived graphically' and the two 'Calculated with densities ...' strings describe computed values that the mapping records as kind measured, with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup HeatCapacityAndDerivedProp)"
disposition = "held_by_model"
ref = "enum:path"
reason = "The Joule-Thomson coefficient, a temperature change with pressure at constant enthalpy, has the path member isenthalpic of enum path. The unstated enthalpy and entropy datums map to a convention set with enthalpy_datum and entropy_datum not_stated, and the 0 K and 298.15 K references of the enthalpy and Gibbs-energy functions become separate observables."

[[disposition]]
construct = "eMethodName (PropertyGroup HeatCapacityAndDerivedProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "'Derived from speed of sound' and 'Derived from equation of state' describe computed values that the mapping records as kind measured, with the string in dataset.method."

[[disposition]]
construct = "ePropName (PropertyGroup ExcessPartialApparentEnergyProp)"
disposition = "held_by_model"
ref = "enum:amount_basis"
reason = "amount_basis has the member per_mole_of_solute for a quantity per mole of solute, which the schema documents for 'Molar enthalpy of mixing with solvent', 'of solution' and 'of dilution' (per mole of mixture for the excess enthalpy). Relative partial molar quantities are mapped as increments against the infinite-dilution standard state, and solution and dilution enthalpies use initial and final composition columns."

[[disposition]]
construct = "eMethodName (PropertyGroup ExcessPartialApparentEnergyProp)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The fifteen calorimetry and cell strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup TransportProp)"
disposition = "held_by_model"
ref = "enum:diffusion_frame"
reason = "'Binary diffusion coefficient' states no frame, which diffusion_frame records as the member not_stated, so an omitted frame is recorded without an assumption. Kinematic viscosity, thermal diffusivity and fluidity are the quantity types KinematicViscosity, ThermalDiffusivity and Fluidity, and their observables and those of the conductivities are declared with the mapping."

[[disposition]]
construct = "eMethodName (PropertyGroup TransportProp)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The 29 viscometry, conductivity and diffusion strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup RefractionSurfaceTensionSoundSpeed)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "'Refractive index (Na D-line)' fixes a wavelength by name, which the mapping restates as a wavelength constraint column with the D-line value assumed, and the two parts of the complex permittivity become two observables. The excess names use the excess relation against an ideal mixing rule the schema does not state, and speed of sound needs a quantity type declared with the mapping."

[[disposition]]
construct = "eMethodName (PropertyGroup RefractionSurfaceTensionSoundSpeed)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The 31 refractometry, tensiometry and acoustic strings are kept verbatim in dataset.method, which the model declares as text as the source names it, and the dataset kind is read from the alternative chosen (eMethodName gives measured); nothing is lost beyond the typing of the list."

[[disposition]]
construct = "ePropName (PropertyGroup BioProperties)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The five names become transition observables with the native and denaturated states as dataset_phase labels, since eBioState is a conformational state and aggregation has no such member. The kind of transition temperature (half conversion, peak, zero Gibbs energy) is carried by separate observable entries declared with the mapping."

[[disposition]]
construct = "eMethodName (PropertyGroup BioProperties)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "The one string, DSC/DTA, is a measurement: it is kept verbatim in dataset.method and the dataset kind is read from the alternative chosen (measured), so only the typing of the list is lost."

[[disposition]]
construct = "ePropName (ReactionData PropertyGroup ReactionStateChangeProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "The sign of the participants' coefficients and 'per mol of reaction' are not stated, so reactants negative and per mole of the reaction as written are assumed, and 'Specific internal energy of reaction, J/g' does not say per gram of what and is held. 'Enthalpy of process, kJ' and the cell potential need an energy and a potential quantity type and observables declared with the mapping."

[[disposition]]
construct = "eMethodName (ReactionData PropertyGroup ReactionStateChangeProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The method choice repeats per reaction property while dataset.method holds one text, so the mapping joins the strings of a dataset into one text and records the dataset as measured."

[[disposition]]
construct = "ePropName (ReactionData PropertyGroup ReactionEquilibriumProp)"
disposition = "mapping_loss"
ref = "kind:observable_alias"
reason = "K, ln K and log10 K of each of the five scales (thermodynamic, molality, molarity, partial pressure, mole fraction) are separate observables because no facet derives the scale or the logarithm base. Values with unit (mol/kg)^n, (mol/dm3)^n or kPa^n are stored as dimensionless numbers on the stated scale, and n follows from the participants only when their coefficients are present."

[[disposition]]
construct = "eMethodName (ReactionData PropertyGroup ReactionEquilibriumProp)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The method choice repeats per reaction property while dataset.method holds one text, so the mapping joins the strings of a dataset into one text and records the dataset as measured."

[[disposition]]
construct = "eType"
disposition = "out_of_scope"
ref = ""
reason = "The publication type (book, journal, patent, thesis and so on) describes the cited work, not the thermodynamic content or its attribution, and nothing branches on it."

[[disposition]]
construct = "eSourceType"
disposition = "out_of_scope"
ref = ""
reason = "Whether the citation is the original, a Chemical Abstracts entry or other is a bibliographic descriptor of the citation record; the publication the values are attributed to is held either way."

[[disposition]]
construct = "eLanguage"
disposition = "out_of_scope"
