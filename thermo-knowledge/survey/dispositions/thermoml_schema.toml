reason = "Whether a compound stands for an equilibrium mixture of species or for one species is the speciation of a dataset_component (single_species, equilibrium_mixture or not_stated); speciation_map relates apparent and true species within a chemical system and is not that flag."

[[disposition]]
construct = "eFunction (PureOrMixtureData AuxiliarySubstance)"
disposition = "held_by_model"
ref = "enum:component_function"
reason = "Solvent maps to component_function solvent, and Buffer and Inert to the members buffer and inert (catalyst is present but not a participant, which says nothing about a buffer or an inert medium)."

[[disposition]]
construct = "eFunction (ReactionData AuxiliarySubstance)"
disposition = "held_by_model"
ref = "enum:component_function"
reason = "Cofactor, Buffer and Inert are the component_function members cofactor, buffer and inert in a reaction dataset."

[[disposition]]
construct = "eSampleStatus"
disposition = "held_by_model"
ref = "kind:sample"
reason = "sample states its status (described, not_described, described_previously, no_sample or not_stated) for unknown, notDescribed, previousPaper and noSample, which say whether a sample is described, was described in an earlier paper or was not used; unknown maps to not_stated."

[[disposition]]
construct = "eSampleSource"
disposition = "held_by_model"
