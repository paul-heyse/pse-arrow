[[disposition]]
construct = "COMP (table)"
disposition = "mapping_loss"
ref = "kind:parameter_set"
reason = "The row is split into one parameter set per consuming form, declared per column group in mapping.toml, with Celsius, bar and g/mol converted per column; zero and template values standing for no data in critical, transport and EOS columns are declared absent because the file cannot tell a measured zero from a missing value."

[[disposition]]
construct = "COMP_EXT (table)"
disposition = "mapping_loss"
ref = "kind:parameter_set"
reason = "Only the identity and the varying constants of the generated rows are loaded, and every template-filled cell (TC 374.15 and PC 220.89 in 22138 rows, the water or methane block in the EOS, transport, hydrate and association columns) is declared absent, since importing it would assert water's parameters for 76 thousand species; the 900/0/0/0 Henry sentinel is likewise absent, and the generating tool is not recorded."

[[disposition]]
construct = "COMP columns: identity and bookkeeping"
disposition = "mapping_loss"
ref = "kind:identity_assertion"
reason = "NAME, CASnumber, FORMULA and InChIKey become name, cas, formula and inchikey assertions, with the placeholders CAS 0-0-0-0 and FORMULA default or HC declared not asserted and the four mojibake names kept only as verbatim name assertions; COMPTYPE mixes chemical class, phase role and model switches and is used only for the ion charge, and duplicate COMPINDEX values are not keys."

[[disposition]]
construct = "COMP columns: critical constants, acentric factor and basic state data"
disposition = "mapping_loss"
ref = "kind:observable"
reason = "TC and NORMBOIL are converted from degrees Celsius by the 273.15 offset (temperature scale not stated) and PC from bar, and the ion rows and the default row (ID 64), which carry template critical constants, are declared absent; LIQDENS (g/cm3) and STDDENS (no unit or temperature) are read under assumption, and MWAVG and PVMODEL carry no data and are not mapped."

[[disposition]]
construct = "COMP columns: ideal-gas heat capacity, formation data and sublimation"
disposition = "mapping_loss"
ref = "kind:energy_reference"
reason = "The CPA to CPE polynomial has no stated temperature range (validity coverage not_stated) and its units of J/(mol*K) per power are inferred, and the sensible enthalpy zero at 273.15 K against the formation datum, switched by a runtime flag, is two energy_reference sets with the gas constant 8.3144621 stated as the parameterization's convention; the water value -242000 in 23185 generated rows is a placeholder declared absent."

[[disposition]]
construct = "COMP columns: liquid and solid density, liquid and solid heat capacity, heat of vaporisation"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The equation of each five-cell block (LIQUIDDENSITYCOEFS, HEATOFVAPORIZATIONCOEFS) is fixed only by code that disagrees with the data, so the mapping chooses one reading per column and records the other as a discrepancy; units and validity ranges are not stated, zeros stand for absent, and the water-like block repeated in 131 rows is a template declared absent."

[[disposition]]
construct = "COMP columns: vapour-pressure, triple point and fusion"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The form is chosen by the type code plus a side condition on ANTOINEE, a mapping rule, with the evaluator's implicit shift of the pow10 constant by 273.15 written into the form; no fit range is stated, so the only validity is the evaluator's limit up to the critical temperature, applied by the mapping as an upper bound (assumed) from the same row's Tc."

[[disposition]]
construct = "COMP columns: cubic-EOS alpha-function parameters"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Each column triple maps to the alpha form its name gives, the choice by attractive-term number being a model_assembly choice, and the MCPR triple is also read as UMR-PRU coefficients with two implied zeros, a second set the mapping asserts; the per-name parameter sets hard-coded in the alpha classes (water, TEG, methane, ethane, nitrogen) are not in the table and are mapped only if read from the code."

[[disposition]]
construct = "COMP columns: CPA and association parameters"
disposition = "mapping_loss"
ref = "kind:site_scheme"
reason = "The scheme codes 4C, 2B, 1A and 2A map to site_scheme entities whose site multiplicities and donor or acceptor polarity are hard-coded in CPAMixingRuleHandler and not in the table, so the mapping takes them from code (assumed); the single association-energy column serves both the SRK and the PR set and is assigned to both."

[[disposition]]
construct = "COMP columns: UMR-CPA parameters"
disposition = "mapping_loss"
ref = "relation:dependency"
reason = "The block maps to a UMR-CPA parameterization for its 23 species, with the bar-litre units stated in the field comments converted to SI and the code-side factors 1e4, 1e2, 1e2 not reproduced; the dependency on the UMR-PRU group-interaction tables is implied by the model, not recorded in the file, and is asserted by the mapping from the code (assumed)."

[[disposition]]
construct = "COMP columns: PC-SAFT and SAFT-VR Mie parameters"
disposition = "mapping_loss"
ref = "kind:parameter_set"
reason = "The segment diameter is taken as Angstrom (inferred from the division by 1e10) and the association energy as J/mol by analogy with CPA, both assumed since neither is stated; a zero in a SAFT-VR Mie column means use PC-SAFT, so those zeros are declared absent and the fallback chain is a named rule of a selection_policy, not data."

[[disposition]]
construct = "COMP columns: electrolyte, dielectric and Henry parameters"
disposition = "mapping_loss"
ref = "kind:parameter_set"
reason = "The Henry coefficients map to a form that adds the fixed constant ln 1.802 and evaluates a solute in water, the solvent basis being assumed from the code and the units not stated; zero coefficients (313 rows) and the 900/0/0/0 marker are declared absent, the 76 rows with a Sander (2023) attribution carry it, and the ion pin K = 1e-40 is program behaviour that is not kept."

[[disposition]]
construct = "COMP columns: hydrate and wax parameters"
disposition = "mapping_loss"
ref = "kind:site_class"
reason = "The small and large cavities of structures I and II map to site_class rows of a clathrate phase definition with a Langmuir form A/T*exp(B/T) inferred from the evaluator, the units of A not stated and assumed; the two model variants (the Hydrate* and GF columns) are two parameterizations chosen by the fluid model name, a selection recorded as a fact, and a zero pair means the guest does not occupy the cavity."

[[disposition]]
construct = "COMP columns: transport and surface-tension parameters"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The four liquid-viscosity type codes map to four forms with LIQVISC1 to 4 as slots, the units of those cells being inferred from the evaluator (the result is divided by 1e3) and not stated, and the conductivity polynomial and parachor to their own forms; the fixed values 0.5 and 0.7 above Tc or for an unknown type are evaluator behaviour and not kept, and template dipole and Lennard-Jones values are declared absent."

[[disposition]]
construct = "INTER (table)"
disposition = "mapping_loss"
ref = "kind:parameter_set"
reason = "The row splits by consuming model into pair slot groups whose transposition is symmetric for the kij columns and linear (swap) for the oriented ones, a stored row serving both orders; a missing pair is no set and the zero default is a selection_policy stated_default, while 28 of the 112 names do not resolve to a COMP row and the truncation at a double underscore is a mapping rule."

[[disposition]]
construct = "INTER columns: key"
disposition = "mapping_loss"
ref = "kind:source_entity"
reason = "COMP1 and COMP2 become the subjects of each pair set with the stored order kept as the arrangement; the 28 names that match no COMP row (several differing only in case or punctuation, as c-c7 against c-C7) are not case-folded and become separate source entities or held rows with reason unknown_subject."

[[disposition]]
construct = "INTER columns: cubic-EOS and PC-SAFT kij"
disposition = "mapping_loss"
ref = "kind:parameterization"
reason = "The KIJSRK, KIJPR, KIJPCSAFT and Soreide-Whitson columns become four parameterizations, the boundary between PR and SRK being an exact Java class name the file does not declare; the value 1 in 330 KIJSRK rows, nearly all ion pairs, is a sentinel convention and declared absent, stored zeros cannot be told from absent pairs and are mapped as known, and KIJTType -1 has no defined meaning and is held."

[[disposition]]
construct = "INTER columns: CPA cross-association and CPA kij"
disposition = "mapping_loss"
ref = "relation:subject_subform_choice"
reason = "cpaAssosiationType becomes a per-pair sub-form choice, but code 0 (1280 rows) is also what a missing row gives, so emitting a rule-ER choice for each asserts a choice the source only fills in by default; zero cross beta and eps mean use the combining rule, and the oriented cpakijx and cpakjix are a linear-transposition pair beside the symmetric cpakij."

[[disposition]]
construct = "INTER columns: Huron-Vidal"
disposition = "mapping_loss"
ref = "relation:subject_subform_choice"
reason = "The per-pair HVTYPE switch is a sub-form choice per pair, so one mixture can use two mixing rules, and HVGIJ and HVGJI are an ordered pair stored as asserted for the row's COMP1 and COMP2 order with a linear swap; the energy parameters have no stated unit and J/mol is assumed from magnitudes up to 99000."

[[disposition]]
