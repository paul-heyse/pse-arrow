disposition = "mapping_loss"
ref = "relation:equivalence_assessment"
reason = "NRTLGIJ and NRTLGJI equal HVGIJ and HVGJI in 1201 rows, and the file does not say whether they are one set or two, so both are mapped as independent sets and their agreement recorded as an exact equivalence_assessment, which loses the question of whether one set was meant; KIJWS is a dead column and is not mapped."

[[disposition]]
construct = "INTER columns: electrolyte w-parameters and other model columns"
disposition = "mapping_loss"
ref = "kind:parameter_set"
reason = "W1 is mapped as known only where CalcWij selects the stored value, since otherwise the pair's w comes from a built-in formula that is a named rule and not data, and W2 and W3, zero in every row, are not mapped; the Grunberg-Nissan parameter GIJVISC is mapped as a parameter of a viscosity form although stored in a thermodynamic table."

