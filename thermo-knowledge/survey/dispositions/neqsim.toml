reason = "Secondary groups map to group rows with the main group as partition_class, but the file declares no scheme revision and one table serves the original, PSRK and UMR schemes (interaction matrices over 64 against 70 main groups), so the mapping assumes the scheme or schemes it creates; the main-group numbers have no label and R and Q are taken as dimensionless."

