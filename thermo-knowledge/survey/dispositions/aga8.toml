[[disposition]]
construct = "component list and fixed order (x array)"
disposition = "mapping_loss"
ref = "kind:source_entity"
reason = "The 21 components exist only as array positions with names in comments, so the mapping creates one source entity per position with a name assertion and no registry identifier, and their resolution to species rests on curated decisions; the zero-mole-fraction skip (x above 1e-15) is procedural and is not kept."

[[disposition]]
construct = "GERG-2008 pure-component constants (MMiGERG, Dc, Tc)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "Dc, Tc and MMiGERG are slots of a pure group of the GERG-2008 reducing-function form, not observable-tagged critical-point values, so the role the equation gives Dc and Tc is kept by the slot group; Vc3 and Tc2 are computed in setup and are not stored."

[[disposition]]
construct = "GERG-2008 pure-fluid residual terms (noik, doik, toik, coik, kpol, kexp)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The 304 terms are family rows of power and exponential term forms per pure species, with the d and c exponents held as dimensionless slots; repeating the shared 12- and 24-term exponent layouts for each fluid is a difference of arrangement, and evaluation at the mixture reducing variables belongs to the model assembly."

[[disposition]]
construct = "GERG-2008 ideal-gas terms (n0i, th0i)"
disposition = "mapping_loss"
ref = "kind:energy_reference"
reason = "The mapping reads the published n0 and th0 values from the assignments before setup rewrites n1, n2 and n3 and scales all n0 by Rs/RGERG, so the rewritten running tables are not kept; the datum (zero enthalpy and entropy of the ideal gas at 298.15 K and 101.325 kPa) is inferred from code comments that never execute and is recorded as an assumption."

[[disposition]]
construct = "GERG-2008 binary reducing parameters (bvij, gvij, btij, gtij)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The published bvij, gvij, btij and gtij go to a pair group of the GERG reducing-function form with a reciprocal transposition on the beta slots, stored as asserted: the isobutane and n-butane betas that the code reverses get arrangement 1 instead of being rewritten, so orientation no longer depends on identifier order, and the setup's combined quantities are derived, not stored."

[[disposition]]
construct = "GERG-2008 departure functions (dijk, tijk, cijk, eijk, bijk, gijk, nijk; kpolij, kexpij; mNumb; fij)"
disposition = "held_by_model"
ref = "kind:model_component"
reason = "Model 10 is one model_component with its own parameter set that the eight pairs using it reference, each pair keeping its own fij in a pair group, and the raw eta, epsilon, beta and gamma are read from the assignments before setup combines them; the unnamed integer model number becomes the component's name."

[[disposition]]
construct = "DETAIL equation terms (an, bn, kn, un, fn, gn, qn, sn, wn)"
disposition = "mapping_loss"
ref = "mechanism:equation taken from code"
reason = "The 58 terms map to a family of a DETAIL form, but the composition factors F, G, Q, S and W that the flags fn, gn, qn, sn and wn select are built by the combining rules of xTermsDetail, so the form's expression is written from that code and the flags are integer slots with no documented meaning."

[[disposition]]
construct = "DETAIL characterisation parameters (Ei, Ki, Gi, Qi, Fi, Si, Wi)"
disposition = "mapping_loss"
ref = "mechanism:unstated unit assumed"
reason = "The seven characterisation parameters per component have no units in code or comments, so the mapping assumes them from the setup arithmetic (Ei a temperature, Ki a length scale), and because only nonzero entries are assigned, 'not characterised' cannot be told from zero and is mapped as a known zero."

[[disposition]]
construct = "DETAIL binary interaction parameters (Eij, Uij, Kij, Gij)"
disposition = "held_by_model"
ref = "kind:selection_policy"
reason = "Each of the four matrices is a pair group whose listed pairs are parameter sets, and an unlisted pair takes the combining value 1 from a selection_policy with unasserted stated_default, recorded as a rule instead of 210 rows per matrix; a listed pair stays distinguishable from an unlisted one."

[[disposition]]
construct = "GROSS method inputs and correlation constants"
disposition = "mapping_loss"
ref = "mechanism:equation taken from code"
reason = "The B and C correlation constants and heating values map to a form with nested polynomial-in-T sets, but about fifteen constants sit inline in function bodies and the equivalent-hydrocarbon characterisation (Methods 1 and 2, iterating on Z) is a procedure on bulk inputs, so the form is written from code and the procedure is not kept as data."

[[disposition]]
construct = "C test programs and in-source reference values"
disposition = "held_by_model"
ref = "relation:dataset_verifies"
reason = "A dataset of kind verification linked by `dataset_verifies` rows to the GERG-2008 and DETAIL assemblies and to the parameterisations they were computed with, origin computed and uncertainty kind not_stated; the two conflicting d2P/dD2 references (1130.48 and 1129.53) are in two datasets joined by an equivalence_assessment of level conflicting, and the unused U_reference check is program behaviour."

[[disposition]]
construct = "TESTDATA workbooks (validation point sets)"
disposition = "held_by_model"
ref = "kind:dataset"
reason = "A dataset of kind computed whose derivation names REFPROP 9.1 as software, so the values are labelled as computed outputs and not as measurements; the blank composition cells are zero mole percent by the sheet's own convention."
