[[disposition]]
construct = "isotherm header (BaseIsotherm)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "The unit and basis fields select the observable and the storage conversion, but the library replaces a missing unit by its default (bar, g, mmol, K) with only a warning, so a default cannot be told from a stated unit and is assumed stated. The adsorption kind cannot be recorded (adsorption not_stated), volume, percent, fraction and per-mole bases are converted only where adsorbate molar mass or host density is available and otherwise held, and the material is a provisional material identified by name."

[[disposition]]
construct = "PointIsotherm data"
disposition = "mapping_loss"
ref = "kind:data_point"
reason = "branch is mapped only where the source states it (a branch column or mark), not from the library's pressure-maximum guess, which cannot represent repeated cycles; extra columns such as differential enthalpy carry free-text units and need an observable each, so they stay unmapped until one is declared. No uncertainty is stated, so no assessment rows are written."

[[disposition]]
construct = "ModelIsotherm"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "Each of the 18 isotherm equations is declared as a form when mapped, with parameter units derived from the header's pressure and loading units (the fit is not dimension-checked); the range-normalised RMSE and the branch fitted have no slot (a fit holds objective and outcome) and stay in the derivation's method text. The stored pressure and loading ranges and the isotherm's temperature become fitted_range validity clauses."

[[disposition]]
construct = "Material record"
disposition = "mapping_loss"
ref = "kind:material"
reason = "Identity by name gives a provisional material (the shipped registry holds none); density and molar mass have unstated units, taken as g/cm3 and g/mol from the converter tables, and attach as one-point dataset values (MassDensity exists) because material has no property attributes. A batch becomes a sample; sample mass and activation temperature have no place."

[[disposition]]
construct = "Adsorbate record"
disposition = "mapping_loss"
ref = "kind:species"
reason = "Names, aliases, the LaTeX formula and inchikey become identity assertions; property units need a declared source unit per field (the notation '10e18 esu cm' is read as debye by assumption, bar to Pa, g/mol to kg/mol), and the critical and triple constants are taken as authored though they appear copied from CoolProp. Cross-sectional area, kinetic diameter, polarizability and quadrupole moment need observables declared with the mapping."

[[disposition]]
construct = "adsorbate property type"
disposition = "held_by_model"
ref = "kind:observable_alias"
reason = "Each of the 26 keys is an observable_alias of carrier_scope pygaps with its precision and loss, or a naming scheme for alias, inchikey and backend_name; the unit string is not stored because the unit is the observable's quantity type, and the mixed notation (g mol^{-1}) is restated as a pint-parsable source unit in the mapping."

[[disposition]]
construct = "JSON isotherm file (pyGAPS)"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "As for the header; in addition the fixture's temperature in degrees Celsius is converted by offset and its pressure in atm to Pa, while its loading in percent has no stated basis and is held. Null metadata keys are dropped, and the free metadata (user, lab, date, instrument) has no typed place beyond dataset text."

[[disposition]]
construct = "NIST ISODB JSON reader mapping"
disposition = "out_of_scope"
ref = ""
reason = "This is pyGAPS's import code for another source's files (its single-component restriction, dropped fields and wt% handling are program behaviour), not thermodynamic knowledge; the ISODB content itself is mapped from the isodb source."

[[disposition]]
construct = "AIF file"
disposition = "mapping_loss"
ref = "kind:dataset"
reason = "Each branch loop becomes the branch of its data points, the per-point p0 a vapor_pressure column of the adsorbate component, and the unit strings parsed by the external adsorption_file_parser are restated as declared source units. The operator, instrument, date and sample mass tags are people and measurement metadata with no typed place (attribution takes a source, not a person) and are dropped or kept as method text."

[[disposition]]
construct = "CSV and Excel isotherm files"
disposition = "mapping_loss"
ref = "kind:dataset_column"
reason = "The mapping takes each column's unit from the header's unit keys and checks it against the unit in the column-header name (for example loading(mmol)); a file where the two disagree has its columns held, not reconciled."

[[disposition]]
construct = "unit and basis tables"
disposition = "mapping_loss"
ref = "enum:amount_basis"
reason = "The units are pint's and the mode tables map to amount_basis members (mass to per_host_mass, volume to per_host_volume), but the percent, fraction and per-mole-of-host bases have no member and are converted or held. STP is assumed to be 273.15 K and 101325 Pa (inferred from the 4.461e-5 mol/cm3(STP) factor), and the amu entry, whose magnitude convention is undocumented, is not used."

[[disposition]]
construct = "Horvath-Kawazoe material property sets"
disposition = "mapping_loss"
ref = "mechanism:form catalogue"
reason = "The Horvath-Kawazoe slit-pore potential is declared as a form with a pure slot group over provisional materials (Carbon(HK), AlSiOxideIon, AlPhOxideIon) holding the four values, with units from the HK_KEYS comments (nm, nm^3, nm^3, molecules/m^2); the values are uncited, so no primary attribution is recorded."

[[disposition]]
construct = "DFT kernel and standard isotherm tables"
disposition = "mapping_loss"
ref = "kind:tabulated_function"
reason = "The kernel is a tabulated_function with two axes (pore width, relative pressure) and a loading series, and the two standard isotherms are measured datasets; the units (nm, relative pressure, mmol/g) come from the documentation and the loader's defaults, not from the files. The DFT method and the reference of the standard isotherms are not stated, so the derivation and the attribution stay empty."
