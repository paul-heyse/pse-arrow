[[disposition]]
construct = "model specification document ({kind, model, validate})"
disposition = "out_of_scope"
ref = ""
reason = "The {kind, model, validate} document is the library's input format for make_model; the knowledge it carries is mapped through the per-kind constructs below, while the validate flag, file paths and the path-or-inline indirection hold no thermodynamic knowledge."

[[disposition]]
construct = "JSON Schema documents of the model kinds"
disposition = "out_of_scope"
ref = ""
reason = "The shipped JSON Schemas document the specification language of the input documents and are generated from pydantic models; they state no thermodynamic content, and the factory code is the authority where they are narrower."

[[disposition]]
construct = "multifluid model specification (kind multifluid)"
disposition = "mapping_loss"
ref = "kind:model_assembly"
reason = "The multifluid document maps to an assembly with pair parameters taken from the referenced files and the Lorentz-Berthelot fallback (betas and gammas 1, F 0) as a selection_policy named rule, but the free-form flags and the gas-constant rule (mole-fraction-weighted pure values unless Rmodel is CODATA) are not kept as rules, because a convention fact belongs to one convention set, so the mapping states one gas constant for the assembly."

[[disposition]]
construct = "kinds vdW1 and vdW"
disposition = "mapping_loss"
ref = "mechanism:unstated unit assumed"
reason = "vdW1 states a and b with no unit, so the mapping assumes SI (Pa m^6/mol^2 and m^3/mol) from their use with T in K and density in mol/m^3; vdW takes Tcrit and pcrit, whose units are in the key names."

[[disposition]]
construct = "kinds PR, SRK and cubic (generalised cubic with alpha functions)"
disposition = "mapping_loss"
ref = "kind:convention_set"
reason = "The alpha choice per component becomes a subject_subform_choice and the PR78 alpha is a form written from code, but the gas constant a document may omit has a silent code default that the mapping records as an assumed convention value, and an absent kmat is read as all zeros, mapped as known."

[[disposition]]
construct = "kinds QCPRAasen and RKPRCismondi2005"
disposition = "mapping_loss"
ref = "mechanism:unstated unit assumed"
reason = "The temperature-dependent covolume and the volume translation are sub-forms of a cubic form, so they do not limit the model, but As and Bs carry no unit and are given the temperature dimension the formula implies, and the paper's scope (helium, neon, hydrogen, deuterium), stated only in a class comment, becomes a validity region the mapping must state."

[[disposition]]
construct = "kind advancedPRaEres (PR with excess-energy mixing rule)"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "The form is a cubic with a mixing-rule sub-form that accepts an excess-energy contribution; the two-component limit (the factory's fixed 2-by-2 zero lmat) and the Wilson-only factory are limits of the constructor, not properties of the model, and are not carried."

[[disposition]]
construct = "kind CPA (cubic plus association)"
disposition = "held_by_model"
ref = "kind:site_scheme"
reason = "Both specifications map to a site_scheme with association_site rows: the legacy classes 1A, 2B, 3B and 4C are named site schemes with their site multiplicities and the sites list gives the labels directly, so the coexistence is a difference of arrangement."

[[disposition]]
construct = "kinds PCSAFT and PCSAFTPureGrossSadowski2001"
disposition = "held_by_model"
ref = "kind:model_assembly"
reason = "The ab selector is a choice of the universal-constants parameterization, the polar terms are optional sub-form choices present only for components that give both the moment and its count (an absent pair is no choice, not a zero), and the three embedded fluids are ordinary parameter sets of the carrier."

[[disposition]]
construct = "kind SAFT-VR-Mie (with polar models and flags)"
disposition = "held_by_model"
ref = "kind:assembly_choice"
reason = "The polar_model string decodes into three sub-form choices (the term, the J integral and the K integral) that the assembly records per slot, and each alternative-unit key (sigma_m or sigma_Angstrom, mu_Cm or mu_D) is converted by its stated unit."

[[disposition]]
construct = "kinds SoftSAFT and genericSAFT, and the association model specification"
disposition = "mapping_loss"
ref = "kind:site_scheme"
reason = "The site scheme is constructed by the mapping from the free-text molecule_sites labels, with multiplicity counted from repetition, because the source declares none; radial_dist is carried in the data but ignored by Association::factory for the CR1 rule, so the value the code applies is the mapping's assumption."

[[disposition]]
construct = "kinds GERG2004resid, GERG2008resid, GERG2004idealgas, GERG2008idealgas"
disposition = "mapping_loss"
ref = "kind:energy_reference"
reason = "The constructor overwrites the stored n0(1) and n0(2) so that h and s vanish at 298.15 K and 101.325 kPa, so the mapping takes the published constants from GERG.hpp and records that zero in the energy_reference instead of the recomputed values, with the 8.314510/8.314472 factor on the ideal terms as an assumed convention; the ideal-gas and residual models are the two sub-forms of one assembly."

[[disposition]]
construct = "kind LKP"
disposition = "held_by_model"
ref = "mechanism:form catalogue"
reason = "kmat here multiplies the pseudo-critical temperature, unlike the (1 - k_ij) of the cubic and SAFT kinds; slots are form-local, so the lkp pair slot is declared with its own meaning and nothing is mapped by the name kmat."

[[disposition]]
construct = "kinds multifluid-ECS-HuberEly1994, multifluid-association and multifluid-activity"
