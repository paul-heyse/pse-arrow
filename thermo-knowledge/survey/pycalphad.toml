locator = "pycalphad/io/tdb.py:202-203 (grammar), :268-345 (_process_typedef), :437 (queued), :1011-1018 (applied after all PHASE statements)"
meaning = "Declares a one-character type code that PHASE statements list, and (only for three forms) attaches a model hint to the phases that use the code. The reader interprets exactly: GES AMEND_PHASE_DESCRIPTION (abbreviated A_P_D) <phase> MAGNETIC <afm factor> <structure factor>; ... <ordered phase> DISORDERED_PART (abbreviated DIS_PART) <disordered phase>; ... <ordered phase> NEVER_DISORDER (abbreviated NEVER_DIS) <disordered phase>. Forms with fewer than 4 tokens after the type character (for example '% SEQ *') are ignored; IF/THEN forms warn and are ignored; a 4th token that matches none of the three keywords raises ValueError."
subject = "A type character, keyed by that single character; the effect is applied to the phases whose PHASE statement lists it (magnetic) or to the two phases it names (order-disorder)."
fields = [
  { name = "type character", meaning = "single character listed in the PHASE statements", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "command words", meaning = "GES A_P_D ... or SEQ; the second word is not checked", unit = "not applicable (text)", shape = "enum", role = "unread" },
