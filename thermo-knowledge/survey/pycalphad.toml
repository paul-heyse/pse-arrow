  { name = "ordered and disordered phase", meaning = "names of the ordered phase and the disordered phase that is its partition partner", unit = "not applicable (text)", shape = "reference", role = "input" },
]
origin = "authored"
conventions = "The magnetic hints are stored as ihj_magnetic_afm_factor and ihj_magnetic_structure_factor on every phase using the code (even when the Xiong model, afm factor 0, is selected). Order-disorder hints are written to both phases. Other Thermo-Calc phase descriptions listed in tdb_keywords.TDB_PHASE_DESCRIPTIONS (EXCESS_MODEL, DEBYE_HUCKEL, QUASICHEM_IONIC, FRACTION_LIMITS, ...) have no handling here."
absence = "A type character used by a phase but never defined triggers a warning; a defined character used by no phase warns. Absence of a MAGNETIC definition means the phase has no magnetic contribution."
validity = "not stated"
provenance = "none"
count = "161 statements in 48 files: 94 MAGNETIC, 20 DIS_PART plus 1 DISORDERED_PART, 1 NEVER_DIS, 45 short forms"
example = "examples/alfe_sei.TDB (TYPE_DEFINITION with MAGNETIC)"
