[[convention]]
name = "SER reference and GHSER functions"
locator = "pycalphad/io/tdb.py:420-427; pycalphad/io/cs_dat.py:1189-1196; pycalphad/core/utils.py, variables.py (mass only); examples/ReferenceStateExamples.ipynb"
statement = "pycalphad applies no reference state itself. Energies are whatever the file's FUNCTION and PARAMETER expressions give, conventionally relative to the stable element reference through GHSER-type functions that the TDB defines as ordinary FUNCTIONs. The ELEMENT reference phase, H298-H0 and S298 are stored and never used in a calculation; DAT files get reference phase BLANK and zero H298 and S298. A different reference state is obtained only by the property-framework ReferenceState meta-property (equilibria of the pure elements in chosen phases at fixed conditions) or the deprecated Model.shift_reference_state."
scope = "all TDB and DAT energies"

[[convention]]
name = "gas constant"
locator = "pycalphad/variables.py:939"
statement = "R = 8.3145 J/mol/K, fixed in the library (si_gas_constant). It enters ideal mixing, the magnetic and two-state and Einstein contributions and the MQMQA entropy, and it replaces the symbol R inside TDB expressions. The value the ChemSage export used is not stated in the DAT files."
scope = "Model, ModelMQMQA, TDB expressions containing R"

[[convention]]
name = "energy basis: per mole of formula unit versus per mole of atoms"
locator = "pycalphad/model.py:485-494 (GM versus G), :626-638 (_site_ratio_normalization), :914-931, :1581-1587; pycalphad/models/model_mqmqa.py:521-549"
statement = "Parameters are per mole of formula unit (site ratios as written). Model.GM divides the sum of contributions by the moles of atoms in one formula unit (sum over sublattices of site ratio times the atoms of each species times its site fraction, vacancy counting zero); Model.G multiplies back. V0 is normalised per formula unit, VA is taken per mole of atoms. For the MQMQA one formula unit is one mole of quadruplets and GM divides by the moles of non-vacancy constituents."
scope = "all contributions"

[[convention]]
name = "Redlich-Kister sign and constituent ordering"
locator = "pycalphad/io/tdb.py:379-388; pycalphad/model.py:703-709 (comment), :822-826; pycalphad/io/cs_dat.py:349-356"
statement = "A TDB reader sorts the upper-cased constituent names alphabetically within each sublattice before storing a parameter; the binary interaction term is L*(y_first - y_second)^order in that order, so an odd-order term changes sign if the two names are swapped and the source order in the file is not retained. The DAT reader keeps the file's constituent order instead, and notes that a pair (A,B) is then distinct from (B,A) for odd orders. For ternary arrays the order index 0, 1, 2 selects the first, second or third constituent in the sorted order. For the ionic liquid the second-sublattice constituents are ordered charged, vacancy, neutral instead."
scope = "binary and ternary excess parameters"

[[convention]]
name = "site-fraction constraints and vacancies"
locator = "pycalphad/model.py:544-567 (get_internal_constraints), :410-439, :287-293; pycalphad/variables.py:91,195; pycalphad/models/model_mqmqa.py:515-519"
statement = "Each sublattice's site fractions sum to one. A charged phase with constant site ratios adds a charge-balance constraint; the ionic liquid needs none because its site ratios follow composition. The MQMQA constrains the quadruplet fractions to sum to one. A vacancy (VA) counts as a constituent on its sublattice but has zero atoms: it is excluded from atom-normalisation, from moles() of elements and from the nonvacant element list used for mass balance; a phase whose only species are vacancies cannot be built."
scope = "all Model phases"

[[convention]]
name = "temperature limits of piecewise expressions"
locator = "pycalphad/io/tdb.py:105-141, pycalphad/model.py:215-217, :329-366; pycalphad/io/cs_dat.py:122-130"
statement = "Parsed expressions are half-open in T: [lower, upper), zero outside, with 0.01 K as the default lower limit. Model widens the first and last piece to negative and positive infinity by default (extrapolate_temperature_bounds is True), matching what the code comment says most commercial codes do. DAT intervals start at the previous interval's upper limit, and an interval of zero width is opened to 10000 K."
scope = "FUNCTION and PARAMETER expressions, DAT intervals"

[[convention]]
name = "case folding and name syntax"
locator = "pycalphad/io/tdb.py:964-975, :180-189"
statement = "The whole TDB text is upper-cased before parsing, so phase, species, function and element names are case-insensitive and stored in upper case. Keyword abbreviation is allowed by matching each underscore-separated piece as a prefix. Species names may contain + - * / _ . ; element symbols are 1-2 letters."
scope = "TDB names"

[[convention]]
name = "composition conditions and clipping"
locator = "pycalphad/core/conditions.py (Conditions.minimum_composition and Conditions.__setitem__)"
statement = "Composition conditions (mole, mass or site fraction) are clipped to [1e-10, 1 - 1e-10] with a warning for values between 0 and 1e-10; N is fixed at 1 mole."
scope = "equilibrium and calculate"

[[convention]]
name = "atomic mass fallback"
locator = "pycalphad/io/tdb.py:402-418, :420-427"
statement = "When an ELEMENT statement gives mass 0.0, a built-in table of g/mol values keyed by element symbol is used (for example Zn 65.39, Ge 72.64); the edition of atomic weights behind the table is not stated."
scope = "element masses used for mass-fraction conditions"

