[[construct]]
name = "ELEMENT"
locator = "pycalphad/io/tdb.py:197-198 (grammar), :420-427 (_process_reference_state), :435 (processor); TDB keyword list io/tdb_keywords.py:9-37; header comment of pycalphad/tests/databases/diffusion.tdb"
meaning = "Declares a pure element (or a special pseudo-element) with its reference phase, atomic mass, H298-H0 and S298. The reader also creates a species of the same name and a one-atom formula. VA (vacancy) and /- (electron gas) are declared as elements with zero mass."
subject = "One element, keyed by its 1-2 character symbol (letters, '/' and '-' allowed), upper-cased."
fields = [
  { name = "symbol", meaning = "element symbol, for example AL, VA, /-", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "reference phase", meaning = "name of the stable element reference phase (SER), given as a bare name; need not be a PHASE of the file (ELECTRON_GAS and VACUUM appear for /- and VA)", unit = "not applicable (text)", shape = "reference", role = "unread" },
  { name = "mass", meaning = "atomic mass; when 0.0 the reader substitutes a built-in table of atomic masses keyed by symbol", unit = "not stated (the built-in table is commented g/mol)", shape = "scalar", role = "input" },
  { name = "H298-H0", meaning = "enthalpy difference of the element in its reference phase between 298.15 K and 0 K, according to the column header comment in diffusion.tdb", unit = "not stated (inferred from the SGTE values: J/mol)", shape = "scalar", role = "unread" },
  { name = "S298", meaning = "entropy of the element in its reference phase at 298.15 K, according to the same header comment", unit = "not stated (inferred from the SGTE values: J/mol/K)", shape = "scalar", role = "unread" },
]
origin = "authored by the database author; the values of common elements match the SGTE unary tables (see the sgte_unary survey) but the TDB files carry no per-value citation"
conventions = "Stable Element Reference (SER): the reference phase names the structure whose Gibbs energy the database measures from; nothing in pycalphad uses it to shift energies. Only the mass is read by the library (phase_record_factory.py:16 and variables.py:765,812); the writer echoes the other three. 0.0 for H298-H0 or S298 is indistinguishable from not given."
absence = "A missing ELEMENT for a constituent element raises at species lookup. Zero H298-H0 or S298 is stored as 0.0 and means either zero or unknown (29 of the 78 real elements in the SGTE unary file have both zero). Zero mass means use the built-in table (0.0 is kept if the symbol is missing from the table)."
validity = "not stated"
provenance = "none in the statement; the surrounding comment banner of a file may name the assessment but is discarded by the reader"
count = "291 statements in 48 files (64 in examples/, 227 in the tests), including VA and /- entries"
example = "examples/Al-Cu-Y.tdb (ELEMENT statements near the top)"
candidate = "element (for real elements); species for VA and the electron; energy_reference plus element_reference (reference phase as a species_form per element) for the reference-phase column; convention_set for the H298-H0 and S298 datum"
precision = "close"
loss = "H298-H0 and S298 are a datum for the element in its reference phase and have no slot in the energy_reference model unless modelled as element_reference values; the reference phase is a bare name that may match no declared PHASE; the atomic-mass edition is not stated; a zero cannot be told from not given."

[[construct]]
name = "SPECIES"
locator = "pycalphad/io/tdb.py:200 (grammar), :396-400 (_process_species), pycalphad/io/grammar.py:13 (chemical_formula)"
meaning = "Declares a non-element species by name and formula with an optional integer charge. A species name may be any string of letters, digits and + - * / _ . ; the formula is a run of 1-2 letter element symbols each followed by an optional (possibly fractional) count, then optionally '/' and a signed integer charge."
subject = "One species, keyed by name; the formula gives elements and charge. An element declared by ELEMENT is also a species with the same name."
fields = [
  { name = "name", meaning = "species label used in CONSTITUENT and PARAMETER statements; need not spell the formula (for example ALO3/2)", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "formula", meaning = "element symbols with counts, for example AL1O1.5", unit = "not applicable (count of atoms per element, float allowed)", shape = "list", role = "input" },
  { name = "charge", meaning = "integer charge number after '/', signed, default 0, for example AL1/+3", unit = "not applicable (charge number)", shape = "scalar", role = "input" },
]
origin = "authored"
conventions = "Charge syntax in TDB is a trailing /+N or /-N on the formula; in ChemSage DAT files it is a bracketed postfix such as FE[2+] (cs_dat.py:25-37), so the same ion has two syntaxes. A vacancy is the element VA with mass 0; number_of_atoms ignores VA so a vacancy carries zero atoms in normalisation."
absence = "A constituent that is neither an ELEMENT nor a SPECIES raises on CONSTITUENT. A missing charge is neutral (0); the reader cannot tell unstated from zero."
validity = "not stated"
provenance = "none"
count = "116 statements in 48 files (7 in examples/, 109 in the tests); 24 carry a charge"
example = "pycalphad/tests/databases/al2o3_nd2o3_zro2.tdb (SPECIES AL+3 AL1/+3)"
candidate = "species (formula via composition, charge via species.charge), with species_form for aggregation"
precision = "exact"
loss = "The reader upper-cases names and keeps a fractional stoichiometry as float; associates are ordinary species with multi-element formulas."

[[construct]]
name = "FUNCTION"
locator = "pycalphad/io/tdb.py:105-141 (_make_piecewise_ast), :39-61 (_sympify_string), :193-195 (func_expr), :205-207 (grammar), :429-432 (duplicate check)"
meaning = "A named temperature-dependent expression (for example a lattice-stability or pure-element Gibbs function) referenced by name from other FUNCTIONs and from PARAMETER expressions. Syntax: a lower temperature limit (or a comma, which the reader turns into 0.01), then one or more pieces, each an expression terminated by ';' followed by an optional upper temperature limit and an optional Y (continue to the next piece) or a final N; an optional reference key may follow."
subject = "One named function, keyed by its name (letters, digits, _ : - ( ) /)."
fields = [
  { name = "name", meaning = "function name; a duplicate name in one file raises ValueError", unit = "not applicable (text)", shape = "scalar", role = "input" },
  { name = "lower limit", meaning = "lower temperature of the first piece; ',' means 0.01", unit = "K (inferred: T symbol)", shape = "scalar", role = "input" },
  { name = "piece expression", meaning = "expression in T (and P, R) using + - * / ** with integer or real powers, LN, LOG, EXP and references to other function names (an optional # after a name is stripped); parsed through a whitelist of Python AST node types (Add, Sub, Mult, Div, Pow, unary +/-, calls, names, numbers)", unit = "not stated (inferred: J/mol)", shape = "function", role = "input" },
  { name = "upper limit", meaning = "upper temperature of the piece; missing means open-ended above", unit = "K (inferred)", shape = "scalar", role = "input" },
  { name = "continuation flag", meaning = "Y after a piece limit means another piece follows, N ends the expression", unit = "not applicable (flag)", shape = "enum", role = "input" },
  { name = "reference key", meaning = "trailing token such as REF:0 or a literature tag", unit = "not applicable (text)", shape = "reference", role = "unread" },
]
origin = "authored or transcribed from assessments; the SGTE unary functions are transcribed from SGTE tables (see sgte_unary); no per-function origin is machine-readable"
conventions = "Each piece is the half-open interval [low, high); outside the listed range the parsed Piecewise evaluates to 0 (the parser appends a zero default branch). The Model then, by default, widens the first and last pieces to -inf and +inf (Model.extrapolate_temperature_bounds is True, model.py:215-217 and unwrap_piecewise at :329-366), so the stated temperature limits are ignored for the energy. Variables T, P and R are recognised; R is replaced by the pycalphad gas constant 8.3145 (variables.py:939). Names are case-insensitive because the whole file is upper-cased first (tdb.py:964)."
absence = "A function referenced but not defined stays a free symbol and is an error at model build unless the caller supplies a value through the parameters argument."
validity = "temperature pieces as above; ignored by default in Model"
provenance = "reference key parsed and discarded (Optional(Suppress(reference_key)) in the grammar)"
count = "2041 statements in 48 files (271 in examples/, 1770 in the tests; 3 files are duplicated between the two groups)"
example = "examples/alcuzr-viscosity.tdb (FUNCTION GHSERAL, three pieces)"
candidate = "a form implementing a temperature-dependent contract (piecewise expression), referenced as a nested parameter set; dependency for function-to-function references"
precision = "close"
loss = "The model has no free-standing named function: a FUNCTION is a shared nested set referenced by several parameters, so the mapping needs a dependency relation per reference and a value type for 'expression with symbolic references'; temperature limits read literally (zero outside) and as used by Model (extrapolated) differ; the expression grammar (LN, EXP, **) needs the expressions page of the declaration."

[[construct]]
