# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "alphabetical constituent ordering"
question = "Does the alphabetical sort the TDB reader imposes equal the constituent order the authors of each database assumed for odd-order binary and ternary parameters, and does Thermo-Calc use the same order? The file does not state the ordering rule; the DAT reader keeps file order."
why_it_matters = "The sign of odd-order Redlich-Kister terms and the target of a ternary order index depend on it; a mapping that stores the array canonically must also store which member is 'first' under this rule."

[[question]]
about = "unused ELEMENT data"
question = "The reference phase, H298-H0 and S298 of every ELEMENT statement are never used by pycalphad. Is the reference state stated by the database (for example an SGTE unary function set) always consistent with them?"
why_it_matters = "The model needs an energy_reference per convention set; a TDB offers three numbers per element and a function library, with no statement of the datum."

[[question]]
about = "SUBQ and SUBG excess line: 12 floats and 3 of 5 pair stoichiometry floats"
question = "cs_dat.py reads 12 floats per SUBQ or SUBG excess term and 5 floats for each pair stoichiometry and says what they mean is unknown; Thermochimica's parser skips the 12 floats with a comment that the format's originator does not know their meaning. Are they used by any downstream model?"
why_it_matters = "They may carry information (additional interpolation parameters) that a lossless import must preserve."

[[question]]
about = "model class for MQMQA"
question = "The quadruplet quasichemical model does not fit any representation class exactly (it has cation and anion 'sublattices' but the degrees of freedom are quadruplet fractions and the endmembers are pairs). Is it a sublattice_gibbs variant, a new class, or the ordinary quasichemical family the model declared under phase_structure quasichemical?"
why_it_matters = "The class decides which slot groups and contract the model must declare for the pair, coordination and excess parameters (MQMG, MQMZ, MQMX)."

[[question]]
about = "ternary order 0 expansion"
question = "A single ternary order-0 parameter is expanded to orders 0, 1 and 2 at model build. Is this expansion a property of the stored data (the same three parameters) or of the evaluator, and does Thermochimica's SUBL parser (which does the same when exactly one order is given) agree for all arities?"
why_it_matters = "It decides whether the stored slot group holds one value or three."
