# ---------------------------------------------------------------------------
# DISCREPANCIES
# ---------------------------------------------------------------------------

[[discrepancy]]
locator = "pycalphad/io/database.py:23-38 (Phase docstring) versus pycalphad/io/tdb.py:185,348-377"
documented = "Phase.model_hints is described as holding hints for major constituents and typedefs"
actual = "The '%' major-constituent suffix is consumed by Suppress(Optional('%')) in the species grammar and MAJOR_CONSTITUENT is not among the typedef keywords _process_typedef interprets; no major-constituent hint is ever set. The phase option letters L, G, A and I are stored as hints but no model, solver or plot code reads them."
consequence = "79 CONSTITUENT statements with '%' in the pinned files lose that information; liquid, gas, aqueous and charged-phase flags are inert."

[[discrepancy]]
locator = "pycalphad/io/tdb_keywords.py:9-37 versus pycalphad/io/tdb.py:248-265"
documented = "TDB_KEYWORDS lists 27 valid Thermo-Calc keywords (the module notes that not all are fully supported)"
actual = "The grammar has rules for 18 keywords; ADD_CONSTITUENT, COMPOUND_PHASE, ALLOTROPIC_PHASE, FTP_FILE, OPTIONS, TABLE, CASE, ENDCASE and VERSION_DATA are listed with no rule, so a file using them raises a ParseException; DATABASE_INFORMATION is listed while the rule is DATABASE_INFO."
consequence = "Files from other tools using these keywords cannot be read; the listing cannot be used as the parser's coverage."

[[discrepancy]]
locator = "pycalphad/io/tdb_keywords.py:69-96 versus pycalphad/model.py"
documented = "TDB_PARAM_TYPES lists VISC, ELRS, THCD, SIGM, XI, MQ, MF, DQ, DF and VS with descriptions (viscosity, resistivity, conductivity, surface tension, mobility, diffusivity, volume)"
actual = "No Model contribution, property or plot code reads these types; they are stored in the parameter store and ignored. VC and VK are read but VC is unused and a non-zero VK only produces a warning (model.py:1599-1605). The ETA type in examples/alcuzr-viscosity.tdb is not in the list and is rejected unless the list is extended at run time, as examples/ViscosityModel.ipynb does."
consequence = "26 MQ parameters in diffusion.tdb and any property parameters are carried without effect."

[[discrepancy]]
locator = "pycalphad/io/tdb.py:236-242 and :379-388 versus pycalphad/io/database.py:383-429"
documented = "Database.add_parameter accepts a reference (ref) for each parameter and Database has a references mapping"
actual = "The grammar suppresses the trailing reference key of PARAMETER and FUNCTION statements and _process_parameter is called without a reference, so ref is always None and the references mapping stays empty after a TDB read; LIST_OF_REFERENCES is skipped."
consequence = "No provenance survives a read; any mapping must take references from the raw TDB text."

[[discrepancy]]
locator = "pycalphad/io/cs_dat.py:1042 versus :1126-1141"
documented = "parse_phase_cef declares an allowed list of base model codes for the 5-letter magnetic form (RKMP, QKTO, SUBL, SUBM, SUBG, SUBQ, WAGN with a trailing M)"
actual = "parse_phase dispatches only IDMX, RKMP, RKMPM, QKTO, SUBL, SUBLM, PITZ, SUBQ, SUBG, IDVD and IDWZ; every other code (SUBI, SUBM, WAGN and the other magnetic codes) raises NotImplementedError before the allowed-list check can apply."
consequence = "Only RKMPM and SUBLM can carry magnetic terms in a DAT read; SUBI and SUBM files from Thermochimica's test set cannot be read."

[[discrepancy]]
locator = "pycalphad/io/cs_dat.py:591-645 versus pycalphad/models/model_mqmqa.py:643-702"
documented = "SUBQExcessQuadruplet records a mixing code among G, Q, B or R"
actual = "ModelMQMQA evaluates G and Q for single-sublattice mixing and R for reciprocal mixing; a B code raises ValueError in the evaluator."
consequence = "A DAT with B-type excess terms reads but cannot be evaluated."

