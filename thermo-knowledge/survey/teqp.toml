# ---------------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------------

[[convention]]
name = "units in keys"
locator = "interface/CPP/teqp_impl_factory.cpp; every factory"
statement = "SI in the keys, with the unit written in the key string ('Tcrit / K', 'pcrit / Pa', 'epsABi / J/mol', 'rhomolar_crit / mol/m^3', 'sigma / m', 'sigma_Angstrom', 'mu_D' in Debye). Some kinds use reduced simulation units (model potentials: R = 1, T* and rho*) and the Thol LJ fluid file states 'LJ units' in its unit siblings. Fluid files follow the CoolProp molar SI convention."
scope = "all model specifications and fluid files"

[[convention]]
name = "gas constant"
locator = "include/teqp/constants.hpp lines 1-40; include/teqp/models/multifluid_gas_constant.hpp; cubics and other factories"
statement = "Not one value: R_CODATA2017 = 8.31446261815324 (cubic defaults and the IdealHelmholtz container), N_A times k_B from the 2019 redefinition (get_R_gas, used by the PC-SAFT and SAFT-VR-Mie models, SoftSAFT, genericSAFT, ECS and the multifluid compositions), a mole-fraction-weighted average of the pure gas_constant values (multifluid; CODATA by flag Rmodel), 8.314471 (ammonia-water), 8.314472 (GERG), 1 (simulation units), and a user value in kinds that read 'R / J/mol/K' or 'R_gas / J/mol/K'. The multifluid-association and multifluid-activity compositions switch to N_A k_B."
scope = "all Helmholtz-energy conversions"

[[convention]]
name = "kmat combining convention"
locator = "simple_cubics.hpp line ~175; pcsaft.hpp; saftvrmie.hpp lines 165-180; LKP.hpp line ~60"
statement = "kmat enters as (1 - k_ij) in the cubics, PC-SAFT, SAFT-VR-Mie (Lafitte cross energy) and association kinds, and as a direct multiplier of sqrt(Tc_i Tc_j) in LKP. It is symmetric, defaults to zero (or is empty) where omitted, and lmat (QCPR, RK-PR, advanced PR) plays the same role for the covolume."
scope = "binary interaction matrices"

[[convention]]
name = "reducing state and variables"
locator = "include/teqp/models/multifluid.hpp lines 140-200; multifluid_reducing.hpp lines 142-152"
statement = "tau = T_r(x)/T and delta = rho/rho_r(x) with the mixture reducing temperature and density; for pure components Tc and vc are the EOS reducing state (EOS[0]/STATES/reducing), not necessarily the critical point (code comment: usually but not always the critical point). The ideal-gas terms use T and rho directly."
scope = "multifluid, GERG and ECS kinds"

[[convention]]
name = "pair orientation and reciprocal betas"
locator = "include/teqp/models/multifluid_reducing.hpp lines 88-150; include/teqp/models/GERG/GERG.hpp lines 595-767 and 1003-1104"
statement = "A pair is stored once; when it is requested in the other order betaT and betaV are inverted (1/beta) and gamma and F are unchanged; the GERG tables do the same and the pair matrices are filled with betaT(j,i) = 1/betaT(i,j). The invariant reducing function uses antisymmetric lambda."
scope = "binary parameters of multifluid, GERG and mutant models"

[[convention]]
name = "identifier namespaces"
