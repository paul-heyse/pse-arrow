[[selection]]
name = "binary pair record lookup"
locator = "include/teqp/models/multifluid_reducing.hpp lines 9-86; include/teqp/models/multifluid.hpp lines 878-905"
rule = "Identifier kinds are tried in the alphabetical order of the map keys CAS, Name, REFPROP, hash; the first kind for which every pair of the mixture can be found is used. For a kind, records are matched in passes: hash1/hash2, then upper-cased Name1/Name2, then CAS1/CAS2, in either order; the first matching record in file order wins, with the orientation flag set when reversed. Failing all passes, flags.estimate supplies Lorentz-Berthelot values; force-estimate bypasses the records."
scope = "binary reducing parameters and F for multifluid kinds"
documented = "no: behaviour in code; consequence: CO2 with R1234yf resolves to the first record (Unpublished) under the CAS kind and depends on file order"

[[selection]]
name = "pure fluid resolution"
locator = "include/teqp/models/multifluid.hpp lines 1000-1070"
rule = "A component string is tried as an absolute or relative file path, then as a fluid name in root/dev/fluids, then through an alias map over NAME, CAS, REFPROP_NAME and ALIASES of all files (built on demand, throws on duplicates); prefixes PATH::, FLDPATH:: and FLD:: select a file or REFPROP content directly; an inline object is used as is."
scope = "multifluid components"
documented = "yes, in the doc comment listing four options"

