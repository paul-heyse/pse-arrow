# ---------------------------------------------------------------------------
# QUESTIONS
# ---------------------------------------------------------------------------

[[question]]
about = "which document is the authoritative specification of the kinds"
question = "The 14 shipped JSON Schemas are closed (additionalProperties false for 11) and differ from what the factories read: kind cubic reads R / J/mol/K and alpha type PR78, which the cubic schema omits; CPA reads kmat, options and pures[].sites, while the CPA schema requires class, forbids sites and has no kmat or options; SAFT-VR-Mie flags are accepted by the schema for names but ignored by the factory in that branch. With validate on by default, are valid specifications rejected (inferred from additionalProperties false)?"
why_it_matters = "The specification language is this source's main contribution; its contract must be taken from the code and the survey cannot assume the schemas are complete."

[[question]]
about = "radial_dist and association options"
question = "Association::factory (Delta_rule CR1) builds CanonicalData with radial_dist copied from an options object whose radial_dist is never set from the JSON, and the CPA factory assigns opt = j.at('options') after setting opt.radial_dist. Which radial distribution function is actually used when the JSON supplies radial_dist?"
why_it_matters = "A stored radial_dist choice in a specification may have no effect; the assembly choice would be unrecoverable."

[[question]]
about = "advancedPRaEres for more than two components"
question = "make_AdvancedPRaEres passes Eigen::ArrayXXd::Zero(2, 2) as lmat while check_lmat requires the component count. Does the factory work only for binary mixtures?"
why_it_matters = "The form's validity domain (number of components) would otherwise be mis-stated."

[[question]]
about = "Methanol cannot be loaded by the multifluid kind"
question = "teqp/fluiddata/dev/fluids/Methanol.json has ResidualHelmholtzAssociating in EOS[0].alphar, a type that get_EOS_terms does not allow, so the multifluid kind refuses the file. Is the file meant for another reader (the multifluid-association kind?) or is it simply unsupported?"
why_it_matters = "A data file in the payload that the source's own loader rejects is a fluid that exists in the data but not in the model."

[[question]]
about = "provenance of the copied fluid and mixture files"
question = "The fluid files equal CoolProp's after removing SUPERANCILLARY in 97 of 124 cases and differ in 27; 817 pair records against CoolProp's 888 with 38 differing. Which CoolProp commit were they copied from, and are the differences corrections made in teqp (README mentions one departure-term fix) or drift?"
why_it_matters = "Two carriers of overlapping published parameters need an equivalence assessment with dates; without the source commit the assessment cannot say which carrier is newer."

[[question]]
about = "duplicate pair records"
question = "Three CAS pairs appear twice in mixture_binary_pairs.json with different values (BibTeX Unpublished and Bell-JCED-2016). Is the earlier record meant to be preferred, and does the result depend on the identifier kind used to load the mixture?"
why_it_matters = "Two coherent parameter sets for one subject need a selection policy that the source leaves to file order."

[[question]]
about = "sign convention of GaoB eta and the departure aliasing"
question = "get_EOS_terms negates eta on read for ResidualHelmholtzGaoB (comment: watch out for this sign flip); the departure lookup ignores aliases that CoolProp resolves. Are these both intentional differences from CoolProp's reading of the same JSON?"
why_it_matters = "The same file must mean the same function in both carriers; the mapping needs to record the convention."

[[question]]
about = "NRTL"
question = "The activity models of the tree are Wilson, binaryInvariant and COSMO-SAC-2010; a search of the pinned tree finds no NRTL code or keyword. Is an NRTL model expected in a newer or different release?"
why_it_matters = "Absence is recorded as a finding; the capability inventory must not list NRTL for this release."

[[question]]
about = "units of several specification fields"
question = "vdW1 a and b, Wilson b, m and n, As and Bs of QCPRAasen, activity b and u, and the ECS Z_crit have no stated units (only formulas imply them); mu_Cm and mu_D descriptions in the schema contradict the names."
why_it_matters = "Dimensioned slots must not be typed from inference alone."

[[question]]
about = "gas constant across kinds and compositions"
question = "The model R varies between 8.314472, 8.314471, 8.31446261815324 and N_A k_B across kinds, and the composition kinds change the value relative to their multifluid part (multifluid-association and multifluid-activity use N_A k_B). Is this intentional?"
why_it_matters = "A multifluid equation fitted with its own R is not the same function when evaluated with another R; the R rule belongs to the assembly."

[[question]]
about = "bundled NIST AGA8 copy"
question = "src/tests/GERG2008.cpp is the AGA8 v1.7 file, a different text version than the pinned AGA8 tree (v2.01) with identical setup numbers. Is it used anywhere beyond the GERG tests, and should it count as a second carrier of the same parameters?"
why_it_matters = "It is a third carrier of GERG-2008 (with teqp's own tables and AGA8 itself); equivalence assessments should cover all carriers."

[[question]]
about = "ideal-gas constants replaced at construction"
question = "GERG200XAlphaig recomputes n0(1) and n0(2) so that h and s vanish at 298.15 K and 101.325 kPa, whereas AGA8 stores published constants that reach that reference only nearly. Which is the reference of the standard?"
why_it_matters = "Two carriers of one set differ at the level of the integration constants; the energy_reference record must say which datum each implements."

[[question]]
about = "whether teqp carries any fluid data of its own"
question = "The fluid and mixture files are CoolProp-format copies and the GERG tables are transcriptions of published tables; the NN, cubic superancillary and SAFT integral tables are computed fits. Which of these are teqp contributions (for example the 2D Chebyshev departure type, the GenericCubic and PC-SAFT pure-fluid terms) and which are restatements?"
why_it_matters = "Rights, provenance and deduplication of carriers depend on which numbers originate here."

[[question]]
about = "REFPROP-interop is not in the pinned tree"
question = "The FLD and HMX.BNC converters live in the REFPROP-interop submodule, which is an empty directory in the acquired bytes (as are Eigen, autodiff, Catch2, pybind11, mcx and the JSON-schema validator). Should the submodules be acquired for the survey of the format conversion?"
why_it_matters = "The conversion of REFPROP-format files to the CoolProp layout is a derivation that changes parameter values; its rules cannot be recorded from the pinned bytes."
