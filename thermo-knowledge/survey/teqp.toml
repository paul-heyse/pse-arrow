locator = "interface/CPP/teqp_impl_factory.cpp lines 53-149 (pointer_factory and build_model_ptr); include/teqp/cpp/teqpcpp.hpp lines 194-208"
meaning = "The JSON document that selects and parameterises a model: kind names the factory entry, model holds the kind's parameters, validate (optional boolean) overrides the default of validating model against the kind's JSON Schema when one exists. The same document shape is used by the Python make_model, the C API and the C++ make_model."
subject = "A model (one assembly of a form with its parameters); keyed by nothing: the document is the model."
fields = [
  { name = "kind", meaning = "factory key; one of 35 strings listed in the pointer_factory initialiser", unit = "not applicable (text)", shape = "enum", role = "input" },
  { name = "model", meaning = "object whose fields are kind specific (constructs below)", unit = "not applicable (record)", shape = "table", role = "input" },
  { name = "validate", meaning = "bool; when absent the caller's flag (default true) applies", unit = "not applicable (flag)", shape = "scalar", role = "input" },
]
origin = "authored"
conventions = "Numbers carry units in the key: 'Tcrit / K', 'pcrit / Pa', 'R_gas / J/mol/K', 'bi / m^3/mol', 'sigma / m'. Validation is skipped for kinds without a schema (21 of 35) and not thread-safe (code comment). An unknown kind raises invalid_argument."
absence = "absent model keys are read with at() (error) or contains() (optional); the behaviour per field is in the kind constructs"
validity = "not applicable"
provenance = "none"
count = "35 kinds, 14 with a JSON Schema"
example = "interface/CPP/teqp_impl_factory.cpp line 130"
candidate = "model_assembly (choices per sub-form slot) with parameter sets supplied inline, plus a form catalogue of the 35 kinds"
precision = "close"
loss = "Parameters are embedded in the assembly document rather than referenced as records with provenance; units live in key strings; a document can contain a whole mixture's parameters (kmat, coeffs), which are parameter sets that a mapping must separate from the assembly."

