source = "teqp"
pin = "5f62a6f515d5"
surveyed = "2026-09-30"
summary = "teqp v0.23.2 contributes a JSON model-specification language: a document {kind, model} selects and parameterises one of 35 equation-of-state kinds (cubics, SAFT variants, CPA, GERG-2004 and GERG-2008, LKP, multifluid with optional association or activity terms, extended corresponding states, model potentials, ideal-gas Helmholtz terms) and several kinds embed other specifications (multifluid plus activity, generic SAFT of nonpolar and association parts), together with CoolProp-format fluid and mixture JSON (124 fluids, 817 binary pairs, 16 departure functions) and C++-embedded parameter tables (GERG-2004 and GERG-2008, PC-SAFT constants, association matrices, neural-network weights, SAFT polar integrals, cubic superancillaries). It has derivative-based algorithms (pure and mixture critical points, VLE, VLLE and critical tracing, multiphase equilibrium polishing) and no flash routine; only 14 of the 35 kinds have a JSON Schema, and the schemas lag the factory code in several places."

