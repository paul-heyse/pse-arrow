# Binds each framework role to the kind that fills it (docs/meta-model.md section 5). The roles
# are required once the declaration contains forms. `observable` is optional: bound, it names
# the kind whose declared entities a contract output or a slot may denote. `composition_basis`
# is optional too: bound, it names the kind whose declared entities a contract argument's `basis`
# may name.
[framework]
parameter_set = "parameter_set"
parameterization = "parameterization"
tabulated_function = "tabulated_function"
slot_uncertainty = "slot_uncertainty"
observable = "observable"
composition_basis = "composition_basis"
