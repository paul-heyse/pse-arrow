module = "physical"
schema = "tk"
uses = []
doc = """
Quantity types. A quantity type fixes what a stored number means physically and the coherent SI
unit it is stored in. Two types with equal dimensions remain different types. `production` names
the corresponding production quantity type where one exists, so adoption can reconcile the two
vocabularies mechanically.

Scales: `absolute` is a magnitude with a true zero that is never negative, and zero is a valid
value; `difference` is a signed quantity, including anything defined relative to a datum;
`dimensionless` is a pure number; `count` is a number of things, which may be fractional for
non-stoichiometric formulas.
"""

[quantity_types.Scalar]
doc = "A dimensionless number with no further interpretation."
unit = "dimensionless"
scale = "dimensionless"
production = "Scalar"

[quantity_types.Count]
doc = "A number of atoms, groups, sites or molecules per formula unit."
unit = "dimensionless"
scale = "count"
production = "Count"

[quantity_types.ChargeNumber]
doc = "Net charge in units of the elementary charge; signed."
unit = "dimensionless"
scale = "difference"
production = "ChargeNumber"

[quantity_types.Fraction]
doc = "A part of a whole on a stated composition basis, between zero and one."
unit = "dimensionless"
scale = "absolute"

[quantity_types.Temperature]
doc = "Absolute thermodynamic temperature."
unit = "K"
scale = "absolute"
production = "Temperature"

[quantity_types.TemperatureDifference]
doc = "A temperature interval or a temperature-like coefficient that may be negative."
unit = "K"
scale = "difference"
production = "DeltaTemperature"

[quantity_types.Pressure]
doc = "Absolute pressure."
unit = "Pa"
scale = "absolute"
production = "Pressure"

[quantity_types.MolarMass]
doc = "Mass per amount of substance."
unit = "kg/mol"
scale = "absolute"
production = "MolarMass"

[quantity_types.MolarVolume]
doc = "Volume per amount of substance; signed because co-volumes, translations and excess volumes share it."
unit = "m^3/mol"
scale = "difference"

[quantity_types.MolarDensity]
doc = "Amount of substance per volume."
unit = "mol/m^3"
scale = "absolute"
production = "MolarDensity"

[quantity_types.MassDensity]
doc = "Mass per volume."
unit = "kg/m^3"
scale = "absolute"
production = "Density"

[quantity_types.MolarEnergy]
doc = "Energy per amount of substance: enthalpy, Gibbs energy, internal energy or an interaction energy. Signed; the datum is stated by the convention set, never by the number."
unit = "J/mol"
scale = "difference"
production = "MolarEnthalpy"

[quantity_types.MolarEntropy]
doc = "Entropy or heat capacity per amount of substance."
unit = "J/(mol*K)"
scale = "difference"
production = "MolarEntropy"

[quantity_types.SpecificEnergy]
doc = "Energy per mass."
unit = "J/kg"
scale = "difference"

[quantity_types.SpecificEntropy]
doc = "Entropy or heat capacity per mass."
unit = "J/(kg*K)"
scale = "difference"

[quantity_types.GasConstant]
doc = "The molar gas constant as used by a body of data. Its value is a convention of that data, not a global."
unit = "J/(mol*K)"
scale = "absolute"
production = "GasConstant"

[quantity_types.BoltzmannConstant]
doc = "The Boltzmann constant as used by a body of data. Its value is a convention of that data: libraries mix editions of the constants."
unit = "J/K"
scale = "absolute"

[quantity_types.AvogadroConstant]
doc = "The Avogadro constant as used by a body of data. Its value is a convention of that data: a library may derive it from the gas constant and the Boltzmann constant."
unit = "1/mol"
scale = "absolute"

[quantity_types.Length]
doc = "A length, such as a segment or collision diameter."
unit = "m"
scale = "absolute"
production = "Length"

[quantity_types.Area]
doc = "An area, such as a molecular surface area."
unit = "m^2"
scale = "absolute"

[quantity_types.Volume]
doc = "A volume, such as a molecular cavity volume."
unit = "m^3"
scale = "absolute"

[quantity_types.EnergyTemperature]
doc = "An energy expressed as a temperature (energy divided by the Boltzmann constant), as used for dispersion and association energies."
unit = "K"
scale = "difference"
production = "TemperatureScale"

[quantity_types.Viscosity]
doc = "Dynamic viscosity."
unit = "Pa*s"
scale = "absolute"

[quantity_types.ThermalConductivity]
doc = "Thermal conductivity."
unit = "W/(m*K)"
scale = "absolute"

[quantity_types.Diffusivity]
doc = "A diffusion coefficient; its frame of reference is a facet of the observable."
unit = "m^2/s"
scale = "absolute"

[quantity_types.SurfaceTension]
doc = "Interfacial tension."
unit = "N/m"
scale = "absolute"

[quantity_types.DipoleMoment]
doc = "Electric dipole moment."
unit = "C*m"
scale = "absolute"

[quantity_types.SurfaceChargeDensity]
doc = "Screening charge per area, the support coordinate of a sigma profile."
unit = "C/m^2"
scale = "difference"

[quantity_types.Molality]
doc = "Amount of solute per mass of solvent."
unit = "mol/kg"
scale = "absolute"

[quantity_types.Loading]
doc = "Amount adsorbed per mass of adsorbent."
unit = "mol/kg"
scale = "absolute"

[quantity_types.Time]
doc = "A duration."
unit = "s"
scale = "absolute"

[quantity_types.Mass]
doc = "A mass."
unit = "kg"
scale = "absolute"

[quantity_types.Amount]
doc = "An amount of substance."
unit = "mol"
scale = "absolute"
production = "Amount"

[quantity_types.QuadrupoleMoment]
doc = "Electric quadrupole moment; signed."
unit = "C*m^2"
scale = "difference"

[quantity_types.PolarizabilityVolume]
doc = "Polarizability expressed as a volume."
unit = "m^3"
scale = "absolute"

[quantity_types.ElectricPotential]
doc = "Electric potential, or a potential difference such as the potential of a charge-transfer rate."
unit = "V"
scale = "difference"

[quantity_types.Wavenumber]
doc = "Reciprocal wavelength, as vibrational frequencies are stated."
unit = "1/m"
scale = "absolute"

[quantity_types.MomentOfInertia]
doc = "Moment of inertia of a rotor."
unit = "kg*m^2"
scale = "absolute"

[quantity_types.ExcessLoading]
doc = "Surface excess amount adsorbed per mass of adsorbent. Signed: a surface excess can be negative, so `Loading`, which is an absolute amount, cannot hold it."
unit = "mol/kg"
scale = "difference"

[quantity_types.KinematicViscosity]
doc = "Dynamic viscosity over mass density."
unit = "m^2/s"
scale = "absolute"

[quantity_types.ThermalDiffusivity]
doc = "Thermal conductivity over the product of mass density and specific heat capacity."
unit = "m^2/s"
scale = "absolute"

[quantity_types.Fluidity]
doc = "The reciprocal of dynamic viscosity."
unit = "1/(Pa*s)"
scale = "absolute"

[quantity_types.VolumeLoading]
doc = "Amount adsorbed per volume of adsorbent, absolute."
unit = "mol/m^3"
scale = "absolute"

[quantity_types.ExcessVolumeLoading]
doc = "Amount adsorbed per volume of adsorbent, signed: a surface excess can be negative, and so can an amount whose kind the source does not state."
unit = "mol/m^3"
scale = "difference"

[quantity_types.AreaLoading]
doc = "Amount adsorbed per surface area of adsorbent, absolute."
unit = "mol/m^2"
scale = "absolute"

[quantity_types.ExcessAreaLoading]
doc = "Amount adsorbed per surface area of adsorbent, signed: a surface excess can be negative, and so can an amount whose kind the source does not state."
unit = "mol/m^2"
scale = "difference"

[quantity_types.CellLoading]
doc = "Number of molecules adsorbed per crystallographic unit cell of the adsorbent, absolute. A count, stored as a dimensionless number."
unit = "dimensionless"
scale = "count"

[quantity_types.ExcessCellLoading]
doc = "Number of molecules adsorbed per crystallographic unit cell of the adsorbent, signed: a surface excess can be negative, and so can an amount whose kind the source does not state."
unit = "dimensionless"
scale = "difference"

[quantity_types.NumberDensity]
doc = "Number of entities per volume, such as the density of the sites of one type in a liquid-state theory. Distinct from a molar density: it counts sites or particles, not amount of substance."
unit = "1/m^3"
scale = "absolute"
