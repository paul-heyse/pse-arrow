module = "reactions"
schema = "tk"
uses = ["physical", "provenance", "identity", "systems", "conventions"]
doc = """
Reactions. A reaction is a stoichiometry over species forms, each with the standard state its
activity is referred to. Equilibrium-constant models, standard-state reaction properties and rate
laws are ordinary forms whose subject is a reaction; they are declared in the form catalogue, not
here. "This species' standard properties are defined through that reaction" is a dependency.
"""

[quantity_types.RateConstant]
doc = """A rate constant of a reaction. Its dimension follows the subject reaction of the slot or contract output that holds it: the rate per volume (mol m^-3 s^-1), or per area (mol m^-2 s^-1) when any participant is a surface species, divided by the concentration of each species to its forward order (mol m^-3 in a bulk phase, mol m^-2 on a surface), and by one more bulk concentration for each extra order the slot declares (a low-pressure limit or a third-body rate). The stored number is in the coherent SI unit of that dimension, so the column is a plain finite double. Signed: a duplicate reaction may have a negative pre-exponential factor. The unit shown is the rate of a homogeneous reaction of order zero."""
unit = "mol/(m^3*s)"
scale = "difference"
dependent = { on = "reaction", surface_unit = "mol/(m^2*s)", concentration = "mol/m^3", surface_concentration = "mol/m^2" }

[enums.extent_convention]
doc = "How a reaction's stoichiometry is normalised."
members.as_written = { doc = "Coefficients exactly as the source writes them." }
members.per_mole_of_first_product = { doc = "Normalised to one mole of the first product." }
members.formation = { doc = "A formation reaction of one mole of the product from the basis or the elements." }

[kinds.reaction]
doc = "A stoichiometry over species forms. Canonical key: the participants' identifiers and coefficients in a normalised order, with the extent convention."
identity = ["canonical_key"]
provenance = "own"
traces = ["IC-43"]

[kinds.reaction.attributes]
canonical_key = { type = "Text", doc = "Canonical encoding of the normalised stoichiometry." }
extent = { type = "extent_convention", doc = "How the stoichiometry is normalised." }
equation = { type = "SourceText", optional = true, doc = "The reaction as the source writes it. Retained; nothing branches on it." }

[[kinds.reaction.requires]]
name = "conserves_declared_quantities"
doc = "For every conserved quantity with a composition entry on any participant, the coefficient-weighted sum over participants is zero. The balance of an element counts the isotopes of that element as well as the element itself, and the balance of an isotope counts only that isotope."
enforced = "verify"

[[kinds.reaction.requires]]
name = "standard_states_for_equilibrium_constant"
doc = "A reaction that is the subject of a parameter set of a form whose contract has an output with the observable `log10_equilibrium_constant` has a standard state for every participant: the participant states one, or the convention set of the parameterisation gives one for the member role the participant has in the parameterisation's chemical system."
enforced = "verify"

[relations.reaction_participant]
doc = "A species form taking part in a reaction. Coefficients are negative for reactants and positive for products."
provenance = "inherit:reaction"
absence = "optional"

[relations.reaction_participant.keys]
reaction = { type = "reaction", doc = "The reaction." }
form = { type = "species_form", doc = "A participant." }

[relations.reaction_participant.columns]
coefficient = { type = "Count", doc = "Signed stoichiometric coefficient." }
standard_state = { type = "standard_state", optional = true, doc = "The standard state the participant's activity is referred to." }

[relations.reaction_order]
doc = "An explicit forward reaction order of one species form, which need not be an integer and need not be a reactant. Where no row states a species' order, a reactant's order is its stoichiometric coefficient and any other species' order is zero. The orders fix the dimension of a rate constant (`RateConstant`)."
provenance = "inherit:reaction"
absence = "optional"
value = { type = "Scalar", doc = "The order with respect to the species form." }

[relations.reaction_order.keys]
reaction = { type = "reaction", doc = "The reaction." }
form = { type = "species_form", doc = "The species form the order is stated for." }

[relations.system_reaction]
doc = "A reaction that belongs to a chemical system."
provenance = "inherit:system"
absence = "optional"

[[relations.system_reaction.requires]]
name = "conserves_system_quantities"
doc = "The reaction conserves each conserved quantity its system declares: the coefficient-weighted sum over its participants of the quantity's composition entries is zero, where the balance of an element also counts the isotopes of that element."
enforced = "verify"

[relations.system_reaction.keys]
system = { type = "chemical_system", doc = "The system." }
reaction = { type = "reaction", doc = "A reaction of the system." }

[relations.system_reaction.columns]
defines = { type = "species_form", optional = true, doc = "The secondary species form this reaction defines from the basis, when it is a defining reaction." }
