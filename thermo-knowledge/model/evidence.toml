module = "evidence"
schema = "ev"
uses = [
  "physical",
  "provenance",
  "identity",
  "systems",
  "conventions",
  "observables",
  "reactions",
]
doc = """
Evidence: tables of observations or evaluated values under declared conditions. A dataset's
columns are typed by observable and by the role the column plays, so a number is never
interpreted from its position or its header text. Measured, evaluated, computed and normative
verification data share one shape and differ in kind. Phases in a dataset are local roles of that
dataset; they are not phase definitions.
"""

[enums.dataset_kind]
doc = "What the values of a dataset are."
members.measured = { doc = "Experimental observations." }
members.evaluated = { doc = "Critically evaluated or recommended values." }
members.computed = { doc = "Outputs of a model or calculation." }
members.verification = { doc = "Values a standard publishes for checking implementations. Normative, not a test-only oracle." }

[enums.column_role]
doc = "The part a column plays in a dataset."
members.constraint = { doc = "A condition held fixed for the whole dataset." }
members.variable = { doc = "A condition that varies from point to point." }
members.property = { doc = "The observable reported at each point." }

[enums.datum_state]
doc = "Whether a point has a value in a column."
members.known = { doc = "A value is reported." }
members.not_measured = { doc = "The point has no value in this column." }
members.censored_below = { doc = "Only a limit is reported, and the true value is below it; the value column holds the limit." }
members.censored_above = { doc = "Only a limit is reported, and the true value is above it; the value column holds the limit." }

[enums.component_function]
doc = "The part a component plays in a measured system."
members.component = { doc = "An ordinary component." }
members.solvent = { doc = "The solvent." }
members.solute = { doc = "A solute." }
members.adsorbent = { doc = "The host material." }
members.adsorbate = { doc = "An adsorbed species." }
members.catalyst = { doc = "Present but not a participant in the reported equilibrium." }
members.buffer = { doc = "A buffer." }
members.inert = { doc = "Present and inert." }
members.cofactor = { doc = "A cofactor of a biochemical reaction." }

[enums.speciation_state]
doc = "What a dataset component stands for."
members.single_species = { doc = "A single species." }
members.equilibrium_mixture = { doc = "A mixture of species in equilibrium that the compound stands for." }
members.not_stated = { doc = "The source does not say." }

[enums.branch]
doc = "The branch of a path-dependent measurement."
members.adsorption = { doc = "Measured while loading increases." }
members.desorption = { doc = "Measured while loading decreases." }
members.not_applicable = { doc = "No branch applies." }

[kinds.dataset]
doc = "A table of observations or evaluated values under declared conditions, from one carrier."
identity = ["carrier", "local_key"]
provenance = "own"
traces = ["IC-11"]

[kinds.dataset.attributes]
carrier = { type = "carrier", doc = "The carrier the dataset was read from." }
local_key = { type = "Text", doc = "The dataset's key within that carrier." }
kind = { type = "dataset_kind", doc = "What its values are." }
title = { type = "Text", optional = true, doc = "Title or description as the source gives it." }
method = { type = "Text", optional = true, doc = "Experimental or evaluation method as the source names it." }
convention_set = { type = "convention_set", optional = true, doc = "The conventions its values assume, where the dataset reports reference-dependent quantities." }
reaction = { type = "reaction", optional = true, doc = "The reaction, for a dataset of reaction properties." }

[[kinds.dataset.requires]]
name = "verification_has_a_target"
doc = "A dataset of kind `verification` states at least one record whose implementation its values check (`dataset_verifies`): the values a standard publishes are values of a formulation, and a check table that names no formulation checks nothing."
enforced = "verify"

[relations.dataset_verifies]
doc = "A record whose implementation a verification dataset checks. The values of a check table depend on both the formulation and the coefficients it was computed with, so a dataset names the model assembly and the parameterisation it verifies, each by a row (a published test value of the GERG-2008 and DETAIL assemblies, of the IAPWS-IF97 assembly with the coefficient set of the release, of a COSMO-SAC parameterisation together with the profile set). Only verification datasets state one."
provenance = "inherit:dataset"
absence = "optional"

[[relations.dataset_verifies.requires]]
name = "dataset_is_verification"
doc = "The dataset is of kind `verification`."
enforced = "verify"

[[relations.dataset_verifies.requires]]
name = "target_is_assembly_or_parameterization"
doc = "The record verified is a model assembly or a parameterization."
enforced = "verify"

[relations.dataset_verifies.keys]
dataset = { type = "dataset", doc = "The verification dataset." }
target = { type = "Record", doc = "The model assembly or parameterization whose implementation the values check." }

[kinds.dataset_component]
doc = "An entity present in the system a dataset describes."
identity = ["dataset", "ordinal"]
provenance = "inherit:dataset"

[kinds.dataset_component.attributes]
dataset = { type = "dataset", doc = "The dataset." }
ordinal = { type = "Integer", doc = "Position of the component in the dataset, from one." }
entity = { type = "material_entity", doc = "The entity." }
sample = { type = "sample", optional = true, doc = "The physical sample used." }
function = { type = "component_function", doc = "The part it plays." }
speciation = { type = "speciation_state", default = "not_stated", doc = "Whether the component stands for one species or for a mixture of species in equilibrium." }

[[kinds.dataset_component.requires]]
name = "ordinal_from_one"
doc = "The components of a dataset are numbered from one."
enforced = "ddl"
check = { positive = "ordinal" }

[kinds.dataset_phase]
doc = "A phase role local to a dataset, such as the liquid in equilibrium with a vapour. It is not a phase definition and has no meaning outside its dataset."
identity = ["dataset", "ordinal"]
provenance = "inherit:dataset"

[kinds.dataset_phase.attributes]
dataset = { type = "dataset", doc = "The dataset." }
ordinal = { type = "Integer", doc = "Position of the phase in the dataset, from one." }
aggregation = { type = "aggregation", doc = "Its state of aggregation." }
label = { type = "Text", optional = true, doc = "The phase's name in the source." }
phase_definition = { type = "phase_definition", optional = true, doc = "The phase definition the dataset reports on, where the source ties the phase to one; a phase role stays local to its dataset either way." }

[[kinds.dataset_phase.requires]]
name = "ordinal_from_one"
doc = "The phases of a dataset are numbered from one."
enforced = "ddl"
check = { positive = "ordinal" }

[kinds.dataset_column]
doc = "One typed column of a dataset."
identity = ["dataset", "ordinal"]
provenance = "inherit:dataset"

[kinds.dataset_column.attributes]
dataset = { type = "dataset", doc = "The dataset." }
ordinal = { type = "Integer", doc = "Position of the column, from one." }
role = { type = "column_role", doc = "The part it plays." }
observable = { type = "observable", doc = "What its values are; values are stored in the observable's storage unit." }
component = { type = "dataset_component", optional = true, doc = "The component the column refers to, where the observable is of a component." }
phase = { type = "dataset_phase", optional = true, doc = "The phase the column refers to." }
site_class = { type = "site_class", optional = true, doc = "The sublattice or other site class the column refers to, for a site fraction or a configuration reported per site class. The column's phase then names the phase definition that owns the class." }
second_phase = { type = "dataset_phase", optional = true, doc = "The other phase, for a transition or interface observable." }
composition_basis = { type = "composition_basis", optional = true, doc = "The basis, for a composition column." }
standard_state = { type = "standard_state", optional = true, doc = "The standard state, for a standard-state observable." }
constant = { type = "Real", unit_from = "observable", optional = true, doc = "The value of a constraint column, in the observable's storage unit." }
constant_digits = { type = "Integer", optional = true, doc = "Number of significant digits the source reports for the constant of a constraint column." }
presentation = { type = "value_presentation", default = "direct", doc = "How the column's numbers relate to the property: the property itself, or a difference, mean or ratio formed from it." }
reference_state_kind = { type = "reference_state_kind", optional = true, doc = "What the reference state is, for a column presented relative to one." }
reference_temperature = { type = "Temperature", optional = true, doc = "The temperature of the reference state, where the kind fixes one." }
reference_pressure = { type = "Pressure", optional = true, doc = "The pressure of the reference state, where the kind fixes one." }
reference_phase = { type = "dataset_phase", optional = true, doc = "The phase of the reference state, where the kind names one." }
source_name = { type = "SourceText", optional = true, doc = "The column's name or property string in the source. Retained; nothing branches on it." }

[[kinds.dataset_column.requires]]
name = "ordinal_from_one"
doc = "The columns of a dataset are numbered from one."
enforced = "ddl"
check = { positive = "ordinal" }

[[kinds.dataset_column.requires]]
name = "constraint_has_constant"
doc = "A constraint column states its constant; variable and property columns do not."
enforced = "load"

[[kinds.dataset_column.requires]]
name = "constant_respects_scale"
doc = "The constant of a constraint column whose observable has a quantity type of the scale `absolute` is not negative (the rule of `datum.value_respects_scale`)."
enforced = "verify"

[[kinds.dataset_column.requires]]
name = "site_class_of_the_phase"
doc = "A column that names a site class names a phase whose phase definition owns that site class."
enforced = "verify"

[[kinds.dataset_column.requires]]
name = "reference_state_kind_when_relative"
doc = "A column whose presentation is formed against a reference state states the kind of that reference state."
enforced = "verify"

[kinds.uncertainty_assessment]
doc = "One way the uncertainty of the values of a column is assessed: what its magnitudes mean and, where the source states them, the coverage factor, the level of confidence, who assessed it and by what method. A column has as many assessments as its source defines, and the magnitudes of each are stated per value (`datum_uncertainty`) or, for the constant of a constraint column, once (`column_uncertainty`)."
identity = ["column", "ordinal"]
provenance = "inherit:column"

[kinds.uncertainty_assessment.attributes]
column = { type = "dataset_column", doc = "The column whose values are assessed." }
ordinal = { type = "Integer", doc = "Position among the assessments of the column, from one." }
kind = { type = "uncertainty_kind", doc = "What the magnitudes of this assessment mean." }
coverage_factor = { type = "Scalar", optional = true, doc = "Coverage factor of an expanded uncertainty." }
confidence_level = { type = "Fraction", optional = true, doc = "Level of confidence of an expanded uncertainty, as a fraction." }
evaluator = { type = "Text", optional = true, doc = "Who assessed the uncertainty, as the source states it." }
method = { type = "Text", optional = true, doc = "How it was assessed, as the source states it." }

[[kinds.uncertainty_assessment.requires]]
name = "ordinal_from_one"
doc = "The assessments of a column are numbered from one."
enforced = "ddl"
check = { positive = "ordinal" }

[kinds.data_point]
doc = "One row of a dataset."
identity = ["dataset", "index"]
provenance = "inherit:dataset"

[kinds.data_point.attributes]
dataset = { type = "dataset", doc = "The dataset." }
index = { type = "Integer", doc = "Position of the point, from one." }
branch = { type = "branch", default = "not_applicable", doc = "The branch of a path-dependent measurement." }

[[kinds.data_point.requires]]
name = "index_from_one"
doc = "The points of a dataset are numbered from one."
enforced = "ddl"
check = { positive = "index" }

[relations.datum]
doc = "The value a point has in a column, or why it has none. The uncertainties of the value are `datum_uncertainty` rows."
provenance = "inherit:point"
absence = "optional"

[relations.datum.keys]
point = { type = "data_point", doc = "The point." }
column = { type = "dataset_column", doc = "The column." }

[[relations.datum.requires]]
name = "column_in_point_dataset"
doc = "The column belongs to the dataset of the point."
enforced = "verify"

[[relations.datum.requires]]
name = "column_is_variable_or_property"
doc = "The column is a variable or a property column."
enforced = "verify"

[[relations.datum.requires]]
name = "value_respects_scale"
doc = "A value, or a censored limit, of an observable whose quantity type has the scale `absolute` is not negative: the column type of a `Real` carries the unit and not the sign rule, so the scale of the quantity type is what refuses a negative amount adsorbed, pressure or temperature where the observable is an absolute quantity. A source that states signed amounts uses an observable of a `difference` type (`adsorbed_amount_excess`)."
enforced = "verify"

[[relations.datum.requires]]
name = "value_matches_state"
doc = "A value is present exactly when the state is known or a censored limit."
enforced = "ddl"
check = { present_iff = { column = "value", when = "state", in = ["known", "censored_below", "censored_above"] } }

[relations.datum.columns]
state = { type = "datum_state", doc = "Whether a value is reported." }
value = { type = "Real", unit_from = "column.observable", optional = true, doc = "The value, or the limit when censored, in the column observable's storage unit." }
digits = { type = "Integer", optional = true, doc = "Number of significant digits the source reports." }

[relations.datum_uncertainty]
doc = "The magnitudes of one uncertainty assessment for the value of one point. Both sides are stated: a symmetric uncertainty has equal `minus` and `plus`. A kind stated in the unit of the quantity has `minus` and `plus`; a relative kind, and a multiplicative one (the factor f, in both columns), has `relative_minus` and `relative_plus`."
provenance = "inherit:point"
absence = "optional"

[[relations.datum_uncertainty.requires]]
name = "assessment_in_point_dataset"
doc = "The column of the assessment belongs to the dataset of the point."
enforced = "verify"

[[relations.datum_uncertainty.requires]]
name = "datum_exists"
doc = "The value the uncertainty qualifies exists: the point has a datum in the column of the assessment, and its state carries a value."
enforced = "verify"

[[relations.datum_uncertainty.requires]]
name = "magnitude_matches_kind"
doc = "The pair of magnitudes that is present is the one the kind of the assessment calls for: both sides in the quantity's unit, both relative sides for a relative or factor kind, none for a kind that states no magnitude."
enforced = "verify"

[relations.datum_uncertainty.keys]
point = { type = "data_point", doc = "The point." }
assessment = { type = "uncertainty_assessment", doc = "The assessment." }

[relations.datum_uncertainty.columns]
minus = { type = "Real", unit_from = "assessment.column.observable", optional = true, doc = "The magnitude below the value, in the column observable's storage unit." }
plus = { type = "Real", unit_from = "assessment.column.observable", optional = true, doc = "The magnitude above the value, in the column observable's storage unit." }
relative_minus = { type = "Scalar", optional = true, doc = "The relative magnitude below the value, as a fraction of it, or the factor f of a multiplicative kind." }
relative_plus = { type = "Scalar", optional = true, doc = "The relative magnitude above the value, as a fraction of it, or the factor f of a multiplicative kind." }

[relations.column_uncertainty]
doc = "The magnitudes of one uncertainty assessment for the constant of a constraint column, stated as `datum_uncertainty` states them for a value."
provenance = "inherit:assessment"
absence = "optional"

[[relations.column_uncertainty.requires]]
name = "column_is_constraint"
doc = "The column of the assessment is a constraint column."
enforced = "verify"

[[relations.column_uncertainty.requires]]
name = "magnitude_matches_kind"
doc = "The pair of magnitudes that is present is the one the kind of the assessment calls for: both sides in the quantity's unit, both relative sides for a relative or factor kind, none for a kind that states no magnitude."
enforced = "verify"

[relations.column_uncertainty.keys]
assessment = { type = "uncertainty_assessment", doc = "The assessment." }

[relations.column_uncertainty.columns]
minus = { type = "Real", unit_from = "assessment.column.observable", optional = true, doc = "The magnitude below the constant, in the column observable's storage unit." }
plus = { type = "Real", unit_from = "assessment.column.observable", optional = true, doc = "The magnitude above the constant, in the column observable's storage unit." }
relative_minus = { type = "Scalar", optional = true, doc = "The relative magnitude below the constant, as a fraction of it, or the factor f of a multiplicative kind." }
relative_plus = { type = "Scalar", optional = true, doc = "The relative magnitude above the constant, as a fraction of it, or the factor f of a multiplicative kind." }
