module = "observables_thermoml"
schema = "tk"
uses = ["physical", "observables"]
doc = """
The observable vocabulary derived from ThermoML's property enumeration, and the aliases that name it.

ThermoML (schema version 4.0) names every measured property by an enumeration string whose text
carries the property, its amount basis, its reference relation, its path and its unit. Each of the 193
`ePropName` values of its 13 property groups is one `observable_alias` of carrier scope `thermoml`
here, and denotes exactly one observable: a name that differs from another in any facet (quantity
type, subject shape, amount basis, reference relation, path, adsorption kind or diffusion frame) is a
different observable, and a name never denotes two. An observable of `observables` is reused where the
name has its meaning; the others are declared below, in the order of the property groups.

An alias states its precision, and its loss where it is not exact. The unit text of a name is not
stored: the unit is the quantity type of the observable, and the name's unit must have its dimension
(a test checks this with `pint` against the staged schema, and lists the names whose unit has an
exponent `n` that follows from the data, which are aliased with that loss stated). The aliases are
declared entities because `observable_alias` has declaration provenance; a test binds them to the
staged enumeration, so a later revision of the schema that adds, renames or drops a name fails it
until this module is brought up to date. The other ThermoML vocabularies (method names, sample
status, purity methods and the rest) are not aliased here.
"""

