# Side environment (Plan 24): geochemical thermodynamics readers and oracle harnesses.
# Human-written spec; environment.lock.txt is the explicit lock solved from it. The solver
# ignores user configuration (see `tk-env-lock`), so only the channel below is used.
# The environment exchanges Arrow/Parquet or JSON files with the core pipeline and never
# imports thermo_knowledge.
name: tk-geochem
channels:
  - conda-forge
dependencies:
  - python=3.12
  - reaktoro=2.13.0
  - thermofun
  - chemicalfun
  - gems3k
  - pyarrow
