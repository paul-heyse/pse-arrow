# Side environment (Plan 24): the thermotools libraries, which need Python 3.11 and numpy < 2.
# A standalone uv project, not a member of the core project or of any workspace. It exchanges
# Arrow/Parquet or JSON files with the core pipeline and never imports thermo_knowledge.

[project]
name = "tk-env-thermotools"
version = "0.0.0"
description = "Side environment: thermopack, pykingas and surfpack (readers and oracle harnesses)"
requires-python = "==3.11.*"
dependencies = [
  "numpy<2",
  "thermopack",
  "pykingas",
  "surfpack",
  "pyarrow",
  # surfpack 1.0.0 declares no dependencies but imports matplotlib at package import.
  "matplotlib",
]

[tool.uv]
package = false
