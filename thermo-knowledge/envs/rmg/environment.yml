# Side environment (Plan 24): the RMG-Py loader and oracle. Human-written spec;
# environment.lock.txt is the explicit lock solved from it. The solver ignores user
# configuration (see `tk-env-lock`), so only the channels below are used, with strict
# priority. The environment exchanges Arrow/Parquet or JSON files with the core pipeline and
# never imports thermo_knowledge.
name: tk-rmg
channels:
  - conda-forge
  - rmg
dependencies:
  - python=3.11
  - numpy<2
  - rmg=4.0.0
  - pyarrow
