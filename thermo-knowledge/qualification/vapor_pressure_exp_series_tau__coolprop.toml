# The saturation-pressure form evaluated from the stored CoolProp ancillary coefficients against
# CoolProp's own evaluation of the same ancillary. The basis is the source library: agreement
# shows the reader and mapping preserved the meaning, not that the equation is right. The format is
# documented in docs/pipeline.md section 5.1.
#
# Tolerance. Both sides evaluate the same coefficients and formula in double precision, so they
# agree to rounding wherever the formula is well conditioned. It is not everywhere: DiethylEther's
# coefficients are of order 4e4 and nearly cancel, which puts the double-precision error floor of
# the formula itself near 1.3e-11 (established against a 60-digit evaluation; CoolProp is itself
# 1.25e-12 from the exact value there). The tolerance is therefore 1e-10: above the worst
# conditioning floor of any fluid in the set, and four orders of magnitude below the smallest
# error a wrong unit, term order or reducing value would produce.
#
# Grid. Each fluid's grid is spread within its one fitted-range region, along the clause on the
# observable that the contract's temperature argument names. The ends of each fitted range are
# included. The upper end is within a few units in the last place of the reducing temperature,
# where theta is rounding noise; agreement there requires the evaluator to perform the same
# floating-point operations as the formula as written.
#
# Validity. The run counts its points against the same fitted-range regions (every point of the
# grid is inside) and compares points outside a region anyway, since there are none.

doc = "Saturation pressure from the stored CoolProp pS ancillary coefficients against CoolProp's own evaluation of its ancillary, at 25 temperatures within each fluid's fitted range."
form = "vapor_pressure_exp_series_tau"
output = "p_sat"
basis = "source_library"

[parameterization]
key = "coolprop_saturation_ancillaries"
revision = "{pin}"
carrier = "coolprop"

[subjects]
group = "vapor_pressure_exp_series_tau.pure"
select = "all"

[subjects.library_key]
carrier = "coolprop"
scope = "fluids"

[arguments.T]
points = 25
within = "envelope"
envelope_kind = "fitted_range"
inset = 0.0

[validity]
kind = "fitted_range"
outside = "compare"

[comparison]
relative_tolerance = 1e-10
invalid_points = "fail"

[harness]
library = "coolprop"
environment = "core"
call = "saturation_pressure_ancillary"
