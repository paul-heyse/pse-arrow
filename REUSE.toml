  ".python-version",
  ".envrc",
  "justfile",
  "rust-toolchain.toml",
  "CODEOWNERS",
  ".github/**",
  ".claude/**",
  ".codex/**",
  ".agents/**",
  "docs/**",
  "packages/**",
  "database/canonical-schema/**",
  "tests/golden/**",
  "tests/fixtures/**",
  "tests/conformance/fixtures/**",
  "crates/pse-codegen/src/codegen/python/*.py.template",
  "crates/pse-operations/migrations/*.sql",
  "crates/pse-operations/test-fixtures/**/*.sql",
  "python/pse/contracts/GENERATED.sha256",
  "python/pse/contracts/documents/GENERATED.sha256",
  "python/pse/generated/**",
  "crates/*/src/generated/**",
  "xtask/src/generated/**",
  "crates/pse-operations-queries/**",
  "crates/pse-ipopt-sys/src/bindings.rs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Heyse"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The design-principles documents are imported normative texts; the capability-map
# evidence includes captured third-party output. Both are covered as aggregate, above.

# Build artifacts that live inside the package directory: the compiled extension and
# the bytecode caches beside it. Both are gitignored, but `reuse lint` walks the working
# tree rather than the index, so without these entries the gate is red in every
# environment where `uv sync` has actually built the extension.
[[annotations]]
path = [
  "python/pse/_native*.so",
  "python/pse/_native*.pyd",
  "**/__pycache__/**",
  # Tool-local build output is not source.
  "tools/*/target/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Heyse"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# tooling/dfarrow-apiex predates the repository (same author); its files are covered here
# rather than retro-fitted with headers, so the extractor stays byte-comparable with the
# evidence it produced.
[[annotations]]
path = ["tooling/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Heyse"
SPDX-License-Identifier = "MIT OR Apache-2.0"

