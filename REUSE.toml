# REUSE (https://reuse.software) specification for pse-arrow.
#
# Every authored source file (.rs, .py, .pyi, .sh, .toml, .yml) carries a two-line SPDX
# header; the entries below cover file types that cannot carry one, or that are
# generated/imported. `reuse lint` runs in pre-commit and as `governance / reuse`.
version = 1
SPDX-PackageName = "pse-arrow"
SPDX-PackageSupplier = "Paul Heyse <paul@heyse.io>"
SPDX-PackageDownloadLocation = "https://github.com/paul-heyse/pse-arrow"

[[annotations]]
path = ["vendor/paste/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "David Tolnay",
  "2026 Paul Heyse (pure invocation guard)",
]
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["vendor/pest_derive/**", "vendor/py_literal/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "pest and py_literal contributors (original notices retained)",
  "2026 Paul Heyse (pure invocation integration)",
]
SPDX-License-Identifier = "MIT OR Apache-2.0"

