# Copyright (c) 2026 Paul Heyse
#
# Rust checks run only when the maintainer dispatches this workflow.
#
# `deny` is advisory by decision, not by omission -- see ADR-0066 and
# docs/dev/dependency-policy.md. `family-check` is the manual check that carries the
# one-type-universe invariant `deny`'s `multiple-versions` used to stand in for.
#
# Conventions that apply to every workflow in this directory:
#   * `permissions: contents: read` at the top, widened only on the job that needs it.
#   * No `RUSTFLAGS` anywhere. Setting it would invalidate every cache and, worse,
#     `-C target-cpu` would change float results between a developer's machine and CI.
#   * Every `uses:` is pinned to a full commit SHA with the tag in a comment.
#   * Tool versions live in `env` so each one appears exactly once per workflow.
name: rust

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # The authored solver manifest synchronizes this immutable image reference.
  # Image compilation does not establish local user-systemd or scientific acceptance.
  SOLVER_IMAGE: ghcr.io/paul-heyse/pse-solvers:ci-2893f027e09f@sha256:cf6a21efa0728a9dfae55ac453445196bc2c0f4cb6775e62dafe1b0a688f5b95

jobs:
  # --- core checks -------------------------------------------------------------------
  fmt:
    name: rust / fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          tools: taplo
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: taplo fmt
        run: taplo fmt --check --diff

  clippy:
    name: rust / clippy
    runs-on: ubuntu-24.04
    # A literal, not ${{ env.SOLVER_IMAGE }}: the `env` context is not available in
    # `jobs.<job_id>.container`. Keep it in step with the SOLVER_IMAGE env above.
    container:
      image: ghcr.io/paul-heyse/pse-solvers:ci-2893f027e09f@sha256:cf6a21efa0728a9dfae55ac453445196bc2c0f4cb6775e62dafe1b0a688f5b95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy (default features)
        run: scripts/cargo-bin/cargo-pse-correctness clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (no default features)
        # Checks the no-default dependency graph. Native ABI link profiles are explicit
        # and qualify separately; this job does not establish solver availability.
        run: scripts/cargo-bin/cargo-pse-correctness clippy --workspace --all-targets --locked --no-default-features -- -D warnings

  identity-unit:
    name: rust / identity-unit
    runs-on: ubuntu-24.04
    # This pure owner has no store, native solver or user-systemd fixture.
    # Full native lifecycle/scientific journeys remain local/H-owned.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: identity-unit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pure identity units
        run: scripts/cargo-bin/cargo-pse-correctness test -p pse-ids --lib --locked
      - name: identity doctests
        run: scripts/cargo-bin/cargo-pse-correctness test -p pse-ids --doc --locked

  codegen-diff:
    name: rust / codegen-diff
    runs-on: ubuntu-24.04
    # Independent registry contracts/docs/Surreal projections require no runtime.
    # Physical/native-ABI and aggregate generation remain scope-end native checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: codegen
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: independent generated projections match their owners
        run: |
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- codegen --check --only rust-contracts
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- codegen --check --only docs
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- codegen --check --only surreal

  family-check:
    name: rust / family-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: one resolved version per pinned family
        # `cargo tree -d` cannot see a MIXED family (arrow 59 beside arrow-ipc 60), which
        # is the failure mode that matters here. This can.
        run: |
          # One --evidence per lockfile (clap takes one value each); families-only, because
          # the evidence lockfiles were resolved on their own day and unrelated transitive
          # crates drift by patch version without saying anything about the pins.
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- family-check \
            --evidence docs/capability-maps/evidence/rust/apisurface-Cargo.lock \
            --evidence docs/capability-maps/evidence/rust/support-Cargo.lock \
            --evidence-families-only
      - name: lockfile is complete and current
        run: cargo metadata --locked --format-version 1 > /dev/null

  # --- informational -----------------------------------------------------------------
  deny:
    name: rust / deny
    runs-on: ubuntu-24.04
    # Advisory since ADR-0066. No library and no licence is refused during phases 0-1;
    # this job reports what is in the graph when manually dispatched so the pre-release
    # review has something to read. `deny.toml` is the report's configuration, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: policy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          tools: |
            cargo-deny
            cargo-audit
      - name: cargo deny
        # advisories + licenses + bans + sources, all configured in deny.toml.
        run: cargo deny --all-features --locked check
      - name: cargo audit
        # .cargo/audit.toml carries the dated acceptances.
        run: cargo audit --deny warnings
      # The local hygiene bundle requires cargo shear; deps-report keeps the same
      # detector advisory for dependency investigation.

  docs:
    name: rust / docs
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/paul-heyse/pse-solvers:ci-2893f027e09f@sha256:cf6a21efa0728a9dfae55ac453445196bc2c0f4cb6775e62dafe1b0a688f5b95
    env:
      # The one place a *DOCFLAGS variable is set. This is not RUSTFLAGS: it does not
      # affect codegen and so cannot move a float result.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo doc
        run: cargo doc --no-deps --workspace --locked
      - name: upload rustdoc
        # `docs / build` copies this into the book when the artifact exists.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdoc
          path: target/doc
          if-no-files-found: error
          retention-days: 7

  doc-lint:
    name: rust / doc-lint
    runs-on: ubuntu-24.04
    # `cargo xtask doc-lint` exits 2 ("not implemented in phase 0") until the path indexes
    # under docs/capability-maps/facts exist (register row R-20). Informational until then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: report the phase-zero prerequisite
        id: availability
        run: |
          if compgen -G "docs/capability-maps/facts/*.paths.txt.zst" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::API doc lint is deferred under register R-20; no path indexes exist."
          fi
      - uses: ./.github/actions/setup-rust
        if: steps.availability.outputs.ready == 'true'
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: backticked paths in docs resolve
        if: steps.availability.outputs.ready == 'true'
        # Checks every `a::b::c` and [rustdoc:…] identifier in docs/** against the
        # committed path indexes. The deeper sweep is manually available in rust-scheduled.yml.
        run: scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- doc-lint

  msrv-floors:
    name: rust / dependency-floors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: locked dependency language floors
        # The repository's pinned nightly remains the compiler; no toolchain override.
        run: scripts/cargo-bin/cargo-pse-correctness test -p pse-tests-governance --test dependency_floors --locked
