# Copyright (c) 2026 Paul Heyse
#
# Cutting a release. Triggered only by pushing a signed `v*` tag on `main`, which the
# `tags` ruleset restricts to the maintainer.
#
# The order is deliberate and each step is a gate for the next:
#
#   version-gate -> wheels -> artifacts (+ PEP 740 attestations)
#     -> TestPyPI (environment `test-release`) -> smoke install from TestPyPI
#     -> PyPI (environment `release`, manual approval) -> GitHub Release
#
# Publishing is by OIDC trusted publishing: no API token exists in this repository, and
# the smoke install is what stands between a broken wheel and PyPI, which is immutable.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Never cancel a release in flight, and never run two for the same tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # PLACEHOLDER until the first solver image is pushed; see rust.yml for the full note.
  SOLVER_IMAGE: ghcr.io/paul-heyse/pse-solvers:ci-e84fdce84e2f@sha256:6fea124b830fbd233c30ec8a28d50f108c55cd2fa6e88c2391dc58e4aa7f3798
  UV_VERSION: 0.12.13
  UV_NO_PROGRESS: "1"
  DIST_NAME: pse-arrow

jobs:
  version-gate:
    name: version-gate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: release-gate
          # No cache write on a release path: a release run must not be able to poison
          # the cache that pull-request jobs read.
          cache: "false"
      - name: the tag, the crate, and the changelog agree
        id: gate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "tag ${TAG} -> version ${version}"

          crate_version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="pse-py"))')"

          if [ "${crate_version}" != "${version}" ]; then
            echo "::error::tag ${TAG} but crates/pse-py is version ${crate_version}."
            echo "::error::Run 'just release <version>' instead of tagging by hand: it bumps the single workspace version, regenerates the changelog, and tags."
            exit 1
          fi

          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' heading."
            echo "::error::Run 'just release ${version}' so git-cliff writes the section before tagging."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  wheels:
    name: wheels
    needs: [version-gate]
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read
    with:
      targets: all

  artifacts:
    name: artifacts
    needs: [version-gate, wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # PEP 740 attestations are signed with a workflow OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: collect every wheel and the sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - name: every distribution carries the tagged version
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          version = os.environ["VERSION"]
          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))

          if len(wheels) != 5:
              sys.exit(f"release: expected 5 wheels (one per target), found {len(wheels)}: "
                       + ", ".join(w.name for w in wheels))
          if len(sdists) != 1:
              sys.exit(f"release: expected exactly one sdist, found {len(sdists)}")

          problems = []
          for path in wheels + sdists:
              # pse_arrow-0.1.0-cp311-abi3-manylinux_2_28_x86_64.whl
              if f"-{version}-" not in path.name and f"-{version}.tar.gz" not in path.name:
                  problems.append(f"{path.name}: not version {version}")
          for path in wheels:
              if "cp311-abi3" not in path.name:
                  problems.append(f"{path.name}: not tagged cp311-abi3")
          if problems:
              sys.exit("release: distribution check failed:\n  " + "\n  ".join(problems))

          print(f"release: {len(wheels)} wheels + 1 sdist, all at {version}")
          for path in wheels + sdists:
              print("  ", path.name)
          PY
      - name: generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: dist/*
      - name: export the resolved environments
        # The exact dependency sets a consumer would get, attached to the release so a
        # reported bug can be reproduced against the resolution that shipped.
        run: |
          set -euo pipefail
          mkdir -p dist-metadata
          uv export --frozen --no-emit-project --extra pyomo \
            --output-file dist-metadata/requirements-platform.txt
          uv export --frozen --no-emit-project --extra pyomo --group parity --python 3.13 \
            --output-file dist-metadata/requirements-parity.txt
          cp Cargo.lock uv.lock dist-metadata/
          printf '%s\n' "${SOLVER_IMAGE}" > dist-metadata/solver-image.txt
      - name: capture BUILD_INFO.json from the shipped wheel
        # Read out of the artifact itself, not the checkout: this records the lockfile
        # hashes, rustc version, profile and git sha that the published extension was
        # actually built from. A test fails when the two disagree; this is the receipt.
        run: |
          set -euo pipefail
          uv venv .venv-buildinfo --python 3.11
          uv pip install --python .venv-buildinfo --no-cache dist/*manylinux*x86_64*.whl
          uv run --python .venv-buildinfo --no-project python -c "
          import msgspec
          import pse
          print(msgspec.json.format(msgspec.json.encode(pse.build_info())).decode())
          " > dist-metadata/BUILD_INFO.json
          cat dist-metadata/BUILD_INFO.json
      - name: upload the attested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-attested
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: upload the release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-metadata
          path: dist-metadata/
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: provenance
    needs: [artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-attested
          path: dist
      - name: build provenance for every distribution
        # Complements the PEP 740 attestations: this one is verifiable with `gh
        # attestation verify` straight from the GitHub Release, without PyPI.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  test-release:
    name: test-release
    needs: [version-gate, artifacts]
    runs-on: ubuntu-24.04
    environment:
      name: test-release
      url: https://test.pypi.org/project/pse-arrow/${{ needs.version-gate.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-attested
          path: dist
      - name: publish to TestPyPI
        # `--trusted-publishing always` fails loudly rather than falling back to asking
        # for a token that does not exist.
        run: uv publish --index testpypi --trusted-publishing always dist/*

  smoke:
    name: smoke
    needs: [version-gate, test-release]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: install from TestPyPI and import
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -uo pipefail
          uv venv .venv-smoke --python "${PYTHON_VERSION}"
          # TestPyPI's index takes a little while to show a fresh upload. Retry with a
          # growing wait rather than failing a release on a caching delay.
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --python .venv-smoke --no-cache \
                 --index "https://test.pypi.org/simple/" \
                 --extra-index-url "https://pypi.org/simple/" \
                 --index-strategy unsafe-best-match \
                 "${DIST_NAME}==${VERSION}"; then
              installed=1
              break
            fi
            echo "attempt ${attempt} failed; waiting before retry"
            sleep "$((attempt * 20))"
          done
          if [ "${installed}" -ne 1 ]; then
            echo "::error::${DIST_NAME}==${VERSION} could not be installed from TestPyPI."
            exit 1
          fi
          uv run --python .venv-smoke --no-project python -c "
          import json
          import pse
          info = pse.build_info()
          print(json.dumps({'version': pse.__version__, 'build': str(info)}, indent=2))
          assert pse.__version__ == '${VERSION}', pse.__version__
          "

  publish:
    name: publish
    needs: [version-gate, artifacts, provenance, smoke]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/pse-arrow/${{ needs.version-gate.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-attested
          path: dist
      - name: publish to PyPI
        # The point of no return: PyPI does not allow a filename to be re-uploaded.
        run: uv publish --trusted-publishing always dist/*

  github-release:
    name: github-release
    needs: [version-gate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-attested
          path: dist
      - name: fetch the release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-metadata
          path: dist-metadata
      - name: fetch the parity host probe if this release had one
        # Best effort: records which solver and IDAES versions the release was validated
        # against. Absent on a release cut without a parity run.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: parity-probe-host
          path: dist-metadata
      - name: extract this version's changelog section
        env:
          VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          body = match.group(1).strip() if match else "See CHANGELOG.md."
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY
      - name: create the GitHub Release
        # `gh release create` rather than a third-party action: it is already on the
        # runner, it needs no extra pin to review, and the failure modes are the ones
        # everyone already knows.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            dist/*.whl
            dist/*.tar.gz
            dist-metadata/Cargo.lock
            dist-metadata/uv.lock
            dist-metadata/requirements-platform.txt
            dist-metadata/requirements-parity.txt
            dist-metadata/solver-image.txt
            dist-metadata/BUILD_INFO.json
          )
          # probe_host.json is attached only when a parity run fed this release.
          if [ -f dist-metadata/probe_host.json ]; then
            assets+=(dist-metadata/probe_host.json)
          fi
          for asset in "${assets[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "::error::release asset missing: ${asset}"
              exit 1
            fi
          done

          prerelease=()
          case "${TAG}" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            "${assets[@]}"
