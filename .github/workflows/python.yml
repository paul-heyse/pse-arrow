#
# The Python pull-request gate: `python / lint`, `python / test`, `python / parity`.
#
# These are NOT required checks yet. A required check that never reports blocks every
# pull request forever, so they join the `main` ruleset only after they first report on
# a pull request — see .github/setup/README.md §4 and `ruleset-main-full.json`.
#
# `test` is an aggregating job over the interpreter matrix. A matrix leg's check name
# carries its matrix values (`python / test (3.11)`), so a matrix job can never be a
# single required context; `test-matrix` does the work and `test` is the context.
name: python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # PLACEHOLDER until the first solver image is pushed; see rust.yml for the full note.
  SOLVER_IMAGE: ghcr.io/paul-heyse/pse-solvers:ci-e84fdce84e2f@sha256:6fea124b830fbd233c30ec8a28d50f108c55cd2fa6e88c2391dc58e4aa7f3798
  UV_VERSION: 0.12.13
  # Never resolve or write the lockfile in CI. Every uv command here is `--locked`; this
  # makes an accidental omission fail instead of silently re-resolving.
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: python / lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: sync the quality group
        # `--no-install-project` keeps this job free of the Rust extension: linting must
        # not depend on a successful maturin build.
        run: uv sync --locked --group quality --no-install-project
      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: pyrefly
        run: uv run --no-sync pyrefly check
      - name: import boundaries
        # Enforces the layering in [tool.importlinter]: numpy and scipy only at the array
        # boundary, idaes only under pse.parity, contracts depending on nothing. The
        # project is not installed in this job (no Rust build); grimp only needs to find
        # the package on sys.path, so python/ is put there directly.
        env:
          PYTHONPATH: python
        run: uv run --no-sync lint-imports
      - name: reuse lint
        run: uv run --no-sync reuse lint
      - name: typos
        run: uv run --no-sync typos
      - name: taplo fmt
        run: uv run --no-sync taplo fmt --check --diff
      - name: uv.lock is current
        run: uv lock --check
      - name: generated Python contracts match their manifest
        # sha256 manifest over python/pse/contracts/. Fails on a hand edit; the fix is
        # `just codegen`, never an edit under contracts/.
        run: python3 scripts/check_generated.py

  test-matrix:
    name: python / test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The two ends of the supported range. 3.11 is the floor (abi3-py311) and 3.14 is
        # the platform interpreter from .python-version; the parity job covers 3.13.
        python-version: ["3.11", "3.14"]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: python-ext
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: sync the project and the test group
        # MATURIN_PEP517_ARGS builds the extension at the release profile: a debug
        # extension makes the suite crawl and hides nothing useful.
        env:
          MATURIN_PEP517_ARGS: --profile release
        run: |
          uv sync --locked --extra pyomo --group test --no-default-groups \
            --python "${{ matrix.python-version }}"
      - name: pytest
        # Parity items are deselected without --parity; performance items need
        # --performance. This job runs the always-on tiers only.
        run: |
          uv run --no-sync pytest -m "unit or component" -n auto \
            --cov --cov-report=xml --cov-report=term-missing
      - name: upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: python
          use_oidc: true
          fail_ci_if_error: false

  test:
    name: python / test
    # The single required context. It does no work: it exists because required status
    # checks cannot name a matrix leg.
    needs: [test-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: every interpreter passed
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          set -euo pipefail
          echo "test-matrix result: ${MATRIX_RESULT}"
          test "${MATRIX_RESULT}" = "success"

  # The Linux x86_64 wheel the parity job installs. Calling wheels.yml rather than
  # rebuilding here means parity tests exactly the artifact that would ship.
  wheel:
    name: python / wheel
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read
    with:
      targets: linux-x86_64

  parity:
    name: python / parity
    needs: [wheel]
    runs-on: ubuntu-24.04
    # The `ci` stage carries Ipopt 3.14.x + MUMPS + ASL and uv-managed CPython 3.11-3.13.
    # A literal, not ${{ env.SOLVER_IMAGE }} — see rust.yml.
    container:
      image: ghcr.io/paul-heyse/pse-solvers:ci-e84fdce84e2f@sha256:6fea124b830fbd233c30ec8a28d50f108c55cd2fa6e88c2391dc58e4aa7f3798
    env:
      # A separate environment: the parity group pins idaes-pse==2.12.0, which cannot
      # coexist with the platform interpreter (< 3.14 marker).
      UV_PROJECT_ENVIRONMENT: .venv-parity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the Linux x86_64 wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: sync the parity environment
        # 3.13 on pull requests; rust-scheduled.yml sweeps 3.11-3.13 weekly.
        run: |
          uv sync --locked --extra pyomo --group parity --python 3.13 \
            --no-install-project
      - name: install the built wheel
        # --no-deps: the pins come from uv.lock, not from the wheel's metadata, and this
        # guarantees the tested artifact is the one that was built, not a rebuild.
        run: uv pip install --python .venv-parity --no-deps dist/*.whl
      - name: parity suite
        # --parity turns the pre-flight from "skip" into "fail": the session fixture
        # asserts Python < 3.14, idaes 2.12.0, and ipopt 3.14.x on PATH before anything
        # else runs, and writes artifacts/probe_host.json.
        run: uv run --no-sync pytest --parity
      - name: upload the host probe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-probe-host
          path: artifacts/probe_host.json
          if-no-files-found: warn
          retention-days: 14
