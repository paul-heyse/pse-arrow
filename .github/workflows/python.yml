#
# Python checks run only when the maintainer dispatches this workflow.
#
# `test` aggregates the interpreter matrix for a single manual result.
name: python

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Immutable solver pin; synchronized by scripts/solver-images.py.
  SOLVER_IMAGE: ghcr.io/paul-heyse/pse-solvers:ci-2893f027e09f@sha256:cf6a21efa0728a9dfae55ac453445196bc2c0f4cb6775e62dafe1b0a688f5b95
  # Never resolve or write the lockfile in CI. Every uv command here is `--locked`; this
  # makes an accidental omission fail instead of silently re-resolving.
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: python / lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: sync the quality group
        # `--no-install-project` keeps this job free of the Rust extension: linting must
        # not depend on a successful maturin build.
        run: uv sync --locked --group quality --no-install-project
      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: pyrefly
        run: uv run --no-sync pyrefly check
      - name: import boundaries
        # Enforces the layering in [tool.importlinter]: numpy and scipy only at the array
        # boundary, idaes only under pse.parity, contracts depending on nothing. The
        # project is not installed in this job (no Rust build); grimp only needs to find
        # the package on sys.path, so python/ is put there directly.
        env:
          PYTHONPATH: python
        run: uv run --no-sync lint-imports
      - name: reuse lint
        run: uv run --no-sync reuse lint
      - name: typos
        run: uv run --no-sync typos
      - name: taplo fmt
        run: uv run --no-sync taplo fmt --check --diff
      - name: uv.lock is current
        run: uv lock --check
      - name: generated Python contracts match their manifest
        # sha256 manifest over python/pse/contracts/. Fails on a hand edit; the fix is
        # `just codegen`, never an edit under contracts/.
        run: python3 scripts/check_generated.py

  test-matrix:
    name: python / test (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The two ends of the supported range. 3.11 is the floor (abi3-py311) and 3.14 is
        # the platform interpreter from .python-version; `just parity` covers 3.13 locally.
        python-version: ["3.11", "3.14"]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Keep dev artifacts separate from the former release-profile cache.
          shared-key: python-ext-dev-${{ matrix.python-version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: sync the project and the test group
        # uv installs the project editably; pyproject.toml selects the dev profile.
        # Distribution/release compilation belongs to the manual wheels workflow.
        run: |
          uv sync --locked --group test --no-default-groups \
            --reinstall-package pse-arrow \
            --python "${{ matrix.python-version }}"
      - name: verify the development build profile
        run: uv run --no-sync python -c 'import pse; assert pse.build_info().profile == "debug", pse.build_info()'
      - name: pytest
        # Parity items are deselected without --parity; performance items need
        # --performance. This job runs the always-on tiers only.
        run: |
          just py-test \
            --cov --cov-report=xml --cov-report=term-missing
      - name: upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: python
          use_oidc: true
          fail_ci_if_error: false

  test:
    name: python / test
    # Aggregates the interpreter matrix for a single manual result.
    needs: [test-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: every interpreter passed
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          set -euo pipefail
          echo "test-matrix result: ${MATRIX_RESULT}"
          test "${MATRIX_RESULT}" = "success"
