# Optional repository governance checks, run only on manual dispatch.
name: governance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  adr-lint:
    name: governance / adr-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `adr.py lint` compares accepted records against origin/main to enforce
          # immutability, so it needs more than a shallow clone.
          fetch-depth: 0
      - name: decision records are well formed
        # File-name pattern, contiguous numbering, required §H keys, enum values,
        # DM-xx references, blueprint § anchors that resolve to real headings, review
        # paths that exist, symmetric supersession, and immutability of accepted ADRs.
        run: python3 scripts/adr.py lint
      - name: register rows are well formed
        run: python3 scripts/check_register.py --lint
      - name: the IDAES tag matches the parity pin
        # scripts/fetch-external.sh derives the idaes-pse tag from the parity pin in
        # pyproject.toml (and the arrow/datafusion tags from Cargo.lock); `--print` reports
        # them without cloning. If the derivation ever changes, this is where it shows.
        run: |
          set -euo pipefail
          pin="$(grep -oE 'idaes-pse==[0-9][0-9A-Za-z.-]*' pyproject.toml | head -n1 | cut -d= -f3)"
          [ -n "$pin" ] || { echo "::error::no idaes-pse== pin in pyproject.toml"; exit 1; }
          tag="$(scripts/fetch-external.sh --print | sed -n 's/^IDAES_TAG=//p')"
          [ "$pin" = "$tag" ] || {
            echo "::error::parity pin idaes-pse==${pin} but fetch-external.sh resolves ${tag}"
            exit 1
          }
          echo "idaes-pse parity pin and reading-copy tag agree at ${pin}"

  reuse:
    name: governance / reuse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every file has a licence
        # Two-line SPDX header on authored sources; REUSE.toml covers the file types
        # that cannot carry one (JSON, lockfiles, .github/**, docs/**).
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          args: lint

  agent-config:
    name: governance / agent-config (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install just (check_agent_config.py verifies recipe names against `just --summary`)
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: just@1.58.0
      - name: materialize native configuration
        run: python3 scripts/agent-config.py
      - name: agent configuration is canonical
        # .claude/ and .codex/ share content through symlinks in one direction only;
        # this fails when a copy has been made where a link belongs, or when AGENTS.md
        # and CLAUDE.md have drifted apart.
        run: |
          python3 scripts/check_agent_config.py
          python3 scripts/solver-images.py check
          python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
