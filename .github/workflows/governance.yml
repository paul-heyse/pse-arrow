# Native source/configuration checks on an externally owned hosted runner.
# Local Linux/user-systemd and assembled scientific qualification remain H-owned.
name: governance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  adr-lint:
    name: governance / adr-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Accepted-record immutability and register IDs consume original Git history.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: governance
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: decision records and index are current
        run: |
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- adr lint
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- adr index --check
      - name: register rows are well formed
        run: scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- register lint
      - name: independent IDAES reference tag matches its retained pin
        run: |
          set -euo pipefail
          pin="$(grep -oE 'idaes-pse==[0-9][0-9A-Za-z.-]*' pyproject.toml | head -n1 | cut -d= -f3)"
          [ -n "$pin" ] || { echo "::error::no idaes-pse reference pin in pyproject.toml"; exit 1; }
          tag="$(scripts/fetch-external.sh --print | sed -n 's/^IDAES_TAG=//p')"
          [ "$pin" = "$tag" ] || { echo "::error::IDAES reference pin and reading-copy tag differ"; exit 1; }

  reuse:
    name: governance / reuse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: governance
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: prepare the locked independent REUSE tool environment
        env:
          UV_PROJECT_ENVIRONMENT: .venv
        run: uv sync --locked --only-group quality --no-install-project
      - name: every Git-eligible source has a licence
        run: scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- reuse-lint

  agent-config:
    name: governance / agent-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: governance
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: just@1.58.0
      - name: materialize and check the shared role/skill aliases
        run: |
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- agent-config
          scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- agent-config-check
      - name: solver image projections are current
        run: scripts/cargo-bin/cargo-pse-correctness run -p xtask --bin xtask --no-default-features --locked -- solver-images check
      - name: native configuration controls
        run: scripts/cargo-bin/cargo-pse-correctness test -p xtask --lib --no-default-features --locked development::configuration::tests
