#
# The rules the repository applies to itself. `governance / adr-lint` and
# `governance / pr-title` are required checks; `reuse` and `agent-config` are not.
#
# Nothing here builds anything. These jobs are cheap on purpose, so that a decision
# record with a bad anchor or a pull request with an unconventional title fails in under
# a minute rather than behind a twenty-minute test run.
name: governance

on:
  pull_request:
    # `edited` and the label types matter: the title and the labels are the inputs, so
    # fixing either has to re-run the check rather than leaving a stale red mark.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  adr-lint:
    name: adr-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `adr.py lint` compares accepted records against origin/main to enforce
          # immutability, so it needs more than a shallow clone.
          fetch-depth: 0
      - name: decision records are well formed
        # File-name pattern, contiguous numbering, required §H keys, enum values,
        # DM-xx references, blueprint § anchors that resolve to real headings, review
        # paths that exist, symmetric supersession, and immutability of accepted ADRs.
        run: python3 scripts/adr.py lint
      - name: register rows are well formed
        run: python3 scripts/check_register.py --lint
      - name: the IDAES tag matches the parity pin
        # scripts/fetch-external.sh clones idaes-pse at a tag; [dependency-groups] parity
        # pins idaes-pse==X. If those two ever disagree, the parity harness is comparing
        # against one version while the reading copy shows another.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          fetch = pathlib.Path("scripts/fetch-external.sh").read_text(encoding="utf-8")

          pins = set(re.findall(r"idaes-pse\s*==\s*([0-9][0-9A-Za-z.\-]*)", pyproject))
          tags = set(re.findall(r"IDAES_TAG\s*=\s*[\"']?v?([0-9][0-9A-Za-z.\-]*)", fetch))

          if not pins:
              sys.exit(
                  "governance: no `idaes-pse==<version>` pin found in pyproject.toml.\n"
                  "  The parity pin is what 'parity' means; it must be declared in the "
                  "`parity` dependency group."
              )
          if len(pins) > 1:
              sys.exit(f"governance: conflicting idaes-pse pins in pyproject.toml: {sorted(pins)}")
          if not tags:
              sys.exit(
                  "governance: no `IDAES_TAG=` assignment found in scripts/fetch-external.sh.\n"
                  "  The reading copy must be pinned to the same version as the parity pin."
              )
          if len(tags) > 1:
              sys.exit(f"governance: conflicting IDAES_TAG values in fetch-external.sh: {sorted(tags)}")

          pin, tag = pins.pop(), tags.pop()
          if pin != tag:
              sys.exit(
                  f"governance: parity pin idaes-pse=={pin} but fetch-external.sh clones {tag}.\n"
                  "  Moving the parity pin means moving both, in the same pull request, "
                  "with an ADR (GOVERNANCE.md §5)."
              )
          print(f"governance: idaes-pse parity pin and reading-copy tag agree at {pin}")
          PY
      - name: decision labels are consistent
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Through env, never interpolated into the script: a pull-request title is
          # attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          labels=",${PR_LABELS},"

          fail() { echo "::error::$*"; exit 1; }

          # 1. `needs-adr` means a decision is still owed. It blocks the merge by design;
          #    the fix is to write the ADR, or to argue the label off in review.
          case "${labels}" in
            *,needs-adr,*)
              fail "This pull request is labeled 'needs-adr': a decision must be recorded before it can merge (CONTRIBUTING.md §4)." ;;
          esac

          # 2. Touching a decision record requires the `adr` label and the title form,
          #    because that is what makes the decision auditable (GOVERNANCE.md §2).
          changed_adrs="$(git diff --name-only "${BASE_SHA}" HEAD -- 'docs/adr/[0-9][0-9][0-9][0-9]-*.md' || true)"
          if [ -n "${changed_adrs}" ]; then
            echo "decision records touched:"
            echo "${changed_adrs}"
            case "${labels}" in
              *,adr,*) ;;
              *) fail "This pull request changes a decision record but is not labeled 'adr' (GOVERNANCE.md §2, the decision-PR rule)." ;;
            esac
            if ! printf '%s' "${PR_TITLE}" | grep -qE '^adr: ADR-[0-9]{4} .+'; then
              fail "A decision pull request must be titled 'adr: ADR-NNNN <title>'. Got: ${PR_TITLE}"
            fi
          fi

          # 3. The `adr` label without a decision record is the mirror-image mistake.
          case "${labels}" in
            *,adr,*)
              if [ -z "${changed_adrs}" ]; then
                fail "This pull request is labeled 'adr' but changes no docs/adr/NNNN-*.md record."
              fi ;;
          esac

          echo "governance: decision labels and title are consistent"

  pr-title:
    name: pr-title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: the squash title is a Conventional Commit
        # Merges are squash-only with the commit title taken from the pull-request title,
        # so THIS string is what git-cliff files in the changelog. The type list is the
        # same one in cliff.toml's commit_parsers; keep the two in step.
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            deps
            adr
            design
          # Scopes are free-form crate or area short names, so they are neither required
          # nor validated against a list.
          requireScope: false
          # Lower-case subject, no trailing period — except the `ADR-NNNN` form, which is
          # a citation and keeps its capitals.
          subjectPattern: '^(?:ADR-\d{4} .+|[a-z0-9].*[^.\s])$'
          subjectPatternError: |
            The subject "{subject}" of "{title}" is not in the expected form.
            Start lower-case and do not end with a period, for example:
              feat(relations): reject nullable extension arrays at the boundary
            An ADR pull request keeps its citation capitals:
              adr: ADR-0042 spill policy for the inference engine
          validateSingleCommit: false

  reuse:
    name: reuse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every file has a licence
        # Two-line SPDX header on authored sources; REUSE.toml covers the file types
        # that cannot carry one (JSON, lockfiles, .github/**, docs/**).
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        with:
          args: lint

  agent-config:
    name: agent-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: agent configuration is canonical
        # .claude/ and .codex/ share content through symlinks in one direction only;
        # this fails when a copy has been made where a link belongs, or when AGENTS.md
        # and CLAUDE.md have drifted apart.
        run: python3 scripts/check_agent_config.py
