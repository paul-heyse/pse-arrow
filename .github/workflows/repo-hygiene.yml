#
# Lints for the repository's own plumbing: spelling, TOML formatting, the workflows
# themselves, and every shell script.
#
# Run these checks manually when reviewing repository plumbing. `zizmor` is a security lint on the workflows: a
# finding here is about what a pull request from a fork could make CI do.
name: repo-hygiene

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  typos:
    name: typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: spelling
        # Configured by typos.toml, which holds the domain vocabulary (Ipopt, MUMPS,
        # DataFusion …). A false positive is fixed there, never by a nolint.
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  taplo:
    name: taplo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: taplo
      - name: TOML formatting
        run: taplo fmt --check --diff
      - name: TOML validity
        run: taplo lint

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          # actionlint shells out to shellcheck for every `run:` block; without it the
          # most valuable half of the check silently does nothing.
          tool: shellcheck
      - name: fetch actionlint
        # The upstream tool's installer owns its release selection.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-connrefused \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" --version
      - name: lint the workflows
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # zizmor's online audits resolve action references; the read-only job token is
      # enough and no secret is involved.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor
      # zizmor owns hash-pinning and reference/version consistency audits.
      # Human version comments remain review policy; no duplicate inline parser.
      - name: audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows .github/actions

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: shellcheck
      - name: lint shell scripts outside skill bundles
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            git ls-files -z '*.sh' '.envrc' \
              ':(exclude).codex/skills/**' \
              ':(exclude).claude/skills/**' \
              ':(exclude).agents/skills/**' | tr '\0' '\n' | sort
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts found"
            exit 0
          fi
          printf 'checking:\n'
          printf '  %s\n' "${scripts[@]}"
          shellcheck --severity=style --color=always "${scripts[@]}"
