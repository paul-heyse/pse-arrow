#
# Dependabot configuration. Two rules shape all of it:
#
#  1. A dependency *family* moves as a unit. Dependencies float under carets and the
#     committed Cargo.lock (ADR-0159); the arrow, datafusion, object_store and pyo3
#     families and the codegen generators (syn, prettyplease) stay `=`-pinned in
#     [workspace.dependencies], and a partial move produces a mixed family that
#     `cargo tree -d` cannot see. The groups below exist so that `cargo xtask family-check`
#     either passes for the whole group or fails loudly. A pull request that moves part of a
#     group is closed, not merged (GOVERNANCE.md §5). Dependabot and `just upgrade` propose
#     the same lock moves; either route is fine.
#
#  2. `commit-message.prefix: deps` makes every Dependabot title a Conventional Commit,
#     so git-cliff files it under "Dependencies" (`deps` is a type in cliff.toml).
#
# Renovate is the documented fallback if these groups prove too coarse (register row).

version: 2

updates:
  # --- Rust ---------------------------------------------------------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Cargo supports `auto` and `lockfile-only`; `increase` is rejected by GitHub.
    # `lockfile-only`: requirements are carets, so updates move Cargo.lock, never the
    # manifest (ADR-0159). Every proposed update still has to pass the reasoned-pin
    # (`dependency_pins`) and family (`family-check`) gates.
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - kind/library-upgrade
      - area/tooling
    commit-message:
      prefix: deps
      include: scope
    groups:
      arrow-family:
        patterns:
          - "arrow"
          - "arrow-*"
          - "parquet"
          - "parquet-*"
      datafusion-family:
        patterns:
          - "datafusion"
          - "datafusion-*"
          - "object_store"
      pyo3-family:
        patterns:
          - "pyo3"
          - "pyo3-*"
          - "numpy"
      # A codegen bump changes generated output, so the pull request must also carry the
      # regeneration commit; `rust / codegen-diff` fails otherwise.
      codegen:
        patterns:
          - "syn"
          - "quote"
          - "proc-macro2"
          - "prettyplease"
      numerics:
        patterns:
          - "num-dual"
          - "faer"
          - "faer-*"
          - "petgraph"
          - "diffsol"
          - "feos"
          - "feos-*"
          - "egglog"

  # --- Python -------------------------------------------------------------------------
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - kind/library-upgrade
      - area/python-boundary
    commit-message:
      prefix: deps
      include: scope
    ignore:
      # The parity pin. It is the definition of what "parity" means and moves only by
      # ADR, with the tag in scripts/fetch-external.sh and the tolerances moved with it
      # (GOVERNANCE.md §5). Dependabot must never touch it.
      - dependency-name: "idaes-pse"
    groups:
      runtime:
        patterns:
          - "pyarrow"
          - "attrs"
          - "cattrs"
          - "msgspec"
          - "pyomo"
          - "pint"
          - "numpy"
          - "scipy"
      quality-tools:
        patterns:
          - "ruff"
          - "pyrefly"
          - "import-linter"
          - "reuse"
          - "taplo"
          - "typos"
          - "pre-commit"
          - "maturin"
          - "pytest"
          - "pytest-*"

  # --- GitHub Actions -----------------------------------------------------------------
  # Every `uses:` is pinned by commit SHA with a version comment; Dependabot moves the
  # SHA and the comment together. `pinact` in repo-hygiene catches anything that drifts
  # back to a tag.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area/ci
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # --- Solver container base image ----------------------------------------------------
  # Only the base image is tracked here; Ipopt, MUMPS and ASL are built from pinned
  # source tarballs verified against docker/solvers/checksums.sha256, and moving one of
  # those is an ADR because parity trajectories depend on the solver build.
  - package-ecosystem: docker
    directory: "/docker/solvers"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - area/ci
      - area/numerics-solvers
    commit-message:
      prefix: deps
      include: scope
