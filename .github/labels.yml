#
# The declared label set. `just labels-sync` (scripts/labels-sync.sh) applies it with
# `gh label create --force`, which is idempotent: it creates a label or updates its
# colour and description in place. The script never deletes, so a label removed from
# this file survives on the repository until someone removes it deliberately.
#
# FORMAT IS LOAD-BEARING. scripts/labels-sync.sh parses this file with a strict
# stdlib-only parser (no PyYAML on the critical path), so every entry must be exactly
# three lines in this order and nothing else:
#
#   - name: "<name>"
#     color: "<6 hex digits, no leading #>"
#     description: "<one line, at most 100 characters — GitHub's limit>"
#
# Comments and blank lines between entries are fine. Anything else is a hard error.
#
# Conventions: `kind/*` says what a thing is (exactly one per issue), `area/*` says where
# it lives (as many as apply), `phase/*` says when it is scheduled. The unprefixed labels
# are process signals that CI and GOVERNANCE.md refer to by name — `adr`, `needs-review`,
# `needs-adr`, `register`, and `release` all have behaviour attached, so renaming one
# means updating the workflows too.

# --- kind: what this is -------------------------------------------------------------
- name: "kind/bug"
  color: "d73a4a"
  description: "Behaviour differs from the blueprint, the docs, or a test"
- name: "kind/feature"
  color: "0e8a16"
  description: "New capability within an already accepted decision"
- name: "kind/design-decision"
  color: "5319e7"
  description: "Needs a decision recorded as an ADR before code lands"
- name: "kind/parity-gap"
  color: "b60205"
  description: "Disagreement with idaes-pse 2.12.0 inside the parity envelope"
- name: "kind/library-upgrade"
  color: "1d76db"
  description: "Move a pinned dependency or a whole dependency family"
- name: "kind/docs"
  color: "0075ca"
  description: "Documentation, the mdBook site, or the doc lint"
- name: "kind/chore"
  color: "cfd3d7"
  description: "Maintenance with no behaviour change"
- name: "kind/governance"
  color: "6f42c1"
  description: "Process, roles, rulesets, or repository configuration"

