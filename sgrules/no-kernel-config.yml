id: no-kernel-config
language: Rust
severity: error
message: "A kernel is a function of its explicit inputs, not engine session settings."
files: ["crates/pse-kernels/src/**/*.rs"]
rule:
  pattern: $RECEIVER.config_options($$$ARGS)
