id: identify-not-assert-units
language: Python
severity: error
message: "Use identify_inconsistent_units, not assert_units_consistent."
note: |
  assert_units_consistent raises on the first inconsistency and says nothing
  about which components are involved, so a diagnostic built on it cannot name
  the rows and spans a finding is required to carry.
  identify_inconsistent_units returns the offending components, which is what a
  finding is a projection of (blueprint §21.2, §23.2).
files:
  - "python/**/*.py"
rule:
  any:
    - pattern: assert_units_consistent($$$ARGS)
    - pattern: $RECEIVER.assert_units_consistent($$$ARGS)
