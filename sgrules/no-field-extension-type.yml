id: no-field-extension-type
language: Rust
severity: error
message: "Field::extension_type panics; use try_extension_type."
note: |
  `Field::extension_type()` is the panicking variant: it unwraps the metadata
  parse. The generated `try_from(&RecordBatch)` calls `try_extension_type::<E>()`
  on every extension column precisely so that a malformed or unexpected metadata
  payload becomes a typed contract violation instead of a panic
  (blueprint §4.4, §24.1).
files:
  - "crates/**/*.rs"
  - "tests/**/*.rs"
  - "xtask/**/*.rs"
  - "benches/**/*.rs"
rule:
  any:
    - pattern: $RECEIVER.extension_type()
    - pattern: $RECEIVER.extension_type::<$TYPE>()
