# Copyright (c) 2026 Paul Heyse
# Dependency REPORT for the pse-arrow workspace (blueprint §3.1 "Supply chain", §3.3.2).
#
# This file is no longer an admission gate. During phases 0-1 no library and no licence
# is refused: `rust / deny` runs but does not block, and `just ci-pr` does not call it.
# What this configuration still does is TELL YOU what is in the graph, so the licensing
# and supply-chain review that has to happen before the first published release costs a
# command rather than a rebuild (ADR-0066, register row R-31).
#
# Run it with `just deps-report` (advisory, always exits 0) or `just policy` (strict,
# exits non-zero on a finding -- the deliberate pre-release audit).
#
# Every `ignore` and `exception` entry still carries a reason and a `# owner, review
# YYYY-MM-DD` comment. An entry with no expiry is a permanent silent exception.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Reported, never blocking. A known advisory is worth seeing on the pull request; it is
# not worth stopping a phase-0 branch that is trying to make the platform work.
yanked = "warn"
# A deprecation encoded only in semver build metadata (serde_yaml's) is invisible to
# cargo audit; this is the check that sees it. `all` widens it past direct dependencies.
unmaintained = "all"
ignore = [
  # paste 1.0.15 (proc-macro; unmaintained, no vulnerability). Transitive via the
  # arrow/datafusion families; leaves the graph when upstream drops it. The same dated
  # acceptance is in `.cargo/audit.toml` for cargo-audit.
  "RUSTSEC-2024-0436", # paul-heyse, review 2027-03-01
]

[licenses]
# NOT an allowlist. This records the licences a future licensing review has already
# looked at, so the report can say "here is one nobody has considered yet" instead of
# drowning in the ordinary. An unlisted licence is a prompt to look, never a refusal --
# nothing here blocks a merge.
#
# Our own code stays MIT OR Apache-2.0. Note for the pre-release audit: a copyleft
# dependency linked into a distributed artifact can affect what that dual licence means
# for what we ship. That is the question R-31 exists to ask, at a point where the answer
# can be acted on.
allow = [
  # Permissive.
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "NCSA",
  "Unlicense",
  "WTFPL",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # Weak copyleft.
  "MPL-2.0",
  "EPL-2.0",
  "CDDL-1.0",
  "LGPL-2.1",
  "LGPL-3.0",
  # Strong copyleft. Eligible like everything else; the linking question is R-31's.
  "GPL-2.0",
  "GPL-3.0",
  "AGPL-3.0",
]
# cargo-deny's default. The old 0.93 was tuned for a gate; a report would rather read a
# slightly unusual expression than refuse to name it.
confidence-threshold = 0.8
unused-allowed-license = "allow"
# libbz2-rs-sys declares the (permissive, BSD-like) bzip2 licence under a non-SPDX id. It
# reaches the graph only through DataFusion's default `compression` feature and is a leaf.
exceptions = [
  { crate = "libbz2-rs-sys", allow = [
    "bzip2-1.0.6",
  ] }, # paul-heyse, review 2027-03-01
]
private = { ignore = true }

[bans]
# `multiple-versions` is deliberately NOT "deny". The rule it was standing in for is the
# one type universe -- exactly one resolved arrow / parquet / object_store / datafusion /
# pyo3 -- and `cargo xtask family-check` asserts that directly, by family, with a clearer
# message, and is still a required check. Denying every duplicate meant a hand-maintained
# `skip` list of hashers, allocators and proc-macro plumbing that blocked ordinary library
# additions while saying nothing about the hazard it was named for.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Known hazards, not prohibitions (ADR-0066; blueprint §3.3.2).
#
# These crates were banned outright. None is banned now -- use one if it gets the platform
# working. Three of them encode a SEMANTIC trap rather than hygiene, so read the reason
# before reaching for them:
#
#   datafusion-spark   arithmetic that differs silently from ours (blueprint §3.3)
#   parquet-variant    a typed hole in decision D1 (blueprint §3.3)
#   parquet_derive     inverts the registry -> Rust generation direction (blueprint §3.3)
#
# The remaining seven were hygiene or scope calls that no longer bind:
#
#   serde_yaml         unmaintained; serde-saphyr replaces it (ADR-0021)
#   uom                no kernel needs compile-time unit typing; its SI system cannot
#                      express the currency dimension (ADR-0026)
#   arrow-flight       had no consumer (ADR-0026; revised by ADR-0065)
#   arrow-avro         had no consumer (ADR-0065)
#   arrow-pyarrow      needs a Python interpreter at build time, which breaks the offline
#                      build; pyo3-arrow is the chosen boundary (ADR-0024)
#   salsa              deferred with a trigger, register R-01 (ADR-0042)
#   openssl-sys        no TLS stack in the engine; object_store is local-only in phases 0-1
deny = []

[[bans.features]]
# cargo-deny 0.20 takes the version in the `crate` spec, not a separate `version` key
# (a bare `version = ` here is rejected as an unexpected key and the whole config fails
# to load). The spec form is equivalent and keeps the ban pinned to the §3.1 version.
# This is feature/pin discipline, not admission: it keeps the resolved DataFusion equal
# to the one the capability maps were extracted against.
crate = "datafusion@=55.1.0"
deny = ["serde", "avro", "parquet_encryption", "backtrace"]
reason = "blueprint §3.1: default features only"

[sources]
unknown-registry = "deny"
# A crate that only exists on GitHub is usable. The lockfile still pins the exact revision,
# so reproducibility is unaffected.
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
