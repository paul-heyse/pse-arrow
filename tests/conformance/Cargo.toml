[package]
name = "pse-tests-conformance"
description = "Library composition and native boundary conformance controls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# A test family is never published.
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
force-validate = [
  "pse-admission/force-validate",
  "pse-columnar/force-validate",
  "pse-engine/force-validate",
  "pse-operations/force-validate",
  "pse-relations/force-validate",
  "pse-runtime/force-validate",
  "pse-schema/force-validate",
]
native-acceptance = ["pse-runtime/native-solvers", "dep:faer", "dep:clarabel"]
native-profiles = [
  "dep:highs",
  "dep:highs-sys",
  "dep:clarabel",
  "dep:sundials-sys",
  "dep:diffsol",
]

[dependencies]
faer = { workspace = true, optional = true }
highs = { workspace = true, optional = true }
highs-sys = { workspace = true, optional = true }
clarabel = { workspace = true, optional = true }
sundials-sys = { workspace = true, optional = true }
diffsol = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
pse-diagnostics.workspace = true
pse-admission.workspace = true
pse-runtime.workspace = true
pse-operations = { workspace = true, features = ["test-support"] }
pse-modeling.workspace = true
pse-authoring.workspace = true
pse-compiler.workspace = true
pse-structural.workspace = true
pse-backend-native.workspace = true
pse-engine.workspace = true
pse-math.workspace = true
pse-model.workspace = true
pse-kernels.workspace = true
pse-columnar.workspace = true
pse-ids.workspace = true
pse-schema.workspace = true
pse-relations = { workspace = true, features = ["test-support"] }
pse-quantity = { workspace = true, features = ["fixtures"] }
parquet.workspace = true
datafusion.workspace = true
tokio.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true

# Shared tests/support/{plan14,workflow_runtime}.rs and the native scientific-input
# fixture supply these actual uses.
# cargo-shear path-module limitation: https://github.com/Boshen/cargo-shear/issues/589
[package.metadata.cargo-shear]
ignored = [
  "pse-admission",
  "pse-engine",
  "pse-operations",
  "pse-schema",
  "serde",
  "tempfile",
]
