# Entries in `[workspace.dependencies]` that are deliberately absent from blueprint §3.1.
#
# §3.1 pins what the PLATFORM is built out of; these are what the repository is TESTED and
# DRIVEN with. They never appear in a shipped dependency graph (dev-dependencies, the
# `xtask` driver, or build-dependencies of the -sys crate), so listing them in the
# blueprint would imply a runtime commitment that does not exist. They are still `=`-pinned
# in the workspace manifest and still moved by a `kind/library-upgrade` PR.
#
# `pins_match_blueprint` exempts exactly these names and nothing else.

[[dep]]
name = "proptest"
reason = "dev-dependency: property tests over generated expressions (blueprint §24.1 \"Canonicalization\")"

[[dep]]
name = "insta"
reason = "dev-dependency: snapshot assertions for rendered diagnostics and plans"

[[dep]]
name = "criterion"
reason = "dev-dependency of pse-benches only; the §24.3 performance groups"

[[dep]]
name = "tempfile"
reason = "dev-dependency: object-store and artifact-store lifecycle tests need a scratch root"

[[dep]]
name = "tracing-subscriber"
reason = "dev-dependency: captures spans in tests; the library crates emit and never subscribe (blueprint §23.1)"

[[dep]]
name = "cargo_metadata"
reason = "xtask and pse-tests-governance: reads the resolved graph for family-check, blake3_owner and dependency_floors"

[[dep]]
name = "clap"
reason = "xtask only: the `cargo xtask` command surface"

[[dep]]
name = "regex"
reason = "xtask and pse-tests-governance: the regex layer of the §24.1 governance greps"

[[dep]]
name = "ignore"
reason = "xtask and pse-tests-governance: gitignore-aware source walking"

[[dep]]
name = "bindgen"
reason = "build-time generator for pse-ipopt-sys, run by `cargo xtask codegen --only bindgen` inside the solver container; the output is committed (blueprint §3.1)"

[[dep]]
name = "pkg-config"
reason = "build-dependency of pse-ipopt-sys: locates Ipopt >= 3.14 (blueprint §18.3)"

[[dep]]
name = "semver"
reason = "xtask and pse-tests-governance: compares family versions and declared rust-version floors"

[[dep]]
name = "anyhow"
reason = "xtask only, and the one crate that opts out of clippy's disallowed-types ban; every pse-* crate returns a concrete thiserror enum (blueprint §23.2)"
