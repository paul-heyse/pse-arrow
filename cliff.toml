# git-cliff 2.14.1 configuration — https://git-cliff.org/docs/configuration
#
# The changelog is generated from the Conventional-Commit *squash titles* on `main`
# (merges are squash-only, so one commit == one pull request == one changelog line).
# The `commit_parsers` type list below is the same list `governance / pr-title` enforces
# on pull-request titles; keep the two in step. Scopes are free-form (crate or area short
# names) and are rendered but never validated.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by [git-cliff](https://git-cliff.org) from the Conventional-Commit
squash titles on `main` (`cliff.toml` holds the section mapping). Do not hand-edit
released sections; `just release <version>` regenerates them.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
  # A bare `(#123)` left by the squash merge becomes a link to that pull request.
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/paul-heyse/pse-arrow/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "newest"
tag_pattern = "v[0-9]*"

commit_preprocessors = [
  # Trailing whitespace from a squash title would otherwise show up in the entry.
  { pattern = '[ \t]+$', replace = "" },
]

# Ordering is by the `<!-- N -->` prefix, which `striptags` removes before rendering.
commit_parsers = [
  # Skips first: `commit_parsers` is first-match-wins, so `^chore(release)` has to be
  # tested before the `^chore` catch-all below.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^adr", group = "<!-- 4 -->Decisions" },
  { message = "^design", group = "<!-- 4 -->Decisions" },
  { message = "^deps", group = "<!-- 5 -->Dependencies" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^test", group = "<!-- 7 -->Internal" },
  { message = "^build", group = "<!-- 7 -->Internal" },
  { message = "^ci", group = "<!-- 7 -->Internal" },
  { message = "^chore", group = "<!-- 7 -->Internal" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
