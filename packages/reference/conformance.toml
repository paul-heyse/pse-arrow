#
# The reference conformance set: every authored fixture of the seed closure, run once by
# `just seed-conformance`. These are the run's execution settings; a fixture that needs
# another backend, presolve, derivative inspection or allowance declares it in its own
# `policy { ... }` clause. Package roots are relative to this file.

[settings]
memory_limit_bytes = 137438953472 # 128 GiB pool
math_worker_bytes = 17179869184 # 16 GiB aggregate case worker capacity
threads = 16
# Sixteen active workers plus sixteen idle session owners during staged preparation.
# The CPU semaphore still limits executing native work to sixteen cores.
math_jobs = 32
time_limit_seconds = 600
intent = "root"
presolve = "auto"
maximum_fixtures = 1024
maximum_checks = 100000
derivative_cells = 1000000
derivative_step = 1e-6
derivative_tolerance = 1e-4
# Numerical diagnostic thresholds for fixtures that expect diagnostic findings.
diagnostics = "diagnostics/idaes-2.13.json"

# Complete campaign preparation policy; work units do not enlarge byte reservations.
[settings.preparation.compiler]
class_proof_work = 100000000

[settings.preparation.compiler.optimization]
# Independent fixtures share the sixteen runtime CPU permits; each optimizer uses one.
cores = 1
horner_iterations = 10
cpe_iterations = 10

[settings.preparation.compiler.assembly]
contributions = 1000000
native_index = 2147483647
worker_bytes = 17179869184

[settings.preparation.compiler.evaluation]
derivative_components = 1000000
operations = 100000000
scratch_bytes = 4294967296
provider_calls = 1000000

[settings.preparation.limits]
depth = 64
items = 1000000
members = 1000000
body_occurrences = 16777216
body_slots = 65536

# campaign depends on seed-data, process, thermodynamics, methods, domain and physical, so
# one native run discovers every campaign, seed and physical fixture exactly once.
[[runs]]
name = "seed"
package = "campaign"
dependencies = ["data/oracles/teqp-0.23.1", "data/oracles/feos-0.10.1", "data/gross-sadowski-2001", "data/references", "data/nist", "data/perry7", "data/poling2000", "data/oracles/idaes-2.13", "data/species", "data/ciaaw", "seed-data", "process", "thermodynamics", "methods", "domain", "physical"]
physical = "physical"
execution = "native"

# The domain schema's pure fixtures over synthetic data. They live in their own distribution
# so that no production closure admits their synthetic elements, species and groups; the
# physical fixtures this closure also discovers run again here.
[[runs]]
name = "domain"
package = "domain-fixtures"
dependencies = ["domain", "physical"]
physical = "physical"
execution = "pure"
